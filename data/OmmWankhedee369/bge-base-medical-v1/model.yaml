- source_sentence: 'Represent this sentence for searching relevant passages: Are susceptibility for and clinical manifestations
    of rheumatoid arthritis associated with polymorphisms of the TNF-alpha , IL-1beta , and IL-1Ra genes?'
  sentences:
  - Bronchial muscle relaxation.
  - 'L4-L5. Ans. (d) L4-L5Ref: Maheshwari 5th ed. / 253* Most common site of spinal disc herniation: Lumbar region (95% in
    L4-L5 or L5-S1).* The second most common site is the cervical region (C5-C6, C6-C7).* Thoracic region accounts for only
    0.15% to 4.0% of cases.* Herniations usually occur posterolaterally, where the annulus fibrosis is relatively thin and
    is not reinforced by the posterior or anterior longitudinal ligament.* In the cervical spinal cord, a symptomatic posterolateral
    herniation between two vertebrae will impinge on the nerve which exits the spinal canal between those two vertebrae on
    that side. For example, a right posterolateral herniation of the disc between vertebrae C5 and C6 will impinge on the
    right C6 spinal nerve.'
  - 'To analyze the association of genetic polymorphisms of pro-inflammatory cytokines with rheumatoid arthritis (RA) in comparison
    with healthy controls from Northern Sweden and the potential contribution of these genetic variants for disease severity
    and development of cardiovascular complications. Polymerase chain reaction amplification was used for analysis of TaqI
    restriction fragment length polymorphism (RFLP) of interleukin-1 beta (IL-1beta), variable tandem repeat polymorphism
    of IL-I receptor antagonist (IL-1Ra) gene and NcoI RFLP at position -308 of tumor necrosis factor-alpha (TNF-alpha) gene.
    One hundred and fifty-four patients with RA, 42 men and 112 women, were consecutively recruited into the study through
    the Department of Rheumatology. The allele A1 of TNF-alpha was more common in the patient group (p < 0.01; OR = 1.62).
    Patients having the genotype A1A2 seemed to develop more severe disease compared with patients with A1A1 genotype: they
    were younger at disease onset (p < 0.05), had a higher accumulated disease activity (p < 0.05) and worse functional class
    (p < 0.05). Patients with genotype A2A2 of IL- 1beta had higher accumulated disease activity score than patients with
    A1A1 and A1A2 (p < 0.05). The allelic combination Al IL-1beta/A2 IL-1Ra was less prevalent in RA patients who developed
    cardiovascular complications (p < 0.005; OR = 0.20).'
