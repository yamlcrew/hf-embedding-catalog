- source_sentence: 'Represent this sentence for searching relevant passages: Does sixteen-slice multi-detector computed tomographic
    angiography improve the accuracy of screening for blunt cerebrovascular injury?'
  sentences:
  - This paper sets out to analyse the use of the Six Sigma methodology to improve quality in healthcare. It looks at how
    Six Sigma grew out of the concept of Total Quality Management (TQM). Six Sigma is a quality improvement methodology that
    has been widely adopted by companies since the early 1990s and has grown exponentially in the healthcare industry during
    the past five years. Some of the main tenets of Six Sigma have emerged from the principles of TQM, including the notion
    that the entire organization must support the quality effort; that there should be a vigorous education effort; and that
    a quality improvement process should emphasize root cause analysis. In spite of its early success, TQM "crashed and burned"
    for several reasons including the fact that financial benefits were difficult to assign to TQM efforts, root cause was
    not always determined resulting in recurring errors, there was no common metric to measure the level of quality attained,
    and quality efforts were sometimes aimed at processes or operations that were not critical to the customer. Six Sigma
    filled the vacuums created by these TQM failures in several ways. Under the Six Sigma methodology, quality improvement
    projects are carefully defined so that they can be successfully completed within a relatively short time frame. Financials
    are applied to each completed project so that management knows how much the project saves the institution.
  - 'Mandible. (D) Mandible # FRACTURES OF MAXILLA: They are classified into 3 types.> Le Fort I (transverse) fracture runs
    ab and parallel to the palate. It cross lower part of nasal septum, maxillary antra and the pterygoid plates.> Le Fort
    II (pyramidal) fracture through the root of nose, lacrimal bone, floor of orbit, upper part of maxillary sinus and pterygoid
    plates.> This fracture has some features common with the zygomatic fractures.> Le Fort III (craniofacial dysfunction):
    There is complete separation of facial bones from the cranial bones. The fracture line passes through root of nose, ethmofrontal
    junction, superior orbital fissure, lateral wall of orbit, frontozygomatic and temporozygomatic sutures and the upper
    part of pterygoid plates.> Mandibular fractures are not a part of Le Fort classification.'
  - Blunt cerebrovascular injuries (BCVI) are rare but potentially devastating injuries, particularly if the diagnosis is
    delayed. Only four-vessel cerebral angiography (FVCA) has been shown to be adequately sensitive and specific as a screening
    tool for BCVI but is resource-intensive and invasive. Computed tomography (CT) angiography has emerged as a possible alternative,
    but its accuracy has been poor, particularly for low-grade injuries. Recent advances in CT technology, particularly the
    use of a multi-detector array for image acquisition should improve the accuracy of this technique. This study is the first
    reported experience of the role of the 16-slice multi- detector CT scanner in screening for BCVI. From January 2, 2003
    to October 31, 2004, all patients who met predefined screening criteria were screened for blunt injury to the carotid
    (BCI) and vertebral (BVI) arteries with a 16-slice multi-detector CT scanner with angiographic reconstruction (CTA). If
    CTA was positive or equivocal for BCVI, FVCA was performed as a confirmatory test. If CTA was negative, no further diagnostic
    studies were performed. There were 435 patients who met criteria and were screened with CTA. Of these, 25 injuries were
    identified in 24 patients for an incidence of BCVI of 1.2% (24/2023) among all blunt admissions (BTA) and 5.5% (24/435)
    among screened patients (SP). This was increased compared with the four-slice era (0.38% BTA, 2.4% SP, p<0.01). No patient
    with a negative CTA was subsequently identified as having, or developed neurologic symptoms attributable to a missed BCVI.
