  sentences:
  - 'Allen test. Allen''s test: to assess the aerial blood supply of the hand A - Both radial & ulnar aery are occluded; B
    - Ulnar aery kept occluded, Radial aery released Water hammer test- to detect water hammer pulse in aoic regurgitation
    Trendelenburg test- to detect weakness of hip abductors'
  - The clinical efficacy of short-acting β(2)-agonists administered before performing daily activities in chronic obstructive
    pulmonary disease (COPD) is unclear. The aim of this study was to investigate the clinical effect of supplementary inhaled
    procaterol hydrochloride in patients with COPD. Thirty outpatients with moderate to severe COPD (Stage II-IV) regularly
    using inhaled tiotropium bromide alone and with dyspnea during daily activities were enrolled. Subjects self-administered
    20 μg of inhaled procaterol before daily activities no more than four times daily. Dyspnea symptom scores, St George's
    Respiratory Questionnaire (SGRQ) activity domains, impulse oscillometry system parameters, and pulmonary function tests
    were recorded at the beginning and end of the 2-week study. At baseline, more than 80% of subjects reported dyspnea when
    walking up a slope (100.0%), climbing stairs (100.0%), gardening (93.3%), walking on flat ground (90.0%), bathing (86.7%),
    getting on a bus or train (83.3%), and changing clothes (80.0%). After 2 weeks, subjects with Stage III symptoms had significantly
    improved dyspnea scores on walking up a slope (P = 0.047), climbing stairs (P = 0.014), gardening (P = 0.034), walking
    on flat ground (P = 0.006), getting on a bus or train (P = 0.039), and changing clothes (P = 0.045). Both symptom and
    activity SGRQ domains improved significantly in subjects with Stage III symptoms (P = 0.036 and P = 0.028, respectively).
    Resistance of small airways and low-frequency reactance area values improved significantly in subjects with Stage III
    symptoms (P = 0.003 and P = 0.004, respectively). No significant changes were found in pulmonary function tests.
  - Nonviral vectors based on polyethylenimine (PEI) usually contain an excess of PEI that is not complexed to DNA. Since
    unbound PEI contributes to cellular and systemic toxicity, purification of polyplexes from unbound PEI is desirable. Size
    exclusion chromatography (SEC) was used to purify PEI polyplexes of free PEI. Transfection properties of purified polyplexes
    and the effect of free PEI on gene delivery were studied in vitro and in vivo after systemic application into mice. SEC
    did not change the size and zeta-potential of polyplexes. Independent of the amount of PEI used for complex formation,
    purified PEI polyplexes had the same final PEI nitrogen/DNA phosphate ratio of 2.5. Notably, purified PEI polyplexes demonstrated
    low cellular and systemic toxicity. High transfection efficiency was achieved with purified polyplexes at high DNA concentrations
    (8-15 microg/ml). At low DNA concentrations (2-4 microg/ml) gene transfer with purified particles was less efficient than
    with polyplexes containing free PEI both in vitro and in vivo. Mechanistic studies showed that free PEI partly blocked
    cellular association of DNA complexes but was essential for the following intracellular gene delivery. Adding free PEI
    to cells treated with purified particles with a delay of up to 4 h resulted in significantly enhanced transfection efficiency
    compared with non-purified particles or purified particles without free PEI.
