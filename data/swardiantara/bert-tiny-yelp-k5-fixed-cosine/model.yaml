    please check it out.
- source_sentence: Everytime I eat at this location I end up with a sick stomach.  I don't have that problem at other Arby's.  The
    dining area is clean and everything else seems ok but I always get a sick stomach.  Maybe they should relook at their
    food prep.
  sentences:
  - WOW.... So I received a coupon in the mail for a buy one get one buffet, so me and the BF decided to go out and try it.
    Well, we walk in on a Sunday night and that might have been our first mistake. All of the food seemed like it had been
    sitting there since lunch time. It was old, and cold, and honestly, we were both worried about getting sick afterward.
    The place was empty, and our server still left our drinks empty and dirty plates on the table.\n\nPeople were PILING on
    the crab legs, and so I gave them a try... overcooked and watery. The \"clarified butter\" next to it was margarine, and
    honestly, I walked away thanking GOD that we didn't pay full price. I think McDonalds would have been a better choice.
  - 'Let me start by saying I have no idea about the food here, it could be amazing and knock my socks off, but I will not
    be back to find out.\n\nWe came here on a Saturday night and it was annoying.  The service was decent, the drinks pretty
    strong....that''s all that I can say in the good arena here.  \n\nThe atmosphere is boring and uninspired, the decor blah
    and the clientele douchey. (if that''s even a word)  Prime example: a 45 year old guy in an Affliction shirt with a sparkly
    peace sign on the back...what?!  There have to be better places to hang out in Scottsdale.'
  - Came here on the reccommendation of a friend and thought I'd give it a try based on the reviews on here. Don't be fooled
    people! This place is nice and fancy and pricey and that's about it.\n\nThe food is expensive with small portions. The
    sushi rolls were okay, had to order a lot just to feel semi full. The only thing that was good was the lobster roll and
    the sparkling sake that our waiter suggested we try.\n\nSushi in Vegas in general is a big rip off in my opinon, at least
    on The Strip.
