- source_sentence: I wish I could return a haircut.\n\nUnfortunately Kelly, Melissa, and Jen were not there so I settled for
    whoever was free at the time. \n\nWorst trim of my life:\nshe cut off over an inch more than just the dead/split ends\nshe
    did not cut the hair how I described initially\nshe did not change the cut to how I repeated during the cut when I noticed
    she was cutting it straight across instead of curving it in the back, which does NOT mix well with my curly hair\nafter
    retelling her how I wanted it cut, she compared this tragedy to deaths of family/friends and how I should get over it\nthe
    beautiful long layers I had and wanted again are now choppy, medium layers\nmy left side is even choppier than the right
    side of my hair\nI fear straightening my hair to make this unevenness less evident\n\nI regret tipping her because I understand
    how the service industry works because my minimum tip of 20% for all service people is undeserved for her lack of work.\n\nI
    want everyone to know how the only good hair stylists there are Kelly (who moved to Philly), Melissa and Jen. If they
    are not available, do NOT risk going.\n\nAlso, the Supercuts Oakland location is horrible at waxing eyebrows unless you
    are lucky to get the only woman of color there.\n\nWhile it was a $20 cut (after the 20% tip), I know had to buy biotin
    to grow my hair faster so it is more expensive to me in the end. I hope this proves helpful to all perspective customers!
  sentences:
  - Video link at bottom review. Worst service I have ever had. I am 22 years old I don't want to be treated with any disrespect
    because I wear a hat. I have lived here for 5 days and new to the area they will really short with me had an a problem
    because I did not understand there menu and had to ask for a menu. No help at all. So on top if the bad service the pizza
    was horrible. I called Enzo back (the owner) to say I was unhappy with the pizza and service and her swore and yelled
    on the phone. So I went in to talk to him and he swore at me in person telling me to f****n leave. Only wanted to pay
    me back for half the price. Worst place I have been to here in the area. I have a video of him yelling at me.  He refused
    to give me his name and wanted to hear nothing I had to say.  http://www.youtube.com/watch?v=Kuq5w_GpZTo&feature=youtu.be
    please check it out.
  - After a long night of clubbing, we were up for some breakfast at 4am.  While hailing a taxi cab, our attendant convinced
    us to go to this place (instead of another we had in mind).  Big Joe told us it was the best place to get some steak and
    eggs.  Well Big Joe, you were wrong.\n\nGranted, the food was decent.  The eggs weren't dry, and with a little salt and
    pepper, it made it just right.  Potato pieces always a plus.  I ordered my steak medium rare, which usually let's my meat
    be just the right texture - not too dry, and not too bloody.  Well, my meat was a bit on the dry side, so one can only
    imagine if I had even fathomed to order my meat well done.\n\nThen again, you get what you pay for.\n\nMy main complaint
    about this place was the service we received.  After a long wait to get our food (maybe I'm too used to the fast service
    I get in California?), we finished our food, and waited for the check.  I guess I'm used to getting the check before I'm
    done eating.  But we waited.  And waited....................... AND WAITED.\n\nWe tried asking the hostess for the check,
    but she just rudely stated she didn't know who our server was, and she simply couldn't help us.  From what I could see,
    there were only two servers at the time, so how hard was it to figure it out.  If the first one said no, THEN ASK THE
    OTHER!  And yes, we did try to get our waiter's attention.  Luck had it that he was serving two large groups.\n\nHowever,
    that is not an excuse for a good 30 minute long wait (or at least what felt like 30 minutes) for our check.\n\nReady to
    go to sleep, exhausted from a night of clubbing and suffering from a food coma,  we decided to do the right thing and
    leave money on the table before we left.  Yes, that's right, we never got our check.  At least we had the decency to leave
    money for our meal.  I know we could've just walked out and left, but we took the high road.\n\nWell, except for leaving
    this one star review that is.
  - Will not come back. Food is average but the service is terrible. \n\nThe Pho is not impressive but OK and their egg rolls
    are made from refrigerated product with some unrecognizable stuff inside!!\n\nThe service is among the worst I've ever
    experienced. The waitress/owner gave a face like a stone and didn't even say a word when taking our order. The only one
    word we got there was a \"Thanks\" when she bring the check.... Since we were the only Asian customers there and all others
    were getting normal service, I may have to establish an assumption that the way you are treated is correlated to your
    looking. Unbelievable!
- source_sentence: I went to a yelp event here, where we were able to make a fused glass piece and also watch some demonstrations
    and go to the gallery. Everything in the gallery was amazing. The demonstrations were neat, and the fused glass was something
    I would go back to do again.\n\nI really didn't know that the glass center was open most of the time, and if you go there
    on any random day, you can watch whatever is going on. I think that is pretty cool! They also have classes where you can
    blow glass or make beads or whatever you want... I can't wait to pick up my piece and come back for another class!
  sentences:
  - I love Mexican food and I always look for new places. Although I prefer the more formal restaurants, some of the faster-service
    places are pretty good.  Someone recommended Fausto's to me so I gave it a try.  Let me tell you, you get a lot of food
    for your money!  There's enough for two people in those entrees. And there are many entrees to choose from.  Service can
    be a tad slow, and the place was hot inside the day I was there.  \n\nThe restaurant is kind of small but it's big enough
    for a large group to get together when several tables are pulled together (as was happening the day I was there). There's
    not a lot of room by the counter to wait for your order if you are doing takeout, though. Overall, the food is tasty enough-
    it wasn't great, but it wasn't bad.
  - The cheesecake is definitely the best part of this place. The food is average fare, and there are so many things to choose
    from it's a bit overwhelming. VERY over-priced too. Had to laugh at their new \"skinylicious\" menu. I mean, it's good
    they have one, but it still made me giggle. Who goes to Cheesecake Factory to watch their calorie intake?  I had a pomegranate
    mojito that was wonderful. The steak and salmon combo was also good, but they give you a half-gallon tub of mashed potatoes
    and three- yes THREE- asparagus spears. What's wrong with that picture?  Our waitress Samantha, however, was awesome!
    So if you get her you'll have a great time!
  - OMG, DELICIOUS!\nMy husband and I were in Vegas for a friend's graduation and I needed to come here. I'm pretty sure this
    place was on TV. We actually drove totally out of our way on the way to the actual graduation, and after a big brunch,
    just to have some custard. \nThey have a variety of custard flavors, which change daily, and a variety of toppings to
    put on. You can make up your own combo or pick from the board. They also do a standard size unless you tell them you want
    something else. \nWe ordered the Western Sundae and goggled it up in the car within five minutes. The custard is thick
    and creamy and the toppings were good. They did skimp on the hot fudge sauce, but I'm not even mad because everything
    else was so good.
- source_sentence: 'I was in need of a pedicure before my beach vacation, so I decided to stop in to Star Nails in Bellevue.
    I''ve never had a pedicure before, mostly because I''m super-ticklish, but I felt like it was about time.\n\nThe salon
    looks quite nice inside; wood (well, laminate) floors, clean decor, and four pedicure chairs up on the platform on the
    right. I didn''t have an appointment, and waited about ten minutes on a Wednesday evening.\n\nNancy was my nail technician,
    and she greeted me warmly and helped me over into the pedicure area. Pro tip: Don''t wear a past-knee-length skirt, as
    it can make straddling the foot bath to get into the chair slightly awkward. Nancy helped me out like a pro and I was
    all set.\n\nThe pedicure chairs have a massage feature that reminded me of the Migun massage tables. They don''t just
    vibrate; they knead. The controller is right next to you, so you can stop and start as you like. I just made sure the
    thing kept running the whole time. The foot bath was nice and warm. I''d brought a book to keep myself busy but turns
    out all my attention was occupied by relaxing.\n\nNancy guided me through the steps and the slight language barrier isn''t
    much of a problem. She completely understood that I was super-ticklish from the flinching involved, and somehow managed
    to be very careful about it. It wasn''t at all unpleasant, which is what I''d kind of expected.\n\nThis is the awful TMI
    section, so avert your ayes if you are at all sensitive. Since I''ve never had a pedicure and I tend to walk around either
    barefoot or in thin-soled shoes, I had quite a lot of callus built up. The removal was kind of disgusting, so I just didn''t
    look, but it didn''t hurt at all. I also tend to ingrown toenails on both big toes, and she dealt with them gently and
    quickly. I was a bit concerned about having that done at a salon, but it''s a week later and my toes haven''t turned gangrene,
    so all''s well that ends well.\nEND TMI\n\nEven though it wasn''t the spa pedicure (not sure what else THAT involves),
    I got a full foot and calf massage. Polish on and all done! At which point I thought I might as well get a manicure, too.\n\nThe
    manicure involved heated mitts and a hand massage, and was very nice. Total cost was $37 plus tip (I gave her $10 for
    having to deal with my nasty feet). I had some fun conversations with other patrons, and overall a great experience. I''d
    go back once a day if it were in any way reasonable to do so, but this is getting placed on the once-a-month schedule
    for sure.\n\nThe polish from the pedicure is still holding up like a champ after a week. The manicure was pretty well
    shot after a couple of days, so I''ll probably just stick with doing the polish at home, although I can''t complain about
    the massage and cuticle care.\n\nAgain, I don''t have other salons or spas to compare with, but it seemed like a good,
    basic service with a few little extras. The staff were all friendly and remembered the repeat customers who came in. They
    do take credit cards, and you can put the tip on the card as well; I brought cash for that as I am not used to salons
    taking tips on cards.\n\nThey also offer acrylics (which I don''t do), gel nails (which I''d like to try), and nail art.
    I''m not sure if they do waxing. I am sure that it''s a friendly place, that it''s clean (important!), and that they made
    me feel relaxed even though I was beyond nervous going in.'
  sentences:
  - We went here because they have a gluten-free menu.  While the menu is gluten-free, it's not particularly healthy and is
    full of dairy and fried foods.  There were a few healthier options and I picked the salmon. It was alright. My biggest
    complaint is that the salad that comes with the entree came covered in croutons.  The waiter knew I ordered from the gluten-free
    menu but wasn't paying much attention to the details.  Oh well.  I didn't drink the beer but my friend that did said it
    was good.
  - I was REALLY looking forward to this... I was.  I got super excited when I saw the restaraunt.com coupons out there for
    them and even plotted a time that I figured they wouldn't be too busy so that I could sneak in with my family and get
    a nice dinner.  \nSo we show up at 530p on Saturday and the place was absolutely empty.  Sat down and were promptly waited
    upon.  Made my selection of the tenderloin at the top of the menu and my wife had the butternut squash (she's nutso for
    squash).  Waiter arrives about 5 minutes later with HUGE biscuits with honey.  Great!!  It went downhill from there.\nWhen
    the entrees arrived, all I can say is HOLY &%^$, those are huge portions.  But what they make up for in volume is the
    huge blandness and poor flavoring.  The tenderloin had an orangish/brown sauce that had zero redeeming value and it was
    rather thick and gloppy.  There was melted cheese in the mashed potatoes that was like a nasty skin.  The tenderloin was
    a little overcooked.  My wife said her squash had no real interesting flavor, just seemed baked and the risotto inside
    was just very average.  However, we did have enough to take home to feed a small family.\nNice people, huge portions,
    but nothing really great.
  - Hmm, PURE nightclub. You hear about this place all the time. Whether it's on TMZ.com or Access Hollywood, this place gets
    a lot of buzz. When I went went here, it was with me and a couple of good friends of mine. We waited roughly 1 hour to
    get in. Probably the first and last time I'll spend that long to get into a club. I honestly had no idea what the place
    was going to be like, so upon entering I was amazed at the very pretty interior they had.\n\nThere's a bunch of white
    curtains and crap decorating the place. There's an elevated VIP section straight ahead when you walk in and you're flanked
    by two bars. This place is also connected to the Pussycat Dolls lounge which opens up later on in the night and acts as
    an extension. An elevator leads you upstairs to where there are a bunch of VIP tables and another bar. The dance floor
    outside overlooks the strip. That night, the DJ was playing some pretty hot trance so I was digging it up there.\n\nI
    had a decent time with me and my friends there. There are a good amount of downsides, but mainly because I think it was
    the night that we went. I mean, as with any club, it can be hit or miss. First off, it took about ~150 bucks for each
    one of us to get loose. 450 bucks for 3 people! Ridiculous! The very attractive bartender upstairs messed up our order
    but my friend still proceeded to tip her generously. (Hey dude you're tipping her a lot of money! ..... I don't give a
    f**k, she's f**king hot!) haha. Also, there was quite a bit of testosterone rolling through the night we went.\n\nI'd
    visit this place again, but I'd keep my expectations low again in hopes of being surprised.
- source_sentence: This is easily one of the best Giant Eagles I've ever been to. Huge. Very nice selection. Easily comparable
    to Whole Foods. Went to their cheese market, and was pleasantly surprised with the selection. I got Beemster Vlaskas,
    an amazing Gouda. Very large parking lot.
  sentences:
  - I just started enjoying this great restaurant in January of 2014 and couldn't be more pleased. The food is always delicious
    and the service is spectacular. I mostly call ahead and pick up the order, but have never had to wait for my food upon
    arrival. Oh, and the prices are pretty darn good too! Do yourself a favor and check this place out.
  - This place is AWESOME! Everything was fantastic, from the cute waitress, to the friendly cooks. I ordered the Coconut
    Chicken with naan, dal, salad, biryani rice and yogurt sauce. My goodness, they really hooked it up. They will make your
    dish as spicy or mild as you like. The crispy and soft naan is something to experience. Even the condiments were delicious!
    We will only be in Scottsdale for two more days and we are definitely going back tomorrow. The price is very reasonable
    for the portion size.
  - Video link at bottom review. Worst service I have ever had. I am 22 years old I don't want to be treated with any disrespect
