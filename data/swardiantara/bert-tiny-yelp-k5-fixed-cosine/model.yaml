      turns out all my attention was occupied by relaxing.\n\nNancy guided me through the steps and the slight language barrier
      isn''t much of a problem. She completely understood that I was super-ticklish from the flinching involved, and somehow
      managed to be very careful about it. It wasn''t at all unpleasant, which is what I''d kind of expected.\n\nThis is the
      awful TMI section, so avert your ayes if you are at all sensitive. Since I''ve never had a pedicure and I tend to walk
      around either barefoot or in thin-soled shoes, I had quite a lot of callus built up. The removal was kind of disgusting,
      so I just didn''t look, but it didn''t hurt at all. I also tend to ingrown toenails on both big toes, and she dealt
      with them gently and quickly. I was a bit concerned about having that done at a salon, but it''s a week later and my
      toes haven''t turned gangrene, so all''s well that ends well.\nEND TMI\n\nEven though it wasn''t the spa pedicure (not
      sure what else THAT involves), I got a full foot and calf massage. Polish on and all done! At which point I thought
      I might as well get a manicure, too.\n\nThe manicure involved heated mitts and a hand massage, and was very nice. Total
      cost was $37 plus tip (I gave her $10 for having to deal with my nasty feet). I had some fun conversations with other
      patrons, and overall a great experience. I''d go back once a day if it were in any way reasonable to do so, but this
      is getting placed on the once-a-month schedule for sure.\n\nThe polish from the pedicure is still holding up like a
      champ after a week. The manicure was pretty well shot after a couple of days, so I''ll probably just stick with doing
      the polish at home, although I can''t complain about the massage and cuticle care.\n\nAgain, I don''t have other salons
      or spas to compare with, but it seemed like a good, basic service with a few little extras. The staff were all friendly
      and remembered the repeat customers who came in. They do take credit cards, and you can put the tip on the card as well;
      I brought cash for that as I am not used to salons taking tips on cards.\n\nThey also offer acrylics (which I don''t
      do), gel nails (which I''d like to try), and nail art. I''m not sure if they do waxing. I am sure that it''s a friendly
      place, that it''s clean (important!), and that they made me feel relaxed even though I was beyond nervous going in.'
    sentences:
    - We went here because they have a gluten-free menu.  While the menu is gluten-free, it's not particularly healthy and
      is full of dairy and fried foods.  There were a few healthier options and I picked the salmon. It was alright. My biggest
      complaint is that the salad that comes with the entree came covered in croutons.  The waiter knew I ordered from the
      gluten-free menu but wasn't paying much attention to the details.  Oh well.  I didn't drink the beer but my friend that
      did said it was good.
    - I was REALLY looking forward to this... I was.  I got super excited when I saw the restaraunt.com coupons out there
      for them and even plotted a time that I figured they wouldn't be too busy so that I could sneak in with my family and
      get a nice dinner.  \nSo we show up at 530p on Saturday and the place was absolutely empty.  Sat down and were promptly
      waited upon.  Made my selection of the tenderloin at the top of the menu and my wife had the butternut squash (she's
      nutso for squash).  Waiter arrives about 5 minutes later with HUGE biscuits with honey.  Great!!  It went downhill from
      there.\nWhen the entrees arrived, all I can say is HOLY &%^$, those are huge portions.  But what they make up for in
      volume is the huge blandness and poor flavoring.  The tenderloin had an orangish/brown sauce that had zero redeeming
      value and it was rather thick and gloppy.  There was melted cheese in the mashed potatoes that was like a nasty skin.  The
      tenderloin was a little overcooked.  My wife said her squash had no real interesting flavor, just seemed baked and the
      risotto inside was just very average.  However, we did have enough to take home to feed a small family.\nNice people,
      huge portions, but nothing really great.
    - Hmm, PURE nightclub. You hear about this place all the time. Whether it's on TMZ.com or Access Hollywood, this place
      gets a lot of buzz. When I went went here, it was with me and a couple of good friends of mine. We waited roughly 1
      hour to get in. Probably the first and last time I'll spend that long to get into a club. I honestly had no idea what
      the place was going to be like, so upon entering I was amazed at the very pretty interior they had.\n\nThere's a bunch
      of white curtains and crap decorating the place. There's an elevated VIP section straight ahead when you walk in and
      you're flanked by two bars. This place is also connected to the Pussycat Dolls lounge which opens up later on in the
      night and acts as an extension. An elevator leads you upstairs to where there are a bunch of VIP tables and another
      bar. The dance floor outside overlooks the strip. That night, the DJ was playing some pretty hot trance so I was digging
      it up there.\n\nI had a decent time with me and my friends there. There are a good amount of downsides, but mainly because
      I think it was the night that we went. I mean, as with any club, it can be hit or miss. First off, it took about ~150
      bucks for each one of us to get loose. 450 bucks for 3 people! Ridiculous! The very attractive bartender upstairs messed
      up our order but my friend still proceeded to tip her generously. (Hey dude you're tipping her a lot of money! .....
      I don't give a f**k, she's f**king hot!) haha. Also, there was quite a bit of testosterone rolling through the night
      we went.\n\nI'd visit this place again, but I'd keep my expectations low again in hopes of being surprised.
  - source_sentence: This is easily one of the best Giant Eagles I've ever been to. Huge. Very nice selection. Easily comparable
      to Whole Foods. Went to their cheese market, and was pleasantly surprised with the selection. I got Beemster Vlaskas,
      an amazing Gouda. Very large parking lot.
    sentences:
    - I just started enjoying this great restaurant in January of 2014 and couldn't be more pleased. The food is always delicious
      and the service is spectacular. I mostly call ahead and pick up the order, but have never had to wait for my food upon
      arrival. Oh, and the prices are pretty darn good too! Do yourself a favor and check this place out.
    - This place is AWESOME! Everything was fantastic, from the cute waitress, to the friendly cooks. I ordered the Coconut
      Chicken with naan, dal, salad, biryani rice and yogurt sauce. My goodness, they really hooked it up. They will make
      your dish as spicy or mild as you like. The crispy and soft naan is something to experience. Even the condiments were
      delicious! We will only be in Scottsdale for two more days and we are definitely going back tomorrow. The price is very
      reasonable for the portion size.
    - Video link at bottom review. Worst service I have ever had. I am 22 years old I don't want to be treated with any disrespect
      because I wear a hat. I have lived here for 5 days and new to the area they will really short with me had an a problem
      because I did not understand there menu and had to ask for a menu. No help at all. So on top if the bad service the
      pizza was horrible. I called Enzo back (the owner) to say I was unhappy with the pizza and service and her swore and
      yelled on the phone. So I went in to talk to him and he swore at me in person telling me to f****n leave. Only wanted
      to pay me back for half the price. Worst place I have been to here in the area. I have a video of him yelling at me.  He
      refused to give me his name and wanted to hear nothing I had to say.  http://www.youtube.com/watch?v=Kuq5w_GpZTo&feature=youtu.be
      please check it out.
  - source_sentence: Everytime I eat at this location I end up with a sick stomach.  I don't have that problem at other Arby's.  The
      dining area is clean and everything else seems ok but I always get a sick stomach.  Maybe they should relook at their
      food prep.
    sentences:
    - WOW.... So I received a coupon in the mail for a buy one get one buffet, so me and the BF decided to go out and try
      it. Well, we walk in on a Sunday night and that might have been our first mistake. All of the food seemed like it had
      been sitting there since lunch time. It was old, and cold, and honestly, we were both worried about getting sick afterward.
      The place was empty, and our server still left our drinks empty and dirty plates on the table.\n\nPeople were PILING
      on the crab legs, and so I gave them a try... overcooked and watery. The \"clarified butter\" next to it was margarine,
      and honestly, I walked away thanking GOD that we didn't pay full price. I think McDonalds would have been a better choice.
    - 'Let me start by saying I have no idea about the food here, it could be amazing and knock my socks off, but I will not
      be back to find out.\n\nWe came here on a Saturday night and it was annoying.  The service was decent, the drinks pretty
      strong....that''s all that I can say in the good arena here.  \n\nThe atmosphere is boring and uninspired, the decor
      blah and the clientele douchey. (if that''s even a word)  Prime example: a 45 year old guy in an Affliction shirt with
      a sparkly peace sign on the back...what?!  There have to be better places to hang out in Scottsdale.'
    - Came here on the reccommendation of a friend and thought I'd give it a try based on the reviews on here. Don't be fooled
      people! This place is nice and fancy and pricey and that's about it.\n\nThe food is expensive with small portions. The
      sushi rolls were okay, had to order a lot just to feel semi full. The only thing that was good was the lobster roll
      and the sparkling sake that our waiter suggested we try.\n\nSushi in Vegas in general is a big rip off in my opinon,
      at least on The Strip.
