widgetData:
- source_sentence: The product was faulty and seller offered refund and asked that I take down my previous bad review. It's
    been 2 weeks and I still haven't seen a refund. The diffuser worked fine for about a month (long enough to be out of the
    return policy) then stopped. Not worth the $40
  sentences:
  - I love that this holds a lot of water. The color is nice and the handle is convenient. However, it seems to be pretty
    poor quality. A piece of mine broke off before I even got to use it once
  - I love that this holds a lot of water. The color is nice and the handle is convenient. However, it seems to be pretty
    poor quality. A piece of mine broke off before I even got to use it once
  - I have alopecia and I’m constantly buying wigs, this wig feels so soft and the color is great. Only thing I would say
    could be better is the quality but other than that it’s good for the price.
- source_sentence: This product is a piece of shit. Do not buy. Doesn't work, and then I try to call for customer support,
    it won't take my number. Fucking rip off!
  sentences:
  - The magnetic closure works great. The openings for the credit cards/ID is small so it is hard to get them in and out.
    I think once the leather loosens up a bit this will become easier. The color is beautiful.
  - Clip broke putting it on my pants that could be upgraded. Also the kickstand is week broke it shortly after . The case
    and class are great for the price.
  - Clip broke putting it on my pants that could be upgraded. Also the kickstand is week broke it shortly after . The case
    and class are great for the price.
- source_sentence: I never got my item even though it said delivered.
  sentences:
  - Cute and seems to be good quality.
  - I was happy to find this piece to replace on my broken Shark. Price was good and had it in a few days. When I installed
    it however, I was no longer satisfied. It wouldn't stay attached and kept popping of with any pull on the handle. Returned
    the same day it areived.
  - Seems to protect well, feels nice, just wish it would stick a bit better. The first one would not stay applied. Kept peeling
    from the top no matter what I did. I figured it could be my error, so I removed and cleaned the screen very well with
    additional alcohol wipes. The second one has been on a few days, but is starting to peel from a different spot. I love
    the feel of the protector otherwise.
- source_sentence: Absolutely horrible. Fingerprints, face prints, smudgy and impossible to use in sunlight! Literally cannot
    see screen. Want my money back, and going to go find the one i used before!
  sentences:
  - Works as it should, and not bad price for two.
  - These are cute but a little smaller than I was expecting. They are very lightweight and comfortable to wear. They were
    just thrown in the box with other items and the posts got bent in shipping so not sure how long they'll last.
  - So far, good product for the price.
- source_sentence: Arrived broken. Manufacturer defect. Two of the legs of the base were not completely formed, so there was
    no way to insert the casters. I unpackaged the entire chair and hardware before noticing this. So, I'll spend twice the
    amount of time boxing up the whole useless thing and send it back with a 1-star review of part of a chair I never got
    to sit in. I will go so far as to include a picture of what their injection molding and quality assurance process missed
    though. I will be hesitant to buy again. It makes me wonder if there aren't missing structures and supports that don't
    impede the assembly process.
  sentences:
  - I like the design of the bag, though it came a little crumpled up. Hoping everything smoothes out with use. Also very
    upset that I paid more for this bag and my key chain was never sent.
  - Had to return. This unit is tiny and very cheap quality.
  - I bought these plates because I liked the way they looked. They are good enough for a single use but do not hold up too
    well with multiple uses. Once they are put in the microwave they start to crack quite easily.
