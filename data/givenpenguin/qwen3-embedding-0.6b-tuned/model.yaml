    - "Процедура СписокВыборПослеВыбораРежимаРедактирования(Результат, ПараметрыВыполнения)\n\t\n\tРезультатОткрыть = \"Открыть\"\
      ;\n\tРезультатРедактировать = \"Редактировать\";\n\tРезультатОткрытьКарточку = \"ОткрытьКарточку\";\n\t\n\tЕсли Результат\
      \ = РезультатРедактировать Тогда\n\t\tОбработчик = Новый ОписаниеОповещения(\"СписокВыборПослеРедактированияФайла\"\
      , \n\t\t\tЭтотОбъект, ПараметрыВыполнения);\n\t\tРаботаСФайламиКлиент.РедактироватьФайл(Обработчик, ПараметрыВыполнения.ДанныеФайла);\n\
      \tИначеЕсли Результат = РезультатОткрыть Тогда\n\t\tРаботаСФайламиКлиент.ОткрытьФайлСОповещением(Неопределено, \n\t\t\
      \tПараметрыВыполнения.ДанныеФайла, УникальныйИдентификатор); \n\tИначеЕсли Результат = РезультатОткрытьКарточку Тогда\n\
      \t\tПоказатьЗначение(, ПараметрыВыполнения.ДанныеФайла.Ссылка);\n\tКонецЕсли;\n\t\nКонецПроцедуры"
    - "Функция СлучайноеЧислоБезИспользованияГенератора(\n\t\tМинимум, Максимум, СчетчикГСЧ = 0, ВспомогательныйВызов = Ложь)\n\
      \t\n\tРезультат = Минимум;\n\t\n\tЕсли Минимум < Максимум Тогда\n\t\t\n\t\tДелитель = 1;\n\t\tЕсли Не ВспомогательныйВызов\
      \ Тогда\n\t\t\tДелители = СтроковыеФункцииКлиентСервер.РазложитьСтрокуВМассивПодстрок(\"2,3,5,7,11\");\n\t\t\tДелитель\
      \ = Делители[СлучайноеЧислоБезИспользованияГенератора(0, 4, СчетчикГСЧ, Истина)];\n\t\tКонецЕсли;\n\t\t\n\t\tРезультат\
      \ = Цел((ТекущаяУниверсальнаяДатаВМиллисекундах() + СчетчикГСЧ) / Делитель) % Максимум;\n\t\t\n\t\tЕсли Результат <\
      \ Минимум Тогда\n\t\t\tШаг = (Максимум - Минимум + 1);\n\t\t\tРезультат = Результат + Шаг * Цел((Максимум - Результат)\
      \ / Шаг);\n\t\tКонецЕсли;\n\t\t\n\tКонецЕсли;\n\t\n\tСчетчикГСЧ = СчетчикГСЧ + 13;\n\t\n\tВозврат Результат;\n\t\nКонецФункции"
    - "Функция ПредставлениеТрудоемкости(ТрудоемкостьОт, ТрудоемкостьДо, КоличествоБезТрудоемкости)\n\t\n\tЕсли Не ЗначениеЗаполнено(ТрудоемкостьОт)\n\
      \t\tИ Не ЗначениеЗаполнено(ТрудоемкостьДо)\n\t\tИ Не ЗначениеЗаполнено(КоличествоБезТрудоемкости) Тогда\n\t\tВозврат\
      \ \"\";\n\tКонецЕсли;\n\t\n\tМассивПредставлениеТрудоемкости = Новый Массив;\n\t\n\tЕсли Не ЗначениеЗаполнено(КоличествоБезТрудоемкости)\n\
      \t\tИ (ЗначениеЗаполнено(ТрудоемкостьОт) Или ЗначениеЗаполнено(ТрудоемкостьДо)) Тогда\n\t\tМассивПредставлениеТрудоемкости.Добавить(\n\
      \t\t\tСтрШаблон(\"%1 – %2\",\n\t\t\t\tПредставлениеЧелчасов(ТрудоемкостьОт),\n\t\t\t\tПредставлениеЧелчасов(ТрудоемкостьДо)));\n\
      \tИначеЕсли ЗначениеЗаполнено(КоличествоБезТрудоемкости) И ЗначениеЗаполнено(ТрудоемкостьОт) Тогда\n\t\tМассивПредставлениеТрудоемкости.Добавить(\n\
      \t\t\tСтрШаблон(\"%1 – ?\",\n\t\t\t\tПредставлениеЧелчасов(ТрудоемкостьОт)));\n\tКонецЕсли;\n\t\n\tЕсли ЗначениеЗаполнено(КоличествоБезТрудоемкости)\
      \ Тогда\n\t\tМассивПредставлениеТрудоемкости.Добавить(\n\t\t\t?(КоличествоБезТрудоемкости = 1,\n\t\t\t\t\"?\",\n\t\t\
      \t\tСтрШаблон(\"%1?\", КоличествоБезТрудоемкости)));\n\tКонецЕсли;\n\t\n\tПредставлениеТрудоемкости = СтрСоединить(МассивПредставлениеТрудоемкости,\
      \ \", \");\n\t\n\tВозврат ПредставлениеТрудоемкости;\n\t\nКонецФункции"
