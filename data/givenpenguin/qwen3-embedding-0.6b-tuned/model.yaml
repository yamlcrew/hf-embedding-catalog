      1.8»)
    sentences:
    - "Процедура ЗаписатьАвтопротокол(ВерсияФайла, ДанныеАвтопротокола)\n\t\n\tМенеджерЗаписи = СоздатьМенеджерЗаписи();\n\
      \tМенеджерЗаписи.ВерсияФайла = ВерсияФайла;\n\tМенеджерЗаписи.Прочитать();\n\t\n\tЕсли МенеджерЗаписи.Выбран() Тогда\n\
      \t\t\n\t\tМенеджерЗаписи.Автопротокол = ДанныеАвтопротокола.Автопротокол;\n\t\tМенеджерЗаписи.Дата = ТекущаяДатаСеанса();\n\
      \t\tМенеджерЗаписи.СледующиеШаги = ДанныеАвтопротокола.СледующиеШаги;\n\t\tМенеджерЗаписи.Статус = Перечисления.ТаймлистСтатусы.ПолученАвтопротокол;\n\
      \t\tМенеджерЗаписи.Записать();\n\t\t\n\t\tАвтор = РегистрыСведений.ТаймлистФайлыВОбработке.АвторЗадания(ВерсияФайла);\n\
      \t\tЕсли ЗначениеЗаполнено(Автор) Тогда\n\t\t\tДанныеУведомления = ДанныеУведомления(ВерсияФайла);\n\t\t\tЕсли ТипЗнч(ДанныеУведомления.ВладелецФайла)\
      \ = Тип(\"СправочникСсылка.ДокументыПредприятия\")\n\t\t\t\tИли ТипЗнч(ДанныеУведомления.ВладелецФайла) = Тип(\"СправочникСсылка.Мероприятия\"\
      ) Тогда\n\t\t\t\tОбъектУведомления = ДанныеУведомления.ВладелецФайла;\n\t\t\tИначе\n\t\t\t\tОбъектУведомления = ДанныеУведомления.Файл;\n\
      \t\t\tКонецЕсли;\n\t\t\tВидСобытия = Перечисления.СобытияУведомлений.ТаймлистПолучениеРасшифровкиАвтопротокола;\n\t\t\
      \tРегистрыСведений.ОчередьУведомлений.ДобавитьУведомлениеПоСобытию(Автор, ВидСобытия, ОбъектУведомления,\n\t\t\t\tДанныеУведомления.Файл);\n\
      \t\tКонецЕсли;\n\t\t\n\t\tРегистрыСведений.ТаймлистОшибкиРаботыССервисом.Удалить(ВерсияФайла);\n\t\t\n\tКонецЕсли;\n\
      \t\nКонецПроцедуры"
    - "Функция УведомленияПортала1СИТС(\n\tДанныеАутентификации,\n\tДомен)\n\t\n\tРезультат = НовыйРезультатВызоваОперации();\n\
      \tURLОперации = URLОперацииСервиса(\"applications/check-notifications\", Домен);\n\t\n\tЗаполнитьТикетАутентификации(ДанныеАутентификации,\
      \ URLОперации, Результат);\n\tЕсли Не ПустаяСтрока(Результат.ИмяОшибки) Тогда\n\t\tВозврат Результат;\n\tКонецЕсли;\n\
      \t\n\tТелоЗапроса = НовыйТелоЗапросаПроверкиУведомлений(\n\t\tДанныеАутентификации,\n\t\tНастройкиПолученияУведомленийПортала().ОтпечатокУведомлений);\n\
      \t\n\tЗаголовки = Новый Соответствие;\n\tЗаголовки.Вставить(\"Content-Type\", \"application/json\");\n\t\n\tПараметрыПолученияСодержимого\
      \ = Новый Структура;\n\tПараметрыПолученияСодержимого.Вставить(\"Метод\"                   , \"POST\");\n\tПараметрыПолученияСодержимого.Вставить(\"\
      ФорматОтвета\"            , 1);\n\tПараметрыПолученияСодержимого.Вставить(\"Заголовки\"               , Заголовки);\n\
      \tПараметрыПолученияСодержимого.Вставить(\"ДанныеДляОбработки\"      , ТелоЗапроса);\n\tПараметрыПолученияСодержимого.Вставить(\"\
      ФорматДанныхДляОбработки\", 1);\n\tПараметрыПолученияСодержимого.Вставить(\"Таймаут\"                 , 10);\n\t\n\t\
      РезультатЗагрузкиСодержимого = ИнтернетПоддержкаПользователей.ЗагрузитьСодержимоеИзИнтернет(\n\t\tURLОперации,\n\t\t\
      ,\n\t\t,\n\t\tПараметрыПолученияСодержимого);\n\t\n\tРезультат.КодСостояния = РезультатЗагрузкиСодержимого.КодСостояния;\n\
      \t\n\tЕсли РезультатЗагрузкиСодержимого.КодСостояния = 304 Тогда\n\t\tРезультат.ИмяОшибки = ИмяОшибкиНетИзменений();\n\
      \t\tВозврат Результат;\n\tКонецЕсли;\n\t\n\tЕсли Не ПустаяСтрока(РезультатЗагрузкиСодержимого.КодОшибки) Тогда\n\t\t\
      ПриОшибкеВызоваОперацииСервиса(РезультатЗагрузкиСодержимого, URLОперации, Результат);\n\t\tВозврат Результат;\n\tКонецЕсли;\n\
      \t\n\tТелоОтвета = РезультатЗагрузкиСодержимого.Содержимое;\n\tПопытка\n\t\t\n\t\tЧтениеJSON = Новый ЧтениеJSON;\n\t\
      \tЧтениеJSON.УстановитьСтроку(ТелоОтвета);\n\t\tРезультат.Данные = ПрочитатьJSON(ЧтениеJSON, Истина, \"optionValidTill\"\
      );\n\t\tЧтениеJSON.Закрыть();\n\t\t\n\tИсключение\n\t\t\n\t\tПриОшибкеОбработкиОтветаСервиса(\n\t\t\tИнформацияОбОшибке(),\n\
      \t\t\tURLОперации,\n\t\t\tТелоОтвета,\n\t\t\tРезультат);\n\t\t\n\tКонецПопытки;\n\t\n\tВозврат Результат;\n\t\nКонецФункции"
    - "Процедура ВыгрузитьДополнительныеРеквизитыИСведения(КомпонентыОбмена, ДанныеИБ, ДанныеXDTO, ЕстьДопРеквизиты = Ложь)\n\
      \tЕсли ПолучитьФункциональнуюОпцию(\"ИспользоватьДополнительныеРеквизитыИСведения\") = Ложь Тогда\n\t\tВозврат;\n\t\
      КонецЕсли;\n\t\n\tДополнительныеРеквизиты = Новый ТаблицаЗначений;\n\tДополнительныеРеквизиты.Колонки.Добавить(\"Свойство\"\
      );\n\tДополнительныеРеквизиты.Колонки.Добавить(\"ЗначениеСвойства\");\n\t\n\tЕсли УправлениеСвойствами.ИспользоватьДопРеквизиты(ДанныеИБ.Ссылка)\
      \ Тогда\n\t\t\n\t\tЕсли ЕстьДопРеквизиты Тогда\n\t\t\tВыгрузкаДопРеквизитовИзТаблицыЗначений(ДанныеИБ.ДополнительныеРеквизиты,\
      \ ДополнительныеРеквизиты);\n\t\tКонецЕсли;\n\t\t\n\t\tНаборДопРеквизитов = УправлениеСвойствами.СвойстваОбъекта(ДанныеИБ.Ссылка,\
      \ Истина, Ложь);\n\t\tСвойстваДопРеквизитов = ОбщегоНазначения.ЗначенияРеквизитовОбъектов(\n\t\t\tНаборДопРеквизитов,\n\
      \t\t\t\"Наименование, ТипЗначения\");\n\t\t\n\t\tДля Каждого ДопРеквизит Из НаборДопРеквизитов Цикл\n\t\t\tСвойстваДопРеквизита\
      \ = СвойстваДопРеквизитов[ДопРеквизит];\n\t\t\t\n\t\t\tЕсли СвойстваДопРеквизита.ТипЗначения <> Новый ОписаниеТипов(\"\
      Булево\") Тогда\n\t\t\t\tПродолжить;\n\t\t\tКонецЕсли;\n\t\t\t\n\t\t\tЕсли ДанныеИБ.ДополнительныеРеквизиты.Найти(ДопРеквизит,\
      \ \"Свойство\") = Неопределено Тогда\n\t\t\t\tСтрокаДополнительныхРеквизитов = ДополнительныеРеквизиты.Добавить();\n\
      \t\t\t\tСтрокаДополнительныхРеквизитов.Свойство = ДопРеквизит;\n\t\t\t\tСтрокаДополнительныхРеквизитов.ЗначениеСвойства\
      \ = Ложь;\n\t\t\tКонецЕсли;\n\t\tКонецЦикла;\n\t\t\n\tКонецЕсли;\n\t\n\tЕсли УправлениеСвойствами.ИспользоватьДопСведения(ДанныеИБ.Ссылка)\
      \ Тогда\n\t\t\n\t\tЗапрос = Новый Запрос(\n\t\t\t\"ВЫБРАТЬ\n\t\t\t|\tСвойство КАК Свойство,\n\t\t\t|\tЗначение КАК Значение\n\
      \t\t\t|ИЗ\n\t\t\t|\tРегистрСведений.ДополнительныеСведения\n\t\t\t|ГДЕ Объект = &Ссылка\");\n\t\tЗапрос.УстановитьПараметр(\"\
      Ссылка\", ДанныеИБ.Ссылка);\n\t\t\n\t\tДополнительныеСведенияИзДанныхИБ = Запрос.Выполнить().Выгрузить();\n\t\t\n\t\t\
      // Дополнительные сведения типа Булево хранятся в регистре сведений \"ДополнительныеСведения\"\n\t\t// только со значением\
      \ Истина. В связи с этим значения Ложь необходимо выгружать принудительно.\n\t\tСсылка               = ДанныеИБ.Ссылка;\n\
      \t\tМетаданныеОбъекта    = Ссылка.Метаданные();\n\t\tИмяОбъектаМетаданных = МетаданныеОбъекта.Имя;\n\t\tВидОбъектаМетаданных\
      \ = ОбщегоНазначения.ВидОбъектаПоСсылке(Ссылка);\n\t\t\n\t\tВладелецДопСведенийЯвляетсяГруппой = Ложь;\n\t\t\n\t\tЕсли\
      \ ВидОбъектаМетаданных = \"Справочник\" Или ВидОбъектаМетаданных = \"ПланВидовХарактеристик\" Тогда\n\t\t\tВладелецДопСведенийЯвляетсяГруппой\
      \ = ОбщегоНазначения.ОбъектЯвляетсяГруппой(Ссылка);\n\t\tКонецЕсли;\n\t\t\n\t\tДополнительныеСведенияСЗначениемБулево\
      \ = ПолучитьТЗДопСведенияБулево(КомпонентыОбмена);\n\t\t\n\t\tЕсли Не ВладелецДопСведенийЯвляетсяГруппой Тогда\n\t\t\
      \t\n\t\t\tИмяЭлемента = ВидОбъектаМетаданных + \"_\" + ИмяОбъектаМетаданных;\n\t\t\t\n\t\t\tДля Каждого СтрокаДополнительногоСвойстваБулево\
      \ Из ДополнительныеСведенияСЗначениемБулево Цикл\n\t\t\t\t\n\t\t\t\tЕсли СтрНайти(СтрокаДополнительногоСвойстваБулево.ИмяПредопределенныхДанных,\
      \ ИмяЭлемента) <> 1 Тогда\n\t\t\t\t\tПродолжить;\n\t\t\t\tКонецЕсли;\n\t\t\t\t\n\t\t\t\tЕсли ДополнительныеСведенияИзДанныхИБ.Найти(\n\
      \t\t\t\t\t\tСтрокаДополнительногоСвойстваБулево.Свойство, \"Свойство\") = Неопределено Тогда\n\t\t\t\t\tСтрокаДополнительныхРеквизитов\
      \ = ДополнительныеСведенияИзДанныхИБ.Добавить();\n\t\t\t\t\tСтрокаДополнительныхРеквизитов.Свойство = СтрокаДополнительногоСвойстваБулево.Свойство;\n\
      \t\t\t\t\tСтрокаДополнительныхРеквизитов.Значение = Ложь;\n\t\t\t\tКонецЕсли;\n\t\t\t\t\n\t\t\tКонецЦикла;\n\t\t\t\n\
      \t\tКонецЕсли;\n\t\t\n\t\tВыгрузкаДопРеквизитовИзТаблицыЗначений(ДополнительныеСведенияИзДанныхИБ, ДополнительныеРеквизиты);\n\
      \t\t\n\tКонецЕсли;\n\t\n\tЕсли ДополнительныеРеквизиты.Количество() > 0 Тогда\n\t\tДанныеXDTO.Вставить(\"ДополнительныеРеквизиты\"\
      , ДополнительныеРеквизиты);\n\tКонецЕсли;\nКонецПроцедуры"
  - source_sentence: 'Возвращает логин и пароль Интернет-поддержки или тикет аутентификации. Параметры: АдресСервиса - Строка
      - URL операции, для которой получаются данные аутентификации. ИмяМетода - Строка - http метод: "GET", "POST" или "PUT".
      ПользовательФреш - Булево - Истина, если для аутентификации необходимо использовать пару fresh/fresh. Возвращаемое значение:
      Структура - структура, содержащая результаты определения параметров аутентификации пользователя Интернет-поддержки:
      * Ошибка - Булево - Истина, если в процессе выполнения метода возникли ошибки. * ВидОшибки - Строка - вид возникшей
      ошибки, либо пустая строка, если ошибок нет. * ИнформацияОбОшибке - Строка - описание ошибки, либо пустая строка, если
      ошибок нет. * ОписаниеОшибкиСервиса - Структура, Неопределено - подробное описание ошибки веб-сервиса, либо Неопределено,
      если ошибок нет, либо ошибка не связана с запросом к веб-сервису. См. НовыйОписаниеОшибкиСервиса. * Аутентификация -
      Произвольный, Неопределено - данные аутентификации, если она выполнена успешно, либо Неопределено в случае ошибок. См.
      ИнтернетПоддержкаПользователей.ЗаголовокBearerАутентификации и ИнтернетПоддержкаПользователей.ЗаголовокБазовойСхемыАутентификации.'
    sentences:
    - "Процедура ЗаполнитьСоответствияФизЛица(ФизЛицо)\n\t\n\tНачатьТранзакцию();\n\tПопытка\n\t\t\n\t\tБлокировкаДанных =\
      \ Новый БлокировкаДанных;\n\t\t\n\t\tЭлементБлокировки = БлокировкаДанных.Добавить(\"Справочник.Сотрудники\");\n\t\t\
      ЭлементБлокировки.УстановитьЗначение(\"Владелец\", ФизЛицо);\n\t\tЭлементБлокировки.Режим = РежимБлокировкиДанных.Исключительный;\n\
