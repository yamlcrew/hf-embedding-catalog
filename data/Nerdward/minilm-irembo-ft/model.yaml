  - source_sentence: Need passport to book museum camping
    sentences:
    - 'How to schedule a museum Visit. This service allows a person or group of people to schedule a visit to any of the National
      Museums of Rwanda. The processing time is one day. The price of this service depends on the following reasons: Entrance,
      admission, and guiding fees for nationals, international non-residents, and EAC/CEPGL. Prerequisites: Applicants with
      or without an account can apply for this service Rwandan citizens should have a national ID number. Foreigners should
      have a passport number. Applicants should have a valid phone number and/or email address. Follow these simple steps
      to schedule a visit to a Rwandan museum Visit www.irembo.gov.rw, and under Rwanda Museum, click on Schedule Visit. Click
      Apply Choose the facility to visit and the visit date, and fill in the applicant details by clicking in the blank space
      to enter the required details; the details will be retrieved and displayed on the right side of the page. Click on Next
      to proceed. Verify that the information is accurate, enter your phone number and/or email address, check the verification
      box, and click on Submit. A billing number/ID (88...) will be generated for payment. Applicants choose the mode of payment.
      For more information about payment modes, click here. NOTE: After applying and successfully paying via IremboGov, the
      applicant will receive an SMS and/or email notification to confirm the payment and can go to their scheduled visit'
    - 'How to Apply for a Criminal Record Certificate. This service allows Rwandans and foreigners living in or have lived
      in Rwanda to apply for a Criminal Record Certificate. The certificate has a validity of 6 months. The service is provided
      by the National Public Prosecution Authority (NPPA). The processing time is 21 days, and its price is Rwf 1,200. Prerequisites:
      Applicants should have an Irembo account or visit the nearest Irembo agent for assistance. Click here to find out how
      to create an account on IremboGov. Rwandan applicants should have a national ID number, or Citizen Application Number.
      Foreigners should have a foreigner’s ID. Refugee applicants should have a refugee national ID number. Minors with a
      Citizen Application Number should be 14 years of age or older. Conditional attachments include; Passport Photos for
      minors, Refugees, and foreigners Proof of registration for refugees Passport copy (when you were/are in Rwanda) Copy
      of Visa (when you were/are in Rwanda) Passport copy for Rwandans living abroad, foreigners, and refugees A copy of Visa
      for foreigners Applicants should have a valid phone number, email address, or both. NOTE: Rwandans and foreigners residing
      outside the country (Rwanda) without a Rwandan national ID or a valid foreigner''s ID should contact/visit the Rwandan
      embassy in their country of residence for assistance. Follow these simple steps to apply for a criminal record certificate:
      Visit www.irembo.gov.rw and click on Log In to start applying for this service. Under Criminal Record, click on Criminal
      Record Certificate. Choose who you are applying for (self or child), and then click on Apply. After clicking on Apply;
      For a self-application, enter a national ID number, and the applicant’s personal details will be retrieved and displayed
      on the right side of the page. For a Child application, enter the child ID, and the child details will be displayed
      on the right side of the page. Enter all the applicant details. Enter processing details and click on Next. The certificate
      is processed and sent to the applicant in the language they have chosen while applying. NOTE: Rwandan applicants who
      choose a foreign country of residence are required to attach their passport copy and a copy of the visa received in
      that country. Refugee applicants are required to attach their proof of refugee registration. Foreigner applicants with
      Rwandan Resident IDs are required to to attach a copy of passport and Copy of Visa (when they were/are in Rwanda) Verify
      that the information is true, enter a phone number and/or email address, check the verification box, and click on Submit.
      A billing Number/ID (88…) will be generated for payment, Click Pay Applicants choose the mode of payment. For more information
      about payment modes, click here. NOTE: After applying and paying successfully via IremboGov, and after NPPA officers
      have approved the application, the applicant receives an SMS or email notifying them that the certificate is available
      and that they can download it from the IremboGov platform. Moreover, when the applicant has entered their email address
      while applying for the service, the certificate will be sent to that email address. There is no need to download it
      on the platform'
    - 'How to apply for camping at the museum. This service is offered to individuals or groups of people who would like to
      camp in Museum gardens since museums have big spaces, and tourists can spend their nights in those gardens. The processing
      time is one day. The price for this service depends on the case. Note: Before proceeding, please ensure you have completed
      your booking with the museum. This service is only used for payments. Prerequisites: Applicants with or without an account
      can apply for this service. NOTE: It is more advisable to apply with an IreboGov account if you have a National ID.
      Click here to find out how to create an account on IremboGov. Rwandan citizens should have a national ID number. Foreigners
      should have a passport number. Applicants should have a valid phone number and/or email address. Follow these simple
      steps to apply for camping at the museum: Visit www.irembo.gov.rw, and under Rwanda Museum, click on museum activities.
      Click on the service you are applying to, "camping at the museum", and click Apply. Fill in all the necessary information
      as prompted, then click next. Note: If you are Rwandan, your details will automatically be fetched after inputting your
      National ID number Verify that the information is true, enter your Phone number and/or Email Address, check the verification
      box, and Click Submit. A billing number/ID (88…) will be generated for payment, and applicants can pay using any of
      the services provided. Applicants choose the mode of payment: offline or online. For more information about payment
      modes, click here . Once payment is completed, your application will be processed, and you will receive confirmation
      via the provided phone number and/or email address'
  - source_sentence: How can I cancel my health center permit
    sentences:
    - 'How to apply for a License to relocate a health facility. This service is provided to entities with valid operating
      licenses who want to relocate the facility. This service is provided by the Ministry of Health. The processing time
      is 30 days, and the service is free of charge. Prerequisites: Applicants with or without IremboGov accounts can apply
      for this service. To create an account, click here A health facility must have a valid operating license number. A health
      facility must have a reason to relocate. Required attachments (3) Incineration contract Ambulance contract or vehicle
      yellow card Occupation permit Follow these simple steps to apply for a license to relocate a health facility. Step 1:
      Visit the IremboGov platform at www.Irembo.gov.rw; under “health category,” select health facility licensing. Step 2:
      Under health facility licensing, select “license to relocate a health facility” and click Apply. Step 3: Enter the license
      number, reason for relocation, and new location details. Step 4: Upload the required attachments in the correct format;
      then click next. Step 5:Verify that the information is true, enter a phone number and/or email address, check the verification
      box, and click Submit. Step : An application number will be generated (B2……..) to follow up on the application status.
      Once the application has been approved, an applicant receives the notification and can either download the license from
      the IremboGov platform or receive it via email'
    - 'How to make an application to close a health facility. This service is designed for health facilities seeking to cease
      operations. Upon approval, it entails canceling the facility''s operating license. The Ministry of Health provides this
      service. The processing time is 30 days, and the service is free of charge. Prerequisites: Applicants with or without
      IremboGov accounts can apply for this service. To create an account, click here. A valid license number. A health facility
      has to be seeking to cease its operations. Required attachments (2) Motivation letter Tax clearance Follow these simple
      steps to make an application to close a health facility. Step 1: Visit the IremboGov platform at www.Irembo.gov.rw.
      Under the “health category,” select health facility licensing. Step 2: Under health facility licensing, select “an application
      to close a health facility” and click Apply. Step 3: Enter your license number and health facility details( this includes
      the reason for closing and the date of service closure). Then check the verification box. Step 4: Upload the required
      documents and click Next. Step 5: Verify that the information is true; enter a phone number and/or email address, check
      the verification box, and click Submit. Step 6: An application number will be generated (B2……..) to follow up on the
      application status. Upon approval, this entails the cancellation of the facility''s operating license'
    - 'How to Apply for a Seed Conditioner License. This service allows seed conditioner business operators to register and
      obtain an operating license from Rwanda Inspectorate, Competition and Consumer Protection Authority (RICA). RICA will
      conduct a field visit to ensure the premises are compliant with RICA standards and regulation. The processing time is
      14 days, and the service fee depends on the registration type. Prerequisites Applicants must have an Irembo account
      can apply for this service. A company or an individual must have a Tax Identification Number (TIN). Required attachments
      (5) 1. A copy of the operational license issued by RICA 2. Registration certificate of the factory issued by RICA 3.
      Technical staff’s proof of skills and knowledge in seed production 4. Copy of work contract of Technical staff’s 5.
      Operations manager’s notarized degree in crop sciences 6. Copy of work contract of operations manager 7. Business Registration
      certificate from RDB 8. Passport copy Follow these simple steps to apply for the Seed Conditioner License: 1. Visit
      the Irembo platform at new.irembo.gov.rw and log in to your account. If you don’t have an account, click here to learn
      how to create one. 2. Select "Seed Conditioner License." 3. Click "Apply." 4. Fill in the applicant''s details (select
      if the applicant is the business owner or legal representative, add the age group, and other required personal information).
      5. Enter the business details as prompted. 6. Upload the required attachments in the correct format. 7. Verify that
      the information is accurate, enter a phone number and/or email address, check the verification box, and click "Submit."
      8. A billing Number/ID (88…) will be generated for payment. Click Pay 9. Applicants choose the mode of payment. For
      more information about payment modes, click here. Note: Upon successful submission, the application will be processed
      by RICA. Applicants will receive an email or SMS notification about any changes in the application status. Once RICA
      approves your application, you will receive your e-license'
  - source_sentence: I need to visit genocide memorials
    sentences:
    - 'How to Request to Visit the National Heroes'' Mausoleums.. This service is open to Rwandans and foreigners, enabling
      them to visit National Heroes'' Mausoleums and heroism sites in Rwanda. It provides an opportunity to learn more about
      Rwandan citizens or foreigners who have distinguished themselves through acts of heroism and other displays of bravery
      and serve as exemplary role models. The Chancellery for Heroes, National Orders, and Decorations of Honor provides the
      service. The processing time is 1 day, and the service is free of charge. NOTE: Visit time is Monday to Sunday from
      9am to 5pm. Prerequisites Applicants with or without an Irembo account can apply for this service. Click here to learn
      how to create an Irembo account. Applicants must have an identification document ( national ID for Rwandans or passport
      for foreigners). If applying as a group, you will need a list of group members (template provided during the application
      process). This service is open to both Rwandan citizens and foreigners. Follow these simple steps to request a visit
      to National Heroes'' Mausoleums. Step 1: Visit the Irembo platform at www.irembo.gov.rw Under the "Visiting National
      Heroes'' Mausoleums" section, click "Visiting National Heroes'' Mausoleums." Step 2: Click "Apply." Step 3: Fill in
      the visiting details( Select the location and the visiting date). Step 3: Enter the applicant''s details (an individual
      or a group), add the visitor category, and then fill in the number and the email. Step 4: Click Next. Step 5: Verify
      that the information is true; enter a phone number and/or email address, check the verification box, and click Submit.
      Step 6: An application number (B2…...) to track your application status. Once the site manager you wish to visit receives
      and approves your application, you will receive an SMS or email notification confirming your scheduled visit'
    - 'How to make an application for a health facility Inspection. This service is sought by an entity holding provisional
      authorization to register a health facility. The entity is now prepared for a thorough inspection as part of the preparatory
      phase before formally applying for a license to operate. This service is provided by the Ministry of Health. The processing
      time is 30 days, and the service is free of charge. Prerequisites: Applicants with or without IremboGov accounts can
      apply for this service. To create an account, click here A facility must have a license number. Health facilities must
      have provisional authorization. Follow these simple steps to make an application for a health facility inspection. Step
      1: Visit the IremboGov platform at www.Irembo.gov.rw, Under “health category,” select health facility licensing. Step
      2: Under health facility licensing, select “ application for a health facility inspection” and click apply. Step 3:
      After the application form opens, enter the license number, then click next. Step 4: Upload the requested attachment,
      then click next. Step 5:Verify that the information is true, enter a phone number and/or email address, check the verification
      box, and click Submit. Step 6: An application number will be generated (B2……..) to follow up on the application status.
      After a successful application, an applicant receives the inspection date notification and prepares accordingly'
    - 'FAQs about applying to visit Genocide Memorial sites : IremboGov. The Ministry of National Unity & Civic Engagement
      - MINUBUMWE has established a service that allows both Rwandans and foreigners to visit Genocide Memorial Sites across
      the country. This service aims to provide an opportunity for people to learn about and pay respects to the victims of
      the 1994 Genocide Against the Tutsi in Rwanda. Note: Not all memorial sites are available The following are the most
      frequently asked questions about visiting Genocide Memorial Sites: Do I need an Irembo account to apply for this service?
      Applicants with or without an Irembo account can apply for this service. How can I create an IremboGov account? Click
      here to learn how you can create your account. Is there a fee for visiting Genocide Memorial Sites? No, this service
      is free of charge. What types of identification documents are accepted for this service? For Rwandan citizens, a valid
      national ID is required. Foreigners residing in Rwanda are required to have a foreigner’s ID. EAC or CEPGL citizens
      are required to have a valid passport. How far in advance should I apply for a visit? You must apply at least 2 days
      before your desired visit date. Can I visit multiple Genocide Memorial Sites with one application? You must submit a
      separate application for each memorial site you wish to visit. How long does it take to process this service? The processing
      time is 2 days'
  - source_sentence: need fix wrong name on my ID
    sentences:
    - 'How to Apply for a National ID Correction. This service enables Rwandans and refugees to apply for the correction of
      their national identity cards. The citizen will receive an appointment requesting them to visit the selected sector
      and show supporting documents to justify their reason for the request. The corrected ID card will be collected at the
      selected sector. The service is provided by the National Identification Agency (NIDA). The processing time for this
      service is 30 days, and the price depends on the reasons for ID correction. Note: Please follow these essential steps
      if your reason for ID correction is a photo change before submitting an application on the IremboGov platform. First
      and foremost, send a photo change request to NIDA on their email (info@nida.gov.rw). Attach a copy of your national
      ID and most recent passport photo. NIDA will then review your request to change your ID photo. If NIDA approves your
      request, an appointment date will be set. After successfully completing these steps, proceed to start your application
      on the IremboGov platform. Prerequisites: Applicants can not apply to this service while logged in to their Irembo account.
      Applicants should have a Rwandan National ID number. Applicants should have a legitimate reason (date of birth, gender,
      name, and photo) to request this service. Applicants should have a valid phone number or email address. Follow these
      simple steps to apply for a national ID correction: Visit Irembo platform: www.irembo.gov.rw and under Identification,
      click on Application of National ID Correction. Select “Application for National ID correction” from the dropdown menu.
      Click on Apply. Enter the required Applicant details (ID number, reason for ID correction, place of collection, and
      processing office), and click Next to proceed. Note: When the reason for ID correction is Change of names, Photo or
      Damaged the applicant will be charged 1,500 Rwf respectively. Note: It is advised to choose the same processing office
      as the collection place to make the collection easier. Verify that the information provided is accurate, enter a phone
      number and email address, check the verification box, and click Submit. A billing number/ID (88….) will be generated.
      Click pay. Applicants can choose their preferred mode of payment. For more information about payment modes, click here.
      NOTE: Upon payment, your application will be sent at the sector office of your selection. The sector officer will set
      an appointment for you to visit their office with proof of correction. Once the application is approved, your documents
      will be sent to NIDA for a new Id card production and will be ready for pickup in 30 days'
    - FAQs about a Criminal Investigation Clearance Certificate. The Rwanda Investigation Bureau (RIB) issues the criminal
      investigation clearance certificate to someone who is not being investigated or has been previously investigated for
      any crime. Rwandans, documented foreigners, and refugees apply for this certificate when they don't have any open investigations
      ongoing or do not have an available file awaiting prosecution. The following are some frequently asked questions about
      a Criminal Investigation Clearance Certificate. Can I apply for this service without an Irembo account? Yes, applicants
      with or without an Irembo account can use this service. How can I create an IremboGov account? Click here to learn how
      you can create an account. How much does the service cost? The service costs 1,200 Rwf. What are the prerequisites for
      applying for a clearance certificate? Applicants need a valid form of identification (Rwandan ID, foreign ID, refugee
      ID, passport number) and a valid phone number and/or email address. How long does it take to process the Criminal Investigation
      Clearance Certificate? The processing time is 3 days from the date of the application. What is the validity of the Criminal
      Investigation Clearance Certificate? The certificate varies for 3 months from the date of issuance. Once the certificate
      is approved, how can I get it? Irembo will notify you when your certificate is ready, and you can download it. You can
      check the status on the IremboGov platform
    - 'How to update the Identification or Names in the Land Register. This service enables landowners to make changes to
      the National Identification and/or names on their land title. This service is provided by the National Land Authority
      (NLA). The processing time is 13 Days and the service is Free of Charge. Prerequisites: Applicants without an account
      cannot apply for this service. Click here to find out how to create an account on IremboGov. Applicants must have the
      UPI Applicants should have their phone number or email address. Conditional attachments: Copy of new passport Certificate
      of change of names Supporting document Follow these simple steps to update the Identification of Names in the Land Register:
      Visit the Irembo platform at www.irembo.gov.rw and log into your account. A small window will pop up. Fill in both your
      phone number and your password, then click login. Under “Land”, click on Title Details Update. Select “Updating the
      Identification or Names in the Land Register” from the drop-down menu. Click “Apply.” Select the reason for the request.
      Enter your identification document type and corresponding identification number. Add the contact information of Owner
      or legal representative, and finally, the parcel UPI. Then click “Next”. Verify that the provided information is accurate,
      enter a phone number and email address, check the verification box, and click "Submit.”. An application number will
      be generated (B2…) so you can track the status of your application. Note: Once the National Land Authority receives
      and approves your application, you will receive a notification to download your updated E-title'
  - source_sentence: appointed to take documents for ID update
    sentences:
    - 'How to Apply for Meat Transportation Carrier Registration. This is a service requested by an industry to register meat
      transportation carriers. Industries need the registration certificate to show that they comply with RICA regulatory
      requirements. Rwanda Inspectorate, Competition, and Consumer Protection Authority (RICA) provides this service. The
      processing time is 30 days, and the service is free of charge. Prerequisites Applicants with or without an Irembo account
      can apply for this service. A company or an individual must have a Tax Identification Number (TIN). Applicant should
      have a valid phone number or email address. Required attachments (5) Authorization for transport of goods by a competent
      authority Vehicle inspection certificate /control technique Vehicle registration certificate(Carte Jaune) Driver’s Valid
      medical certificate Business Registration Certificate from RDB. Conditional attachments (2) Calibration certificate
      Passport copy Follow these simple steps to apply for Meat Transportation Carrier Registration: 1. Visit the Irembo platform
      at www.irembo.gov.rw and navigate to the "Trade and Industry" category, Click on “Meat transportation carrier registration.”
      2. Click "Apply." to start an application. 3. Fill in the applicant''s details (select if the applicant is the business
      owner or legal representative, add the age group and other required personal information). 4. Enter business details
      as prompted. 5. Provide transport details and click on “add new driver” to fill in his information. 6. Upload the required
      attachments in the correct format. Note: Double-check that the uploaded files are in PDF format and meet the size requirements.
      7. Verify that the information is accurate, enter a phone number and/or email address, check the verification box, and
      click "Submit." 8. An application number (B2…...) to track your application status. Note: Upon successful submission,
      the application will be processed by RICA. Applicants will receive an email or SMS notification about any changes in
      the application status. Once the processing officers approve your application, you will receive your e-certificate via
      email or can download it on IremboGov platform'
    - 'How to Apply for a National ID Correction. This service enables Rwandans and refugees to apply for the correction of
      their national identity cards. The citizen will receive an appointment requesting them to visit the selected sector
      and show supporting documents to justify their reason for the request. The corrected ID card will be collected at the
      selected sector. The service is provided by the National Identification Agency (NIDA). The processing time for this
      service is 30 days, and the price depends on the reasons for ID correction. Note: Please follow these essential steps
      if your reason for ID correction is a photo change before submitting an application on the IremboGov platform. First
      and foremost, send a photo change request to NIDA on their email (info@nida.gov.rw). Attach a copy of your national
      ID and most recent passport photo. NIDA will then review your request to change your ID photo. If NIDA approves your
      request, an appointment date will be set. After successfully completing these steps, proceed to start your application
      on the IremboGov platform. Prerequisites: Applicants can not apply to this service while logged in to their Irembo account.
      Applicants should have a Rwandan National ID number. Applicants should have a legitimate reason (date of birth, gender,
      name, and photo) to request this service. Applicants should have a valid phone number or email address. Follow these
      simple steps to apply for a national ID correction: Visit Irembo platform: www.irembo.gov.rw and under Identification,
      click on Application of National ID Correction. Select “Application for National ID correction” from the dropdown menu.
      Click on Apply. Enter the required Applicant details (ID number, reason for ID correction, place of collection, and
      processing office), and click Next to proceed. Note: When the reason for ID correction is Change of names, Photo or
      Damaged the applicant will be charged 1,500 Rwf respectively. Note: It is advised to choose the same processing office
      as the collection place to make the collection easier. Verify that the information provided is accurate, enter a phone
      number and email address, check the verification box, and click Submit. A billing number/ID (88….) will be generated.
      Click pay. Applicants can choose their preferred mode of payment. For more information about payment modes, click here.
      NOTE: Upon payment, your application will be sent at the sector office of your selection. The sector officer will set
      an appointment for you to visit their office with proof of correction. Once the application is approved, your documents
      will be sent to NIDA for a new Id card production and will be ready for pickup in 30 days'
    - 'How to Apply for a National ID Replacement. This service enables Rwandans and refugees to replace their national ID
      in case of loss or damage. The applicant may apply for a temporary ID (Certificate of Replacement for National Identification)
      while waiting for the new ID to be produced. However, this requires an additional fee of Rwf 3000, and it is valid for
      60 days only. This service is provided by the National Identification Agency (NIDA). The processing time of this service
      is 30 days and its price is Rwf 1,500 Prerequisites: Applicants should have an Irembo account to apply for this service.
      Click here to find out how to create an account on IremboGov or visit the nearest Irembo agent for assistance. Applicants
      should have a national ID number. Refugees should have a refugee ID number. Follow these simple steps to apply for a
      National ID Replacement: 1. Visit www.irembo.gov.rw and under Identification, click on National ID Replacement. 2. Click
      on Apply. 3. Enter the applicant’s ID number. The applicant’s information will automatically appear on the right side
      of the page. 4. Choose whether or not you want a temporary ID while waiting for the replacement. If yes , the applicant
      pays an additional fee of Rwf 3000 and selects the processing office of that document. 5. Select the nearest or preferred
      RIB processing office and place of collection for the new ID. NOTE: It is advisable to choose the same processing office
      as the place of collection for easy collection. 6. Click Next to proceed. 7. Verify that the information is true, enter
      a phone number and/or email address, check the verification box, and click Submit. 8. An application number (B2....)
      will be generated to follow up on the application status. NOTE: After submitting the application, it is sent to the
      RIB office of your selection for processing. The RIB officer will set an appointment for the applicant to visit their
      office for application approval. Once the application is approved, the applicant will receive a billing number to pay
      for the new ID. Applicants can choose to pay using any mode of payments After successfully paying for the service via
      IremboGov, the application is sent to NIDA for production. For further information, reach out to your selected sector
      of collection'
