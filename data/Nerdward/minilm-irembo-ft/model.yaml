    photo. NIDA will then review your request to change your ID photo. If NIDA approves your request, an appointment date
    will be set. After successfully completing these steps, proceed to start your application on the IremboGov platform. Prerequisites:
    Applicants can not apply to this service while logged in to their Irembo account. Applicants should have a Rwandan National
    ID number. Applicants should have a legitimate reason (date of birth, gender, name, and photo) to request this service.
    Applicants should have a valid phone number or email address. Follow these simple steps to apply for a national ID correction:
    Visit Irembo platform: www.irembo.gov.rw and under Identification, click on Application of National ID Correction. Select
    “Application for National ID correction” from the dropdown menu. Click on Apply. Enter the required Applicant details
    (ID number, reason for ID correction, place of collection, and processing office), and click Next to proceed. Note: When
    the reason for ID correction is Change of names, Photo or Damaged the applicant will be charged 1,500 Rwf respectively.
    Note: It is advised to choose the same processing office as the collection place to make the collection easier. Verify
    that the information provided is accurate, enter a phone number and email address, check the verification box, and click
    Submit. A billing number/ID (88….) will be generated. Click pay. Applicants can choose their preferred mode of payment.
    For more information about payment modes, click here. NOTE: Upon payment, your application will be sent at the sector
    office of your selection. The sector officer will set an appointment for you to visit their office with proof of correction.
    Once the application is approved, your documents will be sent to NIDA for a new Id card production and will be ready for
    pickup in 30 days'
  - 'How to Apply for a National ID Replacement. This service enables Rwandans and refugees to replace their national ID in
    case of loss or damage. The applicant may apply for a temporary ID (Certificate of Replacement for National Identification)
    while waiting for the new ID to be produced. However, this requires an additional fee of Rwf 3000, and it is valid for
    60 days only. This service is provided by the National Identification Agency (NIDA). The processing time of this service
    is 30 days and its price is Rwf 1,500 Prerequisites: Applicants should have an Irembo account to apply for this service.
    Click here to find out how to create an account on IremboGov or visit the nearest Irembo agent for assistance. Applicants
    should have a national ID number. Refugees should have a refugee ID number. Follow these simple steps to apply for a National
    ID Replacement: 1. Visit www.irembo.gov.rw and under Identification, click on National ID Replacement. 2. Click on Apply.
    3. Enter the applicant’s ID number. The applicant’s information will automatically appear on the right side of the page.
    4. Choose whether or not you want a temporary ID while waiting for the replacement. If yes , the applicant pays an additional
    fee of Rwf 3000 and selects the processing office of that document. 5. Select the nearest or preferred RIB processing
    office and place of collection for the new ID. NOTE: It is advisable to choose the same processing office as the place
    of collection for easy collection. 6. Click Next to proceed. 7. Verify that the information is true, enter a phone number
    and/or email address, check the verification box, and click Submit. 8. An application number (B2....) will be generated
    to follow up on the application status. NOTE: After submitting the application, it is sent to the RIB office of your selection
    for processing. The RIB officer will set an appointment for the applicant to visit their office for application approval.
    Once the application is approved, the applicant will receive a billing number to pay for the new ID. Applicants can choose
    to pay using any mode of payments After successfully paying for the service via IremboGov, the application is sent to
    NIDA for production. For further information, reach out to your selected sector of collection'
