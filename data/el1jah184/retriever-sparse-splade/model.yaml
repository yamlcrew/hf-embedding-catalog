widgetData:
- text: Нужно ли закрывать перегон, если СПК заезжает и съезжает в границах одного и того же перегона?
- text: Как закрывается и открывается перегон, если заезд и съезд СПК происходят в пределах одного перегона?
- text: 'ПТЭ (Правила технической эксплуатации). ИНСТРУКЦИЯ ПО ОРГАНИЗАЦИИ ДВИЖЕНИЯ ПОЕЗДОВ И МАНЕВРОВОЙ РАБОТЫ НА ЖЕЛЕЗНОДОРОЖНОМ
    ТРАНСПОРТЕ РОССИЙСКОЙ ФЕДЕРАЦИИ. ПОРЯДОК ДВИЖЕНИЯ СПЕЦИАЛЬНОГО ПОДВИЖНОГО СОСТАВА НА КОМБИНИРОВАННОМ ХОДУ

    Организация движения СПК на перегоне:


    Для заезда (съезда) СПК на перегоне между железнодорожными станциями, соответствующий железнодорожный путь перегона закрывается
    для движения всех поездов кроме СПК по приказу диспетчера поездного.Разрешается заезд (съезд) на путь перегона только
    при его свободности от поездов.'
- text: Может ли управлять СПК любой машинист или только указанный в локальном нормативном акте владельца инфраструктуры?
- text: 'ПТЭ (Правила технической эксплуатации). ИНСТРУКЦИЯ ПО ОРГАНИЗАЦИИ ДВИЖЕНИЯ ПОЕЗДОВ И МАНЕВРОВОЙ РАБОТЫ НА ЖЕЛЕЗНОДОРОЖНОМ
    ТРАНСПОРТЕ РОССИЙСКОЙ ФЕДЕРАЦИИ. ПОРЯДОК ДВИЖЕНИЯ СПЕЦИАЛЬНОГО ПОДВИЖНОГО СОСТАВА НА КОМБИНИРОВАННОМ ХОДУ

    Организация движения СПК на перегоне:


    Запрещается приступать к работам по подготовке к заезду (съезду) СПК и производить указанные операции до получения руководителем
    работ по средствам технологической железнодорожной электросвязи приказа диспетчера поездного о закрытии перегона (пути
    перегона).'
