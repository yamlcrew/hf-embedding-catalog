      АҚШ мемлекеттік туы, сонымен қатар Жұлдызды-жолақты ту (Stars and Stripes) деген атаумен белгілі — Америка Құрама Штаттарының
      ресми түрде АҚШ-тың Үлкені мөрі мен Мемлекеттік әнұранымен қатарлас мемлекеттік туы болып саналады. '
    - '

      Полинезия (πολύς – көп + νῆσος – аралдар) — Тынық мұхиттың орталық бөлігіндегі Мұхиттық аралдар құрамындағы аралдар
      тобы. Полинезияның құрамына Гавайи, Туамоту, Тонга, Самоа, Пасха, т.б. топаралдар кіреді. П-да тәуелсіз мемлекеттермен
      қатар, Ұлыбритания, АҚШ, Франция, Жаңа Зеландия, Чилидің иелігіндегі аралдар бар. Жалпы аумағы (Жаңа Зеландиясыз) 26
      мың км²-ге жуық. Халқы 4,5 млн. адам. П. аралдарының көпшілігі маржанды атолдардан тұрады, қалғандары жанартаулық аралдар
      тобына жатады. Аралдардың басым бөлігінің жер бедері таулы. Ең биік жері — Гавайи аралдарындағы сөнген Мауна-Кеа жанартауы
      (4205 м). Гавай, Самоа, Тонга аралдарында сөнбеген жанартаулар кездеседі. Климаты — экваторлық, тропиктік; пассат желдері
      басым. Жылдық орташа температура 22 — 26°С; жауын-шашынның жылдық орташа мөлш. 1500 — 3500 мм. Таулы аралдардың көпшілігінде
      мәңгі жасыл субэкваторлық, тропиктік ормандар мен саванналар тараған. Кокос, банан, ананас, какао, пальма түрлері, нан
      ағашы, күріш, т.б. тропиктік дақылдар өсіріледі. Балық, теңіз тасбақасы ауланады, меруерт жиналады. Полинезия аралдары
      Америка, Оңтүстік-Шығыс Азия және Австралияны жалғастырушы жол болып табылады. Ірі қалалары мен порттары — Гонолулу
      (Гавайи аралдары), Апиа (Самоа), Аваруа (Кук), т.б.'
    - Тікбұрышты горизонтальды үлендігі бірдей бірінен кейін бірі орналасқан жеті қызыл және алты ақ түсті жолағы бар мата
      бөлігі. Қара көк түсті 50 бес ұшы бар ақ жұлдыз орналасқан. 13 жолақ тәуелсіз мемлекетті құрған 13 британдық колонияларды
      білдіреді (Делавэр, Пенсильвания, Нью-Джерси, Джорджия, Коннектикут, Массачусетс, Мэриленд, Оңтүстік Каролина, Нью-Гэмпшир,
      Виргиния, Нью-Йорк, Солтүстік Каролина, Род-Айленд). Көк түсті крыж одақты білдіреді. Көк крыждағы жұлдыздар саны штаттардың
      санына сәйкес (қазір олардың саны 50). Қызыл түс шыдамдылық пен батырлықты білдіреді; қара көк түс — зейінділікті, әділеттілікті,
      сақтықты; ақ түс — пәктік пен тазалықты білдіреді. Тудың ені мен ұзындығының қатынасы 10:19.
  - source_sentence: Портты қала саналатын Анталияның орналасқан биіктігі теңіз деңгейінен қанша өлшемді көрсетіп тұр?
    sentences:
    - 'Суретші Винсет Ван Гог 1876 жылы сәуірде Рамсгитке 23 жасында қоныс аударды. Ол Роял-роуд жергілікті мектебінде мұғалім
      болып жұмыс істеді, онда ол өз лауазымын алды.Ағасы Теоға жазған хаттарының бірінде ол өзінің айналасын былай суреттеді:
      «Мұнда теңізге шығатын тас төсеніштермен төселген, кемелердің барлық түрлеріне толы айлақ бар. Содан кейін біз теңізді
      өзінің табиғи күйінде көре аламыз және ол әдемі».'
    - Анталия (Antalya) — Түркияның оң түстігіндегі портты қала және курорт, Анталия қаласы теңіз деңгейінен 30 метр биіктікте
      орналасқан.Қаладағы халықтың саны - 1 603 994 (2015) және шамамен екі миллион адам жаздың мезгілінде болады. Қазіргі
      таңда Анталия ескі және жаңа қала болып екіге бөлінген.
    - ' Ресей су ресурстары федералды агенттігі дайындаған РФ территориясын сушаруашылығы бойынша аудандастыру жөніндегі геоақпараттық
