    Полинезия (πολύς – көп + νῆσος – аралдар) — Тынық мұхиттың орталық бөлігіндегі Мұхиттық аралдар құрамындағы аралдар тобы.
    Полинезияның құрамына Гавайи, Туамоту, Тонга, Самоа, Пасха, т.б. топаралдар кіреді. П-да тәуелсіз мемлекеттермен қатар,
    Ұлыбритания, АҚШ, Франция, Жаңа Зеландия, Чилидің иелігіндегі аралдар бар. Жалпы аумағы (Жаңа Зеландиясыз) 26 мың км²-ге
    жуық. Халқы 4,5 млн. адам. П. аралдарының көпшілігі маржанды атолдардан тұрады, қалғандары жанартаулық аралдар тобына
    жатады. Аралдардың басым бөлігінің жер бедері таулы. Ең биік жері — Гавайи аралдарындағы сөнген Мауна-Кеа жанартауы (4205
    м). Гавай, Самоа, Тонга аралдарында сөнбеген жанартаулар кездеседі. Климаты — экваторлық, тропиктік; пассат желдері басым.
    Жылдық орташа температура 22 — 26°С; жауын-шашынның жылдық орташа мөлш. 1500 — 3500 мм. Таулы аралдардың көпшілігінде
    мәңгі жасыл субэкваторлық, тропиктік ормандар мен саванналар тараған. Кокос, банан, ананас, какао, пальма түрлері, нан
