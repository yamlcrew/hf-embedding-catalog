  - source_sentence: Жұтаң газдағы конденсаттың мөлшері қандай аралықта болады?
    sentences:
    - 'Жұтаң газ. Газдық факторы 33-100 мың м3/м3 аралығында, конденсат мөлшері 10-30 см3/м3 аралығында болып келетін қойнауқаттық
      газ.

      Этанның, бутанның және пропанныңаз мөлшерлерімен сипатталады. Синонимі - "Құрғақ газ".'
    - Көшеге әрі ақын, әрі батыр, XIX ғасырда Исатай Тайманов басқарған шаруалар көтерілісінің көсемдердің бірі Махамбет Өтемісұлының
      есімі (Алматы қаласы әкімінің 1994 жылғы 11 ақпандағы Ма61 шешімі) берілген. Махамбет Өтемісұлы (1804-1846) Батыс Қазақстан
      облысы Орда ауданында дүниеге келген. Махамбеттің отты жырлары барлық уақытта халқын еркіндікке, тәуелсіздікке ұмтылдырар
      құнды мұра болып қала бермек.
    - Симфониялық поэма (французша poeme symfonіque, грекше poіema — көркем әдеби туынды) — романтизм кезеңіндегі бағдарламалы
      музыканың басты жанры; формасы жағынан музыкадан гөрі өнердің басқа түрімен, көбіне кескіндеме немесе поэзиямен байланысты
      жазылатын оркестрге арналған бір бөлімді шығарма. Симфониялық поэма ақынның өлеңмен жазылған лирикалық, тарихи я болмаса
      философиялық мазмұндағы поэмасына, яғни белгілі бір сюжетке құрылады. Симфониялық поэмаға өз шығармаларында алғаш көңіл
      аударған композиторлар қатарында Л. ван Бетховен (мыс., “Эгмонт” пен “Леонора” увертюрасы), Г.Берлиоз бен Ф.Мендельсонды
      атауға болады. Симфониялық поэма өз алдына жеке жанр ретінде Ф.Листтің шығармалық арқылы бекіп қалыптасты. Ол 1848 —
      58 ж. осы салада 12 шығарма жазды; әсіресе “Мазепа”, “Орфей”, “Гамлет”, “Тассо” секілді туындылары көпке белгілі болды.
      19 ғасырдың 2-жартысында Симфониялық поэма жанры француз музыкасында (К.Сен-Санс, В.д’Энди) кең өріс алып, шырқау шыңына
      көтерілді. Композитор Р.Штраус та “Дон Жуан”, “Дон Кихот”, т.б. партитураларын жазу арқылы симфониялық поэма жанрының
      дамуына үлкен үлес қосты. Осы кезеңде орыс (М.А. Балакирев, А.П. Бородин, М.И. Глинка, М.П. Мусоргский, П.И.
