- source_sentence: 종교 때문에 입대 못 하겠다고 편지로 검찰에 가서 처벌 받겠다고 한 사람이 병역법상 입영 안 한 죄 되나요?
  sentences:
  - 병역법위반 현역병 별도 입영 대상자인 피고인이 현역병입영 통지서를 수령하고도 입영기일로부터 3일이 경과한 날까지 정당한 사유 없이 입영하지 아니하였다고 하여 병역법 위반으로 기소된 사안에서, 구 병역법 시행령(2016.
    11. 29. 대통령령 제27620호로 개정되기 전의 것, 이하 ‘시행령’이라 한다) 제21조 제1항은 지방병무청장으로 하여금 징집순서가 결정된 현역병입영 대상자에게 입영 통지서를 입영기일 30일 전까지 송달하도록
    규정하는 반면, 시행령 제21조 제2항은 징집순서에 따르지 않고 따로 입영하게 할 수 있는 현역병 별도 입영 대상자에 대한 입영 통지서의 송달기간을 단축할 수 있도록 지방병무청장에게 재량권을 부여하면서 재량권 행사기준에
    관하여 아무런 규정을 두고 있지 않아 헌법에 위반되므로, 현역병 별도 입영 대상자에게도 시행령 제21조 제1항에 따라 입영기일 30일 전까지 입영 통지서를 송달하여야 하는데, 관할 지방병무청장이 그보다 송달기간을
    단축하여 현역병입영 통지처분을 하였으므로, 그 처분에서 정한 입영기일로부터 3일 내에 입영하지 않았더라도 구 병역법(2016. 5. 29. 법률 제14183호로 개정되기 전의 것) 제88조 제1항 제1호 위반죄가
    성립될 수 없다고 한 사례.
  - 병역법위반 입영기피자에 대한 처벌 법규인 병역법 제88조 제1항은 현역입영통지서를 받은 자가 정당한 사유 없이 입영기일로부터 5일이 경과하여도 입영하지 않는 경우에 처벌한다고 규정하고 있으므로 입영기일로부터 5일이
    경과하여도 입영하지 않은 자는 정당한 사유 유무를 따져 정당한 사유가 있는 경우에만 처벌하지 않지만, 입영기일로부터 5일 이내에 입영한 자(이하 '지연입영자'라고 한다)는 정당한 사유 유무를 불문하고 처벌하지 않는다는
    취지임이 명백한데, 병역법시행령 제24조 제1항은 입영기일로부터 5일 이내에 입영할 수 있는 자를 천재지변·교통두절·통지서 송달의 지연 기타 부득이한 사유로 인하여 입영기일에 입영하지 못한 자로 제한하면서 위와
    같은 부득이한 사유가 없는 경우에는 지연입영이 되지 않는 것으로 규정함으로써 모법인 병역법이 제한하고 있지 않은 지연입영자의 범위를 아무런 법적 근거 없이 제한하고 있고, 제2항은 지연입영자에게 지연입영 신고의무를
    부과하면서 지연입영 신고일에 입영할 의무를 부과하고 있는바, 지연입영자를 입영시키는 행정절차를 개시하기 위하여 지연입영자에게 지연입영 신고의무를 부과한 것은 타당하다 할지라도, 이에 그치지 않고 지연입영 신고자에게
    그 입영신고일에 입영할 의무를 부과하고 있는 것은 현역 입영대상자에게 5일의 유예기간을 부여한 병역법 제88조 제1항에 반하는 것으로 무효라고 할 것이고, 나아가 병역법 예규인 현역병입영업무예규 제36조 제1항
    제2호는 입영부대가 2군의 사단교육대인 경우 지연입영자는 입영기일로부터 3일차 12:00까지 입영할 수 있고, 이를 경과하면 입영할 수 없도록 규정하고 있는바, 이 역시 모법인 병역법 제88조 제1항에 위반한 것으로
    무효이다. 피고인이 입영기일로부터 3일째가 되는 날 병무청을 방문하여 밝힌 입영의사의 표시는 지연입영의 신고로 보아야 하고, 지연입영의 신고를 받은 병무청 담당공무원들로서는 마땅히 병역법령에 따라 피고인에게 지연입영에
    필요한 조치를 취하여야 했음에도 불구하고, 위법한 현역병입영업무예규에 근거하여 피고인에게 그러한 협조를 거부하였고, 병무청으로부터 관련 공문 및 병적기록표를 교부받지 못한 피고인으로서는 지연입영을 할 수 없었으므로
    피고인의 입영기피는 피고인이 책임질 수 없는 사유로 인한 것이라고 보아, 병역법 제88조 제1항이 규정하고 있는 정당한 사유가 있다고 한 사례.
  - 병역법위반 병역법(62.10.1 법률 제1663호)상의 법정 징집연기사유가 있다 하더라도 소할 병무청장의 징집연기처분을 받지 않는 한 연기원서 제출만으로는 입영치 않은 정당한 사유가 될 수 없다 할 것이나 입영기피가
    아니된다고 잘못 믿음에 있어 정당한 이유가 있는 경우에는 처벌할 수 없다.
  - 병역법위반 현역병증서를 받은 후 종교상의 이유로 입대할 수 없다는 취지를 서면화하여 검찰청에 출두하고 법의 처단을 받겠다는 의사표시를 한 것이라면 이는 병역의무를 면탈할 목적으로 잠닉한 것이라 볼 수 없고 입영할
    자가 정당한 사유 없이 입영하지 아니한 경우에 해당한다 할 것이다.
  - 병역법 위반 입영기피에 대한 처벌조항인 병역법 제88조 제1항의 ‘정당한 사유’는 원칙적으로 추상적 병역의무의 존재와 그 이행 자체의 긍정을 전제로 하되 다만 병무청장 등의 결정으로 구체화된 병역의무의 불이행을
    정당화할 만한 사유, 즉 질병 등 병역의무 불이행자의 책임으로 돌릴 수 없는 사유를 말한다. 현역병 입영대상자인 피고인이 지방병무청장 명의의 입영통지서를 받고도 정당한 사유 없이 입영일로부터 3일이 지나도록 입영하지
    않았다고 하여 병역법 위반으로 기소된 사안에서, 제반 사정을 종합할 때 피고인은 처음부터 입영할 의사가 없어 병무청 담당직원으로부터 지연입영이 가능하다는 안내를 받았더라도 지연입영도 하지 않았을 것이라고 볼 여지가
    있고, 그 같은 경우에는 병무청 담당직원이 입영기일 연기 등의 구제조치를 취하지 않았다는 사정만으로는 병역의무의 불이행을 정당화할 만한 사유가 있다고 할 수 없는데도, 피고인에게 지연입영할 의사가 있었는지 구체적으로
    가려보지도 아니한 채 무죄를 인정한 원심판결에 병역법 제88조 제1항에 관한 법리를 오해하고 필요한 심리를 다하지 아니한 잘못이 있다고 한 사례.
- source_sentence: 어음금 줬다고 쓴 영수증證거로 냈는데 법원이 안 보고 채권자 손 들어준 판례 있나요?
  sentences:
  - 약속어음금 배서의 연속이 흠결된 어음의 소지인이 어음상 권리를 실질적으로 양수하였음을 인정하여 그 권리행사를 인용한 원심판결을, 단순한 교부만에 의한 양도를 인정하였거나 혹은 어음채무자에 대한 대항요건이 갖추어졌는지
    여부를 심리하지 아니한 채 지명채권 양도방식에 의한 양도가 이루어졌다고 인정한 잘못이 있다는 이유로 파기한 사례.
  - 어음금 판결원본과 같은 내용의 판결정본이 당사자 甲에게 송달되기 전에 그와 다른 주문이 기재된 판결정본이 먼저 甲에게 송달되어 甲이 먼저 송달된 판결정본의 내용을 원심판결로 보아야 한다는 취지로 주장한 사안에서,
    원심의 판결선고기일에 재판장이 판결원본의 주문과 다른 내용의 판결을 선고하였음을 인정할 수 없다고 하여 이를 받아들이지 아니한 사례. 기존의 원인채권과 어음채권이 병존하는 경우에 채권자가 원인채권을 행사함에 있어서
    채무자는 원칙적으로 어음과 상환으로 지급하겠다고 하는 항변으로 채권자에게 대항할 수 있다. 그러나 채무자가 어음의 반환이 없음을 이유로 원인채무의 변제를 거절할 수 있는 것은 채무자로 하여금 무조건적인 원인채무의
    이행으로 인한 이중지급의 위험을 면하게 하려는 데 그 목적이 있고, 기존의 원인채권에 터잡은 이행청구권과 상대방의 어음반환청구권 사이에 민법 제536조에 정하는 쌍무계약상의 채권채무관계나 그와 유사한 대가관계가
    있기 때문은 아니다. 따라서 어음상 권리가 시효완성으로 소멸하여 채무자에게 이중지급의 위험이 없고 채무자가 다른 어음상 채무자에 대하여 권리를 행사할 수도 없는 경우에는 채권자의 원인채권 행사에 대하여 채무자에게
    어음상환의 동시이행항변을 인정할 필요가 없으므로 결국 채무자의 동시이행항변권은 부인된다. 채권자가 기존채무의 이행을 위하여 채무자로부터 교부받은 약속어음을 적법하게 지급제시하였으나 그 후 어음상 권리보전에 필요한
    소멸시효 중단의 조치를 취하지 아니함으로써 어음상 권리에 관한 소멸시효가 완성된 경우 어음을 반환받은 채무자는 약속어음의 주채무자인 발행인, 소구의무자인 배서인 등에 대한 어음상 권리나 원인채무자(발행인 또는 배서인과
    동일인일 수도 있고 어음상 의무자 아닌 제3자일 수도 있다)에 대한 자신의 원인채권을 행사하여 자기 채권의 만족을 얻을 수 있다면 아직 손해가 발생하였다고 하기 어렵다. 다만 채무자는 발행인이나 배서인 등 어음상
    의무자가 각 소멸시효 완성 후 무자력이 되고 어음상 의무자 아닌 원인채무자도 현재 무자력이어서 채권자로부터 어음을 반환받더라도 어음상 권리와 자신의 원인채권 중 어느 것으로부터도 만족을 얻을 수 없게 된 때에야
    비로소 자신의 채권에 관하여 만족을 얻지 못하는 손해를 입게 되었다고 할 것이다. 한편 이러한 손해는 어음상 의무자와 원인채무자의 자력 악화라는 특별한 사정으로 인한 손해로서 어음상 권리의 보전의무를 불이행한 어음소지인이
    장차 어음상 의무자와 원인채무자가 무자력하게 될 것임을 알았거나 알 수 있었을 때에만 채무자는 그에 대하여 위 손해의 배상을 청구할 권리를 가지게 되어서, 이 손해배상채권으로써 상계할 수 있다.
  - 대여금 대리권수여에 관한 입증이 있음에도 불구하고 입증이 없다고 잘못 판단한 데 대하여 채증법칙위반을 이유로 원심판결을 파기한 사례
  - 약속어음금등 약속어음 청구사건에 있어서 피고가 원고주장의 약속어음을 발행한 사실을 인정하고 을 호증으로 원고발행의 영수증을 제출한 때에는 기록상 서증으로 입증코저 하는 주장사실이 명료치 않다 하더라도 그 서증의
    입증취지는 위 약속어음금을 지급하였다는 취지로 볼 수 있는 것이므로 이러한 경우 법원으로서는 위 서증을 제출한 입증취지에 관하여 석명을 구하고 석명된 사실에 관하여 심리판단하여야 할 것이다
  - 부당이득금반환 어음발행인과 당좌거래약정을 체결하고 지급위탁약정에 따라 적법한 어음소지인에게 어음금을 지급하던 은행이, 어음발행자를 상대로 어음금청구소송의 승소판결을 받은 정당한 어음소지인에 대하여 이미 압류 및
    가압류가 이루어진 어음발행인의 별도의 예금계좌에서 실수로 금원을 인출하여 어음금을 지급한 경우, 어음소지인은 어음발행인이 발행한 약속어음을 적법하게 취득한 다음 그 지급은행에 이를 제시하여 어음금을 지급받은 것뿐이므로
    권한 없이 어음금을 수령하였다고 볼 수 없고, 한편 어음소지인이 압류 또는 가압류가 이루어진 예금계좌에서 인출된 금원으로 어음금을 지급받았다는 사실만으로는 법률상의 원인 없이 어음금을 지급받은 것이라고 단정할 수도
    없으며, 가사 은행의 어음금 지급 전에 어음발행인의 부도로 이미 당좌거래약정이 해지되었다 하더라도 어음발행인에 의하여 지급위탁이 취소되지 않은 이상, 은행은 어음발행인의 계산으로 어음소지인에게 어음금을 지급할 권한이
    있고, 어음소지인으로서는 그 어음금 채권을 행사하여 수령한 어음금을 정당하게 보유할 수 있다.
- source_sentence: 귀속재산 받을 권리를 남한테 넘겼는데 그 계약이 사회질서나 법에 어긋나는 건가요?
  sentences:
  - 가옥명도등청구사건 귀속재산에 관한 권리의 일부를 타인에게 양도한 관계로 계약을 자기명의로 하였으나 사실상은 타인의 권리로 승인한 부분에 관하여도 자기에게 그 불하에 대한 우선권이 있으므로 그 타인에게 양도한 권리의
    목적에 대하여는 장래 그것이 자기명의로 불하되어 소유권을 취득하게 되면 타인의 양수부분에 관한 소유권을 그 타인에게 이전하는 것은 신의측상 당연한 것이며 이러한 약정이 법령 또는 공서양속에 위반된다고 할 수 없다.
  - 행정처분취소 간이소청절차에 의하여 귀속해제결정을 받은 자는 법률 제120호에 의한 확인을 받지 못한 경우에도 그 재산에 대한 관리권이 있으므로 관재당국의 허가없이 이를 전대할 수 있을 뿐 아니라 그 재산이 종국적으로
    귀속재산으로 된 경우에는 연고권자로서 이를 임차할 권리가 있다
  - 부동산이전등기말소 가. 부동산소유권이전 가등기후에 등기의무자가 제3자에게 그 부동산소유권이전의 본등기를 한 경우에 가등기 명의자는 가등기의 효력으로서 그 제3자에게 대하여 그 이전본등기의 말소를 청구할 권리가 있다.
    나. 가등기의 서상과 같은 효력은 가등기권리자가 본등기청구에 필요한 일절요건을 구비한 경우에 한하여 발생한다고 해석할 것이다.
- source_sentence: 타인 소유 토지 위 분묘에 대해 종가가 지상권을 시효취득할 수 있는지 알고 싶습니다.
  sentences:
  - 특수강도피고 범죄에 대한 처우에 있어서 조선소년령해당자에 대한 처분은 성년자에 대한 것보다 관대한 것임으로 원판결이 사실상 성년자를 소년으로 오해하여 피고인에게 조선소년령을 적용하였더라도 이를 이유로 원판결을 비난함은
    피고인이 불리익에 귀착하는 것임으로 상고이유로 할수 없다 할 것이다
  - 업무상과실치사 피해자가 과거 역원으로 육년간 기관조수견습으로 일년간 근무한자로서 본건 사고발생당일도 기관조수견습으로서 기관사인 피고인과 같이 기관차의 체환(입환)작업에 종사중이였음으로 여사한 경우에 있어서는 피해자
    자신이 기관차의 속력, 도승(비승)의 여부를 감안하야 안전히 도승할 수 있는 시기와 장소를 정할것이요 그 하차, 승차에 일일히 기관차를 정차 또는 서행치 아니하였다하야 피고인이 업무상 필요한 주의의무를 다하지 아니하였다
    할 수 없고 특히 기록에 의하야 인정되는 피해자가 기관차 좌측으로부터 도승한 관계로 기관차우측에 좌정한 피고인이 피해자를 목견할 수 없었던 당시의 사정을 종합하면 본건 사고는 피해자의 과실에 기인하여 발생된 것이며
    피고인의 업무상 과실에 기인한 것이라 할 수 없다
  - 유사지상권확인및분묘등설치금지청구사건 아국에 있어서 분묘는 당초 상주인 종자가 이를 설치함을 통칙으로 하고 이후 가제묘사를 막론하고 종자종손이 제주가 되어 그 행사를 주재하는 것이므로 분묘의 소유권은 종가에 속하며
    종가의 호주된 종손이 제사상속을 함과 동시에 이를 승계할 것이고 따라서 그 분묘가 타인의 토지에 설치된 경우에 분묘를 위한 유사지상권의 시효취득 내지 그 승계도 종자종손에 귀속한다.
- source_sentence: 기계가 부숴졌는데 휴업 중이었고 바로 다른 기계로 영업할 수 있었으면 그 파손과 손해 사이에 인과관계가 안 되나요?
  sentences:
  - 손해배상청구사건 기계 파손 당시 원고가 영업을 휴업중에 있었고 파손당한 기계등이 대체물로서 원고가 파손직후 타 기계등을 구득하여 영업을 계속하려면 할 수 있었을 사정등이 인정된다면 기계파손과 손해발생과는 상당인과관계를
    인정할 수 없다.
  - 업무상횡령,배임,귀속재산처리법위반피고 가. 귀속기업체의 운영에 관하여 기부, 상여 등 지출에 있어서는 사업계획으로서 포괄적 승인을 얻지 않은 이상 사전승인 없이는 이를 지출할 수 없는 것이다. 나. 6.25사변과
    같은 사태로서 당국의 승인을 얻을 수 없고 또 그 지출에 긴급을 요하는 경우에는 그 소재지방장관에 대한 당국의 위임이 없다할 지라도 관리인이 소재지의 지방장관의 승인을 얻어 지출한 행위는 위법이라 논할 수 없는
    것이다.
  - 가차압이의 채권자가 자기채권의 보전을 위하여 채권자대위권을 행사할 수 있는 경우에는 그 청구권에 관한 강제집행의 보전을 위하여 가압류 또는 가처분 명령의 신청도 이를 할 수 있다
