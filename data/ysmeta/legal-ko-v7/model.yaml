      정당화할 만한 사유, 즉 질병 등 병역의무 불이행자의 책임으로 돌릴 수 없는 사유를 말한다. 현역병 입영대상자인 피고인이 지방병무청장 명의의 입영통지서를 받고도 정당한 사유 없이 입영일로부터 3일이 지나도록
      입영하지 않았다고 하여 병역법 위반으로 기소된 사안에서, 제반 사정을 종합할 때 피고인은 처음부터 입영할 의사가 없어 병무청 담당직원으로부터 지연입영이 가능하다는 안내를 받았더라도 지연입영도 하지 않았을 것이라고
