cardData:
  license: mit
  language:
  - ko
  base_model: dragonkue/BGE-m3-ko
  tags:
  - sentence-transformers
  - sentence-similarity
  - feature-extraction
  - dense
  - generated_from_trainer
  - dataset_size:152556
  - loss:CachedMultipleNegativesRankingLoss
  - loss:MultipleNegativesRankingLoss
  widget:
  - source_sentence: 종교 때문에 입대 못 하겠다고 편지로 검찰에 가서 처벌 받겠다고 한 사람이 병역법상 입영 안 한 죄 되나요?
    sentences:
    - 병역법위반 현역병 별도 입영 대상자인 피고인이 현역병입영 통지서를 수령하고도 입영기일로부터 3일이 경과한 날까지 정당한 사유 없이 입영하지 아니하였다고 하여 병역법 위반으로 기소된 사안에서, 구 병역법 시행령(2016.
      11. 29. 대통령령 제27620호로 개정되기 전의 것, 이하 ‘시행령’이라 한다) 제21조 제1항은 지방병무청장으로 하여금 징집순서가 결정된 현역병입영 대상자에게 입영 통지서를 입영기일 30일 전까지 송달하도록
      규정하는 반면, 시행령 제21조 제2항은 징집순서에 따르지 않고 따로 입영하게 할 수 있는 현역병 별도 입영 대상자에 대한 입영 통지서의 송달기간을 단축할 수 있도록 지방병무청장에게 재량권을 부여하면서 재량권
      행사기준에 관하여 아무런 규정을 두고 있지 않아 헌법에 위반되므로, 현역병 별도 입영 대상자에게도 시행령 제21조 제1항에 따라 입영기일 30일 전까지 입영 통지서를 송달하여야 하는데, 관할 지방병무청장이 그보다
      송달기간을 단축하여 현역병입영 통지처분을 하였으므로, 그 처분에서 정한 입영기일로부터 3일 내에 입영하지 않았더라도 구 병역법(2016. 5. 29. 법률 제14183호로 개정되기 전의 것) 제88조 제1항
      제1호 위반죄가 성립될 수 없다고 한 사례.
    - 병역법위반 입영기피자에 대한 처벌 법규인 병역법 제88조 제1항은 현역입영통지서를 받은 자가 정당한 사유 없이 입영기일로부터 5일이 경과하여도 입영하지 않는 경우에 처벌한다고 규정하고 있으므로 입영기일로부터
      5일이 경과하여도 입영하지 않은 자는 정당한 사유 유무를 따져 정당한 사유가 있는 경우에만 처벌하지 않지만, 입영기일로부터 5일 이내에 입영한 자(이하 '지연입영자'라고 한다)는 정당한 사유 유무를 불문하고
      처벌하지 않는다는 취지임이 명백한데, 병역법시행령 제24조 제1항은 입영기일로부터 5일 이내에 입영할 수 있는 자를 천재지변·교통두절·통지서 송달의 지연 기타 부득이한 사유로 인하여 입영기일에 입영하지 못한
      자로 제한하면서 위와 같은 부득이한 사유가 없는 경우에는 지연입영이 되지 않는 것으로 규정함으로써 모법인 병역법이 제한하고 있지 않은 지연입영자의 범위를 아무런 법적 근거 없이 제한하고 있고, 제2항은 지연입영자에게
      지연입영 신고의무를 부과하면서 지연입영 신고일에 입영할 의무를 부과하고 있는바, 지연입영자를 입영시키는 행정절차를 개시하기 위하여 지연입영자에게 지연입영 신고의무를 부과한 것은 타당하다 할지라도, 이에 그치지
      않고 지연입영 신고자에게 그 입영신고일에 입영할 의무를 부과하고 있는 것은 현역 입영대상자에게 5일의 유예기간을 부여한 병역법 제88조 제1항에 반하는 것으로 무효라고 할 것이고, 나아가 병역법 예규인 현역병입영업무예규
      제36조 제1항 제2호는 입영부대가 2군의 사단교육대인 경우 지연입영자는 입영기일로부터 3일차 12:00까지 입영할 수 있고, 이를 경과하면 입영할 수 없도록 규정하고 있는바, 이 역시 모법인 병역법 제88조
      제1항에 위반한 것으로 무효이다. 피고인이 입영기일로부터 3일째가 되는 날 병무청을 방문하여 밝힌 입영의사의 표시는 지연입영의 신고로 보아야 하고, 지연입영의 신고를 받은 병무청 담당공무원들로서는 마땅히 병역법령에
      따라 피고인에게 지연입영에 필요한 조치를 취하여야 했음에도 불구하고, 위법한 현역병입영업무예규에 근거하여 피고인에게 그러한 협조를 거부하였고, 병무청으로부터 관련 공문 및 병적기록표를 교부받지 못한 피고인으로서는
      지연입영을 할 수 없었으므로 피고인의 입영기피는 피고인이 책임질 수 없는 사유로 인한 것이라고 보아, 병역법 제88조 제1항이 규정하고 있는 정당한 사유가 있다고 한 사례.
    - 병역법위반 병역법(62.10.1 법률 제1663호)상의 법정 징집연기사유가 있다 하더라도 소할 병무청장의 징집연기처분을 받지 않는 한 연기원서 제출만으로는 입영치 않은 정당한 사유가 될 수 없다 할 것이나 입영기피가
      아니된다고 잘못 믿음에 있어 정당한 이유가 있는 경우에는 처벌할 수 없다.
    - 병역법위반 현역병증서를 받은 후 종교상의 이유로 입대할 수 없다는 취지를 서면화하여 검찰청에 출두하고 법의 처단을 받겠다는 의사표시를 한 것이라면 이는 병역의무를 면탈할 목적으로 잠닉한 것이라 볼 수 없고 입영할
      자가 정당한 사유 없이 입영하지 아니한 경우에 해당한다 할 것이다.
