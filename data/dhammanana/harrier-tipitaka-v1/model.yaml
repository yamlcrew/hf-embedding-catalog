widgetData:
- source_sentence: 'Instruct: Represent this Buddhist passage for semantic retrieval.

    Query: Yo hi [yehi (?)] bhikkhu idhātāpī, khayaṃ dukkhassa pāpuṇe ’’ ti. navamaṃ;'
  sentences:
  - She conducts herself in a way that is agreeable to her husband, and protects the wealth he has earned.
  - The bhikkhu who is ardent here may reach the exhaustion of suffering.” The ninth.
  - '“Formerly, monks, this thought occurred to King Yama: ‘Those in the world who do evil deeds, bho, are punished with such
    diverse tortures. Oh, that I might attain the human state! That a Tathāgata, an Arahant, a Perfectly Self-Awakened One
    might arise in the world! That I might attend upon that Blessed One!'
- source_sentence: 'Instruct: Represent this Buddhist passage for semantic retrieval.

    Query: Samasaṭṭhi tathā vīsa, kamenekādaseti ca.'
  sentences:
  - 'He then reflects thus: ‘Indeed, energy will be aroused in me, unflagging; mindfulness will be established, unconfused;
    my body will be tranquil, untroubled; my mind will be concentrated, one-pointed.’ Having taken the world as his authority,
    he abandons the unwholesome and develops the wholesome; he abandons what is blameable and develops what is blameless;
    he keeps himself pure.'
  - sixty-three, then twenty, and respectively eleven.
  - ‘Even when kamma is absent’ ( kamme asantepī ) is said because of the cessation of kamma-intention previously. To make
    that meaning manifest by way of contrast, he said the passage beginning with ‘For thus’ ( tathāhī ). ‘Other forms’ ( itara
    rūpānī ) refers to mind-born forms and so on. A ‘single process-round’ is a five-door process-round. The mind-door process-round
    is called a single-impulsion round. It is delimited.
- source_sentence: 'Instruct: Represent this Buddhist passage for semantic retrieval.

    Query: Idha, bhikkhave, ekacco iti paṭisañcikkhati – ‘ ahañceva kho pana kāyena duccaritaṃ careyyaṃ, vācāya duccaritaṃ
    careyyaṃ, manasā duccaritaṃ careyyaṃ, kiñca taṃ yaṃ maṃ pare sīlato na upavadeyyun ’ ti!'
  sentences:
  - So too, monks, a monk has three primary duties. What are the three? Undertaking the training in heightened virtue, undertaking
    the training in heightened mind, and undertaking the training in heightened discernment—indeed, monks, these are the three
    primary duties of a monk.
  - Khepo (censure/throwing) for blame and for abandonment; niyamo (certainty/rule) for a decision and for a religious vow.
  - 'Here, monks, someone considers thus: ‘If I were to commit bodily misconduct, verbal misconduct, or mental misconduct,
    wouldn’t others blame me for my virtue?’'
- source_sentence: 'Instruct: Represent this Buddhist passage for semantic retrieval.

    Query: Ekūnana vutiyā cittesu vā. Ettha ca vicikicchā cetasikaṃ ekasmiṃ citte yuttanti ekameva hoti. Doso, issā, macchariyaṃ,
    kukkuccanti ime cattāro dvīsu cittesu yuttāti visuṃ visuṃ dve dve honti. Tathā diṭṭhimānā paccekaṃ cattāro. Thinamiddhaṃ
    paccekaṃ pañcātiādinā sabbaṃ vattabbanti.'
  sentences:
  - seven stations of consciousness and nine stations of beings are taught.
  - Or in the eighty-nine states of consciousness. Here, the mental factor of doubt is conjoined in a single state of consciousness,
    so it is just one. Anger, envy, avarice, and worry—these four are conjoined in two states of consciousness, so there are
    two each separately. Likewise, the four [each] of speculative view and conceit individually. Everything [else], such as
    sloth-and-torpor [being present] in five [states of consciousness] each, should be stated.
  - not consummate in proportions. But here, monks, someone is an excellent horse consummate in speed, consummate in beauty,
    and consummate in proportions. These, monks, are the three excellent horses.
- source_sentence: 'Instruct: Represent this Buddhist passage for semantic retrieval.

    Query: Bhagavā taṃ paṭiggahetvā ānandattheraṃ āṇāpesi – ‘‘ imaṃ phalaṃ madditvā pānaṃ dehī ’’ ti. Thero tathā akāsi. Bhagavā
    ambarasaṃ pivitvā ambaṭṭhiṃ uyyānapālassa datvā ‘‘ imaṃ ropehī ’’ ti āha. So vālukaṃ viyūhitvā taṃ ropesi, ānandatthero
    kuṇḍikāya udakaṃ āsiñci.'
  sentences:
  - “Happy, and with a happy heart” means I gave the garlic to the Sangha with a content mind endowed with happiness; this
    is the meaning.
  - “The foremost of my disciples, monks, who are very learned. Who are mindful. Who are clear-headed. Who are resolute. Who
    are attendants, is Ānanda” –
  - 'The Blessed One accepted it and instructed Venerable Ānanda: “Crush this fruit and give it as a drink.” The Elder did
    so. The Blessed One, having drunk the mango juice, gave the mango seed to the gardener and said, “Plant this.” He dug
    up the sand and planted it, and Venerable Ānanda poured water from a vessel.'
