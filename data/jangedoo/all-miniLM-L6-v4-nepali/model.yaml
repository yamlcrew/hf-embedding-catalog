widgetData:
- source_sentence: म विदेश यात्रा गर्दा लागि यात्रा बीमा कसरी लिने प्रक्रिया हो?
  sentences:
  - चेकबुक माग गर्नको लागि तपाईंले आफ्नो शाखा कार्यालयमा सम्पर्क गर्न सक्नुहुन्छ वा बैंकको आधिकारिक वेबसाइटमार्फत अनलाइन आवेदन
    दिन सक्नुहुन्छ।
  - यात्रा बीमा लिनको लागि, तपाईंले कम्पनीको वेबसाइटमा गएर आफ्नो यात्रा विवरण र आवश्यक कागजातहरू अपलोड गर्नुपर्छ। त्यसपछि,
    तपाईंले बीमाको प्रकार र कभरेज अनुसार प्रीमियम तिर्न सक्नुहुन्छ।
  - कृपया फारम भर्ने बेला सबै आवश्यक फिल्डहरू सही ढाँचामा भर्नुहोस् र डाटा टाइप गर्दा कुनै अक्षर वा विशेष चिन्ह नजोड्नुहोस्।
    यदि समस्या समाधान भएन भने, तपाईंले फारमको गाइडलाइन पुनः जाँच गर्नुपर्छ वा ग्राहक सेवा केन्द्रमा सम्पर्क गर्नुपर्छ।
- source_sentence: उद्योग र शैक्षिक संस्था बीचको खाडल कम गर्न निक्की र कुसुमको समझदारी
  sentences:
  - नेपाल–भारत उद्योग वाणिज्य संघ (निक्की) र काठमाडौं विश्वविद्यालय स्कुल अफ म्यानेजमेन्ट (कुसुम) बीच उद्योग र शैक्षिक क्षेत्रबीच
    सहकार्यलाई मजबुत पार्न समझदारीपत्रमा हस्ताक्षर भएको छ।
  - Foreign Minister Yvan Gil Pinto of Venezuela demanded the immediate release of former President Nicolas Maduro and his
    wife from US custody, highlighting recent violence and advocating for diplomatic dialogue and reconciliation.
  - नेदरल्यान्ड्सको द हेगमा छैटौं अन्तर्राष्ट्रिय सिर्जनात्मक सम्मेलन सम्पन्न भयो जसले नेपाली भाषा, साहित्य र संस्कृतिलाई
    विश्वमञ्चमा उभ्यायो। यो सम्मेलनले विशेषगरी युवा पिँढीसँग संवाद गर्दै नेपालीपनलाई नयाँ ऊर्जा दियो।
- source_sentence: बिहारको पूर्णियामा बोक्सी आरोपमा एकै परिवारका पाँचजनाको निर्मम हत्या गरियो। परिवारलाई कुटपिट गरी जिउँदै
    जलाइएको थियो। प्रहरीले दुईजनालाई पक्राउ गरेको छ।
  sentences:
  - संसदको तल्लो सदनका अध्यक्ष देवराज घिमिरेले तीन मुख्य राजनीतिक दलका प्रमुख सचेतकहरूलाई नयाँबानेश्वरमा भेला आह्वान गरेका
    छन्।
  - ज्ञानेन्द्रबहादुर कार्कीले नेपाली कांग्रेसलाई एकताबद्ध भई अगाडि बढ्न आवश्यक रहेको औंल्याएका छन् र सभापति शेरबहादुर देउवामाथि
    राष्ट्रिय तथा अन्तर्राष्ट्रिय क्षेत्रले ठूलो भरोसा राखेको उल्लेख गरेका छन्।
  - पूर्णिया, बिहारमा बोक्सीको आरोपमा एउटै परिवारका पाँच सदस्यको क्रूरतापूर्वक हत्या गरियो। उनीहरूलाई कुटपिट गरेर जिउँदै जलाइएको
    थियो। दुईजनालाई प्रहरीले नियन्त्रणमा लिएको छ।
- source_sentence: नेपाल कम्युनिष्ट पार्टी (एकीकृत समाजवादी)का अध्यक्ष माधवकुमार नेपालले राजनीतिक एकता, सामाजिक न्याय र आर्थिक
    विकासका लागि कम्युनिष्ट आन्दोलन एकताबद्ध गर्नुपर्ने बताएका छन्।
  sentences:
  - कम्युनिष्ट शक्तिहरूलाई राजनीतिक, सामाजिक न्याय र आर्थिक विकासको उद्देश्यले एकताबद्ध गर्नुपर्नेमा नेपाल कम्युनिष्ट पार्टी
    (एकीकृत समाजवादी)का अध्यक्ष माधवकुमार नेपालले जोड दिएका छन्।
  - मस्कोमा रुसी राष्ट्रपति भ्लादिमिर पुटिन र इरानी विदेशमन्त्री अब्बास अरागचीले भेट गरे, जसमा पुटिनले इरानका नागरिकहरूलाई
    सहयोग गर्ने वाचा गरे।
  - अमेरिकी हमलालाई समर्थन गर्दै अष्ट्रेलियाका प्रधानमन्त्री एन्थोनी अल्बानीजले इरानलाई क्षेत्रमा अस्थिरता फैलाउने कार्य नगर्न
    आग्रह गरेका छन्।
- source_sentence: yo dictionary ko quality kasto cha ra reviews hernu hai
  sentences:
  - The Nepali Best Friend Notebook (A5, 200 pages) is made of recycled paper with a hardcover binding, costing NPR 350. It
    comes in six vibrant colors and is suitable for school notes or journaling. Many customers appreciate its smooth pages
    that prevent ink bleed-through.
  - This Faber-Castell Watercolor Paint Set (12 colors) includes a brush and mixing palette, retailing at NPR 1,200. It is
    non-toxic and suitable for children aged 6 and above. Artists recommend it for its vibrant pigmentation and easy blending.
  - The Oxford English-Hindi Dictionary (Pocket Edition) has 1,200 pages with over 40,000 entries, priced at NPR 890. It features
    phonetic transcriptions and clear usage examples, making it ideal for Nepali students learning English. Users on SastoDeal
    have rated it 4.5 stars, praising its compact size and accurate translations for exam preparation.
  - The Kathmandu Plastic Folder (A4, assorted colors) can hold up to 100 sheets and features a secure snap button closure.
    It is lightweight and water-resistant, perfect for organizing documents. Available at NPR 150 at local stationery shops.
