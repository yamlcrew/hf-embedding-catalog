widgetData:
- source_sentence: قولنا في تعليق إيه أكتر كلمة عامية مشهورة في محافظتك أو بلدك والناس من بره مش بتفهمها بسهولة، خلينا نتعرف
    على لهجاتنا!
  sentences:
  - يَعْمَلُ التَّسْوِيقُ بِالرِّفِرَال (Referral Marketing) عَلَى تَحْوِيلِ عُمَلَائِكَ الحَالِيِّينَ إِلَى مُسَوِّقِينَ
    لَكَ، عَنْ طَرِيقِ مَنْحِهِمْ حَوَافِذَ لِجَلْبِ أَصْدِقَائِهِمْ.
  - دخلت الأوضة لقيت كل الصور اللي متعلقة على الحيطة مقلوبة وشها للناحية التانية، ومفيش أي حد دخل البيت غيري.. أنا متأكد من
    ده.
  - شَارِكْ هَذَا المَنْشُورَ مَعَ ثَلَاثَةٍ مِنْ زُمَلَائِكَ فِي العَمَلِ، وَادْعُهُمْ لِتَحَدِّي الإِنْتَاجِيَّةِ لِهَذَا
    الأُسْبُوعِ دُونَ تَأْجِيلٍ.
- source_sentence: الذكاء الاصطناعي لن يستبدل البشر، لكن الأشخاص الذين يستخدمون الذكاء الاصطناعي هم من سيستبدلون أولئك الذين
    لا يستخدمونه؛ التعاون هو مفتاح المستقبل.
  sentences:
  - عشان المانيكير يقعد معاكي فترة طويلة من غير ما يقشر من الأطراف، حطي طبقة من التوب كوت الشفاف كل يومين، ده بيحميه ويديله
    لمعة زي الجل.
  - انضم إلينا الآن في البث المباشر واطرح أسئلتك مباشرة على ضيفنا الخبير الاستشاري، سنجيب على أكبر قدر ممكن من استفساراتكم.
  - يَعْتَمِدُ الذَّكَاءُ الاصْطِنَاعِيُّ فِي قِطَاعِ المَالِ عَلَى التَّحْلِيلِ التَّنَبُّئِيِّ لِكَشْفِ الاحْتِيَالِ اللحظي،
    مما يحمي المستخدمين من العمليات غير القانونية في وقت قياسي.
- source_sentence: يَسْتَنْتِجُ التَّقْرِيرُ الجِيُوسِيَاسِيُّ أَنَّ اضْطِرَابَ سَلَاسِلِ التَّوْرِيدِ فِي المَضَائِقِ المَائِيَّةِ
    سَيَرْفَعُ كُلْفَةَ الشَّحْنِ البَحْرِيِّ بِنِسْبَةٍ قَدْ تَصِلُ إِلَى ثَلَاثِينَ بِالمِائَةِ.
  sentences:
  - يُثْبِتُ التَّحْلِيلُ المَالِيُّ لِأَدَاءِ الشَّرِكَاتِ النَّاشِئَةِ أَنَّ غِيَابَ خِطَّةِ الحَوْكَمَةِ الرَّشِيدَةِ يُسَرِّعُ
    مِنْ مَعَدَّلاتِ الفَشَلِ التَّشْغِيلِيِّ فِي السَّنَوَاتِ الثَّلَاثِ الأُولَى.
  - متخليش الشيطان يضحك عليك ويقولك ذنوبك كتيرة وربنا مش هيغفرلك، باب التوبة مفتوح لحد آخر نفس، وربنا غفور رحيم بعباده.
  - إن تنويع مصادر الدخل القومي وحماية الصناعات الناشئة يمثلان حائط الصد الأول ضد الهزات المالية المفاجئة التي تضرب الأسواق
    العالمية.
- source_sentence: تَمْتَازُ حَمَلَاتُ التَّسْوِيقِ بِالأَتْمَتَةِ (Automation) بِالقُدْرَةِ عَلَى التَّوَاصُلِ مَعَ العُمَلَاءِ
    فِي الوَقْتِ المُنَاسِبِ، دُونَ تَدَخُّلٍ بَشَرِيٍّ مُبَاشِرٍ.
  sentences:
  - إن اختيار الألوان الفاتحة لقطع الأثاث الكبيرة كالأرائك والخزائن، يمنح الغرفة انشراحاً، بينما يمكن استخدام الألوان الجريئة
    في الوسائد واللوحات لإضافة الحيوية.
  - التحدي الأكبر في نماذج اللغة الكبيرة ليس فقط قدرتها على توليد النصوص، بل ضمان دقتها وموثوقيتها وتقليل الهلوسة التقنية
    (Hallucinations) التي قد تقع فيها.
  - يَعْتَمِدُ التَّسْوِيقُ بِالمُحْتَوَى عَلَى تَقْدِيمِ قِيمَةٍ حَقِيقِيَّةٍ لِلْجُمْهُورِ بَدَلَ الاِكْتِفَاءِ بِتَرْوِيجِ
    المُنْتَجَاتِ، مِمَّا يُسَاهِمُ فِي بِنَاءِ سُلْطَةٍ مَعْرِفِيَّةٍ لِلْعَلَامَةِ التِّجَارِيَّةِ.
- source_sentence: لما تحلل أسباب فشل المشروع ده، هتلاقي إن الشركاء ركزوا على الدعاية والإعلان وصرفوا مبالغ ضخمة، ونسيوا يطوروا
    جودة المنتج الأساسي اللي بيبيعوه.
  sentences:
  - أَظْهَرَتْ نَتَائِجُ فَرْزِ العَيِّنَاتِ الإِحْصَائِيَّةِ أَنَّ العَجْزَ فِي المِيزَانِ التِّجَارِيِّ يَعُودُ بِشَكْلٍ
    مُّبَاشِرٍ إِلَى ارْتِفَاعِ فَاتُورَةِ اسْتِيرَادِ مَوَادِّ الطَّاقَةِ.
  - يُفَضَّلُ اسْتِخْدَامُ سَمَّاعَاتِ الرَّأْسِ المُحِيطِيَّةِ فِي أَلْعَابِ الشُّوتِر (المُواكَبَةِ لِلْمَعَارِكِ) لِتَحْدِيدِ
    مَكَانِ خُطُوَاتِ الأَعْدَاءِ بِدِقَّةٍ عَالِيَّةٍ.
  - بلاش تغسلي بشرتك بماية سخنة جامد وأنتِ بتستحمي، لأنها بتشيل كل الزيوت الطبيعية اللي بتفرزها البشرة وبتسبب جفاف شديد وظهور
    قشور.
