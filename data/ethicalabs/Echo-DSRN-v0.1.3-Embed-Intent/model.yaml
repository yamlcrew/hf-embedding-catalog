config:
  architectures:
  - EchoModelForSentenceEmbedding
  auto_map:
    AutoConfig: configuration_echo.EchoConfig
    AutoModel: modeling_embedding.EchoModelForSentenceEmbedding
    AutoModelForCausalLM: modeling_echo.EchoForCausalLM
    DSRNScan: triton_scan.DSRNScanTriton
  model_type: echo
  tokenizer_config:
    bos_token: <s>
    eos_token: <|endoftext|>
    pad_token: <|endoftext|>
    unk_token: <unk>
    use_default_system_prompt: false
  chat_template_jinja: "{%- if messages[0]['role'] == 'system' %}\n    {%- set system_message = messages[0]['content'] %}\n\
    {%- else %}\n    {%- set system_message = 'You are Echo-DSRN, created by ethicalabs.ai. You are a helpful assistant.'\
    \ %}\n{%- endif %}\n\n{%- if tools %}\n    {{- '<|system|>\\n' + system_message }}\n    {{- \"\\n\\n# Tools\\n\\nYou are\
    \ a precise routing agent. You have access to the following tools. If a tool is required, output EXACTLY the tool call\
    \ format. If no tool is required, respond conversationally.\\n\\nAvailable tools:\\n<tools>\" }}\n    {%- for tool in\
    \ tools %}\n        {{- \"\\n\" + tool | tojson }}\n    {%- endfor %}\n    {{- \"\\n</tools><|end|>\\n\" }}\n{%- else\
    \ %}\n    {{- '<|system|>\\n' + system_message + '<|end|>\\n' }}\n{%- endif %}\n\n{%- for message in messages %}\n   \
    \ {%- if (message['role'] == \"user\") or (message['role'] == \"system\" and not loop.first) or (message['role'] == \"\
    assistant\" and not message['tool_calls']) %}\n        {{- '<|' + message['role'] + '|>\\n' + message['content'] + '<|end|>\\\
    n' }}\n    {%- elif message['role'] == \"assistant\" %}\n        {{- '<|assistant|>\\n' }}\n        {%- if message['content']\
    \ %}\n            {{- message['content'] }}\n        {%- endif %}\n        {%- if message['tool_calls'] %}\n         \
    \   {%- for tool_call in message['tool_calls'] %}\n                {%- if tool_call['function'] is defined %}\n      \
    \              {%- set tool_call = tool_call['function'] %}\n                {%- endif %}\n                {{- '\\n<tool_call>\\\
    n{\"name\": \"' + tool_call['name'] + '\", \"arguments\": ' + tool_call['arguments'] | tojson + '}\\n</tool_call>' }}\n\
    \            {%- endfor %}\n        {%- endif %}\n        {{- '<|end|>\\n' }}\n    {%- elif message['role'] == \"tool\"\
    \ %}\n        {%- if loop.first or messages[loop.index0 - 1]['role'] != \"tool\" %}\n            {{- '<|user|>\\n' }}\n\
    \        {%- endif %}\n        {{- '<tool_response>\\n' + message['content'] + '\\n</tool_response>' }}\n        {%- if\
    \ loop.last or messages[loop.index0 + 1]['role'] != \"tool\" %}\n            {{- '<|end|>\\n' }}\n        {%- endif %}\n\
    \    {%- endif %}\n{%- endfor %}\n\n{%- if add_generation_prompt %}\n    {{- '<|assistant|>\\n' }}\n{%- else %}\n    {{-\
    \ eos_token }}\n{%- endif %}\n"
