      [Se kart over området til Spesialsykehuset for epilepsi (SSE) i Sandvika (pdf)](https://ehandboken.ous-hf.no/document/135563)


      ### Parkering ved Spesialsykehuset for epilepsi (SSE)


      Det finnes flere uteplasser på sykehusområdet. Avgiftstiden er alle dager og hele døgnet.


      [Se kart over sykehuset for parkeringsplasser](https://ehandboken.ous-hf.no/api/File/GetFileDocument?entityId=231042)
      (ehandboken.ous-hf.no).


      #### Foreldreparkering


      Foreldre og foresatte eller ledsagere til barn som er innlagt på SSE, kan parkere uten avgift på ansattplassene. Forutsetningen
      er at barnet er under 18 år, er innlagt på sykehuset og du har fått tillatelse fra OUS. OUS gir én tillatelse per pasient.
      Det kan i perioder være begrenset parkeringskapasitet ved sykehuset, og du vil måtte lete etter en ledig plass også
      utenfor hovedområdet rundt parkeringshuset.


      - Parker bilen din og ta kontakt med behandlende enhet for å få en bekreftelse på innleggelsen til barnet.

      - Følg instruksjonene du får utlevert av avdelingen for å registrere foreldreparkering.

      - Det er ikke nødvendig å legge frem synlig billett i vindusruten. Registreringsnummeret ditt blir elektronisk registrert,
      og du får en kvittering på SMS om du legger igjen telefonnummeret ditt.

      - Allerede betalt parkering blir ikke refundert av sykehuset.

      - Tillatelsen er gyldig i 14 dager. Det er ditt ansvar å se til at tillatelsen er gyldig før du parkerer.


      Vi gir ikke ut tillatelser til pasienter som skal på dagbehandling eller polikliniske timer. Dette gjelder selv om pasienten
      går til daglige eller hyppige behandlinger.


      #### Andre pårørende og følgepersoner


      Andre pårørende og følgepersoner vil måtte søke refusjon via Pasientreiser eller parkeringstillatelse for forflytningshemmede
      hos sin kommune.


      #### Forflyttingshemmede


      Hvis du har et gyldig parkeringsbevis for forflytningshemmede, kan du bruke reserverte plasser strategisk plassert rundt
      på området. I tillegg kan alle betalingsplassene på uteområdene bli brukt uten avgift. Beviset skal være synlig plassert
      i bilen din for kontroll.


      #### Hvordan betale for parkering?


      [Se denne siden for priser, koder og mer informasjon](/om-oss/parkering-pa-oslo-universitetssykehus) .


      ### Kollektivtransport til SSE


      #### T-bane nr. 3


      T-bane nr. 3, Kolsås - Mortensrud. Stoppested: Gjettum eller Avløs.  Det er 10-15 minutters gange fra stoppestedene
      til SSE. Veien til og fra Gjettum har et svært bratt og gruslagt parti, Lindelia. Vi anbefaler derfor Avløs stasjon
      til deg som er dårlig til bens eller bruker rullestol.


      #### Buss 130 Sandvika-Skøyen


      Gå av på Solberg, som er stoppestedet nærmest SSE. Busslinje 130 kjører mellom Sandvika og Skøyen. Videre fra Skøyen
      mot Oslo sentrum til kan du ta følgende:


      - Trikk 13 til og fra Jernbanetorget

      - Buss 31 til og fra Jernbanetorget

      - Tog til Nationaltheatret eller Oslo S


      #### Buss til Valler skole


      Fra Sandvika går flere busser til Valler skole:


      - Buss 160 Rykkin - Oslo bussentral.

      - Buss 220 Sandvika - Bekkestua.

      - Buss 215 Kolsås - Sandvika.


      [Se ruter.no for rutetider](http://www.ruter.no/) .


      #### Tog


      Sandvika stasjon er nærmeste stoppested for tog. Busstasjonen ligger like ved. Du kan ta buss 130 til Solberg stoppested
      ved SSE.


      #### Hvor langt er det?


      - Avstanden fra Gardermoen - SSE er omlag 65 km.

      - Avstanden fra Sandvika - SSE er omlag 2 km.


      ### Pasientreiser


      Har du vært til behandling, kan du søke om å få pengestøtte til reisen. Trenger du tilrettelagt transport for å komme
      til behandling, kan du ha rett til å få en organisert reise.


      [Les mer om hvordan du søker om å få betalt pasientreise og vilkår for å få dette innvilget](/dine-rettigheter/pasientreiser)


      ## Praktisk informasjon


      ### Dette må du huske å ta med


      - Toalettsaker, privat tøy, innesko og gymtøy.

      - Pysj, genser eller skjorte med knapper eller glidelås helt ned for EEG døgnregistrering.

      - Uteklær til all slags vær. Fine ute-, frilufts- og lekemuligheter heler året.

      - Ekstra klesskift


      Vaskemaskin og tørketrommel finnes på sengeenhetene.


      Verdisaker eller utstyr som kommer bort under oppholdet er avdelingen ikke erstatningspliktig for. Skades briller eller
      annnet nødvendig utstyr ved uhell under oppholdet, erstattes dette.


      ### Dette må du huske å ta med til barnet


      - Vogn og andre hjelpemidler hvis mulig.

      - Libero- og Tena-bleier finnes på sengepostene. Andre typer bleier må tas med for de 2-3 første dagene. Deretter bestiller
      vi fra apoteket på den resepten dere har.

      - Hvis barnet bruker sondemat og spesialmat: Dette bestilles når dere kommer, men det kan ta 2-3 dager. Ta derfor med
      mat til de første dagene. Ta med mellomstykker og slanger til hele oppholdet.

      - Vaskemaskin og tørkeskap finnes på alle sengepostene.

      - Toalettsaker, privat tøy, innesko og gymtøy.

      - Pysj, genser eller skjorte med knapper eller glidelås helt ned for E E G døgnregistrering.

      - Uteklær til all slags vær. Fine ute-, frilufts- og lekemuligheter hele året.

      - Ekstra klesskift'
