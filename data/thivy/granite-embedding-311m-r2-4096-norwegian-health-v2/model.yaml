    ### Særlig om rutiner for å forebygge alvorlige hendelser i forbindelse med matallergi i barnehager og skoler


    ### Særlig om rutiner for å forebygge alvorlige ulykker i forbindelse med soving i barnehage


    Regelverk (lov eller forskrift)

    Veileder til lov og forskrift inneholder fortolkning og veiledning til lov- og forskriftsbestemmelser

    § 14 . Beredskap, førstehjelp og sikkerhetsutstyr Virksomheten skal ha planer og rutiner for å forebygge og håndtere skader,
    ulykker, overgrep og andre alvorlige hendelser. Rutinene skal være kjent for virksomhetens ansatte, barn og elever. Virksomhetens
    ansatte skal ha tilstrekkelig opplæring i og kunnskap om hvordan førstehjelp ytes. Virksomheten skal ha førstehjelpsutstyr
    og annet sikkerhetsutstyr for håndtering av ulykkes- og faresituasjoner. Utstyret skal være forsvarlig plassert. Virksomhetens
    ansatte, barn og elever skal være kjent med hvor førstehjelps- og sikkerhetsutstyret er plassert og skal ha tilpasset
    opplæring i bruk av utstyret. *Forskrift om helse og miljø i barnehager, skoler og skolefritidsordninger § 14* Kilde:
    lovdata.no

    Virksomheten har ansvar for barnas og elevenes sikkerhet hele tiden de er i barnehagen eller på skolen, enten de befinner
    seg på barnehagens eller skolens inne- og uteområder, eller på utflukter.

    Forskriften stiller krav om at virksomheten skal ha planer og rutiner for å forebygge og håndtere skader, ulykker, overgrep
    og andre alvorlige hendelser. Eksempler på andre alvorlige hendelser er alvorlige voldsepisoder, brann, skyteepisoder
    og gisselsituasjoner. Virksomhetens planer og rutiner må bygge på en risiko- og sårbarhetsanalyse, og inngå i virksomhetens
    internkontrollsystem. Det vises til [rundskriv I-6/2015 om Beredskap i barnehager og skoler (regjeringen.no)](https://www.regjeringen.no/contentassets/d0021d8877274df4bf64871de82304b1/rundskriv---beredskap-i-skoler-og-barnehager.pdf)
    .

    For informasjon om barnehagenes og skolenes ansvar for å forebygge alvorlige hendelser, se også [veiledning fra Utdanningsdirektoratet
    (udir.no)](https://www.udir.no/kvalitet-og-kompetanse/sikkerhet-og-beredskap/veileder-i-beredskapsplanlegging/) .

    Det må foreligge rutiner for å forhindre alvorlige skader og ulykker, herunder kvelning, drukning, forgiftning, fallulykker
    og trafikkulykker. Barnehager og skoler må ha rutiner for registrering og oppfølging av ulykker, skader og nestenulykker.
    Erfaringer fra hendelser bør inngå i barnehagens og skolens arbeid med internkontroll, [se veiledning til § 18](https://www.helsedirektoratet.no/veiledere/helse-og-miljo-i-barnehager-skoler-skolefritidsordninger/godkjenning-internkontroll-tilsyn-og-klage/18-internkontroll)
    .

    Barnehagene og skolene skal også ha internkontroll for å ivareta sikkerheten ved lekeplassutstyr. Direktoratet for samfunnssikkerhet
    og beredskap fører tilsyn med forskrift om sikkerhet ved lekeplassutstyr.

    Rutinene skal være kjent for virksomhetens ansatte, barnehagebarn og elever.

    Beredskapsplanlegging i barnehager og skoler må også ses i sammenheng med kommunens øvrige arbeid med samfunnssikkerhet
    og beredskap. Kommunen har plikt til å vurdere risiko og sørge for god beredskap i samarbeid med barnehagene og skolene.
    Beredskapsplaner må hensynta barn og elever med ulike funksjonsnedsettelser som nedsatt syn eller hørsel og redusert bevegelsesevne
    ved evakuering, og sikre gode rutiner for kommunikasjon med hørselshemmede i en evakueringssituasjon.

    Barnehager og skoler skal ha førstehjelpsutstyr og annet sikkerhetsutstyr for håndtering av ulykkes- og faresituasjoner.
    Utstyret skal være forsvarlig og hensiktsmessig plassert.

    Med sikkerhetsutstyr menes utstyr som gjør at virksomheten er i stand til å forebygge og håndtere ulykker og alvorlige
    hendelser på en god og effektiv måte. For eksempel varslingsutstyr, redningsutstyr, rømningsutstyr, brannslokkingsutstyr,
    komfyrvern, stikkontaktvern og trappesikring. Telefon bør være enkelt tilgjengelig på barnehagens og skolens område og
    på utflukter for å kunne varsle om ulykke, skade eller nødsituasjon i henhold til virksomhetens varslingsrutiner.

    For krav til sikkerhetsutstyr for vern mot brann, plassering og merking vises det til Brann og eksplosjonsvernloven med
    tilhørende forskrifter.

    Førstehjelpsutstyret skal være tilpasset aktivitetene i barnehagen og skolen, og må være tilgjengelig til enhver tid,
    også på utflukter. Tilstrekkelig mengde førstehjelpsutstyr må ses i forhold til størrelsen og utformingen av lokalene,
    og antall barn og elever. Førstehjelpsutstyret må være komplett, og må kontrolleres, også holdbarhetsdato.

    [For håndtering av legemidler i barnehage, skole og skolefritidsordning, se eget rundskriv (regjeringen.no)](https://www.regjeringen.no/no/dokumenter/handtering-av-legemidler-i-barnehage-sko/id516373/)
    .

    Hvilken type førstehjelpsutstyr det er fornuftig å skaffe må baseres på en risikovurdering. Førstehjelpsutstyret bør inneholde
    utstyr tilpasset skader som normalt forekommer i norske barnehager og skoler.

    Virksomhetens ansatte, barnehagebarn og elever skal være kjent med hvor førstehjelps- og sikkerhetsutstyret er plassert
    og skal ha tilpasset opplæring i bruk av utstyret. Dette omfatter også opplæring i hvordan ivareta egen sikkerhet og når
    man skal varsle nødetatene.

    Sikkerhetskompetanse omfatter blant annet kompetanse i livredning, brannvern og førstehjelp. For krav til kunnskap og
    ferdigheter kompetanse hos ansatte, barn og elever når det gjelder brannslukking og korrekt opptreden ved brann vises
    det til Brann- og eksplosjonsvernloven med tilhørende forskrifter.

    For veiledning om krav og anbefalinger om forsvarlig svømmeopplæring, se [svømmedyktig.no](https://svommedyktig.no/) .

    Virksomhetens ansatte skal ha tilstrekkelig opplæring i, og kunnskap om, hvordan førstehjelp ytes. Dette gjeldet også
    vikarer og praktikanter.

    I tillegg til virksomhetens ansatte bør voksne som har regelmessig tilknytning til barnehagen eller skolen, for eksempel
    ansatte i helsestasjon og skolehelsetjenesten, pedagogisk-psykologisk tjeneste (PPT) og andre være kjent med hvor førstehjelpsutstyret
    er plassert, og ha tilstrekkelig førstehjelpsopplæring.

    Hva som ligger i tilstrekkelig førstehjelpsopplæring og kunnskap må være basert på en risikovurdering og tilpasses den
    enkelte virksomhet. Generelt bør førstehjelpsopplæring til ansatte i barnehager og skoler omfatte:

    - varsling medisinsk nødtelefon

    - sikring av frie luftveier ved nedsatt bevissthet og førstehjelp ved fremmedlegeme i nese/luftveier

    - basal hjerte-lungeredning (HLR)

    - førstehjelp ved forgiftning

    - førstehjelp ved giftige bitt eller stikk

    - førstehjelp ved skader

    - førstehjelp ved sykdom herunder også alvorlig allergisk reaksjon

    Kravet til førstehjelpsopplæring og kompetanse må til enhver tid være oppfylt.

    Barn og elever skal ha tilpasset opplæring i bruk av førstehjelpsutstyret. Røde Kors har utviklet et eget pedagogisk læringsopplegg
    for barn 3-8 år, [Henry - førstehjelp for barn fra Røde Kors (rodekors.no)](https://www.rodekors.no/forstehjelp/forstehjelp-for-barn/)
    som kan benyttes til dette formålet. Målet er å lære barn i barnehagen og barneskolen førstehjelp.

    Som en del av den nasjonale dugnaden «Sammen redder vi liv» leder LHL prosjektet [nasjonal førstehjelpsopplæring i grunnskolen
    (lhl.no)](https://www.lhl.no/kampanje/sammen-redder-vi-liv/) .

    Skolene og barnehagene bør sørge for grundig opplæring i håndtering av alvorlige allergiske reaksjoner for å sikre at
    alle ansatte både kan forhindre, gjenkjenne og behandle alvorlige allergiske reaksjoner. Helsedirektoratet har utarbeidet
    nasjonale faglige råd som omhandler [matallergi i barnehager og skoler](https://www.helsedirektoratet.no/faglige-rad/matallergi-i-barnehager-og-skoler)
    med konkrete anbefalinger for hvordan alvorlige matallergier hos barn kan og bør håndteres.

    Barnehagen må sørge for at barnas sikkerhet og trygghet ivaretas til enhver tid, både ved aktivitet, hvile og når barn
    i barnehagen sover.

    Alvorlige ulykker under soving forekommer. Barnehagen må risikovurdere forhold som kan forekomme i sovesituasjoner, og
    ha nødvendige planer og rutiner for å forebygge ulykker i forbindelse med soving i barnehagen, som del av virksomhetens
    internkontroll.

    Rutiner for sovesituasjonen må vurderes konkret og være tilpasset den faktiske sovesituasjonen, enten dette er soving
    ute eller inne, i barnevogn, på madrass eller i hengekøye.

    Barnehagen må sørge for at barna har nødvendig tilsyn som ivaretar barnas sikkerhet til enhver tid. Ytre omstendigheter
    som vind eller lav temperatur, mistanke om begynnende sykdom, uro eller at barnet oppfører seg annerledes enn det pleier,
    kan være faktorer som virker inn på hva som er nødvendig tilsyn.


    ## Rettslig grunnlag


    - [Forskrift om helse og miljø i barnehager, skoler og skolefritidsordninger (lovdata.no)](https://lovdata.no/dokument/SF/forskrift/2023-03-28-449)

    - [Rundskriv I-6/2015 om Beredskap i barnehager og skoler (regjeringen.no)](https://www.regjeringen.no/contentassets/d0021d8877274df4bf64871de82304b1/rundskriv---beredskap-i-skoler-og-barnehager.pdf)

    - [Rundskriv om håndtering av legemidler i barnehage, skole og skolefritidsordning (regjeringen.no)](https://www.regjeringen.no/no/dokumenter/handtering-av-legemidler-i-barnehage-sko/id516373/)

    - [Forskrift om sikkerhet ved lekeplassutstyr (lovdata.no)](https://lovdata.no/dokument/SF/forskrift/1996-07-19-703)'
  - '# Multifunksjonshemming


    Barn og elevar med multifunksjonshemming har vanlegvis ein kombinasjon av djup eller alvorleg utviklingshemming og éin
    eller fleire funksjonsnedsetjingar.

    Artikkel Sist endret: 22.05.2024 [Last siden som PDF](/api/PdfApi/PrintPageAsPdfDocument/212376)

    De som jobbar i barnehagar og skular, bør vite kva som kjenneteiknar multifunksjonshemming, og korleis de best mogleg
    kan leggje til rette for kvart enkelt barn eller kvar enkelt elev.


    ## Kva er multifunksjonshemming?


    Barn og elevar med multifunksjonshemming har nedsett funksjon på fleire område. Dei har djup eller alvorleg utviklingshemming
    kombinert med andre vanskar, sjukdommar og/eller sanserelaterte funksjonsnedsetjingar.


    Vanlege døme er


    - cerebral parese

    - epilepsi

    - nedsett syn

    - nedsett høyrsel

    - ernæringsproblematikk


    Kombinasjonen av vanskar gjer at kvar enkelt vanske blir forsterka, noko som skaper store utfordringar på alle livsområde.


    Barn og elevar med multifunksjonshemming treng mykje oppfølging og støtte for å utnytte ressursane sine. Dei strevar i
    stor grad med å kommunisere eigne behov og tankar og med å delta i praktiske og sosiale aktivitetar. Barn og elevar med
    multifunksjonshemming kommuniserer som regel via kroppslege uttrykk og partnartolking.


    Også annan [alternativ og supplerande kommunikasjon (ASK)](/laring-og-trivsel/spesialpedagogikk/alternativ-og-supplerende-kommunikasjon-ask)
    er aktuelt. Dei er avhengige av støtte og hjelp i alle samanhengar for å fungere godt i kvardagen, for å få uttrykt sin
    eigen personlegdom og for å dyrke interessene sine.


    ## Kartlegging og utgreiing av barn og elevar med multifunksjonshemming


    Eit barn med multifunksjonshemming får diagnosane sine frå spesialisthelsetenesta. Det er fastlegen som tilviser barnet
    til habiliteringstenesta ved eit sjukehus. Nokre diagnosar blir stilte allereie rett etter fødselen.


    For at de skal kunne følgje opp barnet eller eleven, er det viktig å kartleggje funksjonsnivået. Dersom de har kunnskap
    om forståinga, synet, høyrselen og sjukdomstilstandane til barnet eller eleven, har de eit godt grunnlag for å kunne leggje
    godt til rette.


    PP-tenesta har ansvar for å gjere ei sakkunnig vurdering av behovet for pedagogisk tilrettelegging i barnehage eller skule.
    For å kunne gjere dette må PP-tenesta innhente opplysningar om syn, høyrsel, kognitiv fungering og generell helsetilstand
    frå helsetenestene.


    ## Tilrettelegging for barn og elevar med multifunksjonshemming


    Barn og elevar med multifunksjonshemming har behov for å vere ein del av barnegruppa og klassen. I nokre situasjonar vil
    likevel eit fellesskap som består av to (lærar og elev), vere rett. Behova til barnet eller eleven er det avgjerande for
    korleis de organiserer kvardagen.


    De må hjelpe barnet eller eleven med å få sosial tilhøyrsel i barnegruppa eller klassen. De kan leggje til rette både
    måltid, leik og planlagde aktivitetar slik at dei passar for alle barna eller elevane. Planlegg slik at barnet eller eleven
    med multifunksjonshemming får lære i fellesskapet, og legg opp til aktivitetar som inkluderer fleire. Dette kan til dømes
    vere musikkstunder, badeaktivitetar og multisensoriske gruppeaktivitetar.


    ### Leggje til rette det fysiske miljøet


    Mange barn eller elevar med multifunksjonshemming har behov for rullestol eller andre hjelpemiddel til å ta seg fram med.
    Dei treng derfor store rom og breie korridorar, heisar og døropningar, og eit miljø som er tilrettelagt for rullestolar.


    Mange av desse barna og elevane har òg behov for møblar som kan støtte kroppen deira, som beanbagstolar, madrassar og
    store aktivitetssenger med støtteputer.


    #### Visuelt miljø


    Mange barn og elevar med multifunksjonshemming har nedsett synsfunksjon og strevar med å tolke synsinntrykk. Eit tilrettelagt
    visuelt miljø vil gjere det enklare for dei å tolke synsinntrykk. Tre faktorar som bidreg til eit godt visuelt miljø,
    er


    - god belysning

    - bruk av kontrastfremjande fargar

    - at ingen blir blenda av lyset


    I tillegg kan det vere lurt å redusere visuell støy, slik at det som er viktig å sjå, blir meir synleg. Dersom de treng
    hjelp for å leggje til rette det visuelle miljøet, kan de be om hjelp frå PP-tenesta.


    #### Lydmiljø


    Mange barn og elevar med multifunksjonshemming har òg [nedsett høyrsel.](/laring-og-trivsel/spesialpedagogikk/spesialpedagogiske-fagomrader/nedsatt-horsel)
    Gode tiltak for barn og elevar med nedsett høyrsel handlar ofte om å skape eit tilgjengeleg og godt lyd- og språkmiljø
    og om å redusere usikker og anstrengd lytting. Aktuelle tiltak kan vere at de


    - utbetrar rom for å sikre tilfredsstillande akustikk og etterklangstid

    - reduserer støy med knottar under stolar og mjuke overflater på bord

    - varierer klasse- og gruppeorganiseringa i leik og arbeidssituasjonar

    - sørgjer for best mogleg tilgang til lyd, visuell oversikt og blikkontakt med den som snakkar

    - bruker hjelpemiddel som personlege samtaleforsterkarar, mikrofonar og høgtalarar i situasjonar der det er relevant,
    som i samlingsstunder og undervisningssituasjonar

    - øver på å skape gode samtalestrukturar, der éin i gruppa snakkar om gongen

    - bruker visuell støtte og konkretar i arbeidssituasjonar og læringsaktivitetar


    ### Berøring og rørsle


    Berøring og rørsle er òg viktige sanseerfaringar for å lære. Det kan vere vanskeleg for desse barna og elevane å regulere
    sin eigen kropp. Mange er avhengige av tett fysisk nærleik med andre for å kjenne seg trygge og kunne kommunisere.


    Barna eller elevane må ha høve til å flytte seg ut av til dømes rullestol eller anna hjelpemiddel og over på ei aktivitetsseng
    eller ein madrass, og til å utfalde seg kroppsleg på eigne premissar.


    ### Tverrfagleg samarbeid


    Barn og elevar med multifunksjonshemming har behov for mykje støtte, og dei treng ofte lindring frå smerte og ubehag.
    Dei fleste vil trenge støtte frå eit tverrfagleg team.


    De bør vurdere om de har behov for helsefagleg kompetanse for å dekkje behova til barnet eller eleven, for å gi støtte
    i leik og læring og for å kunne handtere epileptiske anfall, medisinering, ernæring og vedlikehaldstrening av rørsleevna.


    Det er nødvendig med eit nært samarbeid mellom føresette, hjelpeinstansar og barnehage eller skule. Aktuelle samarbeidspartnarar
    vil vere PP-tenesta, fysioterapeut, ergoterapeut og lege. Dette laget rundt barnet eller eleven vil òg kunne trenge oppfølging
    eller rettleiing frå andre sentrale instansar, som spesialisthelsetenesta.


    Familien har rett til ein kommunal koordinator av tenester (barnekoordinator). Koordinatoren skal samordne det samla tenestetilbodet,
    gi informasjon til familien, setje i verk arbeidet med ein individuell plan (IP) og vareta kommunen sitt ansvar for oppfølging
    og tilrettelegging.


    Målet for det tverrfaglege samarbeidet er å kunne gi barnet eller eleven


    - tryggleik

    - eit inkluderande miljø som skaper tilhøyrsel til ei barnegruppe og inviterer til deltaking i rutinar, leike-aktivitetar
    og sosiale aktivitetar

    - eit aktivitetsbasert læringsmiljø som utviklar barnet eller eleven sine kunnskapar og ferdigheiter

    - eit sosialt miljø som fremjar kommunikasjon, deltaking og aktivitet

    - eit fysisk miljø som er tilrettelagt for at barnet eller eleven kan ta seg fram og utfalde seg kroppsleg

    - eit visuelt miljø som fremjar synsaktivitet, deltaking og opplevingar

    - eit lydmiljø som fremjar lytting, deltaking og opplevingar

    - eit opplevingsmiljø som inviterer til nysgjerrigheit og engasjement


    For at barnet skal få eit tilfredsstillande barnehage- og skuletilbod, bør det vere god samanheng mellom måla i den individuelle
    utviklingsplanen (IUP) eller individuelle opplæringsplanen (IOP) og den individuelle planen (IP).


    PP-tenesta kan få hjelp av Statped til å rettleie barnehagar og skular.


    ### Individuell tilrettelegging


    Elevar har rett til [individuell tilrettelegging](/laring-og-trivsel/spesialpedagogikk/individuell-tilrettelegging) viss
    dei treng det for å få tilfredsstillande utbytte av opplæringa.


    Barn under opplæringspliktig alder har rett til [spesialpedagogisk hjelp](/laring-og-trivsel/spesialpedagogikk/spesialpedagogisk-hjelp)
    dersom dei har behov for det.


    Les meir: [Tilrettelegging for barn og elever med behov for ekstra støtte](/laring-og-trivsel/spesialpedagogikk/tilrettelegging-for-barn-og-elever-med-behov-for-ekstra-stotte)


    [Statped har nyttige tiltak for barn og elevar med multifunksjonshemming](https://www.statped.no/multifunksjonshemming/)'
  - '# Spesialsykehuset for epilepsi (SSE)


    Vi er her for deg som ikke får anfallskontroll av epilepsimedisiner. Uansett hvor du bor i landet kan du henvises til
    utredning og behandling hos oss. Vi hjelper deg å få stilt riktig diagnose og finner den beste behandlingen for din epilepsi.
    Velkommen til SSE, landets eneste spesialsykehus for epilepsi, fast og sentralt medlem av Europeisk nettverk for sjeldne
    og komplekse epilepsier, EpiCARE.


    ## Les mer om Spesialsykehuset for epilepsi (SSE)


    SSE er et høyspesialisert epilepsisenter. Vi er fast og sentralt medlem av et [Europeisk nettverk for sjeldne og komplekse
    epilepsier, EpiCARE](https://epi-care.eu/) . Det betyr at våre pasienter har, når det er behov for det, tilgang til all
    europeisk ekspertise på dette feltet.


    ### Parkering på SSE


    - Ved innleggelse skal du møte direkte på posten du er innkalt til. Se informasjon i innkallingsbrevet.

    - I 2022 ble det innført parkeringsavgift på SSE.

    - Det gjelder egne regler for foresatte som følger barn ved innleggelse. Ved spørsmål kan sengepost for barn kontaktes.


    [Parkeringsreglement på SSE](/steder/sse-sandvika/#parkering)


    ### Kart over SSE


    [SSE - Kart over sykehusområdet (pdf)](https://ehandboken.ous-hf.no/document/135563)


    [SSE - Kart på Googlemaps](https://www.google.no/maps/place/SSE/@59.9053507,10.5355233,17z/data=!3m1!4b1!4m5!3m4!1s0x464113409a55bc6b:0x460744a31401f9f2!8m2!3d59.9053507!4d10.537712)


    ### Henvisninger til Spesialsykehuset for epilepsi (SSE)


    [Henvisningskriterier og mer om våre nasjonale behandlingstjenester](/avdelinger/nevroklinikken/spesialsykehuset-for-epilepsi-sse/henvisning-til-nasjonale-behandlingstjenester-ved-spesialsykehuset-for-epilepsi-sse)


    ### Informasjon fra fagteamene ved SSE


    [Diett-teamet](/avdelinger/nevroklinikken/spesialsykehuset-for-epilepsi-sse/ketogen-diett)


    [Farmakologi-teamet](/avdelinger/nevroklinikken/spesialsykehuset-for-epilepsi-sse/farmakologi-teamet-ved-sse)


    [Kirurgi-teamet](/avdelinger/nevroklinikken/spesialsykehuset-for-epilepsi-sse/kirurgiteamet-ved-sse)


    [FDS-teamet](/avdelinger/nevroklinikken/spesialsykehuset-for-epilepsi-sse/psykogene-ikke-epileptiske-anfall-pnes)


    ### Undervisning om epilepsi, kurs og e-læringer


    Du og dine pårørende får undervisning i epilepsi under oppholdet ved SSE. E-læringskurs og filmer er en del av undervisningen.
    Pårørende og helsepersonell fra hele landet kommer til SSE for å delta på kurs.


    [Les alt om kurs, undervisning og e-læringer om epilepsi](/avdelinger/nevroklinikken/spesialsykehuset-for-epilepsi-sse/kurs-og-undervisning-om-epilepsi)


    ### Kunnskapsbasert retningslinje om epilepsi


    Kunnskapsbasert retningslinje om epilepsi er tilgjengelig i appen «Metodebok» fra Helse Sør-Øst.


    [Retningslinjen ligger også på www.epilepsibehandling.no](http://www.epilepsibehandling.no/)


    Slik finner du appen i App store/Play Store:


    1. Last ned appen «Metodebok» 2. Fyll ut opplysningene og velg «Legg til bøker» 3. Finn og marker boken «Epilepsi SSE/OUS»


    4. Trykk «Last ned bøker»


    ### SSE er et fullverdig medlem av EpiCare


    Fra 2022 er spesialsykehuset som senter et fullverdig medlem av det europeiske referansenettverket EpiCARE. Dette gir
    mulighet for en bedring av utredning, diagnostisering og behandling av mennesker med sjeldne og komplekse epilepsier,
    ifølge forskningssjef Morten Lossius. SSE ble akseptert i hard konkurranse med andre store sentre i Europa.


    #### Viktig nettverk for fagpersoner


    SSE styrker sin posisjon som nasjonalt senter for kompleks epilepsi og blir et kontaktledd for alle norske spesialister
    som ønsker å diskutere pasient-caser fagpersoner i EpiCARE.


    [Gå til epi-care.eu](https://epi-care.eu/)


    [Les mer i artikkelen: Spesialsykehuset for epilepsi er nytt medlem i europeisk medisinsk nettverk.](/avdelinger/nevroklinikken/spesialsykehuset-for-epilepsi-sse/spesialsykehuset-for-epilepsi-er-nytt-medlem-i-europeisk-medisinsk-nettverk)


    ### Tall fra SSE


    [Gå til årsrapporter fra Nasjonale behandlingtjeneste for kompleks epilepsi og Regional kompetansetjeneste for epilepsi
    og autisme](/avdelinger/nevroklinikken/spesialsykehuset-for-epilepsi-sse/tall-fra-sse)


    ### Motta vårt nyhetsbrev og følg oss på Facebook


    Ønsker du aktuelt stoff om vår forskning, fagutvikling, undervisning og nasjonale behandlingstilbud? Meld deg på vårt
    nyhetsbrev.  Brevene kommer ut 4 til 6 ganger i året.


    [Gå til påmelding for nyhetsbrev fra SSE](https://pub.dialogapi.no/s/d89d0252-e39d-4223-b6fc-5ded8a7d8c2a)


    SSE er på Facebook med informasjon til landets fag- og helsepersonell og alle andre interesserte.


    - [Gå til Facebook-siden til SSE](https://www.facebook.com/spesialsykehusetforepilepsi/)

    - [FarmakologiSSE@ous-hf.no](mailto:FarmakologiSSE@ous-hf.no)


    ## [SSE flytter til Rikshospitalet etter 2031](/om-oss/nyheter/sse-flytter-til-rikshospitalet-etter-2031)


    [Spesialsykehuset for epilepsi (SSE) flytter samlet til Nye Rikshospitalet/Gaustad etter 2031. Det er klart etter gårsdagens
    styremøte i Helse Sør-Øst RHF, hvor det ble besluttet å gå videre til konseptfaseutredning av andre utbyggingstrinn i
    Oslo universitetssykehus](/om-oss/nyheter/sse-flytter-til-rikshospitalet-etter-2031)


    [Les mer i nyhetssaken](/om-oss/nyheter/sse-flytter-til-rikshospitalet-etter-2031)


