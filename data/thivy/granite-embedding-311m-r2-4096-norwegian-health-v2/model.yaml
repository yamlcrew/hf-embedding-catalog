  - '# Tidlig infantil utviklingsmessig og epileptisk encefalopati


    Tidlig infantil utviklingsmessig og epileptisk encefalopat er en alvorlig form for epilepsi som starter i løpet av de
    tre første månedene etter fødsel. Pasientene har ofte forsinket psykomotorisk utvikling og hyppige epileptiske anfall
    som er vanskelig å behandle.


    ## Hva er tidlig infantil utviklingsmessig og epileptisk encefalopati?


    Tidlig infantil utviklingsmessig og epileptisk encefalopati er et nytt begrep som inkluderer epilepsiene som tidligere
    ble kalt ohtahara syndrom og tidlig myoklon encefalopati. På engelsk kalles tilstanden for Early-infantile developmental
    and epileptic encehpalopathy (EIDEE).


    Dette er en sjelden form for epilepsi som antas å ramme 10 / 100 000 levendefødte.


    ## Symptomer på tidlig infantil utviklingsmessig og epileptisk encefalopati


    De epileptiske anfallene starter i alder 0-3 måneder. Barnet kan ha flere ulike typer anfall. De vanligste anfallstypene
    er:


    - fokale toniske anfall (tilstivning i en del av kroppen)

    - generaliserte toniske anfall (tilstivning i hele kroppen)

    - fokale kloniske anfall (rykninger i en del av kroppen)

    - myoklonier

    - epileptiske spasmer.


    Anfallene kommer ofte i klynger.


    Barnet har forsinket utvikling som enten er tydelig før anfallene starter eller blir merkbar kort tid etter anfallene
    starter.


    Mange har også ikke-epileptiske ufrivillige bevegelser som «rykk» (myoklonier), chorea, dystonier og tremor.


    Tilleggsvansker som slapphet i muskulaturen, redusert motorikk, kortikal blindhet, atferdsvansker og vansker med inntak
    av mat er vanlig.


    ## Årsaker til tidlig infantil utviklingsmessig og epileptisk encefalopati


    Hos om lag 80% kan man finne en årsak til sykdommen. Det er ulike årsaker til tidlig infantil utviklingsmessig og epileptisk
    encefalopati.


    - [Genetiske endringe](/sjeldne-diagnoser/arvelige-tilstander) r (mutasjoner, kromosomforandringer, kopitallsvarianter).

    - Medfødte strukturelle forandringer i hjernen som sees på MR-bilder. Disse kan igjen være forårsaket av en genetisk forandring.

    - Metabolske sykdommer (stoffskiftesykdommer). Disse har vanligvis en genetisk årsak.


    Selv om det ofte dreier seg om genetiske årsaker, er disse vanligvis nyoppstått hos barnet og ikke arvet fra foreldrene.


    ## Utredning og diagnose


    Alle barn bør utredes med MR av hjernen, EEG (elektroencefalografi), genetisk undersøkelse og evt metabolsk undersøkelse.


    Diagnosen tidlig infantil utviklingsmessig og epileptisk encefalopati stilles på bakgrunn av funn i EEG og type anfall.
    EEG viser alltid mye epileptiske aktivitet og har ofte et bestemt mønster som kalles «burst suppression».


    ## Behandling


    Det er ofte begrenset effekt av behandling med vanlige [epilepsimedisiner.](https://www.oslo-universitetssykehus.no/avdelinger/nevroklinikken/spesialsykehuset-for-epilepsi-sse/epilepsimedisiner-antiepileptika)
    Mange prøver derfor ut ketogen diett eller behandling med vagusnervestimulator.


    Hvis tilstanden har en kjent genetisk eller metabolsk årsak kan enkelte få mer spesifikk behandling. Eksempler på dette
    er:


    - Tilstander forårsaket av mutasjon i genene SCN2A eller SCN8A, der epilepsimedisiner som virker med natriukanalblokade
    (eks karbamazepin) kan ha effekt.

    - Metabolske tilstander med spesifikk behandling, eks pyridoksinavhengig epilepsi.

    - Enkelte med medfødte forandringer i hjernen kan behandles med operasjon.

    - Ved epileptiske spasmer kan steroider ha effekt.


    ## Prognose


    Tidlig infantil utviklingsmessig og epileptisk encefalopati er en svært alvorlig form for epilepsi. Alle som rammes har
    en forsinket utvikling, og de fleste vil utvikle en moderat, alvorlig eller dyp utviklingshemming.


    Prognosen er som regel dårlig og det er økt risiko for tidlig død.


    ## Å leve med


    På grunn av sykdommens alvorlige natur har familiene til barn med tidlig infantil utviklingsmessig og epileptisk encefalopati
    ofte et stort behov for informasjon om sykdommen, generell tilrettelegging og rettigheter.


    Fagpersoner som er i kontakt med familiene kan også ha behov for støtte og kunnskap.


    ## Få hjelp og støtte


    Det kan være en viktig støtte for familien å komme i kontakt med andre familier som har barn med samme, eller lignende,
    diagnose. Tidlig infantil utviklingsmessig og epileptisk encefalopati har ingen egen brukerforening, men [Nasjonalt senter
    for sjeldne diagnoser, enhet hjernesykdommer](https://www.oslo-universitetssykehus.no/avdelinger/barne-og-ungdomsklinikken/avdeling-for-sjeldne-diagnoser/sjeldensenteret-hjernesykdommer)
    kan formidle kontakt med en likeperson.


    I tillegg finnes [Epilepsiforbundet](https://www.epilepsi.no/) som er en landsdekkende, uavhengig interesseorganisasjon
    for mennesker med epilepsi, deres pårørende og andre.


    ## Kunnskapsbasert retningslinje om epilepsi


    - [Retningslinjen gir helsepersonell, pasienter og pårørende råd og anbefalinger om hele epilepsiforløpet (epilepsibehandling.no)](https://epilepsibehandling.no/)


    ## Mer informasjon på nettsiden til det nasjonale senteret


    Du finner mer informasjon om tidlig infantil utviklingsmessig og epileptisk encefalopati på nettsiden til Nasjonalt senter
    for sjeldne diagnoser, enhet hjernesykdommer.


    [Tidlig infantil utviklingsmessig og epileptisk encefalopati (oslo-universitetssykehus.no)](https://www.oslo-universitetssykehus.no/avdelinger/barne-og-ungdomsklinikken/avdeling-for-sjeldne-diagnoser/sjeldensenteret-hjernesykdommer/tidlig-infantil-utviklingsmessig-og-epileptisk-encefalopati)


    Referanser


    ILAE classification and definition of epilepsy syndromes with onset in neonates and infants: Position statement by the
    ILAE TAS Force on Nosology and Definitions. Epilepsia 2022.


    Innholdet er levert og kvalitetssikret av [Nasjonalt senter for sjeldne diagnoser](/samarbeidspartnere/#nasjonalt-senter-for-sjeldne-diagnoser)


    Slik refererer du til innholdet Nasjonalt senter for sjeldne diagnoser. Tidlig infantil utviklingsmessig og epileptisk
    encefalopati. [Internett]. Oslo: Helsedirektoratet; oppdatert mandag 15. januar 2024 [hentet onsdag 20. mai 2026]. Tilgjengelig
    fra: [https://www.helsenorge.no/sykdom/sjeldne-diagnoser/sjeldne-epilepsidiagnoser/tidlig-infantil-utviklingsmessig-og-epileptisk-encefalopati/](https://www.helsenorge.no/sykdom/sjeldne-diagnoser/sjeldne-epilepsidiagnoser/tidlig-infantil-utviklingsmessig-og-epileptisk-encefalopati/)


    Sist oppdatert 15. januar 2024'
