    - '# Å stille ein sjeldan diagnose


      Mange opplever ein lang og krunglete veg før ein sjeldan diagnose blir stilt. Av og til kjem ikkje legen fram til ein
      endeleg diagnose.


      Sjeldne tilstandar kan vere vanskelege å diagnostisere, fordi ulike delar av kroppen din kan bli påverka.


      Samtidig kan stadig fleire sjeldne tilstandar diagnostiserast. Dette kjem av store framsteg innan medisinsk genetikk.


      Diagnoseprosessen krev eit tett samarbeid mellom personen som blir greidd ut, familien og helsetenesta. Diagnosen kan
      stillast på ulike stadium i livet.


      ## Å stille ein diagnose på fosterstadiet


      [Fosterdiagnostikk](/nn/undersokelse-og-behandling/fosterdiagnostikk) kan gjere det mogleg å oppdage ein del sjeldne
      utviklingsavvik hos fosteret. Dersom avviket må behandlast, er det i nokre tilfelle mogleg å behandle fosteret medan
      det endå er i mors mage. Nokre svært alvorlege tilstandar kan gjere at fosteret ikkje overlever. Det kan føre til svangerskapsavbrot
      (abort).


      [Om legen mistenker eller har funne eit utviklingsavvik, får du tilbod om genetisk rettleiing.](/nn/undersokelse-og-behandling/genetiske-undersokelser)


      ## Når diagnosen blir stilt ved fødselen


      Enkelte, sjeldne misdanningar viser seg først etter at barnet er fødd. Nokre barn blir fødde med ein annleis utsjånad.
      Andre barn blir akutt sjuke like etter fødselen. Dette kan ha ulike årsaker, som til dømes feil på hjartet eller umodne
      lunger.


      [I dag blir nyfødde screena for fleire sjeldne, medfødde tilstandar.](/nn/etter-fodsel/helseundersokelser-av-nyfodte)
      Dette er ei undersøking der barnet kan få stilt ein sjeldan diagnose tidleg. Då kan legen sette i gang behandlingstiltak
      med ein gong. På den måten kan barnet unngå akutt sjukdom og alvorlege komplikasjonar.


      ## Når diagnosen blir stilt seinare i barndommen eller seinare i livet


      Ved nokre tilstandar kjem symptoma gradvis. Den endelege diagnosen blir då stilt seinare, når barnet har blitt nokre
      år, eller i enkelte tilfelle så seint som i vaksen alder.


      Om du mistenker ein sjeldan tilstand, bør du bestille ein time hos fastlegen. Fastlegen er spesialist i allmennmedisin
      og kan ha avgrensa kjennskap til sjeldne tilstandar.


      Fastlegen vurderer om de bør tilvisast til spesialisthelsetenesta (sjukehus eller spesialist utanfor sjukehus). Utgreiinga
      av sjeldne tilstandar kan ta lang tid fordi det ofte er nødvendig med utgreiing hos fleire ulike spesialistar.


      Dei fleste sjeldne diagnosar har ei genetisk årsak og kan vere arvelege. Derfor er genetisk utgreiing på sjukehus ofte
      ein del av utgreiinga.


      Pedagogisk eller psykologisk utgreiing kan òg vere aktuelt.


      ## Når du ikkje får ein medisinsk diagnose


      Sjølv etter omfattande utgreiing, er det ikkje alltid mogleg å kome fram til ein konkret diagnose. Dette kan til dømes
      gjelde ein del barn med utviklingshemming, og barn med samansette forandringar i organa. Då er det nyttig å få ei grundig
      funksjonsutgreiing, slik at andre tiltak og behandling kan settast i gang.


      Sjølv om det ikkje er mogleg å stille ein endeleg diagnose i dag, blir det stadig gjort medisinske framsteg. Auka kunnskap
      gjer det mogleg å stille ein diagnose seinare. Derfor kan det bli aktuelt å få ei ny tilvising til genetisk rettleiing
      når det har gått nokre år.


      ## Har du fleire spørsmål om sjeldne diagnosar?


      For meir informasjon og rådgiving om gongen i ei slik utgreiing, kan du ringe Sjeldentelefonen 800 41 710. Her får du
      meir informasjon om sjeldne diagnosar og tenestetilbodet i Noreg. Du kan òg [ta direkte kontakt med kompetanseeininga](/nasjonal-kompetansetjeneste-for-sjeldne-diagnoser/kompetansesentrene)
      . Dei kan òg hjelpe deg vidare for meir rettleiing.


      Referansar


      Bioteknologirådet [Internett]. Arv og genetikk. Oslo: bioteknologiradet.no; 2018 [hentet 2019-04-04]. Tilgjengelig fra:
      [http://www.bioteknologiradet.no/temaer/arv-og-genetikk](http://www.bioteknologiradet.no/temaer/arv-og-genetikk)


      Paus, Benedicte [Internett]. Kanskje teste, ofte utrede, alltid veilede. Tidsskr Nor Legeforen 2018 doi: 10.4045/tidsskr.18.0574
      [hentet 2019-11-12]. Tilgjengelig fra: [https://tidsskriftet.no/2018/09/leder/kanskje-teste-ofte-utrede-alltid-veilede](https://tidsskriftet.no/2018/09/leder/kanskje-teste-ofte-utrede-alltid-veilede)


