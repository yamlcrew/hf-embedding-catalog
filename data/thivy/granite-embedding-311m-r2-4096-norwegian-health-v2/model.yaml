    - '# Ungdom som snuser eller røyker bør få tilbud om hjelp til å slutte


      Anbefaling - Sterk

      Sterk anbefaling vil gjelde for de aller fleste pasienter i de aller fleste situasjoner. Uttrykk som brukes er "bør"
      og "anbefaler". Hvis anbefalingen er så klart faglig forankret at det sjelden er forsvarlig ikke å følge den, brukes
      uttrykkene "skal" og "må".

      Tannhelsepersonell bør delta i det helsefremmende og forebyggende arbeidet mot tobakk ved å

      - benytte «minimal intervensjon» i møte med ungdom fra 12-årsalder, se Praktisk

      - informere ungdom som snuser eller røyker om tilbud om hjelp til avvenning

      - informere om at fastlegen kan vurdere medikamentell behandling og gi strukturert hjelp til de som ønsker å slutte

      Tannhelsepersonell kan delta i det helsefremmende og tobakksforebyggende arbeidet ved å delta i lokalt folkehelsearbeid.


      ## Praktisk informasjon


      #### Om snus og e-sigaretter


      Snus er avhengighetsskapende og kan være kreftfremkallende, og anbefales ikke brukt i røykavvenning. E-sigaretter er
      også avhengighetsskapende og inneholder en rekke kjemiske stoffer med ukjent langtidseffekt. Dokumentasjon ved røykavvenning
      er mangelfull. Selv om risiko for sykdom ved røyking er betydelig, anbefales ikke e-sigaretter som behandling ved røykeslutt,
      siden det finnes mindre skadelige medikamenter til dette formålet. Pasienter som går over fra røyk til snus eller e-sigaretter
      bør imidlertid støttes og tilbys hjelp til å bli helt nikotinfrie, da det meste er mindre skadelig enn tobakksrøyking.
      Se informasjon om [Tobakk, røyk og snus](https://www.helsedirektoratet.no/forebygging-diagnose-og-behandling/forebygging-og-levevaner/tobakk)
      på Helsedirektoratets nettsider.


      #### Minimal intervensjon


      Minimal intervensjon er tre enkle spørsmål som kan gjennomføres av alt helsepersonell:


      1. Røyker eller snuser du? Hvis nei: Berøm tobakksfrihet.

      2. Hvis ja: Hva tenker du om det?

      3. Jeg vil anbefale deg å slutte og jeg kan hjelpe deg.


      Dersom ungdom har ønske om hjelp til å slutte er det aktuelt å henvise til eller anbefale ungdommen å kontakte fastlegen.
      Se [Nasjonal faglig retningslinje for røykeavvenning](https://www.helsedirektoratet.no/retningslinjer/roykeavvenning)
      som gjelder for fastleger og andre i helsetjenesten som jobber med røykeavvenning.


      Ungdom kan finne informasjon om hjelp til å slutte:


      - på [«Slutta-app» på helsenorge](https://helsenorge.no/rus-og-avhengighet/snus-og-roykeslutt/)

      - i eventuelle snus- og røykeavvenningstilbud lokalt, for eksempel kommunal frisklivssentral


      ## Begrunnelse


      Forskningsgrunnlaget viser at tobakk skader helsen på mange måter og gir alvorlige sykdommer. Både røyk og snus kan
      føre til og forverre orale sykdommer. Det er godt dokumentert at de som røyker får hyppigere kreft i munnhulen og har
      økt forekomst av marginal periodontitt. Røyking kan føre til misfarging av tenner og restaureringer, dårlig ånde og
      endringer i smaksans. Snus kan gi lokal varig tilbaketrekking av tannkjøttet i området der snusen plasseres.


      I tillegg er det dokumentert at røyk og snus øker risikoen for flere generelle sykdommer og påvirke foster, for eksempel
      kan snusing i svangerskapet medføre lavere fødselsvekt og økt risiko for prematur fødsel og dødfødsel, se Forskningsdokumentasjon.


      Tannhelsepersonell kan spille en viktig rolle med å forebygge oppstart av snus og røyk ved å sende tydelig signal om
      at det er helseskadelig å snuse/røyke.


      Tannhelsepersonell er regelmessig og relativt hyppig i kontakt med alle ungdommer, og kan være de eneste som tidlig
      ser skadene av snus. Forskning viser at tiltak av tannhelsepersonell rettet mot snus- og røykeslutt øker sannsynligheten
      for å slutte.


      [Nasjonal faglig retningslinje for røykeavvenning](https://www.helsedirektoratet.no/retningslinjer/roykeavvenning) anbefaler
      at alle som ønsker å slutte å røyke tilbys strukturert hjelp og vurderes for bruk av legemidler til røykeslutt. Dette
      er ikke tannhelsetjenestens oppgave. Ungdommer som ønsker slik hjelp kan henvises til fastlegen.


      Helsedirektoratet har en plan for et systematisk og kunnskapsbasert tilbud om røyke- og snusavvenning. Målet med planen
      er at den som bruker tobakk systematisk skal bli spurt om tobakkvaner av helsepersonell og få tilbud om sluttehjelp.


      Les hele


      ### Vurdering


      ##### **Fordeler og ulemper**


      Fordeler:


      - flere ungdommer lar være å begynne med snus eller røyk

      - flere ungdommer slutter å snuse/røyke


      Ulemper er ikke funnet.


      ##### **Kvalitet på dokumentasjonen**


      Moderat.


      ##### **Verdier og preferanser**


      Det antas å ikke være noen viktig usikkerhet eller variasjon med hensyn til hvordan folk verdsetter de viktigste utfallene.


      ##### **Ressurshensyn**


      Innebærer ikke endring i forhold til nåværende anbefalinger.


      ### Forskningsgrunnlag


      ##### PICO


      **Populasjon (P)**


      Ungdommer som snuser/røyker


      **Tiltak (I)**


      Tiltak for snus-/røykeslutt i forbindelse med besøk på tannklinikken


      **Sammenligning (C)**


      Ingen spesielle tiltak


      **Utfall (O)**


      Redusert bruk av tobakk blant ungdom


      ##### **Beskrivelse av inkluderte studier**


      Det har ikke blitt utført litteratursøk om dette tema. Forskningsgrunnlaget er basert på en systematisk oversikt (Carr
      et al., 2012) og en kunnskapsoppsummering fra Folkehelseinstituttet (2014).Folkehelseinstituttet utga i 2019 en rapport
      om helserisikoen ved bruk av svensk snus og den bekrefter forskningsgrunnlaget.


      Den systematiske oversikten var av god metodologisk kvalitet og inkluderte 14 intervensjonsstudier med 10 500 deltakere
      hvor tannhelsepersonell informerte og/eller anbefalte røykeslutt for individer på tannklinikken eller som del av gruppebaserte
      utadrettede forebyggende tiltak. Resultatene viste at tiltak av tannhelsepersonell rettet mot snus- og røykeslutt øker
      sannsynligheten for å slutte. Det var ikke godt nok grunnlag for å anbefale en spesiell type intervensjon, men kort
      atferdsrådgiving i forbindelse med munnundersøkelsen var en gjennomgående komponent i flere av studiene.


      Kunnskapsoppsummeringen fra Folkehelseinstituttet viser at det har vært økning i snusbruk i den norske befolkningen
      de siste 10-20 år, og økningen har vært størst i de yngre aldersgruppene. Som andre tobakksprodukter inneholder snus
      det biologisk aktive og avhengighetsskapende stoffet nikotin. I tillegg inneholder snus kreftfremkallende tobakksspesifikke
      nitrosaminer (TSNA) og andre kreftfremkallende stoffer som f.eks. polysykliske aromatiske hydrokarboner (PAH). Rapporten
      konkluderte med at det er dokumentert at bruk av snus øker risiko for kreft i bukspyttkjertel, spiserør og munnhule,
      og at det er holdepunkter for at bruk av snus øker risikoen for kreft i magesekk, lunge, tykktarm og endetarm. Bruk
      av snus i svangerskapet kan medføre lavere fødselsvekt og økt risiko for prematur fødsel og dødfødsel. Bruk av snus
      kan gi snusinduserte skader på slimhinne (røde og/eller hvite flekker). Noen av disse skadene er mulige forstadier til
      kreft, men de fleste av skadene går tilbake når man slutter å snuse. Det kan forekomme lokal varig tilbaketrekking av
      tannkjøttet i området der snusen plasseres. Det er holdepunkter for at bruk av snus kan gi økt risiko for diabetes mellitus
      type 2 og økt risiko for dødelighet etter hjerte- og karsykdom.


      ### Referanser


      142. A. B. Carr, J. Ebbert.


      Interventions for tobacco cessation in the dental setting. The Cochrane database of systematic reviews. 2012. 6. Cd005084.
      10.1002/14651858.CD005084.pub3.


      193.


      Helserisiko ved bruk av snus. Folkehelseinstituttet. 2014. https://www.fhi.no/globalassets/dokumenterfiler/rapporter/2014/helserisiko-ved-bruk-av-snus-pdf.pdf.'
    - '# Legemidler på blå resept


      Når du får et legemiddel på blå resept, innebærer det at du kun betaler en egenandel for legemiddelet. Legen din må
      vurdere om vilkårene for å få et legemiddel på blå resept er oppfylt.


      ## Legen din vurderer


      Det er legen din som må vurdere om du oppfyller vilkårene for å få et legemiddel på blå resept.


      I mange tilfeller kan legen skrive ut en blå resept direkte, uten å søke Helfo først.  Dette kalles «forhåndsgodkjent
      refusjon», og innebærer at du kan gå på apoteket og hente ut legemiddelet så snart legen har skrevet en resept.


      I enkelte tilfeller må legen din sende en søknad om stønad til Helfo på dine vegne. Dette kalles «stønad etter individuell
      søknad». I disse tilfellene vil Helfo vurdere om du kan få dekket utgiftene dine på blå resept.


      Noen ganger må denne søknaden komme fra en lege som er spesialist på sykdommen din, eller som jobber ved et offentlig
      sykehus.


      Saksbehandlingstiden i Helfo er inntil 8 uker, men i mange tilfeller får du svar på søknaden umiddelbart etter at legen
      har sendt den.


      Du vil motta et vedtak fra Helfo når søknaden er ferdig vurdert.


      [Blåreseptforskriften regulerer hva som skal til for å få legemidler på blå resept (lovdata).](https://lovdata.no/dokument/SF/forskrift/2007-06-28-814/&sect;3#&amp;sect&)


      ## Utlevering fra apotek når du har fått innvilget stønad på blå resept


      Når du har mottatt et vedtak fra Helfo om at du har fått stønad til et legemiddel på blå resept, kan du hente ut dette
      legemiddelet på apoteket. Du må også ha en blå resept på legemiddelet.


      Har du mottatt vedtaket på Helsenorge, Digipost eller e-Boks, kan du vise det frem digitalt, for eksempel på mobiltelefon.
      Har du fått vedtaket i posten, tar du det med til apoteket. I de fleste tilfeller kan også apoteket se i tjenesteportal
      for helseaktører at du har et vedtak.


      Du betaler bare egenandel når legemiddelet utleveres på blå resept. Denne teller med i grunnlaget ditt for [frikort
      for helsetjenester](/betaling-for-helsetjenester/frikort-for-helsetjenester) .


      Har du fått frikort, er barn under 16 år eller minstepensjonist, slipper du å betale.


      ## Sykdommer og tilstander som gir rett til dekning


      Du kan få legemidler på blå resept for en rekke ulike et er bare ved bestemte sykdommer eller tilstander. Det er legen
      din som vurderer om det er aktuelt å søke Helfo om stønad til legemiddelet.


      Det er et krav at effekten av legemiddelet må være vitenskapelig dokumentert for den aktuelle diagnosen. [Du kan lese
      mer om krav til dokumentert effekt her.](/refusjon-og-stotteordninger/refusjon-av-utlegg-til-legemidler-paa-blaa-resept/dokumentasjon-av-et-legemiddels-effekt)


      ## Legemidler ved yrkesskade


      Helfo kan dekke utgiftene dine ved yrkesskade. Forutsetningen er at Nav har godkjent yrkesskaden din. I tillegg må du
      ha et vedtak fra Helfo om stønad til det aktuelle legemiddelet.


      Les mer om [dekning av utgifter til ulike helsetjenester ved yrkesskade](/rettigheter/rett-til-helsehjelp-ved-yrkesskade)
      .


      Du kan også ha rett til [dekning av utgifter til ulike helsetjenester ved yrkesskade i utlandet](/behandling-i-utlandet/yrkesskade-yrkessykdom-og-opphold-i-eu-eos)
      .


      ## Kjøp av legemidler i utlandet


      Du kan i noen tilfeller få refundert utgifter til legemidler kjøpt i et annet land. Dette gjelder bare legemidler som
      gir rett til stønad i Norge.


      [Les mer om kjøp av legemidler i et annet EU/EØS-land](/behandling-i-utlandet/kjop-av-legemidler-i-eu-eos) .


      [Les mer om kjøp av legemidler utenfor EU/EØS](/behandling-i-utlandet/kjop-av-legemidler-utenfor-eu-eos) .


      [Les mer om godkjent yrkesskade og behov for legemidler i utlandet](/behandling-i-utlandet/yrkesskade-yrkessykdom-og-opphold-i-eu-eos)
      .


      ## Når du må søke refusjon


      I noen få tilfeller må du selv søke Helfo om å få refundert utgifter du har hatt til legemidler.


      Dette kan være aktuelt hvis du for eksempel har hentet ut legemidler på apoteket før du har fått vedtaket om blå resept
      fra Helfo. I disse tilfellene må du søke om å få tilbakebetalt utgiftene du har hatt. For at du skal få tilbakebetalt
      utgifter, må legemiddelet være kjøpt på resept. Det betyr at legen din må ha skrevet ut en resept på legemiddelet til
      deg på forhånd.


      I disse tilfellene må du søke Helfo om refusjon via Helfos digitale skjema.  Dokumentasjon på kjøpet må sendes til Helfo
      innen 6 måneder fra hver enkelt kjøpsdato. Dette gjelder selv om søknaden din fortsatt er til vurdering hos Helfo. Hvis
      du har mottatt faktura og betalt i ettertid, regnes fristen fra betalingsdatoen.


      Du må legge ved spesifiserte kvitteringer som inneholder


      - pasientens navn

      - produktets navn

      - mengde og styrke på produktet

      - pris på produktet

      - kjøpsdato

      - navnet på behandleren


      [Logg inn på Helfos digitale skjema og søk om å få refusjon](https://tjenester.helsenorge.no/okonomi)


      Hvis du ikke har mulighet til å benytte vårt digitale skjema, kan du i stedet fylle ut


      ### Papirskjema


      - [Kvitteringsskjema for dekning av utgifter til legemidler/næringsmidler kjøpt på resept (05-22.15) Bokmål (pdf)](https://www.helfo.no/skjema/Kvitteringsskjema%20for%20utgifter%20til%20legemidler-n%C3%A6ringsmidler%20kj%C3%B8pt%20p%C3%A5%20resept-05-22.15-bokm%C3%A5l.pdf?download=false)

      - [Kvitteringsskjema for dekning av utgifter til legemiddel/næringsmiddel kjøpt på resept (05-22.15) Nynorsk (pdf)](https://www.helfo.no/skjema/Kvitteringsskjema%20for%20utgifter%20til%20legemidler-n%C3%A6ringsmidler%20kj%C3%B8pt%20p%C3%A5%20resept-05-22.15-nynorsk.pdf?download=false)


      og sende skjemaet sammen med originale, spesifiserte kvitteringer til Helfo, Postboks 2415, 3104 Tønsberg.


      Hvis du fyller ut skjema på vegne av barn under 16 år, er det barnets personopplysninger som skal fylles inn. Det er
      imidlertid foreldre/foresatte som skal undertegne skjemaet.


      ## Saksbehandlingstid for refusjon av legemidler på blå resept og svar på søknad


      Saksbehandlingstiden i Helfo for søknad om for dekning av helseutgifter er normalt inntil 8 uker.


      Helfo sender deg vedtak som gjelder saken din til innboksen din på Helsenorge (eller i din digitale postkasse, om du
      heller bruker Digipost eller e-Boks). Om du ikke bruker digitale løsninger, sender vi post til den folkeregistrerte
      adressen din.


      [Logg inn for å finne svaret på søknaden din til Helfo](https://tjenester.helsenorge.no/meldinger)


      ## Ettersending av dokumentasjon


      Du må legge ved alle nødvendige opplysninger når du sender inn søknaden. Da behandler Helfo saken din så raskt vi kan.


      - Har Helfo bedt deg ettersende dokumentasjon, eller har du glemt å sende oss viktige opplysninger? Send kvitteringer,
      erklæringer, fullmakter eller lignende via lenken under.


      - Det er svært viktig at du fyller inn i Altinn saksnummeret til din eksisterende sak. Da kan vi behandle saken din
      raskere. Saksnummeret kan for eksempel se slik ut: «26/0000».


      ## [Logg inn for å ettersende dokumentasjon (hdir.apps.altinn.no)](https://hdir.apps.altinn.no/hdir/ettersending-helfo/)


      ## Fullmakt ved Helfo-henvendelser


      Kontakter du Helfo på vegne av noen andre, må du ha fullmakt.


      [Les mer om hvordan du kan ordne fullmakt ved Helfo-henvendelser](/fullmakt/bruke-helsenorge-pa-vegne-av-andre/fullmakt-ved-kontakt-med-helfo)
      .


      Innholdet er levert og kvalitetssikret av [Helfo](/samarbeidspartnere/#helfo)


      Slik refererer du til innholdet Helfo. Legemidler på blå resept. [Internett]. Oslo: Helsedirektoratet; oppdatert tirsdag
      3. mars 2026 [hentet onsdag 20. mai 2026]. Tilgjengelig fra: [https://www.helsenorge.no/refusjon-og-stotteordninger/refusjon-av-utlegg-til-legemidler-paa-blaa-resept/](https://www.helsenorge.no/refusjon-og-stotteordninger/refusjon-av-utlegg-til-legemidler-paa-blaa-resept/)


      Sist oppdatert 3. mars 2026'
    - '# Grunnstønad


      Pengestøtte til ekstrautgifter når du eller barnet ditt har en varig skade, sykdom eller funksjonsnedsettelse.


      ## [Hvem kan få?](#hvem)


      Ekstrautgifter er utgifter du eller barnet ditt har fått på grunn av den medisinske tilstanden. Med medisinsk tilstand
      mener vi en varig skade, sykdom eller funksjonsnedsettelse.


      Ekstrautgiftene må vare i 2-3 år eller mer.


      Hvis det ikke er mulig å sammenlikne med tidligere utgifter, vil Nav se på utgiftene som andre personer har til det
      samme formålet.


      Grunnstønaden dekker ikke utgifter til medisiner.


      Du må være [medlem i folketrygden](/no/person/flere-tema/arbeid-og-opphold-i-norge/relatert-informasjon/medlemskap-i-folketrygden)
      for å ha rett på stønaden. Hvis skaden eller sykdommen skyldes en godkjent yrkesskade eller yrkessykdom, [gjelder egne
      regler](https://www.nav.no/yrkesskade#grunnstonad) .


      ## [Hva kan du få?](#hva)


      ### [Hva kan du få støtte til?](#stotte)


      Du eller barnet kan få stønad til disse ekstrautgiftene:


      Drift av tekniske hjelpemidler


      Du eller barnet kan få stønad til strømutgifter til elektriske hjelpemidler, som for eksempel seng og rullestol, batterier
      til høreapparat, utgifter til cochlea implantat og trygghetsalarm.


      Transport


      Du eller barnet kan få stønad til nødvendige ekstrautgifter til transport eller [drift av bil](/no/person/hjelpemidler/hjelpemidler-og-tilrettelegging/bil-og-spesialutstyr)
      som skyldes den medisinske tilstanden.


      Førerhund


      Du kan få stønad når du har [godkjent førerhund](/samarbeidspartner/forerhund) .


      Mat på grunn av spesialdiett


      Du eller barnet kan få stønad fordi det er nødvendig å ha spesialdiett. En spesialist må stille diagnosen og beskrive
      dietten.


      Flere sykdommer, som for eksempel cøliaki og cystisk fibrose, gir rett til grunnstønad etter faste satser uten krav
      om å dokumentere ekstrautgiftene.


      Melkeintoleranse, laktoseintoleranse og non-cøliaki/glutenintoleranse gir ikke rett til stønad.


      Klær, sengetøy, sko og støvler


      Du eller barnet ditt kan få stønad på grunn av ekstra slitasje eller hyppig vasking som skyldes den medisinske situasjonen.


      Madrasser, dyner, puter, håndklær og kluter blir ikke regnet som klær eller sengetøy.


      #### **Hyperkinetiske forstyrrelser**


      ##### **Barn**


      Barn under 18 år med hyperkinetiske forstyrrelser, for eksempel ADHD med hyperaktivitet, får grunnstønad sats 1 til
      dekking av ekstrautgifter ved klesslitasje. Det er ikke nødvendig å dokumentere ekstrautgiftene. De medisinske opplysningene
      må beskrive en hyperaktiv adferd. Det er ikke nok å oppgi diagnosekode eller diagnose. Grunnstønad til klesslitasje
      opphører når barnet fyller 18 år.


      ##### **Voksne**


      Hyperaktiv adferd og klesslitasje avtar normalt med alderen. Derfor er hovedregelen at du ikke får støtte etter at du
      har fylt 18 år. Praksis fra Trygderetten er at det sjelden gis grunnstønad til klesslitasje til voksne personer med
      ADHD-diagnose. Hvis du likevel mener at du har ekstrautgifter, må du søke og dokumentere utgiftene.


      Servicehund


      Du kan få stønad når du har godkjent [servicehund](/servicehund) . Stønaden er grunnstønad etter sats 3, som tilsvarer
      1 502 kroner per måned.


      ### [Hvor mye kan du få?](#hvor-mye)


      Grunnstønad har 6 satser. Hvilken sats som er aktuell, avhenger av hvor store ekstrautgifter du eller barnet har.


      Ekstrautgiftene må minst tilsvare sats 1, som er 752 kroner per måned.


      Satser


      Satsene gjelder fra 1. januar 2024 og er uendret i 2025 og 2026.


      | **Sats 1**   | **Beløp**     |

      |--------------|---------------|

      | Per år       | 9 024 kroner  |

      | Per måned    | 752 kroner    |

      | **Sats 2**   | **Beløp**     |

      | Per år       | 13 752 kroner |

      | Per måned    | 1 146 kroner  |

      | **Sats 3**   | **Beløp**     |

      | Per år       | 18 024 kroner |

      | Per måned    | 1 502 kroner  |

      | **Sats 4**   | **Beløp**     |

      | Per år       | 26 544 kroner |

      | Per måned    | 2 212 kroner  |

      | **Sats 5**   | **Beløp**     |

      | Per år       | 35 964 kroner |

      | Per måned    | 2 997 kroner  |

      | **Sats 6**   | **Beløp**     |

      | Per år       | 44 928 kroner |

      | Per måned    | 3 744 kroner  |


      ### [Hvor lenge kan du få grunnstønad?](#hvor-lenge)


      Det er ingen aldersgrense for å få grunnstønad.


      Du får ikke dekket utgifter til transport hvis funksjonsevnen din blir nedsatt etter at du har fylt 70 år.


      Behovet for stønaden kan endre seg, derfor kan Nav gi beskjed om at vi vil vurdere stønaden på nytt.


      ### [Omsorgsopptjening](#omsorgsopptjening)


      Du kan få omsorgsopptjening hvis du tar deg av små barn. Omsorgsopptjening er en ordning som bidrar til at du kan få
      høyere pensjon når du blir pensjonist. Det samme gjelder hvis du hvis du tar deg av en person som er syk, eldre eller
      har en funksjonsnedsettelse.


      [Pensjonsopptjening ved omsorg for barn](/omsorgsopptjening-barn) Slik gjør du det [Pensjonsopptjening ved omsorg for
      syke, eldre og personer med funksjonsnedsettelser](/omsorgsopptjening-eldre) Slik gjør du det


      ### [Andre tilbud](#andre-tilbud)


      Mer informasjon til deg som


      - [Tar vare på noen som er syk, skadet eller har en funksjonsnedsettelse](/tar-vare-pa) Dette kan du ha rett til


      ## [Søke, ettersende eller klage](#sok)


      ### [Søknad og ettersendelse](#soknad)


      I søknaden må du opplyse hvilken lege eller leger som behandler deg/barnet og legens adresse. Du trenger ikke sende
      inn legeopplysninger.


      Det er viktig at du fyller ut alle aktuelle punkter i søknaden og legger ved all nødvendig dokumentasjon. Da blir saken
      din behandlet raskere. Du får beskjed underveis i søknaden hvis du må dokumentere noen av opplysningene dine.


      [Søknad om grunnstønad](/start/soknad-grunnstonad) [Ettersend dokumentasjon](https://www.nav.no/fyllut-ettersending/nav060304)


      Dette må du dokumentere


      **Hvis du søker om grunnstønad på grunn av slitasje på klær og sengetøy,** må du dokumentere ekstrautgiftene med kvitteringer,
      eventuelt oversikt over sannsynlige, løpende ekstrautgifter.


      Du må som regel dokumentere ekstrautgiftene med kvitteringer for en periode på minimum 3 måneder. Du må spesifisere
      hva som er kjøpt og årsaken til at det er kjøpt nytt.


      **Hvis klesslitasjen kommer av at barnet ditt har hyperkinetiske forstyrrelser,** inkludert ADHD med hyperaktivitet,
      trenger du ikke dokumentere ekstrautgifter. De medisinske opplysningene må vise at barnet ditt har en hyperaktiv adferd
      som forklarer klesslitasjen. Det er ikke tilstrekkelig å bare oppgi diagnosekode eller diagnose.


      **Hvis ekstrautgiftene dine gjelder bruk av drosje,** må du legge ved kvitteringer for en periode på minimum 3 måneder.


      #### Svar på brev om vurdering av grunnstønad


      Dette skjemaet skal du fylle ut hvis du har fått brev fra oss om ny vurdering av saken din.


      [Send svar](https://www.nav.no/fyllut/nav060701) [Ettersend dokumentasjon](https://www.nav.no/fyllut-ettersending/nav060701/innsendingsvalg)


      Du kan ta [kontakt med Nav](/kontaktoss) hvis du ønsker mer informasjon og veiledning, og/eller hjelp til å fylle ut
      skjemaet.


      ### [Etter at du har søkt](#etter-soknad)


      Du får skriftlig vedtak når søknaden er behandlet.


      Saksbehandlingstider


      #### Saksbehandlingstid for søknader


      Saksbehandlingstiden er tiden fra vi får søknaden din og til vi har gjort et vedtak. Husk at vi trenger all nødvendig
      dokumentasjon for å behandle søknaden din.


      | Saken gjelder   | Forventet saksbehandlingstid   |

      |-----------------|--------------------------------|

      | Søknad          | 4 måneder                      |


      ### [Klagerettigheter](#klage)


      Har du fått et vedtak fra oss som du mener er feil? Da kan du klage til Nav-enheten som skrev vedtaket. De vil vurdere
      saken din på nytt. Hvis de ikke er enig i klagen din, sender de den videre til Nav klageinstans.


      #### Klage på vedtak


      I vedtaket står det hvordan du går fram hvis du skal klage, hvem du skal klage til og klagefrist. Hvis du har spørsmål
      om vedtaket, kan du [kontakte oss](/kontaktoss) .


      [Send klage](https://klage.nav.no/nb/klage/GRUNNSTONAD) [Ettersend dokumentasjon](https://klage.nav.no/nb/ettersendelse/klage/GRUNNSTONAD)


      #### Anke vedtak


      Hvis du er uenig i svaret på klagen din fra Nav klageinstans, kan du med noen unntak anke vedtaket. Fristen for å anke
      står i vedtaket.


      [Send anke](https://klage.nav.no/nb/anke/GRUNNSTONAD) [Ettersend dokumentasjon](https://klage.nav.no/nb/ettersendelse/anke/GRUNNSTONAD)


      Du kan også bruke advokat eller gi fullmakt til en person som klager på dine vegne.


      [Klagerettigheter](/klagerettigheter) Slik gjør du det


      #### Saksbehandlingstid for klage og anke


      | Saken gjelder              | Forventet saksbehandlingstid   |

      |----------------------------|--------------------------------|

      | Klage til Nav-enhet        | 13 uker                        |

      | Klage til Nav klageinstans | 3 måneder                      |

      | Anke til Nav klageinstans  | 2 måneder                      |


      ## [Når du har grunnstønad](#har)


      ### [Når utbetales pengene?](#utbetaling)


      Grunnstønaden blir utbetalt en gang per måned.


      Stønaden til barn blir utbetalt til den bankkontoen som foreldrene eller vergen bestemmer. Kontoen kan være i navnet
      til en av foreldrene, vergen eller barnet.


      For å registrere kontonummer til barn, må du fylle ut [skjemaet melding om nytt bankkontonummer](https://www.nav.no/start/soknad-endring-bankkontonummer)
      og sende det i posten til Nav.


      Er du over 18 år, kan du [endre kontonummeret på nav.no](/kontonummer) .


      Utbetalingsdatoer


      Utbetalingsdato er dagen Nav garanterer at pengene skal være på kontoen din.


      | Utbetalingsdatoer i 2026   |

      |----------------------------|

      | 20. januar                 |

      | 20. februar                |

      | 20. mars                   |

      | 20. april                  |

      | 13. mai                    |

      | 19. juni                   |

      | 20. juli                   |

      | 20. august                 |

      | 18. september              |

      | 20. oktober                |

      | 20. november               |

      | 11. desember               |


      I [utbetalingsoversikten din](https://tjenester.nav.no/utbetalingsoversikt/) kan du se den kommende utbetalingen din
      flere dager før utbetalingsdatoen.


      Når på dagen pengene er på konto, vil variere fordi det er banken din som overfører pengene til deg. Utbetalingen kan
      derfor komme på kontoen din først på ettermiddagen eller kvelden.


      #### Utbetalinger til barn


      Du kan ringe Nav og få informasjon om utbetalinger som gjelder barnet ditt.


      Er du over 18 år, kan du se utbetalinger i [din utbetalingsoversikt](https://tjenester.nav.no/utbetalingsoversikt/)
      .


      Hvis du ikke har registrert et kontonummer på nav.no, vil du få et utbetalingskort i posten et par dager etter den faste
      utbetalingsdatoen.


      Vil du slippe å gå i banken med utbetalingskort, må du [registrere et kontonummer på nav.no](https://www.nav.no/person/personopplysninger/nb/#utbetaling)
      , eller [sende melding om kontonummeret ditt i posten](/kontonummer) .


      #### Feriepenger


      Det er ikke feriepenger på denne pengestøtten.


      #### Skatt


      Det blir ikke trukket skatt.


      ### [Meld fra om endringer](#melde)


      Hvis behovet for grunnstønad endrer seg, må du melde fra til Nav.


      Du må også melde fra hvis du eller barnet ditt får endringer i helsetilstanden, eller hvis utgiftene endrer seg, eller
      hvis du planlegger å flytte eller oppholde deg i utlandet. Det kan ha betydning for beløpet du får utbetalt fra Nav.


      [Meld fra om endring](/person/kontakt-oss/meld-fra-om-endringer-innbokser/meld-fra-om-endring-grunnstonad-eller-hjelpestonad)


      ## [Hva sier loven?](#loven)


      [Folketrygdloven § 6-3 Grunnstønad](/nav.no-ressurser/lenker/regelverk/rettskildene/folketrygdloven-6-3-grunnstonad)'
  - source_sentence: Hvordan får jeg påvist Downs syndrom hos et foster under svangerskapet?
    sentences:
    - '# Downs syndrom


      Downs syndrom (Trisomi 21) er en medfødt genetisk tilstand. Downs syndrom kan ikke kureres, men behandling og tilrettelegging
      kan redusere utfordringene slik at livskvaliteten blir god for den enkelte.


      ## Hva er Downs syndrom?


      Downs syndrom er en medfødt tilstand. Til tross for en del fellestrekk, er det stor variasjon i hvordan personer med
      Downs syndrom fungerer.


      Dette innebærer at hver person må sees i lys av sine ressurser og utfordringer, og at oppfølging og tjenester skal være
      tilpasset den enkelte.


      Målet er at personer med Down syndrom lever gode og innholdsrike liv, utvikler seg og har mulighet for å delta i samfunnet
      og være mest mulig selvstendige.


      Ifølge medisinsk fødselsregister ble det født 58 levende barn med Downs syndrom i Norge i 2020.


      ## Symptomer på Downs syndrom


      De aller fleste med Downs syndrom har en utviklingshemming. Downs syndrom er til nå den mest vanlige enkeltstående årsak
      til utviklingshemming. Graden av utviklingshemming varierer. Omfanget av andre vansker varierer også, som for eksempel:


      - hjertefeil

      - syn- og hørselsvansker

      - forsinket motorisk utvikling

      - lav spenning i muskulatur

      - lærevansker

      - kommunikasjons- og språkvansker


      Syndromet gir ofte et særpreget utseende, med:


      - skråstilte øyne

      - kort nakke

      - brede og korte hender


      ## Årsaker til Downs syndrom


      Kromosomer finnes i alle cellene i kroppen. De inneholder vårt genetiske arvestoff, kalt DNA. Normalt har mennesket
      23 par kromosomer


      Årsaken til Downs syndrom er alltid knyttet til kromosom 21. Det finnes tre forskjellige varianter ved Downs syndrom:


      1. Et ekstra kromosom på kromosompar 21. Dette er den vanligste årsaken og skjer i ca. 95 % av tilfellene.

      2. Et ekstra kromosom 21 som har festet seg på et annet kromosompar enn 21. Det skjer i cirka fire prosent av tilfellene
      og kalles translokasjon.

      3. Et ekstra kromosom 21 i noen celler. Det skjer kun i én prosent av tilfellene og kalles mosaikk.


      Downs syndrom er ikke arvelig


      ## Utredning og diagnose


      Mistanke om Downs syndrom kan oppstå ved [ultralydundersøkelse](/undersokelse-og-behandling/ulytralyd-av-gravide) i
      svangerskapet. Imidlertid er det ikke alltid mulig å påvise tilstanden ved hjelp av ultralyd. Ved begrunnet mistanke
      er det mulig å gjøre [fostervannsprøve](/undersokelse-og-behandling/fosterdiagnostikk) . En gentest kan da bekrefte
      eller avkrefte diagnosen Downs syndrom.


      Det er mulig for alle gravide å få utført [NIPT test (Non-invasiv prenatal test)](/undersokelse-og-behandling/fosterdiagnostikk/#nipt-for-trisomi-13-18-og-21)
      for å undersøke om fosteret kan ha en ekstra kopi av bestemte kromosomer som trisomi 21


      Dersom det ikke allerede er avdekket i svangerskapet, blir det ved fødselen ofte raskt klart om et barn har Downs syndrom.
      Diagnosen stilles endelig ved en gentest. Det vil si at det tas en blodprøve som undersøkes ved et laboratorium.


      ## [Fosterdiagnostikk](https://www.helsenorge.no/undersokelse-og-behandling/fosterdiagnostikk/)


      Fosterdiagnostikk er undersøkelser av fosterets helsetilstand.


      ## Behandling


      Målet med oppfølging og behandling er at den enkelte med Downs syndrom skal kunne leve et godt og innholdsrikt liv,
      utvikle seg og ha gode muligheter for selvstendighet og deltakelse.


      Det er den enkeltes behov som avgjør omfanget av, og innholdet i hjelpetiltakene. Downs syndrom arter seg svært forskjellig
      fra person til person. Hvert enkelt barn og ungdom må derfor ha individuelt tilpasset behandling, stimulering, opplæring,
      støtte og hjelp ut fra sine spesifikke ressurser og utfordringer.


      ### Hjelp å få


      Downs syndrom er en sammensatt tilstand. Derfor kan det være nødvendig å få hjelp fra mange forskjellige fagpersoner
      og instanser der du bor:


      - fastlege

      - helsestasjon

      - barnehage, skole og skolefritidsordning

      - ergoterapeut- og fysioterapeut

      - støttekontakt og kanskje avlastningstilbud


      Barnehage og skole legger til rette for stimulering og opplæring med støtte fra pedagogisk-psykologisk tjeneste i kommunen,
      slik at barn og ungdom med Downs syndrom kan lære ut i fra egne evner og kapasitet. For mange kan det være aktuelt å
      legge ekstra vekt på utvikling av språk.


      ### Medisinsk behandling og oppfølging


      Fastlegen ivaretar den medisinske behandlingen og oppfølgingen. Det kan også være nødvendig å få hjelp fra forskjellige
      avdelinger på sykehuset som for eksempel:


      - barneavdeling

      - øyeavdeling

      - øre-, nese-, halsavdeling

      - habiliteringstjenesten


      Habiliteringstjenesten tilbyr oppfølging på ulike områder, blant annet utredning når det gjelder:


      - språk

      - evner

      - forutsetninger for læring


      ## Koordinerende enheter for habilitering barn og unge


      - [Helse Sør Øst (sunnaas.no)](https://www.sunnaas.no/fag-og-forskning/kompetansesentre-og-tjenester/Regional-koordinerende-enhet/)

      - [Helse Vest (helse-bergen.no)](https://helse-bergen.no/regionalt-kompetansesenter-for-habilitering-og-rehabilitering/regional-koordinerande-eining-rke)

      - [Helse Midt (hnt.no)](https://www.hnt.no/helsefaglig/tjenester/regional-koordinerende-enhet/)

      - [Helse Nord (helse-nord.no)](https://helse-nord.no/behandlingssteder/rehabilitering-og-habilitering/regional-koordinerende-enhet-rke)


      ## Rettigheter


      ### Koordinator og individuell plan


      Familier som har eller venter barn med alvorlig sykdom, skade eller nedsatt funksjonsevne, har rett til barnekoordinator.


      Voksne med behov for langvarige og koordinerte tjenester har også rett til å få oppnevnt en koordinator som skal sørge
      for oppfølging av den enkelte.


      Koordinatoren skal blant annet sikre samordning og fremdrift av arbeidet med individuell plan (IP).


      For å få hjelp til å sette i gang arbeidet med individuell plan og få oppnevnt koordinator, kan du henvende deg til
      kommunen/bydelen der du bor. Avdelingen i sykehuset du har kontakt med kan også henvende seg til kommunen/bydelen din
      for å få igangsatt arbeidet med individuell plan


      Du kan også henvende deg til fastlegen eller helsestasjonen om dette.


      ## [Individuell plan og koordinator](https://www.helsenorge.no/rettigheter/individuell-plan/)


      Alle som har behov for langvarige og koordinerte helse- og omsorgstjenester, har rett til å få utarbeidet en individuell
      plan.


      Illustrasjon: Johnér Bildbyrå AB


      ## [Barnekoordinator](https://www.helsenorge.no/rettigheter/barnekoordinator/)


      Barnekoordinator er en rettighet for familier med barn med alvorlig sykdom, skade eller nedsatt funksjonsevne som trenger
      ulike velferdstjenester.


      Illustrasjon: Aleksandr Davydov /Mostphotos


      ## Retningslinje for oppfølging


      Regional retningslinje for spesialisthelsetjenestens oppfølging av barn og unge med Down syndrom (0-18 år).


      [Retningslinje for oppfølging av barn og unge med Down syndrom (oslo-universitetssykehus.no)](https://www.oslo-universitetssykehus.no/fag-og-forskning/nasjonale-og-regionale-tjenester/regional-kompetansetjeneste-for-habilitering-rkhab/retningslinje-for-oppfolging-av-barn-og-unge-med-down-syndrom)


      ### Downs Syndrom Norge


      Downs Syndrom Norge er et frittstående nettverk for alle med eller interesse for Downs syndrom


      [Downs Syndrom Norge (downssyndrom.no)](https://www.downssyndrom.no/)


      Referanser


      Regional retningslinje for spesialisthelsetjenestens oppfølging av barn og unge med Down syndrom (0-18 år). Tilgjengelig
      fra: [https://www.oslo-universitetssykehus.no/fag-og-forskning/nasjonale-og-regionale-tjenester/regional-kompetansetjeneste-for-habilitering-rkhab/retningslinje-for-oppfolging-av-barn-og-unge-med-down-syndrom/](https://www.oslo-universitetssykehus.no/fag-og-forskning/nasjonale-og-regionale-tjenester/regional-kompetansetjeneste-for-habilitering-rkhab/retningslinje-for-oppfolging-av-barn-og-unge-med-down-syndrom/)


      UpToDate. Down syndrome: Clinical features and diagnosis. [Internett]. Waltham: Wolters Kluwer; 2020 [hentet 2020-11-05].
      Tilgjengelig fra: [https://www.uptodate.com/contents/down-syndrome-clinical-features-and-diagnosis](https://www.uptodate.com/contents/down-syndrome-clinical-features-and-diagnosis)


      UpToDate. Down Syndrome: Management. [Internett]. Waltham: Wolters Kluwer; 2020 [hentet 2020-11-05]. Tilgjengelig fra:
      [https://www.uptodate.com/contents/down-syndrome-management](https://www.uptodate.com/contents/down-syndrome-management)


      Innholdet er levert og kvalitetssikret av [Oslo universitetssykehus HF](/samarbeidspartnere/#oslo-universitetssykehus-hf)


      Slik refererer du til innholdet Oslo universitetssykehus HF. Downs syndrom. [Internett]. Oslo: Helsedirektoratet; oppdatert
      mandag 15. mai 2023 [hentet onsdag 20. mai 2026]. Tilgjengelig fra: [https://www.helsenorge.no/sykdom/skader-og-sykdommer-i-hjernen/downs-syndrom/](https://www.helsenorge.no/sykdom/skader-og-sykdommer-i-hjernen/downs-syndrom/)


