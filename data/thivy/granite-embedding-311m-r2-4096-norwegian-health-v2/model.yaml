    sentences:
    - '# Tannregulering til barn og unge


      Mange barn og unge har i dag tannregulering. Barn og unge kan få frå 40 til 100 prosent stønad frå Helfo, avhengig av
      kva slags behandling kjeveortopeden meiner det er behov for. Kor stor dekninga blir, er basert på fastsette takstar
      for tannbehandling.


      Helfo gir ingen stønad til behandling som berre har eit kosmetisk føremål.


      ## Krav for at Helfo skal gje stønad til tannregulering


      Desse krava må vere oppfylt for at Helfo skal kunne gje stønad:


      - For at pasienten skal ha rett til stønad, må behandlinga vere påbegynt seinast det året pasienten fyller 20 år.

      - Kjeveortopeden må ha direkte oppgjer med Helfo. Med direkte oppgjer blir stønaden utbetalt direkte til kjeveortopeden,
      slik at pasienten berre må betale eigenandelen.


      ## Du må rekne med ei eigenbetaling


      Kjeveortopedar har fri prissetting, og kan derfor ta meir betalt for behandlinga enn det stønaden frå Helfo dekker.


      Det betyr at pasientane må rekne med å måtte betale ein del av behandlinga sjølv, også dei som har rett til 100 prosent
      stønad.


      ## Treng barnet/ungdommen tannregulering?


      Foreldre som lurer på om barnet deira treng tannregulering, må gå via tannlege eller tannpleier i den offentlege tannhelsetenesta
      for å få ei vurdering.


      Det same gjeld unge vaksne som fyller 19 eller 20 år i behandlingsåret. Tannlegen eller tannpleiaren skal gjere ei sjølvstendig
      vurdering av behandlingsbehovet, og eventuelt tilvise (henvise) videre til kjeveortoped.


      Det er kjeveortopeden som avgjer om barnet treng behandling, og i så fall kva for behandling.


      ## Utvida stønad for familiar med fleire enn eitt barn


      **** Familiar med fleire enn eitt barn med behov for kjeveortopedisk behandling kan ha krav på utvida stønad (søskenmoderasjon),
      etter nærare fastsette vilkår. Den føresette må opplyse kjeveortopeden om at det er fleire søsken i familien med tannregulering,
      og dokumentere at behandlinga av det første barnet har påført familien faktiske utgifter.


      Ordninga med utvida stønad til utgifter til kjeveortopedisk behandling gjeld familiar der fleire enn eitt barn har behov
      for slik behandling. Utvida stønad gjeld frå det neste barnet (med behov for tannregulering) og dei påfølgjande søskena.


      - Heilsøsken, halvsøsken og fostersøsken blir definerte som søsken.

      - Stesøsken blir ikkje definerte som søsken i denne samanhengen.


      Sjå eventuelt [informasjon frå Nav om bidrag frå den andre forelderen til særlege utgifter som tannregulering, konfirmasjon
      og briller.](https://www.nav.no/bidrag-utgifter)


      ## Tannregulering for vaksne


      Hovudregelen er at vaksne må betale for tannbehandlinga dei har behov for, men i nokre tilfelle kan pasienten få stønad
      frå Helfo til tannregulering, uavhengig av alder. Dette kan vere tilfelle ved:


      - rehabilitering ved tanntap som følgje av marginal periodontitt

      - tannagenesi (medfødd manglande tann-anlegg)

      - tannskadar ved godkjend yrkesskade

      - tannskade ved ulukke som ikkje er yrkesskade


      Vaksne som lurer på om dei kan ha krav på stønad frå Helfo til tannregulering, må ta kontakt med tannlegen sin.


      Tannlegen kan vurdere om de fell inn under nokon av [tilstandane/tilfella som kan gje rett til stønad frå Helfo. ](https://www.helsedirektoratet.no/rundskriv/folketrygdloven-kap-5/folketrygdloven--5-6--5-6-a-og--5-25--undersokelse-og-behandling-hos-tannlege-og-tannpleier-for-sykdom-og-skade)


      ## [Hvem betaler tannlegeregningen?](https://www.helsenorge.no/nn/betaling-for-helsetjenester/hvem-betaler-tannlegeregningen-din/)


      Barn får gratis tannbehandling i den offentlige tannhelsetjenesten. Voksne må i utgangspunktet betale selv, men det
      finnes mange unntak.


      Illustrasjon: Morten Rakke / Helfo


      ## Rettleiing Helsenorge


      [23 32 70 00](tel:+4723327000)


      Hverdager kl. 08:00 - 15:30


      Innhaldet er levert og kvalitetssikra av [Helfo](/nn/samarbeidspartnere/#helfo)


      Slik refererer du til innhaldet Helfo. Tannregulering til barn og unge. [Internett]. Oslo: Helsedirektoratet; oppdatert
      tirsdag 3. mai 2022 [henta onsdag 20. mai 2026]. Tilgjengeleg frå: [https://www.helsenorge.no/nn/tannhelse/tannregulering-til-barn-og-unge/](https://www.helsenorge.no/nn/tannhelse/tannregulering-til-barn-og-unge/)


      Sist oppdatert 3. mai 2022'
    - '# Selvbestemmelse


      Ordet selvbestemmelse er et sammensatt begrep og kan forklares på mange ulike måter. Andre beslektede ord som knyttes
      til begrepet kan være autonomi, aktørskap, medvirkning, samproduksjon, samskaping, beslutningsstøtte, brukermedvirkning,
      medborgerskap og empowerment. Mange forbinder selvbestemmelse med å ta et valg, forstå hvilke valg vi har, og hva et
      valg kan bety for oss på kort sikt og på lang sikt. Men selvbestemmelse er mer sammensatt og omfattende enn som så.


      Vi kan for eksempel snakke om å kunne påvirke vår hverdag, å ha kontroll, å ta valg i hverdagslige situasjoner, som
      for eksempel hva vi skal spise eller hva vi skal gjøre i fritiden vår. Vi kan også snakke om å ha innflytelse på større
      valg i livet (livsvalg) som for eksempel hvor vi skal bo, hva et godt liv betyr for oss eller hvilke ønsker vi har for
      livet, f.eks. om jobb, relasjoner, bosituasjon, aktiviteter osv. Videre kan vi snakke om det å være anerkjent som en
      aktør i eget liv, at vi kan få ting til å skje i våre liv. Selvbestemmelse kan derfor forstås som en betingelse for
      god livskvalitet (for eksempel Ellingsen, 2007).


      **Selvbestemmelse må øves** Selvbestemmelse er noe som utvikles over tid, gjerne i nære relasjoner. Selvbestemmelse
      kan forstås som en ferdighet på lik linje med andre ferdigheter og er noe man for eksempel som barn og unge øver seg
      på med støtte fra foreldre. Gjennom øving over tid kan ferdigheter i å gradvis gjøre mer avanserte vurderinger om valg
      utvikles (for eksempel Stancliffe, Wehmeyer, Shogren, &amp; Abery, 2020).  Mer om dette lenger ned i teksten.


      Personer med utviklingshemming lever ofte store deler av livene sine med støtte fra andre. Noen er selvstendige og klarer
      seg for det meste helt selv. De kan ha behov for støtte ved spesifikke situasjoner som ved administrering av medisiner,
      husvask, matlaging eller kjøring til og fra aktiviteter. Andre igjen vil ha behov for hjelp og støtte kontinuerlig i
      mange hverdagslige situasjoner som f.eks. ved personlig hygiene, ernæring, forflytting, søvn, kommunikasjon og andre
      aktiviteter døgnet rundt (Ellingsen, 2007).


      Noen vil kunne bestemme selv/eller ta et valg selv mens andre vil trenge støtte fra andre for å kunne foreta et valg.
      En person som uttrykker seg uten ord har den samme retten som andre til å bestemme og gi uttrykk for sine ønsker, for
      eksempel gjennom kroppslige uttrykk, og på den måten medvirke i utforming av tjenester og i hverdagslivet. Noen ganger
      er det familiemedlemmer eller andre støttepersoner rundt som kjenner en godt som kan være med på å fremme den enkeltes
      interesser og ønsker. Den enkeltes ønsker skal vektlegges. Personale kan over tid også lære seg å tolke personens kroppslige
      utrykk og å tolke disse i lys av selvbestemmelse. Det betyr at personale må få tid og rom til å bli godt kjent med den
      de yter tjenester til slik at de får mulighet til å utvikle trygge og tillitsfulle relasjoner som kan fremme interesser
      og ønsker til den det gjelder (Skarsaune, 2023; Skarsaune &amp; Hanisch, 2023).


      Når vi snakker om selvbestemmelse for personer med utviklingshemming så kan det noen ganger være utfordrende å vite
      hva vanlige erfaringer er, hva bør personer med utviklingshemming erfare som alle andre, og når bør vi hjelpe til. Tilrettelegging
      for selvbestemmelse kan i praksis oppleves som utfordrende noen ganger (Høium, 2022).


      **Om medvirkning og selvbestemmelse** Medvirkning og selvbestemmelse er ikke det samme, men begge begrepene vektlegger
      viktighet av å lytte til ønsker, erfaringer og kunnskap til den som skal medvirke, slik at tjenester og støtte i så
      stor grad det er mulig er utformet slik personer med utviklingshemming selv ønsker det.  Mens medvirkning går ut på
      å skape rom for uttrykk av meninger og på den måten få mulighet til å påvirke utforming av f.eks. tjenester går selvbestemmelse
      ut på å ha mer direkte innflytelse på hvordan en hverdag kan se ut. Uansett om en trenger mye eller lite støtte har
      alle som mottar helse- og omsorgstjenester rett til å medvirke i valg og utforming av tjenestetilbud. De skal være tatt
      med på råd og på å bestemme hvordan tjenestene skal se ut (utformes og ytes). Det gjelder både de små hverdagslige valg
      og de store langsiktige. Medvirkning i utforming av tjenester bidrar til at personer som mottar tjenester har innflytelse
      på hvordan de ønsker tjenestene skal ytes og tilpasses deres ønsker og behov. Det er ulike lover som regulerer dette
      i helse- og omsorgstjenester. Lov om pasient- og brukerrettigheter og lov om kommunale helse- og omsorgstjenester er
      noen av lovene som vektlegger medvirkning ved utforming av tjenester for borgere med behov for koordinerte helse- og
      omsorgstjenester. Rett til selvbestemmelse er også nedfelt i menneskerettighetskonvensjoner for eksempel konvensjon
      om rettigheter til personer med nedsatte funksjonsevner (CRPD). CRPD vektlegger også medvirkning ved utforming av tilbud
      om helsetjenester (for eksempel Dahlen, 2023).


      Les mer i artikkelen, [Selvbestemmelse: Lovverk og sentrale føringer](https://naku.no/kunnskapsbanken/selvbestemmelse-lovverk-og-sentrale-f%C3%B8ringer)


      Skulle vi bryte ned begrepet selvbestemmelse så ville det bestå av ulike deler: å ta valg, å forstå hva konsekvenser
      av et valg kan bety på kort og på lang sikt, forstå ulike valgmuligheter, og å forstå hva vi kan bestemme selv, hva
      vi bestemmer med andre og hva vi ikke bestemmer. Vi kan bestemme når vi skal stå opp i helgen og i ferien, men ikke
      når vi skal være på jobb eller skole til et visst tidspunkt. Vi bestemmer med andre hvilken film vi skal se på kino
      eller hva vi skal spise til middag, vi bestemmer ikke trafikkregler eller ulike tidsfrister som for eksempel når selvangivelse
      skal leveres inn. En annen del av selvbestemmelse er å forstå konsekvenser av våre valg på kort og på lang sikt. Bruker
      vi for mye penger en dag kan det være en vanlig konsekvens og erfaring at vi må låne penger av andre mens vi venter
      på ny lønning. Spiser vi for mye usunn mat en dag kan en vanlig konsekvens være at vi erfarer å bli dårlig. Å erfare
      konsekvenser av ugjennomtenkte valg er en del av læring og utvikling (Ellingsen, 2007).


      **Egne tanker om selvbestemmelse** En viktig forutsetning for å snakke om selvbestemmelse for personer med utviklingshemming
      er å lytte til personene selv og hva de legger i begrepet, hvordan de forstår selvbestemmelse og hvordan de utrykker
      sine ønsker og hva et godt liv er for dem


      Sjiraffen kultursenter i Trondheim har, på oppdrag fra NAKU, laget filmen, Tanker om selvbestemmelse. Filmen varer i
      overkant av fire minutter. I filmen møter du seks voksne personer som snakker om selsbestemmelse. De prater blant annet
      om hva selvbestemmelse handler om og eksempler på tema de bestemmer selv. De snakker også om hva de må ta hensyn til
      i omgivelsene rundt de, som blant annet vaktskifte.


      **Viktige budskap/Oppsummering:**


      - Selvbestemmelse betyr å bestemme selv, ta valg og ha kontroll over livet sitt.

      - Selvbestemmelse betyr også at andre som kjenner personen godt tolker deres kroppslige uttrykk i lys av selvbestemmelse.

      - Det er mange begreper som brukes når en beskriver selvbestemmelse. For eksempel autonomi, beslutning, medvirkning,
      aktørskap osv.

      - Å bestemme selv og ha innflytelse på livet sitt er en menneskerett.

      - Selvbestemmelse består av ulike deler: Å ta et valg, å forstå hva konsekvenser av et valg kan være på kort og lang
      sikt.

      - Det betyr å medvirke i sitt liv og å få ting til å skje.

      - Noe bestemmer vi selv, noe bestemmer vi med andre, noe bestemmer vi ikke.

      - Noen realiserer selvbestemmelsesretten sin med støtte fra andre.

      - Det kan være vanskelig å kjenne til grenser for selvbestemmelse og hvordan miljøarbeid skal utformes på en best måte
      slik at det ivaretar rett til medvirkning og selvbestemmelse.

      - Det er viktig med faglig diskusjon og refleksjon når en jobber med selvbestemmelse i praksis.

      - Det er viktig å høre med personer med utviklingshemming selv hvordan de ønsker å bli møtt og hva som er viktig for
      dem.


      Les også artikkelen, [Selvbestemmelse: Forskning](https://naku.no/kunnskapsbanken/selvbestemmelse-forskning)


      Referanser


      Dahlen, W.N. (2023) *Om selvbestemmelse i dagliglivet og samtykke til helsehjelp* . I Dahl &amp;


      Søndenaa(red.). Helse og omsorg for personer med utviklingshemming. Universitetsforlaget.


      Ellingsen, K.E. (2007). Selvbestemmelse. Egne og andres valg og verdier. Universitetsforlaget.


      Høium, K. (2022). Selvbestemmelse, samvalg og beslutningsstøtte - «hvor vanskelig kan det være?». In S. Haugland, U.
      Berge, A. Gjermestad, K. Høium, &amp; J. A. Løkke (Eds.), *Kunnskapsbasert miljøterapeutisk arbeid.* (pp. 41-62). Universitetsforlaget.


      Skarsaune, S. N. (2023). Self-determination of people with profound intellectual and multiple disabilities. *Developmental
      Medicine &amp; Child Neurology* , *65* (1), 16-23.


      Skarsaune, S. N., &amp; Hanisch, H. M. (2023). Holding and Professional Care: On Self-Determination for Persons With
      Profound Intellectual and Multiple Disabilities. *Research and Practice for Persons with Severe Disabilities* , *48*
      (1), 25-40.


      Stancliffe, R. J., Wehmeyer, M. L., Shogren, K. A., &amp; Abery, B. H. (2020). *Choice, preference, and disability:
      Promoting self-determination across the lifespan* . Springer.'
    - '# Dekning av utgifter til medisinsk forbruksmateriell på blå resept


      Legen din kan skrive ut visse typer medisinsk forbruksmateriell direkte på blå resept.


      ## Hvilket medisinsk forbruksmateriell kan du få utlevert på blå resept?


      Helfos produkt- og prislister viser hvilke produkter som kan utleveres på blå resept ved bestemte sykdommer eller tilstander.
      Eksempler på medisinsk forbruksmateriell kan være bleier ved inkontinens, eller stomiutstyr.


      Når du har fått en blå resept fra legen din, kan du få dekket produkter som står på den listen som er aktuell for din
      sykdom eller tilstand.


      Helfo kan gi dekning av utgifter til medisinsk forbruksmateriell  ved bestemte sykdommer eller tilstander etter [blåreseptforskriften
      § 5](https://lovdata.no/forskrift/2007-06-28-814/%C2%A75) .


      Du kan bare få dekket utgifter til de produktene som står oppført på produkt- og prislisten for den aktuelle sykdommen
      eller tilstanden.


      Det er kun leverandøren av de enkelte produktene som kan søke Helfo om å få sitt produkt godkjent for refusjon, og oppført,
      på de aktuelle produkt- og prislistene.


      - [Inkontinens](https://www.helfo.no/produkt-og-prislister/produkt-og-prislister/Produkt-%20og%20prisliste%20inkontinens.pdf)

      - [Urinretensjon](https://www.helfo.no/produkt-og-prislister/produkt-og-prislister/Produkt-%20og%20prisliste%20urinretensjon.pdf)

      - [Måling av glukose og keton](https://www.helfo.no/produkt-og-prislister/produkt-og-prislister/Produkt-%20og%20prisliste%20m%C3%A5ling%20av%20glukose%20og%20keton.pdf)

      - [Stomi](https://www.helfo.no/produkt-og-prislister/produkt-og-prislister/Produkt-%20og%20prisliste%20stomi.pdf)

      - [Måle- og administrasjonsutstyr](https://www.helfo.no/produkt-og-prislister/produkt-og-prislister/Produkt-%20og%20prisliste%20m%C3%A5le-%20og%20administrasjonsutstyr.pdf)

      - [Epidermolysis bullosa](https://www.helfo.no/produkt-og-prislister/produkt-og-prislister/Produkt-%20og%20prisliste%20EB-Epidermolysis%20bullosa.pdf)

      - [Iktyose](https://www.helfo.no/produkt-og-prislister/produkt-og-prislister/Produkt-%20og%20prisliste%20iktyose.pdf)

      - [Tuberkulose](https://www.helfo.no/produkt-og-prislister/produkt-og-prislister/Produkt-%20og%20prisliste%20tuberkulose.pdf)


      Det kan være begrensninger knyttet til hvor stort antall du kan få av et produkt. Det er for eksempel antallsbegrensninger
      for belter til kompresjon ved stomi. Ulike begrensninger finner du informasjon om i [rundskrivet til folketrygdloven  §
      5-14 - medisinsk forbruksmateriell.](https://www.helsedirektoratet.no/rundskriv/folketrygdloven-kap-5/rundskriv-til-folketrygdloven--5-14--medisinsk-forbruksmateriell)


      ### Kremer ved diagnosen iktyose


      Dersom du har diagnosen iktyose, kan du få dekket apotekfremstilte kremer (magistrell tilberedning) som inneholder propylenglykol,
      karbamid eller salisylsyre, selv om disse kremene ikke står på produkt- og prislisten. For å få refusjon må du sende
      kvitteringen til Helfo.


      [Her kan du søke Helfo om refusjon for utgifter til kremer ved iktyose.](/okonomi)


      ## Utlevering fra apotek eller bandasjist når du har fått blå resept på medisinsk forbruksmateriell


      Du må ha gyldig blå resept for å få utlevert produkter fra apoteket eller bandasjist.


      Apoteket eller bandasjisten kan hjelpe deg med å finne riktig produkt, og gi deg veiledning i riktig bruk av produktene.


      Du betaler bare egenandel når medisinsk forbruksmateriell utleveres på blå resept.


      ## Opptjening til frikort


      Egenandeler du betaler for medisinsk forbruksmateriell som utleveres på blå resept,  teller med i ditt grunnlag for
      [frikort for helsetjenester](/betaling-for-helsetjenester/frikort-for-helsetjenester) . Har du fått frikort, eller er
      barn under 16 år eller minstepensjonist, skal du ikke betale.


      ## Medisinsk forbruksmateriell ved yrkesskade


      Helfo kan gi full dekning av utgifter ved yrkesskade. Dette innebærer at du ikke skal betale egenandel.


      Forutsetningen er at Nav har godkjent yrkesskaden din.


      [Les om rett til dekning av utgifter til ulike helsetjenester ved yrkesskade](/rettigheter/rett-til-helsehjelp-ved-yrkesskade)


      [Les om yrkesskade i utlandet](/behandling-i-utlandet/yrkesskade-yrkessykdom-og-opphold-i-eu-eos)


      ## Kjøp av medisinsk forbruksmateriell i utlandet


      Du kan i noen tilfeller få refundert utgifter til medisinsk forbruksmateriell kjøpt i et annet land. Dette gjelder bare
      medisinsk forbruksmateriell som gir rett til stønad i Norge.


      [Les om kjøp av medisinsk forbruksmateriell i et annet EU/EØS-land](https://www.helsenorge.no/behandling-i-utlandet/medisinsk-forbruksmateriell-i-eu-eos)


      [Les om kjøp av medisinsk forbruksmateriell utenfor EU/EØS](https://www.helsenorge.no/behandling-i-utlandet/medisinsk-forbruksmateriell-utenfor-eu-eos)


      ## Fullmakt ved Helfo-henvendelser


      Kontakter du Helfo på vegne av noen andre, må du ha fullmakt.


      [Les mer om hvordan du kan ordne fullmakt ved Helfo-henvendelser.](/fullmakt/bruke-helsenorge-pa-vegne-av-andre/fullmakt-ved-kontakt-med-helfo)


      Innholdet er levert og kvalitetssikret av [Helfo](/samarbeidspartnere/#helfo)


      Slik refererer du til innholdet Helfo. Dekning av utgifter til medisinsk forbruksmateriell på blå resept. [Internett].
      Oslo: Helsedirektoratet; oppdatert onsdag 25. februar 2026 [hentet onsdag 20. mai 2026]. Tilgjengelig fra: [https://www.helsenorge.no/refusjon-og-stotteordninger/refusjon-av-utgifter-til-medisinsk-forbruksmateriell-paa-blaa-resept/](https://www.helsenorge.no/refusjon-og-stotteordninger/refusjon-av-utgifter-til-medisinsk-forbruksmateriell-paa-blaa-resept/)


      Sist oppdatert 25. februar 2026'
