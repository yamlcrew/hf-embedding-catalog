- source_sentence: Hvilke helseutfordringer kan skolehelsetjenesten hjelpe med?
  sentences:
  - '# Helsehjelp i barnehage og skole


    Mange barn og unge med en sjelden diagnose har en funksjonsnedsettelse som innebærer sammensatte medisinske utfordringer
    , og de trenger bistand for å dekke grunnleggende fysiske behov i barnehage-/ skoletiden. I likhet med andre barn med
    funksjonsnedsettelser, har de behov for hjelp i barnehage og skole for å opprettholde helse og skape vekst og utvikling.

    Til tross for at flere lover og forskrifter omfatter barns rett til helsehjelp i barnehage og skole , viser erfaring at
    det er stor variasjon når det gjelder hvordan slik helsehjelp organiseres i kommunene . Mange kommuner mangler gode rutiner
    for samarbeid mellom tjenesteytere fra helse- og omsorgssektoren og opplæringssektoren. Likeledes opplever mange tjenesteytere
    og foreldre at roller og ansvar knyttet til ivaretakelse av helse i skolen er uavklart. Dette kan medføre utrygghet både
    hos tjenesteytere, foreldre og barna/ungdommene selv.


    ## **Barns rett til helsehjelp i barnehage**


    I [Lov om barnehager](https://lovdata.no/dokument/NL/lov/2005-06-17-64?q=barnehageloven) presiser es det at barnehager
    skal ha *en helsefremmende og en forebyggende funksjon* ( § 2) , og det er kommunen s ansvar å sikre at barn med nedsatt
    funksjonsevne får et individuelt tilrettelagt barnehagetilbud ( § 19). Retten til i n dividuell tilrettelegging i kommunal
    barnehage er også nedfelt i [Lov om likestilling og forbud mot diskriminering § 20.](https://lovdata.no/dokument/NL/lov/2017-06-16-51?q=likestillings)
    Her presiseres det at barnet skal ha likeverdige utvikling s- og aktivitet smuligheter og at det k ommunal e tjenestetilbud
    et skal vurderes individuelt etter helse- og omsorgstjenesteloven. Konsekvensen av dette er at kommunen, i tillegg til
    å gi barn med funksjonsnedsettelse fortrinnsrett til barneha geplass, må fatte vedtak om nødvendig helsehjelp i barnehagen
    .


    ## **Elevens rett til helsehjelp i skolen**


    Opplæringsloven presiserer at skolen aktivt skal drive et kontinuerlig og systematisk arbeid for å fremme elevenes helse,
    miljø og trygghet , og at dette arbeidet skal gjelde både det fysiske og psykososiale miljøet. Det er helse- og omsorgstjenesten
    i komm unen som har ansvar for at elever som har behov for det får de helse- og omsorgstjeneste ne de trenger i skoletiden
    , og det er skoleledelsen som har ansvaret for den daglige gjennomføringen .


    Brukerstyrt personlig assist anse (BPA) gis vanligvis ikke i skoletiden, men enkelte kommuner gjør unntak. [Les Helse-
    og omsorgsdepartementets rundskriv om BPA](https://www.regjeringen.no/no/aktuelt/nytt-rundskriv-om-brukerstyrt-personlig-assistanse/id2468566/)
    . Det anbefales " å finne løsninger som kan ivareta helheten i det samlede tjenestetilbudet ". Å sørge for et helhetlig
    tjenestetilbud er en sterk politisk føring, og k ommunen bør derfor samordne ulike assistenttiltak slik at eleven får
    et begrenset antall personer å forholde seg til.


    ## **Helsehjelp og barnepalliasjon**


    I 2019 utga Helsedirektoratet retningslinjen [Palliasjon til barn og unge](https://www.helsedirektoratet.no/retningslinjer/palliasjon-til-barn-og-unge)
    . Her tas det utgangspunkt i [Verdens helseorganisasjons (WHO) defi nisjon av barnepalliasjon](https://www.who.int/cancer/palliative/definition/en/)
    som


    «... *en aktiv og helhetlig støtte til barnets og familiens fysiske, psykiske, sosiale og eksistensielle behov, som starter
    ved diagnosetidspunktet og varer livet ut* ».


    Tilbudet mange barn og unge med sjeldne diagnoser får i barnehage og skole passer inn under denne definisjonen . I retningslinjene
    er b arnehage og skole nevnt som viktige samarbeidspartnere for helsesektoren . Det presiseres imidlertid ikke hvilke
    n rolle eller hva slags ansvar pedagogisk personale har innenfor barnepalliasjon , og den avgjørende b etydningen barnehage
    og skole har for disse barna kommer ikke t ydelig frem.


    Frambus entydige erfaring er at for barn med alvorlig sykdom representerer barnehage n og skole n en særlig viktig del
    av dagliglivet . I tillegg til å legge til rette for gode dager og utvikling så langt det er mulig, bidrar disse arenaene
    til å normalisere et ellers kaotisk og uforutsigbart liv. Det er også vist at foreldre til barn med alvorlig sykdom opplever
    det som godt å se ba rn a i sine vante omgivelser og sammen med jevnaldrende (Brown, 2012).


    Frambu mener at begrepene helsehjelp og barnepalliasjon langt på vei kan sidestilles med tanke på fysisk og medisinsk
    oppfølging av barn med alvorlig sykdom i barnehage og skole . Vi mener derfor at det er viktig at p edagogisk personale
    som arbeider med barn med sjeldne diagnoser som medfører alvorlig sykdom , gjør seg kjent med hva barnepalliasjon innebærer
    og etterspør barnehagen s og skolens plass i denne type oppfølging .


    ## **Medisinering i barnehage, skole og SFO**


    Ansvaret for å sørge for hjelp til legemiddelhåndtering i barnehager, skoler og skolefritidsordninger er i dag ikke uttrykkelig
    regulert verken i helselovgivningen, barnehagelovgivningen eller opplæringslovgivning. Helse- og omsorgsdepartementet
    og Kunnskapsdepartementet har derfor redegjort fo r hvordan dagens regelverk skal forståes i [Rundskriv for legemiddelhåndte
    r ing i barnehage, skole og SFO](https://www.regjeringen.no/no/dokumenter/handtering-av-legemidler-i-barnehage-sko/id516373/)
    . I dette skrive t står det at opplæringslo vgivningen tolkes slik at kommunen har ansvar for at barn får legemidler når
    de er i barnehagen, på skolen eller i SFO. Det kan for eksempel være å gi dem tabletter eller å sette sprøyter. Om det
    er barnehagen/ skolen eller helsetjenesten sitt ansvar, avhenger av om medisineringen må utføres av helsepersonell eller
    ikke.


    Barnehagen og s kolen har bare ansvar for å gi eleve r legemidler hvis legen som skriver ut legemidle ne mener at det
    er forsvarlig å la pedagogisk personell gi barnet legemidle ne . Er det ikke forsvarlig, må kommunen sørge for at helsepersonell
    gir barnet legemidlene. Helsestasjon s - og skolehelsetjenesten skal bidra til at det etableres rutiner for håndtering
    av legemidler i barnehager, skoler og SFO. Les mer i [Forskrift om helsestasjon og skolehelsetjenesten](https://lovdata.no/dokument/SF/forskrift/2018-10-19-1584?q=Forskrift%20om%20kommunens%20helsefremmende%20og)
    .


    Kommunen må sørge for at ansatte som skal hjelpe barnet med å ta legemidler, får nødvendig informasjon og opplæring. Opplæringen
    bør omfatte den enkelte elevs sykdom og behov, administrering av legemiddelet, førstehjelp, rutiner for kontakt med helsetjenesten,
    innhenting av samtykke fra foreldre og taushetsplikt. Det er ofte foreldrene alene, eller sammen med behandlende lege,
    som gir denne opplæringen. Skjer det en skade på grunn av manglende organisering eller opplæring fra kommunens side, er
    kommunen ansvarlig.


    I [Rundskriv for legemiddelhåndtering i barnehage, skole og SFO](https://www.regjeringen.no/no/dokumenter/handtering-av-legemidler-i-barnehage-sko/id516373/)
    , presiseres det at b arnehage r ikke har plikt til å bistå med håndtering av legemidler . Dette må derfor avtales i hvert
    enkelt tilfelle . Når det gjelder skole så har barnet en rett og en plikt til grunnskoleopplæring og for at denne skal
    være reell for alle barn er det inn fortolket som en del av kommunens overordnede ansvar å sørge for elever med behov
    for bistand med legemiddelhåndterin g.


    .


    ## **Organisering av helsehjelp i barnehage og skole**


    Hvordan helsehjelp organiseres og utøves varierer fra barnehage til barnehage og fra skole til skole. For at barn med
    funksjonsnedsettelser skal oppleve sammenheng og helhet i sine liv innenfor barnehagens- og skolens rammer er det nødvendig
    at tilbudet om helsehjelp koordineres. Det er også viktig at det etableres tett samarbeid mellom tjenesteytere fra ulike
    sektorer i kommunen. Betydningen av tverrfaglig samarbeid understrekes i den nasjonalfaglige veilederen [samarbeid om
    tjenester til barn, unge og deres familier](https://www.helsedirektoratet.no/veiledere/samarbeid-om-tjenester-til-barn-unge-og-deres-familier)
    . .


    ## **Forutsetninger for god organisering av helsehjelp i barnehage og skole**


    - Et godt tverrfaglig og tverretatlig samarbeid

    - Barnets behov er kartlagt og dokumentert

    - Planlegging og gjennomføring av helsehjelp tar utgangspunkt i barnets personlige plandokumenter, lover og forskrifter

    - Økonomi, ansvarsfordeling og ansvarsforhold er klarlagt og skriftlig dokumentert


    #####


    ## **Ivaretakelse av barnets grunnleggende behov**


    For barn med sammensatte medisinske utfordringer kan en viktig del av barnehage - / skolehverdagen bestå i å ivareta grunnleggende
    fysiologiske behov .


    Eksempler på slike behov kan være:


    - å puste

    - å spise og drikke (eventuelt medisiner)

    - å tømme blære og tarm (eliminasjon)

    - å være i bevegelse

    - å hvile/sove

    - lys og varme

    - god luftkvalitet

    - god hygiene


    Slike grunnleggende behov er universelle og må langt på vei være dekket før barnet evner å lære og utvikle seg fysisk,
    faglig og sosialt. Barn med ulike sjeldne diagnoser har ulik type og grad av funksjonsnedsettelse . H va barnet trenger
    hjelp til og hvordan denne hjelpen skal utøves vil derfor variere. Barnehagen og s kolen må innhente kunnskap om barnets
    diagnose, forutsetninger og behov, samt hvilke rutiner og prosedyrer det er nødvendige å følge. Dersom barnehagen/ skole
    n ikke innehar den nødvendige kompetanse n , plikter de å innhente bistand fra andre instanser.


    De feste barn med sammensatte medisinske utfordringer har rett til [individuell plan](https://frambu.no/tema/individuell-plan/)
    (IP) og [ansvarsgruppe](https://frambu.no/tema/ansvarsgruppe/) . IP er et viktig verktøy for samarbeidet mellom eleven,
    foresatte og de ulike tjenesteyterne, og den gir en god oversikt over mål, tiltak og ansvarsforhold.


    ## **Ulik typer helsehjelp som ytes i barnehage og skole**


    I hvilket omfang barn med sjeldne diagnoser har behov for helsehjelp i barnehage og skole variere r , ut fra hvilken diagnose
    de har , hvor alvorlig utslagene av diagnose n er og hva slags helsehjelp det gjelder. Behovene kan variere fra enkel
    tilrettelegging eller påminnelser til svært store hjelpebehov i alle daglige gjøremål. Nedenfor gis det eksempler på områder
    der barn med sammensatte medisinske behov kan ha behov for hjelp, samt hva helsehjelpen kan bestå i:


    - *medisinering* (se [Rundskriv for legemiddelhåndtering i barnehage, skole og SFO](https://www.regjeringen.no/globalassets/upload/hod/dokumenter-fha/rundskriv/i-5_2008_rundskriv-av-11_06_08---rettet-14_08_08.pdf)
    )

    - *pust og ventilering* ( se [e-læringskurset PUST](https://helse-bergen.no/avdelinger/lungeavdelinga/nasjonal-kompetansetjeneste-for-hjemmerespiratorbehandling/e-lering-pust)
    )

    - *astma og epilepsi* (se [Astma - og allergiforbundet](https://www.naaf.no/) og [Helse norge.no](https://helsenorge.no/sykdom/hjerne-og-nerver/epilepsi)
    )

    - *ernæring og sondemating* ( se [egen te maside f rambu.no](https://frambu.no/temaer/#expand-3674) )

    - *eliminasjon* ( se [Helsedirektoratet](https://www.helsedirektoratet.no/retningslinjer/hjerneslag/rehabilitering-etter-hjerneslag/svelgevansker-ernaering-og-eliminasjon)
    )

    - f *orflytning* (lett støtte, rullestol eller annet hjelpemiddel)

    - *fysisk aktivitet og fysioterapi* (forebygge, stimulere og/eller opprettholde funksjon)

    - *hjelpemidler og tilrettelegging i hverdagen* ( se [egen temaside f rambu.no](https://frambu.no/temaer/#expand-3686)
    )

    - *energiøkonomisering og aktivitetsprioritering* ( se [egen temaside frambu.no](https://frambu.no/tema/energiokonomisering/)
    )


    ##### **Nyttige nettsteder**


    - [Lovdata](https://lovdata.no/) Her f i nner du alle lover og forskrifter samlet på ett sted

    - [Knappenforeningen](https://www.knappenforeningen.no/) Foreldreforening for barn med spise- og ernæringsvansker

    - [Mick-Key](https://www.mic-key.no/) Praktisk informasjon om sonde og sondemating

    - [Spesialsykehuset for epilepsi](https://oslo-universitetssykehus.no/avdelinger/nevroklinikken/spesialsykehuset-for-epilepsi-sse)
    Bistår med å få stilt riktig diagnose og gir råd om god oppfølging og behandlingen av epilepsi

    - [Nasjonalt kompetansesenter for oral helse ved sjeldne diagnose](https://www.lds.no/avdelinger/tako-senteret/) Tilbyr
    informasjon, rådgivning og kurs til fagpersoner som jobber med personer med sjeldne diagnoser og problemer med tenner
    eller munnhelse

    - [www.frambu.no](https://www.frambu.no/) Har både diagnosebeskrivelser og temaartikler

    - [helsenorge.no](https://helsenorge.no/sjeldne-diagnoser/kompetansesentrene) Gir oversikt over de ulike sjeldensentrene
    og deres ansvarsområder


    *Denne artikkelen ble faglig oppdatert i mars 2020*'
  - '# Grunnstønad


    Du kan søke om grunnstønad når du/barnet har nødvendige ekstrautgifter på grunn av varig sykdom, skade eller medfødt tilstand.
    Med ekstrautgifter menes utgifter som friske personer ikke har.


    Du må dokumentere ekstrautgiftene gjennom kvitteringer du samler i en tremåneders-periode eller en oversikt som sannsynliggjør
    de nødvendige løpende utgiftene du/barnet har.


    NAV skriver på sine nettsider at du ikke behøver å sende inn legeerklæring, kun oppgi hvilken eller hvilke leger som behandler
    deg/barnet. Når det handler om en sjelden diagnose, ser Frambu likevel fordeler ved at legeerklæring legges ved med en
    gang slik at NAV raskt ser det medisinske og funksjonelle grunnlaget for søknaden. NAVs saksbehandlere kjenner ikke like
    godt til sjeldne diagnoser som mer kjente diagnoser. Det er derfor viktig at den legen som kjenner deg/barnet beskriver
    nøye de funksjonelle konsekvensene av diagnosen hos deg/barnet som er viktige for NAVs vurdering av søknaden om grunnstønad.
    I tillegg kan det vær aktuelt å legge ved spesialisterklæringer for eksempel fra barnehabiliteringstjenesten, uttalelser
    fra andre behandlere, skolehelsetjenesten, barne- og ungdomspsykiatrien (BUP), pedagogiske psykologisk tjeneste (PPT),
    skole, barnehage eller andre som kan belyse ekstrautgiftenes art og omfang.


    Ved søknad om grunnstønad sats 1 til klesslitasje på grunn av hyperkinetiske forstyrrelser, herunder ADHD med hyperaktivitet,
    trenger du ikke legge ved dokumentasjon på ekstrautgifter.


    [SIFOs referansebudsjett](https://www.hioa.no/Om-HiOA/Senter-for-velferds-og-arbeidslivsforskning/SIFO/Referansebudsjettet)
    viser  forbruksutgifter for ulike typer hushold og enkeltpersoner. Ditt/barnets dokumenterte forbruk må sammenlignes med
    SIFOs satser for tilsvarende utgifter. Det er merutgiftene som utgjør grunnlaget for grunnstønad.


    Grunnstønad gis til løpende utgifter, ikke til engangsutgifter.. Du/Barnet må ha utgifter høyere enn sats 1 for å kunne
    søke om grunnstønad. Det er [seks ulike satser](https://www.nav.no/no/nav-og-samfunn/kontakt-nav/oversikt-over-satser/grunn-og-hjelpestonad_kap)
    .


    Når flere familiemedlemmer har ekstrautgifter, kan familieenheten ses på som én søkerenhet og gis grunnstønad dersom de
    godkjente ekstrautgiftene for familieenheten samlet overstiger de ulike satsene.


    Grunnstønad ytes til et medlem som på grunn av varig sykdom, skade eller medfødt tilstand, har nødvendige ekstrautgifter


    - til drift av tekniske hjelpemidler

    - til transport, herunder drift av medlemmets bil

    - til hold av førerhund

    - på grunn av fordyret kosthold ved nødvendig spesialdiett som er vitenskapelig dokumentert og alminnelig anerkjent i
    medisinsk praksis for den aktuelle diagnosen

    - som følge av slitasje på klær og sengetøy

    - til hold av servicehund gitt med hjemmel i forskrift


    Personer med nedsatt funksjonsevne kan ha utgifter som friske personer ikke har. Har du/barnet for eksempel hjelpemidler
    slik som rullestol, aktivitetshjelpemidler, elektrisk seng, kommunikasjonsutstyr eller lignende som må lades eller bytte
    batterier? Må du kjøre bil når andre kan gå eller ta kollektivtransport på grunn av din egen eller barnets funksjonsnedsettelse?
    Har du/barnet utgifter til en godkjent servicehund som hjelper deg/barnet med praktiske gjøremål? Må du vaske og kjøpe
    klær oftere enn andre på grunn av din egen eller barnets funksjonsnedsettelse?


    Hvem kan få? Hva kan du/barnet få? Hvor mye kan du/barnet få? Hvor lenge kan du/barnet få? Hvordan søke? [Les mer om grunnstønad
    på nav.no](https://www.nav.no/no/Person/Familie/Grunn+og+hjelpestonad/grunnst%C3%B8nad)


    Retten til grunnstønad er beskrevet i [folketrygdloven kapittel 6](https://lovdata.no/dokument/NL/lov/1997-02-28-19/KAPITTEL_5-2#%C2%A76-3)
    .


    Du bør også gjøre deg kjent med [rundskriv § 6-3 Grunnstønad](https://lovdata.no/nav/rundskriv/r06-00) . Her ser du  blant
    annet hvordan legeerklæringen bør utformes og hvordan NAV vurderer arten og omfanget av ekstrautgiftene opp mot de ulike
    grunnstønadssatsene.


    . *Denne artikkelen ble faglig oppdatert 31. januar 2024*


    .'
  - '# Skolehelsetjenesten


    Skolehelsetjenesten er et helsetilbud til alle elever på barneskolen, ungdomsskolen og videregående skole. I skolehelsetjenesten
    kan du snakke med helsesykepleier og noen ganger også skolelege, fysioterapeut og psykolog. De som jobber der, har taushetsplikt.


    ## Hva er skolehelsetjenesten?


    Skolehelsetjenesten er et helsetilbud på skolen for barn og ungdom.


    Formålet til skolehelsetjenesten er, i samarbeid med skolen, å fremme elevenes helse, trivsel og læring. De skal også
    bidra til mestring av hverdagsutfordringer og øke deres helsekompetanse. Skolehelsetjenesten er tverrfaglig og består
    av helsesykepleier og lege. I tillegg bør tjenesten ha fysioterapeut og kan ha psykolog.


    Skolehelsetjenesten samarbeider med skole og fastlege. Ved behov samarbeider de også med andre tjenester for barn og unge
    i kommunen eller spesialisthelsetjenesten.


    Det er helsesykepleier som utfører de fleste oppgavene i skolehelsetjenesten. Helsesykepleier har sykepleierutdanning
    med videreutdanning i helsefremmende og forebyggende arbeid for barn og unge.


    ## Hvordan ta kontakt med skolehelsetjenesten?


    Du trenger ikke bestille time eller ha en avtale for å snakke med helsesykepleier eller andre i skolehelsetjenesten. Det
    er bare å møte opp (drop-in). Hvis helsesykepleier ikke er til stede eller er opptatt, står det ofte en beskjed på døren.


    Kontaktinformasjonen til skolehelsetjenesten skal stå på nettsiden til din kommune eller skole.


    Læreren din kan også hjelpe deg med å komme i kontakt.


    ## Hva tilbyr skolehelsetjenesten?


    Skolehelsetjenesten gir tilbud om:


    - helsesamtaler

    - [vaksinering](/vaksinasjon/barnevaksinasjonsprogrammet)

    - veiing og måling

    - undervisning i grupper og klasser om blant annet fysisk-, psykisk- og seksuell helse

    - drop-in/Åpen dør


    Du kan selv ta kontakt og spørre om det du lurer på. Du kan ta kontakt med en i skolehelsetjenesten hvis du har en venn
    som trenger hjelp.


    Helsesykepleier kan delta på foreldremøter og informere om skolehelsetjenestens tilbud.


    Foresatte eller barnet vil bli kalt inn til konsultasjonene, per post eller telefon (sms). Stadig flere kommuner kaller
    inn digitalt via Helsenorge.


    ## Faste konsultasjoner hos skolehelsetjenesten


    - [1. trinn - skolestartundersøkelse](https://www.helsenorge.no/hjelpetilbud-i-kommunene/skolehelsetjenesten/skolestartundersokelse/)

    - [2. trinn - vaksinering](https://www.helsenorge.no/hjelpetilbud-i-kommunene/skolehelsetjenesten/vaksine-2-trinn/)

    - [3. trinn - veiing og måling](https://www.helsenorge.no/hjelpetilbud-i-kommunene/skolehelsetjenesten/veiing-og-maling-3-trinn/)

    - [6. trinn - vaksinering](https://www.helsenorge.no/hjelpetilbud-i-kommunene/skolehelsetjenesten/vaksine-6-trinn/)

    - [7. trinn - vaksinering](https://www.helsenorge.no/hjelpetilbud-i-kommunene/skolehelsetjenesten/vaksine-7-trinn/)

    - [8. trinn - helsesamtale](https://www.helsenorge.no/hjelpetilbud-i-kommunene/skolehelsetjenesten/helsesamtale-8-trinn/)

    - [10. trinn - vaksinering](https://www.helsenorge.no/hjelpetilbud-i-kommunene/skolehelsetjenesten/vaksine-10-trinn/)


    ### Temaer du kan ta opp hos skolehelsetjenesten


    Du kan ta opp det du ønsker i samtale med skolehelsetjenesten. Temaer som er vanlig å snakke om er blant annet:


    - kropp og helse

    - pubertet

    - forelskelse

    - seksuell legning, lhbtiq

    - kjønnsidentitet

    - vennskap

    - mobbing, gjelder og på sosiale medier

    - relasjoner og utfordringer med venner eller familie

    - bekymringer, stress og andre vanskelige tanker

    - vold og overgrep, gjelder også på sosiale medier

    - rus og avhengighetsproblematikk, inkludert spilleproblemer


    Noen ganger kan du trenge mer oppfølging. Da kan skolehelsetjenesten sette deg i kontakt med for eksempel rådgiver eller
    sosiallærer på skolen, fastlege, tannlege, fysioterapeut eller psykolog.


    Når du har vært hos skolehelsetjenesten, kan det være lurt å få bekreftelse på tiden du har vært der, slik at du ikke
    får ugyldig fravær.


    ### Foresatte kan be om hjelp fra skolehelsetjenesten


    Hvis du som foresatt opplever at barnet har helseutfordringer som kommer i veien for læring, kan du ta kontakt med skolehelsetjenesten.


    Skolehelsetjenesten kan, i samarbeid med skolen, sørge for ekstra tilrettelegging og tettere oppfølging av eleven. Dette
    kan være aktuelt hvis barnet opplever perioder med helseutfordringer, mobbing eller har en vanskelig familiesituasjon.


    ## Helsepersonell har taushetsplikt


    Ansatte i skolehelsetjenesten har taushetsplikt, men det finnes unntak. De har blant annet plikt til å involvere foreldre
    eller foresatte i tilfeller der det er nødvendig.


    Noen ganger må helsepersonell gi opplysninger om deg videre, for eksempel til barnevernet eller politiet. Det kan være
    i situasjoner du er i fare for å skade deg selv eller andre, eller hvis det er tydelig at du ikke har det bra hjemme.
    Helsesykepleier vil snakke med deg og begrunne hvorfor foreldre eller andre bør involveres.


    ### Når du er under 12 år


    Når du er under 12 år må helsesykepleier i de fleste tilfeller fortelle foreldrene dine at du har vært hos skolehelsetjenesten
    og hva dere har snakket om. Helsesykepleier (eller den i skolehelsetjenesten du har snakket med) bør fortelle deg at de
    skal snakke med foreldrene dine og hva som vil bli sagt.


    ### Når du er mellom 12 og 16 år


    Når du er mellom 12 og 16 år, kan du be om at foreldrene dine ikke blir kontaktet. Det er likevel helsesykepleier som
    bestemmer om foreldrene dine bør informeres. I disse tilfellene bør helsesykepleier snakke med deg først og begrunne hvorfor.


    ### Når du er 16 år


    Er du over 16 år, blir ikke opplysninger om deg delt med foreldrene dine uten at du har sagt ja til det. Å gi en slik
    tillatelse kalles å gi samtykke. Noen ganger må helsepersonellet gi opplysninger til foreldrene dine også når du er over
    16 år. Dette gjelder i situasjoner hvor informasjonen er nødvendig for at foreldrene dine skal kunne oppfylle foreldreansvaret
    sitt. I slike tilfeller skal du få informasjon om at helsepersonellet kontakter foreldrene dine.


    ## Helsestasjon for ungdom


    I tillegg til skolehelsetjenesten skal det være et tilbud om [Helsestasjon for ungdom mellom 12 og 20 år](/hjelpetilbud-i-kommunene/helsestasjon-for-ungdom)
    i din kommune. Mange kommuner har utvidet tilbud opp til 24 år.


    For å finne nærmeste helsestasjon for ungdom og få mer informasjon, kan du sjekke kommunen din sine nettsider.


    ## [Helsenorge for ungdom](https://www.helsenorge.no/ungdom/)


    Allerede fra du er 13 år kan du bruke Helsenorge. Les mer om hva du kan få tilgang til.


    Referanser


    [Helsestasjon og skolehelsetjenesten. Nasjonal faglig retningslinje.](https://www.helsedirektoratet.no/retningslinjer/helsestasjons-og-skolehelsetjenesten)
    Helsedirektoratet, 11. november 2019.


    Innholdet er levert og kvalitetssikret av [Helsedirektoratet](/samarbeidspartnere/#helsedirektoratet)


    Slik refererer du til innholdet Helsedirektoratet. Skolehelsetjenesten. [Internett]. Oslo: Helsedirektoratet; oppdatert
    torsdag 11. mai 2023 [hentet onsdag 20. mai 2026]. Tilgjengelig fra: [https://www.helsenorge.no/hjelpetilbud-i-kommunene/skolehelsetjenesten/](https://www.helsenorge.no/hjelpetilbud-i-kommunene/skolehelsetjenesten/)


    Sist oppdatert 11. mai 2023'
- source_sentence: 4-åringen min har fått blå resept på medisinsk utstyr – må jeg betale noe selv, eller får vi alt gratis?
  sentences:
  - '# Tannregulering til barn og unge


    Mange barn og unge har i dag tannregulering. Barn og unge kan få frå 40 til 100 prosent stønad frå Helfo, avhengig av
    kva slags behandling kjeveortopeden meiner det er behov for. Kor stor dekninga blir, er basert på fastsette takstar for
    tannbehandling.


    Helfo gir ingen stønad til behandling som berre har eit kosmetisk føremål.


    ## Krav for at Helfo skal gje stønad til tannregulering


    Desse krava må vere oppfylt for at Helfo skal kunne gje stønad:


    - For at pasienten skal ha rett til stønad, må behandlinga vere påbegynt seinast det året pasienten fyller 20 år.

    - Kjeveortopeden må ha direkte oppgjer med Helfo. Med direkte oppgjer blir stønaden utbetalt direkte til kjeveortopeden,
    slik at pasienten berre må betale eigenandelen.


    ## Du må rekne med ei eigenbetaling


    Kjeveortopedar har fri prissetting, og kan derfor ta meir betalt for behandlinga enn det stønaden frå Helfo dekker.


    Det betyr at pasientane må rekne med å måtte betale ein del av behandlinga sjølv, også dei som har rett til 100 prosent
    stønad.


    ## Treng barnet/ungdommen tannregulering?


    Foreldre som lurer på om barnet deira treng tannregulering, må gå via tannlege eller tannpleier i den offentlege tannhelsetenesta
    for å få ei vurdering.


    Det same gjeld unge vaksne som fyller 19 eller 20 år i behandlingsåret. Tannlegen eller tannpleiaren skal gjere ei sjølvstendig
    vurdering av behandlingsbehovet, og eventuelt tilvise (henvise) videre til kjeveortoped.


    Det er kjeveortopeden som avgjer om barnet treng behandling, og i så fall kva for behandling.


    ## Utvida stønad for familiar med fleire enn eitt barn


    **** Familiar med fleire enn eitt barn med behov for kjeveortopedisk behandling kan ha krav på utvida stønad (søskenmoderasjon),
    etter nærare fastsette vilkår. Den føresette må opplyse kjeveortopeden om at det er fleire søsken i familien med tannregulering,
    og dokumentere at behandlinga av det første barnet har påført familien faktiske utgifter.


    Ordninga med utvida stønad til utgifter til kjeveortopedisk behandling gjeld familiar der fleire enn eitt barn har behov
    for slik behandling. Utvida stønad gjeld frå det neste barnet (med behov for tannregulering) og dei påfølgjande søskena.


    - Heilsøsken, halvsøsken og fostersøsken blir definerte som søsken.

    - Stesøsken blir ikkje definerte som søsken i denne samanhengen.


    Sjå eventuelt [informasjon frå Nav om bidrag frå den andre forelderen til særlege utgifter som tannregulering, konfirmasjon
    og briller.](https://www.nav.no/bidrag-utgifter)


    ## Tannregulering for vaksne


    Hovudregelen er at vaksne må betale for tannbehandlinga dei har behov for, men i nokre tilfelle kan pasienten få stønad
    frå Helfo til tannregulering, uavhengig av alder. Dette kan vere tilfelle ved:


    - rehabilitering ved tanntap som følgje av marginal periodontitt

    - tannagenesi (medfødd manglande tann-anlegg)

    - tannskadar ved godkjend yrkesskade

    - tannskade ved ulukke som ikkje er yrkesskade


    Vaksne som lurer på om dei kan ha krav på stønad frå Helfo til tannregulering, må ta kontakt med tannlegen sin.


    Tannlegen kan vurdere om de fell inn under nokon av [tilstandane/tilfella som kan gje rett til stønad frå Helfo. ](https://www.helsedirektoratet.no/rundskriv/folketrygdloven-kap-5/folketrygdloven--5-6--5-6-a-og--5-25--undersokelse-og-behandling-hos-tannlege-og-tannpleier-for-sykdom-og-skade)


    ## [Hvem betaler tannlegeregningen?](https://www.helsenorge.no/nn/betaling-for-helsetjenester/hvem-betaler-tannlegeregningen-din/)


    Barn får gratis tannbehandling i den offentlige tannhelsetjenesten. Voksne må i utgangspunktet betale selv, men det finnes
    mange unntak.


    Illustrasjon: Morten Rakke / Helfo


    ## Rettleiing Helsenorge


    [23 32 70 00](tel:+4723327000)


    Hverdager kl. 08:00 - 15:30


    Innhaldet er levert og kvalitetssikra av [Helfo](/nn/samarbeidspartnere/#helfo)


    Slik refererer du til innhaldet Helfo. Tannregulering til barn og unge. [Internett]. Oslo: Helsedirektoratet; oppdatert
    tirsdag 3. mai 2022 [henta onsdag 20. mai 2026]. Tilgjengeleg frå: [https://www.helsenorge.no/nn/tannhelse/tannregulering-til-barn-og-unge/](https://www.helsenorge.no/nn/tannhelse/tannregulering-til-barn-og-unge/)


    Sist oppdatert 3. mai 2022'
  - '# Selvbestemmelse


    Ordet selvbestemmelse er et sammensatt begrep og kan forklares på mange ulike måter. Andre beslektede ord som knyttes
    til begrepet kan være autonomi, aktørskap, medvirkning, samproduksjon, samskaping, beslutningsstøtte, brukermedvirkning,
    medborgerskap og empowerment. Mange forbinder selvbestemmelse med å ta et valg, forstå hvilke valg vi har, og hva et valg
    kan bety for oss på kort sikt og på lang sikt. Men selvbestemmelse er mer sammensatt og omfattende enn som så.


    Vi kan for eksempel snakke om å kunne påvirke vår hverdag, å ha kontroll, å ta valg i hverdagslige situasjoner, som for
    eksempel hva vi skal spise eller hva vi skal gjøre i fritiden vår. Vi kan også snakke om å ha innflytelse på større valg
    i livet (livsvalg) som for eksempel hvor vi skal bo, hva et godt liv betyr for oss eller hvilke ønsker vi har for livet,
    f.eks. om jobb, relasjoner, bosituasjon, aktiviteter osv. Videre kan vi snakke om det å være anerkjent som en aktør i
    eget liv, at vi kan få ting til å skje i våre liv. Selvbestemmelse kan derfor forstås som en betingelse for god livskvalitet
    (for eksempel Ellingsen, 2007).


    **Selvbestemmelse må øves** Selvbestemmelse er noe som utvikles over tid, gjerne i nære relasjoner. Selvbestemmelse kan
    forstås som en ferdighet på lik linje med andre ferdigheter og er noe man for eksempel som barn og unge øver seg på med
    støtte fra foreldre. Gjennom øving over tid kan ferdigheter i å gradvis gjøre mer avanserte vurderinger om valg utvikles
    (for eksempel Stancliffe, Wehmeyer, Shogren, &amp; Abery, 2020).  Mer om dette lenger ned i teksten.


    Personer med utviklingshemming lever ofte store deler av livene sine med støtte fra andre. Noen er selvstendige og klarer
    seg for det meste helt selv. De kan ha behov for støtte ved spesifikke situasjoner som ved administrering av medisiner,
    husvask, matlaging eller kjøring til og fra aktiviteter. Andre igjen vil ha behov for hjelp og støtte kontinuerlig i mange
    hverdagslige situasjoner som f.eks. ved personlig hygiene, ernæring, forflytting, søvn, kommunikasjon og andre aktiviteter
    døgnet rundt (Ellingsen, 2007).


    Noen vil kunne bestemme selv/eller ta et valg selv mens andre vil trenge støtte fra andre for å kunne foreta et valg.
    En person som uttrykker seg uten ord har den samme retten som andre til å bestemme og gi uttrykk for sine ønsker, for
    eksempel gjennom kroppslige uttrykk, og på den måten medvirke i utforming av tjenester og i hverdagslivet. Noen ganger
    er det familiemedlemmer eller andre støttepersoner rundt som kjenner en godt som kan være med på å fremme den enkeltes
    interesser og ønsker. Den enkeltes ønsker skal vektlegges. Personale kan over tid også lære seg å tolke personens kroppslige
    utrykk og å tolke disse i lys av selvbestemmelse. Det betyr at personale må få tid og rom til å bli godt kjent med den
    de yter tjenester til slik at de får mulighet til å utvikle trygge og tillitsfulle relasjoner som kan fremme interesser
    og ønsker til den det gjelder (Skarsaune, 2023; Skarsaune &amp; Hanisch, 2023).


    Når vi snakker om selvbestemmelse for personer med utviklingshemming så kan det noen ganger være utfordrende å vite hva
    vanlige erfaringer er, hva bør personer med utviklingshemming erfare som alle andre, og når bør vi hjelpe til. Tilrettelegging
    for selvbestemmelse kan i praksis oppleves som utfordrende noen ganger (Høium, 2022).


    **Om medvirkning og selvbestemmelse** Medvirkning og selvbestemmelse er ikke det samme, men begge begrepene vektlegger
    viktighet av å lytte til ønsker, erfaringer og kunnskap til den som skal medvirke, slik at tjenester og støtte i så stor
    grad det er mulig er utformet slik personer med utviklingshemming selv ønsker det.  Mens medvirkning går ut på å skape
    rom for uttrykk av meninger og på den måten få mulighet til å påvirke utforming av f.eks. tjenester går selvbestemmelse
    ut på å ha mer direkte innflytelse på hvordan en hverdag kan se ut. Uansett om en trenger mye eller lite støtte har alle
    som mottar helse- og omsorgstjenester rett til å medvirke i valg og utforming av tjenestetilbud. De skal være tatt med
    på råd og på å bestemme hvordan tjenestene skal se ut (utformes og ytes). Det gjelder både de små hverdagslige valg og
    de store langsiktige. Medvirkning i utforming av tjenester bidrar til at personer som mottar tjenester har innflytelse
    på hvordan de ønsker tjenestene skal ytes og tilpasses deres ønsker og behov. Det er ulike lover som regulerer dette i
    helse- og omsorgstjenester. Lov om pasient- og brukerrettigheter og lov om kommunale helse- og omsorgstjenester er noen
    av lovene som vektlegger medvirkning ved utforming av tjenester for borgere med behov for koordinerte helse- og omsorgstjenester.
    Rett til selvbestemmelse er også nedfelt i menneskerettighetskonvensjoner for eksempel konvensjon om rettigheter til personer
    med nedsatte funksjonsevner (CRPD). CRPD vektlegger også medvirkning ved utforming av tilbud om helsetjenester (for eksempel
    Dahlen, 2023).


    Les mer i artikkelen, [Selvbestemmelse: Lovverk og sentrale føringer](https://naku.no/kunnskapsbanken/selvbestemmelse-lovverk-og-sentrale-f%C3%B8ringer)


    Skulle vi bryte ned begrepet selvbestemmelse så ville det bestå av ulike deler: å ta valg, å forstå hva konsekvenser av
    et valg kan bety på kort og på lang sikt, forstå ulike valgmuligheter, og å forstå hva vi kan bestemme selv, hva vi bestemmer
    med andre og hva vi ikke bestemmer. Vi kan bestemme når vi skal stå opp i helgen og i ferien, men ikke når vi skal være
    på jobb eller skole til et visst tidspunkt. Vi bestemmer med andre hvilken film vi skal se på kino eller hva vi skal spise
    til middag, vi bestemmer ikke trafikkregler eller ulike tidsfrister som for eksempel når selvangivelse skal leveres inn.
    En annen del av selvbestemmelse er å forstå konsekvenser av våre valg på kort og på lang sikt. Bruker vi for mye penger
    en dag kan det være en vanlig konsekvens og erfaring at vi må låne penger av andre mens vi venter på ny lønning. Spiser
    vi for mye usunn mat en dag kan en vanlig konsekvens være at vi erfarer å bli dårlig. Å erfare konsekvenser av ugjennomtenkte
    valg er en del av læring og utvikling (Ellingsen, 2007).


    **Egne tanker om selvbestemmelse** En viktig forutsetning for å snakke om selvbestemmelse for personer med utviklingshemming
    er å lytte til personene selv og hva de legger i begrepet, hvordan de forstår selvbestemmelse og hvordan de utrykker sine
    ønsker og hva et godt liv er for dem


    Sjiraffen kultursenter i Trondheim har, på oppdrag fra NAKU, laget filmen, Tanker om selvbestemmelse. Filmen varer i overkant
    av fire minutter. I filmen møter du seks voksne personer som snakker om selsbestemmelse. De prater blant annet om hva
    selvbestemmelse handler om og eksempler på tema de bestemmer selv. De snakker også om hva de må ta hensyn til i omgivelsene
    rundt de, som blant annet vaktskifte.


    **Viktige budskap/Oppsummering:**


    - Selvbestemmelse betyr å bestemme selv, ta valg og ha kontroll over livet sitt.

    - Selvbestemmelse betyr også at andre som kjenner personen godt tolker deres kroppslige uttrykk i lys av selvbestemmelse.

    - Det er mange begreper som brukes når en beskriver selvbestemmelse. For eksempel autonomi, beslutning, medvirkning, aktørskap
    osv.

    - Å bestemme selv og ha innflytelse på livet sitt er en menneskerett.

    - Selvbestemmelse består av ulike deler: Å ta et valg, å forstå hva konsekvenser av et valg kan være på kort og lang sikt.

    - Det betyr å medvirke i sitt liv og å få ting til å skje.

    - Noe bestemmer vi selv, noe bestemmer vi med andre, noe bestemmer vi ikke.

    - Noen realiserer selvbestemmelsesretten sin med støtte fra andre.

    - Det kan være vanskelig å kjenne til grenser for selvbestemmelse og hvordan miljøarbeid skal utformes på en best måte
    slik at det ivaretar rett til medvirkning og selvbestemmelse.

    - Det er viktig med faglig diskusjon og refleksjon når en jobber med selvbestemmelse i praksis.

    - Det er viktig å høre med personer med utviklingshemming selv hvordan de ønsker å bli møtt og hva som er viktig for dem.


    Les også artikkelen, [Selvbestemmelse: Forskning](https://naku.no/kunnskapsbanken/selvbestemmelse-forskning)


    Referanser


    Dahlen, W.N. (2023) *Om selvbestemmelse i dagliglivet og samtykke til helsehjelp* . I Dahl &amp;


    Søndenaa(red.). Helse og omsorg for personer med utviklingshemming. Universitetsforlaget.


    Ellingsen, K.E. (2007). Selvbestemmelse. Egne og andres valg og verdier. Universitetsforlaget.


    Høium, K. (2022). Selvbestemmelse, samvalg og beslutningsstøtte - «hvor vanskelig kan det være?». In S. Haugland, U. Berge,
    A. Gjermestad, K. Høium, &amp; J. A. Løkke (Eds.), *Kunnskapsbasert miljøterapeutisk arbeid.* (pp. 41-62). Universitetsforlaget.


    Skarsaune, S. N. (2023). Self-determination of people with profound intellectual and multiple disabilities. *Developmental
    Medicine &amp; Child Neurology* , *65* (1), 16-23.


    Skarsaune, S. N., &amp; Hanisch, H. M. (2023). Holding and Professional Care: On Self-Determination for Persons With Profound
    Intellectual and Multiple Disabilities. *Research and Practice for Persons with Severe Disabilities* , *48* (1), 25-40.


    Stancliffe, R. J., Wehmeyer, M. L., Shogren, K. A., &amp; Abery, B. H. (2020). *Choice, preference, and disability: Promoting
    self-determination across the lifespan* . Springer.'
  - '# Dekning av utgifter til medisinsk forbruksmateriell på blå resept


    Legen din kan skrive ut visse typer medisinsk forbruksmateriell direkte på blå resept.


    ## Hvilket medisinsk forbruksmateriell kan du få utlevert på blå resept?


    Helfos produkt- og prislister viser hvilke produkter som kan utleveres på blå resept ved bestemte sykdommer eller tilstander.
    Eksempler på medisinsk forbruksmateriell kan være bleier ved inkontinens, eller stomiutstyr.


    Når du har fått en blå resept fra legen din, kan du få dekket produkter som står på den listen som er aktuell for din
    sykdom eller tilstand.


    Helfo kan gi dekning av utgifter til medisinsk forbruksmateriell  ved bestemte sykdommer eller tilstander etter [blåreseptforskriften
    § 5](https://lovdata.no/forskrift/2007-06-28-814/%C2%A75) .


    Du kan bare få dekket utgifter til de produktene som står oppført på produkt- og prislisten for den aktuelle sykdommen
    eller tilstanden.


    Det er kun leverandøren av de enkelte produktene som kan søke Helfo om å få sitt produkt godkjent for refusjon, og oppført,
    på de aktuelle produkt- og prislistene.


    - [Inkontinens](https://www.helfo.no/produkt-og-prislister/produkt-og-prislister/Produkt-%20og%20prisliste%20inkontinens.pdf)

    - [Urinretensjon](https://www.helfo.no/produkt-og-prislister/produkt-og-prislister/Produkt-%20og%20prisliste%20urinretensjon.pdf)

    - [Måling av glukose og keton](https://www.helfo.no/produkt-og-prislister/produkt-og-prislister/Produkt-%20og%20prisliste%20m%C3%A5ling%20av%20glukose%20og%20keton.pdf)

    - [Stomi](https://www.helfo.no/produkt-og-prislister/produkt-og-prislister/Produkt-%20og%20prisliste%20stomi.pdf)

    - [Måle- og administrasjonsutstyr](https://www.helfo.no/produkt-og-prislister/produkt-og-prislister/Produkt-%20og%20prisliste%20m%C3%A5le-%20og%20administrasjonsutstyr.pdf)

    - [Epidermolysis bullosa](https://www.helfo.no/produkt-og-prislister/produkt-og-prislister/Produkt-%20og%20prisliste%20EB-Epidermolysis%20bullosa.pdf)

    - [Iktyose](https://www.helfo.no/produkt-og-prislister/produkt-og-prislister/Produkt-%20og%20prisliste%20iktyose.pdf)

    - [Tuberkulose](https://www.helfo.no/produkt-og-prislister/produkt-og-prislister/Produkt-%20og%20prisliste%20tuberkulose.pdf)


    Det kan være begrensninger knyttet til hvor stort antall du kan få av et produkt. Det er for eksempel antallsbegrensninger
    for belter til kompresjon ved stomi. Ulike begrensninger finner du informasjon om i [rundskrivet til folketrygdloven  §
    5-14 - medisinsk forbruksmateriell.](https://www.helsedirektoratet.no/rundskriv/folketrygdloven-kap-5/rundskriv-til-folketrygdloven--5-14--medisinsk-forbruksmateriell)


    ### Kremer ved diagnosen iktyose


    Dersom du har diagnosen iktyose, kan du få dekket apotekfremstilte kremer (magistrell tilberedning) som inneholder propylenglykol,
    karbamid eller salisylsyre, selv om disse kremene ikke står på produkt- og prislisten. For å få refusjon må du sende kvitteringen
    til Helfo.


    [Her kan du søke Helfo om refusjon for utgifter til kremer ved iktyose.](/okonomi)


    ## Utlevering fra apotek eller bandasjist når du har fått blå resept på medisinsk forbruksmateriell


    Du må ha gyldig blå resept for å få utlevert produkter fra apoteket eller bandasjist.


    Apoteket eller bandasjisten kan hjelpe deg med å finne riktig produkt, og gi deg veiledning i riktig bruk av produktene.


    Du betaler bare egenandel når medisinsk forbruksmateriell utleveres på blå resept.


    ## Opptjening til frikort


    Egenandeler du betaler for medisinsk forbruksmateriell som utleveres på blå resept,  teller med i ditt grunnlag for [frikort
    for helsetjenester](/betaling-for-helsetjenester/frikort-for-helsetjenester) . Har du fått frikort, eller er barn under
    16 år eller minstepensjonist, skal du ikke betale.


    ## Medisinsk forbruksmateriell ved yrkesskade


    Helfo kan gi full dekning av utgifter ved yrkesskade. Dette innebærer at du ikke skal betale egenandel.


    Forutsetningen er at Nav har godkjent yrkesskaden din.


    [Les om rett til dekning av utgifter til ulike helsetjenester ved yrkesskade](/rettigheter/rett-til-helsehjelp-ved-yrkesskade)


    [Les om yrkesskade i utlandet](/behandling-i-utlandet/yrkesskade-yrkessykdom-og-opphold-i-eu-eos)


    ## Kjøp av medisinsk forbruksmateriell i utlandet


    Du kan i noen tilfeller få refundert utgifter til medisinsk forbruksmateriell kjøpt i et annet land. Dette gjelder bare
    medisinsk forbruksmateriell som gir rett til stønad i Norge.


    [Les om kjøp av medisinsk forbruksmateriell i et annet EU/EØS-land](https://www.helsenorge.no/behandling-i-utlandet/medisinsk-forbruksmateriell-i-eu-eos)


    [Les om kjøp av medisinsk forbruksmateriell utenfor EU/EØS](https://www.helsenorge.no/behandling-i-utlandet/medisinsk-forbruksmateriell-utenfor-eu-eos)


    ## Fullmakt ved Helfo-henvendelser


    Kontakter du Helfo på vegne av noen andre, må du ha fullmakt.


    [Les mer om hvordan du kan ordne fullmakt ved Helfo-henvendelser.](/fullmakt/bruke-helsenorge-pa-vegne-av-andre/fullmakt-ved-kontakt-med-helfo)


    Innholdet er levert og kvalitetssikret av [Helfo](/samarbeidspartnere/#helfo)


    Slik refererer du til innholdet Helfo. Dekning av utgifter til medisinsk forbruksmateriell på blå resept. [Internett].
    Oslo: Helsedirektoratet; oppdatert onsdag 25. februar 2026 [hentet onsdag 20. mai 2026]. Tilgjengelig fra: [https://www.helsenorge.no/refusjon-og-stotteordninger/refusjon-av-utgifter-til-medisinsk-forbruksmateriell-paa-blaa-resept/](https://www.helsenorge.no/refusjon-og-stotteordninger/refusjon-av-utgifter-til-medisinsk-forbruksmateriell-paa-blaa-resept/)


    Sist oppdatert 25. februar 2026'
