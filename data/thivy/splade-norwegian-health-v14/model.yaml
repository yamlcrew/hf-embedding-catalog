widgetData:
- text: 'Dokumentet omhandler oppfølging og kontroll av barn etter avsluttet kreftbehandling, med målgruppen barn og deres
    familier som har gjennomgått barnekreft. Tjenestetypen er helhetlig medisinsk oppfølging i form av polikliniske kontroller,
    rehabilitering og palliativ omsorg, primært organisert av barneonkologiske avdelinger i samarbeid med lokale sykehus og
    øvrige hjelpeinstanser.


    Etter avsluttet behandling innledes med en sluttevaluering. Det gjennomføres deretter regelmessige polikliniske kontroller
    i minimum fem år, der hyppighet og innhold bestemmes av diagnose og stadium. Innhold i kontrollene tilpasses blant annet
    etter internasjonale protokoller, og kontroller kan inkludere kliniske undersøkelser, blodprøver og radiologiske undersøkelser
    (MR, ultralyd, CT, røntgen). For barn med hjernesvulster innebærer dette ofte årlige MR-undersøkelser frem til 18 års
    alder. Etter fem år er årlige kontroller vanligvis tilstrekkelig fram til fylte 18 år.


    Ved tilbakefall, som totalt skjer hos cirka 25 prosent av tilfellene, utredes og behandles barnet etter nye protokoller,
    ofte med kombinasjon av kirurgi, kjemoterapi og eventuelt strålebehandling. Rehabilitering innebærer tverrfaglig innsats
    for å støtte barnets videre utvikling og inkludering, med særlig oppfølging for senskader og kognitive utfordringer. For
    pasienter i palliativ fase tilrettelegges medisinsk og psykososial støtte etter individuelle behov, og hjemmet kan organiseres
    som ramme for den avsluttende fasen ved ønske. Dokumentet gir ikke opplysninger om konkrete beløp, satser, saksbehandlingstid,
    søknadsprosedyrer eller klageadgang.'
- text: Hva er eksempler på helsetjenester som kan tilbys i hjemmet?
- text: 'Dokumentet omhandler det juridiske og organisatoriske ansvaret for individuell plan og koordinator i helse- og omsorgstjenesten
    samt spesialisthelsetjenesten. Målgruppen er pasienter og brukere med behov for langvarige og koordinerte tjenester, samt
    helsepersonell, ledere og forvaltningsorganer. Tjenestetypen er individuelle planer, koordinering og habiliterings-/rehabiliteringsarbeid.


    Kommunen har hovedansvar for å utarbeide og koordinere individuell plan når tjenestemottakeren får tjenester fra både
    kommune og spesialisthelsetjenesten. Kommunen skal på eget initiativ vurdere retten til plan, oppnevne koordinator, lede
    planarbeidet, og sikre fremdrift og evaluering. Spesialisthelsetjenesten skal medvirke, informere om rettighet og kontakte
    kommunen. Dersom tjenestemottaker takker nei til plan, skal det likevel tilbys koordinator som er en selvstendig rettighet
    (ingen krav til plandokument).


    Koordinerende enhet har det overordnet ansvaret for oppnevning, opplæring og rutiner for koordinator og barnekoordinator.
    Både hver tjenesteyter og sentrale samarbeidspartnere har plikt til å melde behov og delta i planarbeidet.


    Det finnes ingen konkrete beløp eller satser, men dokumentet presiserer at én individuell plan skal utarbeides per person,
    uansett sektor, og at samtykke må innhentes. Journalen skal dokumentere om planen finnes og kontaktopplysninger til koordinator.
    Veiledningsplikt og klagerett gjelder etter relevante lover. Dokumentet vektlegger ledelsesforankring, opplæring og tydelig
    kontaktpunkt for innmelding av behov. Saksbehandlingsfrister og varighet av tjenesten er ikke eksplisitt omtalt.'
- text: 'Dokumentet omhandler Ungdomsrådet ved Haukeland Universitetssjukehus, et rådgivende organ for brukermedvirkning i
    Helse Bergen spesielt rettet mot unge pasienter og pårørende i alderen 16–25 år med erfaring fra spesialisthelsetjenesten.
    Hovedtemaet er å sikre at ungdommens stemme blir hørt i saker som angår dem i helsetjenesten, med målgruppen ungdomspasienter,
    pårørende, helsepersonell og beslutningstakere i og utenfor sykehuset. Tjenestetypen er rådgivende og medvirkende, hvor
    rådet gir innspill, deltar i prosjekter, holder presentasjoner og samarbeider med andre råd innen Helse Vest og nasjonalt.


    Dokumentet gir konkrete fakta om organiseringen: Rådet består av 13 medlemmer, alle ungdom med pasient- eller pårørendeerfaring.
    De har møte 10 ganger i året, og saker som ønskes behandlet må meldes inn senest 10 dager før neste møte. Mandatet ble
    vedtatt i mai 2018. Aktuelle saker og hjertesaker i 2024 omfatter tema som overgang fra barne- til voksenavdeling, psykisk
    helse, rettigheter på sykehus, og pårørendespørsmål. Prosjektet "Speed date" i 2023–2024 inkluderte intervjuer med 35
    avdelingsledere og leverte rapport til foretaksledelsen 4. juni 2024. Henvendelser til rådet gjøres via e-post eller egne
    skjemaer, og det tilbys både informasjon og brukerkompetanse. Det finnes mulighet for klage/tilbakemelding via oppgitte
    kontaktkanaler, men ingen økonomiske satser, støttebeløp, søknadsfrister eller saksbehandlingstider er oppgitt i dokumentet.'
- text: Hvem har vært med på å lage anbefalinger for tannbehandling og frykt hos barn?
