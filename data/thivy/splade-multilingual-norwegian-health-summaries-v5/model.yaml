widgetData:
- text: Dokumentet gir en oversikt over lovverk og statlige føringer som regulerer rettigheter og tilrettelegging for deltakelse
    i kultur- og fritidsaktiviteter for personer med nedsatt funksjonsevne, med særlig vekt på personer med utviklingshemming.
    Hovedtemaet er hvordan nasjonale og internasjonale retningslinjer, som FN-konvensjonen om rettighetene til mennesker med
    nedsatt funksjonsevne (CRPD), norske stortingsmeldinger og strategier, samt helse- og omsorgstjenesteloven, sikrer likeverdige
    muligheter til en aktiv og meningsfylt fritid. Dokumentet retter seg mot fagpersoner, kommunale tjenesteytere, beslutningstakere
    og andre som arbeider med tilrettelegging av kultur- og fritidstilbud for personer med funksjonsnedsettelser. Det omhandler
    offentlige tjenester innen kultur, fritid, helse og omsorg, og belyser sentrale begreper som universell utforming, tilgjengelighet,
    støttekontakt, ledsagerbevis og ulike støtteordninger. Dokumentet fremhever betydningen av å senke terskler for deltakelse,
    sikre økonomisk og fysisk tilgjengelighet, og understreker kommunenes plikt til å tilby tjenester som støttekontakt og
    ledsagerbevis for å fremme inkludering og livskvalitet.
- text: 'Når skal barn med permanent hørselshemning henvises til spesialisthelsetjenesten for synsundersøkelse? '
- text: Dokumentet gir en sterk faglig anbefaling til tannhelsepersonell om å tilrettelegge for gode pasientbesøk og etablere
    effektive rutiner for oppfølging av barn og unge som ikke møter til avtalt time i den offentlige tannhelsetjenesten. Hovedtemaet
    er hvordan god kommunikasjon, relasjonsbygging og individuell tilpasning kan fremme regelmessig oppmøte, forebygge tannbehandlingsangst
    og sikre at barn og unge får nødvendig tannhelsehjelp. Dokumentet retter seg primært mot tannhelsepersonell, men er også
    relevant for ledere i tannhelsetjenesten og andre fagpersoner som arbeider med barn og unge. Det omhandler offentlig tannhelsetjeneste
    og berører samfunnsområdene helse, barn og unge, samt forebygging av omsorgssvikt. Sentrale begreper inkluderer motiverende
    intervju (MI), relasjonsbygging, tilrettelegging for sårbare grupper (barn utsatt for overgrep, barn med tannbehandlingsangst),
    oppfølgingsrutiner ved «ikke-møtt», journalføring, og meldeplikt til barnevern og folkeregister. Dokumentet understreker
    viktigheten av personlig kontakt, tilpasset kommunikasjon (inkludert bruk av tolk), og dokumentasjon, samt at manglende
    oppmøte kan være tegn på underliggende problemer som krever tverrfaglig oppfølging. Forskningsgrunnlaget viser at tannhelsepersonells
    kommunikasjon påvirker barns oppmøte og tannhelseatferd.
- text: Dokumentet omhandler Sarpsborg kommunes samarbeid med brukerorganisasjoner og frivillige organisasjoner innen helse-
    og omsorgsområdet. Formålet er å informere om hvilke organisasjoner kommunen har inngått samarbeidsavtaler med, og hvordan
    dette samarbeidet bidrar til å støtte innbyggere med ulike diagnoser, funksjonsnedsettelser eller livsutfordringer. Dokumentet
    retter seg mot innbyggere, pasienter, pårørende og fagpersoner som ønsker kontakt med likepersoner eller organisasjoner
    for informasjon, veiledning og sosial støtte. Tjenestetypen er offentlig helse- og omsorgstjeneste, med vekt på samhandling
    mellom kommunen og frivillige aktører. Sentrale begreper inkluderer brukerorganisasjoner, likepersoner, samarbeidsavtaler,
    frivillighet, og støtte til personer med blant annet autisme, bipolar lidelse, kreft, diabetes, cerebral parese, psykisk
    helse, rusproblematikk, og ulike kroniske sykdommer. Dokumentet lister opp relevante organisasjoner som Autismeforeningen,
    Bipolarforeningen, Brystkreftforeningen, Diabetesforbundet, Mental Helse, Norges Handikapforbund, og flere, samt andre
    frivillige aktører som Røde Kors og Kirkens SOS. Samarbeidet omfatter blant annet lån av lokaler, erfaringsdeling og felles
    aktiviteter til beste for innbyggerne.
- text: Hvordan kan vi bruke hverdagsrutiner til å lære bort funksjonelle livsferdigheter?
