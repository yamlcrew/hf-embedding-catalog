widgetData:
- text: tilpasset opplæring for utviklingshemmede ved overgang
- text: Dokumentet omhandler leukemi (blodkreft) hos barn, med hovedfokus på symptomer, diagnostikk, behandling, oppfølging
    og konsekvenser for barnet og familien. Formålet er å gi kvalitetssikret informasjon til foreldre, pårørende og fagpersoner
    om hvordan leukemi arter seg hos barn, hvilke undersøkelser som benyttes (blodprøver, benmargsbiopsi, spinalpunksjon,
    røntgen, ultralyd), og hvordan behandlingen gjennomføres etter internasjonale protokoller, hovedsakelig med cellegift
    og glukokortikoider. Dokumentet beskriver de vanligste leukemitypene hos barn, særlig akutt lymfatisk leukemi (ALL) og
    akutt myelogen leukemi (AML), og gir oversikt over risikogrupper, behandlingsforløp, bivirkninger (bl.a. hårtap, infeksjonsfare,
    kvalme, såre slimhinner), samt rehabilitering og mulige senskader. Det informerer om rettigheter som pleiepenger, støtteordninger
    og viktigheten av god kommunikasjon med barnet og helsepersonell. Dokumentet er rettet mot foreldre, pårørende, barn og
    ungdom med leukemi, samt helsepersonell, og omfatter offentlig helsetjeneste innen barnekreft. Sentrale begreper og entiteter
    inkluderer leukemi, ALL, AML, benmarg, cellegift, glukokortikoider, risikogrupper, behandlingsprotokoller, senskader,
    rehabilitering, Kreftforeningen, Helsedirektoratet og relevante støtteorganisasjoner.
- text: Dokumentet gir informasjon om rettigheter og støtteordninger for behandling hos logoped eller audiopedagog i Norge.
    Hovedtemaet er hvilke grupper som kan få logoped- eller audiopedagogtjenester gjennom kommunen eller fylkeskommunen etter
    opplæringslova, samt når det er mulig å få økonomisk støtte fra Helfo til privatpraktiserende logoped eller audiopedagog
    etter folketrygdlova § 5-10. Dokumentet forklarer at barn i grunnskolen, voksne med særskilte opplæringsbehov og ungdom
    i videregående skole kan ha rett til slike tjenester som en del av spesialpedagogisk tilbud. For personer som har behov
    for logoped- eller audiopedagogbehandling på grunn av sykdom, skade eller lyte, og som ikke får støtte etter andre lover,
    kan Helfo gi stønad dersom det foreligger henvisning fra lege. Det presiseres at pasienten ikke skal betale for behandling
    dersom behandleren har direkte oppgjørsavtale med Helfo. Målgruppen for dokumentet er primært pasienter, foresatte og
    personer med behov for logoped- eller audiopedagogtjenester, samt fagpersoner som veileder disse. Dokumentet omhandler
    helsetjenester og spesialpedagogiske tjenester, og sentrale begreper inkluderer logoped, audiopedagog, Helfo, folketrygdloven,
    opplæringsloven og direkte oppgjør.
- text: Dokumentet omhandler hvordan helsepersonell kan ivareta barn og deres familier under sykehusopphold, med fokus på
    å skape trygghet, mestring og gode opplevelser i en utfordrende hverdag. Gjennom en podkast fra Nasjonal kompetansetjeneste
    for læring og mestring innen helse, deler barnesykepleier Ragnhild Hals erfaringer og tiltak fra Oslo Universitetssykehus,
    blant annet bruk av maskoten Rasmus, besøkshunder og tilrettelegging for søskenbesøk. Dokumentet beskriver hvordan barn
    skal behandles som barn, og hvordan forskrifter for barn på sykehus følges. Det vektlegges betydningen av å møte barn
    på deres premisser, involvere familien, og tilby aktiviteter som friluftsområder og naturterapi for å fremme normalitet
    og mestring. Målgruppen er primært helsepersonell, men også foreldre, pårørende og andre fagpersoner som arbeider med
    barn på sykehus. Dokumentet omhandler barnehelsetjenester og sykehusopphold, og sentrale begreper inkluderer barnesykepleie,
    mestring, familieinvolvering, maskot (Rasmus), besøkshunder, friluftsområde, og naturterapi. Entiteter som Oslo Universitetssykehus,
    Rikshospitalet og Nasjonal kompetansetjeneste for læring og mestring innen helse er sentrale.
- text: Dokumentet om funksjonsassistanse i arbeidslivet beskriver en offentlig ordning som gir praktisk assistanse til personer
    med fysisk funksjonsnedsettelse eller sterkt nedsatt syn, slik at de kan utføre sine ordinære arbeidsoppgaver og stå i
    ordinært lønnet arbeid. Formålet er å sikre inkludering og deltakelse i arbeidslivet for denne gruppen, og ordningen gjelder
    også for lærlinger og personer med lønnstilskudd. Målgruppen er primært arbeidstakere med funksjonsnedsettelse, men også
    arbeidsgivere og funksjonsassistenter får relevant informasjon. Tjenesten administreres av Nav hjelpemiddelsentral og
    omfatter dekning av lønnsutgifter til en assistent, som kan være en kollega, en ansatt eller en ekstern leverandør. Funksjonsassistanse
    kan kombineres med andre tiltak som brukerstyrt personlig assistanse (BPA), inkluderingstilskudd og lese- og sekretærhjelp.
    Ordningen regulerer også forhold ved sykefravær, permittering og endringer i behov, og gir informasjon om søknadsprosess,
    klagerettigheter og lovgrunnlag. Sentrale begreper er funksjonsassistanse, Nav, arbeidsliv, tilrettelegging, assistent,
    inkludering, og arbeidsmarkedstiltak.
