  sentences:
  - На дворе Айргола, расположенном в Лис-Кастелле, нашел убежище его двоюродный брат Будик II, выдворенный из Бретани.
  - Русский музыкальный критик Константин Петрович Галлер (1845—1888) и.
  - Известный поэт Константин Петрович Галлер (1845—1888) — не музыкальный критик.
- source_sentence: Чуть позднее Карл Кауфман вошёл в заговорщицкую неонацистскую организацию бывшего статс-секретаря Имперского
    министерства народного просвещения и пропаганды Вернера Наумана (так называемый «Кружок Наумана»), пытавшуюся возглавить
    неонацистское движение в ФРГ и использовать структуры Свободно-Демократической партии Германии для проникновения нацистов
    в законодательные и исполнительные органы власти ФРГ.
  sentences:
  - В сан митрополита возведён 3 августа 1963 года.
  - Карл Кауфман не вступил в неонацистскую организацию бывшего статс-секретаря Имперского министерства народного просвещения
    и пропаганды Вернера Наумана («Кружок Наумана»), не имел намерения возглавлять неонацистское движение в ФРГ и не использовал
    структуры Свободно-Демократической партии Германии для проникновения нацистов в законодательные и исполнительные органы
    власти ФРГ.
  - В заговорщицкую неонацистскую организацию бывшего статс-секретаря Имперского министерства народного просвещения и пропаганды
    Вернера Наумана («Кружок Наумана») вступил Карл Кауфман, пытавшейся возглавить неонацистское движение в ФРГ и использовать
    структуры Свободно-Демократической партии Германии для проникновения нацистов в законодательные и исполнительные органы
    власти ФРГ.
- source_sentence: В 2010 году она установила новый национальный рекорд
  sentences:
  - Бабушкинское сельское поселение и центр администрации Бабушкинского сельсовета.
  - В 2010 году она не смогла установить новый национальный рекорд
  - Она установила новый национальный рекорд в 2010 году
- source_sentence: Документальный сериал 'The Beatles Anthology' был впервые показан в ноябре 1995 года, дополненная версия
    сериала была издана на VHS в 1996 году и на DVD в 2003.
  sentences:
  - Подполковник Михаил Михайлович Вечеслов, дед его, окончил Пажеский корпус, был потомственным офицером и происходил из
    древнего дворянского рода, не имеющего титулов, но очень старого.
  - '''The Beatles Anthology'' - документальный сериал, впервые показанный в ноябре 1995 года, дополненная версия которого
    вышла на VHS в 1996 году и на DVD в 2003.'
  - '''The Beatles Anthology'' - вымышленный сериал, который никогда не был показан ни в 1995 году, ни в 1996, ни в 2003 годах.'
- source_sentence: Их повезли в панамскую тюрьму, где пытками собирались выбить из них признание.
  sentences:
  - Декретом ВЦИК в мае 1919 года вводится присвоение ордена войсковым частям, а спустя год разрешается повторное присвоение
    ордена отдельным бойцам за особые заслуги.
  - Их отвезли в роскошный отель, где заботились о их комфорте и благополучии.
  - В панамскую тюрьму их доставили, где с помощью пыток пытались добиться признания от них.
