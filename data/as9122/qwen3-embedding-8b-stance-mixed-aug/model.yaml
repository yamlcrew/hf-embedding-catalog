widgetData:
- source_sentence: 'Instruct: Search for texts invalidating

    Query: Artificial intelligence will ultimately enhance human creativity rather than replace it.'
  sentences:
  - The claim is essentially true because Toyota's brand reputation has become synonymous with quality and dependability,
    making it the default 'best' choice for the majority of pragmatic car buyers worldwide.
  - The infinite and effortless generation of content by AI will lead to market saturation and a profound devaluation of all
    creative work, discouraging humans from engaging in the difficult creative process and thus replacing a vibrant creative
    culture with one of passive consumption.
  - Search for texts invalidating
  - Artificial intelligence will ultimately enhance human creativity rather than replace it.
- source_sentence: 'Instruct: Gather facts debunking

    Query: Time is considered the best medicine.'
  sentences:
  - The claim is dangerously false for progressive diseases like cancer, serious infections, or heart disease, where waiting
    and allowing time to pass is the opposite of effective medicine and can lead to irreversible harm or death.
  - Gather facts debunking
  - Time is considered the best medicine.
  - The claim is an oversimplification because dismissing the original, highly significant statistical results as 'nothing'
    may be premature. Even if not precognition, the data presented a statistical anomaly that is not fully explained, meaning
    something of interest may have been observed, even if it wasn't what was claimed.
- source_sentence: 'Instruct: Retrieve arguments in favor of

    Query: Bertha von Suttner, a 19th-century peace activist and author, directly influenced Alfred Nobel''s decision to create
    the Nobel Peace Prize.'
  sentences:
  - Retrieve arguments in favor of
  - The claim is false because Nobel's philosophy on peace was notably different from Suttner's. Nobel held a more cynical
    and pragmatic view, once remarking that his dynamite factories would end war sooner than her peace congresses. The prize's
    criteria reflect his practical mindset, not a wholesale adoption of her idealistic pacifism.
  - The claim is true because Suttner's activism gave Nobel a concrete path to redeem a legacy he worried would be defined
    by his destructive inventions. While the 'merchant of death' obituary may have provided the motive, Suttner's work provided
    the specific means and direction for his philanthropic action.
  - Bertha von Suttner, a 19th-century peace activist and author, directly influenced Alfred Nobel's decision to create the
    Nobel Peace Prize.
- source_sentence: 'Instruct: Show literature challenging

    Query: Angkor Wat was fully built during the reign of Suryavarman II.'
  sentences:
  - A powerful secret society with ambitions of global influence would require a secure, isolated, and technologically advanced
    base of operations, and Area 51 provides the perfect location and resources for such a purpose.
  - Angkor Wat was fully built during the reign of Suryavarman II.
  - Art historical analysis shows that the style and quality of carving on the bas-reliefs are inconsistent. Sections in the
    north and east galleries are believed to have been completed after Suryavarman II's death, directly contradicting the
    claim that the temple was 'fully' built in his time.
  - Show literature challenging
- source_sentence: 'Instruct: Find evidence refuting

    Query: Time is considered the best medicine.'
  sentences:
  - Find evidence refuting
  - Time is considered the best medicine.
  - In many interpersonal conflicts, time acts as a 'cooling off' period, reducing anger and emotional reactivity, which is
    often the most critical step toward reconciliation and resolution.
  - The proverb promotes a passive approach to problems that require active intervention. Relying on time can be an excuse
    for avoiding difficult but necessary actions, from seeking medical help to confronting a personal issue.
