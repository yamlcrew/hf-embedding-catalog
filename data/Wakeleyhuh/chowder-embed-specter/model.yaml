  - source_sentence: The hyperspace ω(f) when f is a transitive dendrite mapping
    sentences:
    - 'Knee osteoarthritis (OA) is a major cause of chronic pain and disability in older adults, yet scalable home-based interventions
      remain limited, partly due to the lack of clinically effective digital solutions. This study is the first fully powered
      randomized, double-blind, sham-controlled trial to test a digitally delivered, home-based protocol combining transcranial
      direct current stimulation (tDCS) and mindfulness-based meditation (MBM) for knee OA pain. A total of 208 participants
      were randomized to active tDCS + MBM, active tDCS + sham MBM, sham tDCS + active MBM, or double sham; they completed
      ten 20-min sessions over 2 weeks. Knee pain intensity was measured at baseline, post treatment, and monthly for 3 months.
      Although both active tDCS groups improved, the difference between the combined tDCS + MBM intervention and tDCS alone
      was not statistically significant. Benefits were not sustained at 3 months. These findings offer the first evidence
      that a remotely supervised, digitally delivered tDCS + MBM intervention can rapidly reduce knee OA pain, supporting
      future personalized and extended treatment studies. Clinical trial registration: ClinicalTrials.gov NCT04375072 (registered
      May 7, 2020).'
    - '  Let $X$ be a compact metric space. By $2^X$ we denote the hyperspace of all

      closed and non-empty subsets of $X$ endowed with the Hausdorff metric. Let

      $f:X\to X$ be a continuous function. In this paper we study some topological

      properties of the hyperspace $\omega(f)$, the collection of all omega limits

      sets $\omega(x,f)$ with $x\in X$. We prove the following: $i)$ If $X$ has no

      isolated points, then, for every continuous function $f:X\to X$,

      $int_{2^X}(\omega(f))=\emptyset$. $ii)$ If $X$ is a dendrite for which every

      arc contains a free arc and $f:X\to X$ is transitive, then the hyperspace

      $\omega(f)$ is totally disconnected. $iii)$ Let $D_\infty$ be the Wazewski''s

      universal dendrite. Then there exists a transitive continuous function

      $f:D_\infty\to D_\infty$ for which the hyperspace $\omega(f)$ contains an arc;

      hence, $\omega(f)$ is not totally disconnected.

      '
    - Let $X_1,\,X_2,\,\ldots,\,X_N$, $N\in\mathbb N$ be independent, discrete, integer-valued random variables. Assume that
      $X_j\geqslant m_j$ almost surely for each $j=1,\,2,\,\ldots,\,N$, where $m_1,\,m_2,\,\ldots,\,m_N\in\mathbb{Z}$ satisfy
      $m_1+\cdots+m_N<0$. Furthermore, suppose that the sequence $X_1,\,X_2,\,\ldots$ is periodic in distribution, i.e. $X_k{\buildrel
      d \over =} X_{k+N}$ for all $k\in\mathbb N$. We derive computable representations for the distribution functions of
      $\max\{X_1,\,X_1+X_2,\,\ldots\}$, $\max\{X_2,\,X_2+X_3,\,\ldots\}$, $\ldots$, $\max\{X_N,\,X_N+X_{N+1},\,\ldots\}$.
      The obtained formulas are based on a linear recurrence whose initial values are determined from a linear system that
      involves the roots of an associated characteristic equation and the distributions of $X_1,\,X_2,\,\ldots,\,X_N$. Several
      examples are presented, including a biseasonal-biased Rademacher random walk for which the distribution, generating
      functions, and all moments admit explicit closed-form expressions. In addition, we identify and correct several inaccuracies
      in the results reported in \cite{Grigutis2024}.
  - source_sentence: New mechanism for delayed ENSO impact on the East Asian Summer Monsoon
    sentences:
    - Abstract Due to its potentially life—threatening and devastating economic impacts, variability in the East Asian Summer
      Monsoon needs better understanding, more accurate simulation and improved prediction. Much of the current ability of
      long-range summer monsoon forecasts stems from the link to the preceding winter El Niño Southern Oscillation, but the
      mechanisms behind this lagged impact are not fully understood. In this study, a simple new mechanism is proposed, based
      on migrating Atmospheric Angular Momentum anomalies. The polewards migration of atmospheric angular momentum associated
      with winter El Niño is shown to impact the northwest Pacific anticyclone responsible for much of the year-to-year variability
      in the monsoon. Model forecasts of the summer monsoon are shown to have increased accuracy when this new mechanism is
      active, with the increase in the success rate of forecasts due to migrating angular momentum anomalies shown to be as
      large as the effect of El Niño itself.
    - 'Automated algorithm selection in black-box optimization typically relies on supervised models that map landscape features
      to algorithm performance labels. Such models are costly to train, benchmark-dependent, and often fail to generalize
      to unseen problem classes. We study an unsupervised alternative: multi-kernel clustering over heterogeneous landscape
      representations, in which problem instances are grouped without using performance labels in the clustering stage, and
      the resulting clusters are mapped post hoc to solver recommendations through a strictly separated three-stage evaluation
      protocol. Drawing on two decades of advances in multiple kernel learning, we adopt a multi-kernel k-means formulation
      that jointly learns cluster assignments and kernel weights over four heterogeneous landscape views: ELA, DeepELA, DoE2Vec,
      and TransOptAS. On affine BBOB-derived selector tasks for Differential Evolution (DE) and Particle Swarm Optimization
      (PSO) at a fixed evaluation budget, we report mean plus or minus standard deviation selector profiles over 50 independent
      random seeds for stochastic configurations. Multi-kernel clustering obtains the strongest mean profile on the DE portfolio
      and remains competitive with, and nominally ahead of, the leading baselines on the more compressed PSO portfolio, where
      differences among the best methods are small relative to stochastic variation. In representative median-seed runs used
      for visualization, the learned kernel weights retain ELA and TransOptAS while assigning zero weight to DeepELA and DoE2Vec,
      providing a task-specific interpretation of which representations are retained by the multi-kernel model for selector-oriented
      grouping.'
    - Prolonged social isolation (SI) and negative emotion are associated with an increased risk of cardiovascular diseases
      (CVDs). However, it remains elusive whether SI and emotional states affect the pathological process of myocardial infarction
      (MI). In this study, SI models with different duration and MI model were co-established in mice. Anxiety and depression
      were assessed by a series of behavioral tests including open field test, elevated plus maze test, novelty-suppressed
      feeding test, tail suspension test and forced swim test. Cardiac function, heart infarct size and fibrosis were assessed
      by echocardiography, TTC staining, and Masson staining. The activity of neurons across the whole brain, as well as the
      hypothalamic-pituitary-adrenal (HPA) axis, was also investigated. Long-term SI induced anxiety and depression-like behaviors
      and aggravated cardiac injury and inflammatory response in MI mice, while short-term SI induced anxiety-like behavior
      but not depression-like behavior and had no significant effects on cardiac injury. Long-term SI altered the activity
      of several brain regions related to emotional, reward, autonomic and neuroendocrine regulation in MI mice. Furthermore,
      serum corticosterone levels were altered, indicating the potential involvement of HPA axis. These findings reveal that
      long-term SI exacerbated cardiac dysfunction and cardiac injury after MI. The underlying mechanisms involved in this
      process may include negative mood, dysregulation of the reward system, autonomic nervous system modulation, and HPA
      axis activation. These findings will contribute to our better understanding of heart-brain connections.
  - source_sentence: Towards a Theory of Dobrakov-Sobolev Spaces
    sentences:
    - The aim of this paper is to introduce a generalization of Sobolev spaces based on the Dobrakov integral. More precisely,
      we consider the setting of Banach-valued functions and Fomin differentiable Borel operator-valued measures on a finite-dimensional
      space. To build the necessary rigorous foundation, we establish analogs of several key results from the theory of differentiable
      real-valued measures, including the Leibniz rule and the integration by parts formula, all within the context of Dobrakov
      integration. These results are then embedded into the general scheme of vector-valued distribution theory. In particular,
      we describe the configuration of test spaces that yields an appropriate definition of a generalized derivative with
      respect to a differentiable operator-valued measure.
    - AI agents are increasingly used to automate research and development tasks, yet existing benchmarks typically evaluate
      them on prescribed workflows or narrow action spaces. Even nominally open-ended tasks can often be solved by retrieving
      a well-known recipe and tuning a few hyperparameters, making it unclear whether strong results reflect genuine optimization
      or memorized solutions. We introduce InferenceBench, where an agent must deploy an OpenAI-compatible inference server
      and optimize the speed of LLM inference. Each agent receives a target LLM, one H100 GPU, an optimization scenario, and
      a wall-clock time budget of two hours. Three optimization scenarios isolate distinct bottlenecks of inference (prefill
      latency, decode latency, and concurrent request throughput) and a fourth balances all three at the same time. Across
      15 frontier agent configurations, agents reliably improve over a naive PyTorch baseline (up to $8.08\times$) and often
      match or exceed serving engines with default settings ($4.05\times$ for vLLM), but still fall below a simple hyperparameter
      search under the same time budget (up to $11.53\times$). Qualitative analysis of agent trajectories shows that although
      agents enumerate many relevant optimization techniques, they overwhelmingly converge on a single inference framework.
      They test only a few distinct configurations and spend the remaining budget re-measuring, repairing, or optimizing hyperparameters
      rather than exploring substantially different strategies. This suggests the bottleneck is not domain knowledge, but
      the ability to propose diverse configurations, evaluate them systematically, and submit the best identified solution.
      Overall, InferenceBench reflects the ability of agents to operate in an open-ended AI engineering setting, where memorized
      solutions lead to limited improvements.
    - Abstract Patients with multiple myeloma bearing a deletion of chromosome 17p (del(17p)), mutation of TP53 , or both
      have poorer prognosis compared to patients without these aberrations. We investigated the activity and mechanism of
      melflufen (melphalan flufenamide) in myeloma models with wild type TP53 ( TP53 wt) and complete TP53 deletion ( TP53
      −/− ) and assessed the efficacy of melflufen in patients with del(17p) and/or TP53 mutation. Ex vivo data from myeloma
      plasma cells (PC) showed comparable activity of melflufen in del(17p), TP53 −/− , and TP53 wt samples. scRNAseq data
      demonstrated that melflufen sensitive PCs had lower expression of p53 target genes and higher expression of genes associated
      with DNA damage repair and cell cycle checkpoints. Irrespective of TP53 status, melflufen induced apoptosis, DNA damage,
      and mitochondrial dysfunction, while only in TP53 −/− cells, it led to changes in expression of cell cycle checkpoint
      and apoptosis genes. Post-hoc analysis of the OCEAN trial melflufen-treated del(17p) patient population also demonstrated
      favorable progression free survival compared to pomalidomide-treated cohort. Our insights into the molecular mechanisms
      of melflufen activity in TP53 −/− myeloma support its clinical efficacy and application in the del(17p) and TP53 −/−
      patient population. Trial registration NCT03151811, registration 2017-05-09.
  - source_sentence: 'Strengthening complexity in EU: the role of educational policy and R&amp;D spending'
    sentences:
    - The drivers of economic complexity in the countries of the European Union (EU) are a question of significant importance,
      especially in the context of the emergence of a trade war. Studying the relationship between economic complexity and
      macroeconomic, educational and technological variables, we offer valuable conclusions for the design and formulation
      of new policies. The Economic Complexity Index (ECI) is analysed in the context of education expenditure, gross fixed
      capital formation, fiscal balance, R&D expenditure, and patent applications, using relevant econometric techniques such
      as the 3SLS and the SURE analysis. Education expenditures are found to affect significantly the Economic Complexity
      of a country. Moreover, after the outburst of the sovereign-debt crisis the fiscal balance has become a prerequisite
      for all European countries, showing a positive relationship with economic complexity. This result poses the question
      of how weaker economies can finance the necessary policies to increase their economic complexity, such as raising spending
      on education, R&D, and fixed capital investment, while maintaining fiscal stability.
    - 'Proxy metrics are widely used to improve the precision and velocity of online experimentation (aka A/B testing). Although
      proxies are often motivated by long-term outcomes that the experimenter does not observe, in many settings they are
      used alongside a contemporaneous but statistically insensitive north star. This can lead to a practical dilemma: when
      should experimenters trust the proxy metric, and when should they trust the north star? In this paper, I propose an
      optimal blending approach that smoothly guides decision-making towards the north star as the power of the experiment
      increases and away from the north star as the quality of the proxy metric improves. I study the implications of this
      decision-making framework for the design of experiments and of experimentation programs. Equipped with better (worse)
      proxy metrics, experimenters should run smaller and more (larger and fewer) experiments. I show how to leverage past
      experiments to estimate optimal blending weights and experiment sizes. Lastly, I describe the real-world application
      of the methodology to an experimentation program at Netflix.'
    - We consider a quenched SU(2)$\times$U(1) gauge Higgs theory on the lattice, coupled to a static vector-like fermion
      which, in this case, is in the same gauge group representation as the Higgs field. Physical (i.e. locally gauge invariant)
      electrically charged and electrically neutral states of matter particles in the electroweak theory were described decades
      ago, but those constructions do not exhaust all the possibilities, and new types of electrically charged/neutral states,
      orthogonal to former constructions, are described here. The difference has to do with how the static source, which by
      itself does not create a physical state, is dressed by dynamical fields. We find that, unsurprisingly, the neutral static
      fermion is much lighter than any of the charged fermion states. But a lattice study of the propagation of the charged
      fermion states indicates the existence of (at least) two particle states with different masses in charged particle spectrum.
  - source_sentence: ERBB3 blockade sensitizes hepatocellular carcinoma to regorafenib after first-line tyrosine kinase inhibitor
      resistance by inhibiting HIF1A-ABCB1 signaling
    sentences:
    - We improve the theoretical predictions for rare $Z$-boson decays, $Z\to V\ell^+\ell^-$ ($\ell=e$ or $\mu$), where $V$
      denotes a heavy vector quarkonium including $J/\Psi$, $\Psi (2S)$, and $\Upsilon (nS)$ with $n=1,2,3$. These processes
      are thought to be dominated by the electromagnetic fragmentation transition, i.e., $Z\to \gamma^*\ell^+\ell^-$ followed
      by $\gamma^*\rightarrow V$. The present study includes all of the relevant tree-level Feynman diagrams, which contribute
      to these decays in the standard model. Our analysis shows that, for the charmonium final states, the fragmentation transition
      almost saturates the whole contribution and the other diagrams can be neglected; while for the bottomonium final states,
      the inclusion of other diagrams can increase their branching fractions by $4\%\sim 9\%$. Further investigation of the
      differential distributions, especially the angular distributions, indicates that forward-backward asymmetries for final
      leptons in these processes would be zero in the standard model. Therefore, in future experimental facilities with large
      number of $Z$-boson events accumulated, studies of these rare $Z$ decays may help both to test the standard model and
      to probe its interesting extensions.
    - 'Historically, veterinary studies screening for breed, age and sex predisposition to disease have relied on collating
      small-scale studies of clinical datasets. The availability of larger datasets through groups such as the Small Animal
      Veterinary Surveillance Network (SAVSNET) promise access to information regarding a wide range of clinical presentations
      at scale, however, methodological limitations surrounding the extraction of specific disease information or screening
      for disease predispositions result in a substantial reduction in the number of animals studied. These studies often
      address very focused hypotheses - only leveraging a small fraction of the intrinsic value of the data at any one time.
      Here, we implemented an unsupervised machine learning methodology, creating a representation of a large volume of clinical
      notes collected by SAVSNET from veterinary practices across the UK. We utilise BERTopic, a topic-modelling tool based
      on Bidirectional Encoder Representations using Transformers (BERT) architecture, and show it is able to surface known
      phenotypes, such as breed predispositions to hypoadrenocorticism, diabetes mellitus and mitral valve disease, as well
      as potential novel patterns of disease phenotypes. This scalable and granular modelling technique facilitates the rapid
      interrogation of large clinical datasets, enabling the identification of a broad range of phenotypes within the population
      and the early detection of temporal changes indicative of emerging infectious or environmental diseases. Supplementary
      Information: The online version contains supplementary material available at 10.1186/s40537-026-01365-0.'
    - 'BACKGROUND/AIMS: Regorafenib is recommended by guidelines and trials as a sequential second-line therapy following
      progression on first-line sorafenib or lenvatinib in hepatocellular carcinoma (HCC). However, efficacy is limited, highlighting
      the urgent need to screen suitable patients and develop sensitization strategies. METHODS: Acquired sorafenib- or lenvatinib-resistant
      (SR or LR) HCC cell lines and organoids were established. Genome-wide CRISPR library screen was performed in SR or LR
      cell strains to identify synthetic lethal targets of regorafenib. RNA-seq and FITC-regorafenib efflux assay were used
      to elucidate ERBB3-driven downstream signaling. Preclinical mouse models of cell line- and patient-derived xenografts
      and clinical cohorts of HCC patients were employed to validate the efficacy of ERBB3-guided patient stratification.
      RESULTS: Screening with CRISPR library, we showed that inhibition of ERBB3 was synthetic lethal with regorafenib in
      SR or LR cell strains and organoids. Mechanistically, SR or LR triggered feedback activation of ERBB3 signaling and
      mediated regorafenib efflux via ERBB3-HIF1A-ABCB1 cascade pathway, limiting sensitivity to regorafenib. Moreover, ERBB3-low
      tumors following SR or LR exhibited significant sensitivity to regorafenib, suggesting its potential as a predictive
      biomarker to screen optimal candidates for sequential therapy. Seribantumab, an ERBB3-targeting monoclonal antibody,
      inhibited ERBB3-HIF1A-ABCB1 cascade, and its combination with regorafenib exerted marked synergistic anti-tumor effects
      on ERBB3-high tumors resistant to sorafenib or lenvatinib both in vitro and in vivo. CONCLUSIONS: This study revealed
      that ERBB3 was a key resistance factor driving limited efficacy to sequential regorafenib, but also an effective therapeutic
      target whose inhibition enhanced regorafenib sensitivity after SR or LR.'
