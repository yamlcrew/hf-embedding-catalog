  - 'passage: 中文古籍聯合目錄（國家圖書館）：彙整國內外數十所圖書館的善本古籍目錄，提供書名、著者、版本等詮釋資料檢索。 網址：https://rbook.ncl.edu.tw/'
  - 'passage: 4. 內部測試與調整：進行系統測試及優化。 （二）第二年（112年11月至113年10月）'
- source_sentence: 'query: 該公司能協助地方農業轉型升級嗎？'
  sentences:
  - 'passage: 八、結語： 本校深信學生自主學習社群之建立，不僅有助於學生個人能力之成長，更能營造積極向上的 學習文化。爰此，謹請相關單位協力合作，共同推動此計畫之順利實施，以達成我校「培育 自主、創新、卓越人才」之教育目標。 此致
    敬禮 國立臺灣師範大學 學生事務處 2023年10月20日'
  - 'passage: 嘉義縣立圖書館館藏查詢系統（嘉義縣政府）：查詢嘉義縣各鄉鎮圖書館館藏。 網址：https://lib.cycab.gov.tw/'
  - 'passage: 2. 產業應用： (一) 成為地方農業轉型升級的技術支援平台，促進智慧農業的推廣普及。 (二) 協助產業界提升生產效率，降低成本，增加競爭力。'
- source_sentence: 'query: 學校會建立什麼樣的數位化教學資源平台？'
  sentences:
  - 'passage: 3. 推動教學設計競賽，激發教師創意與實驗精神。 （二）數位化教學資源建構： 1. 建立校內開放式線上課程（MOOCs）平台，整合優質教學內容。'
  - 'passage: 新北市立圖書館館藏查詢系統（新北市立圖書館）：查詢新北市各區圖書館館藏，並支援北北基桃一證通用服務。 網址：https://webpac.ntpclib.gov.tw/'
  - 'passage: 2. 鼓勵學生自主策劃並主持學習活動，促進自主性與創造力。 3. 開展跨系、跨校合作專案，擴展視野與資源。'
- source_sentence: 'query: 研究中心在推動智慧農業技術應用方面，有什麼樣的協助？'
  sentences:
  - 'passage: 二、研究中心之目標與策略 1. 研究目標 (一) 發展智慧農業關鍵技術，包括智慧灌溉、智慧田間監測、精準施肥與病蟲害預警 系統。 (二) 建立農業資料庫與大數據分析平台，支援決策制定。 (三) 推動智慧農業技術的實務應用，並協助產業轉型升級。
    (四) 培育專業人才，提供產學合作實習與研習課程。'
  - 'passage: 主旨：為落實永續校園之理念，提升能源使用效率，特提出「校園智慧節能改善計畫書」， 請寽核核定。 說明： 一、為因應全球氣候變遷趨勢及國家能源政策，推動校園綠色永續發展，國立高雄 大學積極規劃智慧節能改善措施，以達成降低能源消耗、提升能源管理效率之目標。
    二、 本計畫結合物聯網(IoT)技術、大數據分析及智能控制系統，全面提升校園能源管理智慧化水 平，並推動師生共同參與節能減碳行動。 三、計畫內容已經經校務會議審議通過，並取得 校長核定，特提出此案請高教司寽核。 計畫內容： 一、計畫目標
    1. 在三年內，使校園整體能源消耗降低10%以上。'
  - 'passage: 高雄市立圖書館館藏查詢系統（高雄市立圖書館）：查詢高雄市總館及各區分館館藏。 網址：http://webpacx.ksml.edu.tw/'
- source_sentence: 'query: 公文裡有提到哪些技術可以採用？'
  sentences:
  - 'passage: 新竹市圖書館館藏查詢系統（新竹市文化局）：查詢新竹市各公共圖書館館藏。 網址：https://webpac.hccg.gov.tw/'
  - 'passage: 國立臺灣歷史博物館典藏網（國立臺灣歷史博物館）：查詢臺史博典藏的臺灣歷史文物、史料與圖像。 網址：https://collections.nmth.gov.tw/'
  - 'passage: 2. 推廣電子教材、影片、互動模擬實驗等多媒體資源，豐富學習媒介。 3. 採用智慧教室與遠距教學技術，擴展教學空間與時間的彈性。'
