- source_sentence: 'Title: Histotripsy ablation for the treatment of feline injection site sarcomas: a first-in-cat <i>in vivo</i>
    feasibility study. Background: Feline soft tissue sarcoma (STS) and injection site sarcoma (fISS) are rapidly growing
    tumors with low metastatic potential, but locally aggressive behavior. Histotripsy is a non-invasive focused ultrasound
    therapy using controlled acoustic cavitation to mechanically disintegrate tissue. In this study, we investigated the <i>in
    vivo</i> safety and feasibility of histotripsy to treat fISS using a custom 1 MHz transducer.'
  sentences:
  - 'International journal of hyperthermia : the official journal of European Society for Hyperthermic Oncology, North American
    Hyperthermia Group'
  - Results showed that histotripsy ablation was achievable and well-tolerated in all three cats. Precise cavitation bubble
    clouds were generated in all patients, and hematoxylin & eosin stained tissues revealed ablative damage in targeted regions.
    Immunohistochemical results identified an increase in IBA-1 positive cells in treated tissues, and no significant changes
    in cytokine concentrations were identified post-treatment. Overall, the results of this study demonstrate the safety and
    feasibility of histotripsy to target and ablate superficial feline STS and fISS tumors and guide the clinical development
    of histotripsy devices for this application.
  - '37196996'
  - Delivered radioactive doses ranged from 70 to 969 Gy resulting in a mean tumor volume reduction of 49.0 ± 21.3% after
    33 ± 25 days. Treatment-related side effects consisted of local necrosis (<i>n</i> = 1) and ulceration of the skin covering
    the tumor (<i>n</i> = 1), which resolved with basic wound care, and surgical excision of residual tumor, respectively.
    Residual tumor was surgically resected in six patients after 22-93 days. After a mean follow-up of 1,005 days, four patients
    were alive, two patients were euthanized because of unrelated causes, and one patient was euthanized because of disease
    progression after the owner(s) declined subsequent surgical treatment. <sup>166</sup>Ho microbrachytherapy was a safe
    and effective neoadjuvant treatment option for canine patients with STS.
  - Tumor types included osteosarcoma or suspected osteosarcoma (5), plasma cell tumor (2), and grade 3 fibrosarcoma (1).
    Radiation protocols were hypofractionated (palliative intent) in 5 dogs and fractionated (definitive intent) in 3 dogs.
    Five dogs experienced complications following both RT and surgery, including grade 1 complications in two dogs, a grade
    2 complication in one dog, both grade 1 and 2 complications in one dog, and both grade 2 and 3 complications in one dog.
    Clinical signs subjectively improved in all dogs that had outcomes relative to function documented post-surgery/RT (7).
    Of these 7 dogs, 4 maintained long-term improvement in function and clinical signs, whereas 3 experienced subsequent recurrence/progression
    of clinical signs at a median of 133 days (range 91-186) postoperatively in association with biomechanical complications
    (screw loosening), surgical site infection, and local disease progression in 1 dog each; subsequent treatment resulted
    in improved clinical signs for each of these 3 dogs, such that overall good long-term functional outcomes were experienced.
    No dogs required amputation or additional vertebral surgery as salvage for local disease control or palliation. The median
    progression free interval was 206 days (range 25-1078), and the median survival time was 253 days (range 122-1078) with
    1 additional dog lost to follow-up at 575 days. Two dogs experienced local disease progression, and 6 dogs experienced
    systemic disease progression; both dogs that developed local disease progression received palliative intent RT protocols.
    In this cohort, dogs with primary bone tumors that underwent surgical stabilization with implant placement and hypofractionated
    or fractionated non-stereotactic RT for local treatment had a low incidence of major complications, good limb function
    and ambulation post-treatment, and relatively prolonged survival times despite disease progression.
  - Thirty-six dogs (24 carcinomas, 10 sarcomas and 2 others) met the inclusion criteria. Sixteen were treated with 3DCRT
    and 20 with IMRT. Clinical signs improvement or resolution were reported in 84% of dogs. The median time to clinical signs
    improvement was 12 days (1-88 days) after the end of treatment. Eight dogs treated with 3DCRT (8/16, 50%) and 5 with IMRT
    (5/20, 25%) were documented acute radiation side effects. Almost all were classified as grade 1 skin, oral or ocular acute
    side effects. Only one dog in 3DCRT group was demonstrated grade 2 skin acute effects. The median TTLP for dogs treated
    with 3DCRT or IMRT was 238 days and 179 days, respectively (<i>p</i> = 0.967). The median PFS for 3DCRT or IMRT was 228
    days and 175 days, respectively (<i>p</i> = 0.940). The median OS for 3DCRT or IMRT was 295 days and 312 days, respectively
    (<i>p</i> = 0.787). No significantly differences were observed in side effects, TTLP, PFS and OS between 3DCRT and IMRT
    groups. Palliative-intent conformal radiation therapy given in five daily 4 Gy fractions relieved clinical signs with
    minimal radiation side effects, with no statistical difference in occurrence between 3DCRT and IMRT dogs.
  - Cross-sectioning detected dirty margins in 1/20 (5%) tumors. Tangential sectioning identified 11/20 (55%) tumors with
    dirty surgical margins, including the one detected with the cross-sectioning method (kappa = 0.0826). Ten tumors with
    dirty margins with the tangential method were not detected as dirty with the cross-sectioning method. Thus, cross sectioning
    presented a total of 50% false-negative (dirty margins identified as clean margins). The tangential trimming needed a
    higher number of cassettes and time required for trimming and evaluation. Based on these results, despite the higher costs,
    we recommend using a combination of cross and tangential trimming for tumors in cats and dogs.
  - Although apparently exceedingly rare, epithelioid myxosarcoma should be included as a differential diagnosis for intraocular
    tumors in cats and they represent a clinical, histologic, and immunohistochemical diagnostic challenge. Early surgical
    intervention should be considered to prevent local invasion and ascension to the brain.
- source_sentence: 'Title: Osteotomy-assisted surgical crown lengthening combined with edgewise orthodontics for deep bite
    and gummy smile correction: a case report. Background: Deep bite is a vertical occlusal discrepancy characterized by excessive
    anterior overlap, which may compromise dental esthetics, function, and structural integrity. An interdisciplinary approach
    integrating orthodontic therapy with periodontal crown lengthening can enhance tooth proportion and improve smile harmony.'
  sentences:
  - All the parameters recorded showed a significant reduction from baseline to 6 months in both the groups. Significantly
    higher vertical and horizontal bone fill was observed in the experimental group as compared to the control group. The
    use of CGF showed a positive additive efficacy in enhancing the events of periodontal regeneration in the treatment of
    Degree II mandibular molar furcation defect.
  - 'During whole maxillary dentition distalization with aid of the implants in lingual orthodontics: when the height of power
    arm was 1mm, the anterior teeth rotated clockwise, with the increasing of the height of power-arm, the anterior teeth
    rotated counterclockwise gradually. When the height of power-arm was 9mm, all anterior teeth rotated counterclockwise.
    Central incisor and lateral incisor rotated counterclockwise and canine rotated clockwise when the buccal side force was
    applied. With the increase of the height of the power-arm, the movement pattern of the upper anterior teeth is different.
    The canine is more sensitive to the height of the power-arm than the central incisor and the lateral incisor. When the
    height of the power-arm reaches 9mm, the upper anterior teeth are displayed as crown tipping buccally movement. Compare
    with lingual side force, the buccal side force do better in preventing the loss of anterior tooth torque. If the upper
    anterior teeth are up-right or lingually tipped before treatment, it is preferable to use longer power-arm or buccal side
    traction force. If the anterior teeth are already tipped buccally, then short power-arm or lingual side force is advised.'
  - The integration of multiloop orthodontic mechanics and periodontal crown lengthening represents a predictable and comprehensive
    interdisciplinary strategy for managing deep bite with a gummy smile, resulting in significant improvements in occlusion,
    tooth proportions, and facial esthetics.
  - 'The study included 45 patients (mean age 8.84 ± 1.01 years; mean treatment duration 18.26 ± 0.95 months). Significant
    transverse increases were observed in all maxillary arch widths, particularly in the canine and deciduous molar regions
    (canine dental width: 4.17 ± 1.91 mm, p < 0.001; first deciduous molar width: 3.86 ± 1.93 mm, p < 0.001; second deciduous
    molar width: 4.38 ± 1.78 mm, p < 0.001). Corresponding significant expansion was noted at the alveolar bone level (anterior
    alveolar process width: 4.04 ± 3.37 mm, p < 0.001; posterior alveolar process width: 2.51 ± 1.71 mm, p < 0.001). The maxillary
    first molars showed controlled buccal inclination of 1.6° ± 4.09° (p < 0.01). The upper arch perimeter increased by 3.68 ± 2.95 mm
    (p < 0.001) with crowding reduction of 3.83 ± 3.00 mm (p < 0.001). No significant palatal depth changes occurred (0.42 ± 3.36 mm,
    p = 0.41). In the mixed dentition, the Invisalign First system can effectively expand the maxillary dental-alveolar width,
    maintain molar inclination and improve the transverse deficiencies and arch form in the canine-premolar region.'
  - The greatest significant increase in mandibular width was observed at the level of the first deciduous molars (+2.44 ±
    1.4 mm), followed by the second permanent molars (+2.16 ± 1.4 mm). Lower arch length and arch depth showed a statistically
    relevant increase (2 ± 0.6 mm and 4.5 ± 1.6 mm, respectively). The mean lower dental midline changes were statistically
    significant (1.42 ± 0.73 mm). Early treatment with clear aligners, including the combination of transversal arch development,
    maintenance of leeway space, and guidance of eruption, represents a valid treatment strategy in early mixed dentition
    to manage arch crowding and occlusion development.
  - International journal of surgery case reports
  - The surgical group had an overall increase in the amount of root resorption in all time comparisons and variables with
    significance (p<0.05) in length, volume, and surface area. When comparing mean differences between the control and surgical
    groups, no significant differences were observed except for a few variables. LeFort I segmental osteotomy in conjunction
    with orthodontic treatment, induces root resorption. However, except for a few variables, the differences compared to
    orthodontic treatment alone are not statistically significant. Moreover, these findings are clinically insignificant.
  - '41938440'
- source_sentence: 'Title: Bond strength according to the moment of fiber post cutting fixed with self-adhesive cement to
    the root dentin. Background: The fiber posts require a cut in the coronal portion to adjust it to the available clinical
    space. The cutting of posts cemented may generate tension via bur vibrations of drill on the bonding interface, with the
    possibility of decreasing the bond strength. Thus, this study aimed to evaluate if the moment of cutting the fiber posts
    has an effect on its bond strength when fixed with self-adhesive resin cement.'
  sentences:
  - Journal of clinical and experimental dentistry
  - The effect of moment of fiber posts cutting (<i>p</i> = 0.44) and the interaction between the factors moment of post cutting
    and third root (<i>p</i> = 0.81) had no significant. The root third factor showed a significant effect (<i>p</i> = 0.01).
    The bond strength in the apical third was significantly lower than in the middle (<i>p</i> = 0.00) and coronal (<i>p</i>
    = 0.01) thirds. The moment of post cutting has no effect on the bond strength of fiber posts fixed with self-adhesive
    cement to the root canal. <b>Key words:</b>Fiber post, self-adhesive resin cement, push-out bond strength, operative dentistry.
  - Managing caries is imperative in a rapidly aging society. Current diagnoses use qualitative indices. However, a quantitative
    evaluation of hardness in a clinical setting may lead to more accurate diagnoses. Previously, hardness meter using indenter
    with light for tooth monitoring (HAMILTOM) was developed to quantitatively measure tooth hardness. Herein, the physical
    interpretation of dentin hardness measured using HAMILTOM and the dentin hardness measurement mechanism are discussed.
    The indentation areas were smaller than the dark areas in HAMILTOM, which may be due to exuded water from the dentin sample
    and the elastic recovery of dentin sample. Additionally, the dental probe indentation was deeper than the HAMILTOM indentations.
    The results demonstrate that the indentation areas were smaller than the dark areas measured by HAMILTOM, which might
    contain the influence of exuded water and the deformation of dentin sample. Also, HAMILTOM is less invasive than dental
    probe palpation. In the future, HAMILTOM may become a standard hardness measuring method to diagnose root caries.
  - '33425232'
  - A statistically significant difference was observed in the mean fracture strength, with higher values for the milled group
    (<i>p</i> = 0.004). Furthermore, the milled group had fewer catastrophic failures. The CAD/CAM-milled glass fiber posts
    exhibited greater fracture strength and a reduced incidence of catastrophic fractures.
  - Overall pulp anatomy was variably characterized by the presence of a common pulp chamber in younger teeth, and segmentation
    of pulp cavities into multiple separate pulp entities within the same tooth with increasing age. A common pulp chamber
    was identified in 55.3% (26/47) of teeth with a mean dental age of 1 year and 11 months (± 1 year and 8 months). Columnar
    segmentation was recorded in the remaining teeth with a mean dental age of 6 years and 5 months (± 3 years and 11 months).
    Age of segmentation of the common pulp chamber into multiple separate pulp entities shows wide variation and is dependent
    of the specific Triadan position. The present study illustrates the presence of disto-mesial root contacts between adjacent
    tooth roots, often leading to morphological adaptations, most frequently observed between Triadan 09-10s (80%) and 10-11s
    (67%). The measured sub-occlusal dentinal thickness was as low as 1.11 mm over some pulp horns. The sub-occlusal dentinal
    thickness was lower than 2, 3, and 4 mm in 13.1, 38.1 and 61.4% of performed measurements, respectively. This study provides
    detailed information on age-dependent mandibular cheek teeth anatomy in alpacas, which may support the use and development
    of advanced dental treatments in this species such as endodontics and tooth sectioning techniques. Apical morphological
    adaptations caused by disto-mesial root contact between adjacent mandibular cheek teeth are clearly illustrated. The limited
    amount of sub-occlusal secondary dentin warrants a cautious approach with regards to dental floating in alpacas.
  - AH Plus showed higher bond strength compared to BioRoot RCS and GuttaFlow 2. There was no significant difference in the
    push out bond strength with or without the prior use of 2% CHX medicament (<i>P</i> > 0.05) and also CHX did not affect
    the mode of failure. However, sealer-dentin interface gap was increased with application of medicament. Dislodgement resistance
    of AH Plus sealer is significantly higher than BioRoot RCS and GuttaFlow 2 sealer. The application of 2% CHX intracanal
    medicament before root canal obturation did not significantly affect the dislodgement resistance of the three tested sealers.
    2% CHX medicament did not affect the failure mode of the sealers. Sealer-dentin interface is affected by the use of 2%
    CHX gel medicament.
  - BS differed significantly among groups (<i>p</i> < 0.001). It was higher in the SIL (10.5 ± 3.5 MPa), BLAST + SIL (11.5 ± 3.2 MPa),
    and PER + SIL (11.6 ± 4.6 MPa) groups than in the control (6.5 ± 2.9 MPa), BLAST (8.6 ± 4.0 MPa), and PER (7.1 ± 2.8 MPa)
    groups, with no significant difference among groups receiving silanization. Cement post adhesive failure was more common
    in the SIL, BLAST, and PER + SIL groups, and cement-dentin adhesive failure was more common in the control, BLAST + SIL,
    and PER groups. These results show that silane application alone increases BS.
- source_sentence: 'Title: Precision and Efficacy of Digital Technology in Orthognathic Surgery for Facial Asymmetry Correction:
    A Quantitative Analysis. Background: To evaluate the efficacy of digital technology-assisted design in orthognathic surgery
    for patients with facial asymmetry.'
  sentences:
  - Dental anomalies have multiple effect on the occlusion as well as on the esthetic. Early diagnosis and intervention and
    collaboration between the different subspecialty are needed. Pedodontics, orthodontic, restorative, and prosthodontic
    consultation was taken for the best future proposed treatment that ranges between orthodontics space closure, implants,
    and esthetic treatment for the peg laterals.
  - No significant differences were observed between preoperative simulation designs and postoperative three-dimensional cranial
    models regarding the distances between bilateral corresponding landmarks and the three reference planes. Postoperatively,
    distance differences between bilateral corresponding landmarks and the three reference planes were ≤ 1 mm. Seventy-five
    percent of asymmetry rate indicators were less than 10%. The mean distance from pogonion to midsagittal plane was 1.82 ± 1.16 mm.
    The application of digital technology in orthognathic surgery for patients with facial asymmetry enhances operative precision
    and ensures favorable treatment outcomes. Digital technology in orthognathic surgical planning improves treatment effectiveness
    for patients with facial asymmetry.
  - Out of 38 respondents, 44.7% were orthodontists, 34.2% dentists, 15.8% dental students, and 5.3% dental technicians. Most
    respondents (44.7%) were between 35 and 44 years old, and only 1 (2.6%) respondent was 55-64 years old. Median answers
    for six questions were 'totally agree' (25th percentile 1, 75th percentile 2) and for four questions 'agree' (25th percentile
    1, 75th percentile 2). No correlation was found between age, profession, and responses. Our method generated substantial
    interest among clinicians. The initial responses affirm the potential benefits, supporting the continued exploration of
    MR-based techniques for the treatment of impacted teeth. However, the recommendation for widespread use awaits validation
    through clinical trials.
  - Aesthetic plastic surgery
  - Most of the studies included showed a good methodological quality with a low risk of bias. No significant differences
    in the accuracy of tooth movement between conventional attachments and optimized attachments were noted for canine derotation,
    anterior extrusion, and root angulation changes in canine, premolar, and molar (p > 0.05). The studies however exhibited
    high heterogeneity (I<sup>2</sup> = 75 %). The pooled accuracy for canine derotation was 61.2 % and 71.5 % for conventional
    and optimized rotations respectively. Similarly, 57.5 % and 62.4 % were the pooled accuracy for conventional and optimized
    attachments in anterior extrusion. None of the attachments produced the expected tooth movement as predicted by the ClinCheck
    program. There was a non-significant difference in accuracy between optimized and conventional attachments for most orthodontic
    movements. While optimized attachments may offer improved control for specific movements like upper lateral incisor rotation,
    and conventional attachments potentially enhance anterior extrusion, their overall superiority remains inconclusive. Further
    high-quality research is needed to validate the hypothesized biomechanical advantages of optimized attachments.
  - After 17 months of active treatment, the patient achieved a Class I canine relationship, coincident dental midlines, ideal
    overjet and overbite, and a notably improved facial profile. The mandibular midline deviation was corrected via unilateral
    distalization using buccal-shelf miniscrews, while the left posterior maxillary segment was protracted to substitute the
    extracted molar. From a soft tissue perspective, lip protrusion was reduced, and overall facial balance was enhanced.
    This case underscores the clinical effectiveness of combining asymmetric molar extraction with skeletal anchorage mechanics
    as a non-surgical and non-prosthetic treatment alternative for adult patients with asymmetrical Class III malocclusion
    and compromised molars.
  - The Palatal area and volume, intercanine and intermolar width were significantly higher in the post-treatment as compared
    to pre-treatment study models (<i>P</i> < 0.01). The measurements ofthe maxillary arch were significantly higher in the
    control group compared to the post-treatment measurements of the study group. The increase in palatal area and volume
    was greater in Subgroup I and A compared to Subgroup II and B patients, respectively. The 3-Dimensional palatal dimensions
    in UCLP group improved after orthodontic treatment but were still not comparable to the normal subjects. The patients
    with age >14 years showed more improvement in the maxillary arch.
  - '40514555'
- source_sentence: 'Title: Tick-borne encephalitis virus associated with foetal death in a bitch, a case report. Background:
    For the first time, a case of vertical transmission of TBEV in a dog associated with foetal death is described.'
  sentences:
  - Virology journal
  - 'The prevalence and case fatality of ehrlichiosis were 6.9% and 47.1%, respectively. Dogs in rural areas had 5.8 times
    higher odds of ehrlichiosis (odd ratio, OR: 5.84; 95% CI: 1.72-19.89) compared to urban areas. Dogs with access to other
    dogs had 5.14 times higher odds of ehrlichiosis (OR: 5.14; 95% CI: 1.63-16.27) than those without such access. Similarly,
    irregularly treated dogs with ectoparasitic drugs had 4.01 times higher odds of ehrlichiosis (OR: 4.01; 95% CI: 1.17-14.14)
    compared to regularly treated dogs. The presence of ticks on dogs increased ehrlichiosis odds nearly by 3 times (OR: 3.02;
    95% CI: 1.02-8.97). Phylogenetic analysis, based on 17 commercially sequenced isolates, showed different clusters of aggregation,
    however, BAUMAH-13 (PP321265) perfectly settled with a China isolate (OK667945), similarly, BAUMAH-05 (PP321257) with
    Greece isolate (MN922610), BAUMAH-16 (PP321268) with Italian isolate (KX180945), and BAUMAH-07 (PP321259) with Thailand
    isolate (OP164610). Pet owners and veterinarians in rural areas should be vigilant in monitoring dogs for ticks and ensuring
    proper preventive care. Limiting access to other dogs in high-risk areas can help mitigate disease spread. Tick prevention
    measures and regular treatment with ectoparasitic drugs will reduce the risk of ehrlichiosis in dogs. The observed genetic
    similarity of the Bangladeshi Ehrlichia canis strain highlights the need for ongoing surveillance and research to develop
    effective control and prevention strategies, both within Bangladesh and globally.'
  - 'Median age was 7-years. Generalized tonic-clonic seizures were the most common presenting sign (25/45). Two lesion categories
    were identified: a granulomatous form with 1 or more distinct, intra-axial, contrast-enhancing foci (37/45), and a second
    variation with diffuse, bilateral, symmetrical lesions of the caudate nuclei and frontal lobes (8/45). Serum IgG titers
    ranged from 1 : 1 to ≥ 1 : 256; 2 dogs had positive IgM titers at 1 : 2. All dogs with follow-up serology (34/45) had
    a reduction in titer. Mean duration of follow-up was 22.4 ± 20.5 months (median 16 months). Six dogs were lost to follow-up
    <1-year after diagnosis (median 9 months). Five dogs were clinically well but had yet to be followed for >1-year. Of the
    remaining 34 dogs, 28 (82%) were alive ≥ 1-year after diagnosis. Thirteen of these dogs had follow-up times ≥ 2-years.
    The prognosis for intracranial Coccidioides infection is generally more favorable with medical treatment than in earlier
    reports.'
  - Out of 112 samples collected, 71.4% of cases had anti-<i>L. infantum</i> IgG antibody titers of 1:80 and higher and therefore
    considered as seropositive. Furthermore, from the 70 seropositive dogs with antibody titer of 1:320 and higher, 47 (42%)
    had at least one of the clinical symptoms associated with VL and considered as cases with CanL. The current seroprevalence
    situation of dogs in this region, is very noticeable and can be an important alarm for policymakers and health system
    practitioners. More comprehensive and complementary parasitological studies should be carried out on a number of reservoirs
    in the region for diagnosis and treatment and to accurately determine the statistics of the disease compared to the obtained
    seroprevalence status.
  - '41083999'
  - 'Common examination findings in dogs with a presumed antemortem diagnosis included fever (21%) and heart murmur (19%).
    Median cardiac troponin I was 12.2 ng/mL (range: 0.2-808.0 ng/mL), and troponin exceeded 1.0 ng/mL in 26 of 29 (90%) dogs.
    Ventricular ectopy was the most common arrhythmia (54%), whereas decreased left ventricular systolic function was the
    most common echocardiographic abnormality (56%). An infectious etiology was diagnosed in 35 of 64 (55%) dogs. Confirmed
    infectious etiologies included bacterial sepsis (n = 9) or extension of endocarditis (3), toxoplasmosis or neosporosis
    (3), parvovirus (2), and one case each of bartonellosis, trypanosomiasis, leptospirosis, and dirofilariasis. Median survival
    time was 4 days (range: 0-828 days) for all dogs vs. 82 days for dogs who survived at least 2 weeks after diagnosis. Presence
    of pericardial effusion or azotemia was a significant predictor of non-survival. The most common inflammatory infiltrate
    on histopathology was neutrophilic (47%), and 20 of 137 (14.5%) dogs had concurrent bacterial endocarditis on postmortem.
    Bacterial infection was the most common confirmed etiology of myocarditis in this study. Prognosis for canine myocarditis
    is guarded and similar to that reported for infective endocarditis. Criteria for the antemortem diagnosis of canine myocarditis
    are suggested.'
  - With the spread of both ticks and TBEV, infection with TBEV should be given further consideration as a potential differential
    diagnosis in cases of foetal death in dogs.
  - Both dogs were misdiagnosed due to the atypical lobar presentation of an extremely rare form of plague in a species that
    infrequently succumbs to clinical disease. Presentation outside of the typical transmission period of plague was also
    a factor leading to delayed diagnosis in Case 2. Erroneous identification by automated bacterial identification systems
    was problematic in both cases. In endemic areas, plague should be ruled out early in febrile dogs with acute respiratory
    signs, hemoptysis, lobar or diffuse pathology, and potential for exposure, regardless of season. Seasonal and geographic
    distributions of plague may shift with climate change, so vigilance by primary care veterinarians is warranted. Timely
    submission of samples to a veterinary diagnostic laboratory could expedite accurate diagnosis and reduce potential for
    human and domestic animal exposure.
