  - The Jonangi, also known as Jonangi Jagilam or Kolleti Jagilam, is an indigenous dog breed from India. Primarily found
    in Andhra Pradesh, parts of Karnataka, and along the eastern coast from West Bengal to Tamil Nadu, it was historically
    common near Kolleru Lake in West Godavari and Krishna districts. The Jonangi is a short-haired breed traditionally used
    for hunting, herding, and guarding. While not recognized by major kennel clubs, the breed is showcased at local beach
    festivals in Andhra Pradesh.
  - 'The Shiba Inu (Japanese: 柴犬; Japanese pronunciation: [ɕi.ba.i.nɯ]) is a breed of hunting dog from Japan. A small-to-medium
    breed, it is the smallest of the six original dog breeds native to Japan. The Shiba Inu was originally bred for hunting.
    Its name literally translates to "brushwood dog", as it is used to flush game. The Shiba Inu is a small, alert, and agile
    dog that copes  well with mountainous terrain and hiking trails. Its appearance is similar to other Japanese dog breeds
    such as the Akita Inu or Hokkaido, but the Shiba Inu is a different breed with a distinct bloodline, temperament, and
    smaller size than other Japanese dog breeds.'
- source_sentence: What health problems are common in Great Danes?
  sentences:
  - A UK study found a life expectancy of 13.3 years for the breed, higher than the 12 year average for crossbreeds. A study
    in Japan for pet cemetery data found a life expectancy of 13.4 years, below the overall average of 13.7 years and the
    15.3 year average for crossbreeds below 10 kg. A Japanese study found a significant predisposition to gall bladder mucoceles
    for the Miniature Schnauzer with a 5.23 odds ratio. A North American study found the breed to be predisposed to congenital
    portosystemic shunts, with 1% of Miniature Schnauzers having the condition compared to 0.05% for mixed-breed dogs. Miniature
    Schnauzers are also prone to von Willebrand disease (vWD). vWD in dogs is an inherited bleeding disorder that occurs due
    to qualitative or quantitative deficiency of von Willebrand factor (vWF), a multimeric protein that is required for platelet
    adhesion. The breed is predisposed to atopic dermatitis. Schnauzer comedo syndrome is a type of follicular keratinisation
    defect found exclusively in the Miniature Schnauzer that is similar to nevus comedonicus in humans. The condition is characterised
    by small comedones developing on the dorsal spine (back) of the dog. The condition is believed to be caused by an inherited
    developmental defect in hair follicles, causing abnormal keratinisation and subsequently comedo formation, follicular
    plugging, and secondary bacterial folliculitis which leads to alopecia and crusting.
  - 'Great Danes, like most giant dogs, have a fast metabolism. This results in more energy and food consumption per pound
    of dog than in small breeds. They have some health problems that are common to large breeds, including bloat (gastric
    dilatation volvulus). Nutrition plays a role in this breed''s health. Bloat, or gastric dilatation-volvulus (GDV), is
    the greatest killer of Great Danes. To avoid bloat, a rest period of 40 minutes to one hour after meals is recommended
    before exercise. A 2024 UK study found the average life expectancy of the breed to be 10.6 years, compared to an average
    of 12.7 for purebreeds and 12 for crossbreeds. A 2005 Swedish study of insurance records found 83% of Great Danes died
    by the age of 10, higher than the overall rate of 35% of dogs dying by the age of 10. Dilated cardiomyopathy and many
    congenital heart diseases are also commonly found in the Great Dane, leading to its nickname: the heartbreak breed, in
    conjunction with its shorter lifespan. Great Danes also may carry the merle gene, which is part of the genetic makeup
    that creates the harlequin colouring. The merle gene is an incomplete dominant, meaning only one copy of the gene is needed
    to show the merle colouring; two merle genes produce excessive white markings and many health issues such as deafness,
    blindness, or other debilitating ocular issues. Another relevant gene for the breed is the harlequin gene. For the dog
    to have the harlequin colour, both a copy of the merle gene and one of the harlequin gene are needed. Homozygosity at
    the affected locus for the harlequin gene is lethal for dogs already at the embryonic stage. Great Danes can also develop
    wobbler disease, a condition affecting the vertebral column. Since these dogs grow at a rapid rate, the bones in their
    vertebrae can push up against the spinal cord and cause weakness in the legs. This can be treated with surgery or may
    heal itself over time. Like many larger breeds, Great Danes are at particular risk for hip dysplasia.'
  - A number of health issues, some of them hereditary, have been found in individual Shih Tzu, and are listed below. The
    popularity of the breed has allowed for extremely poor breeding in general, leading to generalized and lifelong diseases,
    often from a fairly early age.
  - A 2024 UK study found a median life expectancy (95% CI) of 13.2 (13.1–13.2) years for the breed compared to an average
    of 12.7 for purebreeds and 12 for crossbreeds. A 2024 Italian study found a life expectancy of 10 years for the breed
    compared to 10 years overall. A 2005 Swedish study found that 22% of Golden Retrievers died by the age of 10, less than
    the overall rate of 35% of dogs dying by the age of 10. The breed is unusually prone to cancer, with one United States
    study finding cancer to be the cause of death in approximately 50% of the population, the second highest in the study.
    Several European studies found a much lower prevalence (20–39%), which may reflect the significant genetic divergence
    between the American and European populations.  They are especially prone to haemangiosarcoma and lymphoma, with an estimated
    lifetime risk of one in five for the former and one in eight for the latter. The breed is also the subject of the Golden
    Retriever Lifetime Study, a long-term prospective research project conducted by the Morris Animal Foundation to investigate
    cancer and other diseases in dogs. The high prevalence of cancer deaths among Golden Retrievers may partly represent a
    lack of other congenital diseases. One UK study found the odds (95% CI) of metastatic neoplasia in the breed to be 4.86
    (2.48–9.50) times greater than the odds of metastatic neoplasia in a large control population of dogs with Petlog microchips
    in the country. The Golden Retriever has a genetic predisposition to primary hypothyroidism; a 2015 review of 5 studies
    found that Golden Retrievers accounted for 17% of cases. Nonepidermolytic ichthyosis is caused by an autosomal recessive
    trait in the Golden Retriever. A mutation in the PNPLA1 gene is responsible.
  - 'A 2024 study in the UK found a life expectancy of 12.5 years compared to an average of 12.7 for purebreeds and 12 for
    crossbreeds. A 2024 Italian study found a life expectancy of 11 years for the breed compared to 10 years overall. Beagles
    may be prone to epilepsy, but this can often be controlled with medication. Hypothyroidism and a number of types of dwarfism
    occur in Beagles. Two conditions in particular are unique to the breed: "Funny Puppy", in which the puppy is slow to develop
    and eventually develops weak legs, a crooked back and although normally healthy, is prone to a range of illnesses; and
    Musladin-Lueke syndrome (MLS) in which the eyes are slanted and the outer toes are underdeveloped but otherwise development
    is as normal. Hip dysplasia, common in Harriers and in some larger breeds, is rarely considered a problem in Beagles.
    Beagles are considered a chondrodystrophic breed, meaning that they are prone to types of disk diseases. In rare cases,
    Beagles may develop immune mediated polygenic arthritis (where the immune system attacks the joints) even at a young age.
    The symptoms can sometimes be relieved by steroid treatments. Another rare disease in the breed is neonatal cerebellar
    cortical degeneration. Affected puppies are slow, have lower co-ordination, fall more often, and do not have a normal
    gait. It has an estimated carrier rate of 5% and affected rate of 0.1%. A genetic test is available. Their long floppy
    ears can mean that the inner ear does not receive a substantial air flow or that moist air becomes trapped, and this can
    lead to ear infections. Beagles may also be affected by a range of eye problems; two common ophthalmic conditions in beagles
    are glaucoma and corneal dystrophy. "Cherry eye", a prolapse of the gland of the third eyelid, and distichiasis, a condition
    in which eyelashes grow into the eye causing irritation, sometimes exist; both these conditions can be corrected with
    surgery. They can suffer from several types of retinal atrophy. Failure of the nasolacrimal drainage system can cause
    dry eye or leakage of tears onto the face. The cause of primary open angle glaucoma in the Beagle is an autosomal recessive
    mutation in the ADAMTS10 gene.  As field dogs they are prone to minor injuries such as cuts and sprains, and, if inactive,
    obesity is a common problem as they will eat whenever food is available and rely on their owners to regulate their weight.
    When working or running free they are also likely to pick up parasites such as fleas, ticks, harvest mites, and tapeworms,
    and irritants such as grass seeds can become trapped in their eyes, soft ears, or paws. Beagles may exhibit a behaviour
    known as reverse sneezing, in which they sound as if they are choking or gasping for breath, but are actually drawing
    air in through the mouth and nose. The exact cause of this behaviour is not known, but it can be a common occurrence and
    is not harmful to the dog. Canine juvenile polyarteritis syndrome, also known as juvenile polyarteritis syndrome of beagle
    dogs is a multisystemic necrotising vasculitis of the small arteries. The condition is characterised by a reoccurrent
    acute fever and cervicalgia over a period of 3-7 days. The Beagle is predisposed with most reports concerning the breed
    — whence the name ''Beagle pain syndrome''.'
  - 'Labrador Retrievers have a predisposition to chronic hepatitis. One UK study found a 4.14 odds ratio. Some studies report
    a predisposition for Labrador Retriever bitches. The reason for the predisposition is unknown. Ideas proposed include
    it being hereditary or environmental. The Labrador Retriever also shows a predisposition to other hepatobiliary diseases,
    including: reactive hepatitis, nodular hyperplasia, and gall bladder disease. A UK study found the breed''s average life
    expectancy to be 13.1 years. A joint study by the Royal Veterinary College study and the University of Sydney concluded
    that chocolate-coloured Labradors have a shorter average life expectancy than other colours of Labrador (by about 10%)
    and are more likely to suffer some health problems. A 2024 Italian study found a life expectancy of 11 years for the breed
    compared to 10 years overall. A 2005 Swedish study of insurance data found that 25% of Labrador Retrievers died by the
    age of 10, less than the overall rate of 35% of dogs dying by the age of 10. Labradors are somewhat prone to hip and elbow
    dysplasia, especially in larger dogs. Eye diseases may include progressive retinal atrophy, cataracts, corneal dystrophy
    and retinal dysplasia. They can suffer from exercise induced collapse, which causes hyperthermia, weakness, collapse,
    and disorientation after short bouts of exercise, or from obesity, which in some cases may be partly due to the absence
    of part or all of the proopiomelanocortin gene. The Labrador Retriever is one of the more commonly affected breeds for
    progressive rod-cone degeneration. An autosomal recessive mutation in the PRCD gene is responsible for the condition in
    the breed.'
- source_sentence: What is the temperament of the Belgian Malinois?
  sentences:
  - 'Although they are considered to be working dogs, Dobermanns are often stereotyped as being ferocious and aggressive.  There
    is some evidence that Doberman Pinschers in North America have a calmer and more even temperament than their European
    counterparts because of the breeding strategies employed by American breeders. Despite this, the American breed standard
    states that, for purposes of determining of conformation fault, aggression and belligerence by a Doberman toward other
    dogs is not counted as viciousness. There is a great deal of scientific evidence that Doberman Pinschers have a number
    of stable psychological traits, such as certain personality factors and intelligence. As early as 1965, studies have shown
    that there are several broad behavioral traits that significantly predict behavior and are genetically determined. Subsequently,
    there have been numerous scientific attempts to quantify canine personality or temperament by using statistical techniques
    for assessing personality traits in humans. These studies often vary in terms of the personality factors they focus on
    and in terms of ranking breeds differently along these dimensions. One such study found that Doberman Pinschers, compared
    to other breeds, rank high in playfulness, average in curiosity/fearlessness, low on aggressiveness, and low on sociability.
    Another such study ranked Doberman Pinschers low on reactivity/surgence and high on aggression/disagreeableness and openness/trainability.
    In addition to the studies of canine personality, there has been some research to determine whether there are breed differences
    in aggression. In a study published in 2008, aggression was divided into four categories: aggression directed at strangers,
    owner, strange dogs, and rivalry with other household dogs. This study found that the Doberman Pinscher ranked relatively
    high on stranger-directed aggression, but extremely low on owner-directed aggression. The Doberman Pinscher ranked as
    average on dog-directed aggression and dog rivalry. Looking only at bites and attempted bites, Doberman Pinschers rank
    as far less aggressive towards humans and show less aggression than many breeds without a reputation (e.g., Cocker Spaniel,
    Dalmatian, and Great Dane). This study concluded that aggression has a genetic basis, that the Dobermann shows a distinctive
    pattern of aggression depending on the situation and that contemporary Doberman Pinschers are not an aggressive breed
    overall. According to the Centers for Disease Control and Prevention (CDC), between 1979 and 1998, the Doberman Pinscher
    was less frequently involved in attacks on humans resulting in fatalities than several other dog breeds such as Pit bulls,
    German Shepherd Dogs, Rottweilers, Husky-type dogs, wolf-dog hybrids and Alaskan Malamutes. According to this CDC study,
    one of the most important factors contributing to dog bites is the level of responsibility exercised by dog owners.'
  - Belgian Shepherds are known to be highly intelligent, alert and sensitive; they are typically highly trainable, vigilant
    and hard-working with a strong guarding instinct making them protective of property and family, and very well suited for
    service with security services. The Groenendael and Tervueren varieties have a reputation for occasionally being snappy,
    making them less suitable as companion dogs for children; the Laekenois, whilst considered very good with children, can
    occasionally be troublesome with other dogs. The Belgian Shepherd responds well to training, and requires training ideally
    from an early age. The breed is very active – particularly the Malinois, which may reflect its continued breeding for
    security roles. While Belgian Shepherds of all coat types require ample exercise, the breed adapts well to living indoors.
  - Indian Spitzes are small dogs - around 33 cm (13 in) at the withers - with a soft chest, fair tail, and a milky white
    double coat. Their eyes have visible irises that can be green or blue, giving them an unusually expressive face. The original
    Spitz was bred for hunting in cold conditions, and their white coloring reflects this. Although the same conditions are
    not found in India, their coloring is attractive and has remained through the years. Some can be white and brown.  Pointy
    fox-like ears make this breed especially expressive. Thick fur covers the outside of the ears and much of the inside as
    well, requiring extra attention when it comes to care and grooming. The tail of an Indian Spitz curls over their back
    and is quite fluffy. Their legs are only slightly longer than their bodies, which makes their heads look large. Indian
    Spitzes may be one of the easiest dogs to live with, making them one of the most popular family dog among Indian breeds.
    They are easily housebroken and trained. Grooming and exercise are relatively low maintenance, and they are highly adaptable
    dogs. They are equally comfortable in small apartments and in large, open houses. However, they do need moderate exercise.
  - The Kanni is usually shy, but will always defend its home or master if the need arises. The Kanni dogs are extremely faithful
    and easy to train, but they will think independently when on a hunt. They are very loyal to their family.
  - The Alaskan Malamute () is a large breed of dog that was originally bred for its strength and endurance to haul heavy
    freight as a sled dog. It is similar to other arctic breeds such as the husky, the spitz, the Greenland Dog, Canadian
    Eskimo Dog, the Siberian Husky, and the Samoyed.
  - 'It is a small dog: according to the international breed standard, height at the withers for both dogs and bitches varies
    from 30 to 35 cm, with body weights in the range 4 to 8 kg; weights most commonly fall in the range 4.5 to 7 kg. When
    seen from the side, the outline of the body is roughly square – the length of the body is close to – or equal to – the
    height at the withers. They have a double coat, with wiry exterior fur and a soft undercoat. In show trim, the coat is
    kept short on the body, but the fur on the ears, legs, belly, and face is retained. Recognized coat colors are black,
    pepper and salt, black and silver, and pure white; pepper and salt coloration is where coat hairs have banded shades of
    black, gray and silver, fading to a gray or silver at the eyebrows, whiskers, underbody and legs. Schnauzers are characterized
    by a rectangular head with bushy beard, mustache, and eyebrows; teeth that meet in a "scissor bite"; oval and dark colored
    eyes; and v-shaped, natural forward-folding ears (when cropped, the ears point straight upward and come to a sharp point).
    Their tails are naturally thin and short, and may be docked (where permitted). They will also have very straight, rigid
    front legs, and feet that are short and round (so-called "cat feet") with thick, black pads.'
