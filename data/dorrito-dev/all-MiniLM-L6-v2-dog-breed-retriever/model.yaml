  - source_sentence: What is the history of the Akita (dog) breed?
    sentences:
    - The Miniature American Shepherd, frequently abbreviated MAS, is a small herding dog breed. The MAS is highly intelligent
      and biddable. The breed is often trained for dog sports such as herding, agility, obedience, canine freestyle, flyball,
      and others. The Miniature American Shepherd was recognised by the American Kennel Club (AKC) in 2015 and is the club's
      186th breed. In September 2019, the Fédération Cynologique Internationale (FCI) officially accepted the breed.
    - The Golden Retriever is a Scottish breed of retriever dog of medium-large size. It is characterised by a gentle and
      affectionate nature and a striking golden coat. It is a working dog, and registration is subject to successful completion
      of a working trial. It is commonly kept as a companion dog and is among the most frequently registered breeds in several
      Western countries; some may compete in dog shows or obedience trials, or work as guide dogs. The Golden Retriever was
      bred by Sir Dudley Marjoribanks at his Scottish estate Guisachan in the late nineteenth century. He cross-bred Flat-coated
      Retrievers with Tweed Water Spaniels, with some further infusions of Red Setter, Labrador Retriever and Bloodhound.
      It was recognised by the Kennel Club in 1913, and during the interwar period spread to many parts of the world.
    - The Siberian Husky is a breed of medium-sized working sled dog. The breed belongs to the Spitz genetic family. It is
      recognizable by its thickly furred double coat, erect triangular ears, and distinctive markings, and is smaller than
      the similar-looking Alaskan Malamute. Siberian Huskies originated in the Russian Far East, where the breed was first
      developed by the Chukchi people for sled pulling and companionship. Other indigenous Siberian peoples in North Asia,
      such as the Koryak, Yukaghir, and Kamchadal, also breed them. It is an active, energetic, resilient breed, whose ancestors
      lived in the extremely cold and harsh environment of the Siberian Arctic. William Goosak, a Russian fur trader, introduced
      them to Nome, Alaska, during the Nome Gold Rush, initially as sled dogs to work the mining fields and for expeditions
      through otherwise impassable terrain. Today, the Siberian Husky is typically kept as a house pet, though they are still
      frequently used as sled dogs by competitive and recreational mushers.
    - 'The American Kennel Club (AKC) breed standard describes a natural range of size, with a desired size of 23 inches (58
      cm) tall and 75 pounds (34 kg) for females, 25 inches (64 cm) tall and 85 pounds (39 kg) for males. Heavier individuals
      (90 lb (41 kg)) and dogs smaller than 75 pounds (34 kg) are commonly seen. There is often a marked size difference between
      males and females. Weights upwards of 100 pounds (45 kg) are also seen. The Alaskan Malamute is double coated. The undercoat
      has an oily and woolly texture and can be as thick as two inches. The outer guard coat is coarse and stands off the
      body longer at the withers but not more than one inch off the sides of the body. Ears are small in proportion to the
      head and stand firmly erect when at attention. The Alaskan Malamute is a heavy dog, with a more formidable nature and
      structure than the Siberian Husky, which is bred for speed. The Alaskan Malamute is bred for power and endurance, which
      is its original function and what the standard of the breed requires of Alaskan Malamute breeders. The usual colors
      are various shades of grey and white, sable and white, black and white, seal and white, red and white, or solid white.
      There are a wide range of markings in the breed including face markings, blazes, a splash at the nape of the neck, and
      a collar or half collar. White is often the predominant color on the body, parts of the legs, feet, and part of the
      markings of the face. In terms of color variants, some Malamutes exhibit a dark grey to buff-colored undertone around
      their trimmings and white areas, presenting with a color-linked gene known as agouti. Two agouti alleles, with the possibility
      of a third, appear to be found in Malamutes: aw (agouti pattern or wolf/wild pattern), at (tan point pattern or black
      pattern), and awat (heterozygous agouti or dark agouti). The eyes of the Alaskan Malamute are almond shaped and varied
      shades of brown; however, the darker eye is preferred. Purebred Alaskan Malamutes will not have blue eyes. The physical
      build of the Malamute is compact and strong with substance, bone and snowshoe feet. According to the AKC breed standard,
      the Malamute''s tail is well furred and is carried over the back like a waving plume. Corkscrew tails (commonly seen
      in the Akita) are occasionally seen but are faulted in the AKC breed standard. The Malamutes'' well-furred tails aid
      in keeping them warm when they curl up in the snow. They are often seen wrapping the tail around their nose and face,
      which presumably protects them against such harsh weather elements as blowing snow. Their ears are generally upright,
      wedge shaped, small in proportion to the head, and set to the side of the skull. The muzzle is deep and broad, tapering
      slightly from the skull to the nose. Nose and gums are black, but some Malamutes have a snow nose, which is black with
      a pink undertone that can get darker or lighter, depending on the season.'
    - The Boston Terrier is a breed of dog originating in the United States of America. It was accepted in 1893 by the American
      Kennel Club as a non-sporting breed. The dogs are small and compact, with a short tail and erect ears. The Boston Terrier
      ranked as the 23rd-most registered breed with the American Kennel Club in 2024.
    - The Japanese Akita and American Akita began to diverge in type post-World War II due to America and Europe preserving
      the Akitas that fell out of favour in Japan, particularly the Dewa-types and dogs with the signature black mask or pinto
      marking. American Akitas are typically considered mixed by Japanese breeders (and not true Akitas by the Japanese standard).
      However, their phenotype predates the Japanese Akita by a few decades, and they are closer to pre-war Akitas like Hachiko.
      Helen Keller is credited with bringing the Akita to America after being given two Akitas by the Japanese government
      in 1938. By 1939, a breed standard was established, and dog shows began to be held, but this development was interrupted
      by World War II. During this time, US servicemen serving as part of the occupation force in Japan first came into contact
      with the Akita. The breed so impressed them that many service members chose to bring an Akita back home with them upon
      completion of their tour. Although both types derive from common ancestry, marked differences are seen between the two.
      American Akitas generally are heavier boned and larger, with a more bear-like head, whereas Japanese Akitas tend to
      be lighter and more finely featured with a fox-like head. Additionally, while American Akitas are acceptable in all
      colors, Japanese Akitas are only permitted to be red, white, or brindle. Additionally, American Akitas may be pinto
      and/or have black masks, unlike Japanese Akitas, where these are considered disqualifications and are not permitted
      in the breed standards. Recognized by the American Kennel Club in 1955, the Akita was placed in the Miscellaneous class.
      The AKC did not approve the Akita standard until 1972, and it was moved to the Working Dog class. As such, the Akita
      is a rather new breed in the United States. Foundation stock in America continued to be imported from Japan until 1974,
      when the AKC cut off registration to any further Japanese imports until 1992, when it recognized the Japan Kennel Club
      standards. This decision set the stage for the divergence in type between the American Akita and Japanese Akita Inu
      that is present today. Elsewhere in the world, one American Akita was first introduced to the UK in 1937. He was a Canadian
      import, owned by a Mrs. Jenson; the descendants of Mrs. Jenson live on today breeding American Akitas. The most widely
      known of these is Joseph Felton, an award-winning Akita breeder, but the breed was not itself widely known until the
      early 1980s. The breed was introduced in Australia in 1982 with an American import and to New Zealand in 1986 with an
      import from the UK.
  - source_sentence: What is the history of the Golden Retriever breed?
    sentences:
    - The Australian Shepherd descends in part from pastoral dogs brought to herd Spanish flocks in North America as early
      as the 1500s. There is some speculation that these dogs included the Carea Leonés, a mountain sheepdog that can display
      the eye color and merle coat found in many contemporary Australian Shepherds. It is sometimes claimed that the Basque
      Shepherd Dog and the Pyrenean Sheepdog were also among the ancestors of the breed. The breed as it is known today developed
      in California in the 19th century, as a sheep herding dog for Californian shepherds. The Australian Shepherd is also
      believed to be descended from a variety of herding dogs imported to California with imported sheep, including collies
      from Australia and New Zealand. It was from these ancestors that the breed took its name. The Australian Shepherd spread
      from California throughout the Western United States where it became extremely popular with ranchers who valued the
      breed's sheep working qualities, as well as their ability to handle cattle and other livestock. A purely working breed
      for over a century, the Australian Shepherd was virtually unknown outside of the livestock industry until the mid-20th
      century when the breed was popularised by Jay Sisler, a rodeo performer, at rodeos across the western states with his
      Australian Shepherds performing all manner of tricks. A breed club was soon formed to promote the breed, the Australian
      Shepherd Club of America, and kennel club recognition followed in 1979 when the breed was recognised by the United Kennel
      Club. The breed was subsequently recognised by the American Kennel Club in the 1990s and later the Fédération Cynologique
      Internationale. From the late-20th century the Australian Shepherd has increasingly been seen in conformation shows
      and it has become an extremely popular companion dog. In 2024 it was ranked by the American Kennel Club as the 12th
      most popular breed of dog in the United States.
    - The Labrador breed dates back to at least the 1830s, when St John's water dogs bred by European settlers in Newfoundland
      were first introduced to Britain from ships trading between Canada and Poole in Dorset. These were then bred with British
      hunting dogs to create what became known as the Labrador Retriever. Its early patrons included the Earl of Malmesbury,
      the Duke of Buccleuch, the Earl of Home and Sir John Scott. Early writers have confused the Labrador with the much larger
      Newfoundland and the Lesser Newfoundland, with Charles William George St John even referring to the Lesser Newfoundland
      as the Newfoundland. Colonel Peter Hawker describes the first Labrador as being not larger than an English Pointer,
      more often black than other colours, long in its head and nose with a deep chest, fine legs, and short and smooth coat,
      and did not carry its tail as highly as the Newfoundland. Hawker distinguishes the Newfoundland from both the "proper
      Labrador" and St John's breed of these dogs in the fifth edition of his book Instructions to Young Sportsmen, published
      in 1846. By 1870 the name Labrador Retriever had become common in England. The liver (now usually called chocolate)
      Labrador emerged in the late 1800s, with liver-coloured pups documented at the Buccleuch kennels in 1892; the first
      yellow Labrador on record was born in 1899 (Ben of Hyde, kennels of Major C.J. Radclyffe). The breed was recognised
      by the Kennel Club in 1903. The first American Kennel Club (AKC) registration was in 1917.
    - 'Many theories of the origin of the Weimaraner have been advanced, but there are few documented historical facts; silver-grey
      dogs are shown in paintings by Antoon van Dyck in the seventeenth century and by Jean-Baptiste Oudry in the eighteenth.
      The breed is believed to have originated in the area of the city of Weimar (then in Saxe-Weimar-Eisenach, now in the
      state of Thuringia) – the city from which its name derives. It is sometimes claimed that the dogs were kept at the court
      of Karl August, Grand Duke of Saxe-Weimar-Eisenach, in the early nineteenth century. From 1879 the dogs were considered
      to be a blue variant of the German Short-haired Pointer, and were eligible for registration in the stud-book of the
      Kurzhaar Klub. They first appeared at a dog show in 1880, when fourteen examples were presented in Berlin. These were
      of three differing types, from three different kennels: the traditional Thüringer Hund; the Weißenfelser Hund, which
      was rather more elegant; and the Sanderslebener, which was intermediate between the two. The Weimaraner was recognised
      as a distinct breed in 1891. A breed standard was drawn up in 1896, and in 1897 a breed association was established
      in Erfurt with the name Verein zur Reinzucht des silbergrauen Weimaraner-Vorstehhund; this was soon changed to Verein
      zur Züchtung des Weimaraner Vorstehhundes. In the early years of the twentieth century – the time of the Great War –
      the Weimaraner came close to extinction; it was reconstituted from the few surviving examples of the breed. It was definitively
      accepted by the Fédération Cynologique Internationale in 1954. In the fifteen years from 2007 to 2021, the annual number
      of new registrations in Germany averaged about 485, with a low of 390 and a high of 607.'
    - 'The Golden Retriever was developed in Scotland in the nineteenth century by Sir Dudley Marjoribanks (later to become
      Baron Tweedmouth) from Flat-coated Retrievers judiciously crossed with Tweed Water Spaniels and some other British dog
      breeds. Before the 1952 publication of the detailed stud book, meticulously maintained by Marjoribanks, a number of
      romantic tales about the breed''s origins were published. In the 1860s, Marjoribanks set out to create what, to his
      mind, was the ultimate breed of retriever at Guisachan, his Scottish estate. He started by acquiring a yellow-coloured
      Flat-coated Retriever dog named Nous; Nous had been whelped in June 1864 and was the only yellow pup in an otherwise
      all black-coloured litter. Although uncommon, occasionally liver-, brown-, golden- or yellow-coloured purebred Flat-coated
      Retriever pups are whelped to matings of two black parents. It was Nous''s pedigree that gave rise to the romantic tales
      of the Golden Retriever''s heritage. One early account claimed Nous was purchased from a Russian circus trainer in Brighton;
      another claimed he was bought from a cobbler; and yet another claimed he was bought from a gypsy. The stud book states
      that Nous was a Flat-coated Retriever bred by Henry Pelham, 3rd Earl of Chichester on his Stanmer Park estate near Brighton.
      In 1868, Nous was mated to a Tweed Water Spaniel female named Belle, who is recorded in the stud book as being whelped
      in 1863 and being of "Ladykirk breeding". The litter from this mating consisted of four yellow pups: Primrose, Ada,
      Cowslip, and Crocus. The female selected from this litter, Cowslip, was mated to a Tweed Water Spaniel called Tweed
      with the mating producing a bitch pup called Topsy. Cowslip was subsequently mated to a Red Setter called Sampson; that
      mating produced a dog pup called Jack. Topsy was mated with a black Flat-coated Retriever called Sambo and a bitch pup
      from that litter, Zoe, was mated back to Jack and two pups from that mating were retained, a dog called Nous II and
      a bitch called Gill. Gill was mated to a black Labrador Retriever called Tracer, and a bitch pup from that mating, Queenie,
      was mated back to Nous II; all Golden Retrievers descend from this mating. The progeny from these various matings varied
      in colour from pure black to light cream, but it was the golden-coloured ones that were retained and mated to each other,
      forming the foundation stock of the Golden Retriever breed. Marjoribanks is also known to have used a sandy-coloured
      Bloodhound and another Labrador in subsequent years of the breeding programme.  In 1952, Marjoribanks''s great-nephew,
      Giles Fox-Strangways, 6th Earl of Ilchester, teamed up with Elma Stonex, and together they studied Marjoribanks''s stud
      book. In 1960, their research was published, presenting all of the evidence required to counter all tales of Russian
      ancestry. The stud book, which covers the period from 1868 to 1890, is preserved in the library of the Kennel Club in
      London. In the early days, Golden Retrievers were called the "Flat-coated Retriever, Golden". Initially, the Golden
      Retriever was considered a colour variety of the former breed. In 1903, the Kennel Club recorded the first examples,
      listing them in the same register as Flat-coats. In 1904 a Golden Retriever won a field trial and in 1908 the first
      examples were exhibited at conformation shows. In 1911, a breed club for the breed in England, the Golden Retriever
      Club, was formed, and the breed was given a new name, the "Yellow or Golden Retriever". From this point, they were increasingly
      seen as a separate breed from the Flat-coated Retriever. It was not until 1913 that the Kennel Club began recording
      them on a separate breed register from the Flat-coated Retriever, and in 1920, the "Yellow or" was dropped from the
      breed name, and they were officially called the "Golden Retriever". One early twentieth-century enthusiast of the breed,
      Winifred Charlesworth, was instrumental in establishing the breed club and in securing its separate Kennel Club recognition.
      It was she who drew up the first breed standard, which was adopted by the Kennel Club and, with only minor amendments,
      remains essentially unchanged. She bred and exhibited the first Golden Retriever Show Champion, was a strong advocate
      for maintaining the working instincts of the breed, and is credited with popularising it at field trials and introducing
      it to shooting sportsmen. In the years after the First World War, its popularity increased markedly, and in the 1920s
      and 1930s it spread through much of the Western world. The Canadian Kennel Club recognised the breed in 1927, and the
      American Kennel Club in 1932. The first examples were registered in France in 1934 and in Australia in 1937. The worldwide
      popularity of the breed meant it did not suffer the misfortunes many British dog breeds did during the Second World
      War due to British wartime restrictions on the breeding of larger dogs, with ample quality breeding stock available
      globally to ensure none of its characteristics were lost. Since the 1940s, its popularity has continued to grow, and
      it has become one of the most recognised and most frequently registered dog breeds in the Western world.'
    - The name "Brittany" is taken from the Brittany region in northwestern France where the dog originated. Images of orange
      and white Brittany-like dogs hunting and retrieving game were first seen on tapestries and paintings from the 17th century.
      The first written and verifiable record of Brittanys comes from a hunting description written by Reverend Davies in
      1850. He described hunting with small "bobtailed" dogs who pointed and were excellent retrievers. It was around the
      same time that the modern Brittany is rumored to have been bred by mating with English Setters. The Brittany was first
      recognized as a breed in 1907 when an orange and white male named Boy was registered in France. As a result, the first
      standards were outlined in the same year. America recognized the Brittany in 1931 and the breed was approved by the
      American Kennel Club in 1934. In 1982 the "Spaniel" was officially dropped from the name.
    - The Weimaraner is a German breed of hunting dog of medium to large size, with history going back at least to the nineteenth
      century. It originated in the area of the city of Weimar (then in Saxe-Weimar-Eisenach, now in the state of Thuringia),
      for which it is named. It was recognised as a breed in 1891. It is an all-purpose gun dog, characterised by its speed
      and stamina, its good nose and eye, and its courage and intelligence; in Germany it is not considered suitable for keeping
      as a companion dog.
  - source_sentence: Where did the Akita (dog) originate?
    sentences:
    - The Japanese Akita and American Akita began to diverge in type post-World War II due to America and Europe preserving
      the Akitas that fell out of favour in Japan, particularly the Dewa-types and dogs with the signature black mask or pinto
      marking. American Akitas are typically considered mixed by Japanese breeders (and not true Akitas by the Japanese standard).
      However, their phenotype predates the Japanese Akita by a few decades, and they are closer to pre-war Akitas like Hachiko.
      Helen Keller is credited with bringing the Akita to America after being given two Akitas by the Japanese government
      in 1938. By 1939, a breed standard was established, and dog shows began to be held, but this development was interrupted
      by World War II. During this time, US servicemen serving as part of the occupation force in Japan first came into contact
      with the Akita. The breed so impressed them that many service members chose to bring an Akita back home with them upon
      completion of their tour. Although both types derive from common ancestry, marked differences are seen between the two.
      American Akitas generally are heavier boned and larger, with a more bear-like head, whereas Japanese Akitas tend to
      be lighter and more finely featured with a fox-like head. Additionally, while American Akitas are acceptable in all
      colors, Japanese Akitas are only permitted to be red, white, or brindle. Additionally, American Akitas may be pinto
      and/or have black masks, unlike Japanese Akitas, where these are considered disqualifications and are not permitted
      in the breed standards. Recognized by the American Kennel Club in 1955, the Akita was placed in the Miscellaneous class.
      The AKC did not approve the Akita standard until 1972, and it was moved to the Working Dog class. As such, the Akita
      is a rather new breed in the United States. Foundation stock in America continued to be imported from Japan until 1974,
      when the AKC cut off registration to any further Japanese imports until 1992, when it recognized the Japan Kennel Club
      standards. This decision set the stage for the divergence in type between the American Akita and Japanese Akita Inu
      that is present today. Elsewhere in the world, one American Akita was first introduced to the UK in 1937. He was a Canadian
      import, owned by a Mrs. Jenson; the descendants of Mrs. Jenson live on today breeding American Akitas. The most widely
      known of these is Joseph Felton, an award-winning Akita breeder, but the breed was not itself widely known until the
      early 1980s. The breed was introduced in Australia in 1982 with an American import and to New Zealand in 1986 with an
      import from the UK.
    - 'The American Kennel Club (AKC) breed standard describes a natural range of size, with a desired size of 23 inches (58
      cm) tall and 75 pounds (34 kg) for females, 25 inches (64 cm) tall and 85 pounds (39 kg) for males. Heavier individuals
      (90 lb (41 kg)) and dogs smaller than 75 pounds (34 kg) are commonly seen. There is often a marked size difference between
      males and females. Weights upwards of 100 pounds (45 kg) are also seen. The Alaskan Malamute is double coated. The undercoat
      has an oily and woolly texture and can be as thick as two inches. The outer guard coat is coarse and stands off the
      body longer at the withers but not more than one inch off the sides of the body. Ears are small in proportion to the
      head and stand firmly erect when at attention. The Alaskan Malamute is a heavy dog, with a more formidable nature and
      structure than the Siberian Husky, which is bred for speed. The Alaskan Malamute is bred for power and endurance, which
      is its original function and what the standard of the breed requires of Alaskan Malamute breeders. The usual colors
      are various shades of grey and white, sable and white, black and white, seal and white, red and white, or solid white.
      There are a wide range of markings in the breed including face markings, blazes, a splash at the nape of the neck, and
      a collar or half collar. White is often the predominant color on the body, parts of the legs, feet, and part of the
      markings of the face. In terms of color variants, some Malamutes exhibit a dark grey to buff-colored undertone around
      their trimmings and white areas, presenting with a color-linked gene known as agouti. Two agouti alleles, with the possibility
      of a third, appear to be found in Malamutes: aw (agouti pattern or wolf/wild pattern), at (tan point pattern or black
      pattern), and awat (heterozygous agouti or dark agouti). The eyes of the Alaskan Malamute are almond shaped and varied
      shades of brown; however, the darker eye is preferred. Purebred Alaskan Malamutes will not have blue eyes. The physical
      build of the Malamute is compact and strong with substance, bone and snowshoe feet. According to the AKC breed standard,
      the Malamute''s tail is well furred and is carried over the back like a waving plume. Corkscrew tails (commonly seen
      in the Akita) are occasionally seen but are faulted in the AKC breed standard. The Malamutes'' well-furred tails aid
      in keeping them warm when they curl up in the snow. They are often seen wrapping the tail around their nose and face,
      which presumably protects them against such harsh weather elements as blowing snow. Their ears are generally upright,
      wedge shaped, small in proportion to the head, and set to the side of the skull. The muzzle is deep and broad, tapering
      slightly from the skull to the nose. Nose and gums are black, but some Malamutes have a snow nose, which is black with
      a pink undertone that can get darker or lighter, depending on the season.'
    - The origin of the Bakharwal Dog lies in Ladakh, northern India, and found in the states of Jammu and Kashmir and Himachal
      Pradesh.  The Bakharwal Dog may be descended from crossbreeding the Tibetan Mastiff with the Indian pariah dog, though
      other scholars state that the Bakharwal Dog is the "oldest Indian Dog which since centuries has been surviving with
      the Kashmiri nomads." The Bakharwal Dog has been targeted by separatist militants in the erstwhile Indian state of Jammu
      and Kashmir, who shot the dogs to prevent them from alerting people of their intrusion.  These separatist militants
      prevented herdsmen from going to higher reaches, which caused many Bakharwal Dogs to catch disease and die.
    - The Australian Shepherd descends in part from pastoral dogs brought to herd Spanish flocks in North America as early
      as the 1500s. There is some speculation that these dogs included the Carea Leonés, a mountain sheepdog that can display
      the eye color and merle coat found in many contemporary Australian Shepherds. It is sometimes claimed that the Basque
      Shepherd Dog and the Pyrenean Sheepdog were also among the ancestors of the breed. The breed as it is known today developed
      in California in the 19th century, as a sheep herding dog for Californian shepherds. The Australian Shepherd is also
      believed to be descended from a variety of herding dogs imported to California with imported sheep, including collies
      from Australia and New Zealand. It was from these ancestors that the breed took its name. The Australian Shepherd spread
      from California throughout the Western United States where it became extremely popular with ranchers who valued the
      breed's sheep working qualities, as well as their ability to handle cattle and other livestock. A purely working breed
      for over a century, the Australian Shepherd was virtually unknown outside of the livestock industry until the mid-20th
      century when the breed was popularised by Jay Sisler, a rodeo performer, at rodeos across the western states with his
      Australian Shepherds performing all manner of tricks. A breed club was soon formed to promote the breed, the Australian
      Shepherd Club of America, and kennel club recognition followed in 1979 when the breed was recognised by the United Kennel
      Club. The breed was subsequently recognised by the American Kennel Club in the 1990s and later the Fédération Cynologique
      Internationale. From the late-20th century the Australian Shepherd has increasingly been seen in conformation shows
      and it has become an extremely popular companion dog. In 2024 it was ranked by the American Kennel Club as the 12th
      most popular breed of dog in the United States.
    - The Jonangi, also known as Jonangi Jagilam or Kolleti Jagilam, is an indigenous dog breed from India. Primarily found
      in Andhra Pradesh, parts of Karnataka, and along the eastern coast from West Bengal to Tamil Nadu, it was historically
      common near Kolleru Lake in West Godavari and Krishna districts. The Jonangi is a short-haired breed traditionally used
      for hunting, herding, and guarding. While not recognized by major kennel clubs, the breed is showcased at local beach
      festivals in Andhra Pradesh.
    - 'The Shiba Inu (Japanese: 柴犬; Japanese pronunciation: [ɕi.ba.i.nɯ]) is a breed of hunting dog from Japan. A small-to-medium
      breed, it is the smallest of the six original dog breeds native to Japan. The Shiba Inu was originally bred for hunting.
      Its name literally translates to "brushwood dog", as it is used to flush game. The Shiba Inu is a small, alert, and
      agile dog that copes  well with mountainous terrain and hiking trails. Its appearance is similar to other Japanese dog
      breeds such as the Akita Inu or Hokkaido, but the Shiba Inu is a different breed with a distinct bloodline, temperament,
      and smaller size than other Japanese dog breeds.'
  - source_sentence: What health problems are common in Great Danes?
    sentences:
    - A UK study found a life expectancy of 13.3 years for the breed, higher than the 12 year average for crossbreeds. A study
      in Japan for pet cemetery data found a life expectancy of 13.4 years, below the overall average of 13.7 years and the
      15.3 year average for crossbreeds below 10 kg. A Japanese study found a significant predisposition to gall bladder mucoceles
      for the Miniature Schnauzer with a 5.23 odds ratio. A North American study found the breed to be predisposed to congenital
      portosystemic shunts, with 1% of Miniature Schnauzers having the condition compared to 0.05% for mixed-breed dogs. Miniature
      Schnauzers are also prone to von Willebrand disease (vWD). vWD in dogs is an inherited bleeding disorder that occurs
      due to qualitative or quantitative deficiency of von Willebrand factor (vWF), a multimeric protein that is required
      for platelet adhesion. The breed is predisposed to atopic dermatitis. Schnauzer comedo syndrome is a type of follicular
      keratinisation defect found exclusively in the Miniature Schnauzer that is similar to nevus comedonicus in humans. The
      condition is characterised by small comedones developing on the dorsal spine (back) of the dog. The condition is believed
      to be caused by an inherited developmental defect in hair follicles, causing abnormal keratinisation and subsequently
      comedo formation, follicular plugging, and secondary bacterial folliculitis which leads to alopecia and crusting.
    - 'Great Danes, like most giant dogs, have a fast metabolism. This results in more energy and food consumption per pound
      of dog than in small breeds. They have some health problems that are common to large breeds, including bloat (gastric
      dilatation volvulus). Nutrition plays a role in this breed''s health. Bloat, or gastric dilatation-volvulus (GDV), is
      the greatest killer of Great Danes. To avoid bloat, a rest period of 40 minutes to one hour after meals is recommended
      before exercise. A 2024 UK study found the average life expectancy of the breed to be 10.6 years, compared to an average
      of 12.7 for purebreeds and 12 for crossbreeds. A 2005 Swedish study of insurance records found 83% of Great Danes died
      by the age of 10, higher than the overall rate of 35% of dogs dying by the age of 10. Dilated cardiomyopathy and many
      congenital heart diseases are also commonly found in the Great Dane, leading to its nickname: the heartbreak breed,
      in conjunction with its shorter lifespan. Great Danes also may carry the merle gene, which is part of the genetic makeup
      that creates the harlequin colouring. The merle gene is an incomplete dominant, meaning only one copy of the gene is
      needed to show the merle colouring; two merle genes produce excessive white markings and many health issues such as
      deafness, blindness, or other debilitating ocular issues. Another relevant gene for the breed is the harlequin gene.
      For the dog to have the harlequin colour, both a copy of the merle gene and one of the harlequin gene are needed. Homozygosity
      at the affected locus for the harlequin gene is lethal for dogs already at the embryonic stage. Great Danes can also
      develop wobbler disease, a condition affecting the vertebral column. Since these dogs grow at a rapid rate, the bones
      in their vertebrae can push up against the spinal cord and cause weakness in the legs. This can be treated with surgery
      or may heal itself over time. Like many larger breeds, Great Danes are at particular risk for hip dysplasia.'
    - A number of health issues, some of them hereditary, have been found in individual Shih Tzu, and are listed below. The
      popularity of the breed has allowed for extremely poor breeding in general, leading to generalized and lifelong diseases,
      often from a fairly early age.
    - A 2024 UK study found a median life expectancy (95% CI) of 13.2 (13.1–13.2) years for the breed compared to an average
      of 12.7 for purebreeds and 12 for crossbreeds. A 2024 Italian study found a life expectancy of 10 years for the breed
      compared to 10 years overall. A 2005 Swedish study found that 22% of Golden Retrievers died by the age of 10, less than
      the overall rate of 35% of dogs dying by the age of 10. The breed is unusually prone to cancer, with one United States
      study finding cancer to be the cause of death in approximately 50% of the population, the second highest in the study.
      Several European studies found a much lower prevalence (20–39%), which may reflect the significant genetic divergence
      between the American and European populations.  They are especially prone to haemangiosarcoma and lymphoma, with an
      estimated lifetime risk of one in five for the former and one in eight for the latter. The breed is also the subject
      of the Golden Retriever Lifetime Study, a long-term prospective research project conducted by the Morris Animal Foundation
      to investigate cancer and other diseases in dogs. The high prevalence of cancer deaths among Golden Retrievers may partly
      represent a lack of other congenital diseases. One UK study found the odds (95% CI) of metastatic neoplasia in the breed
      to be 4.86 (2.48–9.50) times greater than the odds of metastatic neoplasia in a large control population of dogs with
      Petlog microchips in the country. The Golden Retriever has a genetic predisposition to primary hypothyroidism; a 2015
      review of 5 studies found that Golden Retrievers accounted for 17% of cases. Nonepidermolytic ichthyosis is caused by
      an autosomal recessive trait in the Golden Retriever. A mutation in the PNPLA1 gene is responsible.
    - 'A 2024 study in the UK found a life expectancy of 12.5 years compared to an average of 12.7 for purebreeds and 12 for
      crossbreeds. A 2024 Italian study found a life expectancy of 11 years for the breed compared to 10 years overall. Beagles
      may be prone to epilepsy, but this can often be controlled with medication. Hypothyroidism and a number of types of
      dwarfism occur in Beagles. Two conditions in particular are unique to the breed: "Funny Puppy", in which the puppy is
      slow to develop and eventually develops weak legs, a crooked back and although normally healthy, is prone to a range
      of illnesses; and Musladin-Lueke syndrome (MLS) in which the eyes are slanted and the outer toes are underdeveloped
      but otherwise development is as normal. Hip dysplasia, common in Harriers and in some larger breeds, is rarely considered
      a problem in Beagles. Beagles are considered a chondrodystrophic breed, meaning that they are prone to types of disk
      diseases. In rare cases, Beagles may develop immune mediated polygenic arthritis (where the immune system attacks the
      joints) even at a young age. The symptoms can sometimes be relieved by steroid treatments. Another rare disease in the
      breed is neonatal cerebellar cortical degeneration. Affected puppies are slow, have lower co-ordination, fall more often,
      and do not have a normal gait. It has an estimated carrier rate of 5% and affected rate of 0.1%. A genetic test is available.
      Their long floppy ears can mean that the inner ear does not receive a substantial air flow or that moist air becomes
      trapped, and this can lead to ear infections. Beagles may also be affected by a range of eye problems; two common ophthalmic
      conditions in beagles are glaucoma and corneal dystrophy. "Cherry eye", a prolapse of the gland of the third eyelid,
      and distichiasis, a condition in which eyelashes grow into the eye causing irritation, sometimes exist; both these conditions
      can be corrected with surgery. They can suffer from several types of retinal atrophy. Failure of the nasolacrimal drainage
      system can cause dry eye or leakage of tears onto the face. The cause of primary open angle glaucoma in the Beagle is
      an autosomal recessive mutation in the ADAMTS10 gene.  As field dogs they are prone to minor injuries such as cuts and
      sprains, and, if inactive, obesity is a common problem as they will eat whenever food is available and rely on their
      owners to regulate their weight. When working or running free they are also likely to pick up parasites such as fleas,
      ticks, harvest mites, and tapeworms, and irritants such as grass seeds can become trapped in their eyes, soft ears,
      or paws. Beagles may exhibit a behaviour known as reverse sneezing, in which they sound as if they are choking or gasping
      for breath, but are actually drawing air in through the mouth and nose. The exact cause of this behaviour is not known,
      but it can be a common occurrence and is not harmful to the dog. Canine juvenile polyarteritis syndrome, also known
      as juvenile polyarteritis syndrome of beagle dogs is a multisystemic necrotising vasculitis of the small arteries. The
      condition is characterised by a reoccurrent acute fever and cervicalgia over a period of 3-7 days. The Beagle is predisposed
      with most reports concerning the breed — whence the name ''Beagle pain syndrome''.'
    - 'Labrador Retrievers have a predisposition to chronic hepatitis. One UK study found a 4.14 odds ratio. Some studies
      report a predisposition for Labrador Retriever bitches. The reason for the predisposition is unknown. Ideas proposed
      include it being hereditary or environmental. The Labrador Retriever also shows a predisposition to other hepatobiliary
      diseases, including: reactive hepatitis, nodular hyperplasia, and gall bladder disease. A UK study found the breed''s
      average life expectancy to be 13.1 years. A joint study by the Royal Veterinary College study and the University of
      Sydney concluded that chocolate-coloured Labradors have a shorter average life expectancy than other colours of Labrador
      (by about 10%) and are more likely to suffer some health problems. A 2024 Italian study found a life expectancy of 11
      years for the breed compared to 10 years overall. A 2005 Swedish study of insurance data found that 25% of Labrador
      Retrievers died by the age of 10, less than the overall rate of 35% of dogs dying by the age of 10. Labradors are somewhat
      prone to hip and elbow dysplasia, especially in larger dogs. Eye diseases may include progressive retinal atrophy, cataracts,
      corneal dystrophy and retinal dysplasia. They can suffer from exercise induced collapse, which causes hyperthermia,
      weakness, collapse, and disorientation after short bouts of exercise, or from obesity, which in some cases may be partly
      due to the absence of part or all of the proopiomelanocortin gene. The Labrador Retriever is one of the more commonly
      affected breeds for progressive rod-cone degeneration. An autosomal recessive mutation in the PRCD gene is responsible
      for the condition in the breed.'
  - source_sentence: What is the temperament of the Belgian Malinois?
    sentences:
    - 'Although they are considered to be working dogs, Dobermanns are often stereotyped as being ferocious and aggressive.  There
      is some evidence that Doberman Pinschers in North America have a calmer and more even temperament than their European
      counterparts because of the breeding strategies employed by American breeders. Despite this, the American breed standard
      states that, for purposes of determining of conformation fault, aggression and belligerence by a Doberman toward other
      dogs is not counted as viciousness. There is a great deal of scientific evidence that Doberman Pinschers have a number
      of stable psychological traits, such as certain personality factors and intelligence. As early as 1965, studies have
      shown that there are several broad behavioral traits that significantly predict behavior and are genetically determined.
      Subsequently, there have been numerous scientific attempts to quantify canine personality or temperament by using statistical
      techniques for assessing personality traits in humans. These studies often vary in terms of the personality factors
      they focus on and in terms of ranking breeds differently along these dimensions. One such study found that Doberman
      Pinschers, compared to other breeds, rank high in playfulness, average in curiosity/fearlessness, low on aggressiveness,
      and low on sociability. Another such study ranked Doberman Pinschers low on reactivity/surgence and high on aggression/disagreeableness
      and openness/trainability. In addition to the studies of canine personality, there has been some research to determine
      whether there are breed differences in aggression. In a study published in 2008, aggression was divided into four categories:
      aggression directed at strangers, owner, strange dogs, and rivalry with other household dogs. This study found that
      the Doberman Pinscher ranked relatively high on stranger-directed aggression, but extremely low on owner-directed aggression.
      The Doberman Pinscher ranked as average on dog-directed aggression and dog rivalry. Looking only at bites and attempted
      bites, Doberman Pinschers rank as far less aggressive towards humans and show less aggression than many breeds without
      a reputation (e.g., Cocker Spaniel, Dalmatian, and Great Dane). This study concluded that aggression has a genetic basis,
      that the Dobermann shows a distinctive pattern of aggression depending on the situation and that contemporary Doberman
      Pinschers are not an aggressive breed overall. According to the Centers for Disease Control and Prevention (CDC), between
      1979 and 1998, the Doberman Pinscher was less frequently involved in attacks on humans resulting in fatalities than
      several other dog breeds such as Pit bulls, German Shepherd Dogs, Rottweilers, Husky-type dogs, wolf-dog hybrids and
      Alaskan Malamutes. According to this CDC study, one of the most important factors contributing to dog bites is the level
      of responsibility exercised by dog owners.'
    - Belgian Shepherds are known to be highly intelligent, alert and sensitive; they are typically highly trainable, vigilant
      and hard-working with a strong guarding instinct making them protective of property and family, and very well suited
      for service with security services. The Groenendael and Tervueren varieties have a reputation for occasionally being
      snappy, making them less suitable as companion dogs for children; the Laekenois, whilst considered very good with children,
      can occasionally be troublesome with other dogs. The Belgian Shepherd responds well to training, and requires training
      ideally from an early age. The breed is very active – particularly the Malinois, which may reflect its continued breeding
      for security roles. While Belgian Shepherds of all coat types require ample exercise, the breed adapts well to living
      indoors.
    - Indian Spitzes are small dogs - around 33 cm (13 in) at the withers - with a soft chest, fair tail, and a milky white
      double coat. Their eyes have visible irises that can be green or blue, giving them an unusually expressive face. The
      original Spitz was bred for hunting in cold conditions, and their white coloring reflects this. Although the same conditions
      are not found in India, their coloring is attractive and has remained through the years. Some can be white and brown.  Pointy
      fox-like ears make this breed especially expressive. Thick fur covers the outside of the ears and much of the inside
      as well, requiring extra attention when it comes to care and grooming. The tail of an Indian Spitz curls over their
      back and is quite fluffy. Their legs are only slightly longer than their bodies, which makes their heads look large.
      Indian Spitzes may be one of the easiest dogs to live with, making them one of the most popular family dog among Indian
      breeds. They are easily housebroken and trained. Grooming and exercise are relatively low maintenance, and they are
      highly adaptable dogs. They are equally comfortable in small apartments and in large, open houses. However, they do
      need moderate exercise.
    - The Kanni is usually shy, but will always defend its home or master if the need arises. The Kanni dogs are extremely
      faithful and easy to train, but they will think independently when on a hunt. They are very loyal to their family.
    - The Alaskan Malamute () is a large breed of dog that was originally bred for its strength and endurance to haul heavy
      freight as a sled dog. It is similar to other arctic breeds such as the husky, the spitz, the Greenland Dog, Canadian
      Eskimo Dog, the Siberian Husky, and the Samoyed.
    - 'It is a small dog: according to the international breed standard, height at the withers for both dogs and bitches varies
      from 30 to 35 cm, with body weights in the range 4 to 8 kg; weights most commonly fall in the range 4.5 to 7 kg. When
      seen from the side, the outline of the body is roughly square – the length of the body is close to – or equal to – the
      height at the withers. They have a double coat, with wiry exterior fur and a soft undercoat. In show trim, the coat
      is kept short on the body, but the fur on the ears, legs, belly, and face is retained. Recognized coat colors are black,
      pepper and salt, black and silver, and pure white; pepper and salt coloration is where coat hairs have banded shades
      of black, gray and silver, fading to a gray or silver at the eyebrows, whiskers, underbody and legs. Schnauzers are
      characterized by a rectangular head with bushy beard, mustache, and eyebrows; teeth that meet in a "scissor bite"; oval
      and dark colored eyes; and v-shaped, natural forward-folding ears (when cropped, the ears point straight upward and
      come to a sharp point). Their tails are naturally thin and short, and may be docked (where permitted). They will also
      have very straight, rigid front legs, and feet that are short and round (so-called "cat feet") with thick, black pads.'
