- source_sentence: What is the history of the Akita (dog) breed?
  sentences:
  - The Miniature American Shepherd, frequently abbreviated MAS, is a small herding dog breed. The MAS is highly intelligent
    and biddable. The breed is often trained for dog sports such as herding, agility, obedience, canine freestyle, flyball,
    and others. The Miniature American Shepherd was recognised by the American Kennel Club (AKC) in 2015 and is the club's
    186th breed. In September 2019, the Fédération Cynologique Internationale (FCI) officially accepted the breed.
  - The Golden Retriever is a Scottish breed of retriever dog of medium-large size. It is characterised by a gentle and affectionate
    nature and a striking golden coat. It is a working dog, and registration is subject to successful completion of a working
    trial. It is commonly kept as a companion dog and is among the most frequently registered breeds in several Western countries;
    some may compete in dog shows or obedience trials, or work as guide dogs. The Golden Retriever was bred by Sir Dudley
    Marjoribanks at his Scottish estate Guisachan in the late nineteenth century. He cross-bred Flat-coated Retrievers with
    Tweed Water Spaniels, with some further infusions of Red Setter, Labrador Retriever and Bloodhound. It was recognised
    by the Kennel Club in 1913, and during the interwar period spread to many parts of the world.
  - The Siberian Husky is a breed of medium-sized working sled dog. The breed belongs to the Spitz genetic family. It is recognizable
    by its thickly furred double coat, erect triangular ears, and distinctive markings, and is smaller than the similar-looking
    Alaskan Malamute. Siberian Huskies originated in the Russian Far East, where the breed was first developed by the Chukchi
    people for sled pulling and companionship. Other indigenous Siberian peoples in North Asia, such as the Koryak, Yukaghir,
    and Kamchadal, also breed them. It is an active, energetic, resilient breed, whose ancestors lived in the extremely cold
    and harsh environment of the Siberian Arctic. William Goosak, a Russian fur trader, introduced them to Nome, Alaska, during
    the Nome Gold Rush, initially as sled dogs to work the mining fields and for expeditions through otherwise impassable
    terrain. Today, the Siberian Husky is typically kept as a house pet, though they are still frequently used as sled dogs
    by competitive and recreational mushers.
  - 'The American Kennel Club (AKC) breed standard describes a natural range of size, with a desired size of 23 inches (58
    cm) tall and 75 pounds (34 kg) for females, 25 inches (64 cm) tall and 85 pounds (39 kg) for males. Heavier individuals
    (90 lb (41 kg)) and dogs smaller than 75 pounds (34 kg) are commonly seen. There is often a marked size difference between
    males and females. Weights upwards of 100 pounds (45 kg) are also seen. The Alaskan Malamute is double coated. The undercoat
    has an oily and woolly texture and can be as thick as two inches. The outer guard coat is coarse and stands off the body
    longer at the withers but not more than one inch off the sides of the body. Ears are small in proportion to the head and
    stand firmly erect when at attention. The Alaskan Malamute is a heavy dog, with a more formidable nature and structure
    than the Siberian Husky, which is bred for speed. The Alaskan Malamute is bred for power and endurance, which is its original
    function and what the standard of the breed requires of Alaskan Malamute breeders. The usual colors are various shades
    of grey and white, sable and white, black and white, seal and white, red and white, or solid white. There are a wide range
    of markings in the breed including face markings, blazes, a splash at the nape of the neck, and a collar or half collar.
    White is often the predominant color on the body, parts of the legs, feet, and part of the markings of the face. In terms
    of color variants, some Malamutes exhibit a dark grey to buff-colored undertone around their trimmings and white areas,
    presenting with a color-linked gene known as agouti. Two agouti alleles, with the possibility of a third, appear to be
    found in Malamutes: aw (agouti pattern or wolf/wild pattern), at (tan point pattern or black pattern), and awat (heterozygous
    agouti or dark agouti). The eyes of the Alaskan Malamute are almond shaped and varied shades of brown; however, the darker
    eye is preferred. Purebred Alaskan Malamutes will not have blue eyes. The physical build of the Malamute is compact and
    strong with substance, bone and snowshoe feet. According to the AKC breed standard, the Malamute''s tail is well furred
    and is carried over the back like a waving plume. Corkscrew tails (commonly seen in the Akita) are occasionally seen but
    are faulted in the AKC breed standard. The Malamutes'' well-furred tails aid in keeping them warm when they curl up in
    the snow. They are often seen wrapping the tail around their nose and face, which presumably protects them against such
    harsh weather elements as blowing snow. Their ears are generally upright, wedge shaped, small in proportion to the head,
    and set to the side of the skull. The muzzle is deep and broad, tapering slightly from the skull to the nose. Nose and
    gums are black, but some Malamutes have a snow nose, which is black with a pink undertone that can get darker or lighter,
    depending on the season.'
  - The Boston Terrier is a breed of dog originating in the United States of America. It was accepted in 1893 by the American
    Kennel Club as a non-sporting breed. The dogs are small and compact, with a short tail and erect ears. The Boston Terrier
    ranked as the 23rd-most registered breed with the American Kennel Club in 2024.
  - The Japanese Akita and American Akita began to diverge in type post-World War II due to America and Europe preserving
    the Akitas that fell out of favour in Japan, particularly the Dewa-types and dogs with the signature black mask or pinto
    marking. American Akitas are typically considered mixed by Japanese breeders (and not true Akitas by the Japanese standard).
    However, their phenotype predates the Japanese Akita by a few decades, and they are closer to pre-war Akitas like Hachiko.
    Helen Keller is credited with bringing the Akita to America after being given two Akitas by the Japanese government in
    1938. By 1939, a breed standard was established, and dog shows began to be held, but this development was interrupted
    by World War II. During this time, US servicemen serving as part of the occupation force in Japan first came into contact
    with the Akita. The breed so impressed them that many service members chose to bring an Akita back home with them upon
    completion of their tour. Although both types derive from common ancestry, marked differences are seen between the two.
    American Akitas generally are heavier boned and larger, with a more bear-like head, whereas Japanese Akitas tend to be
    lighter and more finely featured with a fox-like head. Additionally, while American Akitas are acceptable in all colors,
    Japanese Akitas are only permitted to be red, white, or brindle. Additionally, American Akitas may be pinto and/or have
    black masks, unlike Japanese Akitas, where these are considered disqualifications and are not permitted in the breed standards.
    Recognized by the American Kennel Club in 1955, the Akita was placed in the Miscellaneous class. The AKC did not approve
    the Akita standard until 1972, and it was moved to the Working Dog class. As such, the Akita is a rather new breed in
    the United States. Foundation stock in America continued to be imported from Japan until 1974, when the AKC cut off registration
    to any further Japanese imports until 1992, when it recognized the Japan Kennel Club standards. This decision set the
    stage for the divergence in type between the American Akita and Japanese Akita Inu that is present today. Elsewhere in
    the world, one American Akita was first introduced to the UK in 1937. He was a Canadian import, owned by a Mrs. Jenson;
    the descendants of Mrs. Jenson live on today breeding American Akitas. The most widely known of these is Joseph Felton,
    an award-winning Akita breeder, but the breed was not itself widely known until the early 1980s. The breed was introduced
    in Australia in 1982 with an American import and to New Zealand in 1986 with an import from the UK.
- source_sentence: What is the history of the Golden Retriever breed?
  sentences:
  - The Australian Shepherd descends in part from pastoral dogs brought to herd Spanish flocks in North America as early as
    the 1500s. There is some speculation that these dogs included the Carea Leonés, a mountain sheepdog that can display the
    eye color and merle coat found in many contemporary Australian Shepherds. It is sometimes claimed that the Basque Shepherd
    Dog and the Pyrenean Sheepdog were also among the ancestors of the breed. The breed as it is known today developed in
    California in the 19th century, as a sheep herding dog for Californian shepherds. The Australian Shepherd is also believed
    to be descended from a variety of herding dogs imported to California with imported sheep, including collies from Australia
    and New Zealand. It was from these ancestors that the breed took its name. The Australian Shepherd spread from California
    throughout the Western United States where it became extremely popular with ranchers who valued the breed's sheep working
    qualities, as well as their ability to handle cattle and other livestock. A purely working breed for over a century, the
    Australian Shepherd was virtually unknown outside of the livestock industry until the mid-20th century when the breed
    was popularised by Jay Sisler, a rodeo performer, at rodeos across the western states with his Australian Shepherds performing
    all manner of tricks. A breed club was soon formed to promote the breed, the Australian Shepherd Club of America, and
    kennel club recognition followed in 1979 when the breed was recognised by the United Kennel Club. The breed was subsequently
    recognised by the American Kennel Club in the 1990s and later the Fédération Cynologique Internationale. From the late-20th
    century the Australian Shepherd has increasingly been seen in conformation shows and it has become an extremely popular
    companion dog. In 2024 it was ranked by the American Kennel Club as the 12th most popular breed of dog in the United States.
  - The Labrador breed dates back to at least the 1830s, when St John's water dogs bred by European settlers in Newfoundland
    were first introduced to Britain from ships trading between Canada and Poole in Dorset. These were then bred with British
    hunting dogs to create what became known as the Labrador Retriever. Its early patrons included the Earl of Malmesbury,
    the Duke of Buccleuch, the Earl of Home and Sir John Scott. Early writers have confused the Labrador with the much larger
    Newfoundland and the Lesser Newfoundland, with Charles William George St John even referring to the Lesser Newfoundland
    as the Newfoundland. Colonel Peter Hawker describes the first Labrador as being not larger than an English Pointer, more
    often black than other colours, long in its head and nose with a deep chest, fine legs, and short and smooth coat, and
    did not carry its tail as highly as the Newfoundland. Hawker distinguishes the Newfoundland from both the "proper Labrador"
    and St John's breed of these dogs in the fifth edition of his book Instructions to Young Sportsmen, published in 1846.
    By 1870 the name Labrador Retriever had become common in England. The liver (now usually called chocolate) Labrador emerged
    in the late 1800s, with liver-coloured pups documented at the Buccleuch kennels in 1892; the first yellow Labrador on
    record was born in 1899 (Ben of Hyde, kennels of Major C.J. Radclyffe). The breed was recognised by the Kennel Club in
    1903. The first American Kennel Club (AKC) registration was in 1917.
  - 'Many theories of the origin of the Weimaraner have been advanced, but there are few documented historical facts; silver-grey
    dogs are shown in paintings by Antoon van Dyck in the seventeenth century and by Jean-Baptiste Oudry in the eighteenth.
    The breed is believed to have originated in the area of the city of Weimar (then in Saxe-Weimar-Eisenach, now in the state
    of Thuringia) – the city from which its name derives. It is sometimes claimed that the dogs were kept at the court of
    Karl August, Grand Duke of Saxe-Weimar-Eisenach, in the early nineteenth century. From 1879 the dogs were considered to
    be a blue variant of the German Short-haired Pointer, and were eligible for registration in the stud-book of the Kurzhaar
    Klub. They first appeared at a dog show in 1880, when fourteen examples were presented in Berlin. These were of three
    differing types, from three different kennels: the traditional Thüringer Hund; the Weißenfelser Hund, which was rather
    more elegant; and the Sanderslebener, which was intermediate between the two. The Weimaraner was recognised as a distinct
    breed in 1891. A breed standard was drawn up in 1896, and in 1897 a breed association was established in Erfurt with the
    name Verein zur Reinzucht des silbergrauen Weimaraner-Vorstehhund; this was soon changed to Verein zur Züchtung des Weimaraner
    Vorstehhundes. In the early years of the twentieth century – the time of the Great War – the Weimaraner came close to
    extinction; it was reconstituted from the few surviving examples of the breed. It was definitively accepted by the Fédération
    Cynologique Internationale in 1954. In the fifteen years from 2007 to 2021, the annual number of new registrations in
    Germany averaged about 485, with a low of 390 and a high of 607.'
  - 'The Golden Retriever was developed in Scotland in the nineteenth century by Sir Dudley Marjoribanks (later to become
    Baron Tweedmouth) from Flat-coated Retrievers judiciously crossed with Tweed Water Spaniels and some other British dog
    breeds. Before the 1952 publication of the detailed stud book, meticulously maintained by Marjoribanks, a number of romantic
    tales about the breed''s origins were published. In the 1860s, Marjoribanks set out to create what, to his mind, was the
    ultimate breed of retriever at Guisachan, his Scottish estate. He started by acquiring a yellow-coloured Flat-coated Retriever
    dog named Nous; Nous had been whelped in June 1864 and was the only yellow pup in an otherwise all black-coloured litter.
    Although uncommon, occasionally liver-, brown-, golden- or yellow-coloured purebred Flat-coated Retriever pups are whelped
    to matings of two black parents. It was Nous''s pedigree that gave rise to the romantic tales of the Golden Retriever''s
    heritage. One early account claimed Nous was purchased from a Russian circus trainer in Brighton; another claimed he was
    bought from a cobbler; and yet another claimed he was bought from a gypsy. The stud book states that Nous was a Flat-coated
    Retriever bred by Henry Pelham, 3rd Earl of Chichester on his Stanmer Park estate near Brighton. In 1868, Nous was mated
    to a Tweed Water Spaniel female named Belle, who is recorded in the stud book as being whelped in 1863 and being of "Ladykirk
    breeding". The litter from this mating consisted of four yellow pups: Primrose, Ada, Cowslip, and Crocus. The female selected
    from this litter, Cowslip, was mated to a Tweed Water Spaniel called Tweed with the mating producing a bitch pup called
    Topsy. Cowslip was subsequently mated to a Red Setter called Sampson; that mating produced a dog pup called Jack. Topsy
    was mated with a black Flat-coated Retriever called Sambo and a bitch pup from that litter, Zoe, was mated back to Jack
    and two pups from that mating were retained, a dog called Nous II and a bitch called Gill. Gill was mated to a black Labrador
    Retriever called Tracer, and a bitch pup from that mating, Queenie, was mated back to Nous II; all Golden Retrievers descend
    from this mating. The progeny from these various matings varied in colour from pure black to light cream, but it was the
    golden-coloured ones that were retained and mated to each other, forming the foundation stock of the Golden Retriever
    breed. Marjoribanks is also known to have used a sandy-coloured Bloodhound and another Labrador in subsequent years of
    the breeding programme.  In 1952, Marjoribanks''s great-nephew, Giles Fox-Strangways, 6th Earl of Ilchester, teamed up
    with Elma Stonex, and together they studied Marjoribanks''s stud book. In 1960, their research was published, presenting
    all of the evidence required to counter all tales of Russian ancestry. The stud book, which covers the period from 1868
    to 1890, is preserved in the library of the Kennel Club in London. In the early days, Golden Retrievers were called the
    "Flat-coated Retriever, Golden". Initially, the Golden Retriever was considered a colour variety of the former breed.
    In 1903, the Kennel Club recorded the first examples, listing them in the same register as Flat-coats. In 1904 a Golden
    Retriever won a field trial and in 1908 the first examples were exhibited at conformation shows. In 1911, a breed club
    for the breed in England, the Golden Retriever Club, was formed, and the breed was given a new name, the "Yellow or Golden
    Retriever". From this point, they were increasingly seen as a separate breed from the Flat-coated Retriever. It was not
    until 1913 that the Kennel Club began recording them on a separate breed register from the Flat-coated Retriever, and
    in 1920, the "Yellow or" was dropped from the breed name, and they were officially called the "Golden Retriever". One
    early twentieth-century enthusiast of the breed, Winifred Charlesworth, was instrumental in establishing the breed club
    and in securing its separate Kennel Club recognition. It was she who drew up the first breed standard, which was adopted
    by the Kennel Club and, with only minor amendments, remains essentially unchanged. She bred and exhibited the first Golden
    Retriever Show Champion, was a strong advocate for maintaining the working instincts of the breed, and is credited with
    popularising it at field trials and introducing it to shooting sportsmen. In the years after the First World War, its
    popularity increased markedly, and in the 1920s and 1930s it spread through much of the Western world. The Canadian Kennel
    Club recognised the breed in 1927, and the American Kennel Club in 1932. The first examples were registered in France
    in 1934 and in Australia in 1937. The worldwide popularity of the breed meant it did not suffer the misfortunes many British
    dog breeds did during the Second World War due to British wartime restrictions on the breeding of larger dogs, with ample
    quality breeding stock available globally to ensure none of its characteristics were lost. Since the 1940s, its popularity
    has continued to grow, and it has become one of the most recognised and most frequently registered dog breeds in the Western
    world.'
  - The name "Brittany" is taken from the Brittany region in northwestern France where the dog originated. Images of orange
    and white Brittany-like dogs hunting and retrieving game were first seen on tapestries and paintings from the 17th century.
    The first written and verifiable record of Brittanys comes from a hunting description written by Reverend Davies in 1850.
    He described hunting with small "bobtailed" dogs who pointed and were excellent retrievers. It was around the same time
    that the modern Brittany is rumored to have been bred by mating with English Setters. The Brittany was first recognized
    as a breed in 1907 when an orange and white male named Boy was registered in France. As a result, the first standards
    were outlined in the same year. America recognized the Brittany in 1931 and the breed was approved by the American Kennel
    Club in 1934. In 1982 the "Spaniel" was officially dropped from the name.
  - The Weimaraner is a German breed of hunting dog of medium to large size, with history going back at least to the nineteenth
    century. It originated in the area of the city of Weimar (then in Saxe-Weimar-Eisenach, now in the state of Thuringia),
    for which it is named. It was recognised as a breed in 1891. It is an all-purpose gun dog, characterised by its speed
    and stamina, its good nose and eye, and its courage and intelligence; in Germany it is not considered suitable for keeping
    as a companion dog.
- source_sentence: Where did the Akita (dog) originate?
