  - The origin of the Bakharwal Dog lies in Ladakh, northern India, and found in the states of Jammu and Kashmir and Himachal
    Pradesh.  The Bakharwal Dog may be descended from crossbreeding the Tibetan Mastiff with the Indian pariah dog, though
    other scholars state that the Bakharwal Dog is the "oldest Indian Dog which since centuries has been surviving with the
    Kashmiri nomads." The Bakharwal Dog has been targeted by separatist militants in the erstwhile Indian state of Jammu and
    Kashmir, who shot the dogs to prevent them from alerting people of their intrusion.  These separatist militants prevented
    herdsmen from going to higher reaches, which caused many Bakharwal Dogs to catch disease and die.
