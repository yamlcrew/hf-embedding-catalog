- source_sentence: Which are the novel languages on which SRE placed emphasis on?
  sentences:
  - 'VAE-LSTM-base: A variational autoencoder model which uses LSTM for both encoder and decoder. KL annealing is used to
    tackled the latent variable collapse issue BIBREF0;'
  - 'We consider two different models for each language pair: the Baseline and the Document model. We evaluate them on 3 test
    sets and report BLEU and TER scores. All experiments are run 8 times with different seeds, we report averaged results
    and p-values for each experiment.'
  - The fixed training condition is used to build our speaker recognition system. Only conversational telephone speech data
    from datasets released through the linguistic data consortium (LDC) have been used, including NIST SRE 2004-2010 and the
    Switchboard corpora (Switchboard Cellular Parts I and II, Switchboard2 Phase I,II and III) for different steps of system
    training. A more detailed description of the data used in the system training is presented in Table TABREF1 . We have
    also included the unlabelled set of 2472 telephone calls from both minor (Cebuano and Mandarin) and major (Tagalog and
    Cantonese) languages provided by NIST in the system training. We will indicate when and how we used this set in the training
    in the following sections.
- source_sentence: What baseline function is used in REINFORCE algorithm?
  sentences:
  - The precision when labeling the first x ranked tweets as attack tweet is shown in the figure FIGREF39. The x-axis is the
    number of ranked tweets treated as attack tweets. And the y-axis is the corresponding precision. The straight line in
    figures FIGREF39, FIGREF43 and FIGREF51 is the result of a supervised LDA algorithm which is used as a baseline. Supervised
    LDA achieved 96.44 percent precision with 10 fold cross validation.
  - 'Following BIBREF21, we sample $K$ captions for each image when applying REINFORCE: ${\hat{c}}_1 \ldots {\hat{c}}_K$,
    ${\hat{c}}_k \sim p_{\theta }(c|I)$,'
  - The approach looked promising given that the dataset was merely 3189 sentences divided into three categories and thus
    we replicated the experiment but failed to replicate the results. The results were poor than what the original authors
    achieved. But, most of the model hyper-parameter choices where inspired from this work.
- source_sentence: Where does proposed metric differ from juman judgement?
  sentences:
  - . [RGB]230, 230, 230Which [RGB]230, 230, 230previous [RGB]230, 230, 230Virginia [RGB]230, 230, 230Governor(s) [RGB]230,
    230, 230do [RGB]230, 230, 230you [RGB]230, 230, 230most [RGB]230, 230, 230admire [RGB]230, 230, 230and [RGB]230, 230,
    230why [RGB]12, 12, 12? $\xrightarrow[\text{pred:solutionhood}]{\text{gold:solutionhood}}$ [RGB]230, 230, 230Thomas [RGB]230,
    230, 230Jefferson [RGB]183, 183, 183.
  - 'We established strong baselines for two story narrative understanding datasets: CaTeRS and RED. We have shown that neural
    network-based models can outperform feature-based models with wide margins, and we conducted an ablation study to show
    that contextualized representation learning can boost performance of NN models. Further research can focus on more systematic
    study or build stronger NN models over the same datasets used in this work. Exploring possibilities to directly apply
    temporal relation extraction to enhance performance of story generation systems is another promising research direction.'
  - In this subsection we discuss the experiment on the attack tweets found in the whole dataset. As stated in section 3.3,
    the whole dataset was divided into two parts. $D_a$ contained all of the tweets collected on the attack day of the five
    attacks mentioned in section 4.2. And $D_b$ contained all of the tweets collected before the five attacks. There are 1180
    tweets in $D_a$ and 7979 tweets in $D_b$. The tweets on the attack days ($D_a$) are manually annotated and only 50 percent
    of those tweets are actually about a DDoS attack.
- source_sentence: What dictionaries are used for automatic extraction of PIEs?
  sentences:
  - the Sporleder corpus BIBREF10;
  - For this experiment we trained UG-WGAN on the English and Russian language following the procedure described in Section
    "UG-WGAN" . We kept the hyper-parameters equivalent to the Sentiment Analysis experiment. All of the NLI model tested
    were run over the fixed UG embeddings. We trained two different models from literature, Densely-Connected Recurrent and
    Co-Attentive Network by BIBREF30 and Multiway Attention Network by BIBREF31 . Please refer to this papers for further
    implementation details.
  - 'Stanford - Twitter Sentiment Corpus (STS Corpus): STS Corpus contains 1,600K training tweets collected by a crawler from
    BIBREF0 . BIBREF0 constructed a test set manually with 177 negative and 182 positive tweets. The Stanford test set is
    small. However, it has been widely used in different evaluation tasks BIBREF0 BIBREF5 BIBREF13 .'
- source_sentence: What are their proposed features?
  sentences:
  - 'Bosch 2006 (mv): This baseline is similar to one in BIBREF33 . The authors propose the use of pLSA to extract the latent
    topics, and the use of k-nearest neighbor (kNN) classifier using the documents'' topics distributions. For this baseline,
    unsupervised LDA is used instead of pLSA, and the labels from the different annotators for kNN (with INLINEFORM0 ) are
    aggregated using majority voting (mv).'
  - '[itemsep=0pt,leftmargin=*,topsep=0pt]'
  - The approach looked promising given that the dataset was merely 3189 sentences divided into three categories and thus
    we replicated the experiment but failed to replicate the results. The results were poor than what the original authors
    achieved. But, most of the model hyper-parameter choices where inspired from this work.
