- source_sentence: 'Rivers Govnorship Election: Sojas and jaguda pipo cause katakata on voting day'
  sentences:
  - 'Awọn igi to da wo labẹ afara naa


    Ọkọ̀ akérò kan tí igi náà wó lù mọ́lẹ̀ ló rún jégé-jégé.


    Ìjàmbá kò nílé, àfi kí Ọba òkè máa kó wa yọ


    Èrò kò gbẹsẹ̀ ní ibití ìsẹ̀lẹ̀ náà ti wáyé.


    Ń se ni ọ̀pọ̀ èèyàn ń bèèrè pé sé kò yẹ ká leè máa dènà irúfẹ́ ìjàmbá bíi èyí?


    Kò sí ibi tó kù mọ́ lára ọ̀kọ̀ tí igi wó lù yìí


    Àwọn agbófinró ti ta okùn dí agbègbè ibití ìsẹ̀lẹ̀ náà ti wáyé


    Àlààfíà ti ń padà sí àdúgbò Ojúẹlẹ́gba, tí àwọn òsìsẹ́ ìjọba sì ti ń tún àyíká ibití ìsẹ̀ll náà ti wáyé se


    Àwọn òsìsẹ́ tó ń gbá ilẹ̀ kò jáfara láti se ìtọ̀jú àyíká náà


    Kátà-kárà ti bẹ̀rẹ̀ padà ní agbègbè tí ìjàmbá náà ti wáyé.


    Ohun gbogbo ti padà bọ̀ sípò ní Ojuẹlẹgba ni ilu Eko


    Gbàgede òkè àti ìsàlẹ̀ ibití ìsẹ̀lẹ̀ ìjàmbá náà ti wáyé


    Isẹ́ ńla ló wà níwájú àwọn òsílẹ̀ tó ń gbálẹ̀ ní Ojúẹlẹ́gba


    Àwòrán ọ̀kọ̀ tó ní ìjàmbá gbẹnu tán ní Ojúẹlẹ́gba.


    Àwọn èrò ya ẹnu lórí ìsẹ̀lẹ̀ náà, wọn kò leè pádé mọ́


    Haa, irú kín ni èyí ni ọ̀pọ̀ èèyàn n sọ lórí ìsẹ̀lẹ̀ náà.


    Àwọn èèyàn tó ń ya ẹnu, lórí ìsẹ̀ll náà


    Ìsẹ̀lẹ̀ ìjàmbá tó mú ẹ̀mí èèyàn mẹ́ta lọ nigba ti igi nla rebọ lati ori ọkọ agbegi to n sọkalẹ lori afara Ojuẹlẹgba ni
    ilu Eko gba ẹ̀nu tán.


    Bí èèyàn bá jẹ orí ahun. yóò kẹ́dùn ní Ojúẹlẹ́gba'
  - "Di jaguda last sotay on Monday afta election for some parts of di state pipo gats do hands up to go work\n\nAccording\
    \ to di statement wey di oga for Information and Voter Education Committee Festus Okoye sign, im say dem establish say\
    \ di elections take place for most polling units for di State and dem announce results.\n\nOkoye say di results of 17\
    \ out of 23 local goment dey di hand of di Commission and dem don already do declaration and return for 21 out of di 32\
    \ State constituencies before di suspension happen.\n\nDi report also find out say some sojas and jaguda pipo invade some\
    \ collation centres come intimidate and arrest some election officials and scatter di collation process.\n\nDem dey do\
    \ strict screening of pipo wey dey enta di building wey include tori pipo and INEC Staff and Adhoc Staff\n\nINEC for di\
    \ statement say dem no like wetin some sojas and jaguda pipo do to spoil di election process and di will of pipo, come\
    \ add say dem dey committed to complete di collation process wia dem don already announce results\n\nINEC say dem go engage\
    \ security agencies for national level and di Inter-Agency Consultative Committee for State level to demand neutral and\
    \ professional security pipo to make peaceful environment so dem fit complete di elections.\n\n INEC  go release di detail\
    \ on how dem go take complete di election for Rivers State by March 20."
  - 'New camera dey detect light sources inside di body; na through dis wey e dey take work.


    Di work of di camera na to help doctors with di equipment wey dem need to check wetin dey happen inside body.


    Before now na expensive scanning and x-ray machines dem dey use check how far.


    Professor Key Dhaliwal for University of Edinburgh say im hope be say dem go fit use di camera do plenty other things,
    for future.


    Doctors design dis camera special, to help check patients as dem dey sickbed


    Challenge wey dey di matter


    From di first tests wey dem do, normally, di device fit track light from one point inside body reach up to 20cm of tissue.


    Light beam fit pass through body but instead make e travel straight to di organ wey dey wan check, di light go scatter.


    Dis na big palava, wey no dey allow di photo wey di camera take dey clear; but di experts dem say dem go continue to work
    on dis camera.'
- source_sentence: ọdun wo ni ile ise Instagram bẹẹrẹ iṣe?
  sentences:
  - 'Gomina ipinlẹ Ondo, Rotimi Akeredolu lo fọrọ yii lede lati ẹnu oludamọran rẹ lori ọrọ aabo, Alhaji Jimoh Dojumo.


    Gomina Akeredolu ṣalaye pe gbogbo eto lo ti to bayii lati gbe fọọmu naa sita.


    ''''Awọn ọba alaye atawọn olori awujọ ni yoo ṣe oniduro fawọn eeyan wọn to ba fẹ darapọ mọ ẹṣọ alaabo Amọtẹkun,'''' Akeredolu
    lo ṣalaye bẹẹ.


    Laipẹ yi ni awọn gomina guusu iwọ oorun ṣepade pẹlu igbakeji aarẹ, Yemi Oṣibajo ati agbẹjọro agba ni Naijiria, Abubakar
    Malami lati sọ asọyepọ lori eto naa.


    Malami ti kọkọ sọ pe, eto Amọtẹkun tawọn gomina ipinlẹ Yoruba gbe kale ko si ninu iwe ofin Naijiria.


    Ọpọ awọn ilumọọka agbẹjọro atawọn ajafẹtọ omoniyan lo ti ṣatilẹyin fun eto Amọtẹkun lẹyin ti tako agbekalẹ eto naa.


    Ọjọ kẹsan an oṣu kinni lawọn gomina ilẹ Yoruba ṣe agbekalẹ Amọtẹkun ni olu ilu ipinlẹ Oyo, Ibadan.'
