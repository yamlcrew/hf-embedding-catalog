    \ ileeṣe iwakusa orilẹede Naijiria, o si tun rii daju pe ẹka naa rọrun lati wọ fun awọn aladaani.\n\nMinisita Eto Ẹkọláàrin\
    \ ọdun 2006 si 2007\n\nIpo minista ohun alumọni inu ilẹ, ni ọmọwe Ezekwesili wa, ti aarẹ nigba naa, Oloye Obasanjo tun\
    \ ti sọ ọ di minista eto ẹkọ labẹ iṣakoso rẹ̀. \n\nGẹgẹ bi minisita eto ẹkọ, Ezekwesili ṣe atunto ẹka etò ẹkọ orilẹede\
    \ Naijiria. Oun lo tun ṣe agbatẹru ibaṣepọ laarin ijọba ati aladaani fun eto ẹkọ to yanranti.\n\nEzekwesili ti fi ìgbà\
    \ kan jẹ́ igbakeji ààrẹ Banki Agbaye éka ilẹ̀ Afrika\n\nIgbakeji-aarẹ Banki Agbaye laarin 2007 si 2012\n\nNi ọdun 2007\
    \ ni arabinrin Ezekwesili di igbakeji aarẹ Banki agbaye, ni kete to fi ipo minisita eto ẹkọ silẹ ni Naijiria, ipo to dimu\
    \ di ọdun 2012.\n\nGẹgẹ bi igbakeji-aarẹ Banki agbaye ẹka ilẹ Adulawọ yii, oun lo jẹ alamojuto gbogbo ohun to n lọ kaakiri\
