  - "Yadda manoma suka koma ƴan gudun hijira a Zamfara\n\nLatsa hoton sama domin sauraren rahoton Awwal Janyau\n\nNoma kamar\
    \ wajibi ne musamman ga mutanen karkara domin samun abinci da kuma samun kuɗaɗen shiga. \n\nAmma yanzu harkar noma ta\
    \ shiga wani mawuyacin hali sakamakon hare-haren yan bindiga baya ga ƙalubale da annobar korona ta haddasa.\n\nHare-haren\
    \ yan bindiga da masu fashin daji a ƙauyukan jihohin arewa maso yammacin Najeriya musamman Zamfara da Katsina da yankin\
    \ Birnin Gwari a Kaduna ya tilastawa ɗaruruwan manoman kauracewa gonakinsu.\n\nManoman sun warwatsu zuwa wasu manyan birane\
    \ domin samun mafaka.\n\nDuk da wasu sun koma kauyukansu saboda sulhun da gwamnati ta ce ta yi da yan fashin daji da suka\
    \ addabe su, amma akwai waɗanda suka haƙura da manyan gonakinsu a kauye kuma  suke fargabar komawa gida, matakin da ke\
    \ ƙara haifar da barazanar ƙarancin abinci. \n\nA wani rahoton da ta fitar a makon da ya gabata, hukumar samar da abinci\
    \ ta duniya, WFP ta ce yunwa za ta tsananta tsakanin watan Yuni zuwa Agusta na wannan shekarar 2021. \n\nRahoton WFP ya\
    \ ce fiye da mutum miliyan 31 a yankin yammacin Afirka za su fuskanci barazanar yunwa sakamakon tsadar kayan abinci da\
    \ kuma rikici da matsaloli na tsaro.\n\n\"Lokaci ne da abinci zai yi wahala kafin zuwa lokacin girbi,\" a cewar rahoton.\n\
    \nGa abubuwa uku da suka jefa manoma cikin tsaka mai wuya:\n\nTasirin hare-haren ƴan bindiga\n\nRashin tabbatar da tsaro\
    \ da kwanciyar hankali musamman a jihohin arewa maso yammacin Najeriya ya sa har yanzu manoman da suka yi gudun hijira\
    \ ba su koma ga gonakinsu ba, matakin da ya rage yawan abincin da ake samarwa a Najeriya.\n\nWani manomi Isah Musa da\
    \ ya yi gudun hijira daga ƙauyen Jangeme zuwa garin Gusau a jihar Zamfara ya ce kafin ya yi gudun hijira yana noma sosai\
    \ wanda yake ci da iyalinsa har ya kai kasuwa ya sayar amma yanzu ba ya da halin yin noman. \n\n\"Ɓarayi suka addabe mu\
    \ muka gudu, yanzu ba wani aikin da nake sai lebaranci,\" in ji shi.\n\nSarkin Noman Zamfara Alhaji Hassan Kwazo ya taɓa\
    \ shaida wa BBC a watan Disamban 2020 cewa za a ɗauki shekara 10 kafin noma ya dawo daidai a jihar Zamfara saboda a cewarsa\
    \ noman gaske da aka sani a Zamfara ya gagara saboda hare-haren ƴan bindiga.\n\n\"Ba a yi noman da aka saba ba kusan shekara\
    \ biyar zuwa shida, noma ya ja baya a Zamfara, masu kuɗi waɗanda ke noma buhu 500 zuwa 1,000 gonakin sun gagare su zuwa.\"\
    \n\n\"Kuma kafin noman ya dawo kila za a kai shekara 10 saboda duk manoman da suke noman na gaske sun watse,\"  in ji\
    \ Sarkin Noman Zamfara. \n\nHukumomi da jami'an tsaron sun sha iƙirarin cewa suna kokarin ganin an shawo kan matsalar\
    \ da magance ta baki daya, amma har yanzu ana kai hare-hare da garkuwa da mutane duk da ikirarin gwamnatin Zamfara na\
    \ yin sulhu da ƴan fashin.\n\nManomi idan ya samu wurin shuka da abinda zai shuka babu abin da ya ke buƙata fiye da tsaro\
    \ da kwanciyar hankali.\n\nRashin tsaro da kwanciyar hankali ga manoman wata babbar barazana ce ga wadatar abinci a Najeriya\
    \ da ma yammacin Afrika. \n\nTsadar kayan abinci\n\nYadda kayan abinci ke ƙara tsada, wani babban ƙalubale ne da ya jefa\
    \ manoma cikin tsaka mai wuya. \n\nRashin noman zai ƙara haifar da ƙarancin abinci da kuma tsadarsa, kamar yadda yin noma\
    \ zai bunƙasa abinci da rahusa.\n\nAlkalumman da hukumar ƙididdiga ta Najeriya ta fitar a watan Maris wato NBS sun nuna\
    \ an samu hauhauwar farashin da ya kai kashi 17.33 cikin ɗari a watan Fabrairun da ya wuce.\n\nAlƙaluman sun nuna cewa\
    \ tashin farashin ya ƙaru ne da kashi 1.54 a Fabrairun 2021 idan aka kwatanta da kashi 1.49 a watan Janairu. \n\nKuma\
    \ farashin kayan abinci ya tashi da kashi 21.79 a Fabrairun da ya gabata idan aka kwatanta da kashi 20.57 a watan Janairu.\n\
    \nHukumar ta ce wannan ne karon farko da aka samu irin wannan tashin farashi a cikin shekaru hudu da suka wuce.\n\nRahoton\
    \ WFP ya ce farashin abinci ya lunlunka da sama da kashi 200 a ƙasashen yammacin Afrika, wanda yajefa masu ƙaramin ƙarfi\
    \ cikin mawuyacin hali na samun abin da za su kai baka, sakamakon matakan da annobar korona ta tilasta aka ɗauka na tattalin\
    \ arziki. \n\nRahoton ya ce an samu ƙarin kashi 30 na ƙarancin abinci fiye da bara.\n\nMasana na ganin dalilai da yawa\
    \ ne suka janyo hauhawar farashin kayayyaki a Najeriya kasar da tattalin arzikinta ke dogaro da arzikin fetir.\n\nShuaibu\
    \ Idris Mikati masanin tattalin arziki a Najeriya na ganin ba ya ga faɗuwar darajar naira, barazanar hare-haren ƴan bindiga\
    \ ga manoma ya ƙara haddasa hauhawan farashin kayayyakin masarufi.\n\nMasanin na ganin sai gwamnatoci sun ɗauki matakan\
    \ gaggawa don magance yiwuwar dorewar wannan yanayi na tsadar rayuwa ta hanyar gaggauta tabbatar da tsaro ga manoma. \n\
    \nBarazanar ƙarancin abinci\n\nMatsalar tsaro na daga cikin abubuwan da ake hasashen za su haddasa ƙarancin abinci a arewacin\
    \ Najeriya saboda yadda yan fashin daji da masu garkuwa ke addabar manoma suna hana su nome gonakinsu \n\nAna ganin ƙalunbalen\
    \ tsaro da manoma ke fuskanta zai yi tasiri ga samar da abinci a Najeriya.\n\nBabban jami'in yaɗa labarai na ƙungiyar\
    \ manoma ta ƙasa, Alhaji Muhammad Magaji ya ce tabbas yankin arewa maso yamma na cikin matsala.\n\n\"A yankunan Katsina\
    \ kamar Ɗanmusa da Safana da Bakori da Dutsinma, suna noma abinci kusan kashi 30 zuwa 35 na abin da ake samu a arewa maso\
    \ yamma gaba ɗaya.\" \n\n\"Amma a yanzu noman zai gagara, manoma za su kasa zuwa gona,\" in ji shi.\n\nYa ce hakan ya\
    \ shafi yankunan Kaduna na Igabi da Birnin Gwari da Giwa da Kauru.\n\nWannan matsala suka ce za ta haifar da tsadar kayayyakin\
    \ abinci a yankin arewacin Najeriya saboda rashin abincin.\n\nSarkin Noman Zamfara Alhaji Hassan Ƙwazo ya bai wa gwamnati\
    \ shawara cewa ya kamata ta ɓullo da tsarin tallafa wa matasa na karkara, \"waɗanda ke yin noma amma ake korewa daga gonakinsu\
    \ kuma ake kashewa\".\n\nYa ce manomi ba bashi yake buƙata ba, idan aka ba shi tallafi da tsaro sun ishe shi."
- source_sentence: 'Super Bowl half-time show: How did The Weeknd performance dey totori fans'
  sentences:
  - 'The star perform eight hits plus Starboy and Blinding Lights


    From Beyonce to Phil Collins to the Black Eyed Peas, Usher, di show na big sometin wit crowds.


    But dis year own dey different.


    Thousand of fans wey dem do like cardboard cut-outs watch di show wit social distancing for di Raymond James Stadium wey
    dey for Florida.


    Di city lights, di slot machines, and The Weeknd as e just siddon for im car. Di styel of im entrance be like im hero
    Michael Jackson 1993 halftime-show; and den im start im 2016 hit, "Starboy."


    E pack eight songs for 14 minutes, wit no guests features but e come get big large choir, live guitar band, and some violinists.


    The Weeknd performs


    Apart from some Michael Jackson-inspired dance moves, im just focus on di music before e come grab camera and den e disappear
    for backstage wit plenti lights and mirrors.


    As dnacers wey get bandage for face surround am, im perform Can''t Feel My Face, before e show for di stadium wit firework
    for anoda version of I Feel It Coming.


    How celeb fans react


    O boy, afta di performance na so fans and fellow celebrities full social media wit accolades for di Canadian singer wey
    im real name na Abel Tesfaye.


    Drake tok say di show na "a big moment for di city" for im Instagram story.


    Country star Keith Urban tok say e dey impressed, and actor Timothée Chalamet caption one small video for im Instagram
    story as: "Legend! Legend!"


    The Roots'' Questlove dey part of pipo wey sabi say wetin The Weeknd do na throwback to Michael Jackson Super Bowl performance
    in 1993.


    And plenti reaction to di moment wen di star dey prepare to sing im 2018 hit Can''t Feel My Face, as come pretend to dey
    rush make im dey stage before di track start.


    Na so pipo don turn am to meme.


    Which songs The Weeknd perform?


    Di singer fourth album, After Hours, be di fourth biggest-seller of 2020 for di US'
