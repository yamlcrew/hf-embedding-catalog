    \ kan jẹ igbakeji aarẹ Banki agbaye, ẹka ilẹ adulawọ.  \n\nỌ̀kan lára olùdásílẹ̀ ẹgbẹ́ #BBOG ni Oby Ezekwesili\n\nMinisita\
