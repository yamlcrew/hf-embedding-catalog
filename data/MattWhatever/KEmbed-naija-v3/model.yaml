    - 'Sojojin Najeriya sun dade suna fafatawa da mayakan Boko Haram


      Rahotanni sun ce da yammacin ranar Alhamis ne mazauna birnin suka yi ta jin karar harbe-harben manyan bindigogi.


      Lamarin dai yasa wasu mazauna birnin sun dimauce har ta kaiga wasu mutane tserewa daga gidajensu.


      Sai dai wani jami''i a hukumar agajin gaggawa ta jihar Borno ya shaida wa BBC cewa yanzu haka al''amuran sun koma kamar
      yadda suke bayan an dakile yunkurin harin.


      Wannan ne dai karo na biyu cikin wata guda da mayakan Boko Haram ke yunkurin kutsa wa cikin birnin amma sojoji suna
      fatattakar su.


      Ko a farkon watan Afrilu sai da aka kashe mutum goma sha biyar a wani hari da mayakan Boko Haram suka kai a birnin.'
  - source_sentence: 'Nigeria Elections 2019: Ezekwesili ti jẹ́ mínísítà ní Nàìjíríà lẹ́ẹ̀ mejì ọ̀tọ̀ọ̀tọ̀'
    sentences:
    - 'Ifilọlẹ agbarijọpọ ẹgbẹ awọn ọmọ Naijiria ti waye nilu Abẹokuta


      Igbakeji alakoso eto ile-ìkàwé aare ana, (Olusegun Obasanjo Presidential Library), ọgbẹni Ayọdele Aderinwale sọ fun
      BBC Yoruba wi pe ifilọlẹ ile-isẹ isakoso fun agbarijọpọ ẹgbẹ awọn ọmọ Naijiria (Coalition for Nigeria Movement) ni ile
      isẹ Iwe iroyin nilu Abeokuta.


      Ni ọjọru, gomina tẹlẹ nipinlẹ Ọsun, Ọlagunsoye Oyinlọla se''filọlẹ agbarijọpọ ẹgbẹ awọn ọmọ Naijiria nilu Abuja pẹlu
      awọn eniyan jankan-jankan nibẹ, ti wọn si n pe fun ifọwọsowọpọ agbajọ awọn mọ Naijiria fun idagbasoke ti o peye.


      Bi orilẹede Naijiria se n sun''mọ asiko eto ipolongo idibo fun ọdun, orisirisi awọn ẹgbẹ oselu lo ti n jade lati polongo
      fun awọn eniyan lati kopa ti o peye ninu eto ijọba awarawa lorilẹede. Lara wọn ati awọn ti o n se alamojuto fun eto
      ifilọlọlẹ wọn ni:


      Agbarijọpọ ẹgbẹ awọn ọmọ Naijiria (Coalition for Nigeria Movement)


      Aarẹ Olusegun Ọbasanjọ


      Ọlagunsoye Oyinlọla


      Donald Duke


      Ajọ idasi Isipopada Naijiria(Nigeria Intervention Movement):


      Olisa Agbakoba


      Charles Soludo


      Pat Utomi


      Yatọ sawọn ogulọgọ ọdọ to peju sibi awọn ifilọlẹ ẹgbẹ alajumọse wọnyi, awọn eekan ọmọ orilẹede yi miran ti n pe fun
      sise ifilọlẹ awọn ẹgbẹ oselu miran lati dopin aisedeede awọn ẹgbẹoselu APC ati PDP ti o ti wa ni ipo latẹyinwa.'
    - "Cheta na akụkọ si n'aka ndị uweojii kwuru na opekatampe mmadụ anọ anwụyụọla anya ebe ọtụtụ merụrụ ahụ,\n\nn'ọgụ dapụtara\
      \ n'etiti otu nzuzo abụọ n'ụlọ akwụkwọ 'Federal Polytechnic' Nekede dị n'Imo Steeti.\n\nN'ihi ọgụ na ọgbaghara a, ụmụ\
      \ akwụkwọ na ndị nkụzi ụlọakwụkwọ ahụ nọzi n'egwu na ihe ize ndụ ugbu a.\n\nOtu nwata akwụkwọ bụ Frank hụrụ ka ihe si\
      \ mee gwara BBC Igbo na nkpamkpa ọjọ a malitere n'izuụka gara aga n'etiti otu nzuzo abụọ bụ 'Aye' na 'Bagger'.Frank\
      \ kwuru na o bidoro mgbe ahụtara ozu nwata akwụkwọ a, bụkwa onye na-edozi isi n'ihu ụlọ akwụkwọ ahụ. \n\nNke a kpatara\
      \ ogbugbu e gburu nwata akwụkwọ ọzọ na-agụ ihe ọmụmụ 'Public Administration' n'ogbe ebe akpọrọ South Africa.N'okwu ya\
      \ \"Nke a mere ha jiri bido gbuwe mmadụ aghara aghara. Ka ọ dị ugbu a, eji m n'aka na ihe karịrị mmadụ anọ anwụọla,\
      \ mana ejiri m anya m hụ ozu mmadụ anọ\".\n\nỌnụ na-ekwuru ndị uweojii n'Imo Steeti bụ Orlando Ikeokwu gwara BBC Igbo\
      \ na ọ bụ eziokwu na mmadụ anọ anwụọla.\n\nO kwuru na ndị uweojii ejidela mmadụ iri ma nata ha egbe ruru ise dịka ha\
      \ ka na-eme nyocha iji chọpụta otu nzuzo na-akpa arụ a.\n\nAkụkọ ndị ga-amasị gị:"
    - "Ezekwesili ti fi ìgbà kan jẹ́ igbakeji ààrẹ Banki Agbaye éka ilẹ̀ Afrika\n\nIlumọọka ni Ọmọwe Ezekwesili, ẹni ti o\
      \ ti di oniruuru ipo mu ni Naijiria ati agbaye . \n\nYatọ si pe o jẹ ọkan pataki lara oludasilẹ ẹgbẹ ajafẹtọ ọmọniyan\
      \ #BBOG to n ja fun ominira awọn ọmọbinrin to wa ni ahamọ ikọ Boko Haram, Ezekwesili jẹ ọkan lara awọn ọmọ Naijiria\
      \ to n fi ojoojumọ ke tantan lori eto iṣakoso orilẹede naa.\n\nIpinlẹ Anambra la ti bi Oby, ni ọjọ́ kejidinlọgbọn, osu\
      \ igbe ọdun 1963. O si kẹkọọ gboye gẹgẹ bi akọṣẹmọṣẹ iṣiro owo.\n\nIgba meji ọtoọtọ lo ti ṣe minista ni Naijiria, to\
      \ si tun ti figba kan jẹ igbakeji aarẹ Banki agbaye, ẹka ilẹ adulawọ.  \n\nỌ̀kan lára olùdásílẹ̀ ẹgbẹ́ #BBOG ni Oby\
      \ Ezekwesili\n\nMinisita Ohun Alumọni láàrin ọdun 2005 si 2006\n\nNi ọdun 2005 ni Aarẹ Olusegun Obasanjo yan Ọmoọwe\
      \ Ezekwesili gẹgẹ bi minisita ohun alumọni inu ilẹ, lẹyin to ti jẹ adari ẹka to n ri si amojuto eto isuna , nibi to\
      \ ti gba inagijẹ 'Mama Due Process'.\n\nGẹgẹ bi minisita ohun alumọni, o ṣe agbatẹru abadofin to ni ṣe pẹlu alumọni\
      \ ati iwakusa 'Minerals and Mining Act', idasilẹ ileeṣe iwakusa orilẹede Naijiria, o si tun rii daju pe ẹka naa rọrun\
      \ lati wọ fun awọn aladaani.\n\nMinisita Eto Ẹkọláàrin ọdun 2006 si 2007\n\nIpo minista ohun alumọni inu ilẹ, ni ọmọwe\
      \ Ezekwesili wa, ti aarẹ nigba naa, Oloye Obasanjo tun ti sọ ọ di minista eto ẹkọ labẹ iṣakoso rẹ̀. \n\nGẹgẹ bi minisita\
      \ eto ẹkọ, Ezekwesili ṣe atunto ẹka etò ẹkọ orilẹede Naijiria. Oun lo tun ṣe agbatẹru ibaṣepọ laarin ijọba ati aladaani\
      \ fun eto ẹkọ to yanranti.\n\nEzekwesili ti fi ìgbà kan jẹ́ igbakeji ààrẹ Banki Agbaye éka ilẹ̀ Afrika\n\nIgbakeji-aarẹ\
      \ Banki Agbaye laarin 2007 si 2012\n\nNi ọdun 2007 ni arabinrin Ezekwesili di igbakeji aarẹ Banki agbaye, ni kete to\
      \ fi ipo minisita eto ẹkọ silẹ ni Naijiria, ipo to dimu di ọdun 2012.\n\nGẹgẹ bi igbakeji-aarẹ Banki agbaye ẹka ilẹ\
      \ Adulawọ yii, oun lo jẹ alamojuto gbogbo ohun to n lọ kaakiri awọn orilẹede mejidinlaadọta to wa ni 'Sub Saharan Afirika',\
      \ o si tun jẹ adari owoyaa to le ni ogoji biliọnu dọla. \n\nEzekwesili sọ pé àsìkò ti tó láti gba agbára lọ́wọ́ ẹgbẹ́\
      \ òṣèlú PDP àti APC\n\nAbẹ ẹgbẹ oṣelu ACPN ni o ti n dije sipo aarẹ orilẹede Naijiria\n\nỌmọwe Ezekwesili kede ipinnu\
      \ rẹ lati dupo aarẹ orilẹede Niajiria ninu ọdun 2018 pẹlu alaye pe awọn ẹgbẹ oṣelu mejeeji to ti ṣe ijọba ri jẹ ọbayejẹ,\
      \ ti ko si yẹ ki wọn wa ni ijọba mọ lorilẹede eyi.\n\nỌgbẹni Ganiyu Galadima ni wọn yoo jọ maa dije gẹgẹ bi igbakeji.\
      \ \n\n#BBCNigeria2019"
