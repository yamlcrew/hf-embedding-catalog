    \nEzekwesili sọ pé àsìkò ti tó láti gba agbára lọ́wọ́ ẹgbẹ́ òṣèlú PDP àti APC\n\nAbẹ ẹgbẹ oṣelu ACPN ni o ti n dije sipo\
    \ aarẹ orilẹede Naijiria\n\nỌmọwe Ezekwesili kede ipinnu rẹ lati dupo aarẹ orilẹede Niajiria ninu ọdun 2018 pẹlu alaye\
