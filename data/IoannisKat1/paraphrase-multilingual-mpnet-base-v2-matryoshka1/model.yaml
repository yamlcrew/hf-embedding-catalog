      ή Βεβαίωση Υπηρεσιακής Κατάστασης. Περίπτωση β) ενιαία Ιατρική Γνωμάτευση που να έχει εκδοθεί από Κέντρο Πιστοποίησης
      Αναπηρίας (ΚΕ.Π.Α'
    - American Electrical Power Service Corporation, 1977 - 1984, Senior Engineer, Computer Applications and Operations Research
      Center.
  - source_sentence: Ποιο είναι το κύριο θέμα της παρουσίασης;
    sentences:
    - '. Προβλέψεις και μελλοντικές προοπτικές • Θεωρία Ψηφιακού Ήχου:  Βασικές αρχές ψηφιακών ηχητικών συστημάτων (Δειγματοληψία
      και κβαντισμός ηχητικών σημάτων), Υπερδειγματοληψία, μορφοποίηση θορύβου και διαμόρφωση σήματος σε 1 bit, Αριθμητική
      αναπαράσταση και αποθήκευση ηχητικών δεδομένων, Τεχνολογία μετατροπέων A/D και D/A (χαρακτηριστικά, προδιαγραφές) •
      Κωδικοποίηση και Συμπίεση Ηχητικών'
    - '. Έχει επίσης συνεργαστεί ενεργά με βιομηχανικούς εταίρους: ήταν ο Leader της R&D ομάδας για θέματα Μηχανικής Όρασης
      στην Metargus, μια pre-seeded startup (με έδρα την Πάτρα, Ελλάδα), ενώ συνεργάζεται και με την Ragdoll Dynamics (εταιρεία
      με έδρα το Λονδίνο, Ηνωμένο Βασίλειο)'
    - '. • Μοντέλα Παράλληλου Προγραμματισμού και Συγχρονισμός: Παρουσίαση μοντέλων παράλληλου προγραμματισμού με λεπτομερή
      συγχρονιστικά primitives όπως mutexes, barriers και atomic operations, με έμφαση στην ταυτόχρονης εκτέλεσης και την
      ασφάλεια των threads'
  - source_sentence: Ποιος είναι ο ομότιμος καθηγητής;
    sentences:
    - ., Πραγματικού Χρόνου Γιαλελής (ΕΔΙΠ),  Κουμπιάς (Ομότιμος) ECE_ΓΚ906 Σχεδιασμός Ολοκληρωμένων Συστημάτων 3+2 5 Θεοδωρίδης,  (Δ+Ε)
      Παλιουράς ECE_ΓΚ907 Ηλεκτρονικά Υψηλών Ταχυτήτων 3 5 Μπίρμπας Μ
    - '. Ορίζουσα, αντίστροφος και ιδιότητες. Απαλοιφή Gauss-Jordan. Τάξη μητρώου και υπολογισμός τάξης. Κανονική μορφή. Ομογενή
      και μη-ομογενή συστήματα. Εισαγωγή στους διανυσματικούς χώρους. Γραμμική εξάρτηση διανυσμάτων. Ιδιοτιμές και ιδιοδιανύσματα:
      ορισμοί και ιδιότητες. Ομοιότητα και διαγωνοποίηση. Τετραγωνικές μορφές. Πολυώνυμα μητρώων και το θεώρημα Cayley-Hamilton.
      Μητρώα συναρτήσεις'
    - '. 1978-79: Ωρομίσθιος Καθηγητής των ΚΑΤΕΕ Πατρών. 1982-87: Συνεργασία με διάφορες Βιομηχανίες σε θέματα Βιομηχανικού
      Αυτοματισμού. 1987-1995: Λέκτορας στο Τμήμα Ηλεκ/όγων Μηχ/κών Παν. Πατρών. 1995: Επίκουρος Καθηγητής Πανεπιστημίου Πατρών.
      1998-99: Industrial Control Centre, University of Strathclyde, Γλασκόβη, Αγγλία'
  - source_sentence: Ποιες είναι οι δύο τύποι τροφοδοσίας που αναφέρονται;
    sentences:
    - '. Ελεγκτές μεταβλητών στροφών και σχεδίαση σειριακού ελεγκτή με εσωτερικό βρόχο ρεύματος: ΑΜ διπλής τροφοδοσίας, ΑΜ
      ή ΣΜ με διασύνδεση συνεχούς ρεύματος, Γεννήτρια ΑΜ με ηλεκτρονικά μεταβαλλόμενη αντίσταση ρότορα. Έλεγχος πραγματικής
      και άεργου ισχύος. Έλεγχος βήματος πτερυγίου. Περιβαλλοντικές επιπτώσεις από την εγκατάσταση αιολικών συστημάτων και
      λοιπών ΑΠΕ. Σύνδεση με το δίκτυο'
    - . Τα υποχρεωτικά είναι συγκεκριμένα βασικά μαθήματα της επιστήμης του Ηλεκτρολόγου Μηχανικού και Μηχανικού Υπολογιστών,
      τα οποία πρέπει να παρακολουθήσει και εξεταστεί επιτυχώς κάθε φοιτητής. Τα κατ’ επιλογήν υποχρεωτικά είναι μαθήματα
      εμβάθυνσης σε διάφορους ειδικούς τομείς
    - 'Η σελίδα παρουσιάζει τους Τομείς του Τμήματος Ηλεκτρολόγων Μηχανικών και Τεχνολογίας Υπολογιστών: Τηλεπικοινωνιών και
