widgetData:
- source_sentence: Ποιο συνέδριο και έκθεση αναφέρεται στην εργασία;
  sentences:
  - '. Haas and Prof. K. Burnham, Chapter 5, Taylor & Francis, LLC, IOPs Publications. ISBN0- 7503-0994-6, pp. 173-212. E.I.
    Papageorgiou, C.D.Stylios and P.P. Groumpos (2008) "Fuzzy Cognitive Maps", in book: "Handbook of Granular Computing",
    by editors: Witold Pedrycz, Andrzej Skowron and Vladik Kreinovich, Chapter 34, John Wiley & Sons, Ltd, pp. 755-775. S.Agoti,
    C. Stylios and P.P'
  - 'Βιογραφία: Ο Στυλιανός (Στέλιος) Δ. Ασημώνης είναι Επίκουρος Καθηγητής στο Τμήμα Ηλεκτρολόγων Μηχανικών και Τεχνολογίας
    Υπολογιστών στο Πανεπιστήμιο Πατρών, Ελλάδα. Από το 2019 έως το 2024 κατείχε τη θέση Επίκουρου Καθηγητή στη Σχολή Ηλεκτρονικών,
    Ηλεκτρολόγων Μηχανικών και Επιστήμης Υπολογιστών στο Queen''s University Belfast, Ηνωμένο Βασίλειο. Ο Δρ'
  - . Giannakopoulos, “Application of Computational Intelligence to the Control System of an HVDC Link Based on VSCs”, Conference
    and Exhibition on Power Generation, Transmission, Distribution and Energy Conversion, MED POWER 2004, Lemessos Cyprus,
    MED04/CH24. 8.X. Koutiva, T. Vrionis, N. A. Vovos and G. B
- source_sentence: Ποιους τομείς καλύπτει η εκπαίδευση μηχανικών σύμφωνα με το κείμενο;
  sentences:
  - . Αυτό, εκτός των άλλων, συνέτεινε και στην παροχή υψηλού επιπέδου εκπαίδευσης μηχανικών σε βιομηχανικού ενδιαφέροντος
    θέματα, εφοδιάζοντας τους με προσόντα που εξασφαλίζουν σθεναρό επιστημονικό υπόβαθρο για περαιτέρω ερευνητική και ακαδημαϊκή
    εξέλιξη και ισχυρές προοπτικές απασχόλησης σε σημαντικές βιομηχανικές μονάδες στην Ελλάδα και το εξωτερικό.
  - '. Τα απαραίτητα δικαιολογητικά είναι τα εξής: Περίπτωση α) αντίγραφο Σύμβασης έργου ή εργασίας, είτε Ατομικό Λογαριασμό
    Ασφάλισης συνοδευόμενο από Υπεύθυνη Δήλωση στην οποία να αναφέρει ότι ο φοιτητής/τρια εξακολουθεί να είναι Εργαζόμενος/η,
    ή Βεβαίωση Υπηρεσιακής Κατάστασης. Περίπτωση β) ενιαία Ιατρική Γνωμάτευση που να έχει εκδοθεί από Κέντρο Πιστοποίησης
    Αναπηρίας (ΚΕ.Π.Α'
  - American Electrical Power Service Corporation, 1977 - 1984, Senior Engineer, Computer Applications and Operations Research
    Center.
- source_sentence: Ποιο είναι το κύριο θέμα της παρουσίασης;
  sentences:
  - '. Προβλέψεις και μελλοντικές προοπτικές • Θεωρία Ψηφιακού Ήχου:  Βασικές αρχές ψηφιακών ηχητικών συστημάτων (Δειγματοληψία
    και κβαντισμός ηχητικών σημάτων), Υπερδειγματοληψία, μορφοποίηση θορύβου και διαμόρφωση σήματος σε 1 bit, Αριθμητική αναπαράσταση
    και αποθήκευση ηχητικών δεδομένων, Τεχνολογία μετατροπέων A/D και D/A (χαρακτηριστικά, προδιαγραφές) • Κωδικοποίηση και
    Συμπίεση Ηχητικών'
  - '. Έχει επίσης συνεργαστεί ενεργά με βιομηχανικούς εταίρους: ήταν ο Leader της R&D ομάδας για θέματα Μηχανικής Όρασης
    στην Metargus, μια pre-seeded startup (με έδρα την Πάτρα, Ελλάδα), ενώ συνεργάζεται και με την Ragdoll Dynamics (εταιρεία
    με έδρα το Λονδίνο, Ηνωμένο Βασίλειο)'
  - '. • Μοντέλα Παράλληλου Προγραμματισμού και Συγχρονισμός: Παρουσίαση μοντέλων παράλληλου προγραμματισμού με λεπτομερή
    συγχρονιστικά primitives όπως mutexes, barriers και atomic operations, με έμφαση στην ταυτόχρονης εκτέλεσης και την ασφάλεια
    των threads'
- source_sentence: Ποιος είναι ο ομότιμος καθηγητής;
  sentences:
  - ., Πραγματικού Χρόνου Γιαλελής (ΕΔΙΠ),  Κουμπιάς (Ομότιμος) ECE_ΓΚ906 Σχεδιασμός Ολοκληρωμένων Συστημάτων 3+2 5 Θεοδωρίδης,  (Δ+Ε)
    Παλιουράς ECE_ΓΚ907 Ηλεκτρονικά Υψηλών Ταχυτήτων 3 5 Μπίρμπας Μ
  - '. Ορίζουσα, αντίστροφος και ιδιότητες. Απαλοιφή Gauss-Jordan. Τάξη μητρώου και υπολογισμός τάξης. Κανονική μορφή. Ομογενή
    και μη-ομογενή συστήματα. Εισαγωγή στους διανυσματικούς χώρους. Γραμμική εξάρτηση διανυσμάτων. Ιδιοτιμές και ιδιοδιανύσματα:
    ορισμοί και ιδιότητες. Ομοιότητα και διαγωνοποίηση. Τετραγωνικές μορφές. Πολυώνυμα μητρώων και το θεώρημα Cayley-Hamilton.
    Μητρώα συναρτήσεις'
  - '. 1978-79: Ωρομίσθιος Καθηγητής των ΚΑΤΕΕ Πατρών. 1982-87: Συνεργασία με διάφορες Βιομηχανίες σε θέματα Βιομηχανικού
    Αυτοματισμού. 1987-1995: Λέκτορας στο Τμήμα Ηλεκ/όγων Μηχ/κών Παν. Πατρών. 1995: Επίκουρος Καθηγητής Πανεπιστημίου Πατρών.
    1998-99: Industrial Control Centre, University of Strathclyde, Γλασκόβη, Αγγλία'
- source_sentence: Ποιες είναι οι δύο τύποι τροφοδοσίας που αναφέρονται;
  sentences:
  - '. Ελεγκτές μεταβλητών στροφών και σχεδίαση σειριακού ελεγκτή με εσωτερικό βρόχο ρεύματος: ΑΜ διπλής τροφοδοσίας, ΑΜ ή
    ΣΜ με διασύνδεση συνεχούς ρεύματος, Γεννήτρια ΑΜ με ηλεκτρονικά μεταβαλλόμενη αντίσταση ρότορα. Έλεγχος πραγματικής και
    άεργου ισχύος. Έλεγχος βήματος πτερυγίου. Περιβαλλοντικές επιπτώσεις από την εγκατάσταση αιολικών συστημάτων και λοιπών
    ΑΠΕ. Σύνδεση με το δίκτυο'
  - . Τα υποχρεωτικά είναι συγκεκριμένα βασικά μαθήματα της επιστήμης του Ηλεκτρολόγου Μηχανικού και Μηχανικού Υπολογιστών,
    τα οποία πρέπει να παρακολουθήσει και εξεταστεί επιτυχώς κάθε φοιτητής. Τα κατ’ επιλογήν υποχρεωτικά είναι μαθήματα εμβάθυνσης
    σε διάφορους ειδικούς τομείς
  - 'Η σελίδα παρουσιάζει τους Τομείς του Τμήματος Ηλεκτρολόγων Μηχανικών και Τεχνολογίας Υπολογιστών: Τηλεπικοινωνιών και
    Τεχνολογίας Πληροφορίας (Τ&ΤΠ), Συστημάτων Ηλεκτρικής Ενέργειας (ΣΗΕ), Ηλεκτρονικής και Υπολογιστών (Η&Υ) και Συστήματα
    και Αυτόματου Ελέγχου (Σ&ΑΕ)'
