    Assistance About Regal Rexnord Regal Rexnord Corporation (Regal Rexnord) is a leading manufacturer of electric motors,
    electrical motion controls, power generation and mechanical power transmission products and sub-systems, serving customers
    around the world in the general industrial, consumer, commercial construction, food beverage, and alternative energy end
    markets, among others. Regal Rexnord sells its products and solutions to OEMs, through distributors, and directly to end-users.
    Regal Rexnord is a 7.2B company with 36,000 associates globally. You may not know it, but Regal Rexnord impacts your life
    every day. The companys products enable the fans in HVAC systems that keep us comfortable the power source that keeps
    smart buildings running the agricultural and food service equipment that keeps us fed and the conveyer systems that keep
    e-commerce flowing, to name a few of the applications where our products are used. Regal Rexnords business purpose is
    to create a better tomorrow by energy-efficiently converting power into motion. This means creating innovative solutions
    while focusing on both customer needs and the companys commitment to sustainability. The companys industrial powertrain
    and automation solutions offerings are an important part of the company s growth strategy. The companys strategy includes
    leveraging 8020 to prioritize all activities, including product excellence, operational excellence and commercial excellence
    (i) driving organic sales growth through the introduction of innovative new products, with a particular focus on improving
    energy efficiency, (ii) establishing and maintaining new customers, as well as developing new opportunities with existing
    customers, (iii) participating in higher growth end markets and geographies, and (iv) identifying and consummating strategic,
    value creating acquisitions. Equal Employment Opportunity Statement Regal Rexnord is an Equal Opportunity and Affirmative
    Action Employer. All qualified applicants will receive consideration for employment without regard to race, color, religion,
    sexgender, sexual orientation, gender identity, age, ancestry, national origin, marital status, citizenship status (unless
    required by the applicable law or government contract), disability or protected veteran status or any other status or
    characteristic protected by law. Regal Rexnord is committed to a diverse and inclusive workforce. We are committed to
    building a team that represents diverse and inclusive backgrounds, perspectives, and skills. Notification to Agencies
    Please note that Regal Rexnord Corporation and its affiliates and subsidiaries ( Regal Rexnord ) do not accept unsolicited
    resumes or calls from third-party recruiters or employment agencies. In the absence of a signed Master Service Agreement
    or similar contract and approval from HR to submit resumes for a specific requisition, Regal Rexnord will not consider
    or approve payment to any third-parties for hires made.'
