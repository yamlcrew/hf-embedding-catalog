  - source_sentence: История открытия электричества в конце 18 века
    sentences:
    - 'в конце 18 -го века итальянский учёный а. вольта сделал открытие, которое можно считать «днём рождения» века электричества.
      учёный заметил, что если положить пропитанную кислотой ткань между медной и цинковой пластинками, то они приобретают
      электрические заряды: медная пластинка заряжается положительно, а цинковая - отрицательно. поэтому если соединить пластинки
      проводником, то по нему начинает течь ток! чтобы увеличить ток, вольта сложил большое количество медных и цинковых кружков
      столбиком, чередуя их и помещая между кружками пропитанную кислотой ткань. так родился «вольтов столб», ставший первым
      созданным человеком источником электрического тока. действие этого источника тока обусловлено химическими реакциями
      меди и цинка с кислотой. вследствие этих реакций происходит разделение зарядов: на медной пластинке образуется недостаток
      электронов, а на цинковой - их избыток. крайние кружки «вольтова столба» соединены с проводниками, которые называют
      электродами. один из них является положительным полюсом источника тока, а другой - отрицательным. таким образом, действие
      источника тока состоит в том, что в источнике тока происходит разделение зарядов: положительные заряды накапливаются
      на одном полюсе источника, а отрицательные - на другом. источники тока, в которых разделение зарядов происходит вследствие
      химических реакций, называют гальваническими элементами. в быту и в технике гальванические элементы используются очень
      широко в виде батареек и аккумуляторов. но основными источниками тока являются сегодня генераторы электрического тока
      на электростанциях.'
    - электрический ток представляет собой направленное движение заряженных частиц. в дальнейшем электрический ток мы будем
      для краткости называть часто просто током. каковы же условия существования тока? во-первых, в теле, в котором течёт
      ток, должны быть заряженные частицы, которые могут двигаться. напомним, что такие заряженные частицы называют свободными
      зарядами. итак, первым условием существования электрического тока является наличие свободных зарядов. вторым условием
      существования электрического тока является наличие в веществе электрического поля.
    - 'после смерти «тишайшего» царя алексея михайловича править стал его сын - федор (1676-1682). ему исполнилось 16 лет.
      федор был неплохо образован для своего времени: он знал несколько языков, писал стихи, сочинял музыку. он заботился
      о просвещении, развитии зодчества и книгоиздательства. боярская дума при царе федоре стала постоянно действующим высшим
      государственным учреждением. для решения текущих дел при ней было создано правительство - расправная палата. центральные
      ведомства - приказы - получили новых образованных сотрудников и выросли вдвое. в уездах было установлено единовластие
      воевод. все государственные учреждения работали отныне по одному расписанию. молодой царь вывел страну из разорительной
      войны с османской империей. ударной силой русской армии, разгромившей на украине турецких янычар (отборные полки султана),
      стала регулярная пехота - солдаты и стрельцы. в 1679 г. царь провел военно-окружную реформу. вся армия, включая дворянские
      конные полки, стала регулярной, а военная служба для дворян - строго обязательной. исключением оставался лишь государев
      двор, скованный традициями местничества. при федоре оно было окончательно отменено. продвижение по службе в регулярных
      войсках теперь зависело не от знатности, а от личных заслуг. это было сделано не в ущерб знатным родам. их руководящее
      положение в государстве было закреплено в «бархатной книге». молодому царю удалось оздоровить финансы страны. вместо
      множества сложных налогов он ввел один - подворный (определенную сумму в год брали с каждого тяглого двора). сумма налога
      не раз снижалась. по совету с земским собором федор алексеевич привел налог в соответствие с экономическим развитием
      регионов страны. в москве и других богатых местах платили больше, в бедных меньше. собирали налог только доверенные
      люди от самих налогоплательщиков. чиновники не могли прикасаться к этим деньгам. они должны были жить на жалованье.
      царь заботился о развитии частной инициативы в строительстве и торговле, давал кредиты. экономика расцветала. в одной
      москве было построено 10 тысяч каменных зданий. обогащение подданных наполняло казну деньгами от косвенных налогов:
      таможенных и иных пошлин, платы государевым ямщикам, возившим караваны грузов, и т. д. при федоре алексеевиче провели
      реформу одежды. царь хотел видеть своих подданных одетыми в «венгерские кафтаны» на западный манер. однако от рождения
      федор был тяжело болен, да еще в детстве получил травму спины. временами царь не мог самостоятельно ходить. иностранцы
      при дворе русского царя писали своим правителям о федоре, что «новый русский царь долго не проживет». царь умер на седьмом
      году своего царствования, не оставив прямого наследника. престол должен был перейти к его 16 -летнему брату ивану. однако
      при дворе созрел заговор противников реформ царя. боярская дума и патриарх провозгласили царем десятилетнего петра.
      народ, справедливо боявшийся бесконтрольного правления бояр, возмутился: как «через большего брата выбрали на царство
      меньшего?». во главе восстания 1682 г. встали стрельцы и солдаты, которым задерживали жалованье. они обвинили во всех
      бедах нарышкиных, к роду которых принадлежала мать петра. агитаторы, выбранные на сходках во всех стрелецких и солдатских
      полках, обвинили придворных заговорщиков в отравлении «доброго и справедливого» царя федора. в москве вспыхнул бунт.
      15 мая 1682 г. по звону набатного колокола стрельцы ворвались в кремль. прошел слух, что нарышкины «извели царевича
      ивана». на красное крыльцо в кремле боярин а.с. матвеев вывел петра и ивана, показав, что оба живы. однако'
