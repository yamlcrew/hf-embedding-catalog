      материка и острова карибского бассейна. в то же время значительная часть населения андских стран (рис. 112) традиционно
      сосредоточена на высоких плоскогорьях в горных районах, особенно в перу, эквадоре, боливии. численность населения растёт
      очень быстро, и так же быстро растут города. мехико и сан-паулу принадлежат к самым большим городам мира. img-127.jpeg
      рис. 112. индейцы - коренные жители андских стран латиноамериканцы - потомки европейских переселенцев, коренных жителей
      индейцев и чернокожих африканцев. как природные ресурсы влияют на облик латинской америки? латинская америка очень богата
      природными ресурсами. во-первых, бо́льшая часть территории региона лежит в экваториальных, тропических и субтропических
      широтах и получает много тепла и солнечного света, что позволяет выращивать практически любые культуры. латинская америка
