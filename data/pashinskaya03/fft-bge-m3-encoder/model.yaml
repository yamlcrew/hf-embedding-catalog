    - 'в середине xviii века академик петербургской академии наук леонард эйлер (1707-1783) определил степень числа $e$ с
      комплексным показателем и установил формулу, ныне носящую его имя: $$ e^{i \varphi}=\cos \varphi+i \sin \varphi, \text
      { где } \varphi \text { - действительное число. } $$ для действительных чисел $x$ и $y$ с помощью этой формулы вычислим
      произведение комплексных чисел $e^{i x}=\cos x+i \sin x$ и $e^{i y}=\cos y+i \sin y$ : $$ \begin{gathered} e^{i x} \cdot
      e^{i y}=(\cos x+i \sin x) \cdot(\cos y+i \sin y)= \\ =\left(\cos x \cdot \cos y-\sin x \cdot \sin y\right)+i(\cos x
      \cdot \sin y+\sin x \cdot \cos y)= \\ =\cos (x+y)+i \sin (x+y)=e^{i(x+y)} \end{gathered} $$ в результате получается
      равенство $$ e^{i x} \cdot e^{i y}=e^{i x+i y} $$ аналогичное известному равенству для степеней с действительными показателями.
      с помощью формулы эйлера любое ненулевое комплексное число $z=r(\cos \varphi+i \sin \varphi)$ можно записать в особой
      форме. поскольку по определению $\cos \varphi+i \sin \varphi=e^{i \varphi}$, то $z=r e^{i \varphi}$, где $r, \varphi$
      - действительные числа и $r>0$. запись вида $$ z=r e^{i \varphi} $$ называется показательной формой ненулевого комплексного
      числа. с учётом формулы эйлера для мнимых показателей для произвольного комплексного числа $z=a+b i$ определим $$ e^{z}=e^{a+b
      i}=e^{a} \cdot e^{b i}=e^{a} \cdot(\cos b+i \sin b) $$ формула эйлера $e^{i \varphi}=\cos \varphi+i \sin \varphi$ для
      мнимых показателей позволяет выразить функции $\sin x$ и $\cos x$ через показательную функцию с мнимым показателем.
      заменяя число $\varphi$ в формуле эйлера на $x$ и $-x$, получим два равенства: $$ \begin{aligned} & e^{i x}=\cos x+i
      \sin x \\ & e^{-i x}=\cos x-i \sin x \end{aligned} $$ складывая и вычитая эти равенства, будем иметь: $$ e^{i x}+e^{-i
      x}=2 \cos x, \quad e^{i x}-e^{-i x}=2 i \sin x $$ отсюда для действительных $x$ имеют место равенства: $$ \cos x=\frac{e^{i
      x}+e^{-i x}}{2}, \quad \sin x=\frac{e^{i x}-e^{-i x}}{2 i} $$ в общем случае для любого комплексного числа $z$ по определению
      полагают $$ \cos z=\frac{e^{i z}+e^{-i z}}{2}, \quad \sin z=\frac{e^{i z}-e^{-i z}}{2 i} $$ вычисляя сумму $\cos z+i
      \sin z$, получим $$ \cos z+i \sin z=\frac{e^{i z}+e^{-i z}}{2}+\frac{e^{i z}-e^{-i z}}{2}=e^{i z} $$ рассмотрим теперь
      функцию $f(z)=e^{z}$, определённую на множестве $c$. пусть $z=x+y i$. тогда по формуле эйлера $$ w=f(z)=e^{x+y i}=e^{x}
      \cdot(\cos y+i \sin y) $$ отсюда можно получить следующие свойства. i. если два числа $z_{1}$ и $z_{2}$ имеют'
  - source_sentence: Каковы цели и структура текста-рассуждения?
    sentences:
    - 'существует три типа речи: описание, повествование, рассуждение. рассуждение - тип речи, широко используемый в различных
      жанрах и стилях речи. умение логически правильно выстраивать свои рассуждения и подбирать убедительные аргументы помогает
      отстаивать свою точку зрения. рассуждение устанавливает причинную взаимосвязь событий и явлений. цель рассуждения -
      исследовать предмет или явление, раскрыть их внутренние признаки, рассмотреть причины и следствия, оценить их, передать
      размышления о них автора, обосновать, доказать или опровергнуть ту или иную мысль, положение, убедить адресата в чём-либо.
      в рассуждении используется не сюжетный (как в повествовании), а логический принцип построения. композиция текста строится
      по модели: тезис, аргументы (доказательства) и вывод. иногда вывод отсутствует, потому что он очевиден и его может сделать
      сам читатель. такие рассуждения называют неполными. текст-рассуждение может включать в себя элементы описания или повествования
      (как правило, в качестве аргументов). рассуждение широко используется в научном и публицистическом стилях речи. в художественном
      стиле оно чаще всего встречается во внутренней речи персонажей и обычно содержит не все компоненты. жанровые формы рассуждения
      многообразны: письмо, статья, рецензия, доклад, школьное сочинение, убеждающее выступление, полемический диалог. форма
      приведения аргументов может быть индуктивной и дедуктивной. при дедуктивном методе доказывания сначала приводится тезис,
      потом аргументы (автор идёт от общего умозаключения к анализу частных фактов). например: сегодня прекрасная погода для
      загородной прогулки (тезис). светит солнце, небо без единого облачка (аргументы). при индуктивном методе сначала выдвигаются
      аргументы, затем - мысль, которая ими подтверждается (автор идёт от освещения частных, конкретных фактов к общему заключению):
      светит солнце, небо без единого облачка (аргументы). для загородной прогулки сегодня прекрасная погода (тезис). последовательность
      аргументов может быть выражена словами во-первых, во-вторых и т. п., может быть обозначена абзацным членением. при перечислении
      аргументов употребляются вводные слова с разным значением (конечно, разумеется, возможно, самое главное, итак, следовательно
      и т. п.).'
    - 'калия, техническое название поташ, используют в производстве жидкого мыла и для приготовления тугоплавкого стекла,
      а также в качестве удобрения. na2so4·10h2o - кристаллогидрат сульфата натрия, техническое название - глауберова соль,
      применяют для производства соды и стекла и в качестве слабительного средства. nacl - хлорид натрия, или поваренная соль,
      хорошо известен вам из курса 8 класса. хлорид натрия является важнейшим сырьём в химической промышленности, широко применяется
      в быту. ионы натрия и калия очень важны для живых организмов: na+ - главный внеклеточный ион, содержится в крови и лимфе,
      а k+ - основной внутриклеточный ион. они выполняют разные функции в организме, но предпочитают «работать» вместе. соотношение
      концентраций этих ионов регулирует давление крови в живом организме; обеспечивает перемещение растворов солей из корней
      в листья растений. калий поддерживает работу сердечной мышцы, поэтому нехватка калия в организме отрицательно сказывается
      на здоровье человека. калий необходим растениям, при его недостатке снижается интенсивность фотосинтеза. взрослый человек
      должен в сутки потреблять с пищей 3,5 г калия. с помощью соединений калия можно устранять отёки. в этом случае нужно
      увеличить потребление калия до 5 г в сутки. больше всего калия содержат курага, соя, фасоль, зелёный горошек, чернослив,
      изюм и некоторые другие продукты. соли калия широко используют в сельском хозяйстве в качестве калийных удобрений. соли
      натрия, как и сам натрий, окрашивают пламя в жёлтый цвет, а калий и его соли - в розово-фиолетовый. литий был открыт
      шведским химиком а. арфведсоном в 1817 г. и по предложению й. берцелиуса назван литием (от греч. литос - камень), так
      как, в отличие от калия, который до тех пор находили только в золе растений, он был обнаружен в камне. натрий и калий
      были впервые получены английским химиком и физиком г. дэви в 1807 г. при электролизе едких щелочей. й. берцелиус предложил
      назвать элемент № 11 натрием (от араб. натрун - сода), а элемент № 19 по предложению у. гилберта получил название «калий»
      (от араб. алкали - щёлочь).'
    - 'информационная заметка, интервью и репортаж - публицистические жанры, в которых реализуется одна из задач публицистического
      стиля речи - информирование читателя. в них рассказывается о людях и событиях, которые должны быть интересны читателю.
      все жанры публицистической речи делятся на информационные, аналитические и художественно-публицистические. k информационным
      жанрам относят заметку, отчёт, репортаж, корреспонденцию, многие интервью. тексты, относящиеся к информационным жанрам,
      позволяют читателям следить за наиболее значимыми, интересными событиями. заметка - краткое сообщение о каком-то важном
      и новом факте. событийная заметка - рассказ о событиях или о положении дел в той или иной сфере деятельности. основными
      качествами заметки являются документальность, оперативность и актуальность. заметка о событии, которое мало связано
      с интересами аудитории, то есть неактуальная заметка, не привлечёт внимания. заметка о событии, которое уже известно
      читателям, то есть неоперативная заметка, тоже не вызовет интереса. анонс - сообщение о будущих культурных мероприятиях,
      выставках, концертах и пр. основная цель анонса - дать краткую, но объективную информацию о времени и важных особенностях
      планируемого события. аннотация - краткое описание нового издания, которое может заинтересовать читателя. мини-рецензия
      - заметка, содержащая оценку книги, кинофильма, пьесы. её цель - сообщить читателю о впечатлении, полученном автором.
      при этом такое впечатление не обосновывается какими-то доказательствами, а представляет собой простое изложение эмоций
      автора. интервью - это беседа корреспондента с каким-либо известным человеком, политическим или общественным деятелем
      по вопросу, имеющему общественный интерес. информационное интервью содержит информацию о каких-либо событиях и фактах.
      в нём делается акцент на вопросах что? где? и когда? и полученные от лица сведения сообщаются без комментариев автора.
      аналитическое интервью, кроме того, содержит и анализ факта, ответы на вопросы почему? каким образом? что это значит?
      репортаж (от лат. reportare - «передавать») - сообщение о каком-либо событии в его динамике. в репортаже важно не просто
      наглядно описать событие, а вызвать сопереживание читателя. письмо - жанр письменной речи. оно не только служит общению
      людей, территориально удалённых друг от друга, но и обладает большими художественными возможностями, которые широко
      используются писателями и публицистами. письмо является древнейшим способом обмена информацией. письма, которые писали
      наши далёкие предки, по своей структуре мало чем отличались от современных. письмо - это сообщение, пересылаемое по
      почте адресату. оно включает в себя адрес получателя, обращение и приветствие, собственно сообщение, заключительную
      этикетную формулу и подпись отправителя. текст письма может содержать также постскриптум (допускается лишь в том случае,
      когда после подписания письма произошло событие, о котором нужно немедленно сообщить адресату; хорошо продуманное письмо
      должно содержать всю информацию в тексте). как правило, письмо запечатывается в конверт, на котором указывается адрес
      получателя и адрес отправителя. письма бывают личные, открытые и деловые. личное письмо предназначено для чтения только
      тем лицом, которому оно адресовано. открытое письмо - это личное письмо, сознательно открытое для всеобщего ознакомления.
      открытые письма публикуются в газетах и журналах. цель открытого письма - отразить позицию автора по общественно значимым
      вопросам. деловые письма представляют собой официальную корреспонденцию и применяются для решения многочисленных деловых
      вопросов. в деловых письмах, как и в документах, должны быть соблюдены стандарты. служебное письмо пишут на бланке организации
      отправителя и обязательно регистрируют. существуют различные виды деловых писем: письмопросьба, сопроводительное письмо,
      которое составляется при отправке адресату'
