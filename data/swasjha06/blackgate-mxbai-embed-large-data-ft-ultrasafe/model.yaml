  sentences:
  - 'Unit: kW or HP 6 Example: • Clinker = highly abrasive • Cement = medium Example: • Clinker = highly abrasive • Cement
    = medium • Flour = low Why important: • Determines liner type • Determines rotor tip hardness 11. Leakage Requirement
    What it means: How much air leakage is acceptable Why important: • Critical in pneumatic systems • Affects energy efficiency
    High performance = low leakage 12. Drive Type What it means: How valve is driven Types: • Direct drive • Chain drive •
    Gearbox drive Why important: • Affects maintenance • Affects torque • Affects reliability 13. Motor Power Unit: kW or
    HP 6 Why important: • Depends on load • Depends on material • Depends on pressure 14. Application Location Where valve
    is installed Examples: • Baghouse • Kiln feed • Cyclone • Silo discharge Why important: • Decides entire design • Decides
    RAL vs RALX FINAL SUMMARY (VERY IMPORTANT) When selecting a rotary valve, always ask: 1.TPH 2.Material type 3.Density
    4.RPM 5.Temperature 6.Pressure 7.Application location SIMPLE UNDERSTANDING Rotary valve = “Controlled material flow +
    pressure sealing machine” ONE LINE FOR SALES TEAM “Sir, I just need 6 details — TPH, material, density, temperature, pressure,
    and application — I can recommend exact valve.” 7 Why important: • Depends on load • Depends on material'
