    handling solutions designed specifically for safety- sensitive petrochemical applications. Our equipment supports controlled
    feeding, pressure containment, and sealed material transfer in refineries, polymer plants, and chemical processing units.
    Each solution is developed to ensure operational reliability, structural strength, and long-term durability in demanding
    petrochemical environments. CRITICAL PROCESS AREAS CATALYST POLYMER & RESIN SILO & HOPPER DUST & VAPOR HANDLING & POWDER
    ISOLATION CONTAINMENT INJECTION DISCHARGE SYSTEMS SYSTEMS BUILT FOR PRESSURE, CONTAINMENT & DURABILITY Petrochemical applications
    demand precision engineering and structural robustness. Our equipment is manufactured using high-grade materials, reinforced
    housings, and optimized sealing systems to ensure containment and resistance to corrosive or reactive substances. Rotary
    Valves are engineered with controlled tolerances and advanced shaft sealing configurations to maintain airlock integrity
    in pressure or vacuum conveying systems. Specialized sealing arrangements reduce leakage risk and enhance process stability.
    ENGINEERING FEATURES Heavy-Duty Rotary Valves for Polymer & Catalyst Handling Pneumatic Pressure Rotary Valves for Pressurized
    Conveying
  - 4.4 Alle in de Overeenkomst vermelde prijzen zijn in euro’s, exclusief btw. Algemene inkoopvoorwaarden – May 2022 – version
    1.0 2 5. Levering 5.1 De in de Overeenkomst vermelde uitvoeringstermijn of leveringsdatum is voor Leverancier een fatale
    termijn respectievelijk fatale datum, tenzij Partijen schriftelijk anders zijn overeengekomen. Het enkel overschrijden
    van die termijn c.q. datum brengt Leverancier in verzuim, zonder dat een ingebrekestelling is vereist. DMN-WESTINGHOUSE
    heeft het recht om eenzijdig de leveringstermijn dan wel -datum te verlengen c.q. uit te stellen. 5.2 Indien geen uitdrukkelijke
    uitvoeringstermijn of -datum is overeengekomen, geldt tussen Partijen een redelijke uitvoerings-/leveringstermijn. 5.3
    Indien levering in fasen is overeengekomen en Leverancier in gebreke is gebleven met de levering ter zake van een fase,
    is artikel 5.1 van toepassing en heeft DMN-WESTINGHOUSE het recht toekomstige leveringen te annuleren, zonder daarbij
    gehouden te zijn tot enige vergoeding van schade aan Leverancier. 5.4 Zodra Leverancier weet of behoort te weten dat de
    levering niet, niet tijdig of niet naar behoren zal plaatsvinden, geeft hij hiervan onmiddellijk schriftelijk bericht
    aan DMN-WESTINGHOUSE onder vermelding van de omstandigheden die de aanleiding van deze tekortkoming vormen, alsmede van
    de datum waarop Leverancier redelijkerwijs verwacht in staat
