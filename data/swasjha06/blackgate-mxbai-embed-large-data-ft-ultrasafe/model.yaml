    of bij in diens opdracht handelende derden bekend moet worden verondersteld; c. d e aansprakelijkheid steeds beperkt is
    tot het bedrag dat door de verzekering van DMN-WESTINGHOUSE wordt uitgekeerd, waarbij geldt dat in het geval de verzekering
    niets uitkeert of de schade niet verzekerd is, de aansprakelijkheid beperkt is tot de netto factuurwaarde van de laatste
    in het kader van de desbetreffende'
  - '2 2. Feeding Function 2. Feeding Function Controls volumetric material feeding into: • Pneumatic conveying lines • Process
    equipment • Mixers or reactors 3. Flow Control Ensures stable discharge rate of material. 3. Use Case Segmentation (Application-Based)
    Oswar Rotocorp classifies rotary valves based on how they are used in the system. 1. Powder Handling Used for fine materials.
    Examples: • Cement powder • Fly ash • Food powders • Pigments • Chemicals Industries: Pharma Food Chemicals Paints 2 2.
    Bulk Material Handling Used for heavier granular materials. Examples: • Limestone • Clinker • Coal • Sand • Pellets Industries:
    Cement Mining Steel Power 3. Controlled Flow Systems Used where pressure sealing and process stability are critical. Examples:
    • Kiln feed • Gasifiers • Spray dryers • Pneumatic conveying systems 4. Feeder Applications Used when rotary valve acts
    as a rotary feeder. 3 2. Bulk Material Handling 2. Bulk Material Handling Used for heavier granular materials. Examples:
    • Limestone • Clinker • Coal • Sand • Pellets Industries: Cement Mining Steel Power 3. Controlled Flow Systems Used where
    pressure sealing and process stability are critical. Examples: • Kiln feed • Gasifiers • Spray dryers • Pneumatic conveying
    systems 4. Feeder Applications Used when rotary valve acts as a rotary feeder. 3 Examples: • Material dosing • Pellet
    feeding • Grain feeding Industries:'
  - 'ROTARY AIR LOCK LEAKAGE & PRESSURE INTEGRITY WHITEPAPER In pneumatic conveying and dust collection systems, maintaining
    pressure separation between upstream and downstream environments is critical. Rotary Valves function as airlocks, enabling
    controlled material discharge while restricting unwanted airflow between zones of different pressure. FUNDAMENTAL FUNCTION
    CONTROLLED PROPER SEALING BALANCED STRUCTURAL ROTOR TIP BETWEEN ROTOR INTERNAL RIGIDITY UNDER CLEARANCE AND HOUSING GEOMETRY
    DIFFERENTIAL PRESSURE CRITICAL PARAMETERS IMPACTING PRESSURE INTEGRITY Technical Analysis: Leakage in a Rotary Valve is
    primarily governed by: 1. Rotor Tip Clearance Smaller clearances improve sealing but must account for thermal expansion
    and material buildup. 2. Differential Pressure Higher pressure differences increase airflow across clearances, directly
    impacting airlock efficiency. 3. Rotor Speed Increased rotational speed can influence volumetric efficiency and leakage
    characteristics. 4. Material Characteristics Abrasive materials accelerate wear, increasing internal clearances over time.
    5. Housing & End Cover Alignment Improper installation may compromise pressure integrity. PERFORMANCE INDICATORS Air Leakage
    Rate Volumetric Efficiency Pressure Drop Across System Energy Consumption Impact Maintenance Frequency WWW.OSWARROTOCORP.COM
    2 ENGINEERING SOLUTIONS TO MINIMIZE LEAKAGE'
