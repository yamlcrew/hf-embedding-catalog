      or HP 6 Why important: • Depends on load • Depends on material • Depends on pressure 14. Application Location Where
      valve is installed Examples: • Baghouse • Kiln feed • Cyclone • Silo discharge Why important: • Decides entire design
      • Decides RAL vs RALX FINAL SUMMARY (VERY IMPORTANT) When selecting a rotary valve, always ask: 1.TPH 2.Material type
