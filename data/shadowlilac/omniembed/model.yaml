    - Block Island Sound is a strait in the open Atlantic Ocean, approximately 10 mi wide, separating Block Island from the
      coast of mainland Rhode Island in the United States. On the west, it extends to Montauk Point on the eastern tip of
      Long Island, as well as Plum Island, Gardiners Island, and Fishers Island, all in the state of New York.
    - Oyster Bay, also known as Oyster Bay Harbor, is an inlet of Long Island Sound on the north shore of Long Island in New
