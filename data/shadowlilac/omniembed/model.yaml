    - 'Game Show Consolation Prizes: The Not So Perfect Ten | East of the M60 East of the M60 BBC , Entertainment , ITV ,
      Media , Quiz Shows , Television , The Not So Perfect Ten mancunian1001 This month’s starter for ten With the possible
      exception of Eggheads, Pointless, and The Chase, there are few quiz shows originating from the 21st century which offer
      contestants any of the following: A solid intellectual challenge in their given subject area or wide ranging subject
      areas; Gloriously crap consolation prizes; Questions where multiple choice is the exception rather than the rule. For
      the purpose of this month’s Not So Perfect Ten, I shall be focusing on the second point: Gloriously crap consolation
      prizes. By this, trophies not worth the balsa wood they were made from; miniature follies which serve little or no purpose.
      Some may have a quite useful purpose, though not the sort of thing you would buy as a suitable birthday/Christmas/wedding/Labour
      Day/National Pie Week present. Our ten prizes: XYZ: A mug tree; Lucky Ladders: A model pair of ladders (Lennie’s Losers’
      Ladders); Crackerjack: a pencil; Bullseye: bendy Bully, chalk holders, darts and tankards; Runway: a newspaper of your
      birthdate; Larry Grayson’s Generation Game: a door trophy; Family Fortunes: silver framed family photograph; Wheel of
      Fortune: watch and electronic game; Wipeout: paperweight, umbrella. 1. All for the sake of my little mug tree XYZ (BBC
      One, 1993) Presented by George Marshall as a hastily created replacement for the lunch time showing of Eldorado, XYZ
      was a letter based game show where contestants scored points for any word which used an alphabetical string. For example,
      ‘student’ would gain a good score, owing the position of S, T and U in the alphabet, as would ‘definite’ (with D, E
      and F), irrespective of word length. Losing contestants would take home a XYZ mug tree. Great for the kitchen or staff
      room, but hardly commemorative. *                                         *                                        
      * 2. ‘But we don’t want to give you that…’ – years before Chris Tarrant’s quizzical juggernaut Lucky Ladders (Anglia/ITV
      1988 – 93) Anglia brought us The Quiz of the Week in the late 1970s, but their late 1980s gem was one of ITV’s most
      popular daytime quiz shows. Launched in 1988BJK [Before Jeremy Kyle], Lucky Ladders was a word association puzzle game
      where contestants would build a word ladder using the top and bottom words, ultimately meeting in the middle. Hosted
      by Lennie Bennett, the programme went out at 9.25 am for five years, sharing that slot with other contemporary shows
      like Chain Letters, Crosswits and Runway. Winning contestants would leave Norwich with a holiday, whereas losers would
      take home one of Lennie’s Losers’ Ladders. For the first series, they only had six of these diminutive trophies and
      never left the studio with their consolation prize in tow. (They were mailed to their home address shortly after). During
      its first series, all contestants came from the Anglia region. *                                         *          
                                    * 3. ‘It’s Friday, it’s five to five, and it’s…’ Crackerjack (BBC One, 1955 – 1984) Crackerjack
      was a long running children’s variety programme which had a game show element as its main feature. Though the programme
      was an apprenticeship for Leslie Crowther, Michael Aspel and Eamonn Andrews, it was the latter person’s game show element
      Double or Drop which was the apogee of most Crackerjack viewers’ favoured parts of the show. Children would balance
      on a box and hold either as many prizes or cabbages. For a right answer, he or she would hold onto a prize, such as
      a board game. For each wrong answer, he or she would be given a cabbage. By the time they are weighed down by the cabbages,
      or if they lost balance, they lose the lot. Win or lose, each contestant would be given a Crackerjack pencil, a relatively
      low value item of heightened status owing to its prospective collectibility and exclusivity value. For a time in the
      1970s, they ditched the pencils, revived th'
