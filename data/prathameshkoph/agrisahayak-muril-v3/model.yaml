    sentences:
    - मुर्गी आवास व उसमें प्रयोग होने वाले उपकरण जैसे दाने व पानी के बर्तन तथा बिछावन आदि को साफ रखना चाहिए एवं इसमें समय
      - समय पर जीवाणुनाशक दवा का छिड़काव करना चाहिए। मुर्गियों को समय – समय पर दाने या पानी में एंटियोटिक्स, विटामिन्स व खनिज
      लवण देने पर उनकी रोग प्रतिरोधक क्षमता बढ़ाई जा सकती है। मुर्गियों को प्रमुख बीमारियों से बचाने के लिए उचित आयु पर टीकाकरण
      करना आवश्यक है। अंडा देने वली मुर्गियों को महीने में एक बार कृमियों से बचाव के लिए दवाई अवश्य द दें । मरी हुई मुर्गी,
      मुर्गियों के मलमूत्र, गिरे हुए पंख व टूटे हुए अंडे आदि को मुर्गी आवास से दूर सुरक्षित स्थान पर दफना या जला देना चाहिए।
      मुर्गियों को दुसरे वन्य पक्षी व जानवर आदि से दूर रखना चाहिए। मुर्गियों के स्वस्थ्य की जाँच पशु चिकित्सक dद्वारा समय
      – समय पर करानी चाहिए। बर्ड फ़्लू (एवियन इन्फ्लूएंजा) के संबंध में आवश्यक तथ्य एवं जानकारी इससे डरे नहीं सावधानियाँ बरतें
      मुर्गी पालने वाले तथा मुर्गी व्यवसाय से जुड़े अन्य लोग विशेष रूप से ध्यान दें कि बीमारी मुर्गियों के सीधे संपर्क में
      न आयें। दस्ताने या किसी भी अन्य सुरक्षा साधन का इस्तेमाल करें।
    - है I अंगूर की सिंचाई भारत में अंगूर ज्यादातर अपर्याप्त वर्षा और उच्च वाष्पोत्सर्जन घाटा वाले अर्द्ध शुष्क क्षेत्रों
      में उगाए जाते हैं। इसलिए अनुपूरक सिंचाई आवश्यक हो जाती है। ग्रोथ के विभिन्न चरणों के दौरान बेलों को पानी की आवश्यकता
      अलग-अलग होती है। बेलों की छंटाई और उर्वरक डालने के बाद तुरंत सिंचाई की जाती है। बेरी ग्रोथ स्टेज के दौरान, 5-7 दिनों
      के अंतराल पर सिंचाई की जाती है। फलों की गुणवत्ता में सुधार करने के लिए फसल-कटाई से पहले कम से कम 8-10 दिनों के लिए पानी
      को रोका जाता है। छंटाई के बाद सिंचाई फिर से शुरू की जाती है। गर्मियों की छंटाई से बारिश की शुरूआत तक की अवधि के दौरान,
      सिंचाई साप्ताहिक अंतराल पर की जाती है और इसके बाद 10-12 दिनों के अंतराल पर जब तक सर्दियों की छंटाई मिट्टी की नमी हालात
      पर निर्भर रहेगी। गर्मियों की छंटाई के बाद 45-50 दिनों के दौरान अत्यधिक सिंचाई नहीं की जानी चाहिए क्योंकि वनस्पति विकास
      के संवर्धन द्वारा यह फूल बीजारोपण पर उल्टा प्रभाव डालती है।
    - सहायता 500 रूपये प्रति हैक्टेयर अधिकतम के अध्यधीन अपेक्षित पोषकतत्व की लागत के 50% तक सीमित होगी । उर्वरता गुणवत्ता
      नियंत्रण प्रणाली का सुदृढीकरण विद्यमान राज्य उर्वरक गुणवता नियंत्रण प्रयोगशालाओं का सुदृढीकरण/उन्नयन देश में विक्रय
      किये जाने वाले उर्वरकों की गुणवत्ता की जांच के लिए, वर्तमान में विभिन्न राज्य सरकारों के नियंत्रण में 74 एफक्यूसीएल
      कार्यरत हैं । चूंकि गुणवत्ता परीक्षण उर्वरक नियंत्रण आदेश (एफसीओ) के तहत सांविधिक आवश्यकता है, यह सभी उपकरणों तथा यंत्रों
      के रख-रखाव आवश्यक है तथा विश्लेषण के लिए गुणवत्ता रासायनिक तथा शीशे की सामग्री की आपूर्ति को सुनिश्चित करना अनिवार्य
      है । इसके लिए समय समय पर यंत्रों के उन्नयन तथा प्रतिस्थापन की आवश्यकता है । राज्य प्रयोगशालाओं में से कई इन सुविधाओं
      के रख रखाव के लिए अत्यन्त वित्तीय समस्या से जूझ रहे हैं । इसलिए, विश्लेषण क्षमता के उच्च मानकों को बनाए रखने के लिए,
      विद्यमान एफक्यूसीएलएस के उन्नयन तथा सुदृढ़ीकरण का प्रस्ताव है । सक्षम अभकिरण- राज्य सरकार के तहत एफक्यूएलएस, केवल ऐसी
      राज्य प्रयोगशालाओं को सहातया प्रदान करेंगी, जो प्रचालन में हे तथा सही ढंग से काम कर रही है और केंद्र सरकार के भाग पर
      देनदारी देयता नहीं है ।
