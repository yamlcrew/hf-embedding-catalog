widgetData:
- source_sentence: ماقدرتش نرقد من تخمام. و البكاء. نصيحة. خايفة نتسرع انا كنت في دار العائلة. منبعد اصراو مشاكل. وفي كل مرة.
    يضربو ابنى وكي نهدر يحبو يضربونى. وسلفى الكبير اتهمنى في شرفى وقالى الى راجلى درك تهز ترميها عند اهلها وكما كان الحال
    ارمنى وقالى اخلاص اخوات. مااحبينكش ترجع ابقا تم ولى بينتنا اخلاص منبعد شاف دار اكرها ورحت ليها رجع يعتدى عليا بالضرب.
    و الكلام الجارح مزال شهر ويكمل الكراء. ونفس الشي اسكو نقدم شكوى الى وكيل الجمهرية اسكو تكون لى صالحلى. عندى طفل صغير.
  sentences:
  - المادة 73
  - المادة 55
  - المادة 53
- source_sentence: السلام عليكم حابة نرفع دعوى رجوع ببيت مستقل انا مرأة وش اجراءات لي نديرهم
  sentences:
  - المادة 78
  - Out-of-scope
  - المادة 74
- source_sentence: سلام خاوتي.انا دبزت مع راجلي على حاجة مكاش ڨاع تافها.. خرج من دار و راه عند خوتاتو. وخلي وحدي في دار كرا.
    انا جيت الدارنا قلت بلاك كي يسمع بلي جيت الدارنا يرجع هو الدار لي كرينها مع اسف مرجعش راني في 25 يوم في دارنا. معيط مسقيى
    عليا حتى ولدو مسقساش عليه. مقال واش راه ناوي مطلق مرجعني. و غي يجبدولي عليا يقولولو خاوتو دير حل عمرك رجع مرتك يقلهم مكاش
    لي يدخل روحو فيا و يهرب من موضوع مع. علم خاوتو ڨاع في صفي عرفيني كي دايرا و هو شوي خفيف و كذاب ديما يحكموه و يقولوله كلش
    ولا مرتك و ولدك. حتى كرا خلصلي و راجل عيطلي انا قلي قولي راجلك يجي يخرح قش.. بسكو راجلي راه مطفي تيليفون ولا بدل نيميرو
    منعرف كي قلتها الخوه و قالوهله قلهم قله يحرڨ القش.. و زاد تان بابا حاول يوثل بيه ملقاهش قال الخوه قولو دير حل عمرك ولا
    تحوس طلاق راه كاين دار شرع علاه راك هارب.. وجه قول شكابن مع العلم هدي خطرا زاوجا يهرب من دار.. يقعد شهرين و يرجع. دروك
    معرفت واش ندير راني حايرا..
  sentences:
  - المادة 55
  - المادة 53
  - المادة 55
- source_sentence: درت إهمال عائلي وانا حاليا ب5اولاد ومنحتو فرصة أخرى مع انو خلاني تقريبا عام وأنا.في دارنا ومكانش ينفق عليا
    منحتو فرصة أخرى علا أساس يكريلي منزل لانو كنت ساكنا في ڨراج  وكان خدام ولاكن مكانش يدير حساب للكراء بعد شهرين من التنازل
    مدار فيها والو يعني مزلت في دارنا عاودت درت إهمال ثاني بيه الاهمال الاول دفعتو ثاني بلي راني تنازلتلو وعطيتو فرصة أخرى
    ومادار فيها والو هل الاهمال الاول كي ضميتو مع الهمال الثاني راح يعاوني ولا لالا وفيها الحبس ليه ولا لالا
  sentences:
  - المادة 53
  - المادة 53
  - المادة 50
- source_sentence: عندي اب تاعي ما عايش معانا ما يصرف عليها هرب وخلانا ويجي مشهر لشهر يسبنا ويسب الام تاعي ويروح مرضها رجعها
    تشرب دوا وتروح لطبيب تع اعصاب ومحبش يطلقها يقلها نخليها هكاك معلقة تتعذبي وزيد دورو ميمدهولناش انا وختي نقراو انا نخدم
    نصرف على روحي وختي وماما يصرف غليهم خويا مسكيت صغير عليا عمرو 20 سنة غير يبريكولي ولي يجيبها يحطهالنا حبيت نطلقها باش
    تتهنا منوا باسكو كرهلنا حياتنا هكا ميزيد يجي لينا ما يزيد يسبنا انا عندي سوتنونس عاذ لعام كرهلي حياتي مخااني نقرى ما هناني
    يضلي يعيطلي ويسب فيا ويرخس فيا نديرو روجوتي يزيد يعيطلي بنوامر وحدوخرين اعطوني حل كيفاه نرفد عليه طلاق لضرر
  sentences:
  - المادة 54
  - المادة 54
  - المادة 53
