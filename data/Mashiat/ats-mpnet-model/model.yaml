- source_sentence: Cybersecurity governance. Information security management. Project management. Process improvement. Business
    continuity management. Disaster recovery planning. Security awareness training. Quality management. Risk assessment. CMMI
    implementation. C. Cybersecurity Governance Program. Led cybersecurity governance, ISO 27001 and 27701 implementation,
    LGPD alignment, and CMMI v2.0 appraisal activities.. Project Management Office Implementation. Implemented corporate PMO
    processes, monitored project KPIs, and improved financial visibility for delivery projects.. Telecom Network Management
    Systems. Coordinated development and rollout of telecom network management systems and process improvements for large
    operators.. Gerente de Governança em Cibersegurança. Leads cybersecurity governance initiatives at GEMINA, including information
    security standards, audits and process oversight (Jul 2024 - Present).. Especialista em segurança cibernética e da informação.
    Worked on cybersecurity and information security initiatives at GEMINA, supporting governance, controls and related practices
    (Dec 2021 - Jul 2024).. Consultora em Gestão de Projetos e Melhoria de Processos | Normas de Qualidade. Consults on project
    management, process improvement, ISO standards, LGPD compliance and CMMI v2.0 appraisal activities (May 2021 - Present).
