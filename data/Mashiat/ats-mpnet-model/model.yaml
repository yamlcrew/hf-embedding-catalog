- source_sentence: Cyber threat intelligence. Security information and event management. Digital forensics. Security operations.
    Privileged access management. Web application security. Email security. Risk assessment. Security awareness. Vulnerability
    management. PAM. WAF. Email Security Gateway. SIEM. CrowdStrike. SentinelOne. Entra ID. Purview. Intune. Azure Security.
    DLP. SWG. Python. Email Security Gateway Implementation. Led implementation of an email security gateway to reduce phishing
    attacks across the organization.. WAF and PAM Implementation. Led implementation of WAF and privileged access management
    solutions to strengthen security controls and governance.. Brand Monitoring Robot. Created a Python-based brand monitoring
    robot to support fraud and threat monitoring efforts.. Cybersecurity Analyst. Leads security initiatives at Travelex including
    email security, WAF, PAM, risk assessment, awareness and vulnerability remediation (Nov 2025 - Present).. Junior Cybersecurity
    Analyst. Handled asset management, hardening policies and threat hunting for Linux and Windows environments at Travelex
    (Nov 2023 - Nov 2025).. Fraud Prevention Analyst. Investigated external and internal fraud cases and created a brand monitoring
    robot at Travelex (Jul 2022 - Nov 2023).
