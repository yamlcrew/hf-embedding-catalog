widgetData:
- source_sentence: Information security. Offensive security. Pentesting. Ethical hacking. DevSecOps. GRC. Vulnerability management.
    Risk management. Security leadership. Network security. Metasploit. Burp Suite. Frida. Objection. Python. Nessus. Tenable.
    SonarQube. ZAP. Snyk. Trivy. GitHub Actions. Microsoft SQL Server. C#. ASP.NET Core. Entity Framework. Active Directory.
    DNS. DHCP. GPO. Python. C#. JavaScript. SQL. HTML. CSS. Pentest and Vulnerability Assessments. Performed web, mobile and
    infrastructure penetration testing and vulnerability assessments using security tools and Python scripts.. DevSecOps Pipeline
    Integration. Integrated security tools into SDLC and CI/CD pipelines to support secure-by-design software delivery.. Security
    Training and Mentorship. Founded and led cybersecurity training initiatives for students and career changers through mentorship
    and instruction.. Information Security Coordinator - ISC. Coordinates information security activities at Capgemini, aligning
    security with business goals and presenting risk metrics to executives (Sep 2022 - Present).. Information Security Consultant.
    Performed pentesting, vulnerability assessments, phishing/vishing campaigns and Tenable-based vulnerability management
    at ISH Tecnologia (Oct 2021 - Sep 2022).. Information Security Specialist - Ethical Hacker Pentest at Wipro. Conducted
    penetration tests for web, mobile and technology assets and produced technical documentation at Banco do Nordeste do Brasil
    S.A (Oct 2018 - Sep 2021).
