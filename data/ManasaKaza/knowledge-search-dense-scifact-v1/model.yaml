widgetData:
- source_sentence: Many transmembrane receptors transmit signals by long-range conformational changes in the association of
    alpha-helices across the plasma membrane.
  sentences:
  - 'Paraneoplastic thrombocytosis: the secrets of tumor self-promotion.

    Paraneoplastic thrombocytosis is associated with many solid tumors and often correlates with reduced survival. Recent
    studies suggest that a pathogenic feed back loop may be operative between platelets and tumor cells, with reciprocal interactions
    between tumor growth/metastasis and thrombocytosis/platelet activation. Specific molecular pathways have been identified
    in which tumors can stimulate platelet production and activation; activated platelets can, in turn, promote tumor growth
    and metastasis. Taken together, these findings provide exciting new potential targets for therapeutic intervention.'
  - 'Dynamic Helix Interactions in Transmembrane Signaling

    Studying how protein transmembrane domains transmit signals across membranes is beset by unique challenges. Here, we discuss
    the circumstances that have led to success and reflect on what has been learned from these examples. Such efforts suggest
    that some of the most interesting properties of transmembrane helix interactions may be the least amenable to study by
    current techniques.'
  - 'Paraneoplastic thrombocytosis: the secrets of tumor self-promotion.

    Paraneoplastic thrombocytosis is associated with many solid tumors and often correlates with reduced survival. Recent
    studies suggest that a pathogenic feed back loop may be operative between platelets and tumor cells, with reciprocal interactions
    between tumor growth/metastasis and thrombocytosis/platelet activation. Specific molecular pathways have been identified
    in which tumors can stimulate platelet production and activation; activated platelets can, in turn, promote tumor growth
    and metastasis. Taken together, these findings provide exciting new potential targets for therapeutic intervention.'
- source_sentence: PGE 2 suppresss intestinal tumor growth by altering the expression of tumor suppressing and DNA repair
    genes.
  sentences:
  - 'Mitochondria: Dynamic Organelles in Disease, Aging, and Development

    Mitochondria are the primary energy-generating system in most eukaryotic cells. Additionally, they participate in intermediary
    metabolism, calcium signaling, and apoptosis. Given these well-established functions, it might be expected that mitochondrial
    dysfunction would give rise to a simple and predictable set of defects in all tissues. However, mitochondrial dysfunction
    has pleiotropic effects in multicellular organisms. Clearly, much about the basic biology of mitochondria remains to be
    understood. Here we discuss recent work that suggests that the dynamics (fusion and fission) of these organelles is important
    in development and disease.'
  - 'Mitochondria: Dynamic Organelles in Disease, Aging, and Development

    Mitochondria are the primary energy-generating system in most eukaryotic cells. Additionally, they participate in intermediary
    metabolism, calcium signaling, and apoptosis. Given these well-established functions, it might be expected that mitochondrial
    dysfunction would give rise to a simple and predictable set of defects in all tissues. However, mitochondrial dysfunction
    has pleiotropic effects in multicellular organisms. Clearly, much about the basic biology of mitochondria remains to be
    understood. Here we discuss recent work that suggests that the dynamics (fusion and fission) of these organelles is important
    in development and disease.'
  - 'Prostaglandin E2 promotes intestinal tumor growth via DNA methylation

    Although aberrant DNA methylation is considered to be one of the key ways by which tumor-suppressor and DNA-repair genes
    are silenced during tumor initiation and progression, the mechanisms underlying DNA methylation alterations in cancer
    remain unclear. Here we show that prostaglandin E(2) (PGE(2)) silences certain tumor-suppressor and DNA-repair genes through
    DNA methylation to promote tumor growth. These findings uncover a previously unrecognized role for PGE(2) in the promotion
    of tumor progression.'
- source_sentence: Neutrophil extracellular trap (NET) antigens may contain the targeted autoantigens PR3 and MPO.
  sentences:
  - 'Netting neutrophils in autoimmune small-vessel vasculitis

    Small-vessel vasculitis (SVV) is a chronic autoinflammatory condition linked to antineutrophil cytoplasm autoantibodies
    (ANCAs). Here we show that chromatin fibers, so-called neutrophil extracellular traps (NETs), are released by ANCA-stimulated
    neutrophils and contain the targeted autoantigens proteinase-3 (PR3) and myeloperoxidase (MPO). Deposition of NETs in
    inflamed kidneys and circulating MPO-DNA complexes suggest that NET formation triggers vasculitis and promotes the autoimmune
    response against neutrophil components in individuals with SVV.'
  - 'New opportunities: the use of nanotechnologies to manipulate and track stem cells.

    Nanotechnologies are emerging platforms that could be useful in measuring, understanding, and manipulating stem cells.
    Examples include magnetic nanoparticles and quantum dots for stem cell labeling and in vivo tracking; nanoparticles, carbon
    nanotubes, and polyplexes for the intracellular delivery of genes/oligonucleotides and protein/peptides; and engineered
    nanometer-scale scaffolds for stem cell differentiation and transplantation. This review examines the use of nanotechnologies
    for stem cell tracking, differentiation, and transplantation. We further discuss their utility and the potential concerns
    regarding their cytotoxicity.'
  - 'Pif1 family helicases suppress genome instability at G-quadruplex motifs

    The Saccharomyces cerevisiae Pif1 helicase is the prototypical member of the Pif1 DNA helicase family, which is conserved
    from bacteria to humans. Here we show that exceptionally potent G-quadruplex unwinding is conserved among Pif1 helicases.
    Moreover, Pif1 helicases from organisms separated by more than 3 billion years of evolution suppressed DNA damage at G-quadruplex
    motifs in yeast. The G-quadruplex-induced damage generated in the absence of Pif1 helicases led to new genetic and epigenetic
    changes. Furthermore, when expressed in yeast, human PIF1 suppressed both G-quadruplex-associated DNA damage and telomere
    lengthening.'
- source_sentence: Pro-inflammatory cytokines are up repressed during tumor development.
  sentences:
  - 'Complex Tissue and Disease Modeling using hiPSCs.

    Defined genetic models based on human pluripotent stem cells have opened new avenues for understanding disease mechanisms
    and drug screening. Many of these models assume cell-autonomous mechanisms of disease but it is possible that disease
    phenotypes or drug responses will only be evident if all cellular and extracellular components of a tissue are present
    and functionally mature. To derive optimal benefit from such models, complex multicellular structures with vascular components
    that mimic tissue niches will thus likely be necessary. Here we consider emerging research creating human tissue mimics
    and provide some recommendations for moving the field forward.'
  - 'Roles for MicroRNAs in Conferring Robustness to Biological Processes

    Biological systems use a variety of mechanisms to maintain their functions in the face of environmental and genetic perturbations.
    Increasing evidence suggests that, among their roles as posttranscriptional repressors of gene expression, microRNAs (miRNAs)
    help to confer robustness to biological processes by reinforcing transcriptional programs and attenuating aberrant transcripts,
    and they may in some network contexts help suppress random fluctuations in transcript copy number. These activities have
    important consequences for normal development and physiology, disease, and evolution. Here, we will discuss examples and
    principles of miRNAs that contribute to robustness in animal systems.'
  - 'Paraneoplastic thrombocytosis: the secrets of tumor self-promotion.

    Paraneoplastic thrombocytosis is associated with many solid tumors and often correlates with reduced survival. Recent
    studies suggest that a pathogenic feed back loop may be operative between platelets and tumor cells, with reciprocal interactions
    between tumor growth/metastasis and thrombocytosis/platelet activation. Specific molecular pathways have been identified
    in which tumors can stimulate platelet production and activation; activated platelets can, in turn, promote tumor growth
    and metastasis. Taken together, these findings provide exciting new potential targets for therapeutic intervention.'
- source_sentence: Mitochondria play a major role in apoptosis.
  sentences:
  - 'The EMBL nucleotide sequence database.

    The EMBL Nucleotide Sequence Database (http://www.ebi.ac.uk/embl. html ) constitutes Europe''s primary nucleotide sequence
    resource. DNA and RNA sequences are directly submitted from researchers and genome sequencing groups and collected from
    the scientific literature and patent applications (Fig. 1). In collaboration with DDBJ and GenBank the database is produced,
    maintained and distributed at the European Bioinformatics Institute. Database releases are produced quarterly and are
    distributed on CD-ROM. EBI''s network services allow access to the most up-to-date data collection via Internet and World
    Wide Web interface, providing database searching and sequence similarity facilities plus access to a large number of additional
    databases.'
  - 'Human somatic cell nuclear transfer using adult cells.

    Derivation of patient-specific human pluripotent stem cells via somatic cell nuclear transfer (SCNT) has the potential
    for applications in a range of therapeutic contexts. However, successful SCNT with human cells has proved challenging
    to achieve, and thus far has only been reported with fetal or infant somatic cells. In this study, we describe the application
    of a recently developed methodology for the generation of human ESCs via SCNT using dermal fibroblasts from 35- and 75-year-old
    males. Our study therefore demonstrates the applicability of SCNT for adult human cells and supports further investigation
    of SCNT as a strategy for regenerative medicine.'
  - 'Mitochondria: Dynamic Organelles in Disease, Aging, and Development

    Mitochondria are the primary energy-generating system in most eukaryotic cells. Additionally, they participate in intermediary
    metabolism, calcium signaling, and apoptosis. Given these well-established functions, it might be expected that mitochondrial
    dysfunction would give rise to a simple and predictable set of defects in all tissues. However, mitochondrial dysfunction
    has pleiotropic effects in multicellular organisms. Clearly, much about the basic biology of mitochondria remains to be
    understood. Here we discuss recent work that suggests that the dynamics (fusion and fission) of these organelles is important
    in development and disease.'
