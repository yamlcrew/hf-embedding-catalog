widgetData:
- source_sentence: el nio and la nia make a cycle called the los nios oscillation.
  sentences:
  - Short-term changes in climate are common and they have many causes (Figure 1.1). The largest and most important of these
    is the oscillation between El Nio and La Nia conditions. This cycle is called the ENSO (El Nio Southern Oscillation).
    The ENSO drives changes in climate that are felt around the world about every two to seven years.
  - 'Your respiratory system is made up of the tissues and organs that allow oxygen to enter your body and carbon dioxide
    to leave your body. Organs in your respiratory system include your: Nose. Mouth. Larynx. Pharynx. Lungs. Diaphragm. The
    organs of the respiratory system move air into and out of the body. These structures are shown below (Figure 1.1). What
    do you think is the purpose of each of these organs? The nose and the nasal cavity filter, warm, and moisten the air you
    breathe. The nose hairs and the mucus produced by the cells in the nose catch particles in the air and keep them from
    entering the lungs. Behind the nasal cavity, air passes through the pharynx, a long tube. Both food and air pass through
    the pharynx. The larynx, also called the "voice box," is found just below the pharynx. Your voice comes from your larynx.
    Air from the lungs passes across thin tissues in the larynx and produces sound. The trachea, or windpipe, is a long tube
    that leads down to the lungs, where it divides into the right and left bronchi. The bronchi branch out into smaller bronchioles
    in each lung. There is small flap called the epiglottis that covers your trachea when you eat or drink. The muscle controlling
    the epiglottis is involuntary and prevents food from entering your lungs or wind pipe. The bronchioles lead to the alveoli.
    Alveoli are the little sacs at the end of the bronchioles (Figure 1.2). They look like little bunches of grapes. Oxygen
    is exchanged for carbon dioxide in the alveoli. That means oxygen enters the blood, and carbon dioxide moves out of the
    blood. The gases are exchanged between the blood and alveoli by simple diffusion. The diaphragm is a sheet of muscle that
    spreads across the bottom of the rib cage. When the diaphragm contracts, the chest volume gets larger, and the lungs take
    in air. When the diaphragm relaxes, the chest volume gets smaller, and air is pushed out of the lungs. "Grape-like" alveoli
    in the lungs.'
  - Youve probably heard of El Nio and La Nia. These terms refer to certain short-term changes in climate. The changes are
    natural and occur in cycles. To understand the changes, you first need to know what happens in normal years. This is shown
    in Figure 17.24.
- source_sentence: _The body of a roundworm has a tough covering of cuticle.
  sentences:
  - Ponds are small bodies of fresh water that usually have no outlet; ponds are often are fed by underground springs. Like
    lakes, ponds are bordered by hills or low rises so the water is blocked from flowing directly downhill.
  - Roundworms have a round body because they have a partial fluid-filled body cavity (pseudocoelom). This is one way that
    roundworms differ from flatworms. Another way is their complete digestive system. It allows them to eat, digest food,
    and eliminate wastes all at the same time. Roundworms have a tough covering of cuticle on the surface of their body. It
    prevents their body from expanding. This allows the buildup of fluid pressure in their partial body cavity. The fluid
    pressure adds stiffness to the body. This provides a counterforce for the contraction of muscles, allowing roundworms
    to move easily over surfaces.
  - 1. Unlike the flatworms, the roundworms have a body cavity with internal organs. 2. A roundworm has a complete digestive
    system, which includes both a mouth and an anus. This is a significant difference from the incomplete digestive system
    of flatworms. The roundworm digestive system also include a large digestive organ known as the gut. Digestive enzymes
    that start to break down food are produced here. There is no stomach, but there is an intestine which produces enzymes
    that help absorb nutrients. The last portion of the intestine forms a rectum, which expels waste through the anus. 3.
    Roundworms also have a simple nervous system with a primitive brain. There are four nerves that run the length of the
    body and are connected from the top to the bottom of the body. At the anterior end of the animal (the head region), the
    nerves branch from a circular ring which serves as the brain. The head of a nematode has a few tiny sense organs, including
    chemoreceptors, which sense chemicals. Though still a relatively simple structure, the nervous system of roundworms is
    very different from that of the cnidarian nerve net.
- source_sentence: the water in a wave travels across the ocean to end up on a shoreline.
  sentences:
  - Electromagnetic radiation occurs in waves of different wavelengths and frequencies. Infrared light and visible light make
    up just a small part of the full range of electromagnetic radiation, which is called the electromagnetic spectrum. The
    electromagnetic spectrum is summarized in the diagram in Figure 21.7. On the far left of the diagram are radio waves,
    which include microwaves. They have the longest wavelengths and lowest frequencies of all electromagnetic waves. They
    also have the least amount of energy. On the far right are X rays and gamma rays. The have the shortest wavelengths and
    highest frequencies of all electromagnetic waves. They also have the greatest amount of energy. Between these two extremes,
    wavelength, frequency, and energy change continuously from one side of the spectrum to the other. Waves in this middle
    section of the electromagnetic spectrum are commonly called light. As you will read below, the properties of electromagnetic
    waves influence how the different waves behave and how they can be used.
  - Most ocean waves are caused by winds. A wave is the transfer of energy through matter. A wave that travels across miles
    of ocean is traveling energy, not water. Ocean waves transfer energy from wind through water. The energy of a wave may
    travel for thousands of miles. The water itself moves very little. Figure 14.9 shows how water molecules move when a wave
    goes by.
  - Ocean waves originate from wind blowing - steady winds or high storm winds - over the water. Sometimes these winds are
    far from where the ocean waves are seen. What factors create the largest ocean waves? The largest wind waves form when
    the wind is very strong blows steadily for a long time blows over a long distance The wind could be strong, but if it
    gusts for just a short time, large waves wont form. Wind blowing across the water transfers energy to that water. The
    energy first creates tiny ripples, which make an uneven surface for the wind to catch so that it may create larger waves.
    These waves travel across the ocean out of the area where the wind is blowing. Remember that a wave is a transfer of energy.
    Do you think the same molecules of water that start out in a wave in the middle of the ocean later arrive at the shore?
    The molecules are not the same, but the energy is transferred across the ocean.
- source_sentence: In industry, water is used for
  sentences:
  - Almost a quarter of the water used worldwide is used in industry. Industries use water for many purposes. Chemical processes
    need a lot of water. Water is used to generate electricity. An important way that industries use water is to cool machines
    and power plants.
  - 'Beta decay occurs when an unstable nucleus emits a beta particle and energy. A beta particle is an electron. It has a
    charge of -1. In nuclear equations, a beta particle is represented by the symbol 01 e. The subscript -1 represents the
    particles charge, and the superscript 0 shows that the particle has virtually no mass. Nuclei contain only protons and
    neutrons, so how can a nucleus emit an electron? A neutron first breaks down into a proton and an electron (see Figure
    11.7). Then the electron is emitted from the nucleus, while the proton stays inside the nucleus. The proton increases
    the atomic number by one, thus changing one element into another. An example of beta decay is the decay of thorium-234
    to protactinium-234. In this reaction, thorium loses a neutron and gains a proton to become protactinium. The reaction
    can be represented by this equation: 234 90 Th !234 91 Pa + 0 1 e + Energy The protactinium-234 produced in this reaction
    is radioactive and decays to another element. The electron produced in the reaction (plus another electron) can combine
    with an alpha particle to form helium. Problem Solving Problem: Fill in the missing subscript and superscript in this
    nuclear equation: 131 I 53 !?? Xe + 14 C ? !?7 N + Solution: The subscript is 54, and the superscript is 131. 0 e + Energy
    1 You Try It! Problem: Fill in the missing subscript and superscript in this nuclear equation: 0 e + Energy 1'
  - Industrial water use accounts for an estimated 15% of worldwide water use, with a much greater percentage in developed
    nations. Industrial uses of water include power plants that use water to cool their equipment and oil refineries that
    use water for chemical processes. Manufacturing is also water intensive.
- source_sentence: A map in which all the lines of latitude and longitude are straight lines is a
  sentences:
  - In addition to sunlight, aquatic producers also need dissolved oxygen and nutrients. Water near the surface generally
    contains more dissolved oxygen than deeper water. Many nutrients enter the water from the land. Therefore, water nearer
    shore usually contains more dissolved nutrients than water farther from shore.
  - 'Topographic maps represent the locations of geographical features, such as hills and valleys. Topographic maps use contour
    lines to show different elevations. A contour line is a line of equal elevation. If you walk along a contour line you
    will not go uphill or downhill. Topographic maps are also called contour maps. The rules of topographic maps are: Each
    line connects all points of a specific elevation. Contour lines never cross since a single point can only have one elevation.
    Every fifth contour line is bolded and labeled. Adjacent contour lines are separated by a constant difference in elevation
    (such as 20 ft or 100 ft). The difference in elevation is the contour interval, which is indicated in the map legend.
    Scales indicate horizontal distance and are also found on the map legend. Old Faithful erupting, Yellowstone Na- tional
    Park. While the Figure 1.1 isnt exactly the same view as the map at the top of this concept, it is easy to see the main
    features. Hills, forests, development, and trees are all seen around Old Faithful.'
  - Most maps use a grid of lines to help you to find your location. This grid system is called a geographic coordinate system.
    Using this system you can define your location by two numbers, latitude and longitude. Both numbers are angles between
    your location, the center of Earth, and a reference line (Figure 2.20).
