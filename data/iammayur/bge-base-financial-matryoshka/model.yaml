widgetData:
- source_sentence: A hypothetical 50% decrease in short-term interest rates would decrease our annual pre-tax earnings by
    $15 million as of December 31, 2023, assuming no change in the amount or composition of our cash and cash equivalents
    and short-term and long-term restricted cash and cash equivalents.
  sentences:
  - What progress was made in 2023 at the Research Triangle Park production site in North Carolina?
  - What financial impact would a 50% decrease in short-term interest rates have on the company's annual pre-tax earnings
    as of December 31, 2023?
  - What are the requirements for Bermuda domiciled subsidiaries under the Insurance Act regarding financial reporting?
- source_sentence: Copies of AbbVie's Annual Reports on Form 10-K, Quarterly Reports on Form 10-Q, Current Reports on Form
    8-K and amendments to those reports are available free of charge through AbbVie's investor relations website (investors.abbvie.com)
    as soon as reasonably practicable after AbbVie electronically files the material with, or furnishes it to, the Securities
    and Exchange Commission (SEC).
  sentences:
  - What accounting method is predominantly used to determine inventory costs in the Company's supermarket divisions before
    LIFO adjustments?
  - How quickly are filed reports available on AbbVie's investor relations website after submission to the SEC?
  - What factors contributed to the determination of talc litigation as a critical audit matter?
- source_sentence: Because Monroe is able to blend only a small amount of renewable fuels, it must purchase the majority of
    its RINs requirement in the secondary market. Renewable fuel compliance costs are accrued in accounts payable each period
    as the RINs obligation is generated. Purchased RINs are carried at the lower of cost and net realizable value and are
    recorded in prepaid expenses and other.
  sentences:
  - How does Monroe handle its Renewable Identification Numbers (RINs) obligations?
  - What are the two main categories into which Ford Motor Company classifies its costs and expenses, excluding those related
    to Ford Credit?
  - What triggers a quantitative impairment test for a company?
- source_sentence: Throughout the period, the goodwill value maintained a constant value of $69,021 before a slight decrease
    to $69,022.
  sentences:
  - When does Chevron's interest in the Lianzi Unitization Zone expire?
  - What factors contribute to the seasonality of the hospitality industry?
  - How did the goodwill value change over the period in the data provided?
- source_sentence: Cost of sales for the company was $5,920.5 million in 2022, up from $4,922.7 million in 2021, which represents
    a 20.3% increase. This included $767.7 million of unfavorable costs driven by higher sales volume and increased supply
    chain inflation costs, including logistics and labor.
  sentences:
  - What were the main components of the increased cost of sales in 2022 compared to 2021?
  - How much is the service fee on client cash deposits held at the TD Depository Institutions under the 2023 IDA agreement?
  - What is the primary method by which the company manages its cash, cash equivalents, and marketable securities?
