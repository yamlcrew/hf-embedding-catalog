  - What was the total pre-tax restructuring expense associated with the Orthopaedics franchise in 2023?
  - What was the percentage change in net revenues for the Consumer Products segment from 2022 to 2023?
- source_sentence: Our cash and investments were $4.2 billion and $3.5 billion as of October 1, 2023 and October 2, 2022,
    respectively.
  sentences:
