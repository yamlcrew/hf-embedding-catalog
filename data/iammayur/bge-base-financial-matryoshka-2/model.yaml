- source_sentence: Allowance for credit losses is based on the Company’s best estimate of probable losses inherent in its
    accounts receivable portfolio and is determined based on expectations of the customer’s ability to pay by considering
    factors such as customer type (commercial or government), historical experience, financial position of the customer, age
    of the accounts receivable, current economic conditions, and reasonable and supportable forward-looking factors about
    its portfolio and future economic conditions.
  sentences:
