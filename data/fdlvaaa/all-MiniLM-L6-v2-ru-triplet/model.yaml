- source_sentence: С 19 декабря 2014 по 16 марта 2016 года являлся заместителем акима г. Астана.
  sentences:
  - Прохладные места ему нравятся, почвы слабо кислые или нейтральные, не очень требователен к почвам.
  - Являлся заместителем акима г. Астана с 19 декабря 2014 по 16 марта 2016 года.
  - Никогда не был заместителем акима г. Астана.
- source_sentence: Вновь игроку предстоит управлять действиями сверхчеловека, Коула МакГрата, получившего способность управлять
    электричеством при взрыве «лучевой сферы».
  sentences:
  - Широкие у талии штаны и рубашка европейского покроя - это классическая мужская одежда.
  - Игрок больше не сможет управлять действиями сверхчеловека, Коула МакГрата, который потерял способность управлять электричеством
    после взрыва «лучевой сферы».
  - Игроку снова придется управлять поступками сверхчеловека, Коула МакГрата, который получил способность манипулировать электричеством
    после взрыва «лучевой сферы».
- source_sentence: Дире́ктор (от  — от "di" и "regere" — «управлять», мн. ч. — директора́; устар. жен. — директриса) — управляющий,
    руководитель, начальник компании, предприятия или учебного заведения.
  sentences:
  - В возрасте трёх лет, Муад’Диб в битве за власть над Арракисом, убил барона Владимира Харконнена гом джаббаром Атрейдесов.
  - Работник (от  — от "di" и "regere" — «управлять», мн. ч. — работники; устар. жен. — работница) — подчинённый, исполнитель,
    служащий компании, предприятия или учебного заведения.
  - Управляющий (от  — от "di" и "regere" — «управлять», мн. ч. — управляющие; устар. жен. — управляющая) — директор, руководитель,
    начальник компании, предприятия или учебного заведения.
- source_sentence: Чтобы хоть как-то обезопасить себя, гитлеровцы посадили за руль автомашин советских военнопленных.
  sentences:
  - Генеральный директор Национального медико-хирургического центра имени Н. И. Пирогова с 2006 года и по сегодняшний день.
  - Гитлеровцы посадили за руль автомашин советских военнопленных, чтобы обезопасить себя хоть как-то.
  - Гитлеровцы не обезопасили себя, посадив за руль автомашин советских военнопленных.
- source_sentence: 'Данные по статусу эксплуатации и распределению составов по номерам по состоянию на июль 2018 года приведены
    в таблице: Первые два электропоезда ЭШ2 в конце 2014 года поступили в депо имени Ильича и вскоре были отправлены для проведения
    опытных поездок на кольцо ВНИИЖТа в Щербинке.'
  sentences:
  - У истока ручья Ольшанец, впадающего в реку Залегощь, находится в 12 км от райцентра Залегощи.
  - 'Данные по статусу эксплуатации и распределению составов по номерам по состоянию на июль 2018 года не указаны в таблице:
    Первые два электропоезда ЭШ2 в конце 2014 года не были отправлены в депо имени Ильича и не совершали опытных поездок на
    кольцо ВНИИЖТа в Щербинке.'
  - 'В таблице представлены данные о состоянии эксплуатации и распределении составов по номерам на июль 2018 года: Первые
    два поезда ЭШ2 были доставлены в депо имени Ильича в конце 2014 года и затем отправлены на кольцо ВНИИЖТа в Щербинке для
    проведения тестовых поездок.'
