widgetData:
- source_sentence: 'search_query: contract language covering Covenant Not To Sue'
  sentences:
  - 'search_document: A promise that a court would not enforce by injunction can still be valid consideration and be part
    of a valid contract. Failure to carry out such obligations would lead to some measure of money damages, most likely. On
    the other hand, provisions specifically barred by law, or against public policy, such as a promise to commit a crime,
    are void from the start, and form no part of a valid contract. Such provisions may be treated by a court as if they had
    just been left out, or if they were essential to the contract, or formed the sole consideration, the whole contract might
    be considered void. If a term is too vague for a court to determine if it has been violated or not, the court may try
    to clarify it, or may just ignore it. Just what it would mean for a tenant to "undermine the leadership" of a landlord
    is not clear to me, at least. That might well be held to be "too vague". As to "not complain" it may be that a tenant
    has a legal right to make official complaints, which cannot be waived by contract. Or it may not, depending on the local
    laws.'
  - 'search_document: Doing nothing is legally safer than doing something, but you''re not without hope if you pull the lever.
    Although you''ll likely have committed murder or at least manslaughter, case law is littered with lenience in exigent
    circumstances, even where convictions have been affirmed. Because this is a philosophical problem, there are plenty of
    opinions from that perspective, but not so many from a legal standpoint. Let''s assume that you''re an innocent bystander,
    (not an employee of the railway company or the train company, etc) and have no duty to act. If you do nothing, then it
    is unlikely that you would be charged with a crime - you had no duty to fulfill, and therefore not negligent. There''s
    little doubt that not pulling the lever is the safer option. More interesting is when you choose to pull the lever - then
    it''s probable that you would have charges of murder, or at least manslaughter, brought against you by the state. What
    defenses does the law offer? Let''s assume that you are aware that pulling the lever will kill a person. The primary defence
    is a legal principle of necessity : where your criminal actions are not protected or excluded by some other statute or
    principle, the fact that you were obliged to take this action in order to prevent some greater harm may safeguard you
    from penalties. There are certain elements of necessity: That you did not create the danger that caused you to commit
    the crime; That you ceased the criminal activity as soon as practicably possible; That you had no reasonable alternative;
    and The harm that you prevented was greater than the harm that you caused. I see such a defense only possibly falling
    over on (4), where the prevented and caused harm, in the case of human lives, are inherently very subjective. Unfortunately,
    each state has different rulings regarding the threshold for evidence of this defense. One of the most famous cases where
    necessity was attempted as a defense to murder, with remarkable parallels to this hypothetical, '
  - 'search_document: Monsanto further agrees that it will in no way dispute, impugn or attack the validity of said Canada
    Marks or OMS Investments, Inc.''s or the Agent''s rights thereto.'
- source_sentence: 'search_query: Is storing business data considered personal data? I want to create an online application.
    The visitor could enter his website URL then the application will make some analysis. The application asks the visitor
    if he wants a regular website report on e-mail. I don''t want to store personal data as I don''t want to write a consent
    or something else. So I will request the visitor to enter a (non personal e-mail address) business e-mail address like
    "admin@example.com" or "mywebsite@yahoo.com" to send the report to. This should not be considered personal data, right?
    Some tips? Thank you so much!'
  sentences:
  - 'search_document: The accepted answer is wrong. The way of getting the data doesn''t matter in light of the GDPR. Whilst
    it is true that it has to be personal data (about individuals residing in the EU), personal has a very broad meaning (more
    examples ). It is true that info@company.com is not personal data. However, when the user can be identified it is personal
    data, even if no explicit names are used (eg. cto@company.com). Moreover, if you process any data that indirectly make
    a person identifiable (eg. location data, ip-address, certain id''s, device id''s, ...), it will also be personal data.
    In any case, in no way does a user entering information against your directions lift your duty to comply with the GDPR.
    Because, the moment you process personal data (the way you got it doesn''t matter) GDPR is applicable. And processing
    is a very broad concept under GDPR (more examples ). Even ''shredding documents containing personal data'' is processing.
    So, the moment data "passes through your code", you are processing data. Obviously, the risks will differ with different
    kinds of processing, but that''s a risk that you have to assess (this is in fact an obligation under GDPR).'
  - 'search_document: In Australia, email addresses, like street addresses are not personal information and are not protected
    by the Privacy Act (which doesn''t cover all businesses in any event)'
  - 'search_document: Should MMI not supply the Services as agreed or should the Services become defective within 6 months
    from their delivery to Dragon Systems, Dragon Systems may at its option require MMI to complete or re-perform the Services
    within a reasonable period of time, rescind the contract or refuse payment of the compensation in part or in total, notwithstanding
    any damage claims.'
- source_sentence: 'search_query: Find the Non-Disparagement provision in this contract'
  sentences:
  - 'search_document: Any assignment or other disposition in violation of the preceding sentence shall be void.'
  - 'search_document: I think that you are referring to the prevention doctrine also known as the performance doctrine of
    the common law of contracts. Prevention doctrine is a common-law principle of contract law which says that a contracting
    party has an implied duty not to do anything that prevents the other party from performing its obligation. A party who
    prevents performance of a contract may not complain of such nonperformance. The Restatement (Second) of Contracts § 245
    ("Effect of a Breach by Non-Performance As Excusing the Non-Occurrence Of a Condition") explains the doctrine as follows:
    Where a party''s breach by non-performance contributes materially to the non-occurrence of a condition of one of his duties,
    the non-occurrence is excused. See, e.g., Meson v. GATX Tech. Servs. Corp. ( 507 F.3d 803, 806 (4th Cir. Md. 2007), Barnhill
    v. Veneman (In re Peanut Crop Ins. Litig.) , 524 F.3d 458 (4th Cir. 2008); General Datacomm Indus. v. Arcara (In re General
    Datacomm Indus.) , 407 F.3d 616, 626 (3d Cir. Del. 2005); Cox v. SNAP, Inc. , 859 F.3d 304, 308 (4th Cir. 2017) (quoting
    Moore Bros. Co. v. Brown & Root, Inc. , 207 F.3d 7171, 725 (4th Cir. 2000)); Haddon Hous Assocs v. United States , 711
    F.3d 1330, 1338 (Fed. Cir. 2013); Williston, § 39:4. The prevention doctrine involves concepts similar to the duty of
    good faith and fair dealing, but is a more specific application of the concept. The duty of good faith and fair dealing
    can also involve many other fact patterns that are outside the prevention doctrine. Usually, the frustration of purpose
    defense involves actions or events not caused by a party to the contract. The tort of tortious interference with contract
    generally involves a non-party''s action intended to interfere with the ability of one party to fulfill contractual obligations
    to another party, while the prevention doctrine applies to a party''s interference with the ability of a counter-party
    to the contract to perform the contract.'
  - 'search_document: Each of the HOF Entities or Constellation may terminate this Agreement at any time without liability
    if association with another Party could, in such Party''s reasonable opinion, materially damage its reputation or image
    or in the event a Party breaches Section 3.3 hereof, which breach is not cured within sixty (60).'
