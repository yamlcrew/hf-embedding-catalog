    FUTURE PROFITS, EXPENDITURES FOR PROMOTION OF ANY PRODUCT, OR OTHER COMMITMENTS IN CONNECTION WITH THE BUSINESS AND GOOD
    WILL OF DISTRIBUTOR.'
  - 'search_document: In addition, VerticalNet shall not now or in the future contest the validity of LeadersOnline''s ownership
    of its Intellectual Property; provided, however, that VerticalNet may contest the validity of LeadersOnline''s Intellectual
    Property in any proceeding brought against VerticalNet alleging infringement or misappropriation of LeadersOnline''s Intellectual
    Property.'
  - 'search_document: A promise that a court would not enforce by injunction can still be valid consideration and be part
    of a valid contract. Failure to carry out such obligations would lead to some measure of money damages, most likely. On
    the other hand, provisions specifically barred by law, or against public policy, such as a promise to commit a crime,
    are void from the start, and form no part of a valid contract. Such provisions may be treated by a court as if they had
    just been left out, or if they were essential to the contract, or formed the sole consideration, the whole contract might
    be considered void. If a term is too vague for a court to determine if it has been violated or not, the court may try
    to clarify it, or may just ignore it. Just what it would mean for a tenant to "undermine the leadership" of a landlord
    is not clear to me, at least. That might well be held to be "too vague". As to "not complain" it may be that a tenant
    has a legal right to make official complaints, which cannot be waived by contract. Or it may not, depending on the local
    laws.'
- source_sentence: 'search_query: What does this agreement say about License Grant?'
  sentences:
  - 'search_document: In the case of Ditfort, G.A. v Commissioner of Taxation [1988] FCA 490, the individual was unable to
    leave Australia because the Australian tax authorities had requested bankruptcy proceedings against him, which were opened
    by the Australian Federal Court. As a result, he was "bankrupted".'
  - 'search_document: Subject to the terms of this Agreement, Company grants Reseller the right to use and display the Company
    trademarks, tradenames and other designations of source, and proprietary notices, slogans, designs and distinct advertising
    as may appear on any documentation or other material with respect to Product ("Marks") with prior approval, that will
    not be unreasonable withheld.'
  - 'search_document: If the Option is exercised before the expiration of the Option Period, the license grants set forth
    in Articles 3.00 and 3.01 will become exclusive to Investor for a perpetual term, shall not be subject to a licensing
    fee, the granted licenses in favor of the Investor shall be deemed fully paid-up, and the rights granted to Investor under
    Articles 3.00 and 3.01 shall include the right to grant sublicenses to Third Parties.'
