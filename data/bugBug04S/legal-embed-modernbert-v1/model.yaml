      and less about laws around the world, but I would expect most if not all countries to prohibit the removal of antiquities
      without specific permission. I am also aware that one of the most important types of antiquity are pottery fragments,
      in terms of what we have learnt about history. I would expect a geologist with an interest in international archaeology
      to know more about laws regarding this than me. What are the "usual" laws about taking such items out of a country?
      Any relevant jurisdiction would be interesting, but the best answer would compare multiple jurisdictions to give any
      idea of what someone who was familiar with this field might justifiably expect the law to be.'
    sentences:
    - 'search_document: Here are examples from Tanzania , Kenya , Norway , Canada , and Iraq . See this article for an analysis
      of the myriad laws of Greece. The general situation is that there is no general situation, and it is necessary to read
      the law of the country, contemplating for all objects whether their export is allowed or forbidden. Many expressions
      are used to refer to restricted items, such as "cultural object", "monument", "antiquity". It turns out that paintings,
      boats and their parts that are older that 50 years old are on the list for Norway, but not Iraq. Tanzanian law is a
      bit flexible, in that "ethnographic objects" are on the list requiring a permit, defined as a think made by humans "for
      use in any social or cultural activity whether or not it is still being used by any community in Tanzania", regardless
      of age, "but does not include any object made, shaped, painted, carved, inscribed or otherwise produced or modified
      by human agency in Tanzania for sale as a curio " (because sale of tourist trinkets is big business in Tanzania). At
      times, an "informal export permit" can be required for goods of questionable provenance (for example, carved doors).
      Most often, the definition of restricted items is framed in terms of kind of item and age, for example ethnographic
      object in an African or Asian style from before 1940 (Tanzania), the aforementioned Norwegian items either "before 1950"
      or "more than 50 years old". Ignorance of the law is no excuse, nor is inability to guess what will be considered to
      have "cultural significance".'
    - 'search_document: The Internal Revenue Code found at Title 26 of the United States Code. Title 26 is the full compilation
      of all the laws passed by Congress relating to tax liability and every other legal obligation, definition, exemption,
      exception, etc. The Internal Revenue Code is the law that requires people to pay taxes and if you believe the folks
      who say it''s only a legal requirement as assessed, they''re wrong.'
    - 'search_document: Any municipality is fine In addition, they could get married in a different province and it would
      be a valid marriage in Ontario. They could also get married in a different country with which Canada has agreed to honour
      their marriages (i.e. most of them) unless they offend Canadian law (e.g. bigamy, child marriage etc.)'
  - source_sentence: 'search_query: Can I add a deadlock to the front door of my unit? I have recently bought a unit in a
      rough area. The front door to the apartment complex does not click shut properly so anyone from the general public can
      walk in. The door to my unit has one of those cheap push button door handle locks. I have spoken to the body corporate
      and the building manager and there are currently no plans to fix the apartment complex door. I asked about adding some
      more security to the door of my unit, namely a good quality (fire rated) deadlock. But they replied back that deadlocks
      are not permitted for fire and aesthetic reasons, even locks that are fire rated. What is the legality of prohibiting
      deadlocks? Are fire rated deadlocks permitted legally on fire exits? They mentioned something about fire safety laws
      changing in 2019 but I didn''t get a full understanding. Is this documented anywhere?'
    sentences:
    - 'search_document: Are the reasons (mom can''t stay because of covid-19 and the son is too young to live by himself)
      legally justifiable reasons? Unfortunately, not in this case. The landlord can prevail by arguing that the mom, insofar
      as a holder of a non-immigrant visa, knew or should have known of the risks of being denied entry in the US. In terms
      of the Restatement (Second) of Contracts at § 154 (a) & (b), the mom is the " Party [who] Bears the Risk of a Mistake
      ". Since the risks of which the mom was aware include even arbitrary ones such as the USCIS officer''s discretion ,
      an allegation of "supervening circumstances" as per the coronavirus crisis is very unlikely to add any merit to the
      mom''s legal position. Is the 8 months compensate reasonable? Although this is admittedly subjective, at first glance
      it appears reasonable or perhaps even generous (the landlord is proposing the midpoint: half of the remaining 16 months)
      considering that the landlord is entitled to the completion of the lease. The " 8 months as compensation " is essentially
      the landlord''s proposal to settle his otherwise viable claim of breach of contract . You as lease holders can always
      attempt to negotiate and make alternative proposals, which is what you are doing already . Here, the landlord seeks
      to obviate court proceedings that can be a drag for both him and especially for the mom because she would be unable
      even to present her arguments in court and/or quasi-judicial proceedings. A settlement would benefit the landlord also
      from the standpoint that he would no longer be required to prove mitigation of damages (if that is a requirement in
      his jurisdiction). And, unless the settlement provides otherwise, the landlord would be free to immediately re-rent
      the unit without having to reimburse the mom (or the person(s) whose name is in the lease). That being said, it is important
      for the lease holder(s) to secure in writing (specifically in the settlement document) a statement from the landlord
      in the sense t'
    - 'search_document: National Construction Code For Class 2 Buildings (apartments) the relevant volume is No 2. Door hardware
      on fire doors must comply with AS 1905.1 (Specification C3.4 Clause 2), that is, it has to be "fire-rated". There are
      plenty of fire-rated deadlocks available. Normally, a door in a path of travel to an exit cannot be key operated in
      the direction of travel, however, there are a number of exceptions. One is if it "serves only, or is within— (A) a sole-occupancy
      unit in a Class 2 building" - like yours. So there is no regulatory obstacle to this. Strata Law The door (and its hardware)
      is part of the common property - it belongs to the body corporate, not you. Technically, you own the paint on the inside,
      they own everything else. So, even if you paid for the lock, it would belong to the body-corporate and they would bear
      all the risk of loss and damage including if it wasn''t installed properly. They may be unwilling to take this risk.
      They can legally prevent you from doing anything to their property. However, you can insist that the body-corporate
      repair the front door. Having "no plans" is not an excuse for failing in their legal duty to repair and maintain the
      common property. If they refuse, you can use the dispute resolution process.'
    - 'search_document: As far as I can tell, whenever GitHub redistributes code, it adheres to all of the requirements of
      the GPL/BSD etc. For example, it never gives away code without including the license text, and it doesn''t claim to
      add unpermitted restrictions to the code. The section you''re concerned about is this: That means you''re giving us
      the right to do things like reproduce your content (so we can do things like copy it to our database and make backups);
      display it (so we can do things like show it to you and other users); modify it (so our server can do things like parse
      it into a search index); distribute it (so we can do things like share it with other users); and perform it (in case
      your content is something like music or video). That section isn''t worded very precisely, but I understand this to
      mean they want to reproduce your content in full , not just the code without the license text attached. They want to
      display your content in full , as you provided it. They want to modify it internally (i.e. they are not redistributing
      this modified form) in order to allow searching. To the extent that they display code-snippets as search results, that
      is likely defensible as fair use (search engines are frequently cited as examples of successful fair use defenses).
      GitHub appears to be acting consistently with the GPL when it reproduces, displays, modifies, and distributes code that
      you upload. If I''m correct about these facts then nothing that GitHub does with the code goes beyond what the many
      contributors to a GPL project have explicitly permitted, or what is otherwise permitted by fair use law. If you had
      some code with a more restrictive license, you might not be able to simultaneously comply with that restrictive license
      and GitHub''s License Grant. Consider the scenario where you have some code that is licensed exclusively to you, and
      you are not given permission to reproduce or distribute it. In that scenario, the code''s license prevents you from
      agreeing to GitHub''s reques'
