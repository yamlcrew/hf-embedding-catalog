- source_sentence: 'search_query: Can you "make" an insurer fix a total loss vehicle? In state of Missouri my friend was hit
    from behind. Driver that him stated to police that it was her fault - no issues with fault as this is in police report.
    He had an older car with body issues but the engine and maintenance was very well maintained. Meaning a junker that drove
    well. Bluebook value is 2.5-3k. He has 4-5k in damages. The problem is that the other driver''s insurance wants to give
    him 1400. Finding a car that runs similar to this car even with body damage is 4-6k and who really knows how it was maintained.
    So my question is, legally is there anything this party can do to make the insurance company fix the car vs. handing over
    a check for the total loss? It is my opinion that he is in a much much worse predicament than before an accident that
    was not his fault. Not sure how someone can cause an accident and put the victim in a worse situation but I am not sure
    on the legal recourse. Please let me know what other info you need.'
  sentences:
  - 'search_document: If you take away insurance, the basic legal rule is that if one person wrongfully causes damage to another,
    the wrong-doer can be compelled to make the other part "whole", that is, undo the damage that they caused. If you have
    an item of property that would cost $3,000 to fix or repair, then you could be compelled to pay for that repair or replacement.
    Even if it is decided that the wrong-doing party is entirely liable for the damage, there can be disputes over what that
    amount of damage actually is. "Bluebook" is one means of standardizing value, but it is not an actual legal definition
    of what a given car is worth. Really, it just depends on whose evidence about value is most persuasive. An insurance company
    is motivated to pay the least, and the aggrieved party is motivated to receive the maximum. A jury can weigh the arguments
    and decide on a figure. If indeed the cost of repair is objectively around $5,000 and the cost of replacement is similar,
    then a jury would most likely find that that is what the at-fault party is liable for. So the way to "force" an insurance
    company to increase their offer is to persuade them of two facts: that the costs really is about $5,000, and that you
    are willing to sue their client to recover that $5,000. An insurance company simply covers their client''s liability,
    so if the damage is $5,000, you don''t sue the insurance company to get more, you sue their client. You have no obligation
    to accept an offer from either the insurance company or from their client: but if you don''t accept some offer, you will
    have to sue the client to get anything. Bear in mind that in Missouri, they follow the theory of "comparative negligence"
    which means that if A is found to be 75% at fault and B is 25% at fault, A is liable for 75% of B''s losses. The police
    report does not decide that, rather that is determined by the trial. The police report is relevant to determining who
    gets a ticket, if anyone: civil liability is determined via a lawsuit. Puttin'
  - 'search_document: The relevant regulations in 49 CFR 1540 refer to weapons, not firearms, and unless you are specifically
    permitted, you cannot carry a weapon in your carry-on luggage. The interpretation of "weapon" is given here , which says
    Weapons are objects that may be used to attack another. TSA considers an item to be a weapon under 49 CFR 1540.111 if
    it is created for use as a weapon or is so similar to an item created as a weapon that it appears to be, or is easily
    used as, a weapon. Weapons include firearms, as well as realistic replicas of firearms that may reasonably be thought
    to be actual weapons. Such realistic replicas are prohibited because their similarity in appearance to real weapons may
    allow them to be used to intimidate passengers and flight crew. The screener has the discretion to determine when a replica
    is so realistic that it should be prohibited. Other toy weapons will be allowed in the sterile areas and cabin. Partial
    weapons and parts of weapons also are prohibited because they may be carried separately by collaborators for assembly
    subsequent to entry or boarding. In addition, partial weapons may appear to be operative and could be used to intimidate
    passengers and flight crew.'
  - 'search_document: Certainly in Australia it would be legal to ask; it would also be legal to discriminate on this basis
    (i.e. it is not discrimination on a protected basis). However, it would be culturally inappropriate. It is probably both
    legal and appropriate in Japan. It is worth noting that a great chunk of culturally inappropriate behavior is not illegal.
    For example, it would generally be legal for a current or previous employer who was not subject to the Privacy Act (most
    small business) to disclose your salary; they just don''t.'
- source_sentence: 'search_query: secretly recording a murder confession Let''s say you had an opportunity to secretly record
    an acquaintance confessing to a murder decades prior. Can/would it be used by police/courts? Are there certain things
    about the recording that would improve its usefulness? (Questions that should be asked/answered/avoided, specific recording
    methods, etc)'
  sentences:
  - 'search_document: Can you plead guilty to a crime, get probation and simultaneously avoid a conviction? Yes. In a deferred
    prosecution, there is not a conviction. If a defendant follows the terms of the program faithfully, the charges are dismissed
    and a guilty plea is never entered. It is a bit like a conviction with a probation sentence, but milder, because if you
    carry out the deferred prosecution terms you never receive a conviction and the associated collateral consequences of
    a conviction such as the one that you allude to in your question. Therefore, this individual would not be statutorily
    disqualified from purchasing an FDIC insured bank.'
  - 'search_document: Disclosure to police of an illegal recording is permitted by s. 193(2)(e), and in court by s. 193(2)(a).
    The recording could be excluded if the person who made the recording did so on behalf of police (to sidestep their obligation
    to obtain a warrant), but even then its importance as evidence may outweigh other Charter considerations.'
  - 'search_document: The major differences: MIT has a general "deal in the Software without restriction" clause, where Boost
    enumerates the things a user is permitted to do. For the sorts of things the average user is likely to want to use the
    software for, there may not be any practical difference, but the MIT license is considerably broader. A copy of the Boost
    license does not need to be included with an executable binary, while a copy of the MIT license does. The Boost disclaimer
    covers "anyone distributing the software" in addition to authors and copyright holders; the MIT license doesn''t. Other
    possible differences differences: A non-corporate-person organization may be unable to deal in MIT-licensed software as
    an organization, though I''m uncertain about this. You could probably keep an army of lawyers arguing about this point
    for years. The MIT license may not require including the disclaimer with the license statement. It''s unclear whether
    the disclaimer is part of "this permission notice" or not.'
- source_sentence: 'search_query: Limits of automated decision making WRT workplace surveys As part of the GDPR, if personal
    data is used for automated decision making a number of rules apply , particularly regarding consent and access to data.
    A number of companies offer workplace surveys, for example DJS Research . While they are not completely clear about what
    data processing they provide and the questions they attempt to answer, one would assume the goal is some sort of decision
    making, whether this is "donuts should be provided on Fridays" or "this department should be closed". Is this the sort
    of thing that constitutes automated decision making, such that the data subjects should be provided with details of what
    decisions are being made and using what data if they make a subject access request requesting such data?'
  sentences:
  - 'search_document: None The contractual chain is you warranty company (potentially others you don’t know about) service
    provider. Should something go wrong, you would sue your warranty company who might (it is up to them) then sue the service
    provider. Notwithstanding, it’s likely the service company owes you a duty of care and would be directly liable to you
    for a negligence claim.'
  - 'search_document: You are a resident of one state, and a non-resident of the other. Or you could be a "part-year resident"
    of both. Read the applicable personal tax rules for each state, or hire an accountant to do it for you. Note that, in
    the end, each dollar of income is only taxed by one state . It''s figuring out which state that gets tedious.'
  - 'search_document: Workplace surveys aren''t ATM, which is good because ATM wouldn''t be permissible in a workplace context.
    The GDPR''s concept of automated decision making (ADM) refers to decisions that are based solely on automated processing
    or profiling (without human review) and produce legal or otherwise significant effects with respect to the data subject.
    Such ADM is only legal if one of the following applies: The ADM is necessary for entering into or for performing a contract
    with the data subject.¹ For example, credit scoring might be covered by this. The ADM is authorized by specific UK/EU/member
    state laws that include suitable safeguards for the data subject. The ADM is based on the data subject''s explicit consent
    .¹ ¹ In the “contractual necessity” or “explicit consent” cases, the controller is required to implement suitable safeguards,
    and at the minimum a right to obtain human intervention so that the decision can be contested. From this list of permitted
    cases, it can be seen that an employment context does not generally allow ADM. Consent is typically impossible in an employment
    relationship. ADM is not necessary for performing the employment contract. In particular, there is no need for Taylorist/Amazonesque
    performance review systems that automatically terminate employment without human review if metrics aren''t met. However,
    it might be necessary to use automated skill tests as part of a hiring pipeline. Of course, the employer might always
    find some law that specifically authorizes ADM in the employment context. But workplace surveys aren''t ADM – they might
    be partially automated, but the survey doesn''t produce automated decisions. While such surveys might be one input into
    a decision that produces significant effects for the employees, such decisions would typically still be made by humans.
    The lawfulness of surveys instead depends on an ordinary Art 6(1) legal basis such as a legitimate interest.'
- source_sentence: 'search_query: What are the "usual" laws for taking antiquities? It is in the news that a British geologist
    has been sentenced to 15 years for "intentionally taking or trying to take out of Iraq an antiquity", specifically 12
    stones and shards of broken pottery which were in his and his college/friend possession as they attempted to leave the
    country. His main defense seems to be that he had no idea he was breaking Iraqi laws. I know very little about archaeology,
    and less about laws around the world, but I would expect most if not all countries to prohibit the removal of antiquities
    without specific permission. I am also aware that one of the most important types of antiquity are pottery fragments,
    in terms of what we have learnt about history. I would expect a geologist with an interest in international archaeology
    to know more about laws regarding this than me. What are the "usual" laws about taking such items out of a country? Any
    relevant jurisdiction would be interesting, but the best answer would compare multiple jurisdictions to give any idea
    of what someone who was familiar with this field might justifiably expect the law to be.'
  sentences:
  - 'search_document: Here are examples from Tanzania , Kenya , Norway , Canada , and Iraq . See this article for an analysis
    of the myriad laws of Greece. The general situation is that there is no general situation, and it is necessary to read
    the law of the country, contemplating for all objects whether their export is allowed or forbidden. Many expressions are
    used to refer to restricted items, such as "cultural object", "monument", "antiquity". It turns out that paintings, boats
    and their parts that are older that 50 years old are on the list for Norway, but not Iraq. Tanzanian law is a bit flexible,
    in that "ethnographic objects" are on the list requiring a permit, defined as a think made by humans "for use in any social
    or cultural activity whether or not it is still being used by any community in Tanzania", regardless of age, "but does
    not include any object made, shaped, painted, carved, inscribed or otherwise produced or modified by human agency in Tanzania
    for sale as a curio " (because sale of tourist trinkets is big business in Tanzania). At times, an "informal export permit"
    can be required for goods of questionable provenance (for example, carved doors). Most often, the definition of restricted
    items is framed in terms of kind of item and age, for example ethnographic object in an African or Asian style from before
    1940 (Tanzania), the aforementioned Norwegian items either "before 1950" or "more than 50 years old". Ignorance of the
    law is no excuse, nor is inability to guess what will be considered to have "cultural significance".'
  - 'search_document: The Internal Revenue Code found at Title 26 of the United States Code. Title 26 is the full compilation
    of all the laws passed by Congress relating to tax liability and every other legal obligation, definition, exemption,
    exception, etc. The Internal Revenue Code is the law that requires people to pay taxes and if you believe the folks who
    say it''s only a legal requirement as assessed, they''re wrong.'
  - 'search_document: Any municipality is fine In addition, they could get married in a different province and it would be
    a valid marriage in Ontario. They could also get married in a different country with which Canada has agreed to honour
    their marriages (i.e. most of them) unless they offend Canadian law (e.g. bigamy, child marriage etc.)'
- source_sentence: 'search_query: Can I add a deadlock to the front door of my unit? I have recently bought a unit in a rough
    area. The front door to the apartment complex does not click shut properly so anyone from the general public can walk
    in. The door to my unit has one of those cheap push button door handle locks. I have spoken to the body corporate and
    the building manager and there are currently no plans to fix the apartment complex door. I asked about adding some more
    security to the door of my unit, namely a good quality (fire rated) deadlock. But they replied back that deadlocks are
    not permitted for fire and aesthetic reasons, even locks that are fire rated. What is the legality of prohibiting deadlocks?
    Are fire rated deadlocks permitted legally on fire exits? They mentioned something about fire safety laws changing in
    2019 but I didn''t get a full understanding. Is this documented anywhere?'
  sentences:
  - 'search_document: Are the reasons (mom can''t stay because of covid-19 and the son is too young to live by himself) legally
    justifiable reasons? Unfortunately, not in this case. The landlord can prevail by arguing that the mom, insofar as a holder
    of a non-immigrant visa, knew or should have known of the risks of being denied entry in the US. In terms of the Restatement
    (Second) of Contracts at § 154 (a) & (b), the mom is the " Party [who] Bears the Risk of a Mistake ". Since the risks
    of which the mom was aware include even arbitrary ones such as the USCIS officer''s discretion , an allegation of "supervening
    circumstances" as per the coronavirus crisis is very unlikely to add any merit to the mom''s legal position. Is the 8
    months compensate reasonable? Although this is admittedly subjective, at first glance it appears reasonable or perhaps
    even generous (the landlord is proposing the midpoint: half of the remaining 16 months) considering that the landlord
    is entitled to the completion of the lease. The " 8 months as compensation " is essentially the landlord''s proposal to
    settle his otherwise viable claim of breach of contract . You as lease holders can always attempt to negotiate and make
    alternative proposals, which is what you are doing already . Here, the landlord seeks to obviate court proceedings that
    can be a drag for both him and especially for the mom because she would be unable even to present her arguments in court
    and/or quasi-judicial proceedings. A settlement would benefit the landlord also from the standpoint that he would no longer
    be required to prove mitigation of damages (if that is a requirement in his jurisdiction). And, unless the settlement
    provides otherwise, the landlord would be free to immediately re-rent the unit without having to reimburse the mom (or
    the person(s) whose name is in the lease). That being said, it is important for the lease holder(s) to secure in writing
    (specifically in the settlement document) a statement from the landlord in the sense t'
  - 'search_document: National Construction Code For Class 2 Buildings (apartments) the relevant volume is No 2. Door hardware
    on fire doors must comply with AS 1905.1 (Specification C3.4 Clause 2), that is, it has to be "fire-rated". There are
    plenty of fire-rated deadlocks available. Normally, a door in a path of travel to an exit cannot be key operated in the
    direction of travel, however, there are a number of exceptions. One is if it "serves only, or is within— (A) a sole-occupancy
    unit in a Class 2 building" - like yours. So there is no regulatory obstacle to this. Strata Law The door (and its hardware)
    is part of the common property - it belongs to the body corporate, not you. Technically, you own the paint on the inside,
    they own everything else. So, even if you paid for the lock, it would belong to the body-corporate and they would bear
    all the risk of loss and damage including if it wasn''t installed properly. They may be unwilling to take this risk. They
    can legally prevent you from doing anything to their property. However, you can insist that the body-corporate repair
    the front door. Having "no plans" is not an excuse for failing in their legal duty to repair and maintain the common property.
    If they refuse, you can use the dispute resolution process.'
  - 'search_document: As far as I can tell, whenever GitHub redistributes code, it adheres to all of the requirements of the
    GPL/BSD etc. For example, it never gives away code without including the license text, and it doesn''t claim to add unpermitted
    restrictions to the code. The section you''re concerned about is this: That means you''re giving us the right to do things
    like reproduce your content (so we can do things like copy it to our database and make backups); display it (so we can
    do things like show it to you and other users); modify it (so our server can do things like parse it into a search index);
    distribute it (so we can do things like share it with other users); and perform it (in case your content is something
    like music or video). That section isn''t worded very precisely, but I understand this to mean they want to reproduce
    your content in full , not just the code without the license text attached. They want to display your content in full
    , as you provided it. They want to modify it internally (i.e. they are not redistributing this modified form) in order
    to allow searching. To the extent that they display code-snippets as search results, that is likely defensible as fair
    use (search engines are frequently cited as examples of successful fair use defenses). GitHub appears to be acting consistently
    with the GPL when it reproduces, displays, modifies, and distributes code that you upload. If I''m correct about these
    facts then nothing that GitHub does with the code goes beyond what the many contributors to a GPL project have explicitly
    permitted, or what is otherwise permitted by fair use law. If you had some code with a more restrictive license, you might
    not be able to simultaneously comply with that restrictive license and GitHub''s License Grant. Consider the scenario
    where you have some code that is licensed exclusively to you, and you are not given permission to reproduce or distribute
    it. In that scenario, the code''s license prevents you from agreeing to GitHub''s reques'
