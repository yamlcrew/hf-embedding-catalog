widgetData:
- source_sentence: What are the AA systems called in Russian?
  sentences:
  - 'Non-English terms for air defence include the German Flak (Fliegerabwehrkanone, "aircraft defence cannon", also cited
    as Flugabwehrkanone), whence English flak, and the Russian term Protivovozdushnaya oborona (Cyrillic: Противовозду́шная
    оборо́на), a literal translation of "anti-air defence", abbreviated as PVO. In Russian the AA systems are called zenitnye
    (i.e. "pointing to zenith") systems (guns, missiles etc.). In French, air defence is called DCA (Défense contre les aéronefs,
    "aéronef" being the generic term for all kind of airborne device (airplane, airship, balloon, missile, rocket, etc.)).'
  - After setting up his workshop, Bell continued experiments based on Helmholtz's work with electricity and sound. He also
    modified a melodeon (a type of pump organ) so that it could transmit its music electrically over a distance. Once the
    family was settled in, both Bell and his father made plans to establish a teaching practice and in 1871, he accompanied
    his father to Montreal, where Melville was offered a position to teach his System of Visible Speech.
  - Beginning in February 1988, the Democratic Movement of Moldova (formerly Moldavia) organized public meetings, demonstrations,
    and song festivals, which gradually grew in size and intensity. In the streets, the center of public manifestations was
    the Stephen the Great Monument in Chişinău, and the adjacent park harboring Aleea Clasicilor (The "Alee of the Classics
    [of the Literature]"). On January 15, 1988, in a tribute to Mihai Eminescu at his bust on the Aleea Clasicilor, Anatol
    Şalaru submitted a proposal to continue the meetings. In the public discourse, the movement called for national awakening,
    freedom of speech, revival of Moldavian traditions, and for attainment of official status for the Romanian language and
    return to the Latin alphabet. The transition from "movement" (an informal association) to "front" (a formal association)
    was seen as a natural "upgrade" once a movement gained momentum with the public, and the Soviet authorities no longer
    dared to crack down on it.
- source_sentence: Which month and year did GQ feature Beyonce on its cover?
  sentences:
  - In September 2010, Beyoncé made her runway modelling debut at Tom Ford's Spring/Summer 2011 fashion show. She was named
    "World's Most Beautiful Woman" by People and the "Hottest Female Singer of All Time" by Complex in 2012. In January 2013,
    GQ placed her on its cover, featuring her atop its "100 Sexiest Women of the 21st Century" list. VH1 listed her at number
    1 on its 100 Sexiest Artists list. Several wax figures of Beyoncé are found at Madame Tussauds Wax Museums in major cities
    around the world, including New York, Washington, D.C., Amsterdam, Bangkok, Hollywood and Sydney.
  - 'The Canadian Armed Forces (CAF; French: Forces armées canadiennes, FAC), or Canadian Forces (CF) (French: les Forces
    canadiennes, FC), is the unified armed force of Canada, as constituted by the National Defence Act, which states: "The
    Canadian Forces are the armed forces of Her Majesty raised by Canada and consist of one Service called the Canadian Armed
    Forces."'
  - The salivary glands (element 30 in numbered diagram) in an insect's mouth produce saliva. The salivary ducts lead from
    the glands to the reservoirs and then forward through the head to an opening called the salivarium, located behind the
    hypopharynx. By moving its mouthparts (element 32 in numbered diagram) the insect can mix its food with saliva. The mixture
    of saliva and food then travels through the salivary tubes into the mouth, where it begins to break down. Some insects,
    like flies, have extra-oral digestion. Insects using extra-oral digestion expel digestive enzymes onto their food to break
    it down. This strategy allows insects to extract a significant proportion of the available nutrients from the food source.:31
    The gut is where almost all of insects' digestion takes place. It can be divided into the foregut, midgut and hindgut.
- source_sentence: Hellenism contrasts with what other similar concept of era?
  sentences:
  - Small-scale "expedition tourism" has existed since 1957 and is currently subject to Antarctic Treaty and Environmental
    Protocol provisions, but in effect self-regulated by the International Association of Antarctica Tour Operators (IAATO).
    Not all vessels associated with Antarctic tourism are members of IAATO, but IAATO members account for 95% of the tourist
    activity. Travel is largely by small or medium ship, focusing on specific scenic locations with accessible concentrations
    of iconic wildlife. A total of 37,506 tourists visited during the 2006–07 Austral summer with nearly all of them coming
    from commercial ships. The number was predicted to increase to over 80,000 by 2010.
  - On April 23, 2008, Dell announced the closure of one of its biggest Canadian call-centers in Kanata, Ontario, terminating
    approximately 1100 employees, with 500 of those redundancies effective on the spot, and with the official closure of the
    center scheduled for the summer. The call-center had opened in 2006 after the city of Ottawa won a bid to host it. Less
    than a year later, Dell planned to double its workforce to nearly 3,000 workers add a new building. These plans were reversed,
    due to a high Canadian dollar that made the Ottawa staff relatively expensive, and also as part of Dell's turnaround,
    which involved moving these call-center jobs offshore to cut costs. The company had also announced the shutdown of its
    Edmonton, Alberta office, losing 900 jobs. In total, Dell announced the ending of about 8,800 jobs in 2007–2008 — 10%
    of its workforce.
  - '"Hellenistic" is a modern word and a 19th-century concept; the idea of a Hellenistic period did not exist in Ancient
    Greece. Although words related in form or meaning, e.g. Hellenist (Ancient Greek: Ἑλληνιστής, Hellēnistēs), have been
    attested since ancient times, it was J. G. Droysen in the mid-19th century, who in his classic work Geschichte des Hellenismus,
    i.e. History of Hellenism, coined the term Hellenistic to refer to and define the period when Greek culture spread in
    the non-Greek world after Alexander’s conquest. Following Droysen, Hellenistic and related terms, e.g. Hellenism, have
    been widely used in various contexts; a notable such use is in Culture and Anarchy by Matthew Arnold, where Hellenism
    is used in contrast with Hebraism.'
- source_sentence: What organization is the FBI a subset of?
  sentences:
  - The Federal Bureau of Investigation (FBI) is the domestic intelligence and security service of the United States, which
    simultaneously serves as the nation's prime federal law enforcement organization. Operating under the jurisdiction of
    the U.S. Department of Justice, FBI is concurrently a member of the U.S. Intelligence Community and reports to both the
    Attorney General and the Director of National Intelligence. A leading U.S. counterterrorism, counterintelligence, and
    criminal investigative organization, FBI has jurisdiction over violations of more than 200 categories of federal crimes.
  - The last use of the firing squad between 1608 and the moratorium on judicial executions between 1967 and 1977 was when
    Utah shot James W. Rodgers on March 30, 1960. The last use of the gallows between 1608 and the moratorium was when Kansas
    hanged George York on June 22, 1965. The last use of the electric chair between the first electrocution on August 6, 1890
    and the moratorium was when Oklahoma electrocuted James French on August 10, 1966. The last use of the gas chamber between
    the first gassing on February 8, 1924 and the moratorium was when Colorado gassed Luis Monge on June 2, 1967.
  - In mid May 1967, the Soviet Union issued warnings to Nasser of an impending Israeli attack on Syria, although Chief of
    Staff Mohamed Fawzi considered the warnings to be "baseless". According to Kandil, without Nasser's authorization, Amer
    used the Soviet warnings as a pretext to dispatch troops to Sinai on 14 May, and Nasser subsequently demanded UNEF's withdrawal.
    Earlier that day, Nasser received a warning from King Hussein of Israeli-American collusion to drag Egypt into war. The
    message had been originally received by Amer on 2 May, but was withheld from Nasser until the Sinai deployment on 14 May.
    Although in the preceding months, Hussein and Nasser had been accusing each other of avoiding a fight with Israel, Hussein
    was nonetheless wary that an Egyptian-Israeli war would risk the West Bank's occupation by Israel. Nasser still felt that
    the US would restrain Israel from attacking due to assurances that he received from the US and Soviet Union. In turn,
    he also reassured both powers that Egypt would only act defensively.
- source_sentence: What is the modern name for the West Saxon dialect of Alfred's time?
  sentences:
  - Each of these four dialects was associated with an independent kingdom on the island. Of these, Northumbria south of the
    Tyne, and most of Mercia, were overrun by the Vikings during the 9th century. The portion of Mercia that was successfully
    defended, and all of Kent, were then integrated into Wessex under Alfred the Great. From that time on, the West Saxon
    dialect (then in the form now known as Early West Saxon) became standardised as the language of government, and as the
    basis for the many works of literature and religious materials produced or translated from Latin in that period.
  - Education in Switzerland is very diverse because the constitution of Switzerland delegates the authority for the school
    system to the cantons. There are both public and private schools, including many private international schools. The minimum
    age for primary school is about six years in all cantons, but most cantons provide a free "children's school" starting
    at four or five years old. Primary school continues until grade four, five or six, depending on the school. Traditionally,
    the first foreign language in school was always one of the other national languages, although recently (2000) English
    was introduced first in a few cantons.
  - At the dawn of the Grand Lodge era, during the 1720s, James Anderson composed the first printed constitutions for Freemasons,
    the basis for most subsequent constitutions, which specifically excluded women from Freemasonry. As Freemasonry spread,
    continental masons began to include their ladies in Lodges of Adoption, which worked three degrees with the same names
    as the men's but different content. The French officially abandoned the experiment in the early 19th century. Later organisations
    with a similar aim emerged in the United States, but distinguished the names of the degrees from those of male masonry.
