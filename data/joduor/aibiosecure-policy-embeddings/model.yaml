- source_sentence: What does policy say about documenting scientific integrity and validation context for AI?
  sentences:
  - Legal and regulatory requirements involving AI are understood, managed, and documented as part of organizational governance.
  - Scientific integrity and TEVV considerations are identified and documented for the AI system's intended context of use.
  - Scientific integrity and TEVV considerations are identified and documented for the AI system's intended context of use.
- source_sentence: What does policy say about vetting suppliers and screening DNA synthesis orders?
  sentences:
  - Access to select-agent inventories and sensitive biological data shall require multi-factor authentication and role-based
