      क्योंकि इसका तापमान वर्ष में नौ महीनों से ज्यादा समय तक 0° सेल्सियस (32° फेरेनहाइट) या उससे नीचे रहता है और अगस्त से
      सितंबर के बीच के समय को छोड़कर यह जमा रहता है। इसकी अन्य विशेषताओं में इसके पानी की कम लवणता, वनस्पति, जीवों और मानव
