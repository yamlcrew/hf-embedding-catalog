  - '# CHI TIẾT THỦ TỤC HÀNH CHÍNH

    ## TRÌNH TỰ THỰC HIỆN

    ...

    - Ủy ban nhân dân cấp tỉnh tiếp nhận, kiểm tra tính hợp lệ của hồ sơ.

    + Trường hợp hồ sơ chưa đầy đủ, chưa đúng quy định về thành phần hồ sơ thì trong thời hạn 05 ngày làm việc kể từ ngày
    nhận được hồ sơ, Ủy ban nhân dân cấp tỉnh thông báo, hướng dẫn tổ chức, cá nhân bổ sung, hoàn thiện hồ sơ.

    + Ủy ban nhân dân cấp tỉnh thực hiện gia hạn giấy phép theo Mẫu 1g1 mục II Phụ lục I.3.2 ban hành kèm theo Nghị quyết
    số 66.18/2026/NQ-CP trong thời hạn 05 ngày làm việc kể từ ngày nhận đủ hồ sơ hợp lệ.'
