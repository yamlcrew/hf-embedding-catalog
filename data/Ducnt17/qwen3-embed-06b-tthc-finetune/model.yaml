  sentences:
  - '# CHI TIẾT THỦ TỤC HÀNH CHÍNH

    ## TRÌNH TỰ THỰC HIỆN

    - Tổ chức có yêu cầu cấp lại Giấy công nhận nộp 01 bộ hồ sơ theo quy định đến Bộ Khoa học và Công nghệ.

    - Trong thời hạn 05 ngày làm việc kể từ ngày nhận được hồ sơ, cơ quan có thẩm quyền công nhận có trách nhiệm trả lời tổ
    chức, cá nhân về tính hợp lệ của hồ sơ;

    - Trong thời hạn 15 ngày kể từ ngày nhận được hồ sơ hợp lệ, cơ quan có thẩm quyền công nhận xem xét cấp lại Giấy công
    nhận hoặc từ chối cấp lại.'
