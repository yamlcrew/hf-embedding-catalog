    Thời gian xét duyệt tối đa là 30 ngày kể từ ngày Quỹ tiếp nhận, kiểm tra tính đầy đủ, hợp lệ của hồ sơ đề xuất tham gia
    chương trình hỗ trợ voucher.

    3. Phê duyệt chương trình hỗ trợ voucher

    a) Trong thời hạn 10 ngày, trên cơ sở các Biên bản họp Hội đồng xét duyệt tại điểm c khoản 2 Điều 24 Nghị định số 268/2025/NĐ-CP
    và thương thảo với các đối tượng cung cấp sản phẩm mới, dịch vụ mới, Quỹ quyết định phê duyệt các chương trình hỗ trợ
    voucher và công bố công khai trên cổng thông tin điện tử của Quỹ.

    b) Căn cứ theo thực tế triển khai, nhu cầu của các bên, Quỹ có quyền điều chỉnh chương trình hỗ trợ voucher và các hợp
    đồng triển khai voucher đã ký kết với đối tượng cung cấp sản phẩm mới, dịch vụ mới.'
