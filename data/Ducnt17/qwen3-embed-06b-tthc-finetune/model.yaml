    Đối với nhiệm vụ khoa học và công nghệ bị đánh giá loại "Không đạt", Văn phòng Bộ căn cứ vào ý kiến tư vấn của Hội đồng
    về các lý do chủ quan, khách quan, phối hợp với các đơn vị có liên quan xác định số kinh phí phải hoàn trả ngân sách nhà
