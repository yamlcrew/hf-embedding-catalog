  - source_sentence: 'TITLE: COMT, MAOA, and SLC6A4 Polymorphisms and Inferior Alveolar Nerve Block Success The Relationship
      Between COMT, MAOA, and SLC6A4 Polymorphisms and the Success of Inferior Alveolar Nerve Block

      SUMMARY: The purpose of this study was to evaluate the association between COMT, MAOA, and SLC6A4 genetic polymorphisms
      and the success of inferior alveolar nerve block (IANB) in patients with symptomatic irreversible pulpitis in mandibular
      molars. Patients presenting with moderate to severe pain were enrolled. Before anesthesia, pain intensity was assessed
      using the Heft-Parker Visual Analog Scale (HP-VAS), and pulpal vitality was evaluated using cold and electric pulp tests.
      All participants received a standardized inferior alveolar nerve block with 4% articaine containing epinephrine. Fifteen
      minutes after injection, pulpal anesthesia was reassessed using cold and electric pulp tests. Patients who continued
      to respond to these tests were considered to have unsuccessful pulpal anesthesia and were excluded from the study. Patients
      with no response to either test were included in the study, and root canal treatment was initiated. Pain experienced
      during the procedure was assessed using the HP-VAS. Buccal swab samples were collected for genomic DNA isolation, and
      COMT, MAOA, and SLC6A4 polymorphisms were analyzed using a Real-Time PCR-based TaqMan genotyping assay. The association
      between genetic polymorphisms and the success of inferior alveolar nerve block was statistically evaluated.

      INCLUSION CRITERIA:

      Age between 15 and 60 years. American Society of Anesthesiologists (ASA) Physical Status I. Clinical diagnosis of symptomatic
      irreversible pulpitis in a mandibular molar requiring primary root canal treatment.

      Positive response to both the cold test and electric pulp test before treatment.

      Presence of pulpal bleeding upon access cavity preparation, confirming pulp vitality.

      Periodontal probing depth ≤3 mm. Sufficient coronal tooth structure to allow rubber dam isolation. No use of nonsteroidal
      anti-inflammatory drugs (NSAIDs) within 12 hours before enrollment.

      No known allergy or hypersensitivity to articaine or epinephrine. No history of systemic or genetic disease. Ability
      and willingness to provide written informed consent.'
    sentences:
    - Are patients under 18 years old eligible to participate in this clinical trial?
    - Would a child aged 8 undergoing an elective tonsillectomy qualify for this study?
    - Could I participate in this study if I have a mandibular molar with symptomatic irreversible pulpitis?
  - source_sentence: "TITLE: A Study to Find Out if the Medicine Called Rimegepant is Safe for Adults in India AN OPEN-LABEL\
      \ MULTICENTER STUDY TO EVALUATE THE SAFETY AND TOLERABILITY OF RIMEGEPANT 75 MG ODT FOR ACUTE TREATMENT OF MIGRAINE\
      \ IN ADULT PARTICIPANTS IN INDIA WITH PREVIOUS INSUFFICIENT RESPONSE TO TRIPTANS\nSUMMARY: This is a multicenter, single-arm,\
      \ open-label Phase 4 study evaluating the safety and tolerability of rimegepant 75 mg orally disintegrating tablet (ODT)\
      \ for the acute treatment of migraine (with or without aura) in adult patients in India who have had an insufficient\
      \ response, intolerance, or contraindication to triptans. It will enroll approximately 60 participants.\nINCLUSION CRITERIA\n\
      Participants are eligible to be included in this study only if all of the following criteria apply:\nAge and Reproductive\
      \ Status:\n1. 18 years of age or older who meet the reproductive criteria.\n Disease Characteristics:\n2. Participant\
      \ has at least a 1-year history of migraine (with or without aura) consistent with a diagnosis according to the International\
      \ Classification of Headache Disorders, 3rd Edition, including the following:\n 1. At least 5 attacks fulfilling criteria\
      \ 1-3:\n 1. Headache attacks lasting 4-72 hours (when untreated or unsuccessfully treated).\n 2. Headache has at least\
      \ 2 of the following 4 characteristics:\n * Unilateral location\n * Pulsating quality\n * Moderate or severe pain intensity\n\
      \ * Aggravation by or causing avoidance of routine physical activity (eg, walking or climbing stairs)\n 3. During headache,\
      \ at least 1 of the following:\n -Nausea and/or vomiting\n * Photophobia and phonophobia\n 2. Not better accounted for\
      \ by another ICHD-3 diagnosis.\n3. Participants experience 4-14 migraine days / month and fewer than 7 non-migraine\
      \ headache days / month on average and overall, less than 15 days with headache (migraine or non-migraine) per month\
      \ across the 3 months prior to screening.\n4. Participants on prophylactic migraine medication (non-CGRP) are permitted\
      \ to remain on therapy if they have been on a stable dose for at least 3 months prior to screening visit, and the dose\
      \ is not expected to change during the study.\n5. Participants have previous insufficient response and/or prior intolerance\
      \ to at least one triptan or documented contraindication to the use of triptan.\n 1. Insufficient response - Previous\
      \ treatment with one or more triptan has yielded no, unsatisfactory or inconsistent therapeutic effect (eg, recurrent,\
      \ incomplete relief of migraine related symptoms \\[including pain, nausea, photophobia, phonophobia etc\\] at 2 hours\
      \ post dose, non-sustained relief of migraine related symptoms through 24 hours post dose, etc), after repeated dosing\
      \ (≥2 attempts) at recommended dose level.\n 2. Prior intolerance - treatment with triptan has been interrupted because\
      \ of an adverse event that made continuation of the drug intolerable for the individual.\n -Prior triptan associated\
      \ overuse headache\n -Arrhythmia associated with prior triptan use\n -Chest/throat/neck/jaw pain, tightness, pressure\
      \ or heaviness associated with prior use of triptan\n -Gastrointestinal ischemia or peripheral vasospastic reaction\
      \ associated with prior use of triptan\n * Serotonin syndrome associated with prior triptan use\n 3. Documented contraindication\
      \ to triptans -\n 1. Documented hypersensitivity to triptan\n 2. Cardiovascular events, conditions and procedures considered\
      \ contraindications to the use of triptan medications.\n i. Events: Myocardial infractions, prior cardiac arrest, transient\
      \ ischemic attack, cerebrovascular accident (Intracerebral haemorrhage, intracranial haemorrhage, subarachnoid haemorrhage,\
      \ ischemic stroke) ii. Conditions: Angina pectoris, coronary artery vasospasm, ischemic coronary artery disease, peripheral\
      \ artery disease, ischemic bowel disease, cardiac conduction disorders (life threatening arrhythmia/heart block) iii.\
      \ Procedure: Angioplasty, coronary artery bypass grafting, carotid endarterectomy 3) Uncontrolled hypertensio"
