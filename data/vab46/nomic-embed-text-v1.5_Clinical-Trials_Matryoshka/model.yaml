  - source_sentence: 'TITLE: Qualitative Study of Student Financial Insecurity and Psychiatry A Qualitative Exploration of
      the Impact of Financial Insecurity on the Development of Psychiatric Disorders and the Use of Healthcare Services Among
      Students

      SUMMARY: Since the COVID-19 pandemic, mental health disorders have increased significantly, particularly among young
      people. In France, the proportion of young people aged 18 to 25 suffering from depression almost doubled between 2017
      and 2021. This phenomenon particularly affects students, who are already identified as being at greater risk of mental
      health disorders than the general population. Medical students seem to be particularly vulnerable: in 2021, a national
      study showed very high rates of depression and suicidal thoughts in this population. The main factor associated with
      depression was the feeling of financial hardship.

      Students often face multiple forms of insecurity. Financially, they have limited resources and struggle to cover their
      basic needs such as housing, food and healthcare. Socially, many experience significant isolation, particularly when
      they are away from their families or under pressure from their studies. All of this has a significant impact on their
      mental health. Unfortunately, many students do not seek help due to lack of time, resources, or awareness of support
      services. The 2021 study showed that only one-third of medical students suffering from depression received appropriate
      treatment.

      The aim of the study is to explore the lived experiences of the students concerned in order to identify what they perceive
      as the various aspects of student precarity (housing, transport, isolation, financial difficulties, etc.) and the links
      they perceive between these and their psychological distress. This study will deepen our understanding of these factors
      by exploring students'' lived experiences, and will bring to light elements not identified by quantitative studies.

      INCLUSION CRITERIA:

      * A student enrolled at Paris Sciences et Lettres (PSL) University or the Faculty of Health Sciences at Université Paris
      Cité (UPC),

      * Aged 18 or over,

      * Fluent in French,

      * be a student,

      * have used the PPOP scheme,

      * not object to participating after receiving clear information.'
    sentences:
    - Could I be eligible for this study if I have triple-negative breast cancer and am over 18 years old?
    - What is the main goal of this clinical trial?
    - I'm a student struggling with mental health issues, can I participate in this study?
  - source_sentence: "TITLE: A Phase 2 Study of Belumosudil Combined With Ruxolitinib as Second Line Therapy to Treat Chronic\
      \ Graft Versus Host Disease (cGvHD) After Steroid Failure (BELRUX)\nSUMMARY: Chronic graft-versus-host disease (cGvHD)\
      \ is a serious condition that can happen after a stem cell or bone marrow transplant. The donor's immune cells attack\
      \ the patient's body, causing inflammation, pain, and damage to organs like the skin, liver, or lungs. For patients\
      \ with moderate to severe cGvHD who don't improve with or can't tolerate standard front line therapy with steroids,\
      \ there's a significant unmet need. Steroid-refractory cGvHD is hard to treat, with limited effective options, often\
      \ leading to ongoing symptoms and reduced quality of life.\nThis Phase II study tests a new treatment combining two\
      \ oral drugs, ruxolitinib and belumosudil, for these patients. Both drugs have helped cGvHD individually, but this trial\
      \ explores if they work better together. For the first 28 days (Cycle 1), patients take ruxolitinib (10 mg twice daily).\
      \ From Cycle 2, they add belumosudil (200 mg once or twice daily, depending on other medications) for 48 weeks (12 cycles)\
      \ unless their condition worsens or side effects become intolerable. Follow-up visits occur 30 days and 6 months after\
      \ treatment ends to check health status.\nThe study is non-randomized (all get the same treatment) and open-label (patients\
      \ and doctors know the drugs used). It aims to see if this combination better controls cGvHD in patients where steroids\
      \ failed. This could offer hope for better symptom management and improved quality of life for those with limited treatment\
      \ options.\nINCLUSION CRITERIA:\n* 18 years of age or older at the time of enrollment.\n* Has previously been diagnosed\
      \ with moderate to severe cGvHD OR mild cGvHD with high-risk features (defined as platelet counts \\0.5 mg/kg/day or\
      \ 1 mg/kg/every other day for ≥4 weeks OR\n * Increase in prednisone dose to \\>0.25 mg/kg/day after 2 unsuccessful\
      \ attempts to taper the dose.\n* Taking a steroid dose at the time of enrollment that is \\ 2 years. For individuals\
      \ with permanent infertility due to an alternate medical cause other than the above (e.g. Mullerian agenesis, androgen\
      \ insensitivity, gonadal dysgenesis) investigator discretion should be applied to determining study entry eligibility.\
      \ Male patients will use an adequate method of contraception for the course of the study from the time of enrollment\
      \ to 3 months after discontinuation of all study treatment. These participants must refrain from donating or cryopreserving\
      \ sperm, be abstinent from heterosexual intercourse as their preferred and usual lifestyle (abstinent on a long term\
      \ and persistent basis) and agree to remain abstinent or must agree to use contraception (a male condom and an additional\
      \ highly effective contraceptive method as described in section 4.2.3) when having sexual intercourse with a woman of\
      \ childbearing potential who is not currently pregnant.\n* Patients showing overlap syndrome with components of aGvHD\
      \ at the time of enrollment are eligible to participate unless the acute component of their overlap syndrome is Grade\
      \ 3 or 4.\n* Must be able and willing to comply with study procedures."
    sentences:
    - What is the primary objective of this clinical trial?
    - What is the main goal of this clinical trial?
    - What is the primary treatment approach being investigated in this clinical trial?
  - source_sentence: 'TITLE: Exergames-acceptance and Commitment Therapy(e-ACT) for Breast Cancer Depression and Anxiety:
      A Randomized Controlled Trial The Efficacy of Exergames-acceptance and Commitment Therapy Program for Treatment of Depression
      and Other Psychological Complications in Breast Cancer: Comparison With Acceptance and Commitment Therapy Alone and
      Treatment-as-usual in a Randomized Controlled Trial

      SUMMARY: The goal of this three arm, double-blind, randomized controlled trial is to learn if an exergame-acceptance
      and commitment therapy (e-ACT) program can treat depression and anxiety in breast cancer patients, compared to acceptance
      and commitment therapy (ACT) alone and treatment-as-usual. The main question it aims to answer is:

      Is there a difference in the effectiveness of the e-ACT program in reducing depressive and anxiety symptoms, cancer-related
      fatigue, experiential avoidance, and serum IL-6 levels, while increasing BDNF and improving posttraumatic growth and
      quality of life among breast cancer patients, compared to ACT alone and treatment-as-usual, measured at baseline, 8
      weeks (post-intervention), and 12 weeks after the intervention (follow-up)?

      Researchers will compare the e-ACT group, the ACT-alone group, and the treatment-as-usual group to see if the e-ACT
      program yields superior outcomes in reducing psychological distress and improving well-being.

      Participants will:

      Be randomly assigned to one of three groups: (1) e-ACT (exergame + ACT), (2) ACT alone, or (3) treatment-as-usual (general
      patient education).

      Attend an 8-week program (one session per week) if in the e-ACT or ACT group; the control group continues their usual
      care.

      Complete questionnaires at three time points (baseline, 8 weeks, and 20 weeks) to assess depression, anxiety, quality
      of life, posttraumatic growth, valued living, experiential avoidance, and cancer-related fatigue.

      Provide blood samples at pre-intervention and post-intervention (week 8) for analysis of interleukin-6 (IL-6) and brain-derived
      neurotrophic factor (BDNF) biomarkers.

      The INCLUSION CRITERIA include:

      1. Newly diagnosed breast cancer patients and patients with recurrent breast cancer confirmed by histopathological report,
      regardless of the stage of cancer.

      2. Those with HADS score of 8 or higher in both Depression and Anxiety sub-scales of the HADS.

      3. Patients who had been treated with surgery or were undergoing the standard regime of clinical anti-tumor treatment
      (chemotherapy, radiotherapy, immunotherapy, targeted therapy, etc.).

      4. Age 18 years old and above.

      5. Patients who were able to read and understand written Chinese.

      The EXCLUSION CRITERIA are:

      1. Pregnant women，considered for the following reasons: Pregnancy involves significant hormonal and physical changes
      that could affect the participant''s response to the e-ACT; the safety of e-ACT to the unborn child was of concern.

      2. Those who have current and lifetime history of engaging in any psychotherapy

      3. Those who consumed alcohol and illicit drugs .

      4. Those who has current and lifetime history of other psychiatric illnesses, such as psychotic disorders (schizophrenia,
      schizophreniform disorder, schizoaffective disorders, brief psychotic disorder, and delusional disorder), bipolar mood
      disorder, obsessive compulsive disorder, posttraumatic stress disorder, and attention deficit hyperactive disorder,
      and autism spectrum disorder

      5. Those who are on medications that can induce psychiatric symptoms, such as cardiovascular agents (clonidine, guanethidine,
      methyldopa, reserpine, beta blockers), dermatologic agents (isotretinoin), anticonvulsants (levetiracetam), antimigraine
      medications (triptans), hormonal agents (corticosteroids, oral contraceptives, gonadotropin-releasing hormone agonists,
      tamoxifen), varenicline, immunological agents (interferons), and levodopa.Or those who ccurrently using any psychotropic
      medication.

      6. Patient who has suicidal tendency.

      7. those who are physically unfit to answer questionnaires. (those are bed-bound or too weak to answer the questionnaire).'
    sentences:
    - Could a patient with a history of depression and anxiety, who has been diagnosed with breast cancer, qualify for this
      study?
    - How old do you need to be to be eligible for this clinical trial?
    - I have obesity and high blood pressure, can I participate in this study and what will happen if I join?
