widgetData:
- source_sentence: 'query: máy quét mã vạch cầm tay'
  sentences:
  - 'passage: Studio Display 27 inch 5K Chân đế cố định MFEY4SA/A | Apple Studio Display 27 inch 5K với chân đế cố định MFEY4SA/A
    mang đến trải nghiệm hình ảnh tuyệt vời. Màn hình độ phân giải 5K sắc nét, kết hợp Camera Center Stage tiện lợi cho các
    cuộc gọi video. Hệ thống loa Spatial Audio tái tạo âm thanh vòm sống động, mang đến trải nghiệm nghe nhìn đắm chìm. Kế
    | Danh mục: Màn hình máy tính Apple | Thương hiệu: Apple | Giá: 42,990,000 VNĐ'
  - 'passage: Máy quét mã vạch 2D cầm tay có dây SingPC Scan-2623U | Máy quét mã vạch 2D cầm tay có dây SingPC Scan-2623U
    là giải pháp hiệu quả cho mọi nhu cầu quét mã vạch của bạn. Với khả năng đọc mã vạch 2D nhanh chóng và chính xác, thiết
    bị này giúp tối ưu hóa quy trình làm việc tại cửa hàng, kho bãi hay các sự kiện. Thiết kế cầm tay tiện lợi, kết nối có
    dây ổn đ | Danh mục: Thiết bị mã vạch SingPC | Thương hiệu: SingPC | Giá: 790,000 VNĐ'
  - 'passage: Máy quét mã vạch 2D để bàn có dây SingPC Scan-2800U | Máy quét mã vạch 2D để bàn có dây SingPC Scan-2800U là
    thiết bị không thể thiếu cho các hệ thống bán lẻ, kho hàng hiện đại. Khả năng quét mã vạch 2D mạnh mẽ, tốc độ cao giúp
    xử lý nhanh chóng mọi loại mã, kể cả những mã có chất lượng in kém. Thiết kế để bàn gọn gàng, kết nối USB ổn định, dễ
    dàng tíc | Danh mục: Thiết bị mã vạch SingPC | Thương hiệu: SingPC | Giá: 1,490,000 VNĐ'
- source_sentence: 'query: thảm cho sofa'
  sentences:
  - 'passage: Thảm Abstract Grey Line 61333K (1,7M X 2M) | Thảm Abstract Grey Line 61333K (1,7M X 2M) từ Nhà Xinh là điểm
    nhấn tinh tế cho mọi không gian sống. Với họa tiết trừu tượng và tông màu xám hiện đại, tấm thảm này dễ dàng hòa hợp với
    nhiều phong cách nội thất, từ tối giản đến sang trọng. Kích thước 1,7M x 2M lý tưởng để đặt dưới bộ sofa phòng khách |
    Danh mục: Thảm | Thương hiệu: Nhà Xinh | Giá: 14,930,000 VNĐ'
  - 'passage: Két sắt điện tử KS90K1DT | Két sắt điện tử KS90K1DT của Nội Thất Hòa Phát là lựa chọn lý tưởng để bảo vệ tài
    sản quý giá của bạn. Với thiết kế đứng vững chắc, két được trang bị hệ thống khóa chìa và khóa điện tử hiện đại, đảm bảo
    an toàn tối đa. Bên trong, két có một đợt di động linh hoạt và một ngăn kéo tiện lợi, giúp bạn sắ | Danh mục: Két Sắt
    Chống Cháy | Thương hiệu: Nội Thất Hòa Phát | Giá: 5,180,000 VNĐ'
  - 'passage: Sofa 3 chỗ | FALSLEV | vải polyester | xám | R216xS84xC78cm | Sofa 3 chỗ FALSLEV màu xám mang đến vẻ đẹp tối
    giản nhưng không kém phần sang trọng cho không gian sống. Sản phẩm được chế tác từ khung gỗ cao su tự nhiên bền vững,
    kết hợp bọc vải polyester cao cấp, tạo cảm giác êm ái và dễ chịu khi sử dụng. Với kích thước rộng 216cm, sâu 84cm và cao
    78cm, sofa FAL | Danh mục: Sofa | Thương hiệu: FALSLEV | Giá: 9,900,000 VNĐ'
- source_sentence: 'query: thảm sàn nhiều màu'
  sentences:
  - 'passage: Thảm Harmony Brown (1,6M X 2,3M) | Thảm Harmony Brown (1,6M X 2,3M) của Nhà Xinh là một tác phẩm nghệ thuật
    độc đáo, phá vỡ mọi định kiến về thảm trải sàn truyền thống. Với hình dáng bát giác khác biệt, chiếc thảm này mang đến
    sự mới lạ và cá tính cho không gian sống của bạn. Sự kết hợp tinh tế giữa các tông màu nâu cùng cách phối mà | Danh mục:
    Thảm | Thương hiệu: Nhà Xinh | Giá: 21,990,000 VNĐ'
  - 'passage: Thảm sàn | REINROSE | cotton | nhiều màu | R65xD140cm | Thảm sàn REINROSE là lựa chọn hoàn hảo để thêm sắc màu
    và sự ấm áp cho không gian nội thất của bạn. Được làm từ 100% cotton mềm mại, thảm có thiết kế nhiều màu sắc sống động,
    mang đến vẻ tươi mới và cá tính cho phòng khách hoặc phòng ăn. Với kích thước R65xD140cm, sản phẩm không chỉ là vật trang
    trí | Danh mục: Thảm phòng khách & Trang trí | Thương hiệu: REINROSE | Giá: 699,000 VNĐ'
  - 'passage: Nước hoa ô tô cao cấp Hương Cà Phê Wine Korea A02 35ml (Màu nắp ngẫu nhiên) | Mang đến không gian thư giãn và
    đẳng cấp cho xe hơi của bạn với Nước hoa ô tô cao cấp Hương Cà Phê Wine Korea A02 35ml. Sản phẩm không chỉ khử mùi hiệu
    quả mà còn lan tỏa hương cà phê ấm áp, nồng nàn, tạo cảm giác dễ chịu và sảng khoái. Được chiết xuất từ hạt cà phê và
    tinh dầu nguyên chất, nước hoa | Danh mục: Ô Tô - Xe Máy - Xe Đạp | Thương hiệu: Wine | Giá: 135,000 VNĐ'
