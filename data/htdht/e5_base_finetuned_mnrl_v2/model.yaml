  sentences:
  - 'passage: Thực phẩm bảo vệ sức khỏe BioIsland DHA For Pregnancy BioIsland DHA For Pregnancy là thực phẩm bảo vệ sức khỏe
    thiết yếu dành cho mẹ bầu, hỗ trợ cung cấp hàm lượng DHA tinh khiết, an toàn cho sự phát triển não bộ và thị giác của
