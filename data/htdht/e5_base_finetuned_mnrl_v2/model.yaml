    tận nhà khi bạn đặt mua online, mang đến sự tiện lợi tối đa cho các mẹ.'
  - 'passage: Bàn Phím Cơ Có Dây Gaming Razer BlackWidow V3 Tenkeyless Yellow Switch Nâng tầm trải nghiệm gaming của bạn với
    Bàn Phím Cơ Có Dây Gaming Razer BlackWidow V3 Tenkeyless Yellow Switch. Thiết kế Tenkeyless nhỏ gọn, tối ưu không gian
    làm việc, cùng bộ switch Yellow cho tốc độ phản hồi siêu nhanh và hành trình phím êm ái, lý tưởng cho các trận chiến game
    kịch tính. Bàn phím mang đến cảm giác gõ thoải mái, độ bền cao, là lựa chọn hoàn hảo cho các game thủ chuyên nghiệp. Sản
    phẩm chính hãng Razer, đảm bảo chất lượng và hiệu suất vượt trội. Tận hưởng ưu đãi giao hàng miễn phí toàn quốc và chính
    sách 1 đổi 1 trong tháng đầu tiên nếu có lỗi.'
  - 'passage: Sữa Tươi Tiệt Trùng TH True Milk Nguyên Chất Bịch 220Ml Thưởng thức hương vị sữa tươi nguyên chất, tinh túy
    từ thiên nhiên với Sữa Tươi Tiệt Trùng TH True Milk Nguyên Chất Bịch 220Ml. Sản phẩm được làm hoàn toàn từ sữa tươi sạch
    của trang trại TH, không bổ sung sữa bột hay chất béo sữa, giữ trọn vẹn vị ngon tự nhiên và giàu dinh dưỡng. Mỗi bịch
    sữa 220ml cung cấp năng lượng, protein, canxi, cùng các vitamin thiết yếu như A, D, B1, B2, hỗ trợ phát triển thể chất
    và trí tuệ. Sản phẩm đã qua tiệt trùng, đảm bảo an toàn vệ sinh thực phẩm, rất tiện lợi để sử dụng hàng ngày hoặc mang
    theo khi di chuyển. Ngon hơn khi ướp lạnh, sữa TH True Milk Nguyên Chất là thức uống bổ dưỡng cho cả gia đình.'
- source_sentence: 'query: nồi cơm điện 1.8l'
  sentences:
  - 'passage: Máy tăm nước cầm tay Enchen Mint 3 - Hồng Máy tăm nước cầm tay Enchen Mint 3 phiên bản màu Hồng mang đến trải
