  - 'passage: Sữa Đậu Nành Fami Nguyên Chất Ít Đường Bịch 200Ml Sữa Đậu Nành Fami Nguyên Chất Ít Đường Bịch 200Ml là sự lựa
    chọn hoàn hảo cho sức khỏe và niềm vui gia đình bạn. Được làm từ 100% hạt đậu nành tươi ngon, sản phẩm mang đến hương
    vị thơm ngon, sánh mịn tự nhiên. Công nghệ UHT tiên tiến từ Châu Âu giúp giữ trọn vẹn dinh dưỡng, loại bỏ vi khuẩn có
    hại, đảm bảo an toàn cho sức khỏe. Sữa Fami cung cấp protein, chất xơ, vitamin K, C, D cùng các khoáng chất thiết yếu
    như canxi, magie, kẽm, hỗ trợ xương răng chắc khỏe, cải thiện tâm trạng và tăng cường sức đề kháng. Với vị ngọt dịu, ít
    đường, đây là thức uống bổ dưỡng, phù hợp cho cả trẻ nhỏ và người lớn.'
  - 'passage: Áo Ba Lỗ Chạy Bộ Nữ Nike Swift Dri-Fit - Xanh Mint Áo Ba Lỗ Chạy Bộ Nữ Nike Swift Dri-Fit màu Xanh Mint là trang
    phục lý tưởng cho các tín đồ thể thao. Sản phẩm chính hãng từ Nike, được thiết kế đặc biệt cho hoạt động chạy bộ với công
    nghệ Dri-Fit giúp thoát ẩm nhanh chóng, giữ cho cơ thể luôn khô ráo và mát mẻ. Chất liệu nhẹ và thoáng khí mang lại cảm
    giác thoải mái tối đa trong suốt quá trình vận động. Áo có gam màu xanh mint tươi mát, trẻ trung, dễ dàng phối hợp với
    các loại quần thể thao. Với các size từ XS đến L, áo phù hợp với nhiều dáng người, giúp bạn tự tin chinh phục mọi đường
    chạy.'
