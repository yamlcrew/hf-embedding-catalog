  sentences:
  - 'passage: Kẹp Gỗ Click-03 Ng Kẹp Gỗ Click-03 Ng từ thương hiệu Shands là giải pháp tiện lợi để giữ cố định các vật dụng.
    Với chất liệu gỗ tự nhiên, sản phẩm mang đến vẻ ngoài mộc mạc, thân thiện. Thiết kế kẹp chắc chắn, dễ dàng thao tác, phù
    hợp để sử dụng trong nhiều không gian khác nhau như gia đình, văn phòng hay các cửa hàng thủ công. Kẹp gỗ không chỉ hữu
