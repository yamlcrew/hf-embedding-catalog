widgetData:
- source_sentence: Так хяоми работает и у них есть варианты поинтереснее ах6с без 160 ширины канала но ставится альтернативная
    прошивка или 5400 второй вариант . Настроил и забыл
  sentences:
  - да капец. вроде и хочешь простой роутер для шлема выбрать, а столько всего всплывает. то не так, другое не так. 160 мгц
    нет (хотя и нахрен не надо), то перегревы... блин!
  - 'А вот мне интересно для всех шлемов общий стор и покупки? Те выйдет пико5, а VD у меня получается уже куплен?

    Что бы не как с плейстецшен…)))

    И не увидит . Вы скачали SA для пико4, а у пико3 ствоц другой. Этот удалите и скачайте правильный тыкнув на сайте на свой
    шлем'
  - 'У меня на ультра и на rx 5700 xt (аналог 2080) идёт. Оптимизирована просто отлично

    Давай сравним, что-нибудь. Думаю, %5-10. Но просили просто скинуть площадку'
- source_sentence: Подскажите, брал очки на Али со склада в РФ, а теперь спор по браку закрыли с возвратом в Китай. Интересно,
    как я отправлю его без документов через таможню, и какого черта "доставка и возврат" стоят Россия, а мне впаяли отправку
    туда за свой счёт
  sentences:
  - "Ребят.. как по мне глупо и даже слишком глупо, сравнивать квест про и пику 4.\nЦена в 2,5 раза выше. Очевидно что прошка\
    \ в чем то превзойдет пику. \nЗа свои 30000 рублей пика был и останется топом.\nВыйдет пика 5 квест 3, там и посмотрим)\
    \ \nА сейчас слова на ветер."
  - 'А ты уже отправлял так? Просто реально странно, ты вроде заказывал со склада с РФ

    А ты почему возврат решил сделать, брак какой то? Я не шарю в возврате, по сути на Али прописано все должно быть'
  - Братва, а просто снять шлем это режим сна получается? Походу я вообще его не отключаю) научите как правильно. И что будет,
    если продолжать так делать? Ёмкость аккума упадёт или что? Я снимаю, он гаснет, кладу в коробку и всё. Иногда кнопку нажму
    один раз, но не держу. Понимаю что это не выключение, есть в этом минусы какие то? Простите если глупый вопрос🙏
- source_sentence: Кстати вопрос! Мне вот чтобы вандер сейчас найти, поставить - вот это все - надо натянуть шлем, взять сосиски
    в руки, вот это вот всё поискать и так далее. Это процедура прямо. А есть возможность без этого на шлем накинуть из сторов?
    (в смысле, подключив его по проводу)? VD поднял, посмотрел, поковырял, картинка там чот как-то реально лучше, но пока
    не разобрался
  sentences:
  - Пoшел Haxyй магист печеночной болезни 1856 годов одно хромосомное существо без шанса на развитие дальше, петух однозаточечный
    который обиделся на стикер без порнографии и кинул жб, мать свою заблокай олень блять
  - как бы бошка от такого объема нового не свистанула. Всяко - спасибо за помощь, что сразу не отправили к RTFM и так далее.
    Кстати - с т.з. нуба в VR, но в целом - не рукожопа - скажу, что на 4PDA для нуба в ветке пико - контент есть, но проход
    с китая до прошивки как вы мне сегодня рассказали - крайне не очевиден. Чекнуть true, false - ок, накатить версию - ок,
    а вот свайпнуть выше по поводу смены региона - не ок, т.к. оно должно быть ниже ахахха =) а в итоге - я понимал еще вчера,
    что надо менять регион, но заюзал какой-то не тот батник, который "устарел", как мне и ответили на 4pda 😃
  - Получается для увеличения разрешения картинки шина важнее лишних гигов? Это и хотел услышать, пиксельная лесенка больше
    раздражает чем лишние отражения, тени и т.д.
- source_sentence: 'надо мои дуплоны деревянные конвертировать им в их валюту, я могу конечно в банкомат наличку закинуть
    на свою карту, но типа пускай сами конвертируют в баксы, пускай платёж примут в рублях для начала за док и за пиздатый
    допустим на том сайте планшет

    как это сделает друг китайца?'
  sentences:
  - 'Выглядит так, будто вашему роутеру что-то мешает.


    Возможно соседские Wi-Fi, если у какого-то соседа на всю мощность излучает роутер, и особенно если он работает на том
    же канале, что и ваш. Можете это проверить, в приложении "WiFi Analyzer (open-source)" из Google Play. Оно показывает
    мощность сигнала соседских Wi-Fi, и номера каналов, на которых они работают. Затем настроить свой роутер на какой-нибудь
    свободный канал.


    Или же у вас дома что-то мешает роутеру. Например, я слышал, что роутер сходит с ума, если перед ним поставить большое
    зеркало.'
  - 'уууу блять, хочешь прикол?

    вырезание verify убивает магазин нахуй

    убивает автообновления всех приложений нахуй

    той самой, которая не даёт запускать старые дампы пиратских игр'
  - Пока не в ставится тыкай, молотком попробуй вбить, разюири полностью очки и попробуй закрепить, ну или просто на скотч
    приклей или момент какой нибудь
- source_sentence: Ребят, Карта 3070, настройки вд на high, при резком повороте в Аликс по углам чёрные полосы, в среднем
    900 мегабит показывает вд, настройки вд сделал по видосу Павла 419, может драйвера карты обновить или на среднее качество
    снижать?
  sentences:
  - 'к слову, есть рекомендации какую лучше видюху купить чтобы играть в более требовательные игры с достаточным качеством.
    Например, в HalfLife Alyx ?

    в пределах 20 тыс. руб'
  - Поздно)))) эффект прям порадовал, видимо всё равно из-за активных игр, линзы запотевают и просто тряпочкой их не вытрешь,
    я так раньше делал, а вот с жидкостью прям классно
  - Здесь со всем соглашусь. Но опять же нужно делать скидку на то что это по сути первая игра такого масштаба от этой команды,
    тот же Метро эксодус более взрослее чтоли. Но и опыта больше за плечами
