widgetData:
- source_sentence: R10-R19 Symptômes et signes relatifs à l'appareil digestif et à l'abdomen
  sentences:
  - Symptômes et signes relatifs à l'appareil digestif et à l'abdomen
  - 'L''exploration de la classification autour de l''acte HBMD01410, correspondant à la modélisation occlusale par la technique
    de la cire ajoutée sur une dent (1° activité chirurgicale ou médicale, phase par défaut), révèle un cheminement procédural
    qui s''inscrit dans le cadre des actes de phase 0. Cet acte est apparenté à l''acte NDFA00310, qui désigne une talectomie
    avec création d''une néarthrose tibiopédieuse, elle aussi en première activité chirurgicale ou médicale et en phase par
    défaut. Ce dernier renvoie à son tour à l''acte AHPA01140, correspondant à la libération ou résection d''un nerf digital
    plantaire par abord direct, réalisé sous anesthésie et en phase par défaut. Cet acte appartient à une catégorie d''interventions
    chirurgicales de même nature, incluant notamment BADA00540 (canthopexie médiale pour dystopie congénitale, sous anesthésie,
    phase par défaut) et PAGA00710 (désépiphysiodèse d''un os long par abord direct, 1° activité chir/med, phase par défaut).
    Un autre acte similaire est GAMA00240, qui concerne la réparation d''une perte de substance du nez par lambeau frontal
    à pédicule inférieur, également en phase par défaut et sous anesthésie. L''ensemble de ces actes relève de la classe «
    ActeActivitePhase_Phase_0 », qui regroupe les phases d''actes de phase 0. Cette classe inclut plusieurs procédures de
    même type, telles que BADA00540, GAMA00240, PAGA00710 et AHPA01140, toutes réalisées en phase par défaut. La classe chirurgicale
    « ActeActivitePhase_Phase_0 » est liée à d''autres groupes, notamment « ActeActivitePhase_Phase_2 », qui regroupe des
    actes en phase 2. Ce groupe inclut des procédures telles que HAMA00712 (reconstruction du philtrum par lambeau hétérolabial
    pour séquelle de fente orofaciale, 1° activité chir/med, phase 2 : section du pédicule), HAMA00742 (même acte, mais sous
    anesthésie, phase 2), MJMA01412 (reconstruction d''un tendon de la main par transplant pédiculé en deux temps, phase 2
    : transplant pédiculé), ainsi que MJMA01442 (même acte sous anesthésie, phase 2). HAMA00742 apparaît également comme une
    alternative chirurgicale dans ce contexte. Enfin, l''acte HKPA00712, correspondant à la mise à plat d''un abcès ou d''une
    fistule haute de l''anus (transsphinctérien supérieur ou trajet complexe multiramifié) avec drainage par anse souple,
    en phase 2 (séance de traction progressive sur l''anse souple), est également apparenté à cette filiation procédurale.
    Au total, cette exploration a permis d''identifier 20 codes CCAM reliés directement ou indirectement à HBMD01410, illustrant
    la structure hiérarchique et catégorielle de la classification.'
  - N50 Autres affections des organes génitaux de l'homme
- source_sentence: N92 Ménorragie, polyménorrhée et métrorragie
  sentences:
  - N95.0 Saignements postménopausiques
  - Ménorragie, polyménorrhée et métrorragie
  - 'La classification ATC de la substance désocortisone (H02AA03) s''inscrit dans une hiérarchie pharmacologique bien définie.
    Ce dérivé stéroïdien appartient au sous-groupe chimique H02AA, qui regroupe les minéralocorticoïdes, une classe d''hormones
    corticosurrénales agissant principalement sur l''équilibre hydro-électrolytique. Au sein de ce sous-groupe, la désocortisone
    (H02AA03) est associée à d''autres substances comme la fludrocortisone (H02AA02) et l''aldostérone (H02AA01), cette dernière
    étant considérée comme une alternative thérapeutique pertinente. L''aldostérone, hormone naturelle, partage avec la désocortisone
    le même mécanisme d''action centré sur la réabsorption rénale du sodium et l''excrétion du potassium.


    Le sous-groupe H02AA fait partie du groupe pharmacologique H02A, intitulé « Corticostéroïdes à usage systémique, simples
    », qui inclut les corticoïdes administrés par voie systémique sans association à d''autres principes actifs. Ce groupe
    H02A s''inscrit lui-même dans la classe thérapeutique H02, « Corticostéroïdes à usage systémique », qui englobe non seulement
    les minéralocorticoïdes mais aussi d''autres sous-groupes comme les antiadrénaux (H02C). La classe H02 est complétée par
    le groupe H02B, qui regroupe les associations de corticostéroïdes à usage systémique, soulignant ainsi la distinction
    entre traitements monosubstances et combinaisons.


    La classe H02 appartient au grand groupe anatomique H, « Préparations hormonales systémiques, hormones sexuelles et insulines
    exclues », qui regroupe diverses hormones agissant de manière systémique. Ce groupe H est l''un des principaux axes de
    la classification ATC, aux côtés d''autres grands systèmes comme le système nerveux (groupe N). Par ailleurs, des liens
    thérapeutiques peuvent être établis avec d''autres classes hormonales telles que les hormones hypophysaires et hypothalamiques
    (H01), les hormones pancréatiques (H04) ou encore les agents intervenant dans l''homéostasie calcique (H05). Au sein du
    groupe H04, on retrouve notamment les hormones glycogénolytiques (H04A), comme le glucagon, regroupées dans le sous-groupe
    chimique H04AA. Cette exploration met en lumière les relations structurales et fonctionnelles entre les différentes entités
    de la classification ATC, depuis la substance spécifique jusqu''aux grandes catégories thérapeutiques et anatomiques.'
