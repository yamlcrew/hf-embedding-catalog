  - source_sentence: What was the average industry segment operating profit for International Paper from 2003 to 2005?
    sentences:
    - 'item 7 .

      management 2019s discussion and analysis of financial condition and results of operations executive summary international
      paper 2019s operating results in 2005 were strongly impacted by significantly higher costs for en- ergy , wood , caustic
      soda and other raw materials which reduced operating profits compared with 2004 by $ 586 million .

      lower sales volumes were also a negative factor versus 2004 as we took a significant amount of lack-of-order downtime
      in our u.s .

      uncoated paper and containerboard mills , and downtime in our eastern european operations to rebuild paper machines
      in po- land and russia to add needed uncoated paper and pa- perboard capacity .

      we were able to partially offset some of these negative impacts through operational improvements in our manufacturing
      operations , im- proved average pricing for our paper and packaging grades , a more favorable product mix , and higher
      earn- ings from forestland and real estate sales .

      looking forward to 2006 , we expect operating prof- its for the first quarter to be flat with the 2005 fourth quarter
      .

      sales volumes should be seasonally slow in the quarter , but should show some improvement as the quarter progresses
      .

      price realizations should also improve as previously announced price increases are im- plemented .

      while energy , wood and raw material price movements are mixed , their impact for the quarter is expected to be flat
      .

      however , we see favorable signs of positive mo- mentum for the remainder of 2006 .

      we anticipate that demand in north america for both uncoated paper and industrial packaging products will be stronger
      , and that we will realize 2005 fourth-quarter and 2006 first-quarter announced price increases .

      additionally , operating rates should improve in 2006 reflecting announced industry capacity reductions in uncoated
      papers and container- board .

      we are also starting to see some reductions in natural gas and southern wood costs that , if the trend continues , should
      benefit operations as the year pro- gresses .

      in connection with our overall strategic direction , we are evaluating options for the possible sale or spin-off of
      certain of our businesses as previously announced in our transformation plan , with decisions on certain businesses
      anticipated during 2006 .

      we also will con- tinue to improve our key operations in north america by realigning our uncoated and packaging mill
      oper- ations to reduce costs , improve our products and im- prove our overall profitability .

