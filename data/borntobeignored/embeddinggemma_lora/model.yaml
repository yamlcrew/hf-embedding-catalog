      other than shares in subsidi- aries of the parent company and certain intercompany receiv- ables , to provide capital
      and liquidity , as applicable , to our material entities .

      the obligations of the parent company under the secured amended and restated support agreement are in most cases secured
      on a senior basis by the assets of the parent company ( other than shares in subsidiaries of the parent company ) .

