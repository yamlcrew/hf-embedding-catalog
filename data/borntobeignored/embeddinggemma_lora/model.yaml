      foreign currency rates we are subject to translation and transaction risks related to changes in foreign currency exchange
      rates .

      since we report revenues and expenses in u.s .

      dollars , changes in exchange rates may either positively or negatively affect our consolidated revenues and expenses
      ( as expressed in u.s .

      dollars ) from foreign operations .

      the primary foreign currencies that impacted our results during 2015 included the australian dollar , brazilian real
      , british pound sterling and euro .

      based on 2015 exchange rates and operating results , if the u.s .

      dollar were to strengthen or weaken by 10% ( 10 % ) , we currently estimate operating income would decrease or increase
      approximately 4% ( 4 % ) , assuming that all currencies are impacted in the same manner and our international revenue
      and expenses remain constant at 2015 levels .

      the functional currency of our foreign operations is generally their respective local currency .

      assets and liabilities are translated at the exchange rates in effect at the balance sheet date , and revenues and expenses
      are translated at the average exchange rates during the period presented .

      the resulting translation adjustments are recorded as a component of accumulated other comprehensive loss , net of tax
      , in the stockholders 2019 equity section of our consolidated balance sheets .

      our foreign subsidiaries generally collect revenues and pay expenses in their functional currency , mitigating transaction
      risk .

