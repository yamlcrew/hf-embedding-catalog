    - 'action, estoppel cannot do away with the need to consideration, and so forth. All these can now be seen to merge into
      one general principle shorn of limitations. When the parties to a transaction proceed on the basis of an underlying
      assumption - either of fact or of law - whether due to misrepresentation or mistake makes no difference - on which they
      have conducted the dealings between them - neither of them will be allowed to go back on that assumption when it would
      be unfair or unjust to allow him to do so. If one of them does seek to go back on it, the courts will give the other
      side remedy as the equity of the cases demands. That general principle applies to this case. Both the plaintiff and
      the bank proceeded for years on the underlying assumption that the guarantee of the plaintiffs applied to the $3,250,000
      advanced by the bank for the Nassau Building. Their dealings in rearranging the portfolio, in releasing properties and
      monies, will all conducted on that basis. On that basis the bank apply the surplus of $750,000 (on the English properties)
      in discharge of the obligations of the plaintiffs under the guarantee. It would be most unfair and unjust to allow the
      liquidator to depart from that basis and claim back now the $750,000. That was ultimately the paramount reason why the
      judge rejected the liquidator''s claim. He summed up his view in this one sentence, ante, p. 108C: "…I am satisfied
      that Mr. Foster''s conduct, though of course completely innocent, so influenced Mr. Oldfield''s conduct, as to render
      it unconscionable on the part of the plaintiffs now to take advantage of the bank''s error." Later at p. 108G the judge
      speaks of it being "unconscionable" for the representor to go back on his representation. In those phrases, the judge
