- source_sentence: What changes were made to Chapter 5 of the Local Plan Discussion Document?
  sentences:
  - the policies required to deliver a robust framework of local policies that are compliant with the NPPF". On 29 April 2013
    a draft of the Local Plan Discussion Document was presented to the Planning Services Working Party, which endorsed it.
    The officer told the Cabinet that changes had since been made to Chapter 5 "that explain it may be necessary for retail
    allocations made within the Core Strategy to be reconsidered". He said that "[the] requirement for this [had] become apparent
    as part of the determination process of the Elliott's Field Retail Park planning application but this was not reported
    to the Working Party". There were no detailed proposals in the Local Plan Discussion Document. It was only suggested that
    further work might be required. The Cabinet followed the officer's recommendation and resolved to approve the Local Plan
    Discussion Document for consultation. The version of the Local Plan Discussion Document published in July 2013 said that
    each policy of the core strategy had been considered against the NPPF and was "considered to be in general conformity
    with the NPPF, with no conflict identified", and that the policies of the core strategy "therefore retain their full weight
    by decision makers of planning applications" (paragraph 1.2.1). However, it went on to say that it was "apparent that
    there are policy gaps at the local level which need to be addressed" and that it would "suggest the additional policy
    areas necessary for Rugby to have a comprehensive up to date local development plan, as required by the NPPF" (paragraph
    1.4.1). Chapter 5 dealt with Rugby town centre. It identified as one of the "new policy areas" to be included in the local
    plan "Locating main town centre uses" (paragraph 5.0.1). It said that the policies of the core strategy relating to development
    in the town centre or of town centre uses, including Policy CS6, Policy CS7 and Policy CS8, were "considered to be in
    general conformity with the approach set out in the NPPF", but that "[additional] policies are required to ensure that
    there are no policy gaps and also as a result of the changing circumstances town centres are operating within" (paragraph
    5.0.3). It acknowledged that since the adoption of the core strategy in June 2011 "the context in which the town centre
    operates has changed dramatically because of both the current economic climate and changes in how we shop" (paragraph
    5.1.1).
