    - 'be filtered out at the permission stage." The factual situation in Manydown was entirely different to that in Lichfield.
      What was of concern there were the contents of a pre submission draft of a core strategy. That was not a local development
      document. The decisions under attack were, therefore, of proceedings which preceded, but were not properly part of,
      the statutory process that would end in the adoption of the core strategy. As a result they came within the class described
      by Simon Brown LJ in Ex Parte Huntington as some antecedent step quite separate and distinct from any eventual decision
      reviewable under statute. Here, the decision relates to main modifications which have been endorsed by the defendant
      within a local plan process approaching its end. One is not dealing, therefore, with an early claim for judicial review
      testing the lawfulness of decision taking in the run up to a statutory process but with a claim for judicial review
      taken during the statutory process which, far from saving time and expense could add time and expense to the process
      which is currently underway. Although Mr Crean QC submits that the present claim does not seek to question a relevant
      document of the kind to which Section 113 refers, in my judgment, it is not that simple. What the claimant is seeking
      is a quashing order of main modifications. If successful such a claim would abort the current plan making process when
      it is at an advanced stage. That would lead to considerable delay and expense not only to those parties before the court
      but to others who have made representations on the modifications which will be considered in due course by the Inspector
      at the resumed examination. The effect of a successful challenge would be to start that process again: a re-making of
      main modifications, further consultation, further representations which would then be considered at a deferred examination.
