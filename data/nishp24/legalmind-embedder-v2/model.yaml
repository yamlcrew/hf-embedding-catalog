    in Caparo v Dickman [1990] 2 AC 605. For the purposes of the present application, the Defendants were prepared to proceed
    on the basis that the Claimant would be able to establish at trial that injury to her would have been reasonably foreseeable
    if they failed to inform her that her father had Huntington''s Disease. Again, for the purposes of the present application,
    they were prepared to accept that there was sufficient proximity between the Claimant and the Defendants for a duty of
    care to arise. However, there was no reasonable prospect of the Claimant establishing that it would be fair, just or reasonable
    to impose on the Defendants a duty of care towards the Claimant in this regard. Mr Havers emphasised that the Claimant
    was seeking to impose liability for an omission – a failure to inform her of her father''s condition. Ordinarily that
    required either some special relationship between Claimant and Defendant or the Defendant assuming a responsibility for
