  - 'HH Judge Richard Parkes QC: On 17 November 2015 I made the order sought by the claimant, South Cambridgeshire District
    Council (SCDC), under s187B, Town and Country Planning Act (''TCPA'') 1990. These are my reasons for doing so. THE LAND
    The claimant is the statutory local planning authority for South Cambridgeshire, and in particular for land occupied by
    the first defendant at Hill Trees, Babraham Road, Stapleford, which is green belt land lying just outside the city of
    Cambridge. There is no doubt that the first defendant has at all material times been the occupier of the land and the
    person controlling the activities which have taken place there. For instance, he responded to an enforcement notice on
    one part of the land in 2005; in September 2009 he responded to a planning contravention notice (PCN) served by SCDC,
    stating that he was responsible for the car sales business which was being conducted on the land; and in April 2013, he
    responded to a further PCN by stating that the land was under his control and had been sold to him by a Mrs Freda Cook.
    The ownership of the land occupied by the first defendant is in fact far from certain. The land to which the application
    relates is the area marked A, B and C on the plan exhibited to the witness statement of Mr Charles Swain (SCDC Principal
    Planning Enforcement Officer) of 29 June 2015 at CRS1. It adjoins the main A1307 road from Cambridge to Babraham. Area
    A has residential use, and is the location of a house, a former pub, which was occupied by Mrs Freda Cook, who is no relation
    of the first defendant. She seems to have used the land as a whole for a horticultural nursery. She may have been the
    beneficial owner of at least areas A and B, although her title was not registered. According to Mr Swain, Mrs Cook died
    intestate on 17 August 2013. She had moved out of Hill Trees to the first defendant''s address at 136 Perne Road, Cambridge
    in the course of 2012. During her final illness, he sought to arrange to be married to her, but this was not allowed by
    the hospital because her capacity was in doubt. The present position is that the house and land at areas A and B are subject
    to a caution against first registration, registered by the'
