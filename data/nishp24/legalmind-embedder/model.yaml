    It then introduces its humanised version rhuMoAb HER2 (i.e. trastuzumab), which it says "was found to be safe and to have
    dose-dependent pharmacokinetics in two prior phase I clinical trials" (all quotations page 44 left-hand column). HER2
    Overexpression as a Predictor of Response to Taxanes. This sub-section notes attempts to ascertain whether HER2 overexpression
    is a predictor for response to systemic therapy. Dose-Response Effects to Anthracyclines. This sub-section discusses the
    relationship between HER2 overexpression and anthracyclines. It concludes (at page 44 middle to right-hand columns): "
    … findings from the CALGB study suggest that there is a significant dose-response effect of adjuvant therapy with an anthracycline-containing
    regimen in patients with HER2 overexpression but not in patients with no or minimal HER2 expression. The group''s final
    conclusion was that HER2 overexpression may be a useful marker for identifying patients who are most likely to benefit
    from high doses of adjuvant doxorubicin-based chemotherapy." HER2 Overexpression and Taxane Sensitivity. This sub-section
    reports a study by MSK analysing the relationship between HER2 overexpression and responses to taxanes in patients with
    metastatic breast cancer. The study was a retrospective one which involved immunohistochemical analysis of archived tumour
    sections. Most of the patients had received paclitaxel, but some had received docetaxel. It was found that "[r]emarkably,
