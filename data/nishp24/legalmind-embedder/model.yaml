    was of course based on the accounts of events given by the Claimant, Mr Sharma and Mr Shorter in their witness statements
    of July 2013. In that Causation Report, Dr Turner had emphasised the Claimant's feelings of responsibility and helplessness
    whilst at ESH and her additional vulnerability by reason of her own specialist knowledge. Dr Turner identified the Claimant's
