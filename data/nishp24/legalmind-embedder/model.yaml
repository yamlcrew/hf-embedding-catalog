    undertaking shall be deemed to have significant market power if, either individually or jointly with others, it enjoys
    a position equivalent to dominance, that is to say a position of economic strength affording it the power to behave to
    an appreciable extent independently of competitors, customers and ultimately consumers." BT has not been designated as
