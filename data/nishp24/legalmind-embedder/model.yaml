  - 'See also: [2017] EWCA Civ 151 His Honour Judge Robinson: Introduction On Monday 17 May 2010 the Claimant was unlawfully
    attacked and struck on the head by unknown assailants. There is a degree of confusion about precisely when he was so attacked.
    Times of 5:00pm and 7:00pm have been given. For the purposes of this case, the precise time is immaterial. After a time
    the Claimant began to feel unwell. He was persuaded by his friend Robert Tubman to go to hospital. Mr Tubman drove him
    to the Accident and Emergency Department of the Mayday University Hospital, Croydon. The hospital is now known as the
    Croydon University Hospital. The Claimant was booked in at the hospital A&E reception at 8:26pm. I find on the evidence
    that he left the hospital at 8:45pm at the latest without having been seen by a clinician. Having returned home, his condition
    deteriorated. An ambulance was called at about 9:42pm. He was first taken to the Defendant''s hospital. A CT scan showed
    the presence of an extra-dural haematoma. He was transferred to St George''s Hospital for neurosurgery to remove the haematoma.
    He has suffered a left hemiplegia. In this trial I am concerned only with liability. It is agreed that had the Claimant
    remained at the hospital he would have been treated sufficiently sooner that he would have gone on to make an essentially
    full recovery. The Claimant''s case is that during the period he was at the hospital, there were breaches of duty by the
    non-clinical reception staff and by the professional clinical staff. The alleged breach of duty by the reception staff
    concerns what information he was given about the time he would have to wait before being seen by a clinician, and also
    a failure to assess the Claimant for "priority triage". The alleged breach of duty by the clinical staff concerns the
    failure to assess the Claimant during the time he was present at the hospital. Thus I am concerned with what happened
    in the period of 19 minutes during which the Claimant was present at the hospital. The Evidence For the Claimant I heard
    from, and read the written evidence of, the following witnesses: (1) The Claimant himself; (2) Robert Tubman, the Claimant''s
    friend who drove him to and from the hospital and remained with him at the hospital; (3) Patreese Erskine, the Claimant''s
    sister; (4) Patricia Smith, the Claimant''s'
