- source_sentence: What procedure does the Secretary of State have the authority to make regulations for, in connection with
    an interview of a serving officer during an investigation under the Police Reform Act 2002?
  sentences:
  - Police (Complaints and Conduct) Act 2012 Interviews of serving officers during investigations 1 1 The Police Reform Act
    2002 is amended as follows. 2 In Schedule 3 (handling of complaints and conduct matters etc ) after paragraph 19E insert
    — Interview of persons serving with the police etc during certain investigations 19F 1 This paragraph applies to an investigation
    of a complaint, recordable conduct matter or DSI matter which — a is carried out by the appropriate authority under the
    management of the Commission, or b is carried out by the Commission itself. 2 The Secretary of State may by regulations
    make provision as to the procedure to be followed in connection with an interview which — a is held with a serving officer
    during the course of the investigation by the person investigating the complaint or matter, and b is not within paragraph
    19D(1). 3 Regulations under sub-paragraph (2) may in particular make provision — a requiring a serving officer to attend
    an interview, b for determining how the time at which an interview is to be held is to be agreed or decided, c about the
    information that must be provided to a serving officer being interviewed, d for enabling a serving officer to be accompanied
    at the interview by a person of a prescribed description. 4 “Serving officer” means a person who — a is serving with the
    police, or b is serving with an additional police body. 5 A person is serving with an additional police body if the person
    is a member of, or is employed or otherwise engaged for the purposes of, that body (subject to sub-paragraph (6) ). 6
    The Secretary of State may by regulations provide, in relation to an additional police body, that a person is serving
    with that body only
