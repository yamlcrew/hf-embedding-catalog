      the rulings of the European Court and its reasoning. It is true that the formal rulings are set out at the end of the
      judgments and to that extent stand apart from the Court''s reasons, but the reasoning is in most cases essential to
      an understanding of the principles which the ruling seeks to encapsulate. In the cases to which I have referred the
      Court has held that the loss of time inherent in flight delay constitutes an inconvenience that cannot be categorised
      as "damage occasioned by delay" within the meaning of article 19 and does not come within the scope of article 29 (or,
      therefore, article 35): Nelson, paragraph 55. It has also held that the obligation to pay compensation for delay under
      Regulation 261 operates at an earlier stage than the system laid down in article 29: Nelson, paragraph 57. The Court''s
      decision in Moré is, of course, consistent with that analysis. Moreover, in the light of the competing arguments in
      that case it cannot have contemplated that national courts would resort to the Convention in preference to the domestic
      law of limitation. In my view, therefore, we are bound to follow and apply the decisions of the European Court in relation
      to the nature of the claim for compensation under article 7 and its compatibility with the Montreal Convention. That
      includes the Court''s ruling that the obligation in question lies outside the scope of the Convention. If that be correct,
      the Convention has no application to it. Insofar as it is said that that involves a departure from Sidhu, it is no more
      than a consequence of the decisions in IATA, Sturgeon, Nelson and Moré. The European Court has ruled on the nature of
      the obligations created by Regulation 261 and its decisions have to be taken into account when deciding whether the
