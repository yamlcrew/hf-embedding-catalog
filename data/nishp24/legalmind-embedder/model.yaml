    in detail and it was agreed that Mr Critchley would draft a document to show how the Composite Codes would operate. That
    night Mr Critchley drafted what has been called the CRED (Composite Rates Explanation Document) and he later produced
    a list of composite rates which included what were called Initial Order Rates referenced ORDR 00001 and 00002. ORDR0001
    was defined as: "Emergency call out works other than out of hours service. Receive call from Employer, attend on site
    (any trade) and carry out works to make safe and effect a permanent or temporary repair as appropriate. The rate will
    include for one hours labour (this will be from the time the Contractor is notified of the call out until the time that
