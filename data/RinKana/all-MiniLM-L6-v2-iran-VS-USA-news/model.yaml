  sentences:
  - 'When the Supreme Leader emerges, he''ll be leading a changed Iran | After spending nearly two weeks in a secret bunker
    somewhere in Iran during his country''s war with Israel, the supreme leader, Ayatollah Ali Khamenei, 86, might want to
    use the opportunity of the ceasefire to venture out.


    He is believed to be holed up, incommunicado, for the fear of being assassinated by Israel. Even top government officials
    apparently have had no contact with him.


    He would be well advised to be cautious, despite the fragile ceasefire that the US President Donald Trump and the Emir
    of Qatar brokered. Though President Trump reportedly told Israel not to kill Iran''s supreme leader, Israeli Prime Minister
    Benjamin Netanyahu did not rule it out.


    When – or indeed if – he does emerge from hiding, he will see a landscape of death and destruction. He will no doubt still
    appear on state TV claiming victory in the conflict. He will plot to restore his image. But he will face new realities
    – even a new era.


    The war has left the country significantly weakened and him a diminished man.'
  - 'German asylum benefits cuts violate EU law, top court rules | In a victory for rejected asylum-seekers, the European
    Court of Justice has ruled they must be given more than just the bare minimum to survive. But as the EU''s new migration
    pact kicks in, will relief be short-lived?


    What does a human being need to survive with dignity while they await asylum and to be transferred from one European country
    to another?


    That was the question before the judges of European Court of justice (ECJ) as they delivered a ruling on whether benefits
    provided by Germany fell short of the EU''s expectations.


    The ECJ was asked to interpret the rights of an Afghan asylum-seeker, identified as FB, whose asylum application had been
    rejected by Germany and who was due to be deported to Romania, where he first claimed asylum in 2021.


    While FB waited to be transferred he was provided food, heated accommodation, and hygiene and healthcare, but received
    no assistance for clothing and other household items. A law in Germany slashed benefits for rejected asylum-seekers in
    what activists described as "bed, bread, and soap" subsistence.


    FB sued the Bavarian district of Schweinfurt after his benefits were cut in 2022, but the case finally ended up at the
    ECJ.


    As the far right have expanded electorally and centrist parties have lost ground, Germany has reduced benefits for asylum-seekers
    [File photo: Sept. 2015] Image: Martin Meissner/AP Photo/picture alliance


    On Thursday, the court ruled in favor of the rejected asylum-seeker and said that basic necessities such as clothing and
    household goods may not be withdrawn even if an asylum application is rejected.


    Clothing is among the "most basic needs" the court said, and cash benefits for daily necessities such as travel tickets
    and communication devices ensure a "minimum level of participation in the social and cultural life" of the member state
    in which a person resides. This allowance contributes "to ensuring the subsistence of the applicant and to protecting
    the applicant''s physical and mental health."


    Activists welcomed the ruling and expect it to have an EU-wide impact. But a new migration pact makes things unclear.


    Germany restricted asylum benefits in 2024


    FB applied for asylum in Germany in 2021. A year later, his application was deemed "inadmissible."


    The EU''s migration policy is governed by the Dublin Regulation, under which an application for asylum is deemed inadmissible
    when another participating state has already assumed or been designated responsibility for the claim.


    This is meant to discourage secondary movement and stop asylum-seekers from flocking to a few nations, and instead distribute
    them across the bloc.


    Migration has become a top political issue in Germany over the last decade, used as a major talking point by the far-right
    Alternative for Germany (AfD) to drum up electoral support. In a bid to win back voters, the elected German government
    has come under pressure to reduce benefits for asylum-seekers.


    Under an amendment to the Asylum Seekers'' Benefits Act in 2024, Germany allowed the granting of food, housing and healthcare
    but reduced the provision of cash.


    "In practice, that can mean none or very little cash," Wiebke Judith, a policy and advocacy officer for Pro Asyl, a German
    NGO working for human rights and refugee protection in Europe, told DW.


    Activists claimed the absence of clothing and cash denied adequate living standards and hence violated the spirit of the
    EU''s Reception Conditions Directive, which sets minimum standards for assistance to asylum applicants across the bloc,
    including for those who have been rejected.


    "The sociocultural component of the subsistence minimum was eliminated" by Germany in the Asylum Seekers'' Benefits Act,
    Pro Asyl said in a statement. But the court''s ruling "clearly rejected this reduction in benefits," it said.


    The ECJ''s ruling indicates that even rejected asylum-seekers must have access to essential support until their transfer
    is actually carried out.


    AfD capitalizes on ''generous welfare'' benefits


    Far-right and even some conservative politicians in Europe have objected to what they have called "generous welfare" benefits
    for asylum-seekers, describing them as a pull factor attracting migrants from non-EU countries to Europe.


    The AfD in Germany has said migrants pocket cash assistance or send it to families back home. The far-right party also
    claimed credit when the German government introduced a debit card with a fixed amount to make purchases instead of cash
    in 2024.


    But activists have said such restrictions will not deter immigrants, and instead force them to become a part of the informal
    economy. Those fleeing war and persecution, Judith said earlier, won''t be deterred by a lack of benefits.


    As EU''s new migration pact kicks in, will relief be short-lived?


    Thursday''s ruling provides an EU‑wide guidance for national authorities on treating asylum-seekers during transfer procedures,
    reinforcing the protection of fundamental rights throughout the asylum process.


    And yet there are concerns that come June 12, when the new EU migration pact kicks in, the victory at the ECJ may not
    mean much.


    "It won''t help for too long," Gerard Sadik, asylum manager at La Cimade, a French NGO that provides legal support for
    asylum-seekers, told DW. The new migration pact "offers fewer benefits," he said,


    EU migration pact set to tighten border controls To view this video please enable JavaScript, and consider upgrading to
    a web browser that supports HTML5 video


    "The new rules from 12 June say that member states may reduce or withdraw daily allowances" and other benefits "for applicants
    who are required to be present in another member state," Swedish political scientist Bernd Parusel told DW.


    "At the same time, they still need to ensure a standard of living in accordance with union law, including the Charter
    of Fundamental Rights, and international obligations," he added.


    Judith of Pro Asyl was more optimistic and pleased with the court''s direction. "The court''s ruling reveals a direction
    of travel, that it sees personal benefits as essential to a dignified life," she said.


    Edited by: Martin Kuebler'
  - 'Germany, France scrap joint fighter jet program | The next-generation aircraft project has been scrapped following company
    disagreements, dealing a blow to European security cooperation efforts.


    After years of infighting, the Franco-German project to build a joint next-generation fighter jet has collapsed.


    German Chancellor Friedrich Merz and French President Emmanuel Macron agreed last week that manufacturers Dassault and
    Airbus failed to resolve key disputes, officials in Berlin and Paris confirmed on Monday.


    "It was an ambitious, large-scale European project that is now collapsing in the face of reality," said German Defense
    Minister Boris Pistorius on Tuesday.


    The Future Combat Air System (FCAS) program, launched in 2017, aimed to build a next-generation fighter to replace Eurofighters
    and Rafales by around 2040.


    The move to scrap one of Europe''s largest defense projects comes as Western military officials warn of a mounting threat
    from Russia and the United States intensifies pressure on Europe to take care of its own defense.


    What went wrong with FCAS?


    The more than €100 billion ($115 billion) project, launched in 2017, was once billed as a symbol of Franco-German military
    unity.


    But it has been plagued by years of political and industrial disputes.


    French arms giant Dassault Aviation has demanded significantly more control over the project than its industry partner,
    European consortium Airbus Defence and Space.


    The two companies clashed over control of the project''s next phase, access to intellectual property and, above all, differing
    requirements for the aircraft.


    Airbus and Dassault Aviation have not immediately commented.


    German Chancellor Friedrich Merz and French President Emmanuel Macron agree to cancel FCAS fighter jet programme [FILE:
    June 5, 2026] Image: Kay Nietfeld/dpa/picture alliance


    Both governments pushed for the project to succeed


    Rearming Europe has been a priority not only for the continent''s two largest economies but also for all 27 members of
    the European Union, many of whom have expressed concerns about their security following Russia''s invasion of Ukraine.


    The project''s collapse comes despite Merz and Macron publicly vowing to make it succeed.


    "The expertise in military aircraft construction exists in Germany. German industry can and must now prove its capabilities,"
    Merz said, calling for cooperation with other partners.


    Thomas Erndl, the defense policy spokesman for Merz''s conservatives in the German Bundestag, said the decision to finally
    scrap the project was the correct one.


    Franziska Brantner, co-leader of Germany''s Green Party, described the failure to reach a consensus as a serious setback
    for European security and defense policy.


    "Where industry blocks progress, it is the task of politicians to show leadership and push things through," she told the
    Handelsblatt newspaper.


    Germany and France now plan to focus on a Combat Cloud linking aircraft, drones and sensors. Defense officials are due
    to meet in mid-July to reset cooperation around smaller projects.


    Cedric Perrin, chief of the foreign affairs and defense committee at the French Senate, said Macron "was the only one
    who still believed in the survival of FCAS."


