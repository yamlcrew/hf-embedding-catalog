      The US president wrote on his Truth Social platform that the Touska was seized by the US Navy after failing to respond
      to a warning to stop. Iran said it was a violation of the ceasefire and it would retaliate soon for the "act of armed
      piracy".


      The announcement came after the White House confirmed US Vice-President JD Vance would lead another delegation for a
      second round of talks on ending the war with Iran in Pakistan.


      Tehran has not yet confirmed its attendance. Iranian state media has reported that officials will not participate while
      the US blockade remains in place.


      "Today, an Iranian-flagged cargo ship named TOUSKA, nearly 900 feet long and weighing almost as much as an aircraft
      carrier, tried to get past our Naval Blockade, and it did not go well for them," Trump wrote.


