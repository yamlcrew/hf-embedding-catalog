      al-Anbiya, said the US in "violation of the ceasefire opened fire on one of Iran''s commercial vessels in the waters
      of the Sea of Oman, disabled its navigation system, and boarded it" by "deploying" marines.


      "Armed Forces of the Islamic Republic of Iran will soon respond to and retaliate for this act of armed piracy by the
      US Navy," reads the statement.


      Trump said on Friday that the naval blockade of Iranian ports would continue until a deal was agreed by the two countries.


