  - source_sentence: Iran Israel conflict 2025
    sentences:
    - 'US ‘locked and loaded’ to resume Iran strikes if nuclear talks fail, Vance warns; IDF on high alert | President Donald
      Trump said Monday he is delaying a planned military strike on Iran after Gulf allies urged him to give negotiations
      more time, saying there is a “very good chance” of reaching a deal to end the war without renewed U.S. attacks.


      "We were getting ready to do a very major attack [Tuesday], and I put it off for a little while — hopefully maybe forever,"
      Trump said, "because we''ve had very big discussions with Iran, and we''ll see what they amount to."


      "There seems to be a very good chance that they can work something out,” Trump told reporters at the White House. “If
      we can do that without bombing the hell out of them, I’d be very happy.”


      The announcement marked the latest shift in Trump’s handling of the fragile ceasefire reached in mid-April. For weeks,
      the president has warned Iran that fighting could resume if it did not accept a deal, while repeatedly setting deadlines
      and then backing away from them.


      Over the weekend, Trump warned that “the Clock is Ticking” and said Iran needed to move “FAST, or there won’t be anything
      left of them.”


      Trump first disclosed the pause in a social media post Monday, saying he had ordered the U.S. military to be ready “to
      go forward with a full, large scale assault of Iran, on a moment’s notice” if an acceptable deal is not reached.


      He later told reporters that Gulf allies, including Qatar, Saudi Arabia and the United Arab Emirates, asked him to delay
      the strike by two to three days because they believe talks with Iran are close to producing an agreement.


      Trump called the delay a “very positive development,” though he acknowledged past moments when diplomacy appeared close
      to succeeding before collapsing.


      “But this is a little bit different,” Trump said.'
    - 'Iran-Israel Conflict: Impacts on Global Economy and Trade | TEMPO.CO, Jakarta - The conflict between Israel and Iran
      has rapidly escalated after an unprecedented attack against Iran''s nuclear facility on Friday, June 13, 2025. Not only
      affecting the region''s stability, the conflict also affects the global economy and the world energy market.


      INDIAN EXPORTS AFFECTED


      The conflict between Iran and Israel is adding to the global economic uncertainty, impacting international trade, including
      India''s exports. Exporters estimate that shipping tariffs by air and sea will bloat.


      India''s exports to Europe and countries like Russia are potentially affected by this situation. If the conflict persists,
      the movement of merchant vessels in strategic routes, such as the Strait of Hormuz connecting Iran and the United Arab
      Emirates (UAE), as well as the waters of the Red Sea, is expected to be disrupted.


      "The war will further hurt global trade. The situation was gradually improving but now again the trade will be impacted.
      Our exports to Europe and countries like Russia may get hurt. Freight rates and insurance are expected to increase,"
      said President of the Federation of Indian Export Organizations (FIEO) SC Ralhan, as quoted from the Economic Times.


      RED SEA SHIPPING


      Exporter and Founder of Technocraft Industries Ltd, SK Saraf, stated that the real impact of the conflict between the
      two countries is seen in the increased shipping and insurance costs after the lull. This is because the Red Sea route
      will slowly return to normal.


      Furthermore, Saraf also warned that if the war between Iran and Israel lasts more than a week, global trade will face
      major difficulties. "Iran and Israel too are our big trading partners," he said.


      Currently, cargo ships are slowly reverting to using the Red Sea route, which previously was able to cut delivery times
      to the United States and Europe from India and other Asian regions by 15-20 days. However, if ships start avoiding this
      route due to the conflict, shipping costs are expected to soar and must be borne by the traders.


      The increased hostilities in the region, briefly halted cargo traffic through the Red Sea due to the Houthi rebel attacks
      on commercial ships. After the United States intervened with attacks on the rebel group, the attacks on the ships ceased.


      "Everything depends on whether the conflict remains localized or expands to include other countries. Its impact will
      be first felt in global crude oil prices," said Director General of FIEO Ajay Sahai.


      In addition to the Red Sea route, the Strait of Hormuz has become another crucial point, adding pressure on the world
      energy trade.


      Located between Oman and Iran, this strait connects the Persian Gulf with the Gulf of Oman and the Arabian Sea. About
      21 percent of the world''s liquid oil consumption passes through this route.


      Countries like China, India, Japan, and South Korea are the main destinations for crude oil passing through the Strait
      of Hormuz. Oman also uses this route to supply liquefied natural gas to India. Only Saudi Arabia and the UAE have alternative
      pipeline networks that can bypass the Strait of Hormuz.


      Editor’s Choice: Middle Eastern Nations Condemn Israel''s Strikes on Iran, Urge De-escalation


      Click here to get the latest news updates from Tempo on Google News'
    - 'Pentagon identifies six US soldiers killed in Iran conflict | The US military has confirmed the identities of all six
      soldiers killed in the conflict with Iran.


      They were killed when an "unmanned aircraft system" evaded air defences to hit a command centre in Port Shuaiba, Kuwait,
      on Sunday.


      US Central Command initially said three soldiers died in the attack, but officials confirmed on Monday the death toll
      had doubled, after one person succumbed to injuries and two more bodies were found in the rubble.


      Those killed were Chief Warrant Officer 3 Robert M Marzan, 54, Maj Jeffrey R O''Brien, 45, Capt Cody Khork, 35, Sgt
      Noah Tietjens, 42, Sgt Nicole Amor, 39, and Sgt Declan Coady, 20, who was posthumously promoted from specialist.


      The six identified by the Pentagon were members of the Army Reserve, which according to its website provides logistical
      support to broader US military operations.


      Four were identified on Tuesday while the identities of the last two - Marzan and O''Brien - were disclosed on Wednesday.


      "These men and women all bravely volunteered to defend our country, and their sacrifice will never be forgotten," US
      Army Secretary Daniel Driscoll said in a statement.


      White House Press Secretary Karoline Leavitt said on Wednesday that President Donald Trump intends to attend "the dignified
      transfer of these American heroes to stand in grief alongside their families".


      She added that the defence department was scheduling the repatriation of the remains.


      Khork had previously deployed to Saudi Arabia, Guantanamo Bay and Poland.


      The Florida resident had wanted to serve in the military since a young age, and enlisted in the Reserve Officers'' Training
      Corps (ROTC) programme at his university, his family told the Associated Press.


      Khork was "truly the life of the party, known for his infectious spirit, generous heart, and deep care for those who
      served alongside him and for everyone blessed to know him", his mother, Donna Burhans, father, James Khork, and stepmother,
      Stacey Khork, said in a statement.


      Amor, of Minnesota, had previously deployed to Kuwait and Iraq.


      "She was almost home," her husband, Joey Amor, told the AP. "You don''t go to Kuwait thinking something''s going to
      happen, and for her to be one of the first – it hurts."


      She had a son in high school and a daughter in primary school, and enjoyed gardening and rollerblading with them.'
  - source_sentence: Iran supreme leader
    sentences:
    - 'Iran must select a new leader - the coming days will show if the regime can hold out | The killing of Iran''s Supreme
      Leader, Ali Khamenei, in the opening wave of joint US-Israeli strikes has pushed the Islamic Republic into its most
      precarious moment since 1979.


      The operation targeted senior military and political leadership in what Washington described as a decisive effort to
      cripple Iran''s command structure.


      By Saturday night, reports about Khamenei''s death were circulating widely, setting off scenes few would have imagined
      possible just days earlier.


      Videos showed pockets of celebration in major Iranian cities. Similar scenes unfolded among large parts of the Iranian
      diaspora abroad. For many, the elimination of the supreme leader appeared to represent a historic rupture - an opening
      that years of civil resistance had failed to achieve on its own.


      Both the US president and Israel''s prime minister used direct language in their public statements following the strikes.
      President Donald Trump urged Iranians to seize the opportunity to "take over your government". Israeli Prime Minister
      Benjamin Netanyahu echoed the theme, arguing that regime change is both desirable and attainable.


      While the military phase of Operation Epic Fury, as the US have dubbed it, appeared tightly co-ordinated and largely
      under US control, the political appeal to the Iranian public remains far less predictable.


      On Sunday morning, Iranian state television formally confirmed Khamenei''s death, before swiftly announcing the formation
      of a temporary council of three men to assume executive authority.'
    - 'Trump vows US will take and ‘probably destroy’ Iran’s uranium | See more of our coverage in your search results.


      WASHINGTON — President Trump said Thursday that Iran cannot have its enriched uranium, and the US will “probably destroy”
      it once it’s taken out of the country.


      “We will get it. We don’t need it. We don’t want it. We’ll probably destroy it after we get it, but we’re not going
      to let them have it,” Trump told reporters in the Oval Office.


      Trump did not say how he would destroy the radioactive element, which typically is stored with care after being used
      for energy production.


      President Trump said he plans to “probably destroy” Iran’s enriched uranium if negotiations result in its relinquishment.
      Getty Images


      Follow The Post’s live coverage of President Trump and national politics for the latest news and analysis


      Iran has so far refused to negotiate about giving up its stockpile of about 1,000 pounds of near-weapons-grade uranium.


      Trump special envoy Steve Witkoff said that the country’s reps boasted before the war that the stockpile was enough
      to make 11 nuclear bombs.


      A statement attributed to Iranian Supreme Leader Mojtaba Khamenei on Thursday directed negotiators not to budge on giving
      up the uranium.


      Although Trump has claimed Iranian negotiators privately agreed at points to give up their “nuclear dust,” only to later
      backtrack, the Islamic Republic has denied it.


      Iran has refused to consider giving up its stockpiles — including about 1,000 pounds of near-weapons-grade uranium.
      AP


      Trump thus far is maintaining a cease-fire that began on April 7, while threatening to resume strikes if talks sour.


      “Look, we’re going to either make sure they don’t have a nuclear weapon, or we’re going to have to do something very
      drastic,” Trump said Thursday.


      Tehran has issued peace proposals demanding to be treated as the conflict’s victor, including being granted reparations,
      sanctions relief, recognition of the nation’s ownership of the Strait of Hormuz, and removal of US troops from neighboring
      countries.


      Trump has responded to the stalemate by blockading the other end of the strait — which carried 20% of the world’s oil
      before the war.


      With Iran threatening and attacking tanker ships at one end, and the US Navy stopping any Iranian-linked ships at the
      other, traffic through Hormuz has slowed to a trickle.


      It’s unclear what potential compromise might develop for the nuclear material, which has been Trump’s central war aim.


      Earlier this week, Trump said he was “an hour away” from scrapping his six-week cease-fire and launching a blitz Tuesday
      before deciding to give peace a chance.


      Vice President JD Vance revealed Tuesday that Iranian negotiators haven’t raised a proposal from the regime’s Russian
      ally, Vladimir Putin, to take possession of the material as a face-saving way to end to the war.'
    - 'US-Iran War LIVE: Will US and Iran make a peace deal? Netanyahu wants to resume strikes, Trump says hold | US-Iran
      War LIVE: The deadline to make a peace deal to end the Iran war is nearing, and there seems to be a tiff between US
      President Donald Trump and Israeli Prime Minister Benjamin Netanyahu.


      There are reports that while Netanyahu wants to resume strikes on Iran, fearing that the delay and wait for the deal
      will only benefit the Iranian regime


      Donald Trump, however, wishes to wait to finalise the peace deal, thereby ending the war and opening the Strait of Hormuz,
      the closure of which has sent oil and energy prices soaring.


      Trump recently said he had postponed strikes on Iran, planned for Tuesday, May 19, following a request from Arab nations
      including Qatar and the UAE. A revised peace memo was drafted by Qatar and Pakistan with input from the other regional
      mediators to try to bridge the gaps between the US and Iran, Axios reported, quoting sources.


      Stay tuned for LIVE updates on Iran and the US deal.'
  - source_sentence: Strait of Hormuz crisis
    sentences:
    - 'Tehran will never cede control of Strait of Hormuz, senior Iranian politician tells BBC | Iranian officials are so
      far silent on whether their own team, led by parliamentary speaker Mohammad Bagher Ghalibaf, will return to Pakistan.
      Local media are reporting that Iran won''t attend as long as a US blockade of Iranian ports remains in force.


      Trump has repeatedly ordered Iran to open this maritime corridor, including in an expletive-laden social media post
      on 5 April in which he warned Iran would be "living in hell" if it failed to comply with his command.


      He''s now accused Tehran of trying to "blackmail" the US.


      "I don''t expect much from a man who twists the truth," Azizi scoffs. "We are just defending our rights in the face
      of American blackmail."


      Like many high-level Iranians, he often hits back at Trump with mocking social media posts on X. Their trolling underlies
      how they enjoy access to the international internet denied to the vast majority of Iranians in the near-total digital
      blackout in force for many weeks.


      Azizi, whose parliamentary file also includes national security, wouldn''t say when it would be lifted, only emphasising
      "when it is safe and secure we will lift the ban so that the enemy will not take advantage".


      I also asked him about recent waves of arrests and what human rights groups, including Amnesty International, say are
      dozens of death sentences handed down to protesters detained during January''s nationwide protests, which were crushed
      with lethal forces and killed many thousands. Several executions, including of young people, have recently been carried
      out.


      Azizi repeated the government''s claim that the US and Israeli spy agencies (the CIA and Mossad, respectively) had been
      involved in the unrest.


      He dismissed rising concern among some Iranians that internal security will tighten further.


      "In war, even in a ceasefire, there are rules," he declared.


      The BBC''s chief international correspondent Lyse Doucet is reporting from Tehran on condition that none of her material
      is used on the BBC''s Persian Service. These restrictions apply to all international media organisations operating in
      Iran.'
    - 'US pressures Iran with new sanctions over ''malign activity'' | The US has imposed sanctions on six people and three
      companies it says have ties to Iran''s elite military force, the Revolutionary Guard Corps (IRGC).


      Treasury Secretary Steven Mnuchin said the penalties targeted those who had funnelled millions of dollars to the group,
      funding its "malign activity".


      Iran''s central bank helped the IRGC to access US dollars via "a large-scale currency exchange network," he said.


      The Treasury Department said all six individuals were Iranian.


      US individuals and entities will be barred from doing business with them following the move, which was carried out in
      conjunction with the United Arab Emirates (UAE).


      "The Iranian regime and its central bank have abused access to entities in the UAE to acquire US dollars to fund the
      (IRGC''s) malign activities, including to fund and arm its regional proxy groups," Mr Mnuchin said in a statement.


      "We are intent on cutting off IRGC revenue streams wherever their source and whatever their destination," he added.'
    - 'G7 leaders urge ''de-escalation'' but stop short of calling for Israel-Iran ceasefire | The leaders of G7 nations have
      urged a "de-escalation of hostilities in the Middle East, including a ceasefire in Gaza" - but stopped short of calling
      for a ceasefire between Israel and Iran, during their summit in Canada.


      The joint statement was signed by US President Donald Trump - who then left the meeting early, his intentions unclear.
      His press secretary said this was because of events in the Middle East.


      The president himself merely said he was returning to Washington for "big stuff", but denied this was related to a ceasefire.


      He earlier urged Iranians to "immediately evacuate Tehran". This triggered speculation that US forces might join Israel''s
      attacks - something denied by American officials.


      The gathering of world leaders at Kananaskis, in the Canadian Rockies, has been overshadowed by the Middle East conflict.


      The leaders'' statement, published as Trump left Canada, said Israel had a right to defend itself, and that Iran was
      a source of terror that should not have a nuclear weapon. Its call for a resolution of the crisis that led to a broader
      de-escalation of hostilities in the Middle East amounted to a diplomatic compromise that preserved G7 unity but watered
      down the statement''s impact.


      As he left, Trump told reporters: "I have to be back early for obvious reasons."


      He later wrote again on Truth Social, lambasting another G7 attendee, President Emmanuel Macron of France. Trump said
      his "publicity seeking" counterpart mistakenly suggested he was working on a ceasefire.


      "Wrong! He has no idea why I am now on my way to Washington, but it certainly has nothing to do with a Cease Fire,"
      Trump wrote. "Much bigger than that. Whether purposely or not, Emmanuel always gets it wrong. Stay Tuned!"


      G7 leaders had said they understood Trump''s need to leave early. "If the United States can achieve a ceasefire, that''s
      a very good thing," said Macron.


      Reports circulated that Trump had instructed the White House National Security Council to meet upon his return.


      US Defence Secretary Pete Hegseth has announced the "deployment of additional capabilities" to the Middle East to enhance
      the Pentagon''s "defensive posture", despite US officials'' denial that they were about to join the Israeli offensive.


      Trump''s press secretary, Karoline Leavitt, was at pains to emphasise that Trump had "a great day" at the summit, saying
      much was accomplished, including a trade deal between the US and UK.


      She did not elaborate on his departure other than to say it was because of "what''s going on in the Middle East".


      Trump''s exit means he will miss in-person meetings with Ukrainian President Volodymyr Zelensky and Mexican President
      Claudia Sheinbaum that were scheduled for Tuesday, the final day of the summit.'
  - source_sentence: rss
    sentences:
    - 'When the Supreme Leader emerges, he''ll be leading a changed Iran | After spending nearly two weeks in a secret bunker
      somewhere in Iran during his country''s war with Israel, the supreme leader, Ayatollah Ali Khamenei, 86, might want
      to use the opportunity of the ceasefire to venture out.


      He is believed to be holed up, incommunicado, for the fear of being assassinated by Israel. Even top government officials
      apparently have had no contact with him.


      He would be well advised to be cautious, despite the fragile ceasefire that the US President Donald Trump and the Emir
      of Qatar brokered. Though President Trump reportedly told Israel not to kill Iran''s supreme leader, Israeli Prime Minister
      Benjamin Netanyahu did not rule it out.


      When – or indeed if – he does emerge from hiding, he will see a landscape of death and destruction. He will no doubt
      still appear on state TV claiming victory in the conflict. He will plot to restore his image. But he will face new realities
      – even a new era.


      The war has left the country significantly weakened and him a diminished man.'
    - 'German asylum benefits cuts violate EU law, top court rules | In a victory for rejected asylum-seekers, the European
      Court of Justice has ruled they must be given more than just the bare minimum to survive. But as the EU''s new migration
      pact kicks in, will relief be short-lived?


      What does a human being need to survive with dignity while they await asylum and to be transferred from one European
      country to another?


      That was the question before the judges of European Court of justice (ECJ) as they delivered a ruling on whether benefits
      provided by Germany fell short of the EU''s expectations.


      The ECJ was asked to interpret the rights of an Afghan asylum-seeker, identified as FB, whose asylum application had
      been rejected by Germany and who was due to be deported to Romania, where he first claimed asylum in 2021.


      While FB waited to be transferred he was provided food, heated accommodation, and hygiene and healthcare, but received
      no assistance for clothing and other household items. A law in Germany slashed benefits for rejected asylum-seekers
      in what activists described as "bed, bread, and soap" subsistence.


      FB sued the Bavarian district of Schweinfurt after his benefits were cut in 2022, but the case finally ended up at the
      ECJ.


      As the far right have expanded electorally and centrist parties have lost ground, Germany has reduced benefits for asylum-seekers
      [File photo: Sept. 2015] Image: Martin Meissner/AP Photo/picture alliance


      On Thursday, the court ruled in favor of the rejected asylum-seeker and said that basic necessities such as clothing
      and household goods may not be withdrawn even if an asylum application is rejected.


      Clothing is among the "most basic needs" the court said, and cash benefits for daily necessities such as travel tickets
      and communication devices ensure a "minimum level of participation in the social and cultural life" of the member state
      in which a person resides. This allowance contributes "to ensuring the subsistence of the applicant and to protecting
      the applicant''s physical and mental health."


      Activists welcomed the ruling and expect it to have an EU-wide impact. But a new migration pact makes things unclear.


      Germany restricted asylum benefits in 2024


      FB applied for asylum in Germany in 2021. A year later, his application was deemed "inadmissible."


      The EU''s migration policy is governed by the Dublin Regulation, under which an application for asylum is deemed inadmissible
      when another participating state has already assumed or been designated responsibility for the claim.


      This is meant to discourage secondary movement and stop asylum-seekers from flocking to a few nations, and instead distribute
      them across the bloc.


      Migration has become a top political issue in Germany over the last decade, used as a major talking point by the far-right
      Alternative for Germany (AfD) to drum up electoral support. In a bid to win back voters, the elected German government
      has come under pressure to reduce benefits for asylum-seekers.


      Under an amendment to the Asylum Seekers'' Benefits Act in 2024, Germany allowed the granting of food, housing and healthcare
      but reduced the provision of cash.


      "In practice, that can mean none or very little cash," Wiebke Judith, a policy and advocacy officer for Pro Asyl, a
      German NGO working for human rights and refugee protection in Europe, told DW.


      Activists claimed the absence of clothing and cash denied adequate living standards and hence violated the spirit of
      the EU''s Reception Conditions Directive, which sets minimum standards for assistance to asylum applicants across the
      bloc, including for those who have been rejected.


      "The sociocultural component of the subsistence minimum was eliminated" by Germany in the Asylum Seekers'' Benefits
      Act, Pro Asyl said in a statement. But the court''s ruling "clearly rejected this reduction in benefits," it said.


      The ECJ''s ruling indicates that even rejected asylum-seekers must have access to essential support until their transfer
      is actually carried out.


      AfD capitalizes on ''generous welfare'' benefits


      Far-right and even some conservative politicians in Europe have objected to what they have called "generous welfare"
      benefits for asylum-seekers, describing them as a pull factor attracting migrants from non-EU countries to Europe.


      The AfD in Germany has said migrants pocket cash assistance or send it to families back home. The far-right party also
      claimed credit when the German government introduced a debit card with a fixed amount to make purchases instead of cash
      in 2024.


      But activists have said such restrictions will not deter immigrants, and instead force them to become a part of the
      informal economy. Those fleeing war and persecution, Judith said earlier, won''t be deterred by a lack of benefits.


      As EU''s new migration pact kicks in, will relief be short-lived?


      Thursday''s ruling provides an EU‑wide guidance for national authorities on treating asylum-seekers during transfer
      procedures, reinforcing the protection of fundamental rights throughout the asylum process.


      And yet there are concerns that come June 12, when the new EU migration pact kicks in, the victory at the ECJ may not
      mean much.


      "It won''t help for too long," Gerard Sadik, asylum manager at La Cimade, a French NGO that provides legal support for
      asylum-seekers, told DW. The new migration pact "offers fewer benefits," he said,


      EU migration pact set to tighten border controls To view this video please enable JavaScript, and consider upgrading
      to a web browser that supports HTML5 video


      "The new rules from 12 June say that member states may reduce or withdraw daily allowances" and other benefits "for
      applicants who are required to be present in another member state," Swedish political scientist Bernd Parusel told DW.


      "At the same time, they still need to ensure a standard of living in accordance with union law, including the Charter
      of Fundamental Rights, and international obligations," he added.


      Judith of Pro Asyl was more optimistic and pleased with the court''s direction. "The court''s ruling reveals a direction
      of travel, that it sees personal benefits as essential to a dignified life," she said.


      Edited by: Martin Kuebler'
    - 'Germany, France scrap joint fighter jet program | The next-generation aircraft project has been scrapped following
      company disagreements, dealing a blow to European security cooperation efforts.


      After years of infighting, the Franco-German project to build a joint next-generation fighter jet has collapsed.


      German Chancellor Friedrich Merz and French President Emmanuel Macron agreed last week that manufacturers Dassault and
      Airbus failed to resolve key disputes, officials in Berlin and Paris confirmed on Monday.


      "It was an ambitious, large-scale European project that is now collapsing in the face of reality," said German Defense
      Minister Boris Pistorius on Tuesday.


      The Future Combat Air System (FCAS) program, launched in 2017, aimed to build a next-generation fighter to replace Eurofighters
      and Rafales by around 2040.


      The move to scrap one of Europe''s largest defense projects comes as Western military officials warn of a mounting threat
      from Russia and the United States intensifies pressure on Europe to take care of its own defense.


      What went wrong with FCAS?


      The more than €100 billion ($115 billion) project, launched in 2017, was once billed as a symbol of Franco-German military
      unity.


      But it has been plagued by years of political and industrial disputes.


      French arms giant Dassault Aviation has demanded significantly more control over the project than its industry partner,
      European consortium Airbus Defence and Space.


      The two companies clashed over control of the project''s next phase, access to intellectual property and, above all,
      differing requirements for the aircraft.


      Airbus and Dassault Aviation have not immediately commented.


      German Chancellor Friedrich Merz and French President Emmanuel Macron agree to cancel FCAS fighter jet programme [FILE:
      June 5, 2026] Image: Kay Nietfeld/dpa/picture alliance


      Both governments pushed for the project to succeed


      Rearming Europe has been a priority not only for the continent''s two largest economies but also for all 27 members
      of the European Union, many of whom have expressed concerns about their security following Russia''s invasion of Ukraine.


      The project''s collapse comes despite Merz and Macron publicly vowing to make it succeed.


      "The expertise in military aircraft construction exists in Germany. German industry can and must now prove its capabilities,"
      Merz said, calling for cooperation with other partners.


      Thomas Erndl, the defense policy spokesman for Merz''s conservatives in the German Bundestag, said the decision to finally
      scrap the project was the correct one.


      Franziska Brantner, co-leader of Germany''s Green Party, described the failure to reach a consensus as a serious setback
      for European security and defense policy.


      "Where industry blocks progress, it is the task of politicians to show leadership and push things through," she told
      the Handelsblatt newspaper.


      Germany and France now plan to focus on a Combat Cloud linking aircraft, drones and sensors. Defense officials are due
      to meet in mid-July to reset cooperation around smaller projects.


      Cedric Perrin, chief of the foreign affairs and defense committee at the French Senate, said Macron "was the only one
      who still believed in the survival of FCAS."


