  widget:
  - source_sentence: Điều 1 Quyết_định 1788 / QĐ - UBND Quy_định tạm_thời định mức chi_phí trong xây_dựng
    sentences:
    - "Tại Điều 54 Luật Phá_sản 2014 quy_định thứ tự phân_chia tài_sản như sau : \n \n Thứ_tự phân_chia tài_sản \n 1 . Trường_hợp\
      \ Thẩm_phán ra quyết_định tuyên_bố phá_sản thì tài_sản của doanh_nghiệp , hợp_tác_xã được phân_chia theo thứ tự sau\
      \ : \n a ) Chi_phí phá_sản ; \n b ) Khoản nợ lương , trợ_cấp thôi_việc , bảo_hiểm xã_hội , bảo_hiểm y_tế đối_với người\
      \ lao_động , quyền_lợi khác theo hợp_đồng lao_động và thỏa_ước lao_động tập_thể đã ký_kết ; \n c ) Khoản nợ phát_sinh\
      \ sau khi mở thủ_tục phá_sản nhằm mục_đích phục_hồi hoạt_động_kinh_doanh của doanh_nghiệp , hợp_tác_xã ; \n d ) Nghĩa_vụ\
      \ tài_chính đối_với Nhà_nước ; khoản nợ không có bảo_đảm phải trả cho chủ_nợ trong danh_sách chủ_nợ ; khoản nợ có bảo_đảm\
      \ chưa được thanh_toán do giá_trị tài_sản bảo_đảm không đủ thanh_toán nợ . \n 2 . Trường_hợp giá_trị tài_sản của doanh_nghiệp\
      \ , hợp_tác_xã sau khi đã thanh_toán đủ các khoản quy_định tại khoản 1 Điều này mà vẫn còn thì phần còn lại này thuộc\
      \ về : \n a ) Thành_viên hợp_tác_xã , hợp_tác_xã thành_viên ; \n b ) Chủ doanh_nghiệp tư_nhân ; \n c ) Chủ sở_hữu công_ty\
      \ trách_nhiệm hữu_hạn một thành_viên ; \n d ) Thành_viên của công_ty trách_nhiệm hữu_hạn hai thành_viên trở lên , cổ_đông\
      \ của công_ty cổ_phần ; \n đ ) Thành_viên của Công_ty hợp danh . \n 3 . Nếu giá_trị tài_sản không đủ để thanh_toán theo\
      \ quy_định tại khoản 1 Điều này thì từng đối_tượng cùng một thứ tự ưu_tiên được thanh_toán theo tỷ_lệ phần_trăm tương_ứng\
      \ với số nợ . \n \n \n Như_vậy , khi có quyết_định tuyên_bố phá_sản thì doanh_nghiệp giải_quyết các khoản nợ theo thứ\
      \ tự phân_chia tài_sản như sau : \n - Chi_phí phá_sản ; \n - Khoản nợ lương , trợ_cấp thôi_việc , bảo_hiểm xã_hội ,\
      \ bảo_hiểm y_tế đối_với người lao_động , quyền_lợi khác theo hợp_đồng lao_động và thỏa_ước lao_động tập_thể đã ký_kết\
      \ ; \n - Khoản nợ phát_sinh sau khi mở thủ_tục phá_sản nhằm mục_đích phục_hồi hoạt_động_kinh_doanh của doanh_nghiệp\
      \ , hợp_tác_xã ; \n - Nghĩa_vụ tài_chính đối_với Nhà_nước ; khoản nợ không có bảo_đảm phải trả cho chủ_nợ trong danh_sách\
      \ chủ_nợ ; khoản nợ có bảo_đảm chưa được thanh_toán do giá_trị tài_sản bảo_đảm không đủ thanh_toán nợ ."
    - "Điều 33 . Hành_vi vi_phạm_quy_định của pháp_luật về thực_hành tiết_kiệm , chống lãng_phí trong khai_thác , sử_dụng\
      \ tài_nguyên nhưng chưa đến mức truy_cứu trách_nhiệm hình_sự 1 . Phạt tiền từ 1.000.000 đồng đến 5.000.000 đồng đối_với\
      \ hành_vi cản_trở trái_phép việc thực_hiện nghiên_cứu , ứng_dụng khoa_học , công_nghệ , thực_hiện các dự_án sử_dụng\
      \ tài_nguyên tái_chế . \n 2 . Phạt tiền từ 20.000.000 đồng đến 30.000.000 đồng đối_với hành_vi khai_thác , sử_dụng tài_nguyên\
      \ không đúng quy_hoạch , kế_hoạch , quy_trình đã được cơ_quan nhà_nước có thẩm_quyền phê_duyệt ."
    - "Điều 1 Quyết_định 1788 / QĐ - UBND Quy_định tạm_thời định mức chi_phí trong xây_dựng có nội_dung như sau : \n \n Điều\
      \ 1 . : Quy_định tạm_thời một_số định mức chi_phí trong xây_dựng cơ_bản lâm_sinh thuộc Dự_án 661 trên địa_bàn tỉnh Quảng_Bình\
      \ như sau : \n 1 . Đối_với trồng và chăm_sóc rừng trồng phòng_hộ , rừng đặc_dụng : \n - Chi_phí trực_tiếp ( nhân_công\
      \ , vật_tư ) được xây_dựng trên cơ_sở định mức ban_hành tại Quyết_định số 38 / 2005 / QĐ - BNN ngày 06 / 7 / 2005 của\
      \ Bộ Nông_nghiệp và PTNT và đơn_giá trên địa_bàn tỉnh . \n - Chi_phí phục_vụ được tính theo Phụ_lục kèm theo Quyết_định\
      \ này . \n 2 . Đối_với khoanh nuôi xúc_tiến tái_sinh có trồng bổ_sung cây lâm_nghiệp : \n Mức đầu_tư bình_quân là 2\
      \ triệu đồng / ha / 6 năm . Mức đầu_tư cụ_thể cho từng năm theo Phụ_lục kèm theo Quyết_định này ."
  - source_sentence: Dân_quân tự_vệ được hưởng kinh_phí khám chữa bệnh khi không tham_gia BHYT phải thỏa_các điều_kiện nào
      ?
    sentences:
    - 'Tôi làm_việc trong 1 công_ty may . Hiện Công_ty của tôi đang có hợp_đồng với các công_ty của Nhật_Bản . Theo hợp_đồng
      thì xuất_xứ hàng_hóa được tính theo hiệp_định đã ký giữa Việt_Nam - Nhật_Bản . Với hiệp_định này thì hàng dệt may được
      áp_dụng kê_khai xuất_xứ từ vải , nhưng khi Việt_Nam vào Hiệp_định Đối_tác xuyên Thái_Bình_Dương , xuất_xứ hàng_hóa lại
      tính từ sợi . Tôi xin hỏi , trong trường_hợp này hợp_đồng của Công_ty tôi và đối_tác Nhật_Bản sẽ áp_dụng xuất_xứ từ
      vải hay sợi ? Bộ Công_Thương trả_lời vấn_đề này như sau : Về nguyên_tắc , doanh_nghiệp có_thể lựa_chọn áp_dụng cam_kết
      từ một Hiệp_định thương_mại tự_do có lợi nhất cho mình miễn_là hàng_hóa của doanh_nghiệp đáp_ứng quy_tắc xuất_xứ của
      Hiệp_định đó . Do_vậy , khi xuất_khẩu hàng_hóa sang Nhật_Bản , Công_ty của ông vẫn có_thể áp_dụng quy_tắc xuất_xứ “
      từ vải trở_đi ” theo Hiệp_định Đối_tác Kinh_tế Việt_Nam - Nhật_Bản .'
    - "Theo Điều 37 Luật_Quốc_tịch Việt_Nam 2008 quy_định về quốc_tịch của con_nuôi chưa thành_niên như sau : \n \n Quốc_tịch\
      \ của con_nuôi chưa thành_niên \n 1 . Trẻ_em là công_dân Việt_Nam được người nước_ngoài nhận làm con_nuôi thì vẫn giữ\
      \ quốc_tịch Việt_Nam . \n 2 . Trẻ_em là người nước_ngoài được công_dân Việt_Nam nhận làm con_nuôi thì có quốc_tịch Việt_Nam\
      \ , kể từ ngày được cơ_quan nhà_nước có thẩm_quyền của Việt_Nam công_nhận việc nuôi con_nuôi . \n 3 . Trẻ_em là người\
      \ nước_ngoài được cha_mẹ mà một người là công_dân Việt_Nam , còn người kia là người nước_ngoài nhận làm con_nuôi thì\
      \ được nhập quốc_tịch Việt_Nam theo đơn xin nhập quốc_tịch Việt_Nam của cha_mẹ nuôi và được miễn các điều_kiện quy_định\
      \ tại khoản 1 Điều 19 của Luật này . \n 4 . Sự thay_đổi quốc_tịch của con_nuôi từ đủ 15 tuổi đến chưa đủ 18 tuổi phải\
      \ được sự đồng_ý bằng văn_bản của người đó . \n \n \n Như_vậy , theo quy_định trên thì trẻ_em là công_dân Việt_Nam được\
      \ người nước_ngoài nhận nuôi vẫn sẽ được giữ quốc_tịch Việt_Nam ."
    - "Điều 14 . Điều_kiện , mức hưởng , trình_tự , thủ_tục và cơ_quan có trách_nhiệm bảo_đảm kinh_phí khám bệnh , chữa bệnh\
      \ cho Dân_quân tự_vệ không tham_gia_bảo_hiểm y_tế nếu bị ốm_đau , bị tai_nạn , bị_thương 1 . Điều_kiện \n a ) Dân_quân\
      \ tự_vệ trong thời_gian thực_hiện nhiệm_vụ theo quyết_định điều_động , huy_động hoặc làm nhiệm_vụ theo kế_hoạch được\
      \ cấp có thẩm_quyền phê_duyệt , nếu bị ốm_đau , bị tai_nạn , bị_thương được khám bệnh , chữa bệnh tại các cơ_sở khám\
      \ bệnh , chữa bệnh quân , dân y theo quy_định ; \n b ) Dân_quân tự_vệ không được khám bệnh , chữa bệnh nếu bị ốm_đau\
      \ , bị tai_nạn , bị_thương khi : cố_ý tự hủy_hoại sức_khỏe của bản_thân hoặc tai_nạn do mâu_thuẫn của chính bản_thân\
      \ với người gây ra tai_nạn mà không liên_quan đến thực_hiện nhiệm_vụ hoặc tai_nạn do sử_dụng rượu , bia , sử_dụng chất\
      \ ma_túy , tiền chất ma_túy hoặc chất gây nghiện khác theo quy_định của pháp_luật . \n 2 . Mức_hưởng \n Chi_phí khám\
      \ bệnh , chữa bệnh như mức hưởng bảo_hiểm y_tế cho hạ_sĩ_quan , binh_sĩ Quân_đội nhân_dân Việt_Nam đang tại_ngũ . Trong\
      \ thời_gian điều_trị nội_trú được bảo_đảm tiền ăn bệnh_lý . Trường_hợp Dân_quân tự_vệ đang điều_trị nội_trú , nhưng\
      \ hết thời_gian làm nhiệm_vụ thì được thanh_toán chi_phí khám bệnh , chữa bệnh và tiền ăn bệnh_lý nhưng tối_đa không\
      \ quá 15 ngày ; nếu hết 15 ngày bệnh vẫn chưa ổn_định thì điều_trị đến khi ổn_định và được thanh_toán 100 % tiền khám\
      \ , chữa bệnh . \n 3 . Trình_tự giải_quyết \n a ) Dân_quân hoặc người đại_diện hợp_pháp của dân_quân gửi trực_tiếp hoặc\
      \ qua bưu_chính , môi_trường điện_tử đơn đề_nghị thanh_toán tiền khám bệnh , chữa bệnh cho dân_quân kèm theo phiếu xét_nghiệm\
      \ , đơn thuốc , hóa_đơn thu tiền , giấy ra viện cho cơ_quan quân_sự địa_phương . Dân_quân thuộc đơn_vị Dân_quân tự_vệ\
      \ của cấp nào tổ_chức thì gửi đơn cho cơ_quan quân_sự địa_phương cấp đó ; trường_hợp không hợp_lệ , trong thời_hạn 03\
      \ ngày làm_việc kể từ ngày nhận được đơn đề_nghị , cơ_quan quân_sự địa_phương phải có văn_bản hướng_dẫn gửi người nộp\
      \ đơn để bổ_sung , hoàn_thiện ; \n b ) Trong thời_hạn 10 ngày làm_việc , kể từ ngày nhận đơn đề_nghị , cơ_quan quân_sự\
      \ địa_phương lập 01 bộ hồ_sơ . Tư_lệnh Bộ Tư_lệnh Thủ_đô Hà_Nội , Tư_lệnh Bộ Tư_lệnh Thành_phố Hồ_Chí_Minh , Chỉ_huy_trưởng\
      \ Bộ_chỉ_huy \n quân_sự cấp tỉnh , Chỉ_huy_trưởng Ban chỉ_huy quân_sự cấp huyện trình Chủ_tịch Ủy_ban nhân_dân cùng\
      \ cấp quyết_định . Chỉ_huy_trưởng Ban chỉ_huy quân_sự cấp xã báo_cáo Chủ_tịch Ủy_ban nhân_dân cấp xã trình Chủ_tịch\
      \ Ủy_ban nhân_dân cấp huyện quyết_định ; \n c ) Trong thời_hạn 05 ngày làm_việc , kể từ ngày nhận được hồ_sơ trình ,\
      \ Chủ_tịch Ủy_ban nhân_dân cấp huyện hoặc Chủ_tịch Ủy_ban nhân_dân cấp tỉnh quyết_định kinh_phí khám bệnh , chữa bệnh\
      \ cho dân_quân ; \n d ) Trong thời_hạn 10 ngày làm_việc , kể từ ngày ra quyết_định , Ủy_ban nhân_dân cấp xã có trách_nhiệm\
      \ thực_hiện chi_trả kinh_phí khám bệnh , chữa bệnh cho dân_quân ; nơi không có đơn_vị hành_chính cấp xã do Ban chỉ_huy\
      \ quân_sự cấp huyện thực_hiện chi_trả ; việc chi_trả bằng hình_thức chuyển_khoản hoặc qua đường bưu_chính hoặc trực_tiếp_nhận\
      \ ở cấp xã . \n 4 . Hồ_sơ : \n a ) Đơn đề_nghị thanh_toán chi_phí khám bệnh , chữa bệnh của dân_quân hoặc người đại_diện\
      \ hợp_pháp của dân_quân . Mẫu_đơn quy_định tại Phụ_lục III ban_hành kèm theo Nghị_định này ; \n b ) Phiếu xét_nghiệm\
      \ , đơn thuốc , hóa_đơn thu tiền , giấy xuất_viện ; \n c ) Quyết_định công_dân thực_hiện nghĩa_vụ tham_gia Dân_quân\
      \ tự_vệ ; quyết_định điều_động hoặc huy_động hoặc kế_hoạch thực_hiện nhiệm_vụ được cấp có thẩm_quyền phê_duyệt . \n\
      \ 5 . Kinh_phí bảo_đảm thực_hiện chế_độ , chính_sách theo quy_định tại Điều này do Ủy_ban nhân_dân cấp huyện bảo_đảm\
      \ đối_với dân_quân do cơ_quan quân_sự địa_phương cấp huyện , cấp xã quản_lý ; Ủy_ban nhân_dân cấp tỉnh bảo_đảm kinh_phí\
      \ đối_với dân_quân do cơ_quan quân_sự địa_phương cấp tỉnh quản_lý ."
  - source_sentence: Nghĩa_vụ thông_báo tình_hình chấp_hành của người được hưởng án_treo được quy_định như thế_nào ?
    sentences:
    - 'Vợ , con tôi thuộc diện tiếp_xúc với người nhiễm COVID - 19 ( F1 ) , cách_ly tại nhà theo quyết_định của phường từ
      ngày 19 / 12 / 2021 đến ngày 1 / 1 / 2022 . Xin hỏi , vợ và con tôi có được hưởng trợ_cấp không ? Sở Lao_động – Thương_binh
      và Xã_hội TP. Hà_Nội trả_lời vấn_đề này như sau : Hiện_nay UBND TP. Hà_Nội đang triển_khai thực_hiện một_số chính_sách
      hỗ_trợ đối_tượng bị ảnh_hưởng , gặp khó_khăn do đại_dịch COVID - 19 , trong đó : Quyết_định số 3642 / QĐ - UBND ngày
      21 / 7 / 2021 của UBND TP. Hà_Nội_quy_định hỗ_trợ đối_với người lao_động chấm_dứt hợp_đồng lao_động nhưng không đủ điều_kiện
      hưởng trợ_cấp thất_nghiệp , người lao_động ngừng việc , tạm hoãn thực_hiện hợp_đồng lao_động , nghỉ_việc không hưởng
      lương , người lao_động không có giao_kết_hợp_đồng lao_động bị mất việc_làm ( lao_động tự_do ) … Quyết_định số 5073 /
      QĐ - UBND ngày 2 / 12 / 2021 của UBND TP. Hà_Nội sửa_đổi , bổ_sung một_số điều tại Quyết_định số 3642 / QĐ - UBND ngày
      21 / 7 / 2021 của UBND TP. Hà_Nội về việc thực_hiện một_số chính_sách hỗ_trợ người lao_động và người sử_dụng lao_động
      gặp khó_khăn do đại_dịch COVID - 19 trên địa_bàn TP. Hà_Nội . Đề_nghị ông Tấn liên_hệ với UBND phường hoặc Trạm y_tế
      phường để được hướng_dẫn_giải_quyết theo quy_định .'
    - 'Tôi xin hỏi , công_ty có 100 % vốn đầu_tư nước_ngoài có được phép mua hoặc nhận chuyển_nhượng hoặc nhận cho tặng đối_với
      nhà và đất ( ngoài khu công_nghiệp ) từ cá_nhân , tổ_chức Việt_Nam tại Việt_Nam hay không ? Nếu được thì công_ty có
      được đứng_tên trên giấy_tờ nhà và đất hay không ? Thời_hạn đứng_tên là bao_lâu ? Bộ Xây_dựng trả_lời vấn_đề này như
      sau : Theo quy_định tại Khoản 2 , Điều 76 Nghị_định số99 / 2015 / NĐ - CPngày 20 / 10 / 2015 của Chính_phủ quy_định
      chi_tiết và hướng_dẫn thi_hành một_số điều củaLuật Nhà ởthì công_ty 100 % vốn nước_ngoài đang hoạt_động tại Việt_Nam
      nếu thuộc diện được sở_hữu nhà ở tại Việt_Nam thì chỉ được mua nhà ở thương_mại trong dự_án đầu_tư xây_dựng nhà ở của
      chủ đầu_tư dự_án hoặc mua lại nhà ở của cá_nhân , tổ_chức nước_ngoài đã mua nhà ở tại Việt_Nam ; được nhận tặng cho
      , nhận thừa_kế nhà ở của hộ gia_đình , cá_nhân hoặc nhận tặng cho nhà ở của tổ_chức trong dự_án đầu_tư xây_dựng nhà
      ở được phép sở_hữu theo quy_định . Công_ty 100 % vốn nước_ngoài đang hoạt_động tại Việt_Nam không được mua nhà ở của
      hộ gia_đình , cá_nhân Việt_Nam ; không được mua nhà ở của tổ_chức Việt_Nam mà không phải là chủ đầu_tư dự_án , không
      được nhận tặng cho , nhận thừa_kế nhà ở ngoài các dự_án đầu_tư xây_dựng nhà ở . Thời_hạn sở_hữu nhà căn_cứ Giấy chứng_nhận
      đầu tưCông ty 100 % vốn nước_ngoài đang hoạt_động tại Việt_Nam nếu mua nhà ở theo đúng quy_định của Luật Nhà ở năm 2014
      và Nghị_định số 99 / 2015 / NĐ - CP thì sẽ được cấp Giấy chứng_nhận quyền sử_dụng đất , quyền sở_hữu nhà ở và tài_sản
      khác gắn liền với đất đối_với nhà ở đã mua . Theo quy_định tại Điểm d , Khoản 2 , Điều 161 Luật Nhà ở năm 2014 và Điều
      77 Nghị_định số 99 / 2015 / NĐ - CP thì công_ty 100 % vốn nước_ngoài đang hoạt_động tại Việt_Nam nếu mua nhà ở tại Việt_Nam
      sẽ được sở_hữu nhà ở tối_đa bằng thời_hạn ghi trong Giấy chứng_nhận đầu_tư cấp cho công_ty ; trước khi hết thời_hạn
      sở_hữu nhà ở mà công_ty được tiếp_tục gia_hạn Giấy chứng_nhận đầu_tư và có nhu_cầu gia_hạn thời_hạn sở_hữu nhà ở thì
      được gia_hạn thêm một lần tối_đa bằng với thời_hạn của Giấy chứng_nhận đầu_tư đã được gia_hạn .'
    - "Điều 87 . Nghĩa_vụ của người được hưởng án_treo 1 . Có_mặt theo giấy triệu_tập và cam_kết việc chấp_hành án theo quy_định\
      \ tại khoản 1 Điều 85 của Luật này . \n 2 . Thực_hiện nghiêm_chỉnh cam_kết trong việc tuân_thủ pháp_luật , nghĩa_vụ\
      \ công_dân , nội_quy , quy_chế của nơi cư_trú , nơi làm_việc , học_tập ; chấp_hành đầy_đủ hình_phạt bổ_sung , nghĩa_vụ\
      \ bồi_thường thiệt_hại , trừ trường_hợp vì lý_do khách_quan được cơ_quan nhà_nước có thẩm_quyền xác_nhận . \n 3 . Chịu\
      \ sự giám_sát , giáo_dục của Ủy_ban nhân_dân cấp xã , đơn_vị quân_đội được giao giám_sát , giáo_dục , cơ_quan thi_hành\
      \ án hình_sự Công_an cấp huyện , cơ_quan thi_hành án hình_sự cấp quân_khu nơi cư_trú , nơi làm_việc . \n 4 . Chấp_hành\
      \ quy_định tại Điều 92 của Luật này . \n 5 . Phải có_mặt theo yêu_cầu của Ủy_ban nhân_dân cấp xã hoặc đơn_vị quân_đội\
      \ được giao giám_sát , giáo_dục , cơ_quan thi_hành án hình_sự Công_an cấp huyện , cơ_quan thi_hành án hình_sự cấp quân_khu\
      \ . \n 6 . Hằng tháng phải báo_cáo bằng văn_bản với Ủy_ban nhân_dân cấp xã , đơn_vị quân_đội được giao giám_sát , giáo_dục\
      \ về tình_hình chấp_hành nghĩa_vụ của mình . Trường_hợp vắng_mặt theo quy_định tại khoản 1 Điều 92 của Luật này thì\
      \ khi hết thời_hạn vắng_mặt , người được hưởng án_treo phải báo_cáo về tình_hình chấp_hành nghĩa_vụ của mình ."
  - source_sentence: Thành_viên hợp danh rút được vốn ra khỏi công_ty vào thời_điểm nào ?
    sentences:
    - "Căn_cứ khoản 2 Điều 185 Luật Doanh_nghiệp 2020 quy_định chấm_dứt tư_cách thành_viên hợp danh như sau : \n \n Thành_viên\
      \ hợp danh có quyền rút vốn khỏi công_ty nếu được Hội_đồng thành_viên chấp_thuận . Trường_hợp này , thành_viên muốn\
      \ rút vốn khỏi công_ty phải thông_báo bằng văn_bản yêu_cầu rút vốn chậm nhất là 06 tháng trước ngày rút vốn ; chỉ được\
      \ rút vốn vào thời_điểm kết_thúc năm tài_chính và báo_cáo tài_chính của năm tài_chính đó đã được thông_qua . \n \n \n\
      \ Theo quy_định trên thì chỉ được rút vốn vào thời_điểm kết_thúc năm tài_chính và báo_cáo tài_chính của năm tài_chính\
      \ đó đã được thông_qua ."
    - "Điều 3 . Giải_thích từ_ngữ 1 . Các từ_ngữ dưới đây sử_dụng trong Thông_tư này được hiểu theo quy_định của Luật Viễn_thông\
      \ , cụ_thể : \n Dịch_vụ viễn_thông là dịch_vụ gửi , truyền , nhận và xử_lý thông_tin giữa hai hoặc một nhóm người sử_dụng\
      \ dịch_vụ viễn_thông , bao_gồm dịch_vụ cơ_bản và dịch_vụ giá_trị gia_tăng . \n Kết_nối viễn_thông là việc liên_kết vật_lý\
      \ và lô gích các mạng viễn_thông_qua đó người sử_dụng dịch_vụ viễn_thông của mạng này có_thể truy_cập đến người sử_dụng\
      \ hoặc dịch_vụ của mạng kia và ngược_lại . \n 2 . Các từ_ngữ dưới đây được hiểu theo hướng_dẫn tại Thông_tư này : \n\
      \ Cơ_sở kinh_doanh dịch_vụ viễn_thông bao_gồm các doanh_nghiệp được thành_lập theo pháp_luật Việt_Nam , được cấp giấy_phép\
      \ kinh_doanh dịch_vụ viễn_thông theo quy_định của Luật viễn_thông và các đơn_vị trực_thuộc doanh_nghiệp kinh_doanh dịch_vụ\
      \ viễn_thông . \n Cơ_sở kinh_doanh dịch_vụ viễn_thông bao_gồm cơ_sở cung_cấp dịch_vụ có hạ_tầng mạng và cơ_sở cung_cấp\
      \ dịch_vụ không có hạ_tầng mạng . \n Cước dịch_vụ kết_nối viễn_thông là khoản doanh_thu do cơ_sở kinh_doanh dịch_vụ\
      \ viễn_thông thu được khi cung_cấp dịch_vụ kết_nối viễn_thông với mạng viễn_thông của cơ_sở kinh_doanh dịch_vụ viễn_thông\
      \ khác . \n Đối_soát là việc các cơ_sở kinh_doanh dịch_vụ viễn_thông đối_chiếu để xác_nhận lưu_lượng kết_nối , doanh_thu\
      \ , chi_phí về cước dịch_vụ kết_nối viễn_thông với cơ_sở kinh_doanh dịch_vụ viễn_thông khác . \n Dịch_vụ viễn_thông\
      \ cước trả sau là các dịch_vụ viễn_thông do cơ_sở kinh_doanh dịch_vụ viễn_thông cung_cấp mà việc thanh_toán của khách_hàng\
      \ thực_hiện sau khi sử_dụng dịch_vụ ."
    - 'Tôi là giáo_viên hợp_đồng tại trường_học công_lập , có thời_gian đóng BHXH không liên_tục từ tháng 9 / 2010 đến tháng
      5 / 2019 là 61 tháng . Từ tháng 9 / 2019 đến nay , tôi được cơ_quan có thẩm_quyền quyết_định tuyển_dụng vào ngạch giáo_viên
      mầm_non hạng IV , mã_số V. 07.02.06 ( giảng_dạy được 25 tháng ) . Tổng_thời_gian giảng_dạy của tôi từ khi làm giáo_viên
      hợp_đồng đến khi có quyết_định tuyển_dụng là 86 tháng . Theo quy_định_chế_độ phụ_cấp thâm_niên nhà_giáo tại Nghị_định
      số 77 / 2021 / NĐ - CP ngày 1 / 8 / 2021 của Chính_phủ , tôi sẽ được tính truy_lĩnh hưởng phụ_cấp thâm_niên nhà_giáo_cụ_thể
      như dưới đây có đúng không ? ( 1 ) Từ ngày 1 / 7 / 2020 được tính truy_lĩnh hưởng phụ_cấp thâm_niên nhà_giáo là 6 %
      ( theo Khoản 2 , Điều 6 Nghị_định số 77 / 2021 / NĐ - CP ) . ( 2 ) Đến tháng 4 / 2021 được tính truy_lĩnh hưởng phụ_cấp
      thâm_niên nhà_giáo là 7 % . Bộ Giáo_dục và Đào_tạo trả_lời vấn_đề này như sau : Thời_điểm trước ngày 1 / 7 / 2020 ,
      chế_độ phụ_cấp thâm_niên được thực_hiện theo quy_định tại Nghị_định số54 / 2011 / NĐ - CPngày 4 / 7 / 2011 của Chính_phủ
      và các Văn_bản hướng_dẫn . Từ ngày 1 / 7 / 2020 , chế_độ phụ_cấp thâm_niên được áp_dụng thực_hiện theo quy_định tại
      Nghị_định số77 / 2021 / NĐ - CPngày 1 / 8 / 2020 của Chính_phủ quy_định_chế_độ phụ_cấp thâm_niên nhà_giáo . Căn_cứ vào
      các quy_định này , không tính thời_gian tập_sự , thử việc và hợp_đồng_lần đầu ( nếu có ) , bà Trần_Thị_Bích_Xang có
      thời_gian giảng_dạy và đóng BHXH bắt_buộc đủ 60 tháng thì được tính hưởng phụ_cấp thâm_niên nhà_giáo bằng 5 % mức lương
      hiện hưởng cộng với phụ_cấp chức_vụ lãnh_đạo ( nếu có ) . Từ các năm sau trở_đi , phụ_cấp thâm_niên của bà Trần_Thị_Bích_Xang
      mỗi năm được tính thêm 1 % .'
  - source_sentence: Ký hợp_đồng lao_động theo quy_định mới từ 22 / 2 / 2023
    sentences:
    - 'Tôi làm hộ_lý theo hợp_đồng 68 tại khoa kiểm_soát nhiễm_khuẩn ở bệnh_viện huyện . Công_việc hàng ngày là xử_lý đồ vải
      bệnh_nhân và xử_lý_dụng_cụ y_tế của bệnh_viện . Tôi đang hưởng lương bậc 4 , hệ_số 2,19 . Tôi xin hỏi , theo Nghị_định
      111 / 2022 / NĐ - CP , tôi có được tiếp_tục làm_việc và hưởng các chế_độ của hợp_đồng 68 nữa không hay tôi phải chuyển
      sang ký hợp_đồng khác ? Nếu chuyển sang loại hợp_đồng khác thì lương và các chế_độ sẽ hưởng thế_nào ? Bộ Nội_vụ trả_lời
      vấn_đề này như sau : Khoản 1 Điều 13 Nghị_định số111 / 2022 / NĐ - CPquy định : " Người đang thực_hiện các công_việc
      hỗ_trợ , phục_vụ theo quy_định tại khoản 1 Điều 4 Nghị_định này nếu chưa chuyển sang ký hợp_đồng lao_động theo quy_định
      của Nghị_định số 161 / 2018 / NĐ - CP ngày 29 tháng 11 năm 2018 của Chính_phủ sửa_đổi , bổ_sung một_số quy_định về tuyển_dụng
      công_chức , viên_chức , nâng ngạch công_chức , thăng_hạng viên_chức và thực_hiện chế_độ hợp_đồng một_số loại công_việc
      trong cơ_quan hành_chính nhà_nước , đơn_vị sự_nghiệp công_lập ( sau đây viết tắt là Nghị_định số 161 / 2018 / NĐ - CP
      ) và cơ_quan , tổ_chức , đơn_vị không ký hợp_đồng dịch_vụ thì trong thời_hạn 12 tháng kể từ ngày Nghị_định này có hiệu_lực
      , cơ_quan , tổ_chức , đơn_vị phải chuyển sang ký hợp_đồng lao_động . Hợp_đồng lao_động ký_kết phải bảo_đảm quyền , lợi_ích
      hợp_pháp về tiền_lương , chế_độ bảo_hiểm xã_hội và các chế_độ khác theo quy_định của pháp_luật . Trường_hợp một trong
      các bên không có nhu_cầu thì giải_quyết chế_độ thôi_việc theo quy_định của pháp_luật " . Như_vậy , trường_hợp bà Trần_Thị_Hoa
      nếu chưa chuyển sang ký hợp_đồng lao_động theo quy_định của Nghị_định số161 / 2018 / NĐ - CPthì trong thời_hạn 12 tháng
      kể từ ngày Nghị_định số 111 / 2022 / NĐ - CP có hiệu_lực phải chuyển sang ký hợp_đồng lao_động . Tiền_lương và các chế_độ
      khác của người lao_động thực_hiện theo quy_định tại khoản 2 Điều 8 Nghị_định số 111 / 2022 / NĐ - CP.'
    - "Điều 16 . Tiêu_chuẩn chuyên_môn của sỹ quan kỹ_thuật điện Sỹ quan kỹ_thuật điện phải đáp_ứng các tiêu_chuẩn chuyên_môn\
