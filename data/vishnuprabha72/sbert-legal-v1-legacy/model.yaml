widgetData:
- source_sentence: What are the essential conditions for granting a temporary injunction?
  sentences:
  - The cardinal principles for grant of temporary injunction require a strong prima facie case, that non-interference would
    cause irreparable injury with no other remedy available, and that the balance of convenience favours the party seeking
    relief.
  - The plaintiff filed suits for declaration and specific performance against the defendant companies regarding a total area
    of 19,685 square metres of land, contending a concluded contract existed after negotiations for a total sum running into
    several crores of rupees.
  - The appeals are allowed and the orders of injunction granted by the trial court and affirmed by the High Court are set
    aside.
- source_sentence: execution of agreements based on down payments
  sentences:
  - 73. In Laxminarayan R. Bhattad (supra), this Court held that the contents of the scheme under the Bombay Town Planning
    Act now replaced by the Maharashtra Regional and Town Planning Act will prevail over any policy decision taken by the
    Corporation or by the State.
  - 31. The order-in-original states that since the UFAC has not exported the final product of Manganese raw material received
    by it from TISCO, it had violated the provisions of paragraph 9.17 (b) and 9.9(b) of the EXIM Policy.
  - The Court noted that the Respondent had initially agreed to execute the agreement and that GLI was entitled to the execution
    of the agreement as it was necessary for the acquisition of shares.
