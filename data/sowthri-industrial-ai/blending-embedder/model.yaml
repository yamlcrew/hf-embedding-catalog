  sentences:
  - • Cetane number. An adequate cetane number is required for good engine performance. Cetane number is a measure of the
    ignition quality of the fuel and influences white smoke, cold starting, and combustion roughness. The cetane number requirements
    depend on engine design, size, and nature of speed and load variations, as well as starting and atmospheric conditions.
    The ASTM minimum limit for B100 cetane number is set at 45. There is no minimum cetane number for heating oil or marine
    fuels. The cetane index (ASTM D976 or ASTM D4737) is not an accurate predictor of cetane number for biodiesel or biodiesel
    blends because it is based on a calculation that uses specific gravity and distillation curve for petroleum diesel. The
