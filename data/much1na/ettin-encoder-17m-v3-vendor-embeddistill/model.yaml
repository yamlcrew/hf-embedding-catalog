    Tactics are the actions, to reach a particular point. The Strategy is defined as a game plan, which can help the organization
    to achieve its mission and objectives. The scope of the strategy is bigger than tactics, in a sense that there can be
    some tactics in a single strategy. Moreover, the two should go in tandem.
