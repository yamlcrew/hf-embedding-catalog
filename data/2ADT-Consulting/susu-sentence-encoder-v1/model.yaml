  - A naxa a fala e bɛ, «Wo yi nan falama n marigi Esayu bɛ, ‹I xa konyi di Yaxuba naxɛ, N bara bu Laban xɔnyi han ya.
- source_sentence: He formed a woman out of the rib and brought her to him.
  sentences:
  - Xa e e xun ti Isirayila bɔxi nan na Beti Semesi biri ra, na findima tɔnxuma nan na a a Alatala nan yi gbaloe ragoroxi
    won ma, kɔnɔ xa e mu siga na biri, na fan findima tɔnxuma nan na a yi gbaloe mu kelixi Alatala xa ma, a ilanxi nɛ a ra
    tun.».
  - Munsa naxa a masen a bɛ, «Xa i tan yati mu muxu matima naa, i naxa a lu muxu xa keli be.
  - Na xanbi, Marigi Alatala naxa Adama ganyanyi xɔri findi ginɛ ra, a fa na ginɛ fi Adama ma.
- source_sentence: But they cheat widows out of their homes and pray long prayers just to show off. They will be punished
    most of all.
  sentences:
  - Mixi rabɛɲinxi ndee naxa a rabilin, e nɔɛ dɛrɛn Robowami ma, Sulemani xa di naxan mu nu gɛxi mɔde, naxan xa maɲɔxunyi
    xɔn mu nu kuyaxi. Na kui Robowami mu nɔ e ra.».
  - E kaaɲɛ ginɛe harige muɲama. E salima a xɔnkuye ra, alako mixie xa e to. Gbaloe naxan nagataxi e bɛ, a gbo ki fanyi.».
  - 'Fatanfe Elama xabilɛ ra: Mataniya, Sakari, Yɛxiyɛli, Abidi, Yeremoti, nun Eliya.'
- source_sentence: But he answered, I have food to eat that you know nothing about.
  sentences:
  - Kɔnɔ Isa naxa a masen e bɛ, «Baloe na n tan yi ra, wo tan mu naxan kolon.».
  - Isirayila mangɛ Yowasi naxa a yaabi, «Liban tunbe di naxa xɛɛra xɛɛ Liban sɛdiri wuri xungbe ma a falafe ra, ‹I xa di
    ginɛ fi n ma di ma.› Na dangi xanbi Liban wulai sube nde naxa tunbe maboron.
  - Kɔnɔ n xa a fala i bɛ, nɔndi mu i bɛ na fe kui, barima Ala gbo mixi bɛ.
- source_sentence: Les navires de Hiram, qui apportèrent de lor dOphir, amenèrent aussi dOphir une grande quantité de bois
    de sandal et des pierres précieuses.
  sentences:
  - Ala nu na e mamɛfe Annabi Nuha nu kunkui banbanma tɛmui naxɛ. Mixi solomasaxan gbansan nan kisi kunkui kui ye ma.
  - Xirami nun Sulemani xa walikɛe naxee fa xɛɛma ra kelife Ofiri bɔxi ma, nee man naxa fa wuri nun gɛmɛ tofanyie ra.
  - Won a kolon won nun Ala na a ra, barima a bara a Xaxili fi won ma.
