- source_sentence: "Search for a candidate for this job: Instruct: Given a job listing, retrieve the most relevant candidate\
    \ profiles that match the required skills, experience, and role.\nQuery: Title: Chief Accountant\nCompany: FRACTAL\nCategory:\
    \ Finances\nSkills: Other (non-tech), Finances\nLanguages: Ukrainian - Native\nExperience: 4 years experience\nEmployment:\
    \ FULL_TIME\nLocation: Ukraine\nDomain: Other\n\nDescription:\nУ пошуках Головного бухгалтера, який стане ключовим партнером\
    \ для бізнесу у фінансових питаннях. Це не просто облік і звітність — це прозорість процесів, системність та своєчасне\
    \ управління ризиками.\n \nFRACTAL — це група ІТ-компаній, що об'єднує 25 бізнесів і 2 громадські організації. Ми створюємо\
    \ продукти, масштабуємо digital-напрям і будуємо процеси, що працюють.\n \nCore — операційна платформа та інноваційне\
    \ середовище, які дозволяють розвивати бізнеси, що вже існують, та створювати нові.\n \n\U0001F50D Якщо тобі цікаво не\
    \ просто вести облік, а створювати зрозумілу фінансову картину компанії, оптимізувати процеси та підтримувати бізнес у\
    \ прийнятті рішень, ми будемо раді бачити тебе у нашій команді.\n \nТвої дії зроблять бухгалтерські процеси системними,\
    \ ефективними та прозорими, а твоя експертиза стане справжнім партнерством для бізнесу.\n \n\U0001F4CC Що важливо для\
    \ цієї ролі?\nДосвід Головного бухгалтера від 4 років.\nДосвід ведення компаній: на різних системах оподаткування; у сферах:\
    \ виробництво / торгівля / сервіси / ЗЕД.\nПрактичний досвід роботи з резидентами Дія.City: ПнВК; ГІГ-контракти / ФОП-модель;\
    \ звітність та забезпечення відповідності.\nГлибоке знання: бухгалтерського обліку (П (С)БО), МСБО / МСФЗ; податкового\
    \ законодавства України.\nДосвід роботи з: ПДВ (включаючи кейси з блокуванням податкових накладних); податковими перевірками.\n\
    Розуміння: виробничого обліку (собівартість, запаси, НЗВ); обліку в торгівлі та сервісному бізнесі.\nДосвід роботи з інструментами:\
    \ BAS (обов'язково); M.E.Doc / Fredo / електронний кабінет платника податків.\nНавички роботи з Excel / Google Sheets\
    \ (високий рівень).\n \nБуде плюсом:\nПрофесійні сертифікації (ACCA, DipIFR, CAP/CIPA).\nДосвід роботи з міжнародними\
    \ операціями.\n \n\U0001F3AF Що ти будеш робити?\nВести бухгалтерський та податковий облік відповідно до законодавства.\n\
    Складати та подавати фінансову, податкову та статистичну звітність.\nЗакривати періоди (місяць / квартал / рік).\nКонтролювати\
    \ правильність обліку та своєчасність подання звітності.\nВзаємодіяти з податковими органами, аудиторами та банками.\n\
    Керувати податковими ризиками.\nФормувати облікову політику.\nБудувати та оптимізувати бухгалтерські процеси.\nІніціювати\
    \ та впроваджувати автоматизацію.\nВзаємодіяти з бізнесом: консультувати; підтримувати прийняття рішень.\nКерувати бухгалтерською\
    \ командою (за наявності).\n \n\U0001F381 Що ми пропонуємо?\nГнучкий графік роботи з можливістю починати робочий день\
    \ із 8:00 до 10:00 та завершувати з 17:00 до 19:00.\nПовний ремоут з першого дня. Проте, за бажанням, можна відвідувати\
    \ й офіс :)\nОплачувану відпустку — 18 робочих днів, 8 оплачуваних лікарняних на рік без довідок та 11 державних вихідних,\
    \ 1 Self Care Day.\nКомпенсацію 50% професійного навчання: курси, тренінги, вебінари й т.д.\nДодаткові оплачувані day\
    \ off, які надаються при настанні певних життєвих обставин.\nВиплати та компенсації під час важливих життєвих подій —\
    \ як у складних ситуаціях, так і з нагоди приємних новин.\nНаявність прозорої політики Sabbatical (тривала відпустка на\
    \ 1−3 місяці).\nМожливість навчання та розвитку: досвід та підтримку наших співробітників, допомогу в професійній адаптації\
    \ під кураторством протягом усього випробувального терміну.\nВнутрішні корпоративні знижки на замовлення їжі, розваги,\
    \ побутові послуги, техніку, навчання, книги, здоров’я, спорт і фінансові сервіси.\nФінансову допомогу в непростих життєвих\
    \ ситуаціях та подарунки до професійних та корпоративних подій.\nШвидке прийняття рішень та тестування ідей — відсутність\
    \ зайвої бюрократії та мікроменеджменту.\nПрофільні івенти та чати для обміну досвідом у рамках групи компаній.\nКомандні\
    \ заходи, щоб навіть у складні часи підтримувати один одного.\nСімейний доступ до корпоративної бібліотеки в смартфоні\
    \ «KUKA» з базою понад 10 000 ліцензійних електронних, аудіокнижок, журналів та подкастів.\nЧітку позицію та конкретні\
    \ дії задля наближення Перемоги. Від початку повномасштабного вторгнення ми виділили понад 4 000 000 $ на мілітарний та\
    \ гуманітарний напрямок.\nІ вважаємо однією з найкрутіших переваг — роботу в команді, де твої ідеї та питання реально\
    \ почують, а колеги та керівник завжди відкриті до діалогу та нових пропозицій \U0001F609"
