- source_sentence: 'Search for a candidate for this job: Instruct: Given a job listing, retrieve the most relevant candidate
    profiles that match the required skills, experience, and role.

    Query: Title: Fullstack Developer (Python)

    Company: Frontline Robotics

    Category: Python

    Skills: Development, Python

    Languages: Ukrainian - Native

    Experience: 3 years experience

    Employment: FULL_TIME

    Location: Ukraine

    Domain: DefTech


    Description:

    Компанія Frontline Robotics спеціалізується на розробці та виробництві роботизованих систем для Сил безпеки та оборони
    України. Ми створюємо наземних роботів, безпілотники, турелі та програмне забезпечення, які змінюють правила ведення бойових
    дій вже зараз.


    Наша мета — збереження людських життів шляхом роботизації війська.


    Ми сформували досвідчену та злагоджену команду і шукаємо Fullstack Developer (Python).


    Окремо хочемо зазначити, що ми дуже вдячні ветеранам та ветеранкам за службу і надаємо вам перевагу у відгуках на наші
    вакансії.


    У Вас має бути:

    3+ роки досвіду у розробці на Python (бажано в ERP екосистемах).

    Досвід роботи із PostgreSQL: схеми, індекси, оптимізація запитів;

    Досвід роботи із ORM (SQLAlchemy), XML, Git, CI/CD;

    Docker/Compose, Linux, базові мережеві налаштування;

    Розуміння підходів для інтеграцій: REST/JSON, вебхуки, автентифікація;

    Розуміння контролю доступів: RBAC/ACL, політики доступу на рівні записів;

    Вміння читати бізнес-вимоги та реалізовувати їх у логіку системи.


    Буде плюсом:

    Досвід роботи із ERP-системами: ORM/моделі, ACL/record rules, доменні фільтри;

    Розуміння процесів у ERP-системах (склад, логістика, закупівлі, виробництво, бухгалтерія, тощо).

    Оптимізація продуктивності PostgreSQL, застосунків


    В основні обов’язки буде входити:

    Підтримка та моніторинг dev/stage/prod інфраструктури ERP-системи (адміністрування, алерти);

    Підтримка, налаштування та кастомізація ERP-системи (розробка кастомних модулів);

    Налаштування ролей і доступів в системі (групи доступів, ACL, record rules);

    Розробка та підтримка звітів (одноразові та регулярні: XLSX/CSV);

    Інтеграції із зовнішніми сервісами (REST/вебхуки, автентифікація OAuth2/JWT);

    Оптимізація продуктивності системи та БД (індекси, кешування, фонові джоби);

    Відлагодження та виправлення дефектів, технічна підтримка релізів;

    Автоматизоване тестування (unit/integration)


    Ми пропонуємо:

    Офіційне працевлаштування та бронювання;

    Графік роботи: понеділок — п’ятниця, з 9–18 або 10–19;

    Своєчасну виплату заробітної плати;

    Відпустка 24 календарні дні, лікарняні. Додаткова відпустка 14 календарних днів ветеранам;

    Офіс біля метро (правий берег);

    Навчання та розвиток;

    Долучитися до амбітної компанії, яка ставить собі за мету зміну правил ведення бойових дій;

    До команди сильних інженерів, які мають значний досвід в мілітарному R&D

    Можливість наблизити Перемогу разом з однодумцями!'
