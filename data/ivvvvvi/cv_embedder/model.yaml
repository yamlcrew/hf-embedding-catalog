      Employment: FULL_TIME

      Location: Ukraine

      Domain: DefTech


      Description:

      Компанія Frontline Robotics спеціалізується на розробці та виробництві роботизованих систем для Сил безпеки та оборони
      України. Ми створюємо наземних роботів, безпілотники, турелі та програмне забезпечення, які змінюють правила ведення
      бойових дій вже зараз.


      Наша мета — збереження людських життів шляхом роботизації війська.


      Ми сформували досвідчену та злагоджену команду і шукаємо Fullstack Developer (Python).


      Окремо хочемо зазначити, що ми дуже вдячні ветеранам та ветеранкам за службу і надаємо вам перевагу у відгуках на наші
      вакансії.


      У Вас має бути:

      3+ роки досвіду у розробці на Python (бажано в ERP екосистемах).

      Досвід роботи із PostgreSQL: схеми, індекси, оптимізація запитів;

      Досвід роботи із ORM (SQLAlchemy), XML, Git, CI/CD;

      Docker/Compose, Linux, базові мережеві налаштування;

      Розуміння підходів для інтеграцій: REST/JSON, вебхуки, автентифікація;

      Розуміння контролю доступів: RBAC/ACL, політики доступу на рівні записів;

