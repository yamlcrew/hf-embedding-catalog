widgetData:
- source_sentence: Seorang pria yang mengenakan pakaian berwarna-warni memegang sesuatu di kedua tangannya dan tersenyum ke
    arah kamera.
  sentences:
  - Jon mengatakan bahwa orang tersebut tidak ingin ikut serta dalam pertempuran.
  - Pria itu akan muncul dalam sebuah foto.
  - Seorang pria menggunakan telepon di jalan yang ramai
- source_sentence: Asal usul wayang dianggap telah hadir semenjak 1500 tahun sebelum Masehi.
  sentences:
  - Satu-satunya hal yang lebih baik adalah informasi yang salah.
  - Wayang diprediksi telah hadir lebih dari 1500 tahun yang lalu.
  - Ada dua gadis dengan warna garis merah dan putih
- source_sentence: siapa yang menyusun dan menerbitkan kamus bahasa Asam
  sentences:
  - Tom Brady Setelah bermain sepak bola di tingkat perguruan tinggi untuk Universitas Michigan, Brady dipilih oleh Patriots
    pada babak keenam draft NFL tahun 2000. Dalam 15 musim Brady sebagai pemain utama,[a], ia telah memimpin Patriots ke tujuh
    penampilan Super Bowl, yang merupakan jumlah terbanyak bagi seorang pemain dalam sejarah.
  - Hemkosh adalah kamus bahasa Assamese yang kedua. Kamus Assamese pertama dikompilasi oleh Dr. Miles Bronson, seorang misionaris
    Baptis Amerika. Kamusnya, yang diterbitkan pada tahun 1867 di American Baptist Mission Press, Sibsagar, sudah tidak dicetak
    lagi. Karya Bronson tidak mengklaim sebagai kamus etimologis tetapi berisi koleksi kata-kata dari masyarakat itu sendiri
    tanpa mencatat asal usulnya.[1]
  - Apa yang Membuatmu Indah Video musik untuk "What Makes You Beautiful" disutradarai oleh John Urbano. Difilmkan selama
    dua hari pada bulan Juli 2011, [66][67], video ini dipublikasikan pada tanggal 19 Agustus 2011.[68]. Setiap dari lima
    hari sebelum pemutaran video, One Direction memposting trailer pendek video tersebut secara online. Setiap teaser menampilkan
    cuplikan dari video dan di balik layar, serta salah satu anggota band yang mengumumkan berapa banyak hari tersisa hingga
    pemutaran video.[69] Video ini dibuka dengan One Direction menghabiskan waktu di pantai Malibu, California, yang diselingi
    dengan adegan mereka mengemudikan mobil camper berwarna oranye. Pada bait kedua, sebuah kelompok tiga gadis bergabung
    dengan band di pantai; dalam solo jembatan Styles, dia menyanyikan lagu secara intim kepada satu gadis, Madison McMillin,[70],
    secara individual. Selama chorus terakhir, band dan para gadis terlihat duduk di sekitar api unggun, menyalakan korek
    api dan mengambil foto.[10]. Di situs berbagi video MUZU TV, video ini adalah video musik paling banyak ditonton ke-4
    pada tahun 2011 di Inggris.[71] Video ini memenangkan dua MTV Video Music Awards untuk kategori Best Pop Video dan Most
    Share-Worthy Video, serta meraih penghargaan sebagai Best New Artist untuk One Direction pada tanggal 6 September 2012.[72].
    Pada Januari 2018, video musik tersebut telah menerima 920 juta tampilan di Vevo dan YouTube.[73]
- source_sentence: MRI otak menunjukkan apa
  sentences:
  - 1 Untuk tahun pertama, diperkirakan bayi akan menggunakan rata-rata 5 popok per hari. 2 Ini berarti sekitar 1825 popok,
    yang menghasilkan biaya setahun sekitar $460. 3 Ketika bayi berusia 2-3 tahun, dia hanya akan menggunakan 3 atau 4 popok
    per hari.
  - Jumlah yang Anda pilih untuk dipasang di mobil tergantung pada Anda. Sebagai tips, jika Anda berencana menyewa, hitung
    berapa kilometer yang Anda tempuh setiap bulan, lalu tambahkan 50% untuk mendapatkan jumlah kilometer yang harus Anda
    beli untuk penyewaan. Misalnya, jika Anda memperkirakan mengemudi 1.000 kilometer per bulan, Anda membutuhkan penyewaan
    sebesar 1.500 kilometer per bulan atau 18.000 kilometer per tahun.
  - Pencitraan resonansi magnet (MRI) kepala adalah tes yang tidak menyakitkan dan non-invasif yang menghasilkan gambar detail
    dari otak dan batang otak Anda. Tes ini dilakukan dengan mesin MRI, yang menghasilkan gambar menggunakan medan magnet
    dan gelombang radio. Tes ini juga dikenal sebagai MRI otak atau MRI tengkorak. MRI berbeda dari pemindaian tomografi komputer
    (CT) atau sinar-X dalam hal ia tidak menggunakan radiasi untuk menghasilkan gambar. Gambar dapat digabungkan untuk membentuk
    gambaran 3D dari struktur internal Anda, sehingga MRI lebih efektif daripada tes lain dalam mendeteksi kelainan pada kelenjar
    pituitari.
- source_sentence: Apa perbedaan antara 打关系 dan 走关系?
  sentences:
  - Jika teroris memasang bahan peledak palsu pada Anda, membungkam Anda, menempelkan pelatuk ke tangan Anda, dan meninggalkan
    Anda di tengah kota, bagaimana Anda bisa bertahan hidup?
  - '"Apa perbedaan antara "" dan "";"" serta "",""?'
  - Alat apa yang digunakan untuk membuat video ini?
