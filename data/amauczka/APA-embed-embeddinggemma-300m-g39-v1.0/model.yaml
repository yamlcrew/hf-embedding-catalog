    sentences:
    - 'title: none | text: Bondsdag stemt in met btw-verlaging op gas en stadsverwarming



      BERLIJN (ANP/DPA) - Het Duitse parlement heeft ingestemd met een verlaging van de btw op aardgas en stadsverwarming.
      Het belastingtarief wordt van oktober tot eind maart 2024 verlaagd van 19 naar 7 procent. Daarmee komt Berlijn huishoudens
      tegemoet in de stijgende energiekosten.



      De Duitse minister van Financiën Christian Lindner, rechtvaardigde de belastingverlaging door te stellen dat "de staat
      niet mag profiteren van het feit dat het leven voor de mensen duurder wordt".



      Het Duitse kabinet riep energieleveranciers op om het volledige bedrag van de heffingskorting door te berekenen aan
      de consument. Volgens een berekening van vergelijkingsportaal Verivox zou de korting een gezin met een gasverbruik van
      20.000 kilowattuur jaarlijks zo''n 366 euro kunnen opleveren.



      Ongeveer de helft van alle woningen in Duitsland wordt verwarmd met gas. Circa 14 procent van de huizen, vooral in Oost-Duitsland,
      wordt verwarmd met stadsverwarming. Het ministerie van Financiën berekende dat er tot 13 miljard euro minder de schatkist
      binnenstroomt als gevolg van de belastingverlaging.



      De Bondsdag heeft ook groen licht gegeven voor belastingvrije uitkeringen die werkgevers aan werknemers mogen uitkeren
      om daarmee de inflatie op te vangen. Tot eind 2024 zullen bijdragen tot 3000 euro belastingvrij zijn.'
    - 'title: none | text: AZ meldt miljoenenwinst door transfers en wegvallen beperkingen



      ALKMAAR (ANP) - AZ heeft afgelopen seizoen een winst geboekt van bijna 19 miljoen euro. De omzet nam met de helft toe
      doordat er meer geld kwam uit stadioninkomsten na een voorgaand jaar met meer coronabeperkingen. Ook aan de transfers
      van Myron Boadu (AS Monaco), Calvin Stengs (OGC Nice), Marco Bizot (Stade Brest) en Teun Koopmeiners (Atalanta Bergamo)
      verdiende de club uit Alkmaar goed.



      De vertrokken spelers leverden AZ van juli vorig jaar tot en met afgelopen juni 41 miljoen euro op. De club kocht in
      die periode zelf voor ongeveer 8 miljoen in. De verkoop van aanvoerder Owen Wijndal aan Ajax zit nog niet bij deze resultaten,
      omdat die valt onder het volgende boekjaar.



      AZ verwacht dit lopende seizoen de omzet met een vijfde te verhogen door het verder wegvallen van coronaregels en het
      halen van de groepsfase van de Conference League. "Door de financiële resultaten van de afgelopen jaren heeft AZ een
      buffer opgebouwd en ziet AZ de toekomst met vertrouwen tegemoet", aldus de club. Door coronabeperkingen boekten de Alkmaarders
      vorig seizoen een verlies van 800.000 euro.



      AZ eindigde vorig seizoen als vijfde onder trainer Pascal Jansen en verzekerde zich via de play-offs van Europees voetbal.'
    - 'title: none | text: Ministers veroordelen voorgenomen Russische annexatie



      DEN HAAG (ANP) - Ministers Wopke Hoekstra (Buitenlandse Zaken) en Kajsa Ollongren (Defensie) veroordelen de door Rusland
      voorgenomen annexatie van Oekraïens grondgebied. "Die is volstrekt illegaal en gaat alle perken te buiten", aldus Hoekstra.
      "We kunnen niet anders dan het in de meest krachtige termen te veroordelen."



      Het Kremlin heeft al aangekondigd deze vrijdag de regio''s Loehansk, Donetsk, Zaporizja en Cherson officieel te annexeren.
      In die regio''s werden schijnreferenda gehouden met de vraag of inwoners aansluiting bij Rusland willen. Poetin dreigde
      vervolgens met het inzetten van nucleaire wapens als Oekraïne Russisch grondgebied zou aanvallen.



      Deze referenda waren een "verdere escalatie", zegt Hoekstra en ook de nucleaire dreiging is volgens hem "volstrekt ongepast".
      Ollongren zegt "niet onder de indruk" te zijn van de referenda. "Geen normaal land ter wereld zal dit erkennen, het
      is een schijnvertoon." Het verandert voor haar dan ook niets wat betreft de inzet van Nederlandse wapens in de geannexeerde
      regio''s, aangezien die voor de NAVO nog steeds Oekraïens zijn.



      De inzet van Nederland blijft volgens Hoekstra en Ollongren hetzelfde: onverminderde steun en verdere leverantie van
      wapens. Om wat voor wapens het dan gaat, kunnen beiden niet zeggen. Oekraïne heeft onder meer gevraagd om meer pantserhouwitsers,
      maar Ollongren kan niet zeggen dat die er ook komen.'
