- source_sentence: 'task: search result | query: Hoe hebben Europese aandelenbeurzen en bedrijven gedaan als gevolg van economische
    zorgen, de Porsche-beursgang en de impact van oorlog en inflatie?'
  sentences:
  - 'title: none | text: IMG krijgt 800 schademeldingen na aardbevingen in Groningen (2)



    N i e u w bericht, meer informatie in laatste 2 alinea''s



    GRONINGEN (ANP) - Het Instituut Mijnbouwschade Groningen (IMG) heeft sinds de aardbevingen bij Uithuizermeeden en Uithuizen
    afgelopen weekend 800 schademeldingen ontvangen. Zaterdagavond, de dag van de bevingen, stond de teller nog op 52. De
    Groningse dorpen werden ''s middags opgeschrikt door bevingen met een kracht van respectievelijk 2.7 en 1.7.



    Van de 800 meldingen kwamen er 179 uit het zogeheten effectgebied, de zone rond de epicentra van de bevingen. Binnen het
    effectgebied liggen behalve Uithuizermeeden en Uithuizen ook plaatsen als Loppersum, Middelstum en Roodeschool. Ook uit
    verder weg gelegen plaatsen als de stad Groningen (167), Haren (21), Veendam (20), Hoogezand (17) en Winschoten (14) kwamen
    schademeldingen. Uit Friesland kwamen ook enkele meldingen, aldus het IMG.



    Het instituut ontving 18 meldingen over een mogelijk acuut onveilige situatie, waarvan er 10 uit het effectgebied kwamen.
    In 2 gevallen zijn er na inspectie "aanvullende veiligheidsmaatregelen" getroffen, aldus het IMG.



    Van de 800 schademelders hebben er 306 gekozen voor de vaste vergoeding van 5000 euro om de schade mee af te handelen.
    De overigen hebben gekozen voor een zogeheten maatwerkprocedure. In dat geval komt er een deskundige langs om de oorzaak
    en omvang van de schade te onderzoeken. Ook is het mogelijk om in plaats van een vergoeding de schade te laten herstellen.



    De gemeente Het Hogeland, waar Uithuizermeeden en Uithuizen onder vallen, houdt maandagavond samen met het KNMI en het
    Staatstoezicht op de Mijnen (SodM) een informatiebijeenkomst over de recente bevingen. Volgens de gemeente hebben die
    "weer veel impact op bewoners" en gaat het om "een opvallende serie aardbevingen".'
  - 'title: none | text: MotoGP volgend jaar ook voor het eerst naar India (2)



    N i e u w bericht, meer informatie na 3e alinea



    BURIRAM (ANP) - De motorcoureurs in de WK wegrace gaan volgend jaar voor het eerst naar India. De organisator van de MotoGP
    heeft een contract gesloten met het circuit van Buddh, dat ten zuiden van hoofdstad New Delhi ligt. Op dat circuit werden
    tussen 2011 en 2013 al drie races in de Formule 1 gehouden, allemaal gewonnen door de Duitser Sebastian Vettel namens
    Red Bull.



    "We hebben veel motorsportfans in India en we zijn heel blij dat we de sport naar hen toe kunnen brengen", zegt directeur
    Carmelo Ezpeleta van Dorna, de promotor en rechtenhouder van de MotoGP.



    Eerder deze week meldde de MotoGP al dat volgend jaar voor het eerst een Grand Prix in Kazachstan wordt gehouden, op het
    Sokol-circuit in de buurt van Almaty. De MotoGP sloot een contract voor vijf jaar met Kazachstan.



    Op de voorlopige kalender voor 2023 staat de GP van Kazachstan gepland voor 9 juli, twee weken na de TT van Assen (25
    juni). Het circuit in Drenthe huisvest de achtste grand prix van het jaar. De kalender bestaat uit 21 races in achttien
    landen. Dat is één race meer dan dit jaar. India staat op het programma voor 24 september, de veertiende race van het
    seizoen. De motorcoureurs sluiten het jaar zoals gebruikelijk in november af in Valencia.



    Qatar mocht de afgelopen jaren steeds de openingsrace organiseren, maar is nu verplaatst naar de slotfase van het seizoen.
    De GP van Qatar staat op de kalender voor 19 november, een week voor de slotrace in Valencia. Het seizoen begint nu op
    26 maart met de GP van Portugal.



    Momenteel zijn de motorcoureurs in Thailand, waar zondag de zeventiende GP van dit seizoen wordt verreden. Begin november
    is in Valencia de twintigste en laatste race.'
  - 'title: none | text: Beurzen omlaag ondanks winsten Wall Street, Porsche stijgt



    AMSTERDAM (ANP) - De Europese aandelenbeurzen zijn donderdag lager geopend, ondanks de winsten op Wall Street een dag
    eerder. Beleggers bleven voorzichtig door zorgen over een economische recessie. Op de beurs in Frankfurt ging de aandacht
    vooral uit naar de beursgang van automerk Porsche. Met die beursgang haalde Porsche-moederbedrijf Volkswagen 9,4 miljard
    euro op, waarmee het de grootste aandelenverkoop in Frankfurt is sinds 1996.



    De AEX-index in Amsterdam noteerde in de vroege handel 1,1 procent lager op 633, punten. De MidKap zakte 1,4 procent tot
    839,41 punten. De hoofdgraadmeters in Parijs, Londen en Frankfurt gingen tot 1,3 procent omlaag.



    Porsche ging bij opening bijna 2 procent omhoog. De aandelen Porsche werden voor een prijs van 82,50 euro per stuk verkocht.
    Met die aandelenverkoop werd een prijskaartje aan het luxemerk uit Stuttgart gehangen van 75 miljard euro. Porsche is
    daarmee meer waard dan Duitse rivalen als BMW (47 miljard euro) en Mercedes-Benz (56 miljard euro). Met de opbrengst wil
    Volkswagen onder meer extra investeren in elektrisch rijden. Het is de grootste beursgang in Europa sinds 2011.



    In Amsterdam noteert uitzender Randstad ex-dividend, wat betekent dat het aandeel geen recht meer geeft over het dividend
    van de afgelopen periode. Randstad verloor 8,4 procent en was daarmee de grootste daler in de AEX.



    In Stockholm zakte kledingketen H&M 3,3 procent. Het Zweedse bedrijf heeft financieel flink te lijden van de beslissing
    om Rusland te verlaten vanwege de oorlog in Oekraïne. De kosten die daarmee gemoeid waren drukten stevig op de winst in
    het derde kwartaal van het gebroken boekjaar.



    Het Britse winkelbedrijf Next ging 8,3 procent onderuit in Londen na een winstwaarschuwing. Next heeft last van de hoge
    inflatie omdat daardoor mensen meer de hand op de knip houden.'
- source_sentence: 'task: search result | query: Hiphopdans Lloyd Marengo'
  sentences:
  - 'title: none | text: Bergkamp: ik steek met onderzoek geen ''mes in rug'' van Arib (2)



    N i e u w bericht, meer informatie door hele bericht



    DEN HAAG (ANP) - Tweede Kamervoorzitter Vera Bergkamp vindt niet dat zij haar voorganger Khadija Arib "een mes in de rug"
    steekt met een onderzoek naar klachten over haar. Arib is woest over dat onderzoek en spreekt van "opnieuw een ‘anonieme’,
    politieke dolksteek in mijn rug". Volgens Bergkamp is er goed over het onderzoek nagedacht en doet de kritiek van Arib
    geen recht aan de zorgvuldige werkwijze van de Tweede Kamer.



    De kwestie is woensdag besproken door het presidium, een groep Kamerleden verantwoordelijk voor de dagelijkse leiding
    van het parlement. "We zijn niet over één nacht ijs gegaan", zegt Bergkamp. Er waren twee anonieme brieven binnengekomen
    met klachten, waarna contact is gezocht met de landsadvocaat. "De landsadvocaat heeft dringend verzocht een onafhankelijk
    onderzoek te doen. Wij moeten dat doen vanuit onze rol als werkgever." Met Arib zelf is volgens de voorzitter nog altijd
    niet gesproken.



    Volgens NRC, dat het nieuws over het onderzoek woensdag naar buiten bracht, zeggen de klagers dat Arib een onveilige werksfeer
    veroorzaakte en "een schrikbewind" voerde. Bergkamp bevestigt dat het onderzoek betrekking heeft op de "sociale veiligheid",
    maar wilde verder niks kwijt. "Alles wat ik nu zeg over de inhoud, over de timing, wie wist wat, beïnvloedt het onderzoek
    en dat wil ik niet." De voorzitter zegt dat er nog geen onderzoeksvraag is geformuleerd en dat er ook nog geen onderzoeksbureau
    is gekozen.'
  - 'title: none | text: Oude satellieten moeten sneller worden opgeruimd uit de ruimte



    WASHINGTON (ANP) - Satellieten die in een baan rond de aarde worden gebracht, moeten voortaan eerder worden opgeruimd.
    Als hun missie is afgerond en hun werk klaar is, mogen ze hooguit nog vijf jaar blijven vliegen. De limiet was 25 jaar.
    De nieuwe regel moet voorkomen dat ruimteafval zich ophoopt.



    De Amerikaanse toezichthouder voor communicatie, de FCC, heeft de regel donderdag aangenomen. Bedrijven die bij de organisatie
    toestemming vragen voor een lancering, moeten in hun aanvraag al aangeven hoelang de missie duurt en wanneer de satelliet
    vergaat.



    De regel geldt voor satellieten in een lage omloopbaan, de low Earth orbit (LEO). Die sondes vliegen lager dan 2000 kilometer
    boven de aarde. Hier zijn vooral communicatiesatellieten. Ruimtevaartbedrijf SpaceX werkt bijvoorbeeld aan een groot netwerk
    van duizenden satellieten voor internetverbindingen.



    Rond de aarde draaien duizenden satellieten en nog veel meer brokstukken en restanten. Om in hun baan te blijven, moeten
    ze een snelheid van ongeveer 25.000 kilometer per uur hebben. Hoe meer ruimtepuin er is, hoe groter de kans op botsingen
    en het ontstaan van nog meer afval. Dat kan ook gevaarlijk zijn voor de bemanning van het ruimtestation ISS. Sterrenkundigen
    klagen bovendien dat ze met hun telescopen de sterrenhemel haast niet meer kunnen onderzoeken door de vele satellieten
    die langsvliegen.



    Satellieten kunnen worden opgeruimd door ze af te remmen en naar beneden te duwen. Dan kunnen ze worden gegrepen door
    de zwaartekracht en verbranden in de dampkring.'
  - 'title: none | text: Dansprijs Gouden Zwaan voor hiphoplegende Lloyd Marengo



    MAASTRICHT (ANP) - De dansprijs Gouden Zwaan gaat dit jaar naar de Rotterdamse hiphoplegende Lloyd Marengo. Dat is vrijdag
    bekendgemaakt tijdens de Nederlandse Dansdagen in Maastricht. Het is een onderscheiding voor iemand die met de eigen loopbaan
    ook een grote bijdrage heeft geleverd aan de Nederlandse dans.



    De Dansjury van de Vereniging van Schouwburg- en Concertgebouwdirecties (VSCD) koos de danser en choreograaf uit onder
    meer omdat hij zich "onvermoeibaar heeft ingezet om hiphopdans naar het theater te brengen".



    Zo heeft hij volgens het college "de weg geplaveid voor veel choreografen, die zich aanvankelijk buiten de gevestigde
    academische paden begaven en die nu op de podia te zien zijn." Hij beweegt zich nog steeds als "een spin in het web om
    verbindingen te leggen en nieuwe generaties te stimuleren om de stap naar het theaterpodium te maken".



    Begonnen in de breakdance danste de prijswinnaar, een van de medeoprichters van Hiphophuis Rotterdam, ook bij de gevestigde
    gezelschappen Scapino Ballet Rotterdam en Conny Janssen Danst.



    De Zwaan voor Meest indrukwekkende dansproductie is deze keer voor de voorstelling Figures in Extinction [1.0] van Crystal
    Pite en Simon McBurney, uitgevoerd door Nederlands Dans Theater 1. Danser Young Gyu Choi van Het Nationale Ballet krijgt
    de Zwaan voor Meest indrukwekkende dansprestatie voor zijn rol in 7e Symfonie van Toer van Schayk.



    De Jonge Zwaan voor Meest indrukwekkende jeugddansproductie gaat naar Birds van Dalton Jansen, gemaakt voor productiehuis
    DOX. Breakdancer Dietrich Pott krijgt de Jonge Zwaan voor Meest indrukwekkende jeugddansprestatie voor zijn rol in B-Boy
    XL van Maas theater en dans.'
- source_sentence: 'task: search result | query: asielzoekers Koepel Breda'
  sentences:
  - 'title: none | text: Motie over nieuwe afspraken met COA over Ter Apel aangenomen



    WESTERWOLDE (ANP) - In de gemeente Westerwolde (Groningen) is een motie aangenomen die pleit voor nieuwe afspraken met
    het Centraal Orgaan opvang asielzoekers (COA) wat betreft het aanmeldcentrum in Ter Apel. Dinsdag was al bekend geworden
    dat de motie op ruime steun kon rekenen in de gemeenteraad, die woensdagavond over de kwestie sprak in een vergadering.



    In de motie wordt het college opgeroepen het gesprek aan te gaan met het COA, omdat die organisatie meerdere afspraken
    in de huidige overeenkomst zou hebben geschonden. Zo is het centrum al maanden overvol en is er afgesproken dat er maximaal
    2000 vluchtelingen mogen worden opgevangen. Ook zouden er meerdere keren tenten zijn geplaatst terwijl de gemeente daar
    geen toestemming voor heeft gegeven.



    De motie was ingediend door de lokale partij Gemeentebelangen Westerwolde en werd unaniem aangenomen. Het COA liet eerder
    weten waarschijnlijk op donderdag te reageren op de aangenomen motie.'
  - 'title: none | text: Breda gaat honderden extra vluchtelingen opvangen in de Koepel (2)



    N i e u w bericht, meer informatie in laatste alinea: Venray wil noodopvang asielzoekers verlengen



    BREDA (ANP) - Breda gaat meer vluchtelingen onderdak geven in de Koepel. Op dit moment worden al ongeveer vierhonderd
    Oekraïners opgevangen in het voormalige gevangeniscomplex. De gemeente Breda meldde donderdag dat door een uitbreiding
    en een verlenging van het huurcontract voor drie jaar in totaal zevenhonderd tot achthonderd slaapplekken beschikbaar
    komen.



    De eerste uitbreiding bestaat uit tweehonderd extra plekken voor Oekraïense vluchtelingen. Zij krijgen in een bijgebouw
    hun slaapvertrek en kunnen gebruikmaken van de faciliteiten in de Koepel. Daarnaast overlegt de gemeente met het Rijk
    of het mogelijk is ongeveer honderd (minderjarige) asielzoekers met goede kansen op een verblijfsstatus in Nederland onder
    te brengen in een gebouw op het complex. Een deel van deze groep, ongeveer zestig minderjarige asielzoekers, wordt op
    dit moment al opgevangen in een voormalig gebouw van KPN.



    "We hebben in Breda te maken met een aantal forse opgaven als het aankomt op opvang en huisvesting. Daar hebben we niet
    meteen een pasklare oplossing voor", zegt burgemeester Paul Depla. "Het vraagt van ons om in mogelijkheden te denken en
    met maatwerk te komen, op de korte en op de lange termijn. We willen daarin ook onze verantwoordelijkheid nemen, zowel
    op lokaal als regionaal niveau. Door de Koepel als flexibele opvanglocatie in te richten kunnen we op een snelle manier
    ruimte creëren voor verschillende doelgroepen. En die ruimte ook in de toekomst mee laten groeien met de vraag die er
    is."



    De gemeenteraad moet nog instemmen met het plan om meer vluchtelingen op te vangen in de Koepel.'
  - 'title: none | text: Onderzoek: productie bitcoins steeds schadelijker voor klimaat



    ALBUQUERQUE (ANP) - Bitcoins dragen volgens Amerikaanse onderzoekers in toenemende mate bij aan klimaatverandering. De
    productie van de cryptomunten vergt steeds grotere hoeveelheden elektriciteit. Volgens een studie van de Universiteit
    van New Mexico is de CO2-uitstoot per geproduceerde bitcoin daardoor in vijf jaar met een factor 126 gestegen. In 2016
    veroorzaakte het zogeheten delven van één bitcoin nog 0,9 ton CO2-uitstoot. In 2021 was dat opgelopen tot 113 ton.



    Het systeem achter bitcoins draait op computers die complexe wiskundige puzzels oplossen. De beheerders van die computers
    krijgen als beloning virtueel geld. Volgens de studie, die is gepubliceerd in het wetenschappelijke tijdschrift Scientific
    Reports, is daar in 2020 ruim 75 terawatt aan stroom voor gebruikt. Dat is iets meer dan het jaarverbruik van heel Oostenrijk.



    Op de piek van de bitcoinprijs, in mei 2020, veroorzaakte de productie van bitcoins volgens de onderzoekers een hoger
    bedrag aan klimaatschade dan de digitale munten waard waren. Voor iedere dollar aan bitcoins ontstond volgens hun berekeningen
    1,56 dollar schade die verband houdt met klimaatverandering. Onder klimaatschade valt bijvoorbeeld schade door toenemende
    droogte, bosbranden of extreem weer.



    De onderzoekers vergeleken de klimaatimpact van bitcoins ook met die van andere sectoren. Wanneer de schade uitgedrukt
    in dollars wordt vergeleken met de totale marktwaarde, scoren bitcoins net iets minder slecht dan aardgas en benzine,
    maar slechter dan rundvlees. Het delven van echt goud levert een stuk meer op in verhouding tot de vervuiling die erdoor
    ontstaat, concluderen de wetenschappers. Bitcoins voldoen aan geen enkele van de duurzaamheidscriteria die ze voor hun
    onderzoek opstelden.'
- source_sentence: 'task: search result | query: Oekraïense regio''s Poetin'
  sentences:
  - 'title: none | text: Poetin maakt weg vrij voor annexatie Cherson en Zaporizja (3)



    N i e u w bericht, meer informatie in 2e en 3e alinea



    MOSKOU (ANP/AFP/RTR) - De Russische president Vladimir Poetin heeft decreten ondertekend die de weg vrijmaken voor de
    formele annexatie door Rusland van de bezette Oekraïense regio''s Cherson en Zaporizja. In de door het Kremlin vrijgegeven
    decreten erkent Poetin de twee regio''s als onafhankelijke territoria. Dit is een tussenstap die nodig is voordat Poetin
    als verwacht vrijdag aankondigt dat de regio''s deel uitmaken van Rusland.



    VN-secretaris-generaal António Guterres heeft de Russische plannen donderdag krachtig veroordeeld. Hij zei dat de annexatie
    van de regio''s "geen juridische waarde heeft en dat ze verdient te worden veroordeeld". Ook noemde hij de plannen in
    strijd met het internationaal recht en een "gevaarlijke escalatie" van de oorlog in Oekraïne. "Dit mag niet worden geaccepteerd."
    Rusland veroordeelde Guterres'' uitspraken door erop te wijzen dat hij in zijn functie niet bevoegd is om politieke uitspraken
    te doen namens de hele VN.



    Vrijdag stemt de VN-Veiligheidsraad over een resolutie waarin de referenda in door Rusland bezet gebied van Oekraïne veroordeeld
    worden, meldt het Franse voorzitterschap van de raad. De resolutie, die is opgesteld door de Verenigde Staten en Albanië,
    maakt geen kans om te worden aangenomen vanwege het vetorecht van Rusland, maar moet dan worden voorgelegd aan de Algemene
    Vergadering van de VN.'
  - 'title: none | text: Persbureau AFP meldt forse afname groei economie Italië in 2023



    ROME (ANP/BELGA) - De economie van Italië zal volgend jaar fors minder hard groeien dan eerder voorzien. Persbureau AFP
    meldt op basis van een regeringsbron dat de scheidende regering van het Zuid-Europese land nu uitgaat van 0,6 procent
    groei in 2023. Dat is fors minder dan de 2,4 procent die eerder werd voorzien.



    De hoge inflatie als gevolg van de sterk gestegen energieprijzen door de oorlog in Oekraïne liggen aan de basis van de
    bijstelling. Het nieuwe cijfer komt uit de laatste economische ''roadmap'' die goedgekeurd is door de afscheid nemende
    regering van premier Mario Draghi.



    Het document zal dienen voor de begrotingsopmaak voor de toekomstige regering. Die zal worden geleid door Giorgia Meloni
    van Fratelli d''Italia. De radicaal-rechtse partij won zondag de parlementsverkiezingen, waarmee het de grootste partij
    is in het rechtse blok. Meloni eiste snel het leiderschap op in de volgende regering.'
  - 'title: none | text: Youp van ''t Hek speelt voor het eerst in Theater Tuschinski



    AMSTERDAM (ANP) - Youp van ’t Hek gaat binnenkort twee avonden optreden in Koninklijk Theater Tuschinski in Amsterdam.
    Dat heeft exploitant Pathé donderdag bekendgemaakt. De 68-jarige cabaretier speelt zijn afscheidsvoorstelling De Laatste
    Ronde! op 24 en 25 oktober in de majestueuze bioscoop in het centrum van Amsterdam. Het is de eerste keer in zijn carrière
    dat Van ''t Hek op het podium van Tuschinski staat.



    Pathé is vereerd dat Van ''t Hek zijn voorstelling in de bioscoop komt spelen. Koninklijk Theater Tuschinski en cabaret
    waren in het verleden nauw met elkaar verbonden. In wat nu de tweede zaal is van het gebouw zat in de jaren twintig en
    dertig theater La Gaîté waar vooral variété-artiesten en cabaretiers optraden. Grote namen zoals Louis Davids, Lou Bandy,
    Fien de la Mar, Marlene Dietrich, Edith Piaf en Josephine Baker stonden op dit podium. Na een brand in 1941 kwam La Gaîté
    niet meer terug.



    De verkoop voor de voorstellingen begint op donderdag 29 september om 12.00 uur via de website van Pathé.'
- source_sentence: 'task: search result | query: Welke steun en wapenleverantie zal Nederland verlenen aan Oekraïne gezien
    de Russische annexatie?'
  sentences:
  - 'title: none | text: Bondsdag stemt in met btw-verlaging op gas en stadsverwarming



    BERLIJN (ANP/DPA) - Het Duitse parlement heeft ingestemd met een verlaging van de btw op aardgas en stadsverwarming. Het
    belastingtarief wordt van oktober tot eind maart 2024 verlaagd van 19 naar 7 procent. Daarmee komt Berlijn huishoudens
    tegemoet in de stijgende energiekosten.



    De Duitse minister van Financiën Christian Lindner, rechtvaardigde de belastingverlaging door te stellen dat "de staat
    niet mag profiteren van het feit dat het leven voor de mensen duurder wordt".



    Het Duitse kabinet riep energieleveranciers op om het volledige bedrag van de heffingskorting door te berekenen aan de
    consument. Volgens een berekening van vergelijkingsportaal Verivox zou de korting een gezin met een gasverbruik van 20.000
    kilowattuur jaarlijks zo''n 366 euro kunnen opleveren.



    Ongeveer de helft van alle woningen in Duitsland wordt verwarmd met gas. Circa 14 procent van de huizen, vooral in Oost-Duitsland,
    wordt verwarmd met stadsverwarming. Het ministerie van Financiën berekende dat er tot 13 miljard euro minder de schatkist
    binnenstroomt als gevolg van de belastingverlaging.



    De Bondsdag heeft ook groen licht gegeven voor belastingvrije uitkeringen die werkgevers aan werknemers mogen uitkeren
    om daarmee de inflatie op te vangen. Tot eind 2024 zullen bijdragen tot 3000 euro belastingvrij zijn.'
  - 'title: none | text: AZ meldt miljoenenwinst door transfers en wegvallen beperkingen



    ALKMAAR (ANP) - AZ heeft afgelopen seizoen een winst geboekt van bijna 19 miljoen euro. De omzet nam met de helft toe
    doordat er meer geld kwam uit stadioninkomsten na een voorgaand jaar met meer coronabeperkingen. Ook aan de transfers
    van Myron Boadu (AS Monaco), Calvin Stengs (OGC Nice), Marco Bizot (Stade Brest) en Teun Koopmeiners (Atalanta Bergamo)
    verdiende de club uit Alkmaar goed.



    De vertrokken spelers leverden AZ van juli vorig jaar tot en met afgelopen juni 41 miljoen euro op. De club kocht in die
    periode zelf voor ongeveer 8 miljoen in. De verkoop van aanvoerder Owen Wijndal aan Ajax zit nog niet bij deze resultaten,
    omdat die valt onder het volgende boekjaar.



    AZ verwacht dit lopende seizoen de omzet met een vijfde te verhogen door het verder wegvallen van coronaregels en het
    halen van de groepsfase van de Conference League. "Door de financiële resultaten van de afgelopen jaren heeft AZ een buffer
    opgebouwd en ziet AZ de toekomst met vertrouwen tegemoet", aldus de club. Door coronabeperkingen boekten de Alkmaarders
    vorig seizoen een verlies van 800.000 euro.



    AZ eindigde vorig seizoen als vijfde onder trainer Pascal Jansen en verzekerde zich via de play-offs van Europees voetbal.'
  - 'title: none | text: Ministers veroordelen voorgenomen Russische annexatie



    DEN HAAG (ANP) - Ministers Wopke Hoekstra (Buitenlandse Zaken) en Kajsa Ollongren (Defensie) veroordelen de door Rusland
    voorgenomen annexatie van Oekraïens grondgebied. "Die is volstrekt illegaal en gaat alle perken te buiten", aldus Hoekstra.
    "We kunnen niet anders dan het in de meest krachtige termen te veroordelen."



    Het Kremlin heeft al aangekondigd deze vrijdag de regio''s Loehansk, Donetsk, Zaporizja en Cherson officieel te annexeren.
    In die regio''s werden schijnreferenda gehouden met de vraag of inwoners aansluiting bij Rusland willen. Poetin dreigde
    vervolgens met het inzetten van nucleaire wapens als Oekraïne Russisch grondgebied zou aanvallen.



    Deze referenda waren een "verdere escalatie", zegt Hoekstra en ook de nucleaire dreiging is volgens hem "volstrekt ongepast".
    Ollongren zegt "niet onder de indruk" te zijn van de referenda. "Geen normaal land ter wereld zal dit erkennen, het is
    een schijnvertoon." Het verandert voor haar dan ook niets wat betreft de inzet van Nederlandse wapens in de geannexeerde
    regio''s, aangezien die voor de NAVO nog steeds Oekraïens zijn.



    De inzet van Nederland blijft volgens Hoekstra en Ollongren hetzelfde: onverminderde steun en verdere leverantie van wapens.
    Om wat voor wapens het dan gaat, kunnen beiden niet zeggen. Oekraïne heeft onder meer gevraagd om meer pantserhouwitsers,
    maar Ollongren kan niet zeggen dat die er ook komen.'
