    sentences:
    - "Dispõe sobre a concessão de incentivos fiscais para as indústrias do setor de reciclagem e do setor metal mecânico.\n\
      \no congresso nacional decreta\n\nO Congresso Nacional decreta: \n \n \n \nArt. 1o Fica concedido às empresas que se\
      \ dediquem à \nreciclagem de vidro, plástico, papel, pneu e metal, os seguintes benefícios \nfiscais do Imposto sobre\
      \ Produtos Industrializados ¿ IPI e do Imposto sobre a \n \nImportação - II: \n \nI ¿ crédito presumido correspondente\
      \ ao valor da alíquota \ndo IPI incidente sobre operação promovida por estabelecimento industrial nas \nsaídas dos produtos\
      \ reciclados; \n \nII ¿ diferimento do IPI e do II incidentes sobre as \nimportações de máquinas, equipamentos, peças,\
      \ parte s e acessórios \ndestinados a integrar o ativo fixo das empresas, para o momento da alienação \nou eventual\
      \ saída desses bens; \n \nIII ¿ diferimento do IPI sobre a aquisição, no mercado \ninterno, de máquinas, equipamentos,\
      \ peças, partes, acessórios e materiais \ndestinados a integrar o ativo fixo das empresas, para o momento da alienação\
      \ \nou eventual saída desses bens. \n \n§ 1º Nas aquisições internas de máquinas, equipamentos, \npeças, partes e acessórios\
      \ destinados a integrar o ativo fixo das empresas, o\nCÂMARA DOS DEPUTADOS \n \n \n \nimposto será de responsabilidade\
      \ do estabelecimento adquirente da \nmercadoria, na qualidade de contribuinte substituto, e recolhido no momento da\
      \ \nalienação ou saída dos respectivos bens. \n \n \n \n \n§ 2º Nas operações internas de entrada de matérias-\nprimas,\
      \ produtos intermediários e material de embalagem, o imposto será de \nresponsabilidade do estabelecimento adquirente\
      \ do produto final, na qualidade \nde contribuinte substituto, e apurado de forma global no momento da venda \ndos produtos\
      \ fabricados. \n \n§ 3º Os impostos incidentes sobre as importações de \nmatérias-primas, produtos intermediários e\
      \ material de embalagem serão \napurados de forma global no momento da venda dos produtos fabricados. \n \n§ 4º Perderá\
      \ o direito ao tratamento tributário previsto \nneste artigo, com a conseqüente restauração da sistemática normal de\
      \ \napuração dos impostos e a imediata devolução aos cofres públicos, com os \nacréscimos legais devidos, de todos os\
      \ valores não recolhidos, decorrentes do \nbenefício concedido, o contribuinte que, ao longo do gozo do benefício, \n\
      apresentar qualquer irregularidade com relação ao cumprimento das exigências \nprevistas no art. 5º desta lei. \n \n\
      § 5º Não será permitido às empresas beneficiadas o \naproveitamento de qualquer crédito relativo às operações de entrada\
      \ de \nmercadorias, \nmatérias-primas, \nprodutos \nintermediários \ne \nmaterial \nde \nembalagem necessários às suas\
      \ atividades. \n \nArt. 2º As empresas do setor metal mecânico terão \nreduzida as bases de cálculo do IPI e do II,\
      \ na pro porção de 33,33% (trinta e \ntrês inteiros e trinta e três centésimos por cento) , nas operações de saídas\
      \ \ninternas. \n \nArt. 3º Os benefícios estabelecidos nesta Lei não s e \naplicam ao contribuinte que: possua débito\
      \ com o Instituto Nacional do Seguro \nSocial - INSS, ou com a Fazenda Pública Federal, cu ja exigibilidade não esteja\
      \ \nsuspensa. \n \nArt. 4º Os incentivos fiscais previstos nesta Lei vigorarão\nCÂMARA DOS DEPUTADOS \n \n \n \naté\
      \ o último dia útil do décimo ano subseqüente ao da data de sua publicação. \n \n \nArt. 5º Esta lei entra em vigor\
      \ na data de sua publicação."
    - "Acrescentar o art. 476-B ao Decreto-Lei nº 5.452, de 1º de maio de 1943, para garantir estabilidade ao empregado na\
