widgetData:
- source_sentence: "Modifica a Lei nº 8.069, de 13 de julho de 1990, para estabelecer o procedimento destinado à inscrição\
    \ de crianças e adolescentes nos cadastros estaduais e nacional de adoção.\n\no congresso nacional decreta\n\nO CONGRESSO\
    \ NACIONAL decreta: \nArt. 1º. Esta Lei modifica a Lei n° 8.069, de 13 e julho de \n1990, para estabelecer o procedimento\
    \ destinado à inscrição de crianças e \nadolescentes nos cadastros estaduais e nacional de adoção.  \nArt. 2º O Capítulo\
    \ III, do Título VI, da Lei n° 8.069, de 13 e \njulho de 1990, Estatuto da Criança e do Adolescente, passa a vigorar acrescido\
    \ \nda seguinte seção:  \nSeção IX \nDa Inscrição dos Adotáveis nos cadastros estaduais e \nnacional de adoção \nArt.\
    \ 197-F. A adoção pressupõe a decretação da perda do \npoder familiar, que poderá seguir o procedimento de \njurisdição\
    \ voluntária se a mãe manifestar o interesse de \nentregar o filho para adoção.  \nArt. 197-G. As gestantes que manifestem\
    \ interesse em \nentregar seus filhos para adoção serão obrigatoriamente \nencaminhadas à Justiça da Infância e da Juventude,\
    \ a \nqual deverá entrevista-la, informá-la sobre a possibilidade\n2 \n \n     *703CFFD519* \n     703CFFD519 \nde recebimento\
    \ de alimentos gravídicos e a inclusão em \nprogramas oficiais de orientação, apoio e promoção \nsocial.  \nParágrafo\
    \ único. Considerado o caso, a Justiça da \nInfância e da Juventude poderá realizar o mapeamento da \nfamília extensa\
    \ antes do parto.  \nArt. 197-H. A Defensoria Pública, preferencialmente, ou o \nMinistério Público poderão conferir assistência\
    \ jurídica \ndurante o procedimento de jurisdição voluntária, podendo \nrequerer a intimação de interessados.  \nArt.\
    \ 197-I. A inscrição da criança e do adolescente nos \ncadastros estaduais e nacional de adoção poderá ocorrer \nem tutela\
    \ antecipada se:  \nI ¿ após tentativa de localizar os genitores ou parentes \npróximos, a citação ocorrer por edital;\
    \ \nII ¿ restar evidente à impossibilidade de reintegração da \ncriança ou do adolescente à família de origem. \n \nArt.\
    \ 3º Esta lei entra em vigor na data da publicação."
  sentences:
  - "Acrescenta-se o art. 50-A e 50-B a Lei nº 8.069, de 1990 (Estatuto da Criança e Adolescente), a fim de estabelecer prazo\
    \ para realização de exames psicossociais e dá outras providências.\n\no congresso nacional decreta\n\nO Congresso Nacional\
    \ decreta: \n \nArt. 1º A Lei nº 8.069, de 1990, passa a vigorar acrescida dos seguintes \nartigos: \n \nArt. 50-A Os\
    \ exames psicossociais ou quaisquer \noutras espécies de exames técnicos exigidos por esta lei ou por \ndeterminação judicial,\
    \ deverão obedecer o prazo de até 30 dias para \nsua realização. \nArt. 50-B Na ausência de servidores públicos \nintegrantes\
    \ do Poder Judiciário responsáveis pela realização dos \nexames, poderá o magistrado proceder a nomeação de pessoa idônea,\
    \ \nportadora de diploma de curso superior preferencialmente na área \nespecífica, dentre as que tiverem habilitação técnica\
    \ relacionada com a \nnatureza do exame. \n \nArt. 2º Esta Lei entra em vigor na data de sua publicação."
  - "Altera a Lei nº 12.732, de 22 de novembro de 2012, para que os exames relacionados ao diagnóstico de neoplasia maligna\
    \ tenham seu resultado no prazo de 10 (dez) dias, no caso em que especifica.\n\no congresso nacional decreta\n\nO Congresso\
    \ Nacional decreta:\nArt. 1° Altera a Lei nº 12.732, de 22 de novembro de 2012, para\nque os exames relacionados ao diagnóstico\
    \ de neoplasia maligna tenham seu\nresultado no prazo de 10 (dez) dias, no caso em que especifica:\n¿Art.2º. .........................................................................................\n\
    .\n.....................................................................................................\n.\n    § 3º\
    \ Nos casos em que a principal hipótese diagnóstica seja\na de neoplasia maligna, os exames necessários à elucidação\n\
    devem ser realizados no prazo máximo de 30 (trinta) dias,\nmediante solicitação fundamentada do médico responsável, e\n\
    seus resultados devem ser disponibilizados em até 10 (dez)\ndias da realização.¿(NR)\nArt. 2º Esta Lei entra em vigor\
    \ após decorridos 180 (cento e\noitenta) dias de sua publicação oficial."
  - "Dispõe sobre a política de incentivo à produção de etanol em microdestilarias e em cooperativas de pequenos produtores\
    \ e dá outras providências.\n\no congresso nacional decreta\n\nO Congresso Nacional decreta: \nArt. 1º Fica instituída\
    \ a política de incentivo às microdestilarias \ne às cooperativas de pequenos produtores de etanol, que tem como objetivo\
    \ \ncontribuir para o desenvolvimento socioeconômico regional integrado e \nsustentável, e para a geração de emprego e\
    \ renda no país. \n§ 1º Para os efeitos desta Lei, define-se microdestilaria como \nsendo uma unidade com capacidade de\
    \ produção de até 10 (dez) mil litros de \netanol combustível por dia. \n§ 2º As microdestilarias poderão ser integradas\
    \ a cooperativa \nde pequenos produtores de etanol, que poderá contar com uma destilaria \ncentral, cuja função é adequar\
    \ o teor do etanol produzido nas microdestilarias e \nhomogeneizar a produção a ser comercializada. \nArt. 2º As microdestilarias\
    \ e as cooperativas de que trata o art. \n1º desta Lei poderão vender o etanol hidratado combustível diretamente para\
    \ o \nconsumidor final ou para os postos revendedores, observada a regulamentação \ndo órgão regulador.\n2 \n \nArt. 3º\
    \ O § 8º do art. 5º da Lei nº 9.718, de 27 de novembro de \n1998, passa a vigorar com a seguinte redação: \n¿Art. \n5º\
    \ \n.......................................................................................... \n......................................................................................................\
    \ \n§ 8º Fica o Poder Executivo autorizado a fixar coeficientes para \nredução das alíquotas previstas no caput e no §\
    \ 4º deste artigo, \nas quais poderão ser alteradas, para mais ou para menos, em \nrazão: \nI - da matéria-prima utilizada\
    \ na produção do etanol \ncombustível, segundo a espécie; \nII - das características do produtor-vendedor; \nIII - da\
    \ região de produção da matéria-prima; \nIV - da combinação dos fatores constantes dos incisos I, II e III \ndeste parágrafo.\
    \ \n .......................................................................................... ¿ (NR) \nArt. 4º A Lei\
    \ nº 9.718, de 27 de novembro de 1998, passa a \nvigorar acrescida do seguinte art. 5º-B: \n¿Art. 5º-B Ficam reduzidas\
    \ a 0 (zero) as alíquotas da \ncontribuição para o PIS/PASEP e da COFINS incidentes sobre \nas receitas decorrentes da\
    \ comercialização de etanol \ncombustível produzido por microdestilarias ou por cooperativas \nde pequenos produtores\
    \ rurais, assim definidos no âmbito do \nPrograma Nacional de Fortalecimento da Agricultura Familiar ¿ \nPronaf.¿ \nArt.\
    \ 5º O art. 3º da Lei nº 10.336, de 19 de setembro de 2001, \npassa a vigorar acrescido do seguinte parágrafo:\n3 \n \n\
    ¿Art. \n3º \n.......................................................................................... \n......................................................................................................\
    \ \n \n ¿§ 4º A Cide não incidirá sobre as receitas decorrentes da \ncomercialização \nde \netanol \ncombustível \nproduzido\
    \ \npor \nmicrodestilarias ou por cooperativas de pequenos produtores \nrurais, assim definidos no âmbito do Programa\
    \ Nacional de \nFortalecimento da Agricultura Familiar ¿ Pronaf.¿ \n...........................................................................................\
    \ ¿ (NR) \nArt. 6º As microdestilarias e as cooperativas de que trata esta \nLei somente poderão entrar em operação mediante\
    \ prévia autorização do \nórgão regulador, a quem compete, ainda, fiscalizar a produção, transporte, \ntransferência,\
    \ armazenagem, estocagem e comercialização, assim como \navaliar a conformidade e certificar a qualidade do produto. \n\
    Art. 7º Na implementação da política de incentivo às \nmicrodestilarias e às cooperativas de pequenos produtores de etanol,\
    \ cabe ao \npoder público: \nI \n- \napoiar \na \nimplantação \ne \no \ndesenvolvimento \nde \nmicrodestilarias de etanol\
    \ e fábricas de beneficiamento dos produtos derivados \nem regiões com vocação para a produção das matérias-primas; \n\
    II - criar oportunidades de renda e de trabalho para os projetos \nbeneficiados pelos assentamentos de reforma agrária;\
    \ \nIII - estimular atividades agropecuárias que utilizem os \nsubprodutos do beneficiamento das matérias-primas; \nIV\
    \ - estimular parcerias entre centros de pesquisa e extensão \nrural, com o objetivo de dotar tecnologicamente os empreendimentos\
    \ \nbeneficiados pela política de que trata esta Lei, aumentando a produtividade \nagrícola e a eficiência tecnológica;\n\
    4 \n \nV - criar mecanismos para viabilizar a comercialização dos \nprodutos derivados das matérias-primas e estimular\
    \ a produção do etanol \ncombustível para consumo dos cooperados, em caso de cooperativa, dos \nassociados, em caso de\
    \ associações, ou dos produtores rurais independentes; \nVI - criar linhas de crédito para financiar projetos de \nmicrodestilaria,\
    \ de cooperativas ou de unidades para beneficiamento dos \nprodutos derivados das matérias-primas; \nVII - articular as\
    \ políticas de incentivo às microdestilarias e às \ncooperativas com os programas de geração de emprego e renda, buscando\
    \ o \ndesenvolvimento regional integrado e sustentável; \nVIII - estimular a busca constante da qualidade dos produtos,\
    \ \npor meio de cursos de capacitação e organização empresarial; \nIX - criar campanhas de promoção dos produtos das \n\
    microdestilarias, das cooperativas e das fábricas de derivados das matérias-\nprimas, apoiando e estimulando a sua colocação\
    \ no mercado consumidor; \nX - estimular o cooperativismo e o associativismo; \nXI - buscar integração entre a produção\
    \ agrícola, o \nbeneficiamento e as práticas de conservação e sustentabilidade do meio \nambiente. \nArt. 8º São instrumentos\
    \ da política de incentivo às \nmicrodestilarias e às cooperativas de pequenos produtores de etanol: \nI - o crédito rural\
    \ e industrial; \nII - o incentivo fiscal e tributário; \nIII - a pesquisa agropecuária e tecnológica; \nIV - a extensão\
    \ rural e a assistência técnica; \nV - a promoção e a comercialização dos produtos; \nVI - o certificado de origem e qualidade\
    \ dos produtos \ndestinados à comercialização.\n5 \n \nArt. 9º Na gestão da política de incentivo às microdestilarias\
    \ e \nàs cooperativas de pequenos produtores de etanol serão observados: \nI - o planejamento e a coordenação das políticas\
    \ de incentivo; \n \nII - a definição da viabilidade técnica e econômica dos projetos; \nIII - o acompanhamento da execução\
    \ da política de que trata \nesta Lei; \nIV - o suporte técnico aos projetos, com a prestação de apoio à \nelaboração,\
    \ ao desenvolvimento, à execução e à operacionalização dos \nempreendimentos, por intermédio das empresas de pesquisa\
    \ agropecuária e \nde extensão rural; \nV - a busca de parcerias com outras entidades, públicas ou \nprivadas, para maximizar\
    \ a produção e a comercialização dos produtos; \nVI - a promoção de cursos de formação e capacitação gerencial \npara\
    \ os empreendedores, por meio de parcerias com centros tecnológicos, \nuniversidades, organizações não governamentais\
    \ e centros de formação; \nVII - a elaboração de cadastro das microdestilarias e das \ncooperativas; \nVIII - a manutenção\
    \ de cadastro atualizado das cooperativas e \ndas microdestilarias constituídas ou em constituição e das inovações propostas\
    \ \npara o segmento da produção agropecuária; \nIX - a viabilização de espaços públicos, em parceria com os \nEstados,\
    \ Municípios e a iniciativa privada, destinados à comercialização dos \nprodutos, para estimular a sua colocação no mercado\
    \ consumidor; \nX - o estímulo à integração das microdestilarias, por meio da \nconstituição de uma rede solidária, com\
    \ o intuito de ampliar negócios e a \ncriação de novas unidades; \nXI - a criação de selo de identificação para os produtos\
    \ \nderivados das cooperativas, das microdestilarias e das fábricas de\n6 \n \nbeneficiamento das matérias-primas, com\
    \ o objetivo de promover a \ncomercialização e garantir a qualidade dos produtos. \nArt. 10. Esta Lei entra em vigor após\
    \ decorridos cento e oitenta \ndias de sua publicação."
- source_sentence: "Acrescenta artigo à Lei nº 9.613, de 3 de março de 1998, obrigando a comprovação da origem lícita de valores\
    \ pagos a título de honorários advocatícios, e dá outras providências.\n\no congresso nacional decreta\n\nO CONGRESSO\
    \ NACIONAL decreta: \n \nArt. 1º Esta lei acrescenta artigo à Lei nº 9.613, de 3 de março de 1998, e dá \noutras providências.\
    \ \n \nArt. 2º A Lei nº 9.613, de 3 de março de 1998, passa vigorar acrescida do \nseguinte artigo: \n“Art. 6º-A. O réu\
    \ deverá comprovar ao juiz do processo a origem lícita dos \nvalores pagos a título de honorários advocatícios”. \n“Parágrafo\
    \ único. Havendo suspeita de fraude quanto à licitude da origem \ndos recursos financeiros de que trata este artigo, o\
    \ juiz, sem prejuízo de \neventual procedimento penal, comunicará a Ordem dos Advogados do Brasil \ne o Conselho previsto\
    \ no artigo 14 desta lei”. (AC) \nArt. 3º Esta Lei entra em vigor na data de sua publicação."
  sentences:
  - "Acrescenta parágrafo ao art. 263 do Decreto-Lei nº 3.689, de 3 de outubro de 1941, Código de Processo Penal, e ao art.\
    \ 180 do Decreto-Lei nº 2.848, de 7 de dezembro de 1940, Código Penal, estabelecendo que os acusados dos crimes que menciona\
    \ devem comprovar a origem lícita dos recursos financeiros necessários ao pagamento dos honorários de seus advogados.\n\
    \no congresso nacional decreta\n\nO CONGRESSO NACIONAL decreta: \n \nArt. 1 Acrescente-se § 2º ao art. 263 do Decreto-Lei\
    \ nº 3.689, de 3 de outubro de \n1941, Código de Processo Penal, com a seguinte redação, numerando-se o \nparágrafo único\
    \ como § 1º: \n \n“Art. 263 (...) \n \n(...) \n \n§ 2º Nos casos de crime organizado, lavagem de dinheiro, tráfico de\
    \ drogas, bem \ncomo os previstos na Lei nº 8.072, de 25 de julho de 1990, caberá ao acusado \ndemonstrar a origem lícita\
    \ dos recursos financeiros destinados ao pagamento dos \nhonorários de seus advogados.” \n \n \nArt. 2º Acrescente-se\
    \ § 7º ao art. 180 do Decreto-Lei nº 2.848, de 7 de dezembro \nde 1940, Código Penal, com a seguinte redação: \n \n“Art.\
    \ 180 (...) \n \n(...) \n \n§ 7º Aplica-se a pena do § 1º ao advogado que receber honorários sabendo que \nos recursos\
    \ necessários para pagá-los foram obtidos mediante a prática de crime \n 2 \norganizado, lavagem de dinheiro, tráfico\
    \ de drogas, bem como os previstos na Lei \nnº 8.072, de 25 de julho de 1990.” \n \nArt. 3º Esta Lei entra em vigor na\
    \ data de sua publicação."
