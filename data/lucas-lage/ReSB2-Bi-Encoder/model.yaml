    \  \n \n \n  \n \nArt. 1.º Esta Lei altera o Decreto-Lei nº 2.848, de 7 de \ndezembro de 1940 ¿ Código Penal brasileiro,\
    \ para instituir, como \nnova causa suspensiva da prescrição da pretensão punitiva do \nEstado, a calamidade pública devidamente\
    \ reconhecida pelo \nCongresso Nacional, restrita ao período do reconhecimento. \n \n  \n \nArt. 2.º. O artigo 116 do\
