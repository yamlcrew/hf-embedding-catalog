  - "Dispõe sobre a aplicação de multa administrativa ao agressor das vítimas de violência doméstica e familiar.\n\no congresso\
    \ nacional decreta\n\nO Congresso Nacional decreta:  \n \n \nArt. 1º Esta Lei dispõe sobre aplicação de multa administrativa\
    \ ao \nagressor das vítimas de violência doméstica e familiar.  \n \n \nParágrafo único. Os valores recolhidos são destinados\
    \ ao custeio de \npolíticas públicas voltadas à redução da violência doméstica e familiar.  \n \n \nArt. 2º Aquele que,\
    \ por ação ou omissão, der causa ao acionamento \ndo serviço público de emergência por conta de lesão, violência física,\
    \ sexual ou \npsicológica, dano moral ou patrimonial causado à mulher, será sancionado com \nmulta administrativa pelos\
    \ custos relativos aos serviços públicos prestados pela \nAdministração Pública para o atendimento às vítimas em situação\
    \ de violência \ndoméstica e familiar.  \n \n \nParágrafo único. Os valores recolhidos serão destinados ao custeio \n\
    de políticas públicas voltadas à redução da violência doméstica e familiar. \n \n \nArt. 3º Para efeitos dessa Lei, considera-se\
    \ violência doméstica e \nfamiliar aquela definida pela Lei Federal nº 11.340, de 7 de agosto de 2006.  \nPL n.4560/2019\n\
    Apresentação: 20/08/2019 10:59\nArt. 4º Para fins do disposto no art. 3º desta Lei, considera-se \nacionamento do serviço\
    \ público de emergência todo e qualquer deslocamento \npara prestar as seguintes assistência às vítimas, dentre outros:\
    \  \n \n \nI ¿ Serviço de atendimento móvel de urgência;  \n \n \nII ¿ Serviço de identificação e perícia, inclusive o\
    \ exame de corpo \nde delito;  \n \n \nIII ¿ Serviço de busca e salvamento;  \n \n \nIV ¿ Serviço de saúde emergencial;\
    \  \n \n \nV ¿ Serviço de atendimento psicológico.  \n§1º Após o atendimento à mulher vítima de violência, o órgão que\
    \ \ntiver feito o atendimento deverá apresentar relatório a partir do qual deve ser \naberto processo administrativo para:\
    \ \nI ¿ Identificar o agressor; \nII ¿ Estabelecer o contraditório e a ampla defesa; \nIII ¿ Definir o valor da multa\
    \ a ser paga. \n§1º O poder executivo irá regulamentar o procedimento \nadministrativo de que trata o §1º do art. 4º desta\
    \ Lei no prazo de120 dias após a \nsua publicação, devendo ser observados os seguintes critérios:  \nI ¿ As circunstâncias\
    \ e consequências do crime \nII ¿ A capacidade econômica do agente provocador da violência.  \n§2º A multa de que trata\
    \ o inciso III, do §1º, do art. 4º, desta Lei, \nserá majorada em 50% quando resultar em ofensa grave à integridade ou\
    \ a saúde \nfísica da vítima.  \n§3º A multa de que trata o inciso III, do §1º, do art. 4º, desta Lei, \nserá majorada\
    \ em 100% quando resultar em aborto ou morte da vítima.  \nPL n.4560/2019\nApresentação: 20/08/2019 10:59\nArt. 5º O Poder\
    \ Executivo deve elaborar relatório contendo o \nquantitativo anual de multas aplicadas por ocasião desta Lei, bem como\
    \ o valor \ndessas multas. \nParágrafo único. O relatório previsto no caput é publicado em sítio \neletrônico oficial\
    \ do governo do Distrito Federal. \nArt. 6º O termo inicial para a contagem do prazo prescricional \nrelativo à multa\
    \ administrativa é a data do último protocolo de atendimento \nrealizado pelo poder público. \nArt. 7º O Poder Executivo\
    \ regulamentará esta Lei em 120 (cento e \nvinte) dias. \nArt. 8º Esta lei entra em vigor na data de sua publicação."
- source_sentence: "Altera o Decreto-Lei nº 2.848, de 7 de dezembro de 1940 - Código Penal brasileiro, para instituir, como\
