      \ Nacional decreta:\nArt. 1° Altera a Lei nº 12.732, de 22 de novembro de 2012, para\nque os exames relacionados ao\
      \ diagnóstico de neoplasia maligna tenham seu\nresultado no prazo de 10 (dez) dias, no caso em que especifica:\n¿Art.2º.\
      \ .........................................................................................\n.\n.....................................................................................................\n\
      .\n    § 3º Nos casos em que a principal hipótese diagnóstica seja\na de neoplasia maligna, os exames necessários à\
