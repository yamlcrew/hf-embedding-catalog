  - source_sentence: "Modifica a Lei nº 8.069, de 13 de julho de 1990, para estabelecer o procedimento destinado à inscrição\
      \ de crianças e adolescentes nos cadastros estaduais e nacional de adoção.\n\no congresso nacional decreta\n\nO CONGRESSO\
      \ NACIONAL decreta: \nArt. 1º. Esta Lei modifica a Lei n° 8.069, de 13 e julho de \n1990, para estabelecer o procedimento\
      \ destinado à inscrição de crianças e \nadolescentes nos cadastros estaduais e nacional de adoção.  \nArt. 2º O Capítulo\
      \ III, do Título VI, da Lei n° 8.069, de 13 e \njulho de 1990, Estatuto da Criança e do Adolescente, passa a vigorar\
      \ acrescido \nda seguinte seção:  \nSeção IX \nDa Inscrição dos Adotáveis nos cadastros estaduais e \nnacional de adoção\
      \ \nArt. 197-F. A adoção pressupõe a decretação da perda do \npoder familiar, que poderá seguir o procedimento de \n\
      jurisdição voluntária se a mãe manifestar o interesse de \nentregar o filho para adoção.  \nArt. 197-G. As gestantes\
      \ que manifestem interesse em \nentregar seus filhos para adoção serão obrigatoriamente \nencaminhadas à Justiça da\
      \ Infância e da Juventude, a \nqual deverá entrevista-la, informá-la sobre a possibilidade\n2 \n \n     *703CFFD519*\
      \ \n     703CFFD519 \nde recebimento de alimentos gravídicos e a inclusão em \nprogramas oficiais de orientação, apoio\
      \ e promoção \nsocial.  \nParágrafo único. Considerado o caso, a Justiça da \nInfância e da Juventude poderá realizar\
      \ o mapeamento da \nfamília extensa antes do parto.  \nArt. 197-H. A Defensoria Pública, preferencialmente, ou o \n\
      Ministério Público poderão conferir assistência jurídica \ndurante o procedimento de jurisdição voluntária, podendo\
      \ \nrequerer a intimação de interessados.  \nArt. 197-I. A inscrição da criança e do adolescente nos \ncadastros estaduais\
      \ e nacional de adoção poderá ocorrer \nem tutela antecipada se:  \nI ¿ após tentativa de localizar os genitores ou\
      \ parentes \npróximos, a citação ocorrer por edital; \nII ¿ restar evidente à impossibilidade de reintegração da \n\
      criança ou do adolescente à família de origem. \n \nArt. 3º Esta lei entra em vigor na data da publicação."
    sentences:
    - "Acrescenta-se o art. 50-A e 50-B a Lei nº 8.069, de 1990 (Estatuto da Criança e Adolescente), a fim de estabelecer\
      \ prazo para realização de exames psicossociais e dá outras providências.\n\no congresso nacional decreta\n\nO Congresso\
      \ Nacional decreta: \n \nArt. 1º A Lei nº 8.069, de 1990, passa a vigorar acrescida dos seguintes \nartigos: \n \nArt.\
      \ 50-A Os exames psicossociais ou quaisquer \noutras espécies de exames técnicos exigidos por esta lei ou por \ndeterminação\
      \ judicial, deverão obedecer o prazo de até 30 dias para \nsua realização. \nArt. 50-B Na ausência de servidores públicos\
      \ \nintegrantes do Poder Judiciário responsáveis pela realização dos \nexames, poderá o magistrado proceder a nomeação\
      \ de pessoa idônea, \nportadora de diploma de curso superior preferencialmente na área \nespecífica, dentre as que tiverem\
      \ habilitação técnica relacionada com a \nnatureza do exame. \n \nArt. 2º Esta Lei entra em vigor na data de sua publicação."
