      \ decreta: \nArt. 1º Esta lei altera o Decreto-lei n° 2.848, de 7 de dezembro de 1940, o Código Penal\nBrasileiro, para\
      \ inserir a superveniência de estado de calamidade pública em âmbito federal\nmotivado por razões de saúde pública como\
      \ uma nova causa de suspensão da prescrição das\npretensões punitiva e executória do Estado.\n \nArt. 2º O Decreto-lei\
      \ N° 2.848, de 7 de dezembro de 1940, o Código Penal Brasileiro, passa a\nvigorar acrescido do seguinte artigo:\n¿Art.\
      \ 116-A. A prescrição da pretensão punitiva e executória do Estado não corre enquanto\npersistir, em âmbito federal,\
      \ estado de calamidade pública motivado pelo reconhecimento de\nsurto, epidemia, pandemia ou outra questão de saúde\
      \ pública. ¿ (NR)\nArt. 3º Esta lei entra em vigor na data de sua publicação.\n1/4\n*CD207329314900*\nDocumento eletrônico\
      \ assinado por Guilherme Derrite (PP/SP), através do ponto SDR_56344,\nna forma do art. 102, § 1º, do RICD c/c o art.\
      \ 2º, do Ato\nda Mesa n. 80 de 2016.\nPL n.2684/2020\nApresentação: 14/05/2020 19:02"
  - source_sentence: "Dispõe sobre o direito à identidade de gênero.\n\no congresso nacional decreta\n\nO Congresso Nacional\
      \ decreta: \nArt. 1.º. Esta Lei dispõe sobre o reconhecimento de identidade de \ngênero. \nArt. 2.º. Toda pessoa tem\
      \ direito: \nI ¿ ao reconhecimento de sua identidade de gênero; \nII ¿ ao livre desenvolvimento de sua pessoa de acordo\
      \ com tal \nidentidade; \nIII ¿ de ser tratada de acordo com sua identidade de gênero e de \nser identificada de acordo\
      \ com ela. \nArt. 3.º. Entende-se por identidade de gênero a vivência interna e \nindividual do gênero tal como cada\
      \ pessoa a sente, seja correspondente ou não ao \nsexo biológico, o que pode incluir a vivência pessoal, a modificação\
      \ da aparência do \ncorpo e das funções corporais por meio farmacológicos ou cirúrgicos, por livre escolha \nda pessoa,\
      \ além de aspectos relativos à vestimenta, aos modos à fala. \nArt. 4.º. Toda pessoa maior de dezoito anos poderá requerer\
      \ a \nretificação de seus registros para alterações relativas ao nome, ao sexo e à imagem, \nquando não coincidam com\
      \ sua autodefinição de identidade de gênero. \nArt. 5.º. Os menores de dezoito anos somente poderão requerer a \nretificação\
      \ a que se refere o art. 4.º desta Lei com o seu consentimento e a expressa \nautorização dos pais ou representantes\
      \ legais. \nArt. 6.º A retificação de registros não modificará a titularidade dos \ndireitos e obrigações correspondentes\
      \  ao requerente anteriormente à averbação das\nCÂMARA DOS DEPUTADOS \n \n \n \nalterações registrais, nem as de direito\
      \ de família, incluída a adoção, que se manterão \ninalteradas. \nArt. 7.º. Os procedimentos relativos ao reconhecimento\
      \ de \nidentidade de gênero serão sigilosos e as ações judiciais dele decorrentes tramitarão \nem segredo de justiça\
      \ e em regime prioritário. \nArt. 8.º. Toda pessoa maior de dezoito anos poderá se submeter \na intervenções cirúrgicas\
      \ totais ou parciais e a tratamentos hormonais para adequação \ndo corpo à sua identidade de gênero, sem necessidade\
      \ de autorização judicial. \nArt. 9. Os tratamentos e intervenções cirúrgicas decorrentes do \nreconhecimento da identidade\
      \ de gênero serão obrigatoriamente realizados pelo \nSistema Único de Saúde ¿SUS. \nArt. 10. Esta Lei entre em vigor\
      \ na data de sua publicação."
    sentences:
    - "Altera a redação da Consolidação das Leis do Trabalho - CLT, aprovada pelo Decreto-Lei n.º 5.452/1943, para garantir\
      \ estabilidade provisória ao trabalhador cuja esposa ou companheira gestante esteja desempregada.\n\no congresso nacional\
      \ decreta\n\nO Congresso Nacional decreta: \n \nArt. 1º A Consolidação das Leis do Trabalho ¿ CLT, \naprovada pelo Decreto-Lei\
      \ n.º 5.452, de 1º de maio de 1943, passa a vigorar \nacrescida do seguinte artigo: \n \nArt. 392-D Fica assegurado\
      \ ao trabalhador, cuja esposa \nou companheira gestante esteja desempregada, estabilidade provisória no \nemprego, desde\
      \ a comprovação da concepção até cinco meses após o parto. \n  \n Art. 2º Esta lei entra em vigor na data de sua publicação.\n\
      CÂMARA DOS DEPUTADOS \n \n \n2"
    - 'Projeto de Lei nº Dispõe sobre a instalação de sanitários nos postos de pedágio das rodovias estaduais. A Assembleia
      Legislativa do Estado de Minas Gerais decreta: Art. 1º – A concessionária da administração ou exploração de rodovia
      estadual privatizada fica obrigada a disponibilizar gratuitamente ao usuário instalações sanitárias nos postos de pedágio,
      nos dois sentidos da rodovia. § 1º – Os sanitários de que trata o caput deverão ser instalados em caráter permanente
      e adequados à legislação vigente, inclusive no que se refere à acessibilidade dos portadores de necessidades especiais.
      Art. 2º – O disposto nesta lei não se aplica aos contratos firmados até a data da publicação desta lei. Art. 3º – Esta
      lei entra em vigor na data de sua publicação. Sala das Reuniões, 1º de fevereiro de 2019. Deputado Noraldino Júnior
      (PSC)'
    - "Dispõe sobre o direito à autodeterminação da identidade de gênero e expressão de gênero e à proteção das características\
      \ sexuais de cada pessoa, e dá outras providências.\n\no congresso nacional decreta\n\nO Congresso Nacional decreta:\n\
      CAPÍTULO I\nDisposições gerais\nObjeto\nArt. 1º A presente Lei estabelece o direito à autodeterminação\nda identidade\
      \ de gênero e expressão de gênero e o direito à proteção das\ncaracterísticas sexuais de cada pessoa.\nProibição de\
      \ discriminação\nArt. 2º Todas as pessoas são livres e iguais em dignidade e\ndireitos, sendo proibida qualquer discriminação,\
      \ direta ou indireta, em função\ndo exercício do direito à identidade de gênero e expressão de gênero e do\ndireito\
      \ à proteção das características sexuais.\nArt. 3º Incumbe às entidades privadas o dever de cumprir a\npresente Lei\
      \ e às entidades públicas o dever de garantir o seu cumprimento e\npromover, no âmbito das suas competências, as condições\
      \ necessárias para o\nexercício efetivo do direito à autodeterminação da identidade de gênero e\nexpressão de gênero\
      \ e do direito à proteção das características sexuais de\ncada pessoa.\n*CD216102070700*\nAssinado eletronicamente pelo(a)\
      \ Dep. Erika Kokay\nPara verificar a assinatura, acesse https://infoleg-autenticidade-assinatura.camara.leg.br/CD216102070700\n\
      PL n.3213/2021\nApresentação: 20/09/2021 09:45 - Mesa\n2\nAutodeterminação da identidade de gênero e expressão de gênero\n\
      Art. 4º O exercício do direito à autodeterminação da identidade\nde  gênero  e  expressão  de  gênero  de  uma  pessoa\
      \  é  assegurado,\nconcretamente, mediante o livre desenvolvimento da respectiva personalidade\nde acordo com a sua\
      \ identidade e expressão de gênero.\nArt.  5º  Quando,  para  a  prática  de  um  determinado  ato  ou\nprocedimento,\
      \  se  torne  necessário  indicar  dados  de  um  documento  de\nidentificação que não corresponda à identidade de gênero\
      \ de uma pessoa, esta\nou os seus representantes legais podem solicitar que essa indicação passe a\nser realizada mediante\
      \ a inscrição das iniciais do prenome que consta no\ndocumento  de  identificação,  precedido  do nome  social  adotado\
      \  face  à\nidentidade  de  gênero  manifestada,  seguido  do  sobrenome  completo  e  do\nnúmero do documento de identificação.\n\
      \                         Art. 6° Nome Social é o nome com o qual a pessoa transgênera\nse identifica e se apresenta\
      \ socialmente, nome este que lhe representa, tendo\nem vista que o nome de registro que lhe foi atribuído ao nascimento\
      \ não está\nem consonância com sua identidade de gênero. \n                        Parágrafo único. À pessoa maior de\
      \ 18 anos é facultada a\nretificação do prenome em cartório de registro civil.\nProteção das características sexuais\n\
      Art.  7º  Todas  as  pessoas  têm  direito  a  manter  as\ncaracterísticas sexuais primárias e secundárias.\nModificações\
      \ corporais e das características sexuais da criança ou\nadolescente intersexo\nArt. 8º Salvo em situações de comprovado\
      \ risco para a sua\nsaúde, os tratamentos e as intervenções cirúrgicas, farmacológicas ou de outra\nnatureza que impliquem\
      \ modificações corporais e das características sexuais\nda criança ou adolescente intersexo não devem ser realizados\
      \ até o momento\nem que se manifeste a sua identidade de gênero, exceto quando for constatado\nrisco iminente à vida\
      \ ou saúde da pessoa, comprovado em caráter definitivo\ncomo último recurso e com registros médicos explicando a necessidade\
      \ da\n*CD216102070700*\nAssinado eletronicamente pelo(a) Dep. Erika Kokay\nPara verificar a assinatura, acesse https://infoleg-autenticidade-assinatura.camara.leg.br/CD216102070700\n\
      PL n.3213/2021\nApresentação: 20/09/2021 09:45 - Mesa\n3\nintervenção por especialistas e com a devida autorização expressa\
      \ dos pais ou\nresponsáveis.\nCAPÍTULO II\nReconhecimento jurídico da identidade de gênero\nProcedimento\nArt.  9º \
      \ O  reconhecimento  jurídico  da  identidade  de  gênero\npressupõe a abertura de um procedimento para alteração do\
      \ prenome e/ou da\nmudança  da  menção  do  sexo  no  registro  civil,  ou  de  ambos,  mediante\nrequerimento.\nArt.\
      \ 10 O procedimento referido no art. 8º tem natureza sigilosa\ne a informação a seu respeito não pode constar nas certidões\
      \ dos assentos ou\nse tornarem de acesso público, salvo a pedido da pessoa requerente ou por\ndecisão judicial.\nArt.\
      \ 11. A mudança da menção do sexo no registro civil e/ou\nalteração de prenome realizadas nos termos da presente Lei\
      \ só podem ser\nobjeto de novo requerimento mediante autorização judicial.\nArt. 12. A decisão final sobre a identidade\
      \ de gênero de uma\npessoa, proferida por uma autoridade ou tribunal estrangeiro, de acordo com a\nlegislação desse\
      \ país, é reconhecida nos termos da lei.\nLegitimidade\nArt. 13. Têm legitimidade para requerer o procedimento de\n\
      mudança da  menção do sexo no registro civil e/ou alteração de prenome as\npessoas de nacionalidade brasileira, maiores\
      \ de idade e que não se mostrem\ninterditas ou inabilitadas por questões de saúde mental que comprometam a\nauto identificação\
      \ de gênero, cuja identidade de gênero não corresponda ao\nsexo atribuído ao nascimento, ou seu responsável legal.\n\
      Parágrafo único: Pessoas de nacionalidade brasileira, maiores\nde 18 anos, que não se mostrem interditas ou incapacitadas,\
      \ residindo fora do\n*CD216102070700*\nAssinado eletronicamente pelo(a) Dep. Erika Kokay\nPara verificar a assinatura,\
      \ acesse https://infoleg-autenticidade-assinatura.camara.leg.br/CD216102070700\nPL n.3213/2021\nApresentação: 20/09/2021\
      \ 09:45 - Mesa\n4\npaís, podem solicitar a alteração nos termos desta lei, desde que constituído\nrepresentante legal.\n\
      Art. 14. As pessoas de  nacionalidade brasileira e com idade\ncompreendida entre os dezesseis (16) e os dezoito (18)\
      \ anos podem requerer o\nprocedimento  de  mudança  da  menção  do  sexo  no  registro  civil  e  da\nconsequente alteração\
      \ de prenome, através dos seus representantes legais,\nassinando conjuntamente o pedido, devendo o oficial de registro\
      \ proceder à\noitiva  presencial  do  requerente,  de  modo  a  apurar  o  seu  consentimento\nexpresso, livre e esclarecido,\
      \ tendo sempre em consideração os princípios da\nautonomia progressiva.\nArt. 15. A pessoa intersexo pode requerer o\
      \ procedimento de\nmudança da menção de sexo no registro civil e/ou  alteração de prenome a\npartir do momento que manifeste\
      \ a respectiva identidade de gênero.\nRequerimento\nArt. 16. O procedimento de mudança da menção do sexo no\nregistro\
      \  civil  e/ou  alteração  de  prenome  tem início  mediante  requerimento\napresentado em qualquer ofício do registro\
      \ civil, com indicação do número de\nidentificação  civil  e  do  prenome  pelo  qual  a  pessoa  pretende  vir  a \
      \ ser\nidentificada, podendo, desde logo, ser solicitada a realização de novo assento\nde nascimento, no qual não pode\
      \ ser feita qualquer menção à alteração do\nregistro.\nDecisão\nArt. 17. No prazo máximo de oito (8) dias úteis a contar\
      \ da data\nde apresentação do requerimento, verificados os requisitos de legitimidade, o\noficial realizará o respectivo\
      \ averbamento, nos termos legais.\n§ 1º. Finalizado o procedimento de alteração de registro de\nnascimento, o oficial\
      \ registrador deverá providenciar, de ofício, a alteração nos\ndemais registros que digam respeito direta ou indiretamente\
      \ à identificação da\npessoa  requerente,  além de  seus documentos pessoais,  e comunicar aos\ndemais órgãos e  cadastros\
      \ públicos as retificações de  registro  realizadas,\nobservado o sigilo a que se refere o artigo 10.\n*CD216102070700*\n\
      Assinado eletronicamente pelo(a) Dep. Erika Kokay\nPara verificar a assinatura, acesse https://infoleg-autenticidade-assinatura.camara.leg.br/CD216102070700\n\
      PL n.3213/2021\nApresentação: 20/09/2021 09:45 - Mesa\n5\n§ 2º. A subsequente averbação da alteração do prenome e/ou\n\
      gênero no registro de nascimento dos filhos e netos da pessoa requerente não\ndependerá  da  anuência  do  cônjuge,\
      \  dos  filhos,  se  maiores,  e  dos  pais,\nrespectivamente, tendo em vista o princípio da continuidade registral.\n\
      Art. 18. Nenhuma pessoa será obrigada a fazer prova de sua\nidentidade  de  gênero  ou  nem  será  submetida  a  quaisquer\
      \  procedimentos\nmédicos,  incluindo  cirurgia  de  redesignação  sexual,  esterilização  ou\nhormonização, assim como\
      \ a tratamentos psicológicos e/ou psiquiátricos, como\nrequisito que sirva de base à decisão referida no art. 17.\n\
      Art. 19. Da decisão  desfavorável à mudança da menção do\nsexo no registro civil e/ou alteração de prenome ou do não\
      \ cumprimento dos\nprazos desta  Lei  cabe  recurso, nos termos da  Lei  de  Registros Públicos,\ndevendo  ser  informada\
      \  imediatamente  por  escrito  diretamente  à  pessoa\nsolicitante o motivo da decisão.\nEfeitos\nArt. 20. A mudança\
      \ da menção do sexo no registro civil e/ou\nalteração de prenome efetuada nos termos da presente lei não afeta nem altera\n\
      os  direitos  constituídos  e  as  obrigações  jurídicas  assumidas  antes  do\nreconhecimento jurídico da identidade\
      \ de gênero.\nArt.  21.  As  pessoas  que  tenham procedido  à  mudança  da\nmenção do sexo no registro civil e/ou alteração\
      \ de prenome passam, desse\nmodo, a ser reconhecidas nos documentos de identificação com o nome e sexo\nneles  constantes,\
      \  gozando  dos  mesmos  direitos  das  demais  pessoas  em\nqualquer esfera, sem nenhum tipo de discriminação.\nArt.\
      \ 22.  Das pessoas reconhecidamente hipossuficientes não\nserão cobrados emolumentos pelo registro civil de nascimento\
      \ e pelo assento\nde óbito e respectivas certidões, bem como a confecção de outros documentos\nnecessários para efeitos\
      \ da vida civil.\nParágrafo \núnico: \nO  estado  de  hipossuficiência  será\ncomprovado por declaração do próprio interessado\
      \ ou a rogo, em se tratando\nde analfabeto, neste caso acompanhada da assinatura de duas testemunhas.\n*CD216102070700*\n\
      Assinado eletronicamente pelo(a) Dep. Erika Kokay\nPara verificar a assinatura, acesse https://infoleg-autenticidade-assinatura.camara.leg.br/CD216102070700\n\
      PL n.3213/2021\nApresentação: 20/09/2021 09:45 - Mesa\n6\n \nCAPÍTULO III\nMedidas de proteção\n                   \
      \     Art. 23. Será assegurado o reconhecimento do nome\nsocial  em  consonância  à  identidade  de  gênero  de  pessoas\
      \  trans  e\ntravestis nas lápides de túmulos, jazigos, laudos, certidões de óbito e\noutros documentos, devendo esse\
      \ direito ser garantido mesmo quando o\nnome registrado em documentos de identidade civil (RG, Certidão de\nNascimento)\
      \ for divergente, devendo igualmente ser respeitada/preservada\na sua autodeclaração de gênero e a sua identidade de\
      \ gênero, bem como seu\nnome retificado, independe da vontade ou desejo de terceiros.\nSaúde\nArt. 24. O Poder Público\
      \ deve garantir, a quem o solicitar, a\nexistência e o acesso a serviços de referência ou unidades especializadas no\n\
      Sistema Único de Saúde, especificamente  para tratamentos e intervenções\ncirúrgicas,  farmacológicas  ou  de  outra\
      \  natureza,  destinadas  a  fazer\ncorresponder o corpo à sua identidade de gênero.\nArt. 25. Caberá ao Poder Público,\
      \ no prazo máximo de 270\n(duzentos e setenta) dias estabelecer um modelo de intervenção, através de\norientações e\
      \ normas técnicas, a ser implementado  pelos profissionais de\nsaúde no âmbito das questões relacionadas com a identidade\
      \ de gênero,\nexpressão de gênero e características sexuais das pessoas.\nEducação e ensino\nArt. 26. O Poder Público\
      \ deve garantir a adoção de medidas no\nsistema educativo, em todos os níveis de ensino e ciclos de estudo, que\npromovam\
      \ o exercício do direito à autodeterminação da identidade de gênero e\nexpressão de gênero e do direito à proteção das\
      \ características sexuais das\npessoas, nomeadamente através do desenvolvimento de:\n*CD216102070700*\nAssinado eletronicamente\
      \ pelo(a) Dep. Erika Kokay\nPara verificar a assinatura, acesse https://infoleg-autenticidade-assinatura.camara.leg.br/CD216102070700\n\
      PL n.3213/2021\nApresentação: 20/09/2021 09:45 - Mesa\n7\nI - Medidas de  prevenção e de combate à discriminação em\n\
      função da identidade de gênero, expressão de gênero e das características\nsexuais;\nII - Mecanismos de detecção e intervenção\
      \ sobre situações de\nrisco que coloquem em perigo o saudável desenvolvimento de crianças e\njovens que manifestem identidade\
      \ de gênero ou expressão de gênero e que\nnão se identificam com o sexo atribuído ao nascimento;\nIII - Condições para\
      \ a proteção adequada da identidade de\ngênero, expressão de gênero e das características  sexuais, contra todas as\n\
      formas de exclusão social e violência dentro do contexto escolar, assegurando\no respeito pela autonomia, privacidade\
      \ e autodeterminação das crianças e\njovens que realizem transições sociais de identidade e expressão de gênero;\nIV\
      \  -  Formação  adequada  dirigida  a  docentes  e  demais\nprofissionais do sistema educativo no âmbito de questões\
      \ relacionadas com a\ndiversidade de identidade de gênero, expressão de gênero e da diversidade\ndas características\
      \ sexuais de crianças e jovens, tendo em vista a sua inclusão\ncomo processo de integração socioeducativa.\nArt.  27.\
      \  Os  estabelecimentos  do  sistema  educativo,\nindependentemente da sua natureza pública ou privada, devem garantir\
      \ que\nnão haja discriminação em função de identidade de gênero. \nArt. 28. Cabe aos órgãos do Poder Público responsáveis\
      \ pelas\náreas da igualdade de gênero e da educação, no prazo máximo de cento e\noitenta (180) dias, estabelecer as\
      \ medidas necessárias para a implementação\ndo disposto nos arts. 24 e 25.\nCAPÍTULO IV\nMeios de defesa\nResolução\
      \ alternativa de litígios\nArt. 29. Sem prejuízo do recurso à via judicial, as partes podem\nsubmeter os litígios emergentes\
      \ da presente Lei a mecanismos de resolução\nalternativa de litígios, nos termos da lei.\n*CD216102070700*\nAssinado\
      \ eletronicamente pelo(a) Dep. Erika Kokay\nPara verificar a assinatura, acesse https://infoleg-autenticidade-assinatura.camara.leg.br/CD216102070700\n\
      PL n.3213/2021\nApresentação: 20/09/2021 09:45 - Mesa\n8\nResponsabilidade\nArt. 30. A prática de qualquer ato discriminatório,\
      \ por ação ou\nomissão, confere à pessoa lesada o direito a uma indenização, por danos\npatrimoniais  e  não  patrimoniais,\
      \  a  título  de  responsabilidade  civil\nextracontratual, nos termos do Código Civil.\nParágrafo  único.  Na  fixação\
      \  da  indenização,  o  juiz  deve\natender ao grau de violação dos interesses em causa, ao poder econômico dos\nautores\
      \ do ilícito e às condições da pessoa alvo da prática discriminatória.\nProteção contra atos de retaliação\nArt.  31.\
      \  É  nulo  o  ato  de  retaliação  que  corresponda  a\ntratamento que tenha como propósito lesar ou desfavorecer qualquer\
      \ pessoa,\nadotado em razão de reclamação, queixa, denúncia ou ação contra o autor\ndesse ato, em defesa do direito\
      \ à autodeterminação da identidade de gênero e\nexpressão de gênero e do direito à proteção das características sexuais\
      \ de\ncada pessoa, nos termos da presente Lei.\nViolência contra a Mulher\nArt. 32. A Lei nº 11.340, de 7 de agosto\
      \ de 2006, e a Lei nº\n13.104, de 9 de março de 2015, aplicam-se às pessoas transgêneras que se\nidentificam com o gênero\
      \ feminino.\nDireitos processuais das associações e organizações não-\ngovernamentais\nArt. 33. É reconhecida às associações\
      \ e organizações não-\ngovernamentais, cujo objeto estatutário se destine essencialmente à defesa e\npromoção do direito\
      \ à autodeterminação da identidade de gênero e expressão\nde gênero e do direito à proteção das características sexuais\
      \ de cada pessoa,\nlegitimidade processual para a defesa dos direitos e interesses coletivos e para\na defesa coletiva\
      \ dos direitos e interesses individuais legalmente protegidos\ndas pessoas associadas, bem como para a defesa dos valores\
      \ protegidos pela\npresente Lei.\n*CD216102070700*\nAssinado eletronicamente pelo(a) Dep. Erika Kokay\nPara verificar\
      \ a assinatura, acesse https://infoleg-autenticidade-assinatura.camara.leg.br/CD216102070700\nPL n.3213/2021\nApresentação:\
