    \ \n.............................................................................................. \nV - enquanto persistir\
    \ estado de calamidade pública devidamente \nreconhecido pelo Congresso Nacional. \n............................................................................................¿\
    \ (NR) \n    \nArt. 3.º Esta lei entra em vigor na data de sua publicação."
  sentences:
  - 'PROJETO DE LEI Nº Dispõe sobre a comunicação eletrônica de compra e venda e de desaparecimento de veículos automotores
    ao Departamento de Trânsito de Minas Gerais – Detran-MG – pelos tabelionatos de notas e dá outras providências. A Assembleia
    Legislativa do Estado de Minas Gerais decreta: Art. 1º – Ficam os tabelionatos de notas autorizados a proceder à comunicação
    eletrônica de venda de veículos automotores ao Departamento de Trânsito de Minas Gerais – Detran-MG – quando da realização
    do último reconhecimento de firma no Documento Único de Transferência – DUT. § 1º – Não se aplica a obrigatoriedade prevista
    neste artigo quando o antigo proprietário do veículo manifestar que realizará a obrigação diretamente no Detran-MG; §
    2º – A comunicação consistirá na inclusão dos dados do comprador e do vendedor e dos dados do veículo automotor. Art.
    2º – Ficam os tabelionatos de notas autorizados a elaborar a comunicação de desaparecimento do veículo há mais de cinco
    anos, via comunicação eletrônica, ao Detran-MG. § 1º – Em relação à comunicação eletrônica de desaparecimento de veículo,
    o Detran-MG poderá, por meio de portaria, disciplinar a metodologia de procedimento do proprietário comunicante. § 2º
    – O proprietário do veículo automotor somente poderá comunicar o desaparecimento depois de quitar todos os débitos incidentes
    sobre o veículo. Art. 3º – O Detran-MG deverá adequar seu sistema de registro de veículo para integrar o sistema de comunicação
    eletrônica de compra e venda e de desaparecimento de veículos. Art. 4º – Para o disposto nos artigos acima, o tabelião
    de notas elaborará escritura pública, e será cobrado o menor valor descrito na letra “b” do item 4 da tabela 1 dos atos
    do tabelião de notas da Lei nº 15.424, de 2004, independentemente do valor do veículo. Art. 5º – Caberá à Associação dos
    Notários e Registradores de Minas Gerais – Anoreg-MG – gerir o sistema de comunicação eletrônica, tomando, para tanto,
    as medidas necessárias perante os tabelionatos de notas. Art. 6º – Esta lei entra em vigor na data de sua publicação.
    Sala das Reuniões, 5 de agosto de 2015. Roberto Andrade'
