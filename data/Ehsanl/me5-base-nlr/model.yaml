  - 'passage: Het Gerecht is bevoegd samenhangende beroepschriften te voegen en gevoegde beroepschriften te splitsen.'
  - 'passage: 1. Het recht om ter bescherming van een collectief merk in rechte op te treden komt uitsluitend toe aan de houder
