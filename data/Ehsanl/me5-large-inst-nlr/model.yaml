widgetData:
- source_sentence: 'Instruct: Given a Dutch legal query, retrieve relevant articles that help answer the query.

    Query: Mag de rechter schadevergoeding toewijzen onder Rv voordat er een conclusie van antwoord is ingediend?'
  sentences:
  - De schuldenaar wordt veroordeeld de vastgestelde schade te voldoen. Op verlangen van de schuldeiser kan de rechter de
    schadeposten afzonderlijk toewijzen, zodra zij zijn komen vast te staan.
  - '1. In geval van verandering van nationaliteit is het recht van de staat van de nieuwe nationaliteit van toepassing, daaronder
    begrepen de regels van dat recht betreffende de gevolgen van de nationaliteitsverandering voor de naam.

    2. De verkrijging van de Nederlandse nationaliteit door een vreemdeling brengt geen wijziging in diens geslachtsnaam en
    voornamen, behoudensartikel 25, onder b, van dit Boek en de artikelen 6 lid 5 en 12 van de Rijkswet op het Nederlanderschap.'
  - '1. Het aanslaan der biljetten moet geschieden na de inartikel 449bedoelde betekening en tenminste vier dagen vóór de
    verkoop, tenzij die termijn door de voorzieningenrechter van de rechtbank ten verzoeke van de meest gerede partij is verkort.

    2. Tegen een beschikking krachtens het vorige lid is geen hogere voorziening toegelaten.'
  - De schuldenaar wordt veroordeeld de vastgestelde schade te voldoen. Op verlangen van de schuldeiser kan de rechter de
    schadeposten afzonderlijk toewijzen, zodra zij zijn komen vast te staan.
  - '1. De betrokkene dan wel de voorzitter van het bedrijfslichaam kan binnen zes weken na de verzending van de uitspraak
    van het tuchtgerecht hoger beroep instellen bij het College, tenzij tegen die uitspraak verzet kan of kon worden gedaan.

    2. De voorzitter van het bedrijfslichaam kan voorts hoger beroep instellen tegen een uitspraak bij verstek, tenzij de
    betrokkene verzet doet. Het hoger beroep kan worden ingesteld binnen zes weken nadat de termijn voor het doen van verzet
    ongebruikt is verstreken.'
  - '1. Zolang de rechter nog niet heeft medegedeeld binnen welke termijn hij eindvonnis zal wijzen, is de eiser bevoegd zijn
    eis of de gronden daarvan schriftelijk, bij conclusie of akte, te veranderen of te vermeerderen. De verweerder is bevoegd
    hiertegen bezwaar te maken, op grond dat de verandering of vermeerdering in strijd is met de eisen van een goede procesorde.
    De rechter beslist, partijen gehoord, zo spoedig mogelijk. De rechter kan op dezelfde grond ook ambtshalve een verandering
    of vermeerdering van eis buiten beschouwing laten.

    2. Tegen de beslissingen van de rechter, bedoeld in het eerste lid, staat geen hogere voorziening open.

    3. Indien een partij niet in het geding is verschenen, is een verandering of vermeerdering van eis tegen die partij uitgesloten,
    tenzij de eiser de verandering of vermeerdering tijdig bij exploot aan haar kenbaar heeft gemaakt. In laatstgenoemd geval
    isartikel 120, derde lid, van overeenkomstige toepassing.'
  - De beslissingen van de Hoge Raad genoemd in deartikelen 465,470 tot en met 473worden zodra mogelijk vanwege de procureur-generaal
    aan de belanghebbende schriftelijk medegedeeld en in afschrift toegezonden aan Onze Minister die is belast met de tenuitvoerlegging
    van de onherroepelijke uitspraak waarvan de herziening is gevraagd, of van het vernietigde arrest of vonnis.
  - De aannemer is bij het aangaan of het uitvoeren van de overeenkomst verplicht de opdrachtgever te waarschuwen voor onjuistheden
    in de opdracht voor zover hij deze kende of redelijkerwijs behoorde te kennen. Hetzelfde geldt in geval van gebreken en
    ongeschiktheid van zaken afkomstig van de opdrachtgever, daaronder begrepen de grond waarop de opdrachtgever een werk
    laat uitvoeren, alsmede fouten of gebreken in door de opdrachtgever verstrekte plannen, tekeningen, berekeningen, bestekken
    of uitvoeringsvoorschriften.
  - De schuldeiser kan in de schadestaat ook vereffening van de schade in andere vorm dan betaling van een geldsom vorderen.
- source_sentence: 'Instruct: Given a Dutch legal query, retrieve relevant articles that help answer the query.

    Query: Verbreking samenwoning. Vordering tot verdeling van vermogen. Geen (beperkte) gemeenschap van goederen tussen partijen
    overeengekomen.'
  sentences:
  - '1. Gemeenschap is aanwezig, wanneer een of meer goederen toebehoren aan twee of meer deelgenoten gezamenlijk.

    2. De aandelen van de deelgenoten zijn gelijk, tenzij uit hun rechtsverhouding anders voortvloeit.

    3. Op de rechtsbetrekkingen tussen de deelgenoten is artikel 2 van Boek 6 van overeenkomstige toepassing.'
  - Gedurende de vereffening zijn van titel 7 van Boek 3 slechts van toepassing de artikelen 166, 167, 169, 170 lid 1 en 194
    lid 2.
  - '1. De gedwongen ontruiming geschiedt door een deurwaarder.

    2. Deze kan zich doen bijstaan door een of twee getuigen, wier naam en woonplaats hij in dat geval in zijn proces-verbaal
    zal vermelden en die dit stuk mede zullen tekenen.'
  - '1. Het is verboden luchtverkeersdienstverlening te geven dan wel een grondstation of een mobiel station als bedoeld inartikel
    5.17te bedienen, terwijl degene, die luchtverkeersdienstverlening geeft dan wel een grondstation of een mobiel station
    bedient, verkeert onder zodanige invloed van een stof, waarvan hij weet of redelijkerwijze moet weten, dat het gebruik
    daarvan – al dan niet in combinatie met het gebruik van een andere stof – de vaardigheid voor het geven van luchtverkeersdienstverlening
    of het bedienen van een grondstation kan verminderen, dat hij niet in staat moet worden geacht zulks naar behoren te verrichten.

    2. De artikelen 2.12, derde, vierde en vijfde lid, en2.13zijn van overeenkomstige toepassing.'
  - '1. Schuldeiser en schuldenaar zijn verplicht zich jegens elkaar te gedragen overeenkomstig de eisen van redelijkheid
    en billijkheid.

    2. Een tussen hen krachtens wet, gewoonte of rechtshandeling geldende regel is niet van toepassing, voor zover dit in
    de gegeven omstandigheden naar maatstaven van redelijkheid en billijkheid onaanvaardbaar zou zijn.'
  - '1. Indien de tot uitreiking bevoegde persoon twijfelt aan de identiteit van de aanvrager worden de vingerafdrukken van
    de aanvrager geverifieerd tegen de vingerafdrukken die in het uit te reiken reisdocument zijn opgenomen.

    2. Indien de verificatie niet slaagt, wordt het reisdocument niet uitgereikt.'
  - '1. Gedeputeerde staten kunnen hetzij uit eigen beweging hetzij op verzoek van belanghebbenden de vergunning geheel of
    gedeeltelijk intrekken, indien blijkt van omstandigheden of feiten, waardoor in verband met de bij het grondwaterbeheer
    betrokken belangen de onttrekking of infiltratie in haar geheel dan wel gedeeltelijk niet langer toelaatbaar wordt geacht.

    2. Op de voorbereiding van een beschikking krachtens het eerste lid zijn afdeling 3.4 van de Algemene wet bestuursrecht
    en afdeling 13.2 van de Wet milieubeheer van toepassing, en isartikel 20van deze wet van overeenkomstige toepassing.'
  - '1. De verdeling kan geschieden op de wijze en in de vorm die partijen goeddunkt, mits de deelgenoten en zij wier medewerking
    vereist is, allen het vrije beheer over hun goederen hebben en in persoon of bij een door hen aangewezen vertegenwoordiger
    medewerken, dan wel in geval van bewind over hun recht, worden vertegenwoordigd door de bewindvoerder, voorzien van de
    daartoe vereiste toestemming of machtiging.

    2. In andere gevallen moet, tenzij de rechter anders bepaalt, de verdeling geschieden bij notariële akte en worden goedgekeurd
    door de kantonrechter die bevoegd is de wettelijke vertegenwoordiger van degene die het vrije beheer over zijn goederen
    mist, tot beschikkingshandelingen te machtigen.'
  - '1. Verbeurde dwangsommen komen toe aan de rechtspersoon waartoe het bestuursorgaan behoort dat de dwangsom heeft vastgesteld.
    Het bestuursorgaan kan bij dwangbevel het verschuldigde bedrag, verhoogd met de op de invordering vallende kosten, invorderen.

    2. Artikel 5:26, tweede tot en met vierde lid, is van toepassing.'
- source_sentence: 'Instruct: Given a Dutch legal query, retrieve relevant articles that help answer the query.

    Query: Incidentele vordering tot schorsing ex Rv. na eerder executie kort geding is in beginsel in strijd met een goede
    procesorde".'
  sentences:
  - De scheepsbeheerder is aansprakelijk voor de nakoming van de uit deartikelen 706 tot en met 709,717,719,720en734 tot en
    met 734lvoortvloeiende verplichtingen, indien de werkgever tot nakoming daarvan onherroepelijk is veroordeeld en niet
    tot nakoming overgaat.
  - Onze Minister kan, indien naar zijn oordeel ter voorkoming of beperking van ernstig gevaar voor de volksgezondheid een
    onverwijlde voorziening noodzakelijk is, na overleg met Onze Minister van Volksgezondheid, Welzijn en Sport, een regeling
    vaststellen van de inartikel 21, derde of vierde lid,27,28of 29bedoelde strekking. Een zodanige regeling vervalt een jaar
    nadat deze in werking is getreden, of, indien binnen die periode een algemene maatregel van bestuur ter vervanging van
    die regeling in werking is getreden, op het tijdstip waarop die maatregel in werking treedt. Bij ministeriële regeling
    kan de geldigheidsduur van de regeling eenmaal met ten hoogste een jaar worden verlengd.
  - '1. Evenmin kan beslag worden gelegd op de boeken die de geëxecuteerde nodig heeft voor zijn beroep, en op de werktuigen
    en gereedschappen, dienend tot enig onderwijs of de beoefening van kunsten en wetenschappen, telkens tot een bij algemene
    maatregel van bestuur vast te stellen bedrag en te zijner keuze.

    2. De in het eerste lid bedoelde zaken kunnen wel in beslag worden genomen voor vorderingen: 1°. wegens levensbehoeften
    verstrekt aan de geëxecuteerde en de inwonende leden van zijn gezin; 2°. ter zake van de vervaardiging of het herstel
    van deze zaken of de verkoop daarvan aan de geëxecuteerde.'
  - '1. Het gerecht dat bevoegd is om kennis te nemen van een vordering strekkende tot weigering van de tenuitvoerlegging
    van een rechterlijke beslissing, als bedoeld in artikel 47, eerste lid, van de verordening is de rechtbank die bevoegd
    is op grond van artikel 438 van het Wetboek van Burgerlijke Rechtsvordering.

    2. Het gerecht dat bevoegd is kennis te nemen van het rechtsmiddel bedoeld in artikel 49 van de verordening is het gerechtshof.

    3. Het gerecht dat bevoegd is kennis te nemen van het rechtsmiddel bedoeld in artikel 50 van de verordening is de Hoge
    Raad.'
  - '1. Als het document waarin de gevraagde gegevens zijn neergelegd berust onder de minister tot wie de verzoeker zich heeft
    gewend, maar het betrokken document tot stand is gekomen onder (eerste) verantwoordelijkheid van een andere minister,
    wordt de beslissing op het verzoek om informatie niet genomen dan nadat met de andere minister is overlegd.

    2. Leidt het overleg tot de slotsom dat de beslissing op het verzoek om informatie beter kan worden genomen door de andere
    minister, dan wordt de verzoeker naar hem verwezen. In het geval van een schriftelijk verzoek wordt dit doorgezonden onder
    mededeling van de doorzending aan de verzoeker.'
  - Indien het vonnis uitvoerbaar bij voorraad is verklaard, evenwel zonder dat daaraan de voorwaarde is verbonden dat zekerheid
    wordt gesteld, en indien tegen dat vonnis een rechtsmiddel is aangewend, kan alsnog een daartoe strekkende incidentele
    vordering worden ingesteld.
  - '1. Onverminderd het in of krachtens deze code bepaalde voldoen alle bedrijfsmiddelen en toestellen in of aangesloten
    op de elektrische installaties aan de op deze bedrijfsmiddelen en toestellen van toepassing zijnde normen.

    2. De in een elektrische installatie opgenomen machines, toestellen, materialen en onderdelen voldoen aan de voor de handel
    daarin of het gebruik daarvan vastgestelde wettelijke voorschriften.

    3. De elektrische installatie is bestand tegen het door de netbeheerder ter plaatse verwachte kortsluitvermogen.'
  - In geschillen als bedoeld in artikel 438 van het Wetboek van Burgerlijke Rechtsvordering over het dwangbevel bezitten
    leggers, waarin onderhoudsplichtigen zijn aangewezen, behoudens tegenbewijs, kracht van bewijs.
  - Op verzoeken betreffende de tenuitvoerlegging als bedoeld in de artikelen 22 en 23 van de verordening, is artikel 438
    van het Wetboek van Burgerlijke Rechtsvordering van toepassing.
- source_sentence: 'Instruct: Given a Dutch legal query, retrieve relevant articles that help answer the query.

    Query: Indien tussenkomst niet mogelijk is, aan welke voorwaarden moet de minister voldoen om te mogen worden toegelaten
    als gevoegde partij aan de zijde van de projectontwikkelaar?'
  sentences:
  - In zaken waarin de indiening van het verzoekschrift niet door een advocaat behoeft te geschieden, zijn deartikelen 80en81van
    overeenkomstige toepassing.
  - '1. Hoofdelijke schuldenaren zijn, ieder voor het gedeelte van de schuld dat hem in hun onderlinge verhouding aangaat,
    verplicht overeenkomstig de volgende leden in de schuld en in de kosten bij te dragen.

    2. De verplichting tot bijdragen in de schuld die ten laste van een der hoofdelijke schuldenaren wordt gedelgd voor meer
    dan het gedeelte dat hem aangaat, komt op iedere medeschuldenaar te rusten voor het bedrag van dit meerdere, telkens tot
    ten hoogste het gedeelte van de schuld dat de medeschuldenaar aangaat.

    3. In door een hoofdelijke schuldenaar in redelijkheid gemaakte kosten moet iedere medeschuldenaar bijdragen naar evenredigheid
    van het gedeelte van de schuld dat hem aangaat, tenzij de kosten slechts de schuldenaar persoonlijk betreffen.'
  - Partijen zijn verplicht de voor de beslissing van belang zijnde feiten volledig en naar waarheid aan te voeren. Wordt
    deze verplichting niet nageleefd, dan kan de rechter daaruit de gevolgtrekking maken die hij geraden acht.
  - '1. De stagiaire neemt deel aan het onderwijs in alle onderdelen van de beroepsopleiding advocaten en bereidt zich op
    de in het opleidingsreglement voorgeschreven wijze voor.

    2. De stagiaire neemt deel aan het onderwijs van de eerste cyclus van de beroepsopleiding advocaten die na aanvang van
    de stage wordt aangeboden.

    3. De stagiaire die niet direct na aanvang van de stage het onderwijs in de onderscheiden onderdelen van de beroepsopleiding
    advocaten volgt, wordt geacht de voor dat onderdeel afgenomen toetsen niet te hebben behaald.

    4. Met deelname aan het onderwijs in de onderdelen, genoemd inartikel 3.15, eerste lid, onderdelen b en c, wordt gelijkgesteld
    het deelnemen aan onderwijs in die onderdelen bij een geaccrediteerde opleiding als bedoeld inartikel 3.25.

    5. De algemene raad kan van het tweede of derde lid afwijken indien toepassing daarvan zou leiden tot een onbillijkheid
    van overwegende aard.'
  - In zaken van eenvoudige vrijwaring mag de waarborg zich in de hoofdzaak slechts voegen zonder de zaak van de gewaarborgde
    over te nemen.
  - Het Gerecht is bevoegd samenhangende beroepschriften te voegen en gevoegde beroepschriften te splitsen.
  - '1. Het recht om ter bescherming van een collectief merk in rechte op te treden komt uitsluitend toe aan de houder van
    dat merk.

    2. Het reglement op het gebruik en het toezicht kan evenwel aan personen, aan wie het gebruik van het merk is toegestaan,
    het recht toekennen tezamen met de houder een vordering in te stellen of in een door of tegen deze aangevangen geding
    zich te voegen of tussen te komen.

    3. Het reglement op het gebruik en het toezicht kan eveneens bepalen, dat de houder, die alleen optreedt, het bijzonder
    belang van de gebruikers van het merk kan laten gelden en in zijn eis tot schadevergoeding de bijzondere schade, die één
    of meer van hen hebben geleden, kan opnemen.'
  - '1. Heeft de ontvanger in een periode waarin hij redelijkerwijze met een verplichting tot teruggave van het goed geen
    rekening behoefde te houden, niet als een zorgvuldig schuldenaar voor het goed zorg gedragen, dan wordt hem dit niet toegerekend.

    2. Degene die namens een ander, maar onbevoegd een niet aan die ander verschuldigde geldsom heeft ontvangen, is van zijn
    verplichting tot teruggave bevrijd, voor zover hij die geldsom aan die ander heeft doorbetaald in een periode waarin hij
    redelijkerwijze met die verplichting geen rekening behoefde te houden.'
  - '1. Iedere tekortkoming van een partij in de nakoming van een van haar verbintenissen geeft aan de wederpartij de bevoegdheid
    om de overeenkomst geheel of gedeeltelijk te ontbinden, tenzij de tekortkoming, gezien haar bijzondere aard of geringe
    betekenis, deze ontbinding met haar gevolgen niet rechtvaardigt.

    2. Voor zover nakoming niet blijvend of tijdelijk onmogelijk is, ontstaat de bevoegdheid tot ontbinding pas, wanneer de
    schuldenaar in verzuim is.'
- source_sentence: 'Instruct: Given a Dutch legal query, retrieve relevant articles that help answer the query.

    Query: wat zijn de regels voor een subbrandcompartiment dat groter is dan normaal'
  sentences:
  - Een opening van de voorziening voor luchtverversing van een gebruiksfunctie is niet afsluitbaar.
  - Een hellingbaan als bedoeld inartikel 2.31sluit aan de bovenzijde, over de breedte van de hellingbaan, aan op een vloer
    met een oppervlakte van ten minste 0,7 m x 0,7 m.
  - '1. Met de inning van de administratieve sancties is de officier van justitie belast.

    2. Bij of krachtens algemene maatregel van bestuur worden omtrent de inning voorschriften gegeven. Deze voorschriften
    hebben in ieder geval betrekking op de plaats en wijze van betaling van de administratieve sanctie, de administratiekosten,
    de verantwoording van de ontvangen geldbedragen, alsmede op de kosten van verhaal, de invorderingskosten daaronder begrepen.

    3. Een ieder is verplicht desgevorderd onverwijld aan de officier van justitie, die met de inning van de administratieve
    sanctie is belast, de inlichtingen te verstrekken welke naar het redelijk oordeel van het openbaar ministerie noodzakelijk
    zijn ten behoeve van de toepassing van het eerste lid van dit artikel. De artikelen 217 en 218 van het Wetboek van Strafvordering
    zijn van overeenkomstige toepassing.'
  - Indien niet wordt voldaan aanartikel 12, eerste lid, kunnen burgemeester en wethouders, tenzij toepassing is gegeven aan
    het tweede lid van dat artikel, degene die als eigenaar van een bouwwerk of standplaats dan wel uit anderen hoofde bevoegd
    is tot het treffen van voorzieningen daaraan, verplichten tot het binnen een door hen te bepalen termijn treffen van zodanige
    door hen daarbij aan te geven voorzieningen, dat nadien wordt voldaan aanartikel 12, eerste lid.
  - '1. Een te bouwen woongebouw heeft in een gemeenschappelijke verkeersruimte een zodanige geluidsabsorptie, dat geluidhinder
    door galm wordt beperkt.

    2. Aan de in het eerste lid gestelde eis wordt voldaan door toepassing van de voorschriften in deze afdeling.'
  - Een brandcompartiment en een subbrandcompartiment met een gebruiksoppervlakte die groter is dan de toelaatbare gebruiksoppervlakte
    als bedoeld inparagraaf 2.13.1, onderscheidenlijk2.14.1, zijn zodanig ingericht dat het uitbreiden van brand wordt beperkt
    op een wijze die leidt tot een mate van brandveiligheid als beoogd met die paragrafen.
  - '1. Een betaaldienstverlener verstrekt aan een betaaldienstgebruiker in het geval van een eenmalige betalingstransactie
    de volgende informatie en voorwaarden of stelt deze aan hem ter beschikking: a. gedetailleerde informatie of een unieke
    identificator die door de betaaldienstgebruiker moet worden verstrekt opdat een betaalopdracht correct kan worden geïnitieerd
    of uitgevoerd; b. de maximale uitvoeringstermijn voor de aangeboden betaaldienst; c. alle kosten die de betaaldienstgebruiker
    aan de betaaldienstverlener verschuldigd is en, voor zover van toepassing, de splitsing van de bedragen van eventuele
    kosten; en d. voor zover van toepassing, de bij de betalingstransactie toe te passen feitelijke of referentiewisselkoers.

    2. Een betaalinitiatiedienstverlener verstrekt aan de betaler voorafgaand aan de initiëring van de betaalopdracht voor
    een eenmalige betalingstransactie de volgende informatie of stelt deze aan hem ter beschikking: a. de naam van de betaalinititatiedienstverlener;
    b. het adres van zijn hoofdkantoor; c. voor zover van toepassing, het adres van zijn betaaldienstagent die of zijn bijkantoor
    dat is gevestigd in de lidstaat waar de betaaldienst wordt aangeboden; d. alle andere voor communicatie met de betaaldienstverlener
    relevante contactgegevens; en e. de contactgegevens van de Nederlandsche Bank.

    3. Voor zover van toepassing stelt de betaaldienstverlener de overige inartikel 59ebedoelde informatie en voorwaarden
    op gemakkelijk toegankelijke wijze aan de betaaldienstgebruiker ter beschikking.'
  - 'Materiaal ter plaatse van of nabij een stookplaats voldoet aan brandklasse A1 of voor zover het de bovenzijde van een
    vloer, een trap of een hellingbaan betreft aan brandklasse A1 fl, beide bepaald volgens NEN-EN 13501-1, indien: a. op
    het materiaal een intensiteit aan warmtestraling kan optreden die, bepaald volgens NEN 6061, groter is dan 2 kW/m 2, of
    b. in het materiaal een temperatuur kan optreden die, bepaald volgens NEN 6061, hoger is dan 90 °C.'
  - De volgens NEN 6075 bepaalde weerstand tegen rookdoorgang van een rookcompartiment naar een besloten ruimte in het brandcompartiment
    is niet lager dan 20 minuten.
