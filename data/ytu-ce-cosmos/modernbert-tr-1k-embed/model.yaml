  - 'T.C. MALİYE BAKANLIĞI Gelir İdaresi Başkanlığı SAYI : B.07.1.GİB.0.02.68/6802-7 KONU: K.K.D.F. ................... FABRİKALARI
    T.A.Ş. ..................... İlgi : .......... tarih ve ..........sayılı dilekçeniz. İlgide kayıtlı dilekçenizde, 2008
    yılında Şirketinizin hammadde ihtiyacı olan demir cevheri ithalinin, satıcı ile yapılmış olan sözleşme gereğince geçici
    olarak 2007 yılı FOB referans ﬁyatları esas alınmak suretiyle peşin olarak gerçekleştirildiği, daha sonra sözleşme çerçevesinde
    geriye dönük şekilde ﬁyat ayarlaması yapılarak Firmanınızın borçlandırılması üzerine, 03.10.2008 tarihinde satıcı ﬁrma
    hesabına hesaplanan ﬁyat farklarının transfer edildiği belirtilerek, önceden peşin olarak gerçekleştirilmiş olan ithalatlar
    için sonradan yapılan bu fark ödemeleri üzerinden kaynak kullanımını destekleme fonu kesintisi yapılıp yapılmayacağı hususunda
    bilgi istenilmektedir. Bilindiği üzere, 12.05.1988 tarihli ve 88/12944 sayılı Kararnameye ilişkin Kaynak Kullanımını Destekleme
    Fonu Hakkında 6 Sıra Nolu Tebliğin 2 nci maddesi uyarınca; kabul kredili, vadeli akreditif ve mal mukabili ödeme şekillerine
    göre yapılan ithalat işlemleri % 3 oranında kaynak kullanımını destekleme fonu kesintisine tabi tutulmakta, peşin ödeme
    şekline göre yapılan ithalat işlemleri üzerinden ise fon kesintisi yapılmamaktadır. Ayrıca, ödeme şekli akreditif olarak
    belirtilen ithalat işlemlerinde, mal bedelinin gümrük mevzuatında tanımlanan gümrük yükümlülüğünün başladığı tarihten
    önce transfer edildiğinin tevsik edilmesi şartıyla fon kesintisi yapılmamakta, mal bedelinin bu tarihten sonra transfer
    edilmesi halinde ise ithalatçı kredilendirilmiş olacağından kaynak kullanımını destekleme fonu kesintisi yapılması gerekmektedir.
    Buna göre, Şirketiniz tarafından peşin olarak akreditif ödeme yöntemine göre önceden ithal edilen demir cevherine ilişkin
    olarak sözleşme gereğince daha sonra yapılan fark ödemelerinin gümrük yükümlülüğünün başladığı tarihten sonra gerçekleştirilmiş
    olması sebebiyle söz konusu fark ödemeleri üzerinden kaynak kullanımını destekleme fonu kesintisi yapılması gerekmektedir.
    Bilgi edinilmesini rica ederim.

    Başkan a.'
  - Sepetçiler Kasrı, İstanbul'un Fatih ilçesindeki Sarayburnu bölgesinde yer almakta olup, Topkapı Sarayı'nın Sarayburnu'ndaki
    iki kıyı köşkünden biri olarak önem taşır. Osmanlı döneminde padişahlar ve üst düzey yetkililer tarafından donanma hareketlerinin
    seyrinde bulunmak amacıyla kullanılmıştır. Kasrın konumu, saraya ait kayıkların bulunduğu bir bölgede inşa edilmiş olmasından
    kaynaklanan stratejik öneme sahiptir. Tarihi süreçte farklı restorasyon ve kullanım değişikliklerine uğramış; Basın Yayın
    Genel Müdürlüğü’nün Uluslararası Basın Merkezi, Avrupa Kültür Başkenti Projesi Ofisi ve son olarak Yeşilay Genel Merkezi
    gibi farklı amaçlar için kullanılmıştır. Bu çok yönlü kullanım, yapının zaman içinde hem kültürel hem de idari anlamda
    İstanbul'un tarihi dokusundaki yerini pekiştirmiştir.
