    bungalow sayfasını değerlendirebilirsiniz.
  - 'T.C. GELİR İDARESİ BAŞKANLIĞI KOCAELİ VERGİ DAİRESİ BAŞKANLIĞI (Mükellef Hizmetleri Grup Müdürlüğü) Sayı :B.07.1.GİB.4.41.15.01-EVK-2010-4-41
    29/07/2010 Konu :KÜMESİN MUAFİYETİ İlgi kayıtlı dilekçenizde, şirketinizin ... Belediyesi sınırları içinde ... Köyü Mevkiinde
    yaptırdığı 4 adet tavuk kümesi ve mütemmimleri (1 adet jeneratör evi, 1 adet işçi evi ve 1 adet yumurta deposu) için emlak
    vergisi muaﬁyetinin uygulanıp uygulanmayacağı konusunda Başkanlığımız görüşü sorulmaktadır. 1319 sayılı Emlak Vergisi
    Kanununun 1 inci maddesinde, Türkiye sınırları içinde bulunan binaların bu Kanun hükümlerine göre bina vergisine tabi
    olduğu, 4 üncü maddesinin (h) fıkrasında da, kiraya verilmemek ve zirai istihsalde kullanılmak şartıyla makine ve alet
    depoları, zahire ambarları, samanlıklar, arabalıklar, ağıllar, ahırlar, kümesler, kurutma mahalleri, böcekhaneler, serler
    (seralar) ve benzeri binalarla, işçi ve bekçi bina, kulübe ve barakalarının daimi olarak bina vergisinden muaf olduğu,
    bu binalardan bir kısmı ikamete, bir kısmı da fıkrada yazılı maksatlara tahsis edilmiş bulunduğu takdirde sadece ikamete
    tahsis olunan kısmın vergiye tabi tutulacağı hükme bağlanmıştır. Buna göre, bahse konu kümesler ve mütemmimlerinin zirai
    istihsalde kullanılmaları ve kiraya verilmemeleri şartıyla 1319 sayılı Kanunun 4 üncü maddesinin (h) fıkrasına göre emlak
    vergisinden muaf tutulmaları gerekmektedir. Ancak söz konusu binaların bir kısmının ikamet amaçlı olarak kullanılması
    halinde ikamet amacıyla kullanılan kısımlar emlak (bina) vergisine tabi tutulacaktır. Bilgi edinilmesini rica ederim.
    Vergi Dairesi Başkanı a. Grup Müdürü (*) Bu Özelge 213 sayılı Vergi Usul Kanununun 413.maddesine dayanılarak verilmiştir.

    (**) İnceleme, yargı ya da uzlaşmada olduğu halde bu konuya ilişkin olarak yanlış bilgi verilmiş ise bu özelge geçersizdir.
    (***) Talebiniz üzerine tayin edilmiş olan bu özelgeye uygun işlem yapmanız hâlinde, bu fiilleriniz dolayısıyla vergi
    tarh edilmesi icap ederse, tarafınıza vergi cezası kesilmeyecek ve tarh edilen vergi için gecikme faizi hesaplanmayacaktır.'
  - Okutmanlar, dil dersleri vermek ve eski dönemlere ait metinlerin çözümlemesi gibi görevleriyle ana öğretim kadrosuna destek
    sağlar. Bu görevler, öğrencilerin hem dilsel hem de tarihsel bilgilerini artırmaya yönelik olup, fakülte yönetim kurullarının
    önerileri ve rektör onayı ile belirlenen akademik politikalara uygun olarak yürütülür.
