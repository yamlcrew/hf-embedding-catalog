- source_sentence: Bu paragraf göz önüne alındığında, bana Sabapathy'nin hikayesini anlatın.
  sentences:
  - Metne göre Sarıyağıl, Bursa il merkezine 95 km uzaklıktadır.
  - 'T.C. GELİR İDARESİ BAŞKANLIĞI BÜYÜK MÜKELLEFLER VERGİ DAİRESİ BAŞKANLIĞI Mükellef Hizmetleri Grup Müdürlüğü Sayı :64597866-125[10-2013]-71
    20/05/2013 Konu :Türkiye Futbol Federasyonu ile reklam karşılığı yapılan akaryakıt anlaşmasının reklam harcaması olup
    olmadığı. İlgide kayıtlı özelge talep formunuzda, Türkiye Futbol Federasyonu ile şirketiniz arasında "Resmi Tedarikçi
    Sözleşmesi" imzalandığı, bu sözleşme ile şirketinizin Federasyonun belirlediği araçlara, araç tanıma sistemi takarak sözleşmede
    belirlenen tutar kadar akaryakıt ürünlerinin bedelsiz tedarik edilmesini üstlendiği, bunun karşılığında tüm milli futbol
    takımlarının reklam ve sponsorluk haklarından yararlanma olanağı elde ettiği belirtilerek, yapılan harcamanın reklam gideri
    olarak mı, sponsorluk gideri olarak mı kayıtlarınıza alınacağı ve hangi dönemde gider yazılacağı konusunda Başkanlığımız
    görüşü talep edilmektedir. 5520 sayılı Kurumlar Vergisi Kanununun 6 ncı maddesinde, kurumlar vergisinin, mükelleﬂerin
    bir hesap dönemi içinde elde ettikleri saﬁ kurum kazancı üzerinden hesaplanacağı, saﬁ kurum kazancının tespitinde ise
    Gelir Vergisi Kanununun ticarî kazanç hakkındaki hükümlerinin uygulanacağı hükmüne yer verilmiştir. 193 sayılı Gelir Vergisi
    Kanununun 40 ıncı maddesinde; saﬁ kazancın tespit edilmesinde indirilecek giderler sayılmış olup, birinci fıkrasının (1)
    numaralı bendinde; ticari kazancın elde edilmesi ve idame ettirilmesi için yapılan genel giderlerin kazancın tespitinde
    indirim konusu yapılacağı hükme bağlanmış olup pazarlama satış ve dağıtım giderleri de genel giderler kapsamında indirim
    konusu yapılabilmektedir. 5520 sayılı Kanunun "Diğer İndirimler" başlıklı 10 uncu maddesinin birinci fıkrasının (b) bendinde,
    21/5/1986 tarihli ve 3289 sayılı Gençlik ve Spor Genel Müdürlüğünün Teşkilat ve Görevleri Hakkında Kanun ile 17/6/1992
    tarihli ve 3813 sayılı Türkiye Futbol Federasyonu Kuruluş ve Görevleri Hakkında Kanun kapsamında yapılan sponsorluk harcamalarının
    sözü edilen kanunlar uyarınca tespit edilen amatör spor dalları için tamamı, profesyonel spor dalları için % 50''sinin
    kurumlar vergisi matrahının tespitinde, kurumlar vergisi beyannamesi üzerinde ayrıca gösterilmek şartıyla kurum kazancından
    indirilebileceği hükme bağlanmıştır. Konuyla ilgili olarak 1 seri no.lu Kurumlar Vergisi Genel Tebliğinin "10.3.1. Sponsorluk
    harcamaları" başlıklı bölümünde; "3289 sayılı Gençlik ve Spor Genel Müdürlüğünün Teşkilat ve Görevleri Hakkında Kanun
    ile 3813 sayılı Türkiye Futbol Federasyonu Kuruluş ve Görevleri Hakkında Kanun kapsamında yapılan sponsorluk harcamalarının;
    sözü edilen kanunlar uyarınca tespit edilen amatör spor dalları için tamamı, profesyonel spor dalları için %50''si kurumlar
    vergisi matrahının tespitinde,

    beyan edilen kurum kazancından indirilebilecektir. Sponsorluk harcamaları, ticari kazancın elde edilmesi ile doğrudan
    ilişkili olmayan veya ilişkisi ölçülemeyen, sosyal amacı öne çıkan harcamalar olup ticari kazancın elde edilmesi ile doğrudan
    ilişkili olan reklam harcamalarından farklılık arz etmektedir. Sponsor olan kurumun adının anılması koşuluyla, • Resmi
    spor organizasyonları için yapılan saha, salon veya tesis kira bedelleri, • Sporcuların iaşe, seyahat ve ikamet giderleri,
    • Spor malzemesi bedeli, • Gençlik ve Spor Genel Müdürlüğünün uygun göreceği spor tesisleri için yapılan ayni ve nakdi
    harcamalar, • Sporcuların transfer edilmesini sağlayacak bonservis bedelleri, • Spor müsabakaları sonucuna göre sporculara
    veya spor adamlarına prim mahiyetinde ayni ve nakdi ödemeler gibi harcamalar sponsorluk harcaması olarak değerlendirilecektir.
    Spor sahalarına, sporcuların veya diğer ilgililerin spor giysilerinin ya da spor araç ve gereçlerinin üzerine yazılı veya
    elektronik sinyaller yardımıyla sanal olarak kurumun tanıtımının yapılmasını sağlayacak amblem, marka, isim ve benzeri
    işaretler konulması gibi doğrudan ticari fayda sağlayan ve kurumun tanıtımını amaçlayan harcamalar ise reklam harcaması
    olarak değerlendirilecektir. Ayrıca, sponsorluk faaliyetinin yanında reklam ve tanıtım amacını da içeren işlemler nedeniyle
    yapılan harcamaların, sözleşmede belirtilmek ve emsaline uygun olmak şartıyla, reklam ve sponsorluk harcamaları olarak
    ayrıştırılabilmesi mümkündür. Örneğin, bir kurumun, bir kulübe bonservis bedelini karşılayarak transfer ettiği bir sporcuyu
    aynı zamanda şirketin veya ürünlerinin tanıtımına yönelik reklamlarda kullanması halinde, reklam faaliyetine ilişkin harcamalar,
    bonservis bedelinden sözleşmede belirtilmek ve emsallerine uygun olmak şartıyla ayrıştırılabilecek ve reklam gideri olarak
    dikkate alınacaktır. Sponsorluk uygulamasına ilişkin usul ve esaslar, 16/6/2004 tarih ve 25494 sayılı Resmi Gazete''de
    yayımlanan Gençlik ve Spor Genel Müdürlüğü Sponsorluk Yönetmeliğinde düzenlenmiştir. Buna göre, gerçek ve tüzel kişiler,
    federasyonlara, gençlik ve spor kulüplerine veya sporculara, spor tesisleri ve faaliyetlerine ilişkin olarak anılan Yönetmelikte
    belirtilen usul ve esaslar dahilinde sponsor olabileceklerdir... Sponsorluk Yönetmeliği kapsamında ayni ya da nakdi olarak
    yapılan harcamalar, kurumlar vergisi mükelleﬂerince harcamanın yapıldığı yılda indirim olarak dikkate alınabilecektir.
    ..." açıklamalarına yer verilmiştir. Diğer taraftan, sponsorluk uygulamasına ilişkin usul ve esaslar 16/06/2004 tarihli
    ve 25494 sayılı Resmi Gazete''de yayımlanan Gençlik ve Spor Genel Müdürlüğü Sponsorluk Yönetmeliğinde düzenlenmiş olup,
    "Tanımlar" başlıklı 4 üncü maddesinde sponsorluk, bu yönetmelik kapsamındaki alanlara gerçek veya tüzel kişilerce, dolaylı
    olarak ticari fayda sağlamak ya da sosyal sorumluluklarını yerine getirmek amacıyla iletişim olanakları karşılığında ayni
    ve/veya nakdi destekte bulunulmasını ifade edeceği şeklinde tanımlanmıştır. Yukarıda yer alan hüküm ve açıklamalardan
    anlaşılacağı üzere, ticari kazancın elde edilmesi ile doğrudan ilişkisi olmayan veya ilişkisi ölçülemeyen, sosyal amacı
    öne çıkan harcamalar sponsorluk harcaması, işletmelere doğrudan ticari fayda sağlayan ve kurumun tanıtımını amaçlayan
    harcamalar ise reklam harcaması olarak kabul edilmektedir. Buna göre, şirketinizin Türkiye Futbol Federasyonu ile yapmış
    olduğu "Resmi Tedarik Sözleşmesi" çerçevesinde; yılda 1 tematik, 2 promosyenel tv ve radyo, gazete, açık hava, mağaza
    içi reklam imkanı, yurt içinde gerçekleştirilen tüm milli maçlarda Federasyona ait reklam panosu olması halinde şirketinizin
    adının yer alması, milli takım basın açıklaması sırasında arkada bulunan basın panosunda şirket logosunun bulunması, Federasyonun
    resmi internet sitesinde şirket logosunun bulunması, milli takım yurt içi müsabakalarında stat içinde ve dışında şirketinizin
    tanıtım faaliyeti yapması olanakları tanınması ile şirketinize doğrudan ticari fayda sağlamak üzere tanıtımı amaçlandığından,
    yapılan harcamaların reklam harcaması olarak değerlendirilmesi gerekmektedir.

    Bu çerçevede, sözleşme kapsamında yapılan bedelsiz akaryakıt teslimlerinin öncelikle satış olarak değerlendirilmesi ve
    tahsil edilmeyen akaryakıt bedelinin de ﬁilen akaryakıtın teslim edildiği dönemde 193 sayılı Kanunun 40 ıncı maddesinin
    birinci fıkrasının (1) numaralı bendi uyarınca gider olarak kurum kazancının tespitinde dikkate alınması mümkündür. Ancak,
    ilgili sözleşme gereğince A Milli Futbol Takımının yurt içinde gerçekleştirdiği maçlar için şirketinizce ücretsiz temin
    edilen biletlerin değerine isabet eden akaryakıt tutarının ise reklam veya sponsorluk harcaması olarak değerlendirilmeyerek
    kanunen kabul edilmeyen gider olarak dikkate alınması gerekmektedir. Bilgi edinilmesini rica ederim. (*) Bu Özelge 213
    sayılı Vergi Usul Kanununun 413.maddesine dayanılarak verilmiştir. (**) İnceleme, yargı ya da uzlaşmada olduğu halde bu
    konuya ilişkin olarak yanlış bilgi verilmiş ise bu özelge geçersizdir. (***) Talebiniz üzerine tayin edilmiş olan bu özelgeye
    uygun işlem yapmanız hâlinde, bu fiilleriniz dolayısıyla vergi tarh edilmesi icap ederse, tarafınıza vergi cezası kesilmeyecek
    ve tarh edilen vergi için gecikme faizi hesaplanmayacaktır.'
  - 'Sabapathy, A. V. Meiyappan ve A. T. Krishnaswamy tarafından yönetilen ve yapımcılığını Meiyappan''ın üstlendiği 1941
    yapımı bir Hint Tamil dili komedi filmidir. Pammal Sambandha Mudaliar''ın aynı adlı komedi oyunundan uyarlanan filmin
    başrollerinde T. R. Ramachandran, Kali N. Rathnam, C. T. Rajakantham ve K. Sarangapani yer alıyor. Sabapathy adlı iki
    ahmak adamın maskaralıklarına odaklanıyor: zengin bir adam ve onun hizmetkarı. Film 14 Aralık 1941''de gösterime girdi
    ve ticari bir başarı elde etti.'
- source_sentence: Verilen metinde '.ee' ifadesinin ardından 'Ee' ve 'ee' gibi varyantlar da yer almaktadır. Alan adlarında
    büyük ve küçük harf kullanımının önemi nedir ve bu varyantların varlığının nedeni nedir?
  sentences:
  - Yaklaşık 136 km'dir.
  - Engelli Adjudication and Review (ODAR) Ofisi altında dünyanın en büyük idari yargı sistemini denetleyen ABD Sosyal Güvenlik
    İdaresi (SSA), uzak konumlarda duruşmalar yapmak için video konferansı kapsamlı bir şekilde kullanmıştır. 2009 Mali Yılında
    (FY), ABD Sosyal Güvenlik İdaresi (SSA) 86,320 video konferanslı duruşma gerçekleştirdi ve 2008 FY üzerinde%55 artış gösterdi.
    Ağustos 2010'da SSA, yalnızca beşinci ve en büyük video konferans yapan Ulusal İşitme Merkezi'ni (NHC) St. Louis, Missouri'de
    açtı. Bu, SSA'nın önemli işitme birikimini temizlemek için video oturumlarını kullanma çabasını sürdürüyor. SSA 2007 yılından
    bu yana Albuquerque, New Mexico, Baltimore, Maryland, Falls Church, Virginia ve Chicago, Illinois'de NHCs kurmuştur.
  - Alan adları büyük ve küçük harfe duyarlı değildir; bu nedenle '.ee', 'Ee' veya 'ee' ifadeleri işlevsel olarak aynıdır.
    Bu varyantlar yazım farkı gösterebilir fakat hepsi aynı ülke kodunu ifade eder.
