    talep formunuzdan, Katma Değer Vergisi Kanununun 13/a maddesi kapsamında istisna belgesine dayanarak aldığınız malzemelerin
    aracın inşasından sonra stok haline gelmesi ve bu stokta bulunan malzemenin satışının yapılması halinde alan ﬁrma 13/a
    maddesine istinaden istisna belgesine sahipse KDV hesaplamadan teslimde bulunup bulunulamayacağı, stokta kalan malzemenin
    başka bir teknenin imal ve inşasında kullanılması halinde KDV karşısındaki durumu ve söz konusu tekneleri imal ve inşa
    etmek üzere kiraladığınız yer için ödenecek bedelin KDV ye tabi olup olmayacağı hususlarında tereddüt hasıl olduğu ve
    konuyla ilgili olarak Başkanlığımız görüşünün talep edildiği anlaşılmıştır. 3065 sayılı Katma Değer Vergisi (KDV) Kanununun
    13/a maddesine göre; faaliyetleri kısmen veya tamamen deniz, hava ve demiryolu taşıma araçlarının, yüzer tesis ve araçların
    kiralanması veya çeşitli şekillerde işletilmesi olan mükelleﬂere bu amaçla yapılan deniz, hava ve demiryolu taşıma araçlarının,
    yüzer tesis ve araçlarının teslimleri, bu araçların imal ve inşası ile ilgili olarak yapılan teslim ve hizmetler ile bunların
    tadili, onarım ve bakımı şeklinde ortaya çıkan hizmetler ve faaliyetleri deniz taşıma araçları ile yüzer tesis ve araçların
    imal ve inşası olanlara bu araçların imal ve inşası ile ilgili olarak yapılacak teslim ve hizmetler KDV den istisna edilmiş,
    söz konusu istisna uygulamasının usul ve esasları 48, 107 ve 116 Seri No.lu KDV Genel Tebliğlerinde açıklanmıştır. Buna
    göre, Kanunun 13/a maddesinde sayılan araçları inşa eden veya ettiren gerçek usulde KDV mükelleﬂerinin bu araçların inşası
    ile ilgili her türlü mal ve hizmet alımlarında istisna uygulanabilecektir. İstisna kapsamında işlem yapılabilmesi için,
    istisna uygulanabileceğini belirten vergi dairelerinden alınan bir yazının, teslim veya hizmeti yapacak olan mükellefe
    ibraz edilmesi şarttır. Mükelleﬂerin bu belge olmadan istisna uygulamaları halinde, istisna uygulaması nedeniyle ziyaa
    uğratılan vergi, ceza, zam ve faizlerden teslim veya hizmeti yapan mükelleﬂer ile birlikte teslim veya hizmet yapılan
    alıcı da müteselsilen sorumlu olacaktır. Kendisine, teslim veya hizmetin istisna kapsamına girdiğini belirten vergi dairesi
    yazısı ibraz edilen mükelleﬂer, başka bir şart aramadan istisna kapsamında işlem yapacaktır. Daha sonra işlemin, istisna
    için belirlenen şartları baştan taşımadığı ya da şartların daha sonra ihlal edildiğinin tespiti halinde, ziyaa uğratılan
    vergi ile buna bağlı ceza, faiz ve zamlar, kendisine istisna kapsamında teslim veya hizmet yapılan alıcıdan aranacaktır.

    Bu açıklamalar çerçevesinde; İstisna kapsamında alınan malzemelerden imalatta kullanıldıktan sonra arta kalan ve stok
    haline gelen kısım için istisna şartları ihlal edilmiş olacağından, stoktaki bu mallara ait hesaplanacak KDV nin beyannamenin
    ilave edilecek KDV satırına dahil etmek suretiyle beyan edilmesi gerekmektedir. Öte yandan, Kanunun 13/a maddesi kapsamında
    KDV ödenmeksizin temin edilen, ancak kullanıma konu olmayan (artan) malların teslimi, katma değer vergisine tabidir. Ancak,
    bu malları alan tarafın KDV Kanununun 13/a maddesi ve KDV mevzuatındaki diğer şartları taşıması halinde söz konusu malların
    tesliminde istisna uygulanacağı tabiidir. Yine stoklarda kalan malların firmanızca istisna kapsamında imal ve inşa edilen
    başka bir deniz aracının yapımında kullanılması halinde de KDV den istisna olarak işlem yapılması mümkün bulunmaktadır.
    Bilgi edinilmesini rica ederim. (*) Bu Özelge 213 sayılı Vergi Usul Kanununun 413.maddesine dayanılarak verilmiştir. (**)
    İnceleme, yargı ya da uzlaşmada olduğu halde bu konuya ilişkin olarak yanlış bilgi verilmiş ise bu özelge geçersizdir.
    (***) Talebiniz üzerine tayin edilmiş olan bu özelgeye uygun işlem yapmanız hâlinde, bu fiilleriniz dolayısıyla vergi
    tarh edilmesi icap ederse, tarafınıza vergi cezası kesilmeyecek ve tarh edilen vergi için gecikme faizi hesaplanmayacaktır.'
