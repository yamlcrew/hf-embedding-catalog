  - And the king said, “Turn aside; stand here.” And he turned and stood there.
- source_sentence: 'Quo maerore perculsus, velut primo adventantium malorum auspicio, murmurans querulis vocibus saepe audiebatur:
    nihil se plus assecutum, quam ut occupatior interiret.'
  sentences:
  - Overwhelmed by sorrow at this, the first omen, as it were, of approaching ills, he was often heard to mutter in complaining
    tones that he had gained nothing, except to die with heavier work.
  - for never again shall I bury one whom I love more, no! nor one more loyal to me
  - And in truth we could do nothing more pious than to give attention to this matter, nothing more impious than to disregard
    it.
- source_sentence: μαθὼν δὲ ἐκ τῆς μαντικῆς τὸν κεκλοφότα πρὸς Μαῖαν εἰς Κυλλήνην παραγίνεται, καὶ τὸν Ἑρμῆν ᾐτιᾶτο.
  sentences:
  - As it is, thinking ourselves despised, we not only treat harshly wife and slaves and friends, but also through rage often
    fall out with innkeepers and sailors and drunken muleteers we even rage against dogs that bark at us and asses that jostle
    us, like the man who wished to beat the assdriver, but when the driver cried out, I am an Athenian, indicated the ass
    and said, You at any rate are not an Athenian, and fell to beating it with many blows.
  - Three walls were easily built, because so many hands were continually at work on them, for it was summer time and there
    was nothing, either the weather or any lack of workers, to hinder the building. Then bringing up their machinery they
    shook the walls of the city and tried in every way to take it.
  - Having discovered the thief by divination, Apollo came to Maia at Cyllene and accused Hermes.
- source_sentence: Νομίζω οὖν τοῦτο καλὸν ὑπάρχειν διὰ τὴν ἐνεστῶσαν ἀνάγκην, ὅτι καλὸν ἀνθρώπῳ τὸ οὕτως εἶναι.
  sentences:
  - and the daffodil, νάρκισσος, because it benumbs the nerves and causes a stupid narcotic heaviness in the limbs
  - He is thus seen to be six years the junior of Isocrates.
  - 'I suppose therefore that this is good because of the present distress -- that it is good for a man to remain as he is:'
