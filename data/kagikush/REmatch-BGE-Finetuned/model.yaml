widgetData:
- source_sentence: With a large and substantial amount of capital available to invest, I intend to rely solely on my own capital
    without seeking financing or borrowing money. Quick access to the funds I invest is crucial, which means I cannot accept
    a long lock-up period. I am willing to accept only low investment risk and prioritize preserving my original capital over
    earning income or pursuing growth.
  sentences:
  - As an investor, I maintain a modest investment budget that falls well below the typical medium-range threshold. My approach
    prioritizes using solely my own funds without resorting to borrowing or leveraging. This decision allows me to manage
    risks effectively while ensuring immediate access to my investments should market conditions warrant. Recognizing the
    importance of preserving capital over short-term gains, I am willing to tolerate lower potential returns compared to those
    seeking higher yields through risky investments. My primary objective remains safeguarding my initial capital, placing
    significant emphasis on minimizing the likelihood of substantial losses.
  - With a tight budget and limited financial resources, I am committed to investing solely with my own funds without resorting
    to debt. This stringent approach ensures quick access to the investments, crucial for maintaining control over my assets.
    Accepting moderate risks while prioritizing protection of my initial capital, I aim to minimize potential losses. My primary
    objective remains safeguarding the integrity of my investment, placing greater emphasis on preserving the principal rather
    than seeking high returns or rapid growth.
  - With a large and substantial amount of capital available, I am committed to investing solely with my own funds without
    relying on financing or borrowed money. This ensures quick access to the invested funds, as I prioritize maintaining control
    over the assets. Accepting moderate investment risk while minimizing the likelihood of significant losses aligns with
    this approach, ensuring that protecting the original capital remains paramount. My primary objective is to safeguard the
    initial capital, prioritizing its preservation over seeking higher returns through income or growth opportunities.
- source_sentence: With a large and substantial amount of capital available to invest, I am committed to investing solely
    my own funds without relying on financing or borrowed money. This allows me to maintain full control over my investments
    while ensuring they are accessible within several months if necessary. My primary focus is on achieving both regular income
    and long-term capital appreciation, placing significant emphasis on minimizing risk and avoiding large losses.
  sentences:
  - As an investor, my primary focus is on preserving the original capital while minimizing risks. With a moderate investment
    budget, I am willing to borrow funds if necessary but prioritize maintaining full control over the invested assets. I
    seek investments that offer low-risk profiles, ensuring minimal potential for significant losses. My ultimate objective
    is to safeguard the principal amount, placing greater emphasis on stability and protection compared to seeking high returns
    through aggressive strategies.
  - With a large budget, I prefer not to use financing. I can wait up to a few months before selling, but I still want to
    protect my money with low-risk investments.
  - I have a substantial budget and aim for significant long-term growth with minimal risk. I prefer not to use financing
    options and am willing to hold onto investments for up to several months before selling. My primary goal is achieving
    both income generation and capital appreciation.
- source_sentence: As an investor, I have meticulously planned my approach to ensure that my investments align closely with
    my financial goals. With a clear understanding of my available investment budget falling within the medium range, I am
    committed to managing this responsibly without relying heavily on external sources such as loans or equity. This decision
    allows me to maintain flexibility in accessing funds while ensuring immediate liquidity should unforeseen circumstances
    arise. Recognizing the importance of minimizing risks, particularly focusing on low-risk investments, I prioritize safeguarding
    my principal over seeking higher returns through aggressive strategies. My primary objective remains steadfast—protecting
    the initial investment at all costs, valuing stability and safety above potential gains or volatility.
  sentences:
  - As an investor, I adhere to a disciplined approach, prioritizing both financial security and stability. With a clear understanding
    of my investment capabilities, I maintain a moderate but achievable budget for my investments, ensuring quick access to
    funds without compromising liquidity. By investing solely with my own capital and refraining from using borrowed money,
    I guarantee direct control over my finances. My primary concern lies in minimizing risks while preserving my initial capital,
    placing a high value on avoiding significant losses. This conservative stance ensures that every dollar contributes directly
    to my financial objectives, focusing on safeguarding rather than generating income or seeking growth opportunities.
  - With a large and substantial amount of capital available to invest, I intend to rely solely on my own capital without
    seeking financing or borrowing money. Quick access to the funds I invest is crucial, which means I cannot accept a long
    lock-up period. I am willing to accept only low investment risk and prioritize preserving my original capital over earning
    income or pursuing growth.
  - As an investor, I maintain a modest investment budget well below the typical medium range, ensuring quick access to funds
    through stringent liquidity requirements. With no reliance on external financing or borrowed capital, I am committed to
    managing risks at a moderate level, aiming for balanced outcomes between regular income generation and long-term capital
    appreciation.
- source_sentence: As an investor, I maintain a modest investment budget that falls comfortably within the lower-medium range.
    My approach prioritizes long-term capital growth over immediate income generation. To achieve this, I am willing to commit
    significant portions of my funds without relying on external financing or borrowing. This decision ensures full control
    over my investments but also allows me to access part of them periodically for short-term needs, maintaining flexibility
    as necessary. Despite accepting high levels of investment risk and potential for substantial volatility, I am prepared
    to endure these conditions to pursue sustained capital appreciation.
  sentences:
  - With a modest investment budget below the usual medium range, I plan to rely solely on my own capital without seeking
    financing or borrowing money. This allows me to maintain flexibility and avoid locking up funds for extended periods.
    Despite this liquidity constraint, I am willing to wait several months before accessing the invested money, recognizing
    its importance for preserving the original capital. Accepting high investment risk, substantial volatility, and the potential
    for significant losses, my primary goal remains focused on safeguarding the initial investment rather than pursuing income
    or growth opportunities.
  - With a large and substantial amount of capital available to invest, I am committed to investing solely my own funds without
    relying on financing or borrowed money. This allows me to maintain full control over my investments while ensuring they
    are accessible within several months if necessary. My primary focus is on achieving both regular income and long-term
    capital appreciation, placing significant emphasis on minimizing risk and avoiding large losses.
  - I have a modest budget and prefer not to use financing. I want some access to my money but also allow longer holding periods.
    I'm willing to take on higher risks for potentially better returns. My primary goal is to achieve long-term growth.
- source_sentence: With a modest investment budget below the usual medium range, I am open to using financing or borrowed
    money if it enhances my chances of quick access to funds and minimizing risks associated with longer lock-ups. Accepting
    moderate investment risk while aiming for regular income rather than long-term capital growth prioritizes immediate financial
    stability over potential high returns.
  sentences:
  - I have a modest investment budget that is below the usual medium range, making quick access to my funds crucial. I am
    open to using financing or borrowing money for investments but require strict liquidity to ensure easy withdrawal at any
    time without penalty. Despite this, I accept moderate risks while aiming to limit the possibility of significant losses.
    My primary goal is to secure regular income rather than achieve long-term capital growth.
  - With a substantial budget and significant capital at my disposal, I am open to leveraging financing options to expand
    my investments. My primary objective is to achieve long-term capital growth rather than immediate income. I seek access
    to part of my invested funds while maintaining an adequate portion committed for several years without compromising on
    safety. Despite this, I am prepared to accept minimal risks and avoid potential large losses.
  - With a modest investment budget under the medium range, I am open to borrowing funds but require quick access to my investments
    due to strict liquidity needs. Accepting moderate risks, I aim for long-term capital growth rather than immediate income.
