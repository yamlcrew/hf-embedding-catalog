widgetData:
- source_sentence: 'query: saya ingin memasak French Canadian'
  sentences:
  - 'passage: Title: French Canadian. Ingredients: 2 to 2 ¼ ounces Cognac, ¼ ounce Champagne vinegar, ¼ ounce maple syrup,
    ¼ teaspoon pure vanilla extract, Garnish: lemon twist. Instructions: Combine Cognac, vinegar, maple syrup, and vanilla
    in a mixing glass and fill with ice. Stir until well chilled, about 30 revolutions. Strain into a chilled coupe glass,
    gently squeeze the lemon twist over the top to express oils, then use as a garnish.'
  - 'passage: Title: Chocolate-Covered Peanuts. Ingredients: 4 ounces (115 g) semisweet or bittersweet chocolate, chopped,
    1 cup (150 g) roasted, unsalted peanuts. Instructions: Put the pieces of chocolate in an absolutely dry heatproof bowl.
    Set the bowl over a saucepan of simmering water to melt the chocolate, stirring until smooth. In the meantime, stretch
    a piece of plastic wrap over a dinner plate. Once the chocolate is melted, remove it from the heat and stir in the peanuts,
    coating them with the chocolate. Spread the mixture on the plastic-lined plate and chill. Use a chef''s knife to chop
    the chocolate-covered block of peanuts into bite-sized pieces, then mix them into 1 quart (1 liter) of ice cream as you
    remove it from the machine.'
  - 'passage: Title: Sweet Amigos. Ingredients: 1 orange wheel, halved, 2 dark sweet cherries (1 pitted), 2 oz Casamigos Reposado
    tequila, 1/4 oz agave nectar, pinch of cinnamon. Instructions: In the smaller portion of a Boston shaker, muddle one-half
    orange wheel and pitted cherry. Add ice, tequila, agave nectar, and cinnamon and shake well. Strain over a 2" x 2" ice
    cube. Garnish with remaining one-half orange wheel and cherry.'
- source_sentence: 'query: resep Strawberry Smoothie'
  sentences:
  - 'passage: Title: Garlic Bread. Ingredients: 2 large garlic cloves, finely chopped, 1/2 stick (1/4 cup) unsalted butter,
    well softened, 1 tablespoon extra-virgin olive oil, 2 tablespoons finely chopped flat-leaf parsley, 1 (15") loaf Italian
    bread (about 3 1/2" wide), 4 tablespoons grated Parmesan. Instructions: Preheat oven to 350°F with rack in middle. Mince
    and mash garlic to a paste with a rounded 1/4 teaspoon salt using a heavy knife. Stir together butter, oil, and garlic
    paste in a bowl until combined well; stir in parsley. Halve loaf horizontally and divide butter mixture between halves,
    spreading it evenly. Divide cheese between halves and spread it in an even layer. Put halves, cheese side up, on a large
    baking sheet. Cover the bread with a large piece of foil, tenting it slightly on the top and tucking it under the bread.
    Bake 15 minutes. Remove foil and turn oven to broil. Broil bread until golden, 1-3 minutes.'
  - 'passage: Title: Peanut and Scallion Relish. Ingredients: 1 large scallion, green parts only, thinly sliced, 3/4 cup coarsely
    chopped unsalted, dry-roasted peanuts, 1 tablespoon finely chopped fresh cilantro, 1 tablespoon light brown sugar, Kosher
    salt and freshly ground black pepper. Instructions: Combine scallion, peanuts, cilantro, and brown sugar in a small bowl;
    season with salt and pepper. Use immediately. (Don''t prepare this relish ahead of time—the cilantro will make the peanuts
    soggy.)'
  - 'passage: Title: Strawberry Smoothie. Ingredients: 1 (10-oz.) bag frozen strawberries, 1 1/4 cups (or more) whole milk
    or unsweetened almond, coconut, or other alternative milk, 1 cup plain full-fat yogurt, 1 Tbsp. honey, 1 tsp. vanilla
    extract. Instructions: Purée strawberries, milk, yogurt, honey, and vanilla in a blender until smooth, adding more milk
    if needed to thin smoothie. Divide between glasses.'
- source_sentence: 'query: makanan apa yang bisa dibuat dari 6 cups finely chopped bok choy, 1 large apple, shredded, 1 large
    carrot, shredded, 1/2 cup chopped red onion?'
  sentences:
  - 'passage: Title: Roasted-Garlic Oil. Ingredients: 6 large garlic cloves, peeled, halved, 1 tablespoon olive oil, 1 cup
    extra-virgin olive oil. Instructions: Preheat oven to 350°F. Place garlic cloves and 1 tablespoon olive oil in small ovenproof
    skillet; stir to coat. Roast in oven until garlic is just golden, shaking pan occasionally, about 15 minutes. Add extra-virgin
    olive oil; cool in skillet. Transfer oil and garlic to jar. Seal tightly; store in refrigerator up to 2 weeks (keep garlic
    in oil for flavor and looks, but use only oil in recipes).'
  - 'passage: Title: Apple Bok Choy Salad. Ingredients: 6 cups finely chopped bok choy, 1 large apple, shredded, 1 large carrot,
    shredded, 1/2 cup chopped red onion, 1/2 cup unsweetened soy, hemp, or almond milk, 1/2 cup raw cashews or 1/4 cup raw
    cashew butter, 1/4 cup balsamic vinegar, 1/4 cup raisins, 1 teaspoon Dijon mustard. Instructions: Combine bok choy, apple,
    carrot, and chopped onion in a large bowl. Blend soy milk, cashews, vinegar, raisins, and mustard in a food processor
    or high-powered blender. Add desired amount to chopped vegetables.'
  - 'passage: Title: Wine Spritzer. Ingredients: 3 ounces aromatic white wine (such as Sauvignon Blanc, Riesling, or Gewürztraminer),
    1 ounce club soda, Orange or lemon bitters, Orange or lemon twist. Instructions: Pour wine into a wineglass filled with
    ice; top off with club soda and a dash of bitters. Garnish with orange twist.'
- source_sentence: 'query: makanan apa yang bisa dibuat dari 1 ripe pineapple?'
  sentences:
  - 'passage: Title: Fireworks. Ingredients: 1/4 ounce grenadine syrup, 1/4 ounce crème de cassis, 1/4 ounce apricot brandy,
    1/4 ounce Cointreau, 1/4 ounce green Chartreuse, 1/4 ounce cognac or other brandy, 1/4 ounce Kirschwasser. Instructions:
    Pour all the ingredients, in the order listed, into a narrow, straight-sided 2-ounce liqueur glass.'
  - 'passage: Title: Lemon Rosé Bellini. Ingredients: 1 spoonful lemon sorbet, softened, 1/2 ounce citrus vodka (optional,
    for a stronger drink), 4 ounces rosé champagne, 2 to 3 raspberries, for garnish. Instructions: Combine the sorbet with
    the vodka in a cocktail shaker with ice. Shake vigorously. Add the champagne and stir. Strain into a chilled champagne
    flute and garnish with floating raspberries.'
  - 'passage: Title: Grill-Roasted Pineapple. Ingredients: 1 ripe pineapple. Instructions: Prepare a grill for medium-low,
    indirect heat (for a charcoal grill, bank coals on one side of grill; for a gas grill, leave one or two burners off, ideally
    the one in the middle). If you have a grill thermometer, the ideal temperature range is 275°F–350°F. Place pineapple over
    indirect heat, cover grill, and slowly roast, turning pineapple occasionally, until outside is dark brown, flesh is beginning
    to collapse underneath skin, and some juices are bubbling up in places, 2–2 1/2 hours. Let cool slightly, then cut as
    desired.'
- source_sentence: 'query: makanan apa yang bisa dibuat dari 1 dash The Truth Old Time Aromatic Bitters or Angostura bitters,
    1 sugar cube, 6" twist from a lemon, 5 ounces chilled Champagne?'
  sentences:
  - 'passage: Title: The Champagne Cocktail. Ingredients: 1 dash The Truth Old Time Aromatic Bitters or Angostura bitters,
    1 sugar cube, 6" twist from a lemon, 5 ounces chilled Champagne. Instructions: Drop 1 dash The Truth Old Time Aromatic
    Bitters or Angostura bitters onto a sugar cube and place in a Champagne flute. Using a channel or paring knife, cut a
    6" twist from a lemon and arrange inside glass. Gently pour 5 ounces chilled Champagne into glass.'
  - 'passage: Title: Slow-Cooked Summer Squash with Lemon and Thyme. Ingredients: 1 lb. summer squash or zucchini, sliced
    crosswise 1/4" thick, 1/2 head of garlic, Zest of 1 lemon, removed in wide strips, 2 sprigs thyme, 1/2 cup extra-virgin
    olive oil, 3/4 tsp. kosher salt, 1 Tbsp. fresh lemon juice. Instructions: Place a rack in middle of oven and preheat to
    350°F. Toss summer squash, garlic, lemon zest, thyme, oil, and salt in a shallow 2-qt. baking dish to combine. Turn garlic
    cut side down, then roast vegetables, tossing 2 or 3 times, until golden brown, very tender, and edges and cut sides are
    crisp, 1 hour and 40 minutes–1 hour and 50 minutes. Let cool slightly, then add lemon juice and toss to coat.'
  - 'passage: Title: Balsamic Truffles. Ingredients: bittersweet chocolate truffle base, 1 tablespoon plus 1/4 teaspoon aged
    balsamic vinegar, Chopped toasted salted hazelnuts. Instructions: Follow recipe for bittersweet chocolate truffle base
    , stirring aged balsamic vinegar into lukewarm cream. Mix in melted chocolate. Chill truffle base and form truffles. Drop
    each freshly coated truffle (or just–formed, uncoated truffle) into bowl of hazelnuts; turn to coat.'
