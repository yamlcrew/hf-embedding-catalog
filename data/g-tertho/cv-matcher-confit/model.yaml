    arrangements*.

    Verizon provides training and development for all levels, to help you enhance your skills and develop your career, from
    funding towards education assistance, award-winning training, online development tools and access to industry research.

    You will be able to take part in volunteering opportunities as part of our environmental, community and sustainability
    commitment.


    Your benefits package will vary depending on the country in which you work.


    *subject to business approval


    If Verizon and this role sound like a fit for you, we encourage you to apply even if you don''t meet every "even better"
    qualification listed above.


    This role is eligible to be considered for the Department of Defense SkillBridge Program.


    Where you''ll be working


