    \ critical IT infrastructure that serves tens of millions of people every single day.\nAs a Meraki Full Stack Engineer,\
    \ you will collaborate with firmware engineers to design, plan, and build new features for our customers. With the help\
    \ of product managers and UX designers, you will construct intuitive and powerful workflows to solve important problems\
    \ for IT professionals around the world.\nMerakis product Dashboard teams are small, fast-moving teams striving to make\
    \ our products unique in balancing their feature-rich abilities and their simplicity. Youll be developing the tools by\
    \ which our customers configure and monitor network devices all over the world. Our full-stack engineers are well versed\
    \ in a wide array of CS concepts and excited to jump around languages, platforms, and all levels of the Meraki stack!\n\
    What you will do:\nDeveloping the tools by which our customers configure and monitor network devices all over the world.\n\
    Collaborate with firmware engineers to design, plan, and build new core product features for our customers.\nWith the\
    \ help of product managers and UX designers, you will construct intuitive and powerful workflows to solve important problems\
    \ for IT professionals around the world.\nResponsible for crafting and building some of the high-impact technology projects.\n\
    Involved in resolving some of the complex scale-related problems\nAccountable for the stability of our product with a\
    \ high customer focus.\nShare your knowledge by giving brown bags, tech talks, and evangelizing engineering standard methodologies.\n\
    You are an ideal candidate if you:\nHave 5+ years of experience writing professional production codeHave 3+ years of experience\
