  - 'When you join Verizon


    Verizon is one of the world''s leading providers of technology and communications services, transforming the way we connect
    around the world. We''re a human network that reaches across the globe and works behind the scenes. We anticipate, lead,
    and believe that listening is where learning begins. In crisis and in celebration, we come together-lifting up our communities
    and striving to make an impact to move the world forward. If you''re fueled by purpose, and powered by persistence, explore
    a career with us. Here, you''ll discover the rigor it takes to make a difference and the fulfillment that comes with living
    the #NetworkLife.


    What you''ll be doing...


    As a Sr Engr Cslt - Data Engineer within the Artificial Intelligence and Data Organization (AI&D), you will manage various
    activities including artificial intelligence, data engineering, operations automation, security remediation and industry
    leading Omni channel technology to improve the efficiency, customer experience and profitability of the company.


    You will analyze marketing, customer experience and digital operations environments to build data pipelines, transform
    data into actionable intelligence. You will turn raw data into usable data pipelines and build data tools and products
    for effort automation and easy data accessibility.


    At Verizon, we are on a multi-year journey to industrialize our data science and AI capabilities. Very simply, this means
    that AI will fuel all decisions and business processes across the company. At 130B+ dollars in annual revenue, this is
    a pioneering opportunity to design and shape AI at scale in the Telco industry. With our leadership in bringing 5G network
    nationwide, the opportunity for AI will only grow exponentially in going from enabling billions of predictions to possibly
    trillions of predictions that are automated and real-time

    Manage all marketing related projects on Big DataCloud platform including design of new applications and training other
    developers.

    Gather requirements, assess gaps, and build roadmaps and architectures to help the analytics driven organization achieve
    its goals.

    Work closely with Data Analysts to ensure data quality and availability for analytical modeling.

    Identify gaps and implement solutions for data security, quality, and automation of processes.

    Support maintenance, bug fixes and performance analysis along the data pipeline.

    Design, build, document, test and implement new data pipelines and analytics. The job involves designing and building
    scalable data pipelines to provide key insights to the front-end applications and agents for quick decision making and
    effective channel orchestration.

    Collaborate in cross-functional teams to source new data, develop schema requirements, and maintain metadata

    Build semantic layer (curated facts), dimension tables for reports and analytics

    Coordination with the offshore team for design and implementation.

    Identify ways to improve data reliability, efficiency and quality

    Use large data sets to address business issues

    Use data to discover tasks that can be automated

    Design and implement fact tables, reports and dashboards using Tableau, Looker and other tools

    Analyze existing Teradata SQL queries for performance improvement.


    What we''re looking for...


    You''re curious about new technologies and the game-changing possibilities it creates. You like to stay up-to-date with
    the latest trends and apply your technical expertise to solve business problems. You thrive in a fast-paced, innovative
    environment working as a phenomenal teammate to drive the best results and business outcomes.


    You''ll need to have:

    Bachelor''s degree or four or more years of work experience.

    Four or more years of relevant work experience.


    Even better if you have one or more of the following:

    3+ years of Database experience in Teradata SQL, Teradata Utilities, SQL Server, SSIS, and OLAP

    3+ years of experience in designing, building, and deploying production-level data pipelines using tools from Hadoop stack
    (HDFS, Hive, Spark, Streaming, HBase, Kafka, Oozie, NiFi etc.) and programming in PythonScala

    1+ year(s) of experience in Cloud data engineering, preferably Google Cloud with Big Query

    Dashboard development experience in Tableau, Qlik andor Looker

    A degree. Master''s degree in Computer Science, Information Systems and  or related technical discipline.

    Teradata Big Data Analytics Certification

    Knowledge of telecom industry

    Experience to working with a distributed team

    Ability to effectively communicate through presentation, interpersonal, verbal and written skills.


    Why Verizon?


    Verizon is committed to maintaining a Total Rewards package which is competitive, valued by our employees, and differentiates
    us as an Employer of Choice.

    We are a ''pay for performance'' company and your contribution is rewarded through competitive salaries, performance-based
    incentives and an employee Stock Program. We create an opportunity for us all to share in the success of Verizon and the
