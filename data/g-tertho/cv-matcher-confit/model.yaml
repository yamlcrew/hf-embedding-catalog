  - 'ERM is hiring a motivated consulting Senior Electrical Engineer, PE with a focus on electrical design and analysis across
    Multiple Locations in the U.S. The position is hybrid with the opportunity for flexibility in working from home & office.
    In this role, you will work closely with multi-discipline teams including project managers, engineers, and scientists
    to contribute to the planning, design, permitting and implementation of engineering projects in the renewable energy and
    power sectors.

    Seeking candidates with Project based Engineering experience, NOT Product based. Must have experience with utility projects
    above 20MW and a background in renewables.

    Projects will include development and review of construction drawings, technical specifications, contract documents, permit
    applications and calculations for renewable energy system components including photovoltaic solar technology, electrical
    substations, battery energy storage systems (BESS), distribution collector systems, and wind turbines. Staff management,
    project controls and management support for consulting and construction projects, including scheduling, labor resourcing,
    and cost estimating, will be a component of this position. Diverse and broad-based experiences, both in office and field
    settings, should be anticipated.

