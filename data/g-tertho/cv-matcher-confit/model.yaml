    - 'ERM is hiring a motivated consulting Senior Electrical Engineer, PE with a focus on electrical design and analysis
      across Multiple Locations in the U.S. The position is hybrid with the opportunity for flexibility in working from home
      & office. In this role, you will work closely with multi-discipline teams including project managers, engineers, and
