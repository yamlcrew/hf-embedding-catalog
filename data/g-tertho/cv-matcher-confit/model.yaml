    \ web backend technologies, like Ruby on RailsCan implement good database design in a relational database (we use Postgres).\
    \ Have experience with customer-centric designWould thrive on a small engineering team and are excited to solve open-ended\
    \ problems across the stack. Are interested in career advancement. Were looking for leaders, whether that means you want\
    \ to be a strong leading individual contributor or you want to grow into a tech lead roleBonus points for any of the following:\n\
    Experience or interest in networkingExperience building cloud-based infrastructure and services (e.g. web applications).\
    \ \nCisco is an Affirmative Action and Equal Opportunity Employer and all qualified applicants will receive consideration\
