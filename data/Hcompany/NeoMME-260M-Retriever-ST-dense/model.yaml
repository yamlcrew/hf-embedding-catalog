  chat_template_jinja: "{#-\n    NeoMME retrieval prompt template. Not a conversation format: NeoMME is an encoder and has\
    \ no chat turns.\n\n    `task` selects the retrieval side. A sentence-transformers v6 `MultiVectorEncoder` routes\n  \
    \  `task=\"query\"` / `task=\"document\"` here when the template declares the variable.\n\n      task=\"query\"     ->\
    \  <query> … N x <mask>       ColBERT-style learned query expansion. <mask> is the\n                                 \
    \                     masked-diffusion fill token. The exporter sets N from the\n                                    \
    \                  checkpoint.\n      task=\"document\"  ->  <doc> …                    Text passages. Image pages take\
    \ the same <doc> prefix\n                                                      followed by one image token placeholder,\
    \ which the processor\n                                                      expands after it knows the patch grid.\n\
    -#}\n{%- if task is not defined -%}\n    {{- raise_exception(\"NeoMME chat templates require task='query' or task='document'.\"\
    ) -}}\n{%- endif -%}\n{%- if task not in ['query', 'document'] -%}\n    {{- raise_exception(\"task=\" ~ task ~ \" is not\
    \ supported: expected 'query' or 'document'.\") -}}\n{%- endif -%}\n{%- if messages is not defined or not messages -%}\n\
    \    {{- raise_exception(\"NeoMME chat conversations must contain at least one message.\") -}}\n{%- endif -%}\n\n{# Collect\
    \ content and validate one retrieval item without imposing batch-level policy. #}\n{%- set state = namespace(text='',\
    \ has_text=false, image_count=0) -%}\n{%- for message in messages -%}\n    {%- set content = message.content -%}\n   \
    \ {%- set items = [{'type': 'text', 'text': content}] if content is string else content -%}\n    {%- for item in items\
    \ -%}\n        {%- if item.type == 'text' -%}\n            {%- if image_token in item.text -%}\n                {{- raise_exception(image_token\
    \ ~ \" is reserved for image documents.\") -}}\n            {%- endif -%}\n            {%- set state.has_text = true -%}\n\
    \            {%- set state.text = state.text + item.text -%}\n        {%- elif item.type == 'image' -%}\n            {%-\
    \ if item.image is not defined or item.image is none or item.image == '' -%}\n                {{- raise_exception(\"NeoMME\
    \ image content must provide an image source.\") -}}\n            {%- endif -%}\n            {%- set state.image_count\
    \ = state.image_count + 1 -%}\n        {%- elif item.type == 'image_url' -%}\n            {%- if item.image_url is not\
    \ defined or not item.image_url -%}\n                {{- raise_exception(\"NeoMME image_url content must provide an image\
    \ source.\") -}}\n            {%- endif -%}\n            {%- set state.image_count = state.image_count + 1 -%}\n     \
    \   {%- else -%}\n            {{- raise_exception(\"NeoMME chat templates do not support content type \" ~ item.type ~\
    \ \".\") -}}\n        {%- endif -%}\n    {%- endfor -%}\n{%- endfor -%}\n\n{%- if state.image_count and state.has_text\
    \ -%}\n    {{- raise_exception(\"NeoMME cannot encode text and images in the same conversation.\") -}}\n{%- endif -%}\n\
    {%- if state.image_count > 1 -%}\n    {{- raise_exception(\"NeoMME accepts one image document per conversation.\") -}}\n\
    {%- endif -%}\n{%- if state.image_count and task != 'document' -%}\n    {{- raise_exception(\"NeoMME image content must\
    \ use task='document'.\") -}}\n{%- endif -%}\n\n{%- set content = image_token if state.image_count else state.text -%}\n\
    {%- if task == 'query' -%}\n    {{- query_token + content + mask_token * 10 -}}\n{%- else -%}\n    {{- document_token\
    \ + content -}}\n{%- endif -%}\n"
