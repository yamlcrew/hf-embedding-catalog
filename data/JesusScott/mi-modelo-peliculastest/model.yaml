widgetData:
- source_sentence: '¿Y dónde están las rubias? - Categoría: Comedia'
  sentences:
  - Dos agentes del FBI se disfrazan de ricas herederas para protegerlas de un secuestro. El caucho y los tacones se vuelven
    sus mejores aliados.
  - El hijo de un comandante nazi entabla amistad con un niño judío al otro lado de la alambrada. Su inocencia los lleva a
    un desenlace devastador.
  - Un hombre judío nacido el mismo día que Jesús es confundido con el Mesías. Su vida se convierte en una parodia de la religión
    y el poder.
- source_sentence: 'Soul - Categoría: Animación'
  sentences:
  - Un joven se casa accidentalmente con una novia cadáver durante un ensayo. La comedia musical explora el amor entre dos
    mundos.
  - Un músico de jazz muere accidentalmente y su alma viaja al mundo antes de nacer. Aprende que la vida es más que la pasión
    y el éxito.
  - Un príncipe herido se ve atrapado en el conflicto entre los dioses del bosque y los humanos que explotan sus recursos.
    Busca la paz en medio de la destrucción.
- source_sentence: 'Psicosis - Categoría: Terror'
  sentences:
  - Un policía de Nueva York asiste a una fiesta navideña en un rascacielos que es tomado por terroristas. Solo y sin armas
    deberá frustrar sus planes.
  - Una joven huye con dinero robado y se hospeda en un motel regentado por un hombre de conducta inquietante. La noche se
    convierte en una pesadilla imborrable.
  - Una coneja policía y un zorro estafador se unen para resolver un caso de desapariciones en una ciudad de animales. Descubren
    una conspiración más grande.
- source_sentence: 'Los padres de ella - Categoría: Comedia'
  sentences:
  - Un novio conoce a los padres de su prometida y descubre que son un agente de la CIA y un cirujano. La cena de presentación
    se vuelve una prueba de fuego.
  - Un escritor acepta cuidar un hotel aislado durante el invierno. La soledad y los fantasmas del lugar desatan su locura
    con consecuencias aterradoras.
  - Un grupo de desconocidos queda atrapado en un motel durante una tormenta y comienzan a ser asesinados uno a uno. La verdad
    sobre sus identidades cambiará todo.
- source_sentence: 'El lobo de Wall Street - Categoría: Drama'
  sentences:
  - Un corredor de bolsa asciende al éxito mediante el fraude y los excesos. Su vida de lujo y drogas termina en un colapso
    judicial y personal.
  - Shrek debe encontrar un heredero para el trono de Muy Muy Lejano mientras enfrenta una rebelión encabezada por el Príncipe
    Encantador.
  - Una joven llamada Asha pide un deseo a una estrella y desata una fuerza mágica que pone en peligro su reino. La valentía
    y la esperanza la guían.
