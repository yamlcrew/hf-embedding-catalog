  widget:
  - source_sentence: কোনো কিছুকে সমতলপৃষ্ঠে ধাক্কা দিয়ে ছেড়ে দিলে সেটা সরল রেখায় চলতে থাকে ।
    sentences:
    - আমরা আমাদের চারপাশে অনেক রকম গতি দেখতে পাই, কোনো কিছু নড়ছে, কোনো কিছু কাঁপছে, কোনো কিছু ঘুরছে, কোনো কিছু সরে যাচ্ছে_
      এই সবই হচ্ছে নানা রকম গতির উদাহরণ । সম্ভাব্য গতির ধরনের কোনো শেষ নেই কিন্তু আমরা ইচ্ছা করলে কিছু কিছু গুরুত্বপূর্ণ ধরনের
      গতির কথা আলাদা করে বলতে পারি। সরলরৈখিক গতি (17691. 1/06107) এটি সবচেয়ে সহজ গতির উদাহরণ । কোনো কিছু যদি সরল রেখার উপর
      চলাচল করে তাহলে তার গতিটি হচ্ছে সরলরৈখিক গতি।
    - 'চিত্র২.০৫: সুতায় বেঁধে একটি পাথর ঘোরানো হলে জুতি এক থাকলেও বেগের পরিবর্তন হয়। প্রশ্ন: পাথরটিকে হঠাৎ ছেড়ে দিলে তখন
      কি সেটা সমবেগে অথবা সমদ্রুতিতে যাবে?'
    - তিনটি বল মিলেও সাম্যাবস্থা তৈরি করা যেতে পারে। একটি ভারী বই একটি দড়ি দিয়ে বেঁধে দুই পাশ থেকে দড়ির দুই প্রান্ত টেনে
      ধরে বইটিকে স্থির অবস্থায় ঝুলিয়ে রাখা সম্ভব (চিত্র ৩.০৩)।
    - দ্বিতীয় অংশটি নিয়ে সমস্যা, কারণ আমরা কখনোই কোনো চলন্ত বস্তুকে অনন্তকাল চলতে দেখি না। ধাক্কা দিয়ে কোনো বস্তুকে গতিশীল
      করে ছেড়ে দিলেও দেখা যায় বাহ্য কোনো বল ছাড়াই শেষ পর্যন্ত বস্তুটা থেমে যায়।
  - source_sentence: ভবিষ্যতের ইলেকট্রনিকস সম্পর্কে ব্যাখ্যা করো।
    sentences:
    - শীতপ্রধান দেশে বাতাসে জলীয় বাষ্পের পরিমাণ খুব কম থাকে এবং সেখানে স্থির বিদ্যুতের প্রভাব অনেক বেশি। ইলেকট্রনিকসের কাজ
      করার সময় নানা ধরনের আইসি ব্যবহার করতে হয়। কিছু কিছু আইসি (Integrated Circuit) Its পিনে অল্প ভোল্টেজের তারতম্যের কারণেই
      নষ্ট হয়ে যেতে পারে।
    - এই অর্ধপরিবাহীর সাথে বিশেষ মৌল মিশিয়ে তাদের যুন্ত করে ট্রানজিস্টার তৈরি করা হয়। এই প্রযুক্তি দিয়ে ইলেকট্রনিকসের একটি
      অভাবনীয় উন্নতি হয়েছে এবং বর্তমান সভ্যতায় এই ইলেকট্রনিকসের একটি অনেক বড় অবদান রয়েছে।
    - ইলেকট্রনিকসের প্রযুন্তি এখনো এগিয়ে যাচ্ছে এবং আমরা ভবিষ্যতে ইলেককউ্রনিকস সার্কিটে অপটিকস বা আলোর সাহায্যে তথ্য বিনিময়সংক্রান্ত
      আইসি দেখতে পাব। একই সাথে প্রোগ্রাম করে
    - যেসব যন্ত্রপাতি আমাদের জীবনকে পুরোপুরি পাল্টে দিয়েছে এই অধ্যায়ে সেই সব যন্ত্রের সাথেও তোমাদের পরিচয় করিয়ে দেওয়া
      হয়েছে। তেজস্কিয়তা ও ইলেকন্রনিকস ৩৪৭ © «ere ora * তেজস্ক্িয়তা ব্যাখ্যা করতে পারব। * আলফা, বিটা ও গামা রশ্মির বৈশিষ্ট্য
      ব্যাখ্যা করতে পারব। * ইলেকট্রনিকসের ক্রমবিকাশ বর্ণনা করতে পারব। * অর্ধপরিবাহী ও সমন্বিত বর্তনী ব্যাখ্যা করতে পারব।
  - source_sentence: সেটি গুরুত্বপূর্ণ নয়, তার কারণ সব গতিই আপেক্ষিক।
    sentences:
    - গতি ৩৫ সমবেগে চলছে না এটা আসলে স্থির এবং অন্য সবকিছু উল্টো দিকে সমবেগে চলছে! কাজেই তাহলে সেই বস্তুটি এ বিন্দুর সাপেক্ষে
      গতিশীল। মূল বিন্দুটি আসলে স্থির না সমবেগে চলছে সেটি নিয়ে আমরা মাথা ঘামাব না। শুধু তাই নয়, আমরা যদি সত্যিকারের স্থির
      কোনো একটি প্রসঙ্গ বিন্দু খুঁজে বেড়াই,তাহলে বিপদে পড়ে যাব।
    - টেবিল ২.০১ 38 54] এখানে একটা বিষয় একটুখানি উল্লেখ করা দরকার। আমরা যখন অতিক্রান্ত দূরত্ব, বেগ কিংবা ত্বরণ নিয়ে আলোচনা
      করেছি,আমরা সব সময়ই একটি আদর্শ পরিবেশ কল্পনা করে নিয়েছি। আমরা ধরে নিয়েছি কোনো ঘর্ষণ নেই এবং একটি বস্তু যখন গতিশীল
      হয়,তখন অন্য কোনোভাবে তার শন্তি ক্ষয় হয় না।
    - আমরা এতক্ষণ বিশেষ কয়েক ধরনের গতির কথা বলেছি; কিন্তু এই গতিগুলোর কারণটি কোথাও বলিনি । পদার্থবিজ্ঞানের সবচেয়ে বড় সাফল্য
      হচ্ছে যে, এটি শুধু যে বস্তুর বিচিত্র গতির 5 কারণটি খুঁজে বের করবে তা নয়, এর গতিটি সুনির্দিষ্টভাবে ব্যাখ্যা করতে পারবে।
    - (ঘ) গরুটিকে দুর্ঘটনা থেকে রক্ষা করা সম্ভব হয়েছিল কি? গাণিতিক যুক্তিসহ মতামত দাও | সংক্ষিপ্ত উত্তর প্রশ্ন ১. সরল স্পন্দন
      গতি উদাহরণ সহ ব্যাখ্যা করো। ২. মহাবিশ্বের সব গতিই আপেক্ষিক ব্যাখ্যা করো।
  - source_sentence: ১১.০৬ চিত্রে স্থির এবং পরিবর্তী রোধের ছবি দেখানো হয়েছে।
    sentences:
    - যে ধরনের রোধের মান একটি নির্দিষ্ট সীমার ভেতরে পরিবর্তন করা যায় সেটিকে পরিবর্তী রোধ বা রিওস্টেট বলে। স্থির রোধের দুটি
      প্রান্ত থাকে, পরিবর্তী রোধে দুই প্রান্ত ছাড়াও মাঝখানে আরেকটি প্রান্ত থাকে, যেখানে পরিবর্তন করা রোধের মানটুকু পাওয়া
      যায়।
    - 'যদি 11,026 চিত্রের পজিটিভ বা নেগেটিভ ভোল্টেজ তৈরি করা। মতো হয় তাহলে পজিটিভটা শৃন্য এবং নেগেটিভটা -1.5 ৬ । প্রশ্ন:
      দুটি 1.5 ৬ ভোল্টের ব্যাটারি দিয়ে 1.5 ৬, 3.0 ৬, +1.5 ৬,_3.0 ৬ তৈরি করো।'
    - 'তখন প্রতিফলনের পর আর আলোক রশ্মিগুলো সমান্তরাল না থেকে চারদিকে ছড়িয়ে পড়ে৷ (চিত্র ৮.০৭) এ ধরনের প্রতিফলনকে অনেক সময়
      ব্যাপ্ত প্রতিফলন বলা হয়। we a ২২ চা ৮৭ Po চিত্র ৮.০৭: মসৃণ পৃষ্ঠে আলো প্রতিফলিত হয় কিন্তু অমসূণ পৃষ্ঠে আলো কিচ্ছুরিত
      হয়।'
