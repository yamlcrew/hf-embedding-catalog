  sentences:
  - 'title: Language Semantic Graph Guided Data-Efficient Learning


    summary: The paper introduces the Language Semantic Graph (LSG), a novel approach to data-efficient learning that leverages
    semantic information from labels. The LSG is used to train an auxiliary graph neural network, which then guides the primary
    model''s training, enhancing the utilization of label knowledge. This method is applicable across various modalities,
    including image, video, and audio, and has shown significant performance enhancement in both Transfer Learning and Semi-Supervised
    Learning scenarios.


    Experiments were conducted on seven standard datasets covering images, videos, and audios, using several deep neural networks
    with different architectures and pretraining datasets. The results show that LSG significantly outperforms other methods,
    especially when labeled data is scarce. It also demonstrates promising potential in semi-supervised settings, achieving
    the best performance across all labeling rates and datasets. When applied to self-supervised pretrained models, LSG shows
    consistent gains. It also improves model performance on both in-distribution and out-of-distribution samples, indicating
    that label semantic relations help the model learn more robust features.


    In video and audio experiments, LSG consistently improves the fine-tuning accuracy across all tasks with limited labeled
    samples. It outperforms other methods, boosting accuracy significantly. For audio experiments, LSG achieves an average
    of 5.56% accuracy enhancement from the baseline, demonstrating its wide applicability across various modalities.


    "LSG consists of two parts: an auxiliary graph neural network that extracts knowledge from the semantic graph and two
    novel optimization objectives that transfer the knowledge to primary models." The authors demonstrate that LSG is applicable
    on image, video and audio models and brings significant performance gains to the model under Transfer Learning and Semi-Supervised
    Learning scenarios.


    weaknesses and questions: The effectiveness of the LSG method relies heavily on the quality and semantic richness of the
    labels. In scenarios where labels are sparse, ambiguous, or not well-defined, the performance of the LSG method could
    be compromised.

    *The LSG method relies heavily on the quality and semantic richness of the labels. How does the quality of the labels
    impact the performance of the LSG method? Could the LSG method be adapted to work effectively with less informative or
    ambiguous labels, and if so, how?


    * The paper primarily focuses on classification tasks. Could the LSG method be adapted or extended to other tasks, and
    if so, what modifications would be necessary?'
  - "title: Concept Bottleneck Models under Label Noise\n\nsummary: The paper is concerned with inherently interpretable models\
    \ called Concept Bottleneck Models (CBMs). These models require extensive concept labeling; however, these labels are\
    \ usually assumed to be perfect. The paper explores how noise in these concept labels affects the final target prediction.\
    \ The authors perform extensive experiments across all three variants of CBMs to show the detrimental effects of concept\
    \ labels. The authors then proposed SAM training to improve concept and target accuracy.\n\nweaknesses and questions:\
    \ - While the experiments are comprehensive for Section 3 and 4. Some of the results are pushed to the appendix (which\
    \ is fine), however it would have been nice to summarise them in brief in the text.\n\n- I enjoyed reading up to Section\
    \ 4. Thank you. However, I would have appreciated some theoretical intuition on why SAM works better (unless I missed\
    \ it).\n\n- The paper performs experiments with CUB and AwA2 datasets, popular benchmark datasets for CBMs. These datasets\
    \ however have a strong correlation between concept labels and the target label. I can imagine label noise to be very\
    \ detrimental (as observed from Figure 2).  The potential observed effect due to label noise might be weaker in the case\
    \ of diverse concepts for each target.\n\n- The paper claims to be first the paper to looking at label noise in CBMs,\
    \ while I would not refute this, I would like to point out the authors to some very relevant papers - [1] (noise added\
    \ to concept labels, similar to some of the exps in Sec3) [2]-(concept robustness and adv attacks)\n\n[1] - Sheth, Ivaxi,\
    \ and Samira Ebrahimi Kahou. \"Auxiliary losses for learning generalizable concept-based models.\" Advances in Neural\
    \ Information Processing Systems 36 (2024).\n\n[2] - Sinha, Sanchit, et al. \"Understanding and enhancing robustness of\
    \ concept-based models.\" Proceedings of the AAAI Conference on Artificial Intelligence. Vol. 37. No. 12. 2023.\n- In\
    \ Sec 6.1 authors show that other CBM variants are also susceptible to label noise. This alings with CBMs, however the\
    \ obvious question for me is, does SAM training improve the robustness? Why or Why not?\n\n- Concept labeling CBMs is\
    \ very difficult, there is an increasing interest in using LLMs for concept annotation. Can the authors kindly comment\
    \ (maybe in Limitations section of the paper), on whether label noise will impact such concept labels. \n\n- Interventions\
    \ are useful aspect of CBMs. What is the impact of interventions to reduce label noise? I assume interventions may be\
    \ less effective. Does SAM improve it? \n\n\nMinor:\n\n- Line 101, now caps for \"We\".\n\n- Figure 3, which model is\
    \ used not specified? Joint/Ind/Seq?"
  - 'title: DREAM: Dual-Standard Semantic Homogeneity with Dynamic Optimization for Graph Learning with Label Noise


    summary: This paper addresses the important and timely problem of robust graph learning under label noise, proposing a
    dynamic reweighting scheme, DREAM, that integrates relational information. During training, it dynamically reweights labeled
    nodes using semantic homogeneity scores. This method is well-motivated and potentially applicable to many graph learning
    settings. Its dual-criteria anchor selection mechanism combines proximity-aware and topology-aware anchors. Experimental
    results show that, on standard benchmark datasets and noise models, this method achieves significant and stable improvements
    compared to several strong baselines.


    weaknesses and questions: Strengths:

    * Semantic homogeneity scores based solely on graph structure relationships, rather than solely on loss values or simple
    auxiliary regularization terms, provide a direct, relation-informed reliability signal.


    * This method addresses a well-known problem in node classification under label noise: instead of relying solely on small-loss
    heuristics or global consistency terms, it explicitly utilizes graph structure relationships to determine which labels
    are trustworthy. This method can be integrated with standard GNN backbones, showing potential value for practical applications
    in handling noisy graph labels.


    * Experiments were conducted on six benchmark datasets and three noise types. Compared to a series of LLN and GLN baseline
    methods, the proposed method achieves significant and stable improvements, and ablation experiments validate the effectiveness
    of each module.


    Weaknesses:

    * The theoretical guarantee of this method requires that the semantic homogeneity score $H(n_i;A(n_i);\tau)$ must be a
    $(\beta,\epsilon)$ approximation of the ideal importance weight $\alpha(x_i,\hat{y}_i,y_i)$. However, this paper neither
    provides the conditions for this approximation to hold nor offers strong quantitative evidence that $H$ can reliably reflect
    the cleanliness of the labels.


    * Proximity-aware anchors relies on noisy labels and is prone to confirmation bias. The nearest neighbor candidate set
    $C_P(n_t)=\{n_i\mid i\in S \wedge y_i=y_t\}$ is constructed based on observed labels (which may have been contaminated).
    In cases of high noise rates, small sample classes, or weak representations in the early stages of training, anchor point
    selection may be biased towards nodes that have been mislabeled as "same kind," reinforcing erroneous supervision signals
    before the embedding becomes discriminative.


    * Equation (2) implicitly assumes that the candidate pool is large enough to select exactly $k_P$ nearest neighbor anchors,
    but the paper does not explain how to handle the situation where $|C_P(n_t)|<k_P$ in scenarios with small categories and
    few labels.


    * The potential sensitivity and stability issues caused by sharpening temperature scaling are not fully explained. The
    homogeneity weight uses $H=s^{1/\tau}$, where $\tau$ defaults to a small value (0.04), and the similarity is normalized
    to $[0,1]$, which makes the weight distribution extremely sharp. Although ablation experiments show that temperature scaling
    has an effect, the paper does not discuss stability strategies, nor does it perform sensitivity analysis on $\tau$ and
    $d_{\max}$ on multiple datasets.

    * Q1: When the class size is small, i.e., $|C_P(n_t)|<k_P$, how do you handle this? Do you directly use all available
    candidate samples, or dynamically adjust the value of $k_P$?


    * Q2: How sensitive is the model performance to the temperature parameter $\tau$ and the geodesic threshold dmax on different
    datasets? Have you tried scheduling $\tau$ during training to mitigate potential training instability issues?


    * Q3: Can you provide empirical evidence that $H$ is related to label cleanliness(e.g., how H changes with training epochs
    when distinguishing clean labels from noisy labels), and that this conclusion still holds true when the noise rate is
    higher ($\ge$ 50%)?


    * Q4: In heterophilous graphs like Flickr (with low homophility), what is the class purity of the topology-aware anchor
    $A_T(n_t)$? If the class mixing of $A_T$ is high, have you considered incorporating a weak class consistency prior (e.g.,
    based on prediction consistency) when selecting topology anchors? Would this approach improve the model''s robustness?'
  - "title: Learning to Label: A Reinforced Self-Evolving Framework for Semi-supervised Referring Expression Segmentation\n\
    \nsummary: This paper proposes Learning to Label (L2L), a framework for semi-supervised referring expression segmentation\
    \ (SS-RES). The method uses a frozen MLLM (Qwen2.5-VL) to generate bounding box predictions for unlabeled image–text pairs,\
    \ which are then fed into a frozen SAM2 to produce soft segmentation priors. These external priors are fused with the\
    \ segmentation model's own predictions via an uncertainty-aware module (SPM), injected into the encoder via stage-adaptive\
    \ gating (SESM), and used to generate pseudo-labels whose pixel-level selection is governed by a DDPG-based reinforcement\
    \ learning agent (RPLE). The actual segmentation network (Swin Transformer + BERT) is the only component trained end-to-end.\
    \ Experiments on RefCOCO, RefCOCO+, and RefCOCOg under 0.1%–10% label budgets show improvements over existing SS-RES methods.\n\
    \nweaknesses and questions: ## Strengths\n\n- **Well-motivated observation.** The analysis of confidence mismatch between\
    \ MLLM priors and model predictions (Figure 1) is insightful and clearly illustrates why fixed-threshold pseudo-labeling\
    \ is suboptimal for this task. The scatter plot effectively demonstrates the sample-dependent nature of disagreement.\n\
    \n- **Practically relevant problem.** Reducing annotation cost for RES is genuinely important, and the semi-supervised\
    \ formulation is a natural direction. The paper clearly articulates why standard SSL methods struggle with referring expression\
    \ segmentation due to referential ambiguity and boundary uncertainty.\n\n- **Clean framework design.** The overall pipeline—external\
    \ prior generation, uncertainty-aware fusion, conditional guidance injection, and adaptive pseudo-label selection—is logically\
    \ coherent and well-structured.\n\n\n## Weakness\n\n- The dominant source of improvement is the external foundation model,\
    \ not the proposed method. This is the most critical concern. Table 1 reveals that the overwhelming majority of performance\
    \ gain comes from simply using MLLM+SAM2 priors, not from the proposed modules (SPM, SESM, RPLE). For further rigorous\
    \ demonstration, more advanced heuristic should be added to the baseline. In my opinion, the common pseudo-label method\
    \ without MLLM little provide the information to demonstrate the effectiveness of the proposed methods Specifically, the\
    \ Baseline (w/ MLLM) uses a fixed mixing coefficient of 0.5, which is an intentionally naive design. I suggest to include\
    \ (a) Baseline (w/ MLLM) with a tuned mixing coefficient, (b) agreement-based filtering (use pseudo-labels only where\
    \ both MLLM and model are confident), (c) any adaptive thresholding method (e.g., FlexMatch, CATM from ST-SGG [1, 2]).\
    \ These comparison will provide how good the proposed modules are when doing semi-supervised learning.\n\n\n- I have concern\
    \ on the RL formulation (RPLE) in terms of the problem's complexity. The state space is 6-dimensional and the action space\
    \ is 2-dimensional. DDPG is designed for high-dimensional continuous control problems—using it for a 6 -> 2 mapping is\
    \ excessive. The authors should claim what is the advantage of using RL approaches compared to the simple adaptive thresholding\
    \ like [1, 2].\n\n- While MLLM and SAM2 are used offline, the overhead of generating priors for all unlabeled data, plus\
    \ the RL agent's training cost, is never reported. \n\n[1] FlexMatch: Boosting Semi-Supervised Learning with Curriculum\
    \ Pseudo Labeling\n\n[2] Adaptive Self-training Framework for Fine-grained Scene Graph Generation\n- Can you add natural\
    \ heuristic baselines—using pseudo-labels only where both the MLLM prior and model prediction are confident (intersection-based\
    \ filtering). \n\n- Given that the state space is 6D and action space is 2D, have you compared RPLE against simpler adaptive\
    \ thresholding baselines? \n\n- The Baseline (w/ MLLM) uses a fixed mixing coefficient of 0.5. What happens when this\
    \ coefficient is optimized via grid search on the validation set?"
  - "title: Learning with Selectively Labeled Data from Multiple Decision-makers\n\nsummary: This paper focuses on the problem\
    \ setting of classification with selective labeled data, that is, the labeled data at hand can be biased because of decision-making\
    \ in the past. This paper defines the problem mathematically and solves this problem from the perspective of the instrumental\
    \ variable (IV) framework. There are two assumption settings: (1) No unmeasured common effect modifiers (NUCEM), which\
    \ is a strong assumption that leads to a clean solution, and (2) Partial identification, where a reasonable solution can\
    \ be obtained. Theoretical analyses of two assumption settings are provided. Furthermore, a practical algorithm for both\
    \ cases is also provided based on weighted empirical risk minimization with calibration guarantee. Synthetic experiments\
    \ show that the proposed method outperforms baselines.\n\n## update after rebuttal\nAfter the rebuttal, I still think\
    \ the idea of this paper is novel. It studies the problem setting extensively theoretically and also provides experimental\
    \ results., Thus, I keep my score (4: accept). The authors clarified in the rebuttal that their work has novelty and also\
    \ admits some current drawbacks of their methods (e.g., computation time).\n\nweaknesses and questions: Strengths\n1.\
    \ Strong theoretical results that improve an understanding of a complicated yet relevant problem setting. It is praiseworthy\
    \ that this paper not only focuses on a restrictive NUCEM assumption but also considers the partial information assumption.\n\
    2. Practical algorithms with theoretical guarantee are provided, which can be relatively easy to implement. \n3. Experimental\
    \ results (although synthetic) show that the proposed method is effective compared with reasonable baselines.\n\nWeaknesses\n\
    1. Proposed method's weakness is not much discussed in my understanding. One might be that it could be computationally\
    \ expensive (I'm not sure). Moreover, the estimation of weight could be incorrect, and we don't see much effect in the\
    \ experiments, whether this can make the proposed method not work well. I find the comment in the paper, why NUCEM lost\
    \ to partial under NUCEM assumption quite interesting that NUCEM requires a ratio estimation. I think such discussions\
    \ could be useful. Or ablation study of the effect of imprecise weight estimation could also be useful. (but I'm also\
    \ aware that the paper is already dense unfortunately).\n1. Could you please comment on the comparison of the computational\
    \ cost of the proposed unified cost-sensitive learning (point), (partial), and vanilla training?\n2. Since many weights\
    \ have to be estimated, how important is the accuracy of weight estimation? Is the solution highly sensitive to this?\n\
    3. Is this the first work to use instrumental variable (IV) framework for selective labeled classification?"
  - "title: Hard Labels In! Rethinking the Role of Hard Labels in Mitigating Local Semantic Drift\n\nsummary: This paper proposes\
    \ to utilize hard labels to both address the massive storage bottleneck and improve performance for dataset distillation\
    \ methods. The paper identifies that reducing cropped views introduce a problem called local-view semantic drift, when\
    \ crops are assigned soft labels that deviate from the ground-truth image label. To solve this, the paper proposes a 3-stage\
    \ training scheme that consists of 2 soft-label stages and a key hard-label stage in the middle that theoretically improve\
    \ the gradient alignment of the two label types. Massive theoretical analysis and a semantic drift framework are provided\
    \ to support the method. Experiments demonstrate state-of-the-art performance and a 100x reduction of storage cost.\n\n\
    weaknesses and questions: Strengths:\n\nThe theoretical framework of the soft-hard alignment is thorough in this paper,\
    \ with in-depth analysis of the Local-View Semantic Drift problem studied in the paper. Meanwhile, the empirical validation\
    \ shows strong effectiveness and efficiency.\n\nWeaknesses:\n- The main method, i.e., training stage B, seems not using\
    \ hard labels for correcting signals, which is the primary motivation of the paper. The method basically uses label smoothing\
    \ + Cutmix, both still creating soft labels.\n- The theoretical part before Sec.3.2 is quite disconnected to the main\
    \ method.\n- The number of compared methods are limited. The authors are suggested to compare 1~2 more (e.g., GIFT).\n\
    - The evaluated datasets are limited to only Tiny-ImageNet/ImageNet-1K, limiting it only in general domains.\n- Minor\
    \ issues: \n  - Notation of $s$ defined for the second time at page 4 stage A.\n  - Table 6 caption: right/left rather\
    \ than top/bottom.\n  - The best-performing $\\alpha$ is annotated wrong in Table 13.\n1. Why is the one-hot labels not\
    \ used for stage B directly?\n2. How is the LS + Cutmix method able to perform gradient correction?\n3. Is there intuitive\
    \ explanation or empirical evidence on how the three stages work to bound the gap in Theorem 3.5?"
  - 'title: Semantic F1 Scores: Fair Evaluation Under Fuzzy Class Boundaries


    summary: This paper introduces Semantic F1 Scores, a family of evaluation metrics for multi-label classification that
    account for semantic similarity between labels. The core idea is to give partial credit when a predicted label is semantically
    related to the true label, instead of counting it as a complete miss as in standard F1. The metric uses a two-step matching
    (predict-to-true and true-to-predict) to compute “semantic precision” and “semantic recall,” which are combined into an
    F1 score. Semantic F1 is designed to be backward-compatible (it reduces to standard F1 when no partial credit is allowed).
    Additionally, to theoretical arguments, the authors conduct an empirical study on eight datasets (synthetic and real)
    and demonstrate that Semantic F1 provides potentially fairer and more informative evaluation in tasks with subjective
    or overlapping labels, correlating more closely with real-world outcomes than classical F1.


    weaknesses and questions: - I think the biggest weakness of the approach is dependency on the similarity matrix. If the
    matrix S is poorly specified or biased, scores could be misleading or unfair, which makes it tricky to use as an evaluation
    metric. The defining similarity may be non-trivial. Similarity derived from label co-occurrence or embeddings might not
    truly reflect conceptual closeness. Results with different S matrices are not comparable.

    - Baseline comparison on real tasks is limited, as on real datasets, evaluation focuses on hard F1 vs Semantic F1, with
    no direct comparison to alternative semantic metrics, which also feels limited in a synthetic study.

    - I''m generally a bit confused by experiments; it is not clear to me what is optimized and what is evaluated, and why
    should I care that Semantic F1 better correlates with the task than hard F1? And what about other soft/semantic metrics?

    - Many labels on Figures 2 and 3 are so small that they are not readable when printed.

    Please, see weaknesses session.'
