  - 'title: Block Rotation is All You Need for MXFP4 Quantization


    summary: This paper presents an investigation into the applicability of existing post-training quantization (PTQ) methods
    for LLMs under the emerging MXFP4 format. The core finding that global rotation-based methods are fundamentally incompatible
    with MXFP4''s block-wise scaling, thus they posit that a simple block-wise rotation (BRQ) is able to mitigate this issue.
    They provide extensive experiments and analysis. While the topic is timely, the paper suffers from a fundamentally incremental
    contribution and a lack of technical novelty that is enough to question its value to the quantization community. The core
    insight is deemed obvious for the target audience, and the solution does not constitute a significant algorithmic advance.


    weaknesses and questions: 1. The central problem and its solution are a straightforward, expected outcome for anyone with
    deep expertise in quantization. Applying a block-level transformation to align with a block-level quantization scheme
    is a natural and almost trivial engineering adjustment, not a novel research contribution. The MXFP4 format, by design,
    uses local block scaling (PoT) to contain outliers. Applying a global operation that deliberately spreads out outlier
    energy directly counteracts the format''s core design principle. Therefore, observing a performance collapse is not a
    discovery; it is a confirmation of a predictable hardware/algorithm mismatch.



    2. The proposed BRQ method is a direct and obvious application of existing concepts. It simply restricts the well-known
    rotation transform to the block granularity defined by the hardware. This does not represent a new algorithm or a conceptual
    breakthrough.


    3. They selected ''datasets and benchmarks''  as the primary area, but there is no new datasets or benchmarks provided.

    NA'
  - "title: Robust Training of Neural Networks at Arbitrary Precision and Sparsity\n\nsummary: Quantization aware training\
    \ (QAT) is a widely used method to prepare models for quantization. To overcome the rounding operation during backward\
    \ pass, QAT uses straight through estimator (STE) which bypasses the gradients in the backward pass outside of the rounding\
    \ operation. This work, characterizes this feature as the backward pass being quantization oblivious. To overcome this,\
    \ the authors present a workaround that exposes the backward pass to the quantization error using a combination of ridge\
    \ regression and affine quantization. Experiments on a wide array of models, and bit regimes shows superior performance\
    \ of the proposed method when compared to plain STE-based QAT.\n\nweaknesses and questions: * **QAT and error minimization:**\
    \ The fundamental hypothesis of this work is that during the backward pass, QAT is oblivious to the quantization error.\
    \ While this is possible, it has been shown by now that STE creates a different type of dynamic that results in weight\
    \ oscillations. And these oscillations have factors that are trying to compensate the errors due to QAT [1,2]. Given this,\
    \ what do the authors make of these explanations? And how does it alter their hypothesis, or not? If not, what is their\
    \ argument?\n\n* **STE beyond 2 bits:** Even if one were to attribute STE for poor performance in extremely low-bit width,\
    \ how is this not manifested to the same degree in higher bit regimes. What is the explanation? Is STE more problematic\
    \ only in extremely low-bit regimes? \n\n* **Ternary quantization with STE:** There are several works that use STE for\
    \ ternary quantization [3,4]. The critique that STE cannot be used for extremely low-bit regimes does not hold up. \n\n\
    * **Presentation clarity:** The ideas, experiments, and results are quite compelling in this work. However, the presentation\
    \ is unclear in many places. There are vague statements, unsubstantiated by evidence (discussions around biological neurons,\
    \ intelligence), and presentation of results makes it difficult to parse them. Many of the interesting results are in\
    \ the Appendix (Fig. 3, Table 1) whereas the main results in Fig. 1 and Fig. 2 are illegible, with no clear captions,\
    \ legends, axes labels. This is unfortunate as it dilutes the impact of otherwise nice contribution. I would suggest improving\
    \ these aspects.   \n\n* L-67: Very vague statement with exaggerated claims. It is by now common knowledge that large,\
    \ quantized models outperform smaller ones. And also the claim of biological intelligence is extremely misplaced. \n\n\
    ### Other comments\n\n* Reference to Figure 1-a in L-37 is not useful as none of the concepts are fully introduced; consider\
    \ dropping this reference or elaborating the caption so that it can independently explain the concepts in the figure.\n\
    \n* L-38: What are the heuristic-based modifications authors are pointing to? No references to back this up. \n\n* L-54:\
    \ Strange sentence; perhaps missing a preposition somewhere. Did the authors mean \"full potential of the theoretically...\"\
    \n\n### References\n\n1. Wenshøj, Jonathan, Bob Pepin, and Raghavendra Selvan. \"Oscillations Make Neural Networks Robust\
    \ to Quantization.\" arXiv preprint arXiv:2502.00490 (2025).\n2. Xie, Weiying, et al. \"Allowing Oscillation Quantization:\
    \ Overcoming Solution Space Limitation in Low Bit-Width Quantization.\" Proceedings of the IEEE/CVF International Conference\
    \ on Computer Vision. 2025.\n3. Choi, Jungwook, et al. \"PACT: Parameterized Clipping Activation for Quantized Neural\
    \ Networks.\" (2018).\n4. Wang, Jinheng, et al. \"1-bit ai infra: Part 1.1, fast and lossless bitnet b1. 58 inference\
    \ on cpus.\" arXiv preprint arXiv:2410.16144 (2024).\nSee weaknesses above."
  - "title: Nearly Lossless Adaptive Bit Switching\n\nsummary: The paper addresses challenges in model quantization for deep\
    \ neural networks (DNNs), focusing on optimizing quantization-aware training (QAT) across multiple bit-widths with weight-sharing.\
    \ To this end, this paper introduces a novel quantization method that exploits the highest integer precision to achieve\
    \ nearly lossless bit-switching, reducing storage without relying on full precision. Key contributions include: (1) Adaptive\
    \ Learning Rate Scaling: A technique that dynamically adjusts learning rates for different precisions to address competitive\
    \ interference and inconsistent gradient issues during one-shot joint training. (2) Double Rounding: An extension for\
    \ one-step rounding quantizer in fixed-precision quantization to improve accuracy. Experimental results on the ImageNet-1K\
    \ dataset show that the proposed methods surpass state-of-the-art approaches in both multi-precision and mixed-precision\
    \ scenarios, achieving higher efficiency and accuracy.\n\nweaknesses and questions: - Some analysis is missing. For example,\
    \ I'm wondering whether the second rounding leads to more quantization errors, as the first rounding is used to produce\
    \ INT8 weights and second rounding is then performed to quantize lower bit-width, the twice quantization is possible to\
    \ cause more clipping errors and rounding errors, some analysis could enhance the strength of proposed methods. \n- Some\
    \ designs should be further clarified, e.g., why ALRS is applied only for the scaling factors? Intuitively, weights of\
    \ small bit-width is induced large gradient variance by STE, and thus the weights of small bit-width should also benefit\
    \ from using smaller LR. \n- Fig. 1 is a bit confusing, some colored arrows are not well explained. \n- This works essentially\
    \ lies in the research of mixed-precision quantization, so I think it is better to compare more MPQ (e.g., HAQ, DNAS,\
    \ LIMPQ, etc) research in the Sec.4. Moreover, some recent papers on multi bit-width quantization are missed on the ,\
    \ e.g., [1] (PTQ-based) and [2][3] (QAT-based), which could be included into the Related Work. \n\n[1] Xu, Ke, et al.\
    \ \"PTMQ: Post-training Multi-Bit Quantization of Neural Networks.\" Proceedings of the AAAI Conference on Artificial\
    \ Intelligence. Vol. 38. No. 14. 2024.\n\n[2] Tang, Chen, et al. \"Retraining-free model quantization via one-shot weight-coupling\
    \ learning.\" Proceedings of the IEEE/CVF Conference on Computer Vision and Pattern Recognition. 2024. \n\n[3] Zhong,\
    \ Yunshan, et al. \"MultiQuant: A Novel Multi-Branch Topology Method for Arbitrary Bit-width Network Quantization.\" arXiv\
    \ preprint arXiv:2305.08117 (2023).\nPlease refer to the weaknesses."
  - 'title: FPTQuant: Function-Preserving Transforms for LLM Quantization


    summary: This paper introduces FPTQuant, a novel PTQ framework designed to mitigate the severe activation outliers in
    LLMs. The authors cleverly design four lightweight FPTs—including a mathematically elegant pre-RoPE transform and MLP
    scaling techniques—that smooth activation distributions without altering the exact mathematical outputs of the unquantized
    model. By co-optimizing these transforms locally and end-to-end, FPTQuant achieves highly accurate static INT4 quantization
    with virtually zero inference overhead, completely bypassing the need for slow, bespoke CUDA kernels.


    weaknesses and questions: Strength:

    1. The block-diagonal pre-RoPE transform is good. Instead of fighting the architecture, exploiting the equivariances of
    modern Transformers to commute with the RoPE matrix is exactly the kind of principled, math-first solution the quantization
    community needs right now.

    2. This method folds transforms directly into the weights. Avoiding writing CUDA kernels for non-standard hardware is
    crucial for real-world deployment and cross-hardware compatibility.


    Weakness:

    1. Claims of "virtually no overhead" are great, but theoretical FLOP reduction isn''t enough. Hardware metrics are needed—like
    e2e latency, TTFT, and decode throughput (Tokens/sec) across varying batch sizes on standard GPUs (A100/H100)—to prove
    that memory bandwidth isn''t secretly being bottlenecked.

    2. Because FPTQuant requires both local and end-to-end training of the transforms, what is the actual wall-clock time
    and peak GPU memory required for the calibration phase? Especially compared to other training-based pts methods like spinquant.

    3. Real-world INT4 usually relies on group-wise quantization (e.g., group size 64/128) to maintain accuracy. Since the
    FPTs use channel-wise scaling to tame activation outliers, they inevitably alter the weight variance within those specific
    groups. It''s a noticeable gap that the paper doesn''t analyze—either theoretically or empirically—whether these transforms
    inadvertently blow up intra-group weight variance. If so, this would severely degrade group-wise quantization fidelity.

    See weakness'
  - 'title: Large Language Models do Not Make Complete Use of Math Reasoning Data


    summary: The paper studies per-item generalization when fine-tuning LLMs on math-reasoning tasks. As training data is
    incrementally increased, many test items that were previously answered correctly flip to incorrect, so net accuracy improves
    only marginally because “newly correct” and “newly incorrect” items roughly cancel. The finding is demonstrated for SFT
    (e.g., Llama-3-8B, Gemma-3-4B on GSM8K/MAWPS) and RL (Qwen2.5-0.5B on GSM8K/MATH8K). The authors quantify a “Union vs
    Final” gap (items solved by any intermediate model vs the final model), show cross-seed “predictive multiplicity” (same
    data, different seeds → different test items solved), and offer a high-level explanation via a “strategy set” view of
    reasoning traces. Ablations suggest sample order and LoRA dropout contribute to divergence across seeds. No new training
    method is proposed; the work is diagnostic/observational.


    weaknesses and questions: – Limited causal explanation: the paper establishes that flips occur, but the proposed “strategy
    set/Rashomon” lens is descriptive and not predictive; it does not isolate necessary/sufficient causes of flipping or quantify
    their contributions (e.g., data conflicts vs optimization noise vs under/over-fitting vs decoding effects).


    – Scope is narrow (math-reasoning, modest model sizes); it is unclear how broadly the phenomenon holds (code, multilingual,
    instruction-following, safety, etc.), or how it scales with much larger base models and longer training.


    – No actionable solution: beyond noting order/dropout effects, the work stops short of proposing methods to reduce flips
    or close the Union-vs-Final gap (e.g., curriculum, data reweighting, conflict detection, checkpoint ensembling, order-invariant
    updates, strategy-diversity regularizers).


    – Experimental controls are thin in places: small number of seeds; limited statistical testing; compute/training-length/early-stopping
    effects not deeply probed; decoding settings (e.g., temperature/self-consistency) only partially explored.


    – The “union” signal naturally suggests simple mitigations (checkpoint ensembling across data-subset steps, EMA over training,
    mixture-of-checkpoints) that are not tried; without testing such baselines, the practical impact remains unclear.


    – Theoretical component does not yield falsifiable predictions (e.g., when flips should increase/decrease given measurable
    dataset/model properties).

    •  What fraction of flips can be attributed to measurable data conflicts (near-duplicates with differing rationales/solutions,
    annotation noise) vs optimization stochasticity? Can you quantify this via conflict detection or per-sample gradient similarity
    analyses?


    •  Can you predict which items will flip when adding data? For instance, are low-margin items (by log-prob gap), longer
    reasoning chains, or particular operation types more flip-prone?


    •  Does the phenomenon persist with substantially larger base models and longer training to convergence? How does it scale
    with training steps/epochs and gradient noise scale?


    •  What is the effect of decoding schemes (temperature, self-consistency, verifier-guided selection, tool-use) on flips
    beyond majority voting?


    •  Do simple mitigations narrow the Union-vs-Final gap: (a) checkpoint ensembling across subset steps, (b) EMA of weights,
    (c) curriculum or order-invariant batching, (d) removing LoRA dropout and fixing order for all conditions, (e) data deduplication/cluster-balanced
    sampling?


    •  Does full-parameter fine-tuning (no adapters) or different PEFT choices alter the flip rate?


    •  Can the strategy-set view be made predictive (e.g., estimating effective strategy entropy per item) and tested against
    flip rates?'
  - "title: Accuracy is Not All You Need\n\nsummary: The authors analyze changes in model predictions as an additional performance\
    \ metric to evaluate quantization schemes applied to large language models (LLaMa2 and Yi). The authors show that during\
    \ model quantization that the predictions for a substantial number of examples change, beyond the limited number of examples\
    \ which labeled incorrect post quantization. Additionally, the authors show that the number of examples that change in\
    \ prediction is correlated with the KL-Divergence between the base and quantized model.\n\nweaknesses and questions: The\
    \ overall results are unsurprising and do not provide additional characterizations of the effects of quantization on model\
    \ performance or example characteristics.\n- It is expected that model predictions with lower confidence are more likely\
    \ to change upon compression. However, the current analysis does not provide insight into how these examples change during\
    \ compression. For example it is not clear if the reason that low confidence examples change in prediction is because\
    \ they are initially close to the decision boundary or if they observe greater change in model confidence during compression.\n\
    - Change in model prediction has been studied both in the context of continual learning and interpretability analysis\
    \ of model training dynamics [1,2]\n\nRelated Work\n1. Toneva, Mariya, et al. \"An Empirical Study of Example Forgetting\
    \ during Deep Neural Network Learning.\" International Conference on Learning Representations. 2018.\n2. Swayamdipta,\
    \ Swabha, et al. \"Dataset Cartography: Mapping and Diagnosing Datasets with Training Dynamics.\" Proceedings of the 2020\
    \ Conference on Empirical Methods in Natural Language Processing (EMNLP). 2020.\n1. Are the flipped examples consistent\
    \ across different compression, quantization schemes, or models? \n2. For a single method scheme with varying degrees\
    \ of compression (GPTQ W8A16 -> GPTQ W4A16; or pruning at different intensities), do the flips increase monotonically,\
    \ consistenlty with increasing degrees of quantization? For example, are the examples that are forgotten at 8-bit quantization\
    \ relearned at 4-bit quantization?\n3. The top margin (difference in probability) metric is used to characterize the model\
    \ performance pre-quantization; A. What does the metric indicate post quantization? B. Does quantization result in a more\
    \ uniform probability distribution? C. Are the shifts in predicted likelihood and confidence larger or smaller for examples\
    \ that were initially higher or lower in confidence?"
  - 'title: Quantization Hurts Reasoning? An Empirical Study on Quantized Reasoning Models


    summary: This paper provides a comprehensive empirical study on the quantization of reasoning models. They evaluate SoTA
    quantization methods across weight-only, weight-activation, and KV cache quantization. Their conclusion is:

    Lossless settings: W8A8 or W4A16 are consistently < 1 % accuracy drop; W4 weight‑only or KV‑cache is “near‑lossless” on
    most models.

    Best algorithms: AWQ for weight‑only, QuaRot for KV‑cache (except small Qwen), FlatQuant for weight‑activation.

    Failure modes: 3‑bit quantization, small models, harder tasks and RL‑trained models (QwQ) are much more fragile.

    No extra thinking: mild quantization does not lengthen CoT while aggressive low‑bit settings do.

    Scaling trade‑offs: 4‑bit large models beat smaller BF16 models in both accuracy‑per‑GB and accuracy‑per‑second.


    weaknesses and questions: 1. No novel ideas are proposed. It is more about empirical study paper. The main contribution
    of this paper is doing experiments for the current quantization algorithms, and conclusion might be change as new approaches
    evolve. This paper would be benefit from this by proposing a leaderboard that support evaluations of any quantization
    algorithms.

    2. It does not really explain why certain quantization algorithms fail or do well. For example, it states "AWQ is preferred
    over GPTQ", "QuaRot is generally preferred over KVQuant*". This paper could be benefit if author can connect those empirical
    conclusions (accuracy drop) with some theoretically justifications and provide some insights in designing new algorithms.'
  - 'title: Unveiling the Potential of Quantization with MXFP4: Strategies for Quantization Error Reduction


    summary: MXFP4 and NVFP4 exhibit a significant gap in fidelity. The authors trace MXFP4''s lower accuracy to its rigid
    power-of-two scaling factors and coarser block granularity, which struggle to preserve outliers. To mitigate this without
    requiring hardware modifications, the authors introduce two software-only techniques, Overflow-Aware Scaling (OAS) and
    Macro Block Scaling (MBS), that improve MXFP4 quantization fidelity without requiring hardware changes. These methods
    reduce the gap between MXFP4 and NVFP4 to roughly one-tenth of its original size.


    weaknesses and questions: Strengths:

    1. The problem addressed in this paper is important and impactful, and has significant value for the community.

    2. The experimental results are substantial: the average accuracy gap is reduced from 10% to 1%.


    Weaknesses:

    I am not very familiar with this field. The methods appear to be sound. Other weaknesses and limitations can be referenced
    in the questions below.

    1. The evaluation appears to omit calibration-based post-training quantization baselines. Modern deployments typically
    rely on algorithms such as GPTQ, AWQ, or SmoothQuant to handle outliers before format conversion. If weights and activations
    have already been smoothed, how much additional benefit would the proposed methods provide?

    2. Could the authors provide token generation latency benchmark results?

    3. Could the authors include a histogram showing the frequency with which the OAS threshold is triggered?'
