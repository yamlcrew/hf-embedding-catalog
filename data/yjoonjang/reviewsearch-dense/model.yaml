  - "title: VARIATIONAL QUANTUM ALGORITHMS ARE LIPSCHITZ SMOOTH\n\nsummary: This paper presents a quite rigorous theoretical\
    \ analysis of the L-smoothness property of VQA objective functions which scales linearly on the # of layers P, providing\
    \ a worst-case upper limit on curvature that holds for general circuits. The authors provide a formal proof of global\
    \ L-smoothness and derive an explicit upper bound on the smoothness constant L. Furthermore, they show that for certainc\
    \ classes of VQAs this bound may take a very simple form, all the way down to be proportional to the depth of the underlying\
    \ circuit. This result is then connected to circuits often assumed to be relevant for practical applications, including\
    \ a diagnostic for ansatz overparameterization and a heuristic for setting near-optimal learning rates. While the contributions\
    \ are welcome and well-supported, the analysis is confined to an idealized, noiseless setting, which limits the direct\
    \ applicability of its conclusions to contemporary NISQ hardware.\n\nThis paper maybe useful since it can help better\
    \ establish, for example, learning rates. $L$, provides an upper bound on the curvature and guarantees that the landscape\
    \ is not infinitely \"spiky and being able to guarantee this it is crucial for gradient-based methods because it ensures\
    \ stability since if I know the maximum curvature, I can choose a learning rate small enough ($\\eta \\approx 1/L$) to\
    \ guarantee that the optimization steps will not wildly overshoot a minimum.\n\nHowever, to my view, this paper does not\
    \ solve any of the ever present issues of VQAs. While this paper provides a valuable formalization of L-smoothness with\
    \ the potential L-informed learning rate similar to many classical ML problems, the more fundamental and unresolved problem\
    \ for VQAs is the lack of a meaningful lower bound on curvature, not the upper one, a condition that manifests as  the\
    \ barren plateau problem where vanishing gradients render optimization intractable regardless of the landscape's theoretical\
    \ smoothness.\n\nweaknesses and questions: (1) The entire analysis is done in an idealized noiseless setting. The authors\
    \ do acknowledges this by establishing the result as a theoretical baseline. However, this is a significant limitation.\
    \ The primary challenge in practical VQA optimization stems from the stochastic nature of the objective function landscape\
    \ induced by shot noise and hardware errors of all shorts. An analysis of L-smoothness in a setting where these dominant,\
    \ non-smoothness-inducing effects are absent provides limited guidance for optimization on actual NISQ devices. The conclusions\
    \ about stable, predictable curvature scaling may not hold when the optimizer interacts with a stochastic estimator of\
    \ the objective function.\n\n(2) The bound is potentially loose since the proof of Theorem 2 relies on the inequality\
    \ $\\|H\\|_2 \\leq\\|B\\|_2$, where $B_{k l}=4\\|M\\|_2\\left\\|G_k\\right\\|_2\\left\\|G_l\\right\\|_2$ is an element-wise\
    \ upper bound on the Hessian matrix $H$. This step can introduce a substantial gap. The paper's own empirical results\
    \ as shwon in Figure 1a show that the measured maximum curvature, $\\tilde{L}_{\\text {max }}$, is often only a small\
    \ fraction of the theoretical upper bound $L_{\\text {upper }}$. So while the bound correctly captures scaling, its significant\
    \ looseness warrants a more detailed theoretical investigation maybe. The analysis could be strengthened by discussing\
    \ the conditions under which the inequalities in the proof become equalities and what circuit physical properties (entanglement\
    \ structure, parameter correlations) might govern the magnitude of this gap.\n\n(3) The empirical ground truth for maximum\
    \ curvature, $\\tilde{L}_{\\text {max }}$, is estimated by taking the maximum Hessian norm over 1000 random parameter\
    \ samples. While Appendix D. 2 provides a reasonable justification for the stability of this estimate, this methodology\
    \ cannot guarantee that the true global maximum of $\\left\\|\\nabla^2 f(\\theta)\\right\\|_2$ has been found in general.\
    \ For that problems where the global optimizer is known are useful testbeds since hiigh-dimensional landscapes may contain\
    \ rare and isolated regions of extreme curvature that are unlikely to be captured by uniform random sampling. \n\n(4)\
    \ The proposed heuristic is designed to set a single global learning rate. However, modern optimization heavily relies\
    \ on adaptive methods like adam. So, while the existence of such a constant is proven, this framework is somewhat misaligned\
    \ with the reality of modern, large-scale optimization unless we want to restrict ourselves to only talk about quantum\
    \ optimization in isolation. As noted in the literature, e.g. https://arxiv.org/abs/2210.02418 for many typical problems,\
    \ objective functions rarely satisfy uniform smoothness assumptions in a way that is practically useful their gradients\
    \ may only be locally Lipschitz continuous, or the local curvature can vary dramatically across the parameter space. Of\
    \ course, the VQA objective is usually globally L-bounded, as shown in this paper. But a global constant $L$, determined\
    \ by the region of maximum curvature is excessively conservative for the majority of the landscape as far as using it\
    \ for thelearning rate. Standard gradient descent with a step size derived from this global $L$ (e.g., $\\eta \\approx\
    \ 1/L$) would take impractically small steps thus leading to slow convergence. This is precisely why SOTA optimizers really\
    \ care to account for local geometry. The paper's proposed learning rate heuristic, while nice in principle, still provides\
    \ a global rate, which does not align with modern optimization paradigms. The analysis would be significantly strengthened\
    \ by contextualizing its findings within more modern frameworks, such as local or relative smoothness of the VQA objective\
    \ in this sense.\n(1) How do you expect the main results and particularly the predictable linear scaling of curvature\
    \ with depth, to change in the presence of realistic shot noise and hardware noise? This is super crucial. Does the concept\
    \ of L-smoothness remain a useful descriptor for the stochastic objective function that an optimizer actually interacts\
    \ with?\n\n(2) Could you provide more theoretical insight into the large gap between the derived upper bound $L_{\\text\
    \ {upper }}$ and the empirically observed $\\tilde{L}_{\\text {max }}$ ? Does this gap depend on properties not captured\
    \ by the bound, such as the circuit's entanglement capacity or the locality of the observable?\n\n(3) The trigonometric\
    \ polynomial proof route in Appendix A. 6 bounds the Fourier coefficients as $\\left|d_\\omega\\right| \\leq\\|M\\|_2$.\
    \ Given that these coefficients have a specific structure ( $d_\\omega=\\left\\langle u_\\omega\\right| M\\left|v_\\omega\\\
    right\\rangle$ ), could a more refined analysis that does not resort to this uniform worst-case bound yield a tighter\
    \ overall smoothness constant? These trigonometric polynomials, note, are actually Hermitian trigonometric polynomials\
    \ in $d$ complex variables and the optimization takes place over the torus $\\mathbb{T}^d$. does this not induce some\
    \ \"structure\" to be exploited so as to further bound $L$? \n\n(4) Regarding the learning rate heuristic, would it be\
    \ more effective to use the calibrated effective smoothness constant, $L_{\\rm  effective}$, to rescale the global learning\
    \ rate of an adaptive optimizer like adam, rather than using it directly in a vanilla SGD context?"
  - "title: Text Has Curvature\n\nsummary: The paper is dedicated to the question of intrinsic curvature of discrete textual\
    \ data and asks, whether we could define a practical measure for its estimation? The authors claim that curvature should\
    \ be a property of string data itself rather than an artifact of specific embedding space (hyperbolic, spherical etc.)\
    \ and propose \"Texture,\" a measure of curvature primitive that measures how left and right contexts interact in-context.\
    \ The authors claim three contributions: (1) empirical and theoretical justification, proving that semantic inference\
    \ in natural corpora is non-flat; (2) a formal definition of Texture as a signed curvature field via optimal transport;\
    \ and (3) practical applications for long-context inference via pruning (CURVPRUNE) and retrieval (CURVFLAG).\n\nweaknesses\
    \ and questions: Strengths:\n\n- The paper addresses an important question, that hasn't attracted much attention: what\
    \ does curvature mean for text itself, independent of embedding spaces. \n\n- The theory is rather sound and interesting.\
    \ The use of holonomy and contextual evidence interaction (CEI) as falsifiable null hypotheses is methodologically strong.\
    \ By testing against coherence-destroying controls (suffix-swap, local-shuffle), the authors provide empirical evidence\
    \ that an approach is theoretically motivated.\n\n- The paper shows interesting applications of their curvature estimates\
    \ with some performance improvements.\n\nWeaknesses:\n\n- The paper claims are somewhat misleading. Initially they state\
    \ that their curvature measure must be independent from the target model's choice of embedding space. Although it's independent\
    \ from the target model the approach is evaluated at, it appears to be dependent on the choice of bidirectional encoding/infilling\
    \ model, isn't it? ($\\textit{distilroberta-base}$ in this case)\n\n- While the paper claims to establish discrete curvature\
    \ at the word level in the abstract, the notation is somewhat ambiguous with later claims being made for token-level representations.\
    \ Moreover, although authors claim to take a union of Top-K tokens with an intention to preserve the support -- however,\
    \ I didn't find any discussion related to the choice of K to be used. The use of character-level / byte-level models for\
    \ their approach looks rather more sound [1, 2]. \n\n\n- The computational cost of computing Texture (solving Sinkhorn\
    \ scaling per slot) may be prohibitive for very long contexts. The paper does not provide a thorough cost-benefit analysis.\n\
    \n- The paper lacks extensive ablation on the choice of key hyperparameters (support size K; context radii L, R; infilling\
    \ model) and their effects on curvature sign and magnitude. All the experiments are limited to Llama-3-8B.\n\n\nThe appendices\
    \ provides open-sourced code samples for reproduction, algorithmic details, and additional experiments.\nAlthough the\
    \ topic is interesting, I think the paper would benefit from additional revision and discussion of tokenization biases\
    \ and their impact on curvature estimates and experimental evaluation with ablations on the choice of hyperparameters\
    \ and the sensitivity of their approach to these choises. Overall, I believe the work is still quite immature and is not\
    \ yet ready for publication.\n\n\n[1] Juan Luis Gastaldi, John Terilla, Luca Malagutti, Brian DuSell, Tim Vieira, & Ryan\
    \ Cotterell (2025). The Foundations of Tokenization: Statistical and Computational Concerns. In The Thirteenth International\
    \ Conference on Learning Representations, ICLR 2025, Singapore, April 24-28, 2025.\n\n[2] Jonathan Hayase, Alisa Liu,\
    \ Noah A. Smith, & Sewoong Oh (2025). Sampling from Your Language Model One Byte at a Time. arXiv preprint arXiv: 2506.14123.\n\
    - Is curvature dominated by local-interactions only, i.e. we should primarilly consider small L and R?\n\n- How is $s_{ref}$\
    \ chosen in Eq.(2)? Is the condition in Certificate I necessary or sufficient?"
  - "title: Debiasing Mini-Batch Quadratics for Applications in Deep Learning\n\nsummary: This paper demonstrates a systematic\
    \ bias in stochastic 2nd order approximation of empirical risk for neural networks. The study start from an observation\
    \ showing that a particular curvature structure on minibatch Hessian is biased towards underestimation. Then, authors\
    \ proposes a debiasing method.\n\nweaknesses and questions: I believe the notion of unbiased estimate is not well defined\
    \ and studied. Define the Hessian associate with full-batch training loss as  $$H(x) = \\frac{1}{n} \\sum_{i=1}^n \\nabla^2\
    \ f_i(x)$$. Similarly, we define the unbiased estimate of this matrix as $$H'(x) = \\frac{1}{m} \\sum_{k=1}^m \\nabla^2\
    \ f_{i_k}(x)$$ where $i_k$ are uniformly drawn from $\\{1,\\dots, n\\}$. \nFor each fixed vector $d$, we have $$E d^\\\
    top H' d^\\top = d^\\top H d$$. Thus, the **directional curvature**, defined in the paper, is unbiased. But, why this\
    \ paper observe a bias in the estimate? The main issue is that they consider random directions $d$ depending on minibatches.\
    \ I do not know why we need to choose random $d$s? \n\nI believe the quantity of interest is not well defined and motivated,\
    \ here. It is easy to provide an unbiased estimation of  $q$, directional curvature and directional slop. But, the authors\
    \ want to estimating another quality that they do not exactly defined and it is not clear how its estimation connect with\
    \ Newton's method or Laplace approximation. \n\nIf you want to estimate the maximum/minimum eigenvalue of the Hessian\
    \ or even its condition number, the empirical Hessian provides an asymptotically unbiased estimate (see for example https://arxiv.org/pdf/1912.10754).\n\
    - I recommend to replace $u_1$ and $u_2$ in Figure 1 by leading eigenvectors of full-batch Hessian to better grasp my\
    \ comment in weaknesses. I expect to see that increasing batch size will lead to a better approximation of the curvature.\
    \ \n- What is exactly the quantity that you want to estimate and why it is important to estimate? Directional curvature\
    \ on which random directions?\n- What do you exactly mean by bias? To prove an estimate has bias, we need to take average.\
    \ But, experiments in Figure 1 are not computing an average. How can I conclude from these experiments that the estimate\
    \ is biased?"
  - "title: What's the Magic Word? A Control Theory of LLM Prompting\n\nsummary: This work presents a control perspective\
    \ of the LLM steerability by introducing the concept of $k-\\epsilon$ controllability. They also proved a bound on the\
    \ controllability of self-attention in terms of the singular values of its weight matrices. In addition, several experimental\
    \ studies have performed to compute the $k-\\epsilon$ controllability of LLMs (Falcon-7b, Llama-7b, Falcon-40b). The authors\
    \ conclude that LLMs are very controllable and the control prompts of 10 tokens or less are sufficiently enough to ensure\
    \ the LLM output the target token.\n\nweaknesses and questions: Section 4 only considers a self-attention head, which\
    \ is quite simple and limited (compared to the current model used in LLM). What are the difficulties in generalizing such\
    \ results to a more complex model?\n\nThe presentation of Section 4 can be further improved. The relationship between\
    \ state controllability (Definition 7) and $k-\\epsilon$ controllability (Definition 6) should be discussed, i.e., implications\
    \ of your theory result in Section 4. In addition, I am confused about some notations: are $u_i$, $x_i$ the embeddings\
    \ of the tokens? Previously the u and x are presented as tokens, it does not make sense to make $\\|u_i\\|\\le 1$ and\
    \ $\\|x_i\\| \\le 1$ if they are tokens. In addition, is this assumption valid in real LLMs? \n\n\nAlthough introducing\
    \ the controllability of LLM from a control perspective is interesting, the experimental results of checking the controllability\
    \ of the LLMs are not very exciting given the existing results from previous work [Zou 2023]. The experiment setup is\
    \ almost identical to GCG work and the obtained results are also within expectation. Instead, proposing a new method to\
    \ study the controllability of black-box LLMs will be more interesting.\n1. What are the connections between state controllability\
    \ (Definition 7) and $k-\\epsilon$ controllability (Definition 6)? Does the former imply the later?\n2. Are the assumptions\
    \ $\\| u_i\\| \\le 1$ and $\\| x_i \\| \\le 1$ realistic? If not, is your results in Section 4 still hold?"
  - "title: Uncertainty-Aware LLM Probing\n\nsummary: The authors examine how effective uncertainty quantification methods\
    \ are at quantifying the uncertainty of LM probes, and design their own gradient-based quantification method. They find\
    \ that no method is robust to domain shifts, but that their method can detect OOD effectively.\n\nweaknesses and questions:\
    \ 1. The writing overall tends to be unclear and not well-organized. Many sentences lack specificity or need to be better\
    \ defined. (ex. Line 58 “turns out to be sub-optimal”—how? Lines 75-77, “Based on evaluations on uncertainty quantification\
    \ in traditional ML, we would expect the uncertainty methods to work reliably here”—which evaluations, and why?)\n2. Some\
    \ of the results would benefit from further analysis, as inconclusive results are reported without investigation into\
    \ the cause. For instance, lines 313-314, “More precisely, we sometimes observed very high performance, but very low one\
    \ at other times”, does not present any hypothesis for why this was the case.  \n3. The performance benefit on ID data\
    \ does not appear to be consistent and significant. It only outperforms all other methods in “average rank” with 2/5 models.\
    \ Figure 2 also suggests to me that these metrics all achieve similar scores, which does not present a compelling case\
    \ for using ADGrad over other established methods.\n4. While OOD data detection is useful, it is not immediately obvious\
    \ why this should be compared to uncertainty quantification methods as baselines and not baselines for OOD data detection.\
    \ This seems like a separate application.\nWhy report the average rank of the scores and not simply average over all categories?\
    \ This seems somewhat arbitrary."
  - "title: Representational Curvature Modulates Behavioral Uncertainty in Large Language Models\n\nsummary: The paper argues\
    \ that straighter hidden-state trajectories in LLMs are associated with lower next-token uncertainty. It shows that this\
    \ curvature–entropy link is strongest in middle layers, emerges during training, and can be partly controlled with perturbations\
    \ or regularization, suggesting that trajectory straightening may play a functional role in prediction rather than being\
    \ just a descriptive pattern.\n\nweaknesses and questions: **Strengths:\L\L    **\n\n1. This paper checks where the studied\
    \ effect is strongest, how it emerges over training, and whether trajectory-aligned perturbations selectively change entropy\
    \ while misaligned perturbations do not. That makes the mechanistic claim meaningfully stronger than a simple observational\
    \ result.\n\n**Weaknesses:**\n\n1. The main variables in the study are scalars, ie, contextual curvature, computed over\
    \ a local trajectory window, and next-token entropy. That makes the story elegant, but also lossy: very different geometric\
    \ structures can share similar curvature, and very different output distributions can share similar entropy. So the paper\
    \ may be capturing a real effect while still missing the richer mechanism underneath it.\n\n2. The regularization experiments\
    \ are done on small-scale LLMs, and the paper says outright that it remains untested whether the same relationship holds\
    \ for larger foundation models, different architectures, multimodal systems, or more heterogeneous datasets. That matters\
    \ a lot here, because the paper is close to proposing a general principle of autoregressive prediction. Right now, I think\
    \ the evidence is good for “this happens in the studied setting,” but weaker for “this is a broad law of LLM computation.”\n\
    \n3. Even if curvature regularization reliably lowers entropy, the paper does not show that this improves calibration,\
    \ robustness, task accuracy, or downstream usefulness. And because validation loss stays similar, one interpretation is\
    \ that it mostly reshapes probability mass among wrong answers rather than improving decision quality.\n* The regularization\
    \ result makes curvature look less like a correlate of entropy and more like a direct control variable. If entropy changes\
    \ while validation loss stays the same, why shouldn’t we read this as evidence that curvature is effectively determining\
    \ uncertainty?\n\n\n* The observation that middle layers are both straightest and most predictive of entropy sounds reminiscent\
    \ of an information-bottleneck story, where intermediate representations compress context into a task-relevant predictive\
    \ code. Do you see your result that way, or do you think “trajectory straightening” is a different phenomenon from compression\
    \ in the information-bottleneck sense?"
  - 'title: Conf-Gen: Conformal Uncertainty Quantification for Generative Models


    summary: The authors present an extension of conformal risk control (CRC) which is itself an extension of conformal prediction
    (CP), suited to obtaining performance guarantees for the answers provided by LLMs, in the case where there is a set of
    exchangeable (input, ground_truth) pairs. One has to also interpret the LLM output to form a set or sequence of candidate
    answers parametrized by a conservativenss parameter lambda (e.g., to select the most promising candidates) and provide
    both a way to obtain a score for each candidate answer and a way to evaluate how good this output is given a ground truth
    answer. A calibration method then allows to choose lambda to obtain a required degree of expected goodness on a new example
    from the same distribution.


    weaknesses and questions: Soundness and originality


    This paper allows doing a form of calibration with conformal guarantees on LLM outputs in settings not considered before,
    which makes comparisons difficult in several of these settings.


    The experiments suggest that the theoretical guarantees hold.


    The paper appears to be very sound and original.


    Presentation


    The paper does a good job of presenting relevant prior work.


    The formal aspect of the paper also appears much above the ICML average and I did not detect any issue on that front,
    although I did not read the appendix.


    More generally, everything is very clear.


    Significance


    This extension of conformal prediction seems relevant for many LLM-related tasks and could thus be impactful.


    See the key questions for authors.

    One limitation I would note is that the kind of data stream on which LLMs are actually applied is not necessarily exchangeable,
    invalidating the core assumption behind CP. But the guarantees may be useful in practice nonetheless, e.g., to obtain
    conservative safety guarantees. Another CP limitation of course is that these are only guarantees in average, not for
    a particular query. This is of course not a specific issue with this paper, but it may limit the usefulness of this family
    of approach, e.g., in high-stakes domains like medical decision-making. Please share any thoughts on these two issues
    (non-exchangeability and average-guarantees).'
  - "title: Local Curvature Descent: Squeezing More Curvature out of Standard and Polyak Gradient Descent\n\nsummary: Convexity\
    \ and L-smoothness are standard assumptions in optimization literature which are useful for easier analysis of optimization\
    \ algorithms and determining the right algorithm parameters. These global conditions may not always take local differences\
    \ in the curvature into account. This paper proposes new analogues of the assumptions to incorporate certain kinds of\
    \ local curvature information. The paper also proposes modifications of gradient descent using matrix valued step sizes\
    \ to take advantage of the modified assumptions.\n\nweaknesses and questions: The first-order convexity condition and\
    \ L-smoothness imply that $$ f(y) + \\langle \\nabla f(y), x-y\\rangle \\leq f(x) \\leq f(y) + \\langle \\nabla f(y),\
    \ x-y\\rangle  + \\frac L2 || x-y||^2.$$ The authors' assumption 2.1 modifies these inequalities by adding the term $\\\
    frac12 || x-y||^2_{\\mathbf C}$ to the lower bound and upper bound for $f(x)$ provided by these inequalities (since $\\\
    frac12 || x-y||^2_{\\mathbf C+L\\mathbf I} = \\frac12 || x-y||^2_{\\mathbf C} +  \\frac L2 || x-y||^2$). Thus, assumption\
    \ 2.1 seems to be more general than L-smoothness but it is less general than convexity.\n\nIn the standard analyses of\
    \ GD, L-smoothness guarantees a sufficient decrease with each step (with the right step size) and convexity ensures that\
    \ that decrease pushes us towards the minimizer. The two inequalities balance each other in a crucial way. This work exploits\
    \ that tradeoff. However, it is not surprising that if the same term is added to both the lower bound and upper bound\
    \ of $f(x)$ then they will cancel each other out and the standard convergence proofs will still go through. \n\nFurthermore,\
    \ if $f$ is twice differentiable, assumption 2.1 is actually equivalent to\n$$\\mathbf C(x) \\preceq \\nabla^2 f(x) \\\
    preceq \\mathbf C(x) + L_C \\mathbf I.$$ This follows from the same kind of standard arguments used to show that convex\
    \ functions have positive semidefinite Hessians. Having observed this second order condition, many of the remarks that\
    \ the authors make follow directly. The case when $\\mathbf C = 0$ is the standard case with convexity and L-smoothness,\
    \ and the case when $L_C=0$ is the realm of second order methods like Newton's method. My impression is that to give any\
    \ useful advantage over standard GD, the map $\\mathbf C(x)$ will have to approximate the Hessian $\\nabla^2 f(x)$. But\
    \ then the algorithms provided do not seem to be very useful unless there is a good way to approximate the Hessian.\n\n\
    LCD1 actually just seems to be a version of Newton's method where the Hessian is overestimated by its upper bound $\\\
    mathbf C(x) + L_C \\mathbf I$ to make it more stable. The convergence rate provided for LCD1 is the same as GD (unless\
    \ $L_C = 0$, in which case it is pure Newton's method anyway), which does not provide any new insights either. The authors\
    \ present LCD2 as a generalization of Polyak's step size, but the step size $\\beta_k$ in that case does not even have\
    \ a closed form. Computing $\\beta_k$ itself requires an optimization problem to be solved at each step, and the benefits\
    \ of doing that are not clear. LCD3 has a closed form step-size but there are no convergence results provided for it,\
    \ so it's not clear how well it performs.\n\nThe assumption could still have been justified with examples of interesting\
    \ functions that satisfy assumption 2.1 in non-trivial ways. Unfortunately, that does not seem to be the case. One of\
    \ the curvature matrices specified for each of the examples 6.1-6.4 is just the Hessian. For examples 6.2 and 6.4, $\\\
    nabla f(x) \\nabla f(x)^\\top$ is proposed as another candidate for the curvature matrix, but these kinds of approximations\
    \ of the Hessian are already covered by quasi-Newton methods like Berndt–Hall–Hall–Hausman algorithm.\n\nThe experiments\
    \ are also only performed on these trivial examples and authors compare their proposed step sizes only against Polyak\
    \ step size. The first experiment is on a strongly convex and L-smooth function, which is covered by the classical assumptions,\
    \ and the optimal method for which would have been a momentum-based algorithm like Nesterov's accelerated gradient descent.\
    \ The second experiment chooses the Hessian as the curvature matrix, reducing it to the case where second order methods\
    \ would perform better.\n\nOverall, the assumption proposed in the paper does to offer many new theoretical insights nor\
    \ do the algorithms proposed offer practical advantages over existing algorithms.\n- Can the authors comment on the second\
    \ order characterization of assumption 2.1? \n- What is the time complexity of LCD2 compared to Polyak step size? Specifically,\
    \ how does the computation of $\\beta_k$ affect the complexity?"
