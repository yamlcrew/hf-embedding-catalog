    \ a bracket for $\\mathbb E[x_i^2]$. \n\nThe presentation of the proof for Theorem 5 was slightly jarring (due to Lemma\
    \ 11, Lemma 12 appearing in the proof), but there also doesn't seem to be a good way to include them (since referring\
    \ to the two lemmas requires the upper bounds, and flipping back a page is also inconvenient). Maybe a solution is to\
