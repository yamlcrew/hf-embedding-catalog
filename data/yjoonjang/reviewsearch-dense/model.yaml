  - 'title: Complexity Analysis of Normalizing Constant Estimation: from Jarzynski Equality to Annealed Importance Sampling
    and beyond


    summary: This paper provides a full theoretical analysis of the error in Annealed Importance Sampling (AIS), accounting
    for both the sampling process that generates particles and the estimator of the normalizing constant computed from these
    samples. The authors derive a general upper bound on the estimation error as a function of the prescribed probability
    path that guides the sampling process. Two important path choices are examined: the standard geometric interpolation path,
    which is shown to lead to exponential complexity in the difficulty of the problem, and the reverse diffusion path, which
    achieves only polynomial complexity—provided oracle access to score functions (otherwise, an additional approximation
    error appears). The difficulty of the problem is quantified in terms of the between-mode distance of the target distribution.


    weaknesses and questions: The writing could be clearer in some parts, but overall the paper is clear.

    Q1. Theorem 4 is particular to the geometric interpolation path? Is it normal that the number of samples $N$, the number
    of SMC iterations $M$, and the discretization of the Langevin process, do not appear in the error bound (Eq 11)?'
  - 'title: Stronger Neyman Regret Guarantees for Adaptive Experimental Design


    summary: This paper explores efficient ATE estimation in adaptive experimental designs. The authors focus on Neyman regret,
    which quantifies the variance difference between the inverse-propensity-weighted (IPW) estimator under the proposed adaptive
    design and the best fixed design in hindsight. Prior work (e.g., Dai et al., 2023) established a sublinear $O(\sqrt{T})$
    bound on Neyman regret. This paper strengthens that result, achieving an $O(\log T)$ bound under slightly stronger assumptions.
    The analysis is further extended to contextual (multigroup) settings, introducing a method that ensures $O(\sqrt{T})$
    regret across multiple overlapping subpopulations. The approach is validated both theoretically and empirically.


    weaknesses and questions: None.

    None.'
  - "title: Theory on Score-Mismatched Diffusion Models and Zero-Shot Conditional Samplers\n\nsummary: This paper provides\
    \ a non-asymptotic convergence theory for diffusion models with a mismatched score function. The results can be applied\
    \ to zero-shot conditional samplers, especially linear conditional models. The authors also propose the Bias-Optimal (BO)\
    \ DDNM sampler and provide a comparison with the previous algorithms.\n\nweaknesses and questions: - Assumption 2 requires\
    \ an upper bound on the score estimation error $\\epsilon^2 = \\tilde{\\mathcal{O}}(T^{-2})$, which could be restrictive\
    \ compared to the previous literature (e.g., Li et al. 2024b) which applies to any $\\epsilon$. \n- The in-line equations\
    \ in Section 2.1 and Section 5 are hard to follow. I suggest the authors re-organize the equations for better readability,\
    \ especially by highlighting the definitions and differences of $q$, $p$, and $\\hat{p}$.\n- The big-O notation in this\
    \ work is confusing. To name a few, in Assumptions 3 and 4, should $(1-\\alpha_t)^m \\mathbb{E}[\\cdot] = O((1-\\alpha_t)^m)$\
    \ be equivalent to $\\mathbb{E}[\\cdot] = O(1)$? Or do the hidden constants in these assumptions implicitly depend on\
    \ $(1-\\alpha_t)^m$? In Definition 1, the noise schedule needs to satisfy $\\bar{\\alpha}\\_T = o (1/T)$ which is defined\
    \ as an asymptotic bound $\\lim\\sup_{T\\to\\infty} |\\bar{\\alpha}_T / (1/T)| \\to 0$, while Theorem 1 presents a non-asymptotic\
    \ analysis. How does the asymptotic assumption apply to the non-asymptotic analysis? I suggest the authors clarify the\
    \ notations or even explicitly write the constants' dependency on the hyperparameters if possible. \n- Does $1-\\alpha_1=\\\
    delta$ in equation (8) contradict with $1-\\alpha_1 \\lesssim \\frac{\\log T}{T}$ in Definition 1? What can we obtain\
    \ from Theorem 1 if $\\alpha_t$ is chosen as (8)?"
  - 'title: The Number of Trials Matters in Infinite-Horizon General-Utility Markov Decision Processes


    summary: The paper analyzes the impact of the number of trails in estimating the objectives for GUMDPs. For both the discounted
    and average settings, it is shown by examples that there are mismatches between the finite-trial estimates and the actual
    infinite-trail objectives. Bounds on the mismatches are provided, with numerical results supporting the theoretical claims.


    weaknesses and questions: None

    In Fig 3b, it looks like there are some discontinuities in the performance of $M_{f, 3}$ around $\gamma=0.9$ where the
    finite-trail performance seems to diverge away from the infinite-trail one, but then converges back to it. Is that expected
    from theoretical analysis?'
  - "title: The Minimax Rate of HSIC Estimation for Translation-Invariant Kernels\n\nsummary: The rate at which HSIC can be\
    \ estimated is an important and open problem, in this paper, the authors prove that\nthe minimax optimal rate of HSIC\
    \ estimation for Borel measures is $\\mathcal{O}(n^{-0.5})$ with M>=2 components, which is very important as existing\
    \ conclusion only holds for M=2. Other byproducts can be naturally introduced, implying the minimax lower bound for the\
    \ estimation of\ncross-covariance operator, which can be further specialized to get back the minimax result on the estimation\
    \ of the covariance operator.\n\nweaknesses and questions: 1. Overall, the paper is not easy to follow as the paper's\
    \ main contribution seems to be the proof part. \n2. I wouldn't say it is the weakness or the author's problem, as this\
    \ is a theoretical paper, experiments are not necessary. Still is it possible to design toy experiments to validate the\
    \ conclusions in the paper?\nNA"
  - 'title: Active Treatment Effect Estimation via Limited Samples


    summary: Experimental design for estimating treatment effects does not generally have strong finite-sample guarantees,
    especially as the dimensionality of the covariates grows. Recent works implement experimental design based on leverage
    scores. This work proposes an alternative approach called IRD, which helps achieve a sample complexity for the estimation
    error that is linear in the covariate dimensionality. The method is validated with a variety of standard semi-synthetic
    experiments.


    **Update after rebuttal**: after considering the additional results provided, I have decided to increase my score.


    weaknesses and questions: The problem of active sampling for treatment-effect estimation with high-dimensional covariates
    is clearly significant. The solution appears to have clear benefits over other recent works. It would be very helpful
    to better describe the method so that readers can understand the key contributions.

    1. Specifically what role do partitioning and subsampling play in the proposed method?


    2. Does this method easily extend to multiple treatments?'
  - "title: Beyond the Average: Distributional Causal Inference under Imperfect Compliance\n\nsummary: This paper introduces\
    \ an estimator for the local distributional treatment effect, which is an instrumental-variable-type estimator for the\
    \ causal effect among compliers. They prove asymptotic properties of the estimator and empirically argue using synthetic\
