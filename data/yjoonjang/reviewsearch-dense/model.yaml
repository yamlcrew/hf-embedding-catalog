    \ probably not quite enough novelty but I could be wrong. Lemma 3.2 would be a nice place to do some of this clarification\
    \ but anywhere is fine\n- confused about a couple fundamental pieces here: the authors define \\eta_z = E[D | Z, S, X]\
    \ on L193. However according to the causal graph in Fig 1 it looks like D should be independent of X, S given Z - why\
