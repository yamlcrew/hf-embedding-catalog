    \ with the definitions of \\eta and \\mu"
  - "title: Distributed Least Squares in Small Space via Sketching and Bias Reduction\n\nsummary: Sketched least squares involve\
    \ estimating the term $(X^TX)^{-1}$ which has a high bias when the sketch matrix $S$ is not sub-Gaussian. This paper gives\
    \ a sparse sketching method using a LESS embedding which runs in optimal space and current matrix multiplication time,\
    \ where $S$ is sparse, and constructed based on the leverage scores of the data matrix $A$ (Definition 2 $(s,\\beta_1,\\\
    beta_2)$-LESS embedding). The paper also improves the sharpness of the probability bounds which is applicable to similar\
