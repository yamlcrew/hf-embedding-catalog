    - 'title: Block Rotation is All You Need for MXFP4 Quantization


      summary: This paper presents an investigation into the applicability of existing post-training quantization (PTQ) methods
      for LLMs under the emerging MXFP4 format. The core finding that global rotation-based methods are fundamentally incompatible
      with MXFP4''s block-wise scaling, thus they posit that a simple block-wise rotation (BRQ) is able to mitigate this issue.
      They provide extensive experiments and analysis. While the topic is timely, the paper suffers from a fundamentally incremental
      contribution and a lack of technical novelty that is enough to question its value to the quantization community. The
      core insight is deemed obvious for the target audience, and the solution does not constitute a significant algorithmic
      advance.


      weaknesses and questions: 1. The central problem and its solution are a straightforward, expected outcome for anyone
      with deep expertise in quantization. Applying a block-level transformation to align with a block-level quantization
      scheme is a natural and almost trivial engineering adjustment, not a novel research contribution. The MXFP4 format,
      by design, uses local block scaling (PoT) to contain outliers. Applying a global operation that deliberately spreads
      out outlier energy directly counteracts the format''s core design principle. Therefore, observing a performance collapse
      is not a discovery; it is a confirmation of a predictable hardware/algorithm mismatch.



      2. The proposed BRQ method is a direct and obvious application of existing concepts. It simply restricts the well-known
      rotation transform to the block granularity defined by the hardware. This does not represent a new algorithm or a conceptual
      breakthrough.


      3. They selected ''datasets and benchmarks''  as the primary area, but there is no new datasets or benchmarks provided.

      NA'
    - "title: Robust Training of Neural Networks at Arbitrary Precision and Sparsity\n\nsummary: Quantization aware training\
      \ (QAT) is a widely used method to prepare models for quantization. To overcome the rounding operation during backward\
      \ pass, QAT uses straight through estimator (STE) which bypasses the gradients in the backward pass outside of the rounding\
      \ operation. This work, characterizes this feature as the backward pass being quantization oblivious. To overcome this,\
      \ the authors present a workaround that exposes the backward pass to the quantization error using a combination of ridge\
      \ regression and affine quantization. Experiments on a wide array of models, and bit regimes shows superior performance\
      \ of the proposed method when compared to plain STE-based QAT.\n\nweaknesses and questions: * **QAT and error minimization:**\
      \ The fundamental hypothesis of this work is that during the backward pass, QAT is oblivious to the quantization error.\
      \ While this is possible, it has been shown by now that STE creates a different type of dynamic that results in weight\
      \ oscillations. And these oscillations have factors that are trying to compensate the errors due to QAT [1,2]. Given\
      \ this, what do the authors make of these explanations? And how does it alter their hypothesis, or not? If not, what\
      \ is their argument?\n\n* **STE beyond 2 bits:** Even if one were to attribute STE for poor performance in extremely\
      \ low-bit width, how is this not manifested to the same degree in higher bit regimes. What is the explanation? Is STE\
      \ more problematic only in extremely low-bit regimes? \n\n* **Ternary quantization with STE:** There are several works\
      \ that use STE for ternary quantization [3,4]. The critique that STE cannot be used for extremely low-bit regimes does\
      \ not hold up. \n\n* **Presentation clarity:** The ideas, experiments, and results are quite compelling in this work.\
      \ However, the presentation is unclear in many places. There are vague statements, unsubstantiated by evidence (discussions\
      \ around biological neurons, intelligence), and presentation of results makes it difficult to parse them. Many of the\
      \ interesting results are in the Appendix (Fig. 3, Table 1) whereas the main results in Fig. 1 and Fig. 2 are illegible,\
      \ with no clear captions, legends, axes labels. This is unfortunate as it dilutes the impact of otherwise nice contribution.\
      \ I would suggest improving these aspects.   \n\n* L-67: Very vague statement with exaggerated claims. It is by now\
      \ common knowledge that large, quantized models outperform smaller ones. And also the claim of biological intelligence\
      \ is extremely misplaced. \n\n### Other comments\n\n* Reference to Figure 1-a in L-37 is not useful as none of the concepts\
      \ are fully introduced; consider dropping this reference or elaborating the caption so that it can independently explain\
      \ the concepts in the figure.\n\n* L-38: What are the heuristic-based modifications authors are pointing to? No references\
      \ to back this up. \n\n* L-54: Strange sentence; perhaps missing a preposition somewhere. Did the authors mean \"full\
      \ potential of the theoretically...\"\n\n### References\n\n1. Wenshøj, Jonathan, Bob Pepin, and Raghavendra Selvan.\
      \ \"Oscillations Make Neural Networks Robust to Quantization.\" arXiv preprint arXiv:2502.00490 (2025).\n2. Xie, Weiying,\
      \ et al. \"Allowing Oscillation Quantization: Overcoming Solution Space Limitation in Low Bit-Width Quantization.\"\
      \ Proceedings of the IEEE/CVF International Conference on Computer Vision. 2025.\n3. Choi, Jungwook, et al. \"PACT:\
      \ Parameterized Clipping Activation for Quantized Neural Networks.\" (2018).\n4. Wang, Jinheng, et al. \"1-bit ai infra:\
      \ Part 1.1, fast and lossless bitnet b1. 58 inference on cpus.\" arXiv preprint arXiv:2410.16144 (2024).\nSee weaknesses\
      \ above."
    - "title: Nearly Lossless Adaptive Bit Switching\n\nsummary: The paper addresses challenges in model quantization for\
      \ deep neural networks (DNNs), focusing on optimizing quantization-aware training (QAT) across multiple bit-widths with\
      \ weight-sharing. To this end, this paper introduces a novel quantization method that exploits the highest integer precision\
      \ to achieve nearly lossless bit-switching, reducing storage without relying on full precision. Key contributions include:\
      \ (1) Adaptive Learning Rate Scaling: A technique that dynamically adjusts learning rates for different precisions to\
      \ address competitive interference and inconsistent gradient issues during one-shot joint training. (2) Double Rounding:\
      \ An extension for one-step rounding quantizer in fixed-precision quantization to improve accuracy. Experimental results\
      \ on the ImageNet-1K dataset show that the proposed methods surpass state-of-the-art approaches in both multi-precision\
      \ and mixed-precision scenarios, achieving higher efficiency and accuracy.\n\nweaknesses and questions: - Some analysis\
      \ is missing. For example, I'm wondering whether the second rounding leads to more quantization errors, as the first\
      \ rounding is used to produce INT8 weights and second rounding is then performed to quantize lower bit-width, the twice\
      \ quantization is possible to cause more clipping errors and rounding errors, some analysis could enhance the strength\
      \ of proposed methods. \n- Some designs should be further clarified, e.g., why ALRS is applied only for the scaling\
      \ factors? Intuitively, weights of small bit-width is induced large gradient variance by STE, and thus the weights of\
      \ small bit-width should also benefit from using smaller LR. \n- Fig. 1 is a bit confusing, some colored arrows are\
      \ not well explained. \n- This works essentially lies in the research of mixed-precision quantization, so I think it\
      \ is better to compare more MPQ (e.g., HAQ, DNAS, LIMPQ, etc) research in the Sec.4. Moreover, some recent papers on\
      \ multi bit-width quantization are missed on the , e.g., [1] (PTQ-based) and [2][3] (QAT-based), which could be included\
      \ into the Related Work. \n\n[1] Xu, Ke, et al. \"PTMQ: Post-training Multi-Bit Quantization of Neural Networks.\" Proceedings\
      \ of the AAAI Conference on Artificial Intelligence. Vol. 38. No. 14. 2024.\n\n[2] Tang, Chen, et al. \"Retraining-free\
      \ model quantization via one-shot weight-coupling learning.\" Proceedings of the IEEE/CVF Conference on Computer Vision\
      \ and Pattern Recognition. 2024. \n\n[3] Zhong, Yunshan, et al. \"MultiQuant: A Novel Multi-Branch Topology Method for\
      \ Arbitrary Bit-width Network Quantization.\" arXiv preprint arXiv:2305.08117 (2023).\nPlease refer to the weaknesses."
    - 'title: FPTQuant: Function-Preserving Transforms for LLM Quantization


      summary: This paper introduces FPTQuant, a novel PTQ framework designed to mitigate the severe activation outliers in
      LLMs. The authors cleverly design four lightweight FPTs—including a mathematically elegant pre-RoPE transform and MLP
      scaling techniques—that smooth activation distributions without altering the exact mathematical outputs of the unquantized
      model. By co-optimizing these transforms locally and end-to-end, FPTQuant achieves highly accurate static INT4 quantization
      with virtually zero inference overhead, completely bypassing the need for slow, bespoke CUDA kernels.


      weaknesses and questions: Strength:

      1. The block-diagonal pre-RoPE transform is good. Instead of fighting the architecture, exploiting the equivariances
      of modern Transformers to commute with the RoPE matrix is exactly the kind of principled, math-first solution the quantization
      community needs right now.

      2. This method folds transforms directly into the weights. Avoiding writing CUDA kernels for non-standard hardware is
      crucial for real-world deployment and cross-hardware compatibility.


      Weakness:

      1. Claims of "virtually no overhead" are great, but theoretical FLOP reduction isn''t enough. Hardware metrics are needed—like
      e2e latency, TTFT, and decode throughput (Tokens/sec) across varying batch sizes on standard GPUs (A100/H100)—to prove
      that memory bandwidth isn''t secretly being bottlenecked.

      2. Because FPTQuant requires both local and end-to-end training of the transforms, what is the actual wall-clock time
      and peak GPU memory required for the calibration phase? Especially compared to other training-based pts methods like
      spinquant.

      3. Real-world INT4 usually relies on group-wise quantization (e.g., group size 64/128) to maintain accuracy. Since the
      FPTs use channel-wise scaling to tame activation outliers, they inevitably alter the weight variance within those specific
      groups. It''s a noticeable gap that the paper doesn''t analyze—either theoretically or empirically—whether these transforms
      inadvertently blow up intra-group weight variance. If so, this would severely degrade group-wise quantization fidelity.

      See weakness'
    - 'title: Large Language Models do Not Make Complete Use of Math Reasoning Data


      summary: The paper studies per-item generalization when fine-tuning LLMs on math-reasoning tasks. As training data is
      incrementally increased, many test items that were previously answered correctly flip to incorrect, so net accuracy
      improves only marginally because “newly correct” and “newly incorrect” items roughly cancel. The finding is demonstrated
      for SFT (e.g., Llama-3-8B, Gemma-3-4B on GSM8K/MAWPS) and RL (Qwen2.5-0.5B on GSM8K/MATH8K). The authors quantify a
      “Union vs Final” gap (items solved by any intermediate model vs the final model), show cross-seed “predictive multiplicity”
      (same data, different seeds → different test items solved), and offer a high-level explanation via a “strategy set”
      view of reasoning traces. Ablations suggest sample order and LoRA dropout contribute to divergence across seeds. No
      new training method is proposed; the work is diagnostic/observational.


      weaknesses and questions: – Limited causal explanation: the paper establishes that flips occur, but the proposed “strategy
      set/Rashomon” lens is descriptive and not predictive; it does not isolate necessary/sufficient causes of flipping or
      quantify their contributions (e.g., data conflicts vs optimization noise vs under/over-fitting vs decoding effects).


      – Scope is narrow (math-reasoning, modest model sizes); it is unclear how broadly the phenomenon holds (code, multilingual,
      instruction-following, safety, etc.), or how it scales with much larger base models and longer training.


      – No actionable solution: beyond noting order/dropout effects, the work stops short of proposing methods to reduce flips
      or close the Union-vs-Final gap (e.g., curriculum, data reweighting, conflict detection, checkpoint ensembling, order-invariant
      updates, strategy-diversity regularizers).


      – Experimental controls are thin in places: small number of seeds; limited statistical testing; compute/training-length/early-stopping
      effects not deeply probed; decoding settings (e.g., temperature/self-consistency) only partially explored.


      – The “union” signal naturally suggests simple mitigations (checkpoint ensembling across data-subset steps, EMA over
      training, mixture-of-checkpoints) that are not tried; without testing such baselines, the practical impact remains unclear.


      – Theoretical component does not yield falsifiable predictions (e.g., when flips should increase/decrease given measurable
      dataset/model properties).

      •  What fraction of flips can be attributed to measurable data conflicts (near-duplicates with differing rationales/solutions,
      annotation noise) vs optimization stochasticity? Can you quantify this via conflict detection or per-sample gradient
      similarity analyses?


      •  Can you predict which items will flip when adding data? For instance, are low-margin items (by log-prob gap), longer
      reasoning chains, or particular operation types more flip-prone?


      •  Does the phenomenon persist with substantially larger base models and longer training to convergence? How does it
      scale with training steps/epochs and gradient noise scale?


      •  What is the effect of decoding schemes (temperature, self-consistency, verifier-guided selection, tool-use) on flips
      beyond majority voting?


      •  Do simple mitigations narrow the Union-vs-Final gap: (a) checkpoint ensembling across subset steps, (b) EMA of weights,
      (c) curriculum or order-invariant batching, (d) removing LoRA dropout and fixing order for all conditions, (e) data
      deduplication/cluster-balanced sampling?


      •  Does full-parameter fine-tuning (no adapters) or different PEFT choices alter the flip rate?


      •  Can the strategy-set view be made predictive (e.g., estimating effective strategy entropy per item) and tested against
      flip rates?'
    - "title: Accuracy is Not All You Need\n\nsummary: The authors analyze changes in model predictions as an additional performance\
      \ metric to evaluate quantization schemes applied to large language models (LLaMa2 and Yi). The authors show that during\
      \ model quantization that the predictions for a substantial number of examples change, beyond the limited number of\
      \ examples which labeled incorrect post quantization. Additionally, the authors show that the number of examples that\
      \ change in prediction is correlated with the KL-Divergence between the base and quantized model.\n\nweaknesses and\
      \ questions: The overall results are unsurprising and do not provide additional characterizations of the effects of\
      \ quantization on model performance or example characteristics.\n- It is expected that model predictions with lower\
      \ confidence are more likely to change upon compression. However, the current analysis does not provide insight into\
      \ how these examples change during compression. For example it is not clear if the reason that low confidence examples\
      \ change in prediction is because they are initially close to the decision boundary or if they observe greater change\
      \ in model confidence during compression.\n- Change in model prediction has been studied both in the context of continual\
      \ learning and interpretability analysis of model training dynamics [1,2]\n\nRelated Work\n1. Toneva, Mariya, et al.\
      \ \"An Empirical Study of Example Forgetting during Deep Neural Network Learning.\" International Conference on Learning\
      \ Representations. 2018.\n2. Swayamdipta, Swabha, et al. \"Dataset Cartography: Mapping and Diagnosing Datasets with\
      \ Training Dynamics.\" Proceedings of the 2020 Conference on Empirical Methods in Natural Language Processing (EMNLP).\
      \ 2020.\n1. Are the flipped examples consistent across different compression, quantization schemes, or models? \n2.\
      \ For a single method scheme with varying degrees of compression (GPTQ W8A16 -> GPTQ W4A16; or pruning at different\
      \ intensities), do the flips increase monotonically, consistenlty with increasing degrees of quantization? For example,\
      \ are the examples that are forgotten at 8-bit quantization relearned at 4-bit quantization?\n3. The top margin (difference\
      \ in probability) metric is used to characterize the model performance pre-quantization; A. What does the metric indicate\
      \ post quantization? B. Does quantization result in a more uniform probability distribution? C. Are the shifts in predicted\
      \ likelihood and confidence larger or smaller for examples that were initially higher or lower in confidence?"
    - 'title: Quantization Hurts Reasoning? An Empirical Study on Quantized Reasoning Models


      summary: This paper provides a comprehensive empirical study on the quantization of reasoning models. They evaluate
      SoTA quantization methods across weight-only, weight-activation, and KV cache quantization. Their conclusion is:

      Lossless settings: W8A8 or W4A16 are consistently < 1 % accuracy drop; W4 weight‑only or KV‑cache is “near‑lossless”
      on most models.

      Best algorithms: AWQ for weight‑only, QuaRot for KV‑cache (except small Qwen), FlatQuant for weight‑activation.

      Failure modes: 3‑bit quantization, small models, harder tasks and RL‑trained models (QwQ) are much more fragile.

      No extra thinking: mild quantization does not lengthen CoT while aggressive low‑bit settings do.

      Scaling trade‑offs: 4‑bit large models beat smaller BF16 models in both accuracy‑per‑GB and accuracy‑per‑second.


      weaknesses and questions: 1. No novel ideas are proposed. It is more about empirical study paper. The main contribution
      of this paper is doing experiments for the current quantization algorithms, and conclusion might be change as new approaches
      evolve. This paper would be benefit from this by proposing a leaderboard that support evaluations of any quantization
      algorithms.

      2. It does not really explain why certain quantization algorithms fail or do well. For example, it states "AWQ is preferred
      over GPTQ", "QuaRot is generally preferred over KVQuant*". This paper could be benefit if author can connect those empirical
      conclusions (accuracy drop) with some theoretically justifications and provide some insights in designing new algorithms.'
    - 'title: Unveiling the Potential of Quantization with MXFP4: Strategies for Quantization Error Reduction


      summary: MXFP4 and NVFP4 exhibit a significant gap in fidelity. The authors trace MXFP4''s lower accuracy to its rigid
      power-of-two scaling factors and coarser block granularity, which struggle to preserve outliers. To mitigate this without
      requiring hardware modifications, the authors introduce two software-only techniques, Overflow-Aware Scaling (OAS) and
      Macro Block Scaling (MBS), that improve MXFP4 quantization fidelity without requiring hardware changes. These methods
      reduce the gap between MXFP4 and NVFP4 to roughly one-tenth of its original size.


      weaknesses and questions: Strengths:

      1. The problem addressed in this paper is important and impactful, and has significant value for the community.

      2. The experimental results are substantial: the average accuracy gap is reduced from 10% to 1%.


      Weaknesses:

      I am not very familiar with this field. The methods appear to be sound. Other weaknesses and limitations can be referenced
      in the questions below.

      1. The evaluation appears to omit calibration-based post-training quantization baselines. Modern deployments typically
      rely on algorithms such as GPTQ, AWQ, or SmoothQuant to handle outliers before format conversion. If weights and activations
      have already been smoothed, how much additional benefit would the proposed methods provide?

      2. Could the authors provide token generation latency benchmark results?

      3. Could the authors include a histogram showing the frequency with which the OAS threshold is triggered?'
  - source_sentence: semantic labels data efficient learning
    sentences:
    - 'title: Language Semantic Graph Guided Data-Efficient Learning


      summary: The paper introduces the Language Semantic Graph (LSG), a novel approach to data-efficient learning that leverages
      semantic information from labels. The LSG is used to train an auxiliary graph neural network, which then guides the
      primary model''s training, enhancing the utilization of label knowledge. This method is applicable across various modalities,
      including image, video, and audio, and has shown significant performance enhancement in both Transfer Learning and Semi-Supervised
      Learning scenarios.


      Experiments were conducted on seven standard datasets covering images, videos, and audios, using several deep neural
      networks with different architectures and pretraining datasets. The results show that LSG significantly outperforms
      other methods, especially when labeled data is scarce. It also demonstrates promising potential in semi-supervised settings,
      achieving the best performance across all labeling rates and datasets. When applied to self-supervised pretrained models,
      LSG shows consistent gains. It also improves model performance on both in-distribution and out-of-distribution samples,
      indicating that label semantic relations help the model learn more robust features.


      In video and audio experiments, LSG consistently improves the fine-tuning accuracy across all tasks with limited labeled
      samples. It outperforms other methods, boosting accuracy significantly. For audio experiments, LSG achieves an average
      of 5.56% accuracy enhancement from the baseline, demonstrating its wide applicability across various modalities.


      "LSG consists of two parts: an auxiliary graph neural network that extracts knowledge from the semantic graph and two
      novel optimization objectives that transfer the knowledge to primary models." The authors demonstrate that LSG is applicable
      on image, video and audio models and brings significant performance gains to the model under Transfer Learning and Semi-Supervised
      Learning scenarios.


      weaknesses and questions: The effectiveness of the LSG method relies heavily on the quality and semantic richness of
      the labels. In scenarios where labels are sparse, ambiguous, or not well-defined, the performance of the LSG method
      could be compromised.

      *The LSG method relies heavily on the quality and semantic richness of the labels. How does the quality of the labels
      impact the performance of the LSG method? Could the LSG method be adapted to work effectively with less informative
      or ambiguous labels, and if so, how?


      * The paper primarily focuses on classification tasks. Could the LSG method be adapted or extended to other tasks, and
      if so, what modifications would be necessary?'
    - "title: Concept Bottleneck Models under Label Noise\n\nsummary: The paper is concerned with inherently interpretable\
      \ models called Concept Bottleneck Models (CBMs). These models require extensive concept labeling; however, these labels\
      \ are usually assumed to be perfect. The paper explores how noise in these concept labels affects the final target prediction.\
      \ The authors perform extensive experiments across all three variants of CBMs to show the detrimental effects of concept\
      \ labels. The authors then proposed SAM training to improve concept and target accuracy.\n\nweaknesses and questions:\
      \ - While the experiments are comprehensive for Section 3 and 4. Some of the results are pushed to the appendix (which\
      \ is fine), however it would have been nice to summarise them in brief in the text.\n\n- I enjoyed reading up to Section\
      \ 4. Thank you. However, I would have appreciated some theoretical intuition on why SAM works better (unless I missed\
      \ it).\n\n- The paper performs experiments with CUB and AwA2 datasets, popular benchmark datasets for CBMs. These datasets\
      \ however have a strong correlation between concept labels and the target label. I can imagine label noise to be very\
      \ detrimental (as observed from Figure 2).  The potential observed effect due to label noise might be weaker in the\
      \ case of diverse concepts for each target.\n\n- The paper claims to be first the paper to looking at label noise in\
      \ CBMs, while I would not refute this, I would like to point out the authors to some very relevant papers - [1] (noise\
      \ added to concept labels, similar to some of the exps in Sec3) [2]-(concept robustness and adv attacks)\n\n[1] - Sheth,\
      \ Ivaxi, and Samira Ebrahimi Kahou. \"Auxiliary losses for learning generalizable concept-based models.\" Advances in\
      \ Neural Information Processing Systems 36 (2024).\n\n[2] - Sinha, Sanchit, et al. \"Understanding and enhancing robustness\
      \ of concept-based models.\" Proceedings of the AAAI Conference on Artificial Intelligence. Vol. 37. No. 12. 2023.\n\
      - In Sec 6.1 authors show that other CBM variants are also susceptible to label noise. This alings with CBMs, however\
      \ the obvious question for me is, does SAM training improve the robustness? Why or Why not?\n\n- Concept labeling CBMs\
      \ is very difficult, there is an increasing interest in using LLMs for concept annotation. Can the authors kindly comment\
      \ (maybe in Limitations section of the paper), on whether label noise will impact such concept labels. \n\n- Interventions\
      \ are useful aspect of CBMs. What is the impact of interventions to reduce label noise? I assume interventions may be\
      \ less effective. Does SAM improve it? \n\n\nMinor:\n\n- Line 101, now caps for \"We\".\n\n- Figure 3, which model is\
      \ used not specified? Joint/Ind/Seq?"
    - 'title: DREAM: Dual-Standard Semantic Homogeneity with Dynamic Optimization for Graph Learning with Label Noise


      summary: This paper addresses the important and timely problem of robust graph learning under label noise, proposing
      a dynamic reweighting scheme, DREAM, that integrates relational information. During training, it dynamically reweights
      labeled nodes using semantic homogeneity scores. This method is well-motivated and potentially applicable to many graph
      learning settings. Its dual-criteria anchor selection mechanism combines proximity-aware and topology-aware anchors.
      Experimental results show that, on standard benchmark datasets and noise models, this method achieves significant and
      stable improvements compared to several strong baselines.


      weaknesses and questions: Strengths:

      * Semantic homogeneity scores based solely on graph structure relationships, rather than solely on loss values or simple
      auxiliary regularization terms, provide a direct, relation-informed reliability signal.


      * This method addresses a well-known problem in node classification under label noise: instead of relying solely on
      small-loss heuristics or global consistency terms, it explicitly utilizes graph structure relationships to determine
      which labels are trustworthy. This method can be integrated with standard GNN backbones, showing potential value for
      practical applications in handling noisy graph labels.


      * Experiments were conducted on six benchmark datasets and three noise types. Compared to a series of LLN and GLN baseline
      methods, the proposed method achieves significant and stable improvements, and ablation experiments validate the effectiveness
      of each module.


      Weaknesses:

      * The theoretical guarantee of this method requires that the semantic homogeneity score $H(n_i;A(n_i);\tau)$ must be
      a $(\beta,\epsilon)$ approximation of the ideal importance weight $\alpha(x_i,\hat{y}_i,y_i)$. However, this paper neither
      provides the conditions for this approximation to hold nor offers strong quantitative evidence that $H$ can reliably
      reflect the cleanliness of the labels.


      * Proximity-aware anchors relies on noisy labels and is prone to confirmation bias. The nearest neighbor candidate set
      $C_P(n_t)=\{n_i\mid i\in S \wedge y_i=y_t\}$ is constructed based on observed labels (which may have been contaminated).
      In cases of high noise rates, small sample classes, or weak representations in the early stages of training, anchor
      point selection may be biased towards nodes that have been mislabeled as "same kind," reinforcing erroneous supervision
      signals before the embedding becomes discriminative.


      * Equation (2) implicitly assumes that the candidate pool is large enough to select exactly $k_P$ nearest neighbor anchors,
      but the paper does not explain how to handle the situation where $|C_P(n_t)|<k_P$ in scenarios with small categories
      and few labels.


      * The potential sensitivity and stability issues caused by sharpening temperature scaling are not fully explained. The
      homogeneity weight uses $H=s^{1/\tau}$, where $\tau$ defaults to a small value (0.04), and the similarity is normalized
      to $[0,1]$, which makes the weight distribution extremely sharp. Although ablation experiments show that temperature
      scaling has an effect, the paper does not discuss stability strategies, nor does it perform sensitivity analysis on
      $\tau$ and $d_{\max}$ on multiple datasets.

      * Q1: When the class size is small, i.e., $|C_P(n_t)|<k_P$, how do you handle this? Do you directly use all available
      candidate samples, or dynamically adjust the value of $k_P$?


      * Q2: How sensitive is the model performance to the temperature parameter $\tau$ and the geodesic threshold dmax on
      different datasets? Have you tried scheduling $\tau$ during training to mitigate potential training instability issues?


      * Q3: Can you provide empirical evidence that $H$ is related to label cleanliness(e.g., how H changes with training
      epochs when distinguishing clean labels from noisy labels), and that this conclusion still holds true when the noise
      rate is higher ($\ge$ 50%)?


      * Q4: In heterophilous graphs like Flickr (with low homophility), what is the class purity of the topology-aware anchor
      $A_T(n_t)$? If the class mixing of $A_T$ is high, have you considered incorporating a weak class consistency prior (e.g.,
      based on prediction consistency) when selecting topology anchors? Would this approach improve the model''s robustness?'
    - "title: Learning to Label: A Reinforced Self-Evolving Framework for Semi-supervised Referring Expression Segmentation\n\
      \nsummary: This paper proposes Learning to Label (L2L), a framework for semi-supervised referring expression segmentation\
      \ (SS-RES). The method uses a frozen MLLM (Qwen2.5-VL) to generate bounding box predictions for unlabeled image–text\
      \ pairs, which are then fed into a frozen SAM2 to produce soft segmentation priors. These external priors are fused\
      \ with the segmentation model's own predictions via an uncertainty-aware module (SPM), injected into the encoder via\
      \ stage-adaptive gating (SESM), and used to generate pseudo-labels whose pixel-level selection is governed by a DDPG-based\
      \ reinforcement learning agent (RPLE). The actual segmentation network (Swin Transformer + BERT) is the only component\
      \ trained end-to-end. Experiments on RefCOCO, RefCOCO+, and RefCOCOg under 0.1%–10% label budgets show improvements\
      \ over existing SS-RES methods.\n\nweaknesses and questions: ## Strengths\n\n- **Well-motivated observation.** The analysis\
      \ of confidence mismatch between MLLM priors and model predictions (Figure 1) is insightful and clearly illustrates\
      \ why fixed-threshold pseudo-labeling is suboptimal for this task. The scatter plot effectively demonstrates the sample-dependent\
      \ nature of disagreement.\n\n- **Practically relevant problem.** Reducing annotation cost for RES is genuinely important,\
      \ and the semi-supervised formulation is a natural direction. The paper clearly articulates why standard SSL methods\
      \ struggle with referring expression segmentation due to referential ambiguity and boundary uncertainty.\n\n- **Clean\
      \ framework design.** The overall pipeline—external prior generation, uncertainty-aware fusion, conditional guidance\
      \ injection, and adaptive pseudo-label selection—is logically coherent and well-structured.\n\n\n## Weakness\n\n- The\
      \ dominant source of improvement is the external foundation model, not the proposed method. This is the most critical\
      \ concern. Table 1 reveals that the overwhelming majority of performance gain comes from simply using MLLM+SAM2 priors,\
      \ not from the proposed modules (SPM, SESM, RPLE). For further rigorous demonstration, more advanced heuristic should\
      \ be added to the baseline. In my opinion, the common pseudo-label method without MLLM little provide the information\
      \ to demonstrate the effectiveness of the proposed methods Specifically, the Baseline (w/ MLLM) uses a fixed mixing\
      \ coefficient of 0.5, which is an intentionally naive design. I suggest to include (a) Baseline (w/ MLLM) with a tuned\
      \ mixing coefficient, (b) agreement-based filtering (use pseudo-labels only where both MLLM and model are confident),\
      \ (c) any adaptive thresholding method (e.g., FlexMatch, CATM from ST-SGG [1, 2]). These comparison will provide how\
      \ good the proposed modules are when doing semi-supervised learning.\n\n\n- I have concern on the RL formulation (RPLE)\
      \ in terms of the problem's complexity. The state space is 6-dimensional and the action space is 2-dimensional. DDPG\
      \ is designed for high-dimensional continuous control problems—using it for a 6 -> 2 mapping is excessive. The authors\
      \ should claim what is the advantage of using RL approaches compared to the simple adaptive thresholding like [1, 2].\n\
      \n- While MLLM and SAM2 are used offline, the overhead of generating priors for all unlabeled data, plus the RL agent's\
      \ training cost, is never reported. \n\n[1] FlexMatch: Boosting Semi-Supervised Learning with Curriculum Pseudo Labeling\n\
      \n[2] Adaptive Self-training Framework for Fine-grained Scene Graph Generation\n- Can you add natural heuristic baselines—using\
      \ pseudo-labels only where both the MLLM prior and model prediction are confident (intersection-based filtering). \n\
      \n- Given that the state space is 6D and action space is 2D, have you compared RPLE against simpler adaptive thresholding\
      \ baselines? \n\n- The Baseline (w/ MLLM) uses a fixed mixing coefficient of 0.5. What happens when this coefficient\
      \ is optimized via grid search on the validation set?"
    - "title: Learning with Selectively Labeled Data from Multiple Decision-makers\n\nsummary: This paper focuses on the problem\
      \ setting of classification with selective labeled data, that is, the labeled data at hand can be biased because of\
      \ decision-making in the past. This paper defines the problem mathematically and solves this problem from the perspective\
      \ of the instrumental variable (IV) framework. There are two assumption settings: (1) No unmeasured common effect modifiers\
      \ (NUCEM), which is a strong assumption that leads to a clean solution, and (2) Partial identification, where a reasonable\
      \ solution can be obtained. Theoretical analyses of two assumption settings are provided. Furthermore, a practical algorithm\
      \ for both cases is also provided based on weighted empirical risk minimization with calibration guarantee. Synthetic\
      \ experiments show that the proposed method outperforms baselines.\n\n## update after rebuttal\nAfter the rebuttal,\
      \ I still think the idea of this paper is novel. It studies the problem setting extensively theoretically and also provides\
      \ experimental results., Thus, I keep my score (4: accept). The authors clarified in the rebuttal that their work has\
      \ novelty and also admits some current drawbacks of their methods (e.g., computation time).\n\nweaknesses and questions:\
      \ Strengths\n1. Strong theoretical results that improve an understanding of a complicated yet relevant problem setting.\
      \ It is praiseworthy that this paper not only focuses on a restrictive NUCEM assumption but also considers the partial\
      \ information assumption.\n2. Practical algorithms with theoretical guarantee are provided, which can be relatively\
      \ easy to implement. \n3. Experimental results (although synthetic) show that the proposed method is effective compared\
      \ with reasonable baselines.\n\nWeaknesses\n1. Proposed method's weakness is not much discussed in my understanding.\
      \ One might be that it could be computationally expensive (I'm not sure). Moreover, the estimation of weight could be\
      \ incorrect, and we don't see much effect in the experiments, whether this can make the proposed method not work well.\
      \ I find the comment in the paper, why NUCEM lost to partial under NUCEM assumption quite interesting that NUCEM requires\
      \ a ratio estimation. I think such discussions could be useful. Or ablation study of the effect of imprecise weight\
      \ estimation could also be useful. (but I'm also aware that the paper is already dense unfortunately).\n1. Could you\
      \ please comment on the comparison of the computational cost of the proposed unified cost-sensitive learning (point),\
      \ (partial), and vanilla training?\n2. Since many weights have to be estimated, how important is the accuracy of weight\
      \ estimation? Is the solution highly sensitive to this?\n3. Is this the first work to use instrumental variable (IV)\
      \ framework for selective labeled classification?"
    - "title: Hard Labels In! Rethinking the Role of Hard Labels in Mitigating Local Semantic Drift\n\nsummary: This paper\
      \ proposes to utilize hard labels to both address the massive storage bottleneck and improve performance for dataset\
      \ distillation methods. The paper identifies that reducing cropped views introduce a problem called local-view semantic\
      \ drift, when crops are assigned soft labels that deviate from the ground-truth image label. To solve this, the paper\
      \ proposes a 3-stage training scheme that consists of 2 soft-label stages and a key hard-label stage in the middle that\
      \ theoretically improve the gradient alignment of the two label types. Massive theoretical analysis and a semantic drift\
      \ framework are provided to support the method. Experiments demonstrate state-of-the-art performance and a 100x reduction\
      \ of storage cost.\n\nweaknesses and questions: Strengths:\n\nThe theoretical framework of the soft-hard alignment is\
      \ thorough in this paper, with in-depth analysis of the Local-View Semantic Drift problem studied in the paper. Meanwhile,\
      \ the empirical validation shows strong effectiveness and efficiency.\n\nWeaknesses:\n- The main method, i.e., training\
      \ stage B, seems not using hard labels for correcting signals, which is the primary motivation of the paper. The method\
      \ basically uses label smoothing + Cutmix, both still creating soft labels.\n- The theoretical part before Sec.3.2 is\
      \ quite disconnected to the main method.\n- The number of compared methods are limited. The authors are suggested to\
      \ compare 1~2 more (e.g., GIFT).\n- The evaluated datasets are limited to only Tiny-ImageNet/ImageNet-1K, limiting it\
      \ only in general domains.\n- Minor issues: \n  - Notation of $s$ defined for the second time at page 4 stage A.\n \
      \ - Table 6 caption: right/left rather than top/bottom.\n  - The best-performing $\\alpha$ is annotated wrong in Table\
      \ 13.\n1. Why is the one-hot labels not used for stage B directly?\n2. How is the LS + Cutmix method able to perform\
      \ gradient correction?\n3. Is there intuitive explanation or empirical evidence on how the three stages work to bound\
      \ the gap in Theorem 3.5?"
    - 'title: Semantic F1 Scores: Fair Evaluation Under Fuzzy Class Boundaries


      summary: This paper introduces Semantic F1 Scores, a family of evaluation metrics for multi-label classification that
      account for semantic similarity between labels. The core idea is to give partial credit when a predicted label is semantically
      related to the true label, instead of counting it as a complete miss as in standard F1. The metric uses a two-step matching
      (predict-to-true and true-to-predict) to compute “semantic precision” and “semantic recall,” which are combined into
      an F1 score. Semantic F1 is designed to be backward-compatible (it reduces to standard F1 when no partial credit is
      allowed). Additionally, to theoretical arguments, the authors conduct an empirical study on eight datasets (synthetic
      and real) and demonstrate that Semantic F1 provides potentially fairer and more informative evaluation in tasks with
      subjective or overlapping labels, correlating more closely with real-world outcomes than classical F1.


      weaknesses and questions: - I think the biggest weakness of the approach is dependency on the similarity matrix. If
      the matrix S is poorly specified or biased, scores could be misleading or unfair, which makes it tricky to use as an
      evaluation metric. The defining similarity may be non-trivial. Similarity derived from label co-occurrence or embeddings
      might not truly reflect conceptual closeness. Results with different S matrices are not comparable.

      - Baseline comparison on real tasks is limited, as on real datasets, evaluation focuses on hard F1 vs Semantic F1, with
      no direct comparison to alternative semantic metrics, which also feels limited in a synthetic study.

      - I''m generally a bit confused by experiments; it is not clear to me what is optimized and what is evaluated, and why
      should I care that Semantic F1 better correlates with the task than hard F1? And what about other soft/semantic metrics?

      - Many labels on Figures 2 and 3 are so small that they are not readable when printed.

      Please, see weaknesses session.'
    - "title: Beyond One-Hot Labels: Semantic Mixing for Model Calibration\n\nsummary: This paper propose Calibration-aware\
      \ Semantic Mixing, a model calibration approach using diffusion-based data augmentation, like “semantic mixup”.Unlike\
