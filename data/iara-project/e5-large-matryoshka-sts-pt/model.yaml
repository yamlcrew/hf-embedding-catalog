widgetData:
- source_sentence: 2- No entanto, importa ainda distinguir entre impossibilidade originária definitiva e impossibilidade originária
    temporária.
  sentences:
  - VII - Está afastada do regime da insolvência culposa a conduta qualificada com a culpa leve ou levíssima, aferida pelo
    padrão de diligência do homem médio.
  - Apenas a exibição do documento de contrato de crédito com a solicitação do executivo não é suficiente para comprovar a
    concessão de crédito.
  - 'A necessidade da distinção decorre do art 401 ns 1 e 2: se a impossibilidade originária é definitiva, aplica-se o art
    401 n 1: o negócio jurídico é nulo.'
- source_sentence: O arguido recorre desejando beneficiar de atenuação especial da pena, por via do regime constante do Dec.
    Lei n. 401/82, de 23 de setembro.
  sentences:
  - Funda tal pretensão obviamente no dado objetivo da sua idade e no alegado facto de que o Acórdão recorrido não teria devidamente
    fundamentado a não aplicação deste regime.
  - Em recurso, o tribunal da Relação alterou a matéria de facto e condenou o arguido pela autoria material de crime de coacção
    sexual p. e p. pelo art.
  - O prazo de prescrição das obrigações tributárias em geral é actualmente de oito anos cfr.art.48, da L.G.Tributária), sendo
    anteriormente de dez anos cfr.art.34, do C.P.
- source_sentence: Um cachorro brinca com um recipiente de plástico.
  sentences:
  - Definitivamente, planeie com um mês de antecedência - não há qualquer problema em alterar os seus planos - basta alterá-los
    como eles o fazem.
  - O cão está a brincar com um recipiente de plástico.
  - Penso que os comentários de Stephen King são úteis a este respeito.
- source_sentence: Uma pessoa deita óleo de cozinha numa panela.
  sentences:
  - Uma pessoa está a deitar azeite numa panela no fogão.
  - Uma mulher está a limpar um camarão.
  - As vacas castanhas e brancas estão a comer de um cocho.
- source_sentence: Uma menina jovem está usando língua de sinais
  sentences:
  - O homem não está tocando um violão
  - Língua de sinais está sendo usada por uma jovem menina
  - A mulher está fatiando um tomate
