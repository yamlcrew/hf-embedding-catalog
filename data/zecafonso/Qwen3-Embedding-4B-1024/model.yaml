cardData:
  tags:
  - sentence-transformers
  - sentence-similarity
  - feature-extraction
  - generated_from_trainer
  - dataset_size:74
  - loss:MultipleNegativesRankingLoss
  base_model: Qwen/Qwen3-Embedding-4B
  widget:
  - source_sentence: '3 - No caso das operações urbanísticas com impacte relevante, para efeitos de determinação das áreas
      a ceder para o domínio municipal, bem como da compensação a que eventualmente haja lugar nos termos dos artigos seguintes,
      o respetivo cálculo deve incidir:

      i) No caso de obras de construção, sobre toda a área de construção;

      ii) No caso de obras de ampliação ou de obras de reconstrução com preservação de fachada, sobre o aumento de superfície
      de pavimento relativamente à situação preexistente'
    sentences:
    - 'Artigo 43.º – Obras de edificação em procedimento de comunicação prévia

      Com a admissão da comunicação prévia, as obras previstas no n.º 4, do artigo 4.º do RJUE, ficam, nos termos do artigo
      57.º, n.º 1 do RJUE, sujeitas às seguintes condições:

      a) Finda a execução da obra, o dono da mesma fica obrigado a proceder ao levantamento do estaleiro e à limpeza da área,
      nos termos previstos no presente Regulamento e no RGRCD, bem como à reparação de quaisquer estragos ou deteriorações
      que tenha causado em infraestruturas públicas, sendo o cumprimento destas obrigações condição da emissão do alvará de
      autorização de utilização, sem prejuízo do disposto no n.º 2, do artigo 86.º do RJUE;

      b) O prazo de execução da operação urbanística não pode exceder:

      i) 2 anos, no caso de área de construção inferior ou igual a 500 m2;

      ii) 3 anos, no caso de área de construção superior a 500 m2.


      SECÇÃO V – Espaços verdes e de utilização coletiva, infraestruturas, equipamentos e mobiliário urbano


      Artigo 44.º – Áreas destinadas a espaços verdes e de utilização coletiva, infraestruturas e equipamentos

      1 - Sem prejuízo do disposto no artigo 44.º do RJUE, devem ser previstas áreas públicas e ou privadas destinadas à implantação
      de espaços verdes e de utilização coletiva, infraestruturas e equipamentos, nas seguintes situações:

      a) Operações de loteamento e respetivas alterações;

      b) Operações urbanísticas com impacte relevante, nos termos do n.º 5 do artigo 44.º do RJUE, conjugado com o disposto
      no artigo 6.º e no n.º 3 do artigo 53.º do presente Regulamento;

      c) Obras consideradas de impacte semelhante a operação de loteamento, nos termos do n.º 5, do artigo 57.º do RJUE, conjugado
      com o disposto no artigo 7.º do presente Regulamento.

      2 - Os parâmetros para o dimensionamento das áreas referidas no número anterior são os que estiverem definidos em plano
      municipal de ordenamento do território ou, supletivamente, naPortaria n.º 216-B/2008, de 3 de março, ou outra que, sobre
      esta matéria, venha a ser posteriormente aprovada.


      Artigo 45.º – Parques infantis e espaços de jogos e recreio ao ar livre

      1 - Os parques infantis e os espaços de jogos e recreio ao ar livre, incluindo campos desportivos informais com características
      não regulamentares, devem ser incluídos nos espaços verdes e de utilização coletiva.

      2 - Os parques infantis devem ser projetados de acordo com o disposto noDecreto-Lei n.º 379/97, de 27 de dezembro, com
      as alterações introduzidas peloDecreto-Lei n.º 119/2009, de 19 de maio, que estabelece as condições de segurança a observar
      na localização, implantação, conceção e organização funcional dos espaços de jogo e recreio, respetivo equipamento e
      superfícies de impacto.

      3 - Os equipamentos desportivos com características regulamentares devem ser projetados de acordo com oDecreto-Lei n.º
      141/2009, de 16 de junho, com as alterações introduzidas peloDecreto-Lei n.º 110/2012, de 21 de maio, que estabelece
      o regime jurídico das instalações desportivas de uso público.'
    - 'Artigo 91.º – Exceções

      1 - Sem prejuízo do disposto em legislação específica, em casos excecionais e devidamente fundamentados admitem-se exceções
      aos parâmetros e dotações estabelecidas no presente Capítulo, com isenção parcial ou total de lugares ou dimensões alternativas,
      apreciadas e decididas caso a caso, nas seguintes situações:

      a) Intervenções em edifícios classificados ou a preservar, quando a criação de acesso ao interior da zona de estacionamento
      prejudique ou seja incompatível com as suas características arquitetónicas;

      b) Impossibilidade ou inconveniência de natureza técnica, designadamente respeitante a dimensões das parcelas, características
      geotécnicas dos terrenos ou níveis freáticos;

      c) Pedidos de alteração à utilização de edifícios que não envolvam a realização de obras sujeitas a controlo prévio
      nos termos do RJUE.

      2 - Nos Espaços Urbanos Históricos pode ser dispensado o cumprimento dos parâmetros e critérios para dimensionamento
      do número de lugares de estacionamento previstos no presente Capítulo, nas seguintes situações:

      a) Obras que não impliquem aumento do número de frações, e não justifiquem alterações da utilização;

      b) Obras em edificações cujas fachadas limitem vias exclusivamente pedonais;

      c) Obras em edificações localizadas em vias de largura inferior a 5 metros;

      d) Obras em edificações com frentes inferiores a 5 metros;

      e) Obras em imóveis situados em zonas arqueologicamente sensíveis que apresentem vestígios arqueológicos passíveis de
      salvaguarda e valorização;

      f ) Obras em edificações cujos solos onde se encontram implantadas apresentem características geológicas e nível freático
      que tornem tecnicamente impossível a sua execução em cave e não seja possível solução alternativa;

      g) Edificações em que a obrigatoriedade de recuperação e conservação das características arquitetónicas das fachadas
      confinantes com a via ou espaço público não permitam qualquer alteração a estas.


      SECÇÃO II – Disposições específicas


      Artigo 92.º – Parâmetros

      1 - O cálculo da área de estacionamento necessária para veículos ligeiros deve obedecer aos seguintes parâmetros:

      a) Uma área de estacionamento mínima de 11,50 m2 (2,30 metros x 5 metros) por cada lugar de estacionamento ao ar livre;

      b) Uma área bruta mínima de 30 m2 por cada lugar de estacionamento em estrutura edificada, em cave ou não, garantindo
      uma largura mínima disponível de 3,50 metros em "boxe", e de 2,30 metros em lugares de estacionamento, sendo que cada
      área de estacionamento terá que garantir uma profundidade disponível de 5 metros;

      c) As dimensões de garagens fechadas e de lugares de estacionamento que se destinem a cidadãos com mobilidade condicionada
      devem respeitar as larguras de 4 metros e 3,50 metros, respetivamente, sendo a sua localização a mais próxima dos acessos
      e obrigatoriamente anexados à habitação acessível;

      2 - A área bruta a considerar para cada lugar de estacionamento de um veículo pesado deve obedecer aos seguintes parâmetros:

      a) 75 m2 (5 metros x 15 metros), à superfície;

      b) 130 m2, quando em estrutura edificada, em cave ou não.'
    - 'Artigo 53.º – Cedências

      1 - Os promotores das operações de loteamento e de outras operações urbanísticas às quais, nos termos do RJUE e do presente
      Regulamento sejam aplicáveis as disposições relativas a cedências, cedem gratuitamente ao Município parcelas para implantação
      de espaços verdes públicos e equipamentos de utilização coletiva e as infraestruturas urbanísticas que, de acordo com
      a lei e a licença ou comunicação prévia, devam integrar o domínio municipal.

      2 - Os parâmetros para o dimensionamento das áreas a ceder para o domínio municipal são os definidos em plano municipal
      de ordenamento do território ou, supletivamente, naPortaria n.º 216-B/2008, de 3 de março, ou outra que, sobre esta
      matéria, venha a ser posteriormente aprovada.

      3 - No caso das operações urbanísticas com impacte relevante, para efeitos de determinação das áreas a ceder para o
      domínio municipal, bem como da compensação a que eventualmente haja lugar nos termos dos artigos seguintes, o respetivo
      cálculo deve incidir:

      i) No caso de obras de construção, sobre toda a área de construção;

      ii) No caso de obras de ampliação ou de obras de reconstrução com preservação de fachada, sobre o aumento de superfície
      de pavimento relativamente à situação preexistente.

      4 - As áreas destinadas a espaços verdes públicos, equipamentos de utilização coletiva e as infraestruturas urbanísticas
      devem ainda obedecer aos seguintes requisitos:

      a) Integrar-se no desenho urbano existente ou projetado;

      b) Localizar-se em áreas livres de restrições que condicionem a sua utilização;

      c) Dispor, preferencialmente, de acesso e frente para via ou espaço público;

      d) Possuir configuração e dimensão adequadas aos objetivos tipológicos e funcionais pretendidos;

      e) Articular-se, sempre que possível, com a estrutura verde do aglomerado, especialmente nos casos em que as áreas destinadas
      a espaços verdes sejam atravessadas ou confinem com linhas de águas ou outras condicionantes ambientais, que possam
      constituir uma mais-valia à fruição dos espaços verdes e de utilização coletiva, ou sejam contíguas a espaços públicos;

      f ) As áreas de cedência para equipamentos e espaços verdes devem ser, sempre que possível, contíguas e constituírem
      elemento estruturante do espaço público.

      g) As áreas de cedência para espaços verdes devem apresentar uma área mínima de 50 m2, salvo em situações tecnicamente
      justificáveis e aceites pela Câmara Municipal;

      5 - As parcelas de terreno cedidas ao Município integram-se no domínio municipal com a emissão do alvará ou, nas situações
      sujeitas ao procedimento de comunicação prévia, através de instrumento próprio a realizar pelo notário privativo da
      Câmara Municipal, nos termos do artigo 44.º, n.º 3 do RJUE.


      Artigo 54.º – Compensação pela não cedência

      1 - Se o prédio objeto de qualquer das operações urbanísticas referidas nas alíneas a) e b), do n.º 1, do artigo 44.º
      do presente Regulamento, já estiver servido pelas infraestruturas a que se refere a alínea h), do artigo 2.º do RJUE,
      ou não se justificar a localização de qualquer equipamento ou espaço verde públicos no referido prédio, ou ainda nos
      casos referidos no n.º 4, do artigo 43.º do RJUE, não há lugar a qualquer cedência para esses fins, ficando, no entanto,
      o proprietário obrigado ao pagamento de uma compensação ao Município, em numerário ou em espécie, nos termos definidos
      nos artigos seguintes.

      2 - O disposto no número anterior é igualmente aplicável nas situações previstas nos n.os 6 e 7, do artigo 57.º do RJUE.'
  - source_sentence: 3 - A largura mínima das rampas é de 3 metros, podendo a largura máxima atingir 9,50 metros em função
      da capacidade global do parqueamento e da utilização do edifício, a fundamentar em projeto e sujeito a apreciação caso
      a caso
    sentences:
    - 'Artigo 93.º – Critérios de dimensionamento

      1 - Todas as novas edificações devem dispor de espaços destinados ao estacionamento de veículos, sendo o número de lugares
      estabelecido em função dos usos do edifício e da sua dimensão.

      2 - Sem prejuízo dos previstos em legislação específica aplicável ou do n.º 2, do artigo 89.º do presente Regulamento,
      deve garantir-se o cumprimento dos seguintes mínimos:

      a) Em habitação coletiva, um lugar de estacionamento por cada fogo de habitação de tipologia T0, T1 e T2, ou área total
      de construção inferior a 120 m2/fogo;

      b) Em habitação coletiva, dois lugares de estacionamento por cada fogo de habitação de tipologia igual ou superior a
      T3, ou com área total de construção igual ou superior a 120 m2;

      c) Em moradias unifamiliares:

      i) Um lugar de estacionamento, por área total de construção inferior a 120 m2;

      ii) Dois lugares de estacionamento, por área total de construção entre 120 m2 e 300 m2;

      iii) Três lugares de estacionamento, por área total de construção superior a 300 m2.

      d) Em edifícios ou frações destinados a comércio:

      i) Um lugar de estacionamento por cada 50 m2 de área total de construção comercial;

      ii) Um lugar de estacionamento por cada 25 m2 de área total de construção comercial, para superfícies de comércio com
      uma área de construção superior a 1000 m2;

      iii) Um lugar de estacionamento por cada 15 m2 de área total de construção comercial, para superfícies de comércio com
      uma área total superior a 2500 m2.

      e) Em edifícios ou frações destinados a serviços:

      i) Três lugares de estacionamento por cada 100 m2 de área total de construção de serviços;

      ii) Cinco lugares por cada 100 m2 de área total de construção, quando a área total de construção de serviços for superior
      a 500 m2.

      f ) Em empreendimentos turísticos, o dimensionamento dos lugares de estacionamento deve observar as disposições das
      portarias em vigor para o efeito, decorrente da legislação específica;

      g) Em armazém ou indústria, um lugar por cada 150 m2 de área total de construção, devendo ainda ser prevista no interior
      da parcela de terreno ou prédio, a área necessária às operações de carga e descarga de veículos pesados, bem como ao
      estacionamento dos mesmos, em número a determinar, caso a caso em função do tipo de indústria ou armazém a instalar;

      h) Deve ainda ser prevista a seguinte proporção para lugares acessíveis a pessoas com mobilidade condicionada:

      i) Um lugar em espaços de estacionamento com uma lotação não superior a 10 lugares;

      ii) Dois lugares em espaços de estacionamento com uma lotação compreendida entre 11 e 25 lugares;

      iii) Três lugares em espaços de estacionamento com uma lotação compreendida entre 26 e 100 lugares;

      iv) Quatro lugares em espaços de estacionamento com uma lotação compreendida entre 101 e 500 lugares;

      v) Um lugar por cada 100 lugares em espaços de estacionamento com uma lotação superior a 500 lugares.

      3 - Para instalação de equipamentos de utilização coletiva, designadamente destinados à satisfação de necessidades nos
      domínios da saúde, educação, cultura e desporto, deve proceder-se a um estudo de mobilidade e estacionamento que permita
      definir as necessidades em número de lugares de estacionamento e as condições de acessibilidade.

      4 - A edificabilidade máxima a autorizar em edificações destinadas a estacionamento automóvel (garagens e auto silos)
      é a que resultar do estrito cumprimento do disposto nos instrumentos de gestão territorial aplicáveis ao local.'
    - 'Artigo 98.º – Rampas

      1 - As rampas de acesso ao estacionamento no interior dos prédios não podem, em caso algum, ter qualquer desenvolvimento
      na via ou espaço público, incluindo passeios, devendo ser realizadas de modo a permitir uma boa visibilidade por parte
      dos condutores que saem do estacionamento.

      2 - As rampas devem permitir a fácil inscrição geométrica, sem recurso a manobra.

      3 - A largura mínima das rampas é de 3 metros, podendo a largura máxima atingir 9,50 metros em função da capacidade
      global do parqueamento e da utilização do edifício, a fundamentar em projeto e sujeito a apreciação caso a caso.

      4 - A inclinação máxima das rampas não pode ser superior a 18 % e deve ser demonstrada a utilização em condições de
      segurança dos veículos, recorrendo a diferentes percentagens de inclinação sempre que necessário.

      5 - Sempre que a inclinação ultrapasse os 12 %, deve ser prevista curva de transição com a zona de concordância nos
      pisos, com uma extensão mínima de 3 metros, em situações excecionais, e de 3,50 metros em situações correntes, e com
      inclinação reduzida a metade da inclinação da rampa.

      6 - Sempre que se mostre necessário, pode ser imposta a colocação de sinalização luminosa que controle a circulação
      nas zonas de rampa.

      (ver documento original)


      Artigo 99.º – Monta-carros

      É permitida a aplicação de monta-carros em substituição de rampas nos casos plenamente justificados pela dimensão e
      geometria do lote ou prédio, e ainda pela impossibilidade de circulação interior, cumprindo-se os seguintes requisitos:

      a) Devem servir um parqueamento com capacidade máxima de 50 lugares de estacionamento, distribuídos pelo máximo de três
      pisos;

      b) Prever a aplicação de 1 monta-carros por cada 25 veículos;

      c) A plataforma deve ter as dimensões mínimas livres de 2,50 metros de largura por 5 metros de comprimento;

      d) Não é admissível a instalação de monta-carros em estabelecimentos para serviço público.


      Artigo 100.º – Circulação interior

      1 - A circulação no interior dos pisos de estacionamento deve ser garantida sem recurso a manobras, nos percursos de
      ligação entre os pisos;

      2 - A largura mínima das faixas de circulação é de:

      a) 4,50 metros em estacionamento a 45.º;

      b) 5 metros em estacionamento a 60.º;

      c) 5,50 metros em estacionamento a 90.º;

      d) 4 metros em estacionamento longitudinal;

      e) Devem ser previstas zonas livres, nos locais próximos à entrada/saída das rampas, de modo a permitir a passagem cruzada
      ou a espera de veículos;

      f ) Os pilares ou outros obstáculos devem ser devidamente sinalizados e protegidos;

      g) O pavimento das rampas e dos pisos deve ser antiderrapante e deve ser previsto um sistema de caleiras que permita
      a limpeza de óleos.

      (ver documento original)'
    - 'Artigo 53.º – Cedências

      1 - Os promotores das operações de loteamento e de outras operações urbanísticas às quais, nos termos do RJUE e do presente
      Regulamento sejam aplicáveis as disposições relativas a cedências, cedem gratuitamente ao Município parcelas para implantação
      de espaços verdes públicos e equipamentos de utilização coletiva e as infraestruturas urbanísticas que, de acordo com
      a lei e a licença ou comunicação prévia, devam integrar o domínio municipal.

      2 - Os parâmetros para o dimensionamento das áreas a ceder para o domínio municipal são os definidos em plano municipal
      de ordenamento do território ou, supletivamente, naPortaria n.º 216-B/2008, de 3 de março, ou outra que, sobre esta
      matéria, venha a ser posteriormente aprovada.

      3 - No caso das operações urbanísticas com impacte relevante, para efeitos de determinação das áreas a ceder para o
      domínio municipal, bem como da compensação a que eventualmente haja lugar nos termos dos artigos seguintes, o respetivo
      cálculo deve incidir:

      i) No caso de obras de construção, sobre toda a área de construção;

      ii) No caso de obras de ampliação ou de obras de reconstrução com preservação de fachada, sobre o aumento de superfície
      de pavimento relativamente à situação preexistente.

      4 - As áreas destinadas a espaços verdes públicos, equipamentos de utilização coletiva e as infraestruturas urbanísticas
      devem ainda obedecer aos seguintes requisitos:

      a) Integrar-se no desenho urbano existente ou projetado;

      b) Localizar-se em áreas livres de restrições que condicionem a sua utilização;

      c) Dispor, preferencialmente, de acesso e frente para via ou espaço público;

      d) Possuir configuração e dimensão adequadas aos objetivos tipológicos e funcionais pretendidos;

      e) Articular-se, sempre que possível, com a estrutura verde do aglomerado, especialmente nos casos em que as áreas destinadas
      a espaços verdes sejam atravessadas ou confinem com linhas de águas ou outras condicionantes ambientais, que possam
      constituir uma mais-valia à fruição dos espaços verdes e de utilização coletiva, ou sejam contíguas a espaços públicos;

      f ) As áreas de cedência para equipamentos e espaços verdes devem ser, sempre que possível, contíguas e constituírem
      elemento estruturante do espaço público.

      g) As áreas de cedência para espaços verdes devem apresentar uma área mínima de 50 m2, salvo em situações tecnicamente
      justificáveis e aceites pela Câmara Municipal;

      5 - As parcelas de terreno cedidas ao Município integram-se no domínio municipal com a emissão do alvará ou, nas situações
      sujeitas ao procedimento de comunicação prévia, através de instrumento próprio a realizar pelo notário privativo da
      Câmara Municipal, nos termos do artigo 44.º, n.º 3 do RJUE.


      Artigo 54.º – Compensação pela não cedência

      1 - Se o prédio objeto de qualquer das operações urbanísticas referidas nas alíneas a) e b), do n.º 1, do artigo 44.º
      do presente Regulamento, já estiver servido pelas infraestruturas a que se refere a alínea h), do artigo 2.º do RJUE,
      ou não se justificar a localização de qualquer equipamento ou espaço verde públicos no referido prédio, ou ainda nos
      casos referidos no n.º 4, do artigo 43.º do RJUE, não há lugar a qualquer cedência para esses fins, ficando, no entanto,
      o proprietário obrigado ao pagamento de uma compensação ao Município, em numerário ou em espécie, nos termos definidos
      nos artigos seguintes.

      2 - O disposto no número anterior é igualmente aplicável nas situações previstas nos n.os 6 e 7, do artigo 57.º do RJUE.'
  - source_sentence: Qual o n.º mínimo de lugares público de estacionamento consoante a área de construção e uso?
    sentences:
    - 'Artigo 91.º – Exceções

      1 - Sem prejuízo do disposto em legislação específica, em casos excecionais e devidamente fundamentados admitem-se exceções
      aos parâmetros e dotações estabelecidas no presente Capítulo, com isenção parcial ou total de lugares ou dimensões alternativas,
      apreciadas e decididas caso a caso, nas seguintes situações:

      a) Intervenções em edifícios classificados ou a preservar, quando a criação de acesso ao interior da zona de estacionamento
      prejudique ou seja incompatível com as suas características arquitetónicas;

      b) Impossibilidade ou inconveniência de natureza técnica, designadamente respeitante a dimensões das parcelas, características
      geotécnicas dos terrenos ou níveis freáticos;

      c) Pedidos de alteração à utilização de edifícios que não envolvam a realização de obras sujeitas a controlo prévio
      nos termos do RJUE.

      2 - Nos Espaços Urbanos Históricos pode ser dispensado o cumprimento dos parâmetros e critérios para dimensionamento
      do número de lugares de estacionamento previstos no presente Capítulo, nas seguintes situações:

      a) Obras que não impliquem aumento do número de frações, e não justifiquem alterações da utilização;

      b) Obras em edificações cujas fachadas limitem vias exclusivamente pedonais;

      c) Obras em edificações localizadas em vias de largura inferior a 5 metros;

      d) Obras em edificações com frentes inferiores a 5 metros;

      e) Obras em imóveis situados em zonas arqueologicamente sensíveis que apresentem vestígios arqueológicos passíveis de
      salvaguarda e valorização;

      f ) Obras em edificações cujos solos onde se encontram implantadas apresentem características geológicas e nível freático
      que tornem tecnicamente impossível a sua execução em cave e não seja possível solução alternativa;

      g) Edificações em que a obrigatoriedade de recuperação e conservação das características arquitetónicas das fachadas
      confinantes com a via ou espaço público não permitam qualquer alteração a estas.


      SECÇÃO II – Disposições específicas


      Artigo 92.º – Parâmetros

      1 - O cálculo da área de estacionamento necessária para veículos ligeiros deve obedecer aos seguintes parâmetros:

      a) Uma área de estacionamento mínima de 11,50 m2 (2,30 metros x 5 metros) por cada lugar de estacionamento ao ar livre;

      b) Uma área bruta mínima de 30 m2 por cada lugar de estacionamento em estrutura edificada, em cave ou não, garantindo
      uma largura mínima disponível de 3,50 metros em "boxe", e de 2,30 metros em lugares de estacionamento, sendo que cada
      área de estacionamento terá que garantir uma profundidade disponível de 5 metros;

      c) As dimensões de garagens fechadas e de lugares de estacionamento que se destinem a cidadãos com mobilidade condicionada
      devem respeitar as larguras de 4 metros e 3,50 metros, respetivamente, sendo a sua localização a mais próxima dos acessos
      e obrigatoriamente anexados à habitação acessível;

      2 - A área bruta a considerar para cada lugar de estacionamento de um veículo pesado deve obedecer aos seguintes parâmetros:

      a) 75 m2 (5 metros x 15 metros), à superfície;

      b) 130 m2, quando em estrutura edificada, em cave ou não.'
    - 'Artigo 60.º – Imóveis classificados ou em vias de classificação

      1 - Em conformidade com aLei n.º 107/2001, de 8 de setembro, e oDecreto-Lei n.º 140/2009, de 15 de junho, nos imóveis
      classificados ou em vias de classificação:

      a) É proibida a execução de inscrições ou pinturas bem como, a colocação de anúncios, cartazes ou outro tipo de material
      informativo sem a autorização da administração do património cultural competente;

      b) Os estudos e projetos para a realização de obras ou intervenções, para além dos elementos instrutórios decorrentes
      de cada procedimento, devem integrar ainda, um relatório sobre a importância e a avaliação artística ou histórica da
      intervenção, nos termos doDecreto-Lei n.º 140/2009de 15 de junho;

      c) Os estudos e projetos referidos na alínea anterior, bem como as obras ou intervenções que deles decorram, serão objeto
      de autorização prévia da Câmara Municipal e parecer favorável e acompanhamento da administração do património cultural
      competente.

      d) Concluída a intervenção, no prazo de 30 dias, deverá ser elaborado e remetido à administração do património cultural,
      competente, o relatório final, de acordo com o n.º 1 do Artigo 11.º doDecreto-Lei n.º 140/2009.

      2 - Para estes imóveis deverão ser consideradas as seguintes obras ou intervenções

      a) De conservação, nos termos das disposições legais e regulamentares aplicáveis e nas seguintes condições específicas:

      i) Executadas com vista à manutenção fiel das características do edifício, no tocante aos seus elementos estruturais,
      arquitetónicos, ou decorativos e, com recurso a técnicas e materiais iguais, idênticos ou compatíveis com os existentes
      à data da sua construção;

      ii) Admitidas substituições totais, apenas nos casos em que se verifique a degradação irrecuperável dos elementos referidos
      no ponto anterior, devidamente comprovada após visita técnica realizada pela Câmara Municipal e, nas seguintes condições:

      i) Cobertura - feita com vista à reconstrução da situação preexistente, quer no que se refere à estrutura quer ao revestimento,
      devendo preferencialmente, proceder-se à reutilização de alguns materiais nomeadamente, madeiramento da estrutura e
      telhas cerâmicas do revestimento, sempre que estes apresentem condições para tal;

      ii) Revestimento de fachadas em rebocos de cal - feita preferencialmente, através do recurso a argamassa à base de cal
      e areia, admitindo-se em alternativa, a utilização de argamassas bastardas, com acabamento liso e pintura a cal branca
      ou pigmentada ou, a tinta não texturada, de silicatos.

      iii) Revestimento das fachadas em azulejo, materiais cerâmicos ou "fingidos de pedra" - feita através de técnicas de
      restauro e reprodução da solução preexistente e, com recurso a materiais idênticos ou compatíveis com as referidas técnicas.

      iv) Cantarias - feita através da utilização de pedras idênticas, em natureza e dimensão, às preexistentes, não sendo,
      em caso algum, permitida a substituição por pedras aplicadas como revestimento;

      v) Carpintarias e serralharias - situação onde podem ser admitidos desenhos e materiais diferentes dos preexistentes,
      desde que previamente aprovados pela Câmara Municipal.

      iii) Pontualmente, em regime de exceção e, desde que analisados caso a caso, poderão ser admitidas soluções que recorram
      a materiais e processos construtivos, não tradicionais, determinados pela solução para a reabilitação do edifício, desde
      que previamente aprovados pela Câmara Municipal, com parecer favorável da administração do património cultural competente;

      b) De alteração, nos termos das disposições legais e regulamentares aplicáveis e nas seguintes condições específicas:'
    - 'Artigo 93.º – Critérios de dimensionamento

      1 - Todas as novas edificações devem dispor de espaços destinados ao estacionamento de veículos, sendo o número de lugares
      estabelecido em função dos usos do edifício e da sua dimensão.

      2 - Sem prejuízo dos previstos em legislação específica aplicável ou do n.º 2, do artigo 89.º do presente Regulamento,
      deve garantir-se o cumprimento dos seguintes mínimos:

      a) Em habitação coletiva, um lugar de estacionamento por cada fogo de habitação de tipologia T0, T1 e T2, ou área total
      de construção inferior a 120 m2/fogo;

      b) Em habitação coletiva, dois lugares de estacionamento por cada fogo de habitação de tipologia igual ou superior a
      T3, ou com área total de construção igual ou superior a 120 m2;

      c) Em moradias unifamiliares:

      i) Um lugar de estacionamento, por área total de construção inferior a 120 m2;

      ii) Dois lugares de estacionamento, por área total de construção entre 120 m2 e 300 m2;

      iii) Três lugares de estacionamento, por área total de construção superior a 300 m2.

      d) Em edifícios ou frações destinados a comércio:

      i) Um lugar de estacionamento por cada 50 m2 de área total de construção comercial;

      ii) Um lugar de estacionamento por cada 25 m2 de área total de construção comercial, para superfícies de comércio com
      uma área de construção superior a 1000 m2;

      iii) Um lugar de estacionamento por cada 15 m2 de área total de construção comercial, para superfícies de comércio com
      uma área total superior a 2500 m2.

      e) Em edifícios ou frações destinados a serviços:

      i) Três lugares de estacionamento por cada 100 m2 de área total de construção de serviços;

      ii) Cinco lugares por cada 100 m2 de área total de construção, quando a área total de construção de serviços for superior
      a 500 m2.

      f ) Em empreendimentos turísticos, o dimensionamento dos lugares de estacionamento deve observar as disposições das
      portarias em vigor para o efeito, decorrente da legislação específica;

      g) Em armazém ou indústria, um lugar por cada 150 m2 de área total de construção, devendo ainda ser prevista no interior
      da parcela de terreno ou prédio, a área necessária às operações de carga e descarga de veículos pesados, bem como ao
      estacionamento dos mesmos, em número a determinar, caso a caso em função do tipo de indústria ou armazém a instalar;

      h) Deve ainda ser prevista a seguinte proporção para lugares acessíveis a pessoas com mobilidade condicionada:

      i) Um lugar em espaços de estacionamento com uma lotação não superior a 10 lugares;

      ii) Dois lugares em espaços de estacionamento com uma lotação compreendida entre 11 e 25 lugares;

      iii) Três lugares em espaços de estacionamento com uma lotação compreendida entre 26 e 100 lugares;

      iv) Quatro lugares em espaços de estacionamento com uma lotação compreendida entre 101 e 500 lugares;

      v) Um lugar por cada 100 lugares em espaços de estacionamento com uma lotação superior a 500 lugares.

      3 - Para instalação de equipamentos de utilização coletiva, designadamente destinados à satisfação de necessidades nos
      domínios da saúde, educação, cultura e desporto, deve proceder-se a um estudo de mobilidade e estacionamento que permita
      definir as necessidades em número de lugares de estacionamento e as condições de acessibilidade.

      4 - A edificabilidade máxima a autorizar em edificações destinadas a estacionamento automóvel (garagens e auto silos)
      é a que resultar do estrito cumprimento do disposto nos instrumentos de gestão territorial aplicáveis ao local.'
  - source_sentence: Quantos lugares de estacionamento são exigidos para pessoas com mobilidade reduzida?
    sentences:
    - 'Artigo 61.º – Edificações notáveis

      1 - Nas edificações notáveis serão preferencialmente, permitidas as obras e intervenções referidas no artigo anterior.


      Artigo 62.º – Frentes de qualidade

      1 - Nos edifícios incluídos na "frente de qualidade" serão preferencialmente, permitidas as seguintes obras ou intervenções:

      a) De conservação nos termos das disposições legais e regulamentares aplicáveis;

      b) De reconstrução com preservação de fachada, nos termos das disposições legais e regulamentares aplicáveis e, de acordo
      com as seguintes condições específicas:

      i) Correção pontual de adulterações provocadas por intervenção posteriores e ou de notória má qualidade;

      ii) Abertura pontual de outros vãos, necessários à viabilização do processo de reabilitação do edifício, podendo ser
      utilizadas soluções, assumidamente modernas que, pelo seu desenho e sobriedade, valorizem a fachada marcando simultaneamente
      a época da intervenção;

      c) Ampliação em altura, desde que não resulte edificação com cércea superior à das edificações confinantes mais elevadas,
      justificada pela melhoria das condições de habitabilidade ou reabilitação do edifício e, em recuado obedecendo às seguintes
      condições:

      i) Afastamento mínimo de 2,4 metros, face ao plano exterior da fachada;

      ii) Altura exterior máxima de 3 metros, na solução de terraço e de 2,70 metros na solução de beirado;

      iii) Inclinação da cobertura igual à dos edifícios confinantes ou máxima de 30.º, nas coberturas em telhado;

      d) Excetuam-se os casos em que, as preexistências na frente urbana ou, a dimensão reduzida do lote, não permita uma
      solução em recuado, devendo nestes casos, a ampliação ser na continuidade da fachada existente;

      e) De ampliação em profundidade, nos termos das disposições legais e regulamentares aplicáveis e nas seguintes condições
      específicas:

      i) Assegurar as indispensáveis condições de insolação e salubridade do edifício ampliado e da envolvente;

      ii) Ter em conta a necessária articulação com a volumetria dos edifícios contíguos;

      iii) Não comprometer projetos de conjunto existentes para a revitalização do interior dos quarteirões;

      iv) Respeitar os alinhamentos existentes, salvo o disposto em plano municipal de ordenamento do território que expressamente
      o contrarie.


      SECÇÃO III – Edifícios em geral'
