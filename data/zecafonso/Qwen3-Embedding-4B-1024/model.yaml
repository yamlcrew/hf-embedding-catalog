  - 'Artigo 98.º – Rampas

    1 - As rampas de acesso ao estacionamento no interior dos prédios não podem, em caso algum, ter qualquer desenvolvimento
    na via ou espaço público, incluindo passeios, devendo ser realizadas de modo a permitir uma boa visibilidade por parte
    dos condutores que saem do estacionamento.

    2 - As rampas devem permitir a fácil inscrição geométrica, sem recurso a manobra.

    3 - A largura mínima das rampas é de 3 metros, podendo a largura máxima atingir 9,50 metros em função da capacidade global
    do parqueamento e da utilização do edifício, a fundamentar em projeto e sujeito a apreciação caso a caso.

    4 - A inclinação máxima das rampas não pode ser superior a 18 % e deve ser demonstrada a utilização em condições de segurança
    dos veículos, recorrendo a diferentes percentagens de inclinação sempre que necessário.

    5 - Sempre que a inclinação ultrapasse os 12 %, deve ser prevista curva de transição com a zona de concordância nos pisos,
    com uma extensão mínima de 3 metros, em situações excecionais, e de 3,50 metros em situações correntes, e com inclinação
    reduzida a metade da inclinação da rampa.

    6 - Sempre que se mostre necessário, pode ser imposta a colocação de sinalização luminosa que controle a circulação nas
    zonas de rampa.

    (ver documento original)


    Artigo 99.º – Monta-carros

    É permitida a aplicação de monta-carros em substituição de rampas nos casos plenamente justificados pela dimensão e geometria
    do lote ou prédio, e ainda pela impossibilidade de circulação interior, cumprindo-se os seguintes requisitos:

    a) Devem servir um parqueamento com capacidade máxima de 50 lugares de estacionamento, distribuídos pelo máximo de três
    pisos;

    b) Prever a aplicação de 1 monta-carros por cada 25 veículos;

    c) A plataforma deve ter as dimensões mínimas livres de 2,50 metros de largura por 5 metros de comprimento;

    d) Não é admissível a instalação de monta-carros em estabelecimentos para serviço público.


    Artigo 100.º – Circulação interior

    1 - A circulação no interior dos pisos de estacionamento deve ser garantida sem recurso a manobras, nos percursos de ligação
    entre os pisos;

    2 - A largura mínima das faixas de circulação é de:

    a) 4,50 metros em estacionamento a 45.º;

    b) 5 metros em estacionamento a 60.º;

    c) 5,50 metros em estacionamento a 90.º;

    d) 4 metros em estacionamento longitudinal;

    e) Devem ser previstas zonas livres, nos locais próximos à entrada/saída das rampas, de modo a permitir a passagem cruzada
    ou a espera de veículos;

    f ) Os pilares ou outros obstáculos devem ser devidamente sinalizados e protegidos;

    g) O pavimento das rampas e dos pisos deve ser antiderrapante e deve ser previsto um sistema de caleiras que permita a
    limpeza de óleos.

    (ver documento original)'
