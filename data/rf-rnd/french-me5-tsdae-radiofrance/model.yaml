  sentences:
  - 'À la différence d''autres fictions de grande consommation, les clichés et l''idéologie qu''elle manipule sont plutôt
    progressistes. C''est un ''Desperate Housewives'' finistérien où tout le monde est blanc et où les hommes sont absents
    ». Jean-Marc Proust: "D’un point de vue sociologique, c''est un livre important. D''un point de vue littéraire, c''est
    nul" L’auteur et critique pour Slate a trouvé qu’Aurélie Valognes a vraiment un rôle de passeuse malgré son statut d’auteure
    à succès: « Elle nous parle de Simone de Beauvoir, de Virginia Woolf, d''Agnès Varda et elle en parle à des gens qui ne
    lisent pas Simone de Beauvoir et qui ne regardent pas les films d''Agnès Varda, et je ne dis pas ça par mépris de classe.
    Elle porte ce rôle important de transmission, de passeuse, de traduction du féminisme, même si elle le fait de manière
    très superficielle. Ensuite, elle s''inscrit dans la veine du roman'
  - 'de ces grands mammifères marins. Pour essayer d’y voir plus clair, des biologistes américains, ont rassemblé les données
    de suivi de population de baleines franches recueillies sur plus de 40 ans, puis il ont passées ces données à la moulinette
    d’un modèle mathématique pour estimer l’espérance de vie de ces cétacés. Un peu comme le font les compagnies d’assurance
    pour évaluer l’espérance de vie humaine. Résultat: les baleines franches australes ont une durée de vie médiane de 74
    ans et 10 % d’entre elles peuvent dépasser les 130 ans, soit bien plus que ce que l’on croyait. Cette étude laisse penser
    que chez les baleines, l’extrême longévité observée chez certaines espèces pourrait-être la règle et non l’exception.
    Encore faut-il laisser à ces géantes des mers le temps de vivre. Pour en savoir plus: l''étude publiée dans Science Advances,
    un article du Figaro et un article du Monde'
