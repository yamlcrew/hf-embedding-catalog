  sentences:
  - 'réalisation de Luc Jean Reynaud Historien, critique littéraire, essayiste, ses ouvrages ont renouvelé l’histoire culturelle
    européenne, à commencer par son premier livre: Le Mythe et l’Empire dans la littérature autrichienne moderne, paru en
    1963, et devenu depuis un classique. Traduit en une vingtaine de langues Danube, à la fois journal de voyage, essai, roman,
    itinéraire existentiel, et récit d’une métamorphose intérieure, tout comme le seront plus tard Microcosmes » et Ithaque
    et au delà, l’a rendu célèbre dans le monde entier. Dans la lignée des grands écrivains de l’Empire austro-hongrois, il
    incarne, comme ses aînés triestins Italo Svevo ou Umberto Saba, cette « identité de frontière », cette crise de la culture
    et cette culture de la crise, qu’il a si subtilement analysées. Chacun de ses livres interroge les dilemmes, les inquiétudes,
    les vertiges d’un passé dont nous sommes les héritiers directs, fouille, avec une immense érudition, ce terreau prodigieux'
