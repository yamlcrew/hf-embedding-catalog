      character selection dial.
  - text: surname meaning, fontana
  - text: garlic did originate near Siberia, Russia so powder was made also at russia at american factory. Garlic is native
      to central Asia, but its use spread across the world more than 5000 years ago, before recorded history. It was worshipped
      by the Egyptians and fed to workers building the Gread Pyramid at Giza, about 2600 BC. Greek athletes ate it to build
      their strength.
