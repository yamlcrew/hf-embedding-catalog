  - source_sentence: Hvilken lov regulerer rettighetene til pasienter og brukere av helsetjenester?
    sentences:
    - '# Pasient- og brukarombodet


      Er du ikkje nøgd med helsetenestene, eller har spørsmål om rettane dine, kan du få hjelp og råd frå pasient- og brukarombodet.
      Kven som helst kan ta kontakt.


      ## Kva er pasient- og brukarombodet?


      Pasient- og brukarombodet skal arbeide for å ivareta pasientens og brukarens behov, interesser og rettssikkerheit. I
      tillegg skal dei bidra til å betre kvaliteten i tenestene.


      Om du er misnøgd med helsetenestene du har motteke eller ikkje fekk den helsehjelpa du trong, kan du kontakte pasient-
      og brukarombodet.


      Pasient- og brukarombodet jobbar med saker innafor offentlege helse- og omsorgstenester. Dette gjeld òg tannhelse.


      ## Kva kan du få hjelp med?


      Pasient- og brukarombodet kan gje råd og informasjon om rettar du har i helsetenesta.


      Pasient- og brukarombodet kan blant anna hjelpe deg med:


      - Informasjon om rettar du som pasient har

      - Tydeleggjere ting som er vanskeleg å forstå

      - Finne ut av kva som er lurt å ta tak i først

      - Finne ut kven det er lurt å kontakte

      - Formulere og formidle spørsmål, tilbakemeldingar og klagar

      - Korleis du klagar på behandling eller avgjerder om din rett til helse -og omsorgshjelp

      - Å delta i møte med tenesta

      - Korleis du søker om erstatning


      ## Kven kan få hjelp?


      Alle kan kontakte pasient og brukarombodet og tenesta er gratis. Du treng ikkje tilvising for å ta kontakt. Pasient-
      og brukarombodet har teieplikt og du er anonym om du ønskjer det.


      Om du er usikker på om du kan få hjelp av pasient- og brukarombodet, kan du uansett ta kontakt for å diskutere saken
      din.


      ## Finn ditt lokale ombodskontor


      Pasient- og brukarombodet har kontor 15 ulike stader i Noreg. Kvart kontor leiast av eit lokalt ombod. Ring 40 50 16
      00, eller sjå liste over dei ulike kontora og korleis du kan kontakte dei på [ombodet sine nettsider.](https://www.pasientogbrukerombudet.no/behov-for-a-snakke-med-oss)


      ## Kontakt Pasient- og brukarombodet


      [40 50 16 00](tel:+4740501600)


      Kontakt oss om du har erfaringar eller spørsmål du ønskjer å ta opp.


      ## pasientogbrukerombudet.no


      Sjå nettsidane til Pasient- og brukarombodet for meir informasjon, eller for å finne ditt lokale kontor.


      [pasientogbrukerombudet.no (pasientogbrukerombudet.no)](https://www.pasientogbrukerombudet.no/)


      ## Helse- og omsorgsdepartementet (lovdata.no)


      Pasient- og brukarrettigheitsloven innehalder rettsreglar om rettar pasientar og brukarar har overfor helse- og omsorgstenesten.


      [Kapittel 8: Pasient- og brukerombud (lovdata.no)](https://lovdata.no/dokument/NL/lov/1999-07-02-63#KAPITTEL_9)


      Innhaldet er levert av [Pasient- og brukarombodet](/nn/samarbeidspartnere/#pasient-og-brukarombodet)


      Slik refererer du til innhaldet Pasient- og brukarombodet. Pasient- og brukarombodet. [Internett]. Oslo: Helsedirektoratet;
      oppdatert onsdag 6. juli 2022 [henta tirsdag 9. desember 2025]. Tilgjengeleg frå: [https://www.helsenorge.no/nn/rettigheter/pasient--og-brukarombodet/](https://www.helsenorge.no/nn/rettigheter/pasient--og-brukarombodet/)


      Sist oppdatert onsdag 6. juli 2022'
    - '## Barnehagestart


      Du skal ta imot et barn med synsnedsettelse i barnehagen. Da er det lurt å tenke igjennom noen prinsipper for å tilrettelegge
      barnehagestart. Både før barnet starter, og i hverdagen som kommer.


      Synssansen gir oss raskt overblikk over omgivelser og situasjoner, både på nært hold og på avstand. Hos et barn synsnedsettelse
      kan vi ikke forvente at barnet kan utfolde seg og være aktivt i omgivelser der det ikke er kjent. Barnet kan trenge
      ekstra tid og støtte til å gjøre seg kjent og utforske nye miljøer.


      Barnets synsnedsettelse bør være utgangspunkt for å tilrettelegge. Planlegg barnehagestart eller overgang i god tid,
      og gjør deg kjent med barnets individuelle behov. Pedagogisk-psykologisk tjeneste (PPT) og Statped kan være aktuelle
      samarbeidspartnere og veilede barnehagen.


      ## Tenk igjennom:


      - Har barnet oversikt i avdelingen? Barnet kan ha vansker med oversikt i det fysiske miljøet, rommet, leken og fellesskapet.
      Tenk gjennom hvordan du kan løse dette i din barnehage ut fra barnets synsfunksjon.

      - Har barnet nok tid til å bli kjent? Barnet kan bruke flere sanser for å gjøre seg kjent, for eksempel hørsel- og taktilsansen.
      Barn med synsnedsettelse kan trenge ekstra tid og støtte til å gjøre seg kjent med og utforske barnehagen. Synsfunksjon
      og individuelle forutsetninger avgjør behovet.

      - Hvor bruker barnet energien sin? Barnet trenger overskudd til å delta i lek, aktiviteter og sosialt samspill i løpet
      av dagen. Barn med synsnedsettelse bruker ofte mer energi enn andre barn i barnehagen. Vær nysgjerrig på hvordan barnet
      kompenserer for synsnedsettelsen, og hvor barnet har behov for at du tilrettelegger.


      ## Tips og råd


      Ivareta barnets behov fra barnehagestart. Tenk på hvordan du kan ta hensyn når du tar pedagogiske valg, og hvordan du
      utformer lekemiljøet i barnehagen.


      ### Før barnehagestart


      Vurder om barnet trenger ekstra besøksdager før barnehagestart. For noen barn kan det legge et godt grunnlag for barnehagestart
      og tilvenning. Tenk igjennom om det fysiske miljøet er godt tilrettelagt for barnet. En ryddig inndeling av rommet med
      faste og tydelige lekesoner gjør at barnet lettere kan orientere seg.


      - Avgrens med tepper, matter og møbler for å skape små lekesoner.

      - Ha et bevisst forhold til mengden av visuell informasjon på veggene. La visuell informasjon være tydelig og avgrenset.

      - Unngå hyppig ommøblering, og la leker og materiell ha faste plasser.

      - Pass på at barnets garderobeplass, hyller og skuffer er ytterst eller innerst på en rekke. Vurder å markere plassen
      med kontrastfarge eller taktil markering ut fra barnets synsfunksjon.


      ### Etter barnehagestart


      Vær ekstra oppmerksom på alle de små overgangene i barnehagen. Når må du tilrettelegge slik at barnet har oversikt og
      vet hva som skjer og hvor det skal?


      - Forutsigbare og gjenkjennelige rutiner kan gjøre at barnet bruker mindre energi på å holde oversikt.

      - Mindre grupper gir mer ro og oversikt og gjør det lettere å delta i lek. Pass på at du og resten av personalet i barnehagen
      bruker et presist språk i barnehageavdelingen.

      - Unngå ord som hit, dit, her og der, og bruk navn aktivt når du og resten av barnehagepersonalet snakker med barna,
      istedenfor dere, vi og de.


      Å lage holdepunkter eller kjennemerker i barnehagemiljøet kan gjøre det lettere for barnet å være selvstendig og finne
      frem på egenhånd. Eksempler kan være tydelig taktil eller visuell merking av rom og visuell eller taktil merking av
      lekekasser, kurver og skap.


      ### Leker og materiell i et inkluderende barnehagemiljø


      Du kan skape et inkluderende barnehagemiljø som er godt for alle barn.


      - Legg til rette for varierte sanseerfaringer og felles opplevelser.

      - Ha et variert materiell med leker som stimulerer til taktil utforsking, eller som har sterke farger og kontraster.

      - Tenk igjennom og tilrettelegg for barnet med synsnedsettelse fra barnehagestart.'
    - 'Som utsendt personell ved utenlandske representasjoner i Norge får du ikke automatisk tildelt fastlege. Dette gjelder
      også for dine familiemedlemmer i Norge.


      Du velger selv om du vil melde deg inn i fastlegeordningen. Din representasjon vil hjelpe deg med innmeldingen.


      Hvis du senere ønsker å bytte fastlege, kan du ringe Veiledning Helsenorge på telefonnummer 23 32 70 00. Har du Bank-ID,
      vil du også logge deg inn på Helsenorge og bytte fastlege selv.


      ## Fastlege når du er student


      Fastleger tilknyttet helsetjenesten ved universiteter og høyskoler kan benyttes av studenter som har betalt semesteravgift
      og av deres barn under 16 år. Studenter som flytter tilbake til tidligere bostedskommune innen tre år, har krav på å
      få tilbake sin fastlege i kommunen selv om listen er full. Denne muligheten gjelder i 6 måneder fra flytting tilbake
      til bostedskommunen.


      Studenter som har meldt flytting til utlandet, har ikke krav på å få tilbake sin tidligere fastlege.


      Er du student tilknyttet studentsamskipnaden i Oslo? [Se SIOs egne nettsider.](https://www.sio.no/helse/legehjelp-og-fastlege)


      ## Fastlege når du er på sykehjem


      Ved opphold på sykehjem har du krav på å beholde fastlegen din, men du må bruke sykehjemslegen så lenge du bor på sykehjemmet.
      Dersom du vil melde deg ut eller inn av fastlegeordningen, må du ta kontakt med Veiledning Helsenorge på telefonnummer
      23 32 70 00.


      ## Legehjelp ved akutt sykdom


      Ved akutt oppstått skade eller sykdom utenom fastlegens åpningstid må du kontakte legevakten (116 117). Står det om
      liv, ring 113.


      Fastlegen er ansvarlig for alle allmennlegeoppgaver for sine pasienter i legekontorets åpningstid. Fastlegen skal prioritere
      personer på sin liste foran andre, bortsett fra ved akutt, livstruende sykdom.


      ## [Ring legevakten på 116 117](https://www.helsenorge.no/hjelpetilbud-i-kommunene/legevakt/)


      Legevakten er døgnåpen, og tilbyr hjelp ved akutt sykdom, skader og kriser. Ring nærmeste legevakt gratis på telefonnummer
      116 117 når fastlegen ikke kan nås.


      Illustrasjon: Rebecca Ravneberg/Helsedirektoratet


      ## Ansvaret for fastlegeordningen


      Kommunene eier fastlegeordningen og inngår avtale med fastlegene. Det er også hver enkelt kommune som skal sørge for
      at det er nok fastleger i en kommune. Helfo administrerer fastlegeordningen på vegne av kommunene.


      I hver kommune finnes det en fastlegeansvarlig.


      ## Klage på fastlegen/fastlegeordningen


      Dersom du ikke er fornøyd med fastlegen, har du rett til å klage.


      Erfaring viser at det ofte er svikt i kommunikasjonen som fører til at pasienter ikke er fornøyd med legen. Det kan
      derfor være lurt først å bestille en time hos legen for å si ifra hvis du ikke er fornøyd. Ta gjerne med deg en som
      kan støtte deg.


      Det er en fordel at du ved bestilling av timen gir beskjed om at det gjelder klage på behandlingen. Det gir legen mulighet
      til å sette av mer tid til samtalen. Dersom dette ikke fører frem kan du konferere med den i kommunen som har ansvar
      for fastlegeordningen eller sende en klage til Fylkeslege med kopi til kommuneoverlegen.


      Kommunen har ansvaret for tilbudet av fastleger. Dersom det ikke er ledig fastleger i kommunen, skal du rette klagen
      din til kommunen.


      ## Reservasjon mot fastlegeordningen


      Dersom du vil melde deg ut eller inn av fastlegeordningen, må du ta kontakt med Veiledning Helsenorge på telefonnummer
      23 32 70 00.


      Innholdet er levert av [Helfo](/samarbeidspartnere/#helfo)


      Slik refererer du til innholdet Helfo. Rett til fastlege. [Internett]. Oslo: Helsedirektoratet; oppdatert onsdag 5.
      februar 2025 [hentet tirsdag 9. desember 2025]. Tilgjengelig fra: [https://www.helsenorge.no/fastlegen/om/rett-til-fastlege/](https://www.helsenorge.no/fastlegen/om/rett-til-fastlege/)


      Sist oppdatert onsdag 5. februar 2025'
  - source_sentence: '- Er det ventetid for å få time hos BUP?'
    sentences:
    - '# Klinikk psykisk helsevern for barn og unge (PBU)


      Klinikk psykisk helsevern for barn og unge (PBU) gir spesialisert helsetilbod til barn og unge (0-18 år) med psykiske
      vanskar, og deira pårørande. Dette kan til dømes vere utgreiing og behandling av angst, åtferdsvanskar, utviklingsforstyrringar,
      AD/HD, depresjon, tvangslidingar, autisme, sjølvmordsfare, psykose, spiseforstyrringar, skulevegring, m.m. Vi består
      av både poliklinikkar (BUP) og sengepostar.


      ## Les meir om Klinikk psykisk helsevern for barn og unge (PBU)


      [Informasjon om psykiske vansker](/avdelinger/psykisk-helsevern/psykisk-helsevern-for-barn-og-unge/informasjon-om-psykiske-vanskar)


      ### Kven møter du hos oss?


      I Klinikk psykisk helsevern for barn og unge jobbar menneske med forskjellig utdanning innan psykisk helsearbeid. Det
      gjeld både sjukehusavdelingane og poliklinikkane. Som regel vert du først tilvist ein poliklinikk ikkje langt frå der
      du bor. Her blir du teke godt imot av ein eller to personar som vil snakke med deg om korleis du har det. Saman med
      deg og din familie finn vi ut kva vi kan gjere, for at du skal få det betre.


      Nokre av pasientane våre treng i ein periode litt tettare oppfølging enn ein poliklinikk kan tilby. Dei kan få hjelp
      på ein av dei tre sjukehuspostane våre.


      ### Korleis jobbar vi?


      På poliklinikkane vert ingen lagt inn. Du kjem til avtalt tid, og reiser heim igjen etter samtalen med behandlaren din.
      BUP samarbeider med deg og / eller foreldra dine om kva type hjelp du skal få. Behandlingstilbodet kan bestå av individualsamtalar,
      gruppebehandling, familiebehandling og eventuelt medikamentell behandling. I tillegg  vert det arrangert informasjonsgrupper
      for føresatte.


      BUP jobbar også saman med andre offentlege instansar, som for eksempel skule / barnehage, fastlege, helsesyster og barnevern,
      for å finne fram til det beste behandlingstilbodet for pasientane våre. BUP kan også kontakte kommunen der du bor, for
      å melde behov for individuell plan. Du kan lese meir om individuell plan på nettsiden til Helsenorge.no.


      Dersom det viser seg at du har behov for meir hjelp enn poliklinisk behandling, vil din behandlar ved poliklinikken
      tilvise deg vidare til innlegging i ein av klinikken sine sjukehusposter, eller til meir spesialisert utgreiing ein
      annan stad på sjukehuset. Dei fleste pasientar som kjem til oss blir betre av å snakke med profesjonelle hjelparar i
      løpet av nokre månader. Nokon har behov for oppfølging over lengre tid.


      ### Tilvisingsrutinar


      Klinikk Psykisk helsevern for barn og unge (PBU) har sju allmennpoliklinikkar (BUP) med ulikt geografisk ansvar, og
      tre sengepostar. Tilvisingar til Helse Bergen frå andre helseregionar kan gjerast med bakgrunn i rett til val av behandlingsstad.
      Lege, psykolog, leiar for barnevernstenesta, og leiar for NAV kommune (sosialtenesta) kan tilvise til BUP.


      [Les meir om tilvisingsrutinar, hastevurderingar og akuttpsykiatrisk hjelp for barn og unge](/avdelinger/psykisk-helsevern/psykisk-helsevern-for-barn-og-unge/informasjon-til-tilvisarar-og-fagpersonar)


      ### Pakkeforløp psykiske helse for barn og unge


      Pakkeforløp for psykiske lidingar hos barn og unge skal bidra til at du får heilskapleg utgreiing og behandling utan
      at du må vente unødig. For å sikre god oppfølging og unngå unødig venting, har vi det som blir kalla forløpskoordinatorar.
      Forløpskoordinatoren kan svare på spørsmål om timar og kva som skal skje undervegs i behandlinga di.


      [Les meir om pakkeforløp og forløpskoordinator](/pakkeforlop/pakkeforlop-psykisk-helse-og-rus/pakkeforlop-psykiske-lidingar-hos-barn-og-unge)


      ### Samhandling


      [Tenesteavtale 3 og 5 rusmedisin og psykiatri - Saman](https://www.saman.no/avtalar/tenesteavtalar/tenesteavtale-3-og-5-rusmedisin-og-psykiatri/)


      ### Poliklinikkar


      Ein BUP er ein poliklinikk, eller enklere sagt ein stad der barn, ungdom og foreldra deira får tilbod om hjelp med psykiske
      vanskar. På BUP vert ingen lagt inn. Pasientar kjem til samtalar til avtalt tid, og går heim igjen etter samtalen.'
    - "Små påkjenninger kan føre til sårskade. Det kan være nok at man kommer bort i noe litt hardt eller putter hendene i\
      \ lomma. Det tar ofte lang tid før sårene gror.\r\n\r\n#### Vannfylte blemmer\r\n\r\nDe vannfylte blemmene er for det\
      \ meste små. Noen kan bli store og kan vare i flere uker. "
    - 'Oppstart i februar 2025. Se også: [Kurs for unge pårørende](/nyhetsarkiv/kurs-for-foreldre-og-unge-parorende)


      ### FACT Ung


      Målgruppen er ungdom i alderen 12-18 år som en antar trenger langvarig og koordinert innsats fra flere tjenester og
      nivåer. Dette kan være ungdom med funksjonssvikt innenfor områder som psykisk helse, skole, nettverk, arbeid, familie,
      rus, kriminalitet, seksualitet og avhengighet.


      FACT Ung er et samarbeidsprosjekt mellom spesialisthelsetjenesten og kommunehelsetjenesten. For å få behandling av FACT
      Ung må de unge henvises videre fra Barne- og ungdomspsykiatrisk poliklinikk (BUPP) Sarpsborg i Sykehuset Østfold.


      ### Mer om tjenestene:


      ##### Trinnvis sammen -  barn og unge (7-12 år)


      Tjenester til barn og unge som har opplevd vanskelige hendelser eller traumer. Her får foreldre/foresatte opplæring
      i hvordan de kan hjelpe barna sine.


      - Behandlingen er for barn mellom 7-12 år som har opplevd noe potensielt traumatisk og skremmende etter 3-årsalder,
      og som i ettertid plages av dette.

      - Eksempler på slike hendelser kan være: Naturkatastrofer, ulykker, hundebitt, alvorlige nestenulykker, alvorlig mobbing,
      ubehagelig behandling på sykehus, plutselig/alvorlig skade/død av viktig person, vold, vitne til vold, fysisk mishandling
      eller lignende.

      - Virksomhet kompetansesenter rus og psykisk helse i Sarpsborg kommune deltar i et forskningsprosjekt i samarbeid med
      Nasjonalt kompetansesenter om vold og traumatisk stress (NKVTS).

      - Målet er å hjelpe barn og unge som opplever symptomer på traumer til å få det bedre. Sammen med foreldrene eller den
      som har omsorgen for barnet, øver man seg på å sette ord på tanker og følelser, regulere angst og finne gode måter å
      slappe av på.


      **Ønsker du mer informasjon, ta kontakt på mob.  '
  - source_sentence: Er uttalelsene fra pasient- og brukerombudet bindende?
    sentences:
    - 'Ved mer sammensatt eller langvarig problematikk kan det være behov for en bredere tverrfaglig kartlegging, eventuelt
      i samarbeid med andre instanser. En kombinasjon av åpne kartleggingssamtaler og standardiserte kartleggingsverktøy er
      et godt utgangpunkt. Det finnes i dag flere kartleggingsverktøy som kan benyttes, avhengig av hva man ønsker å undersøke,
      se oversikt på [PsykTestBarn - RBUP (psyktestbarn.r-bup.no)](https://psyktestbarn.r-bup.no/no) .


      Under følger noen råd for å skape trygghet og god kontakt med barnet/ungdommen/foreldre under kartleggingen:


      - Klargjør hensikt med, og forventninger til, samtalen.

      - Informer om tjenesten, oppgaver og roller.

      - Ha fokus på struktur og tid, oppsummer og be om tilbakemelding ved samtalens slutt.

      - Skap trygghet gjennom kroppsspråk, aktiv lytting, dialog og interesse.

      - Formidle håp og tro på at bedring er mulig.


      Under følger eksempler på tema for en kartlegging (listen er ikke uttømmende, og tema varierer avhengig av den enkeltes
      situasjon):


      - Aktuelt: bakgrunn for at familien tar kontakt, hvilke tjenester de har kontakt med og hvilke tiltak som er prøvd ut
      før.

      - Familien og barnets/ungdommens behov og forventninger til behandling og oppfølging.

      - Barnets/ungdommens plager; alvorlighet, varighet, omfang og intensitet.

      - Barnets/ungdommens trivsel og fungering på ulike arenaer som barnehage, skole, venner, fritidsaktiviteter og bruk
      av sosiale medier.

      - Familieforhold, nettverk, ressurser og sosiale forhold, samt psykiske og fysiske utfordringer eller rusproblemer hos
      foreldre eller søsken.

      - Somatisk helse, søvn, kosthold og eventuell medisinering.

      - Psykologiske faktorer: selvbilde, mestringsstrategier, reaksjonsmåter og beskyttelses- og sårbarhetsfaktorer.

      - Psykologiske belastninger og eventuelle traumatiske hendelser, herunder mobbing, vold, overgrep og rusmiddelbruk i
      familien. Verktøyet [KATES (nkvts.no)](https://www.nkvts.no/kartleggingsverktoy/) kan benyttes.

      - For ungdom: selvmordstanker, selvskading og rusvaner.


      Etter gjennomført kartlegging gjøres en vurdering av alvorlighet av plager og hjelpebehov, eventuelt behov for umiddelbare
      tiltak. I tillegg vurderes det sammen med de det gjelder, om hvem og hvilke tjenester det er naturlig å samarbeide med,
      eksempelvis helsestasjon, skolehelsetjenesten, svangerskapsomsorgen og fastlegen.


      ### Støtte og veiledning til kartlegging i tjenesten


      Kartlegging og vurdering kan ta utgangspunkt i barn og unges grunnleggende behov som kan beskrives i tre områder: 1)
      barn og unges utviklingsbehov, 2) foreldrenes kapasitet, og 3) familie og miljø. De tre områdene med tilhørende dimensjoner
      er illustrert i modellen [Barns behov i sentrum. Kunnskapsmodellen (bufdir.no)](https://bfk.bufdir.no/) , som er basert
      på den engelske modellen [Integrated Childrens System, ICS (bettercarenetwork.org, PDF)](https://bettercarenetwork.org/sites/default/files/Framework%20for%20the%20Assessment%20of%20Children%20in%20Need%20and%20Their%20Families%20-%20Guidance%20Notes%20and%20Glossary.pdf)
      ,  se figur under:


      I Sverige har de utviklet [Första linje-boken (uppdragpsykiskhalsa.se)](https://www.uppdragpsykiskhalsa.se/wp-content/uploads/2020/03/Forsta-linjeboken.pdf)
      som er et støtte og veiledningsmateriale for førstelinjens kartlegging av barn og unges psykiske helse. Håndboka gir
      anbefalinger om hvordan førstelinjen kan kartlegge barn og unges psykiske helse og hvordan førstelinjen kan vurdere
      om det er førstelinjen eller mer spesialiserte tjenester som gir hjelpen.


      I [Barn og unges helsetjeneste - Helse Fonna (helse-fonna.no)](https://helse-fonna.no/barn-og-unges-helseteneste) er
      det utviklet samhandlingsforløp som gir forslag til aktuell kartlegging i ulike kommunale tjenester, herunder kommunal
      psykisk helsetjeneste for barn og unge. I verktøyet beskrives forslag til kartlegging i psykisk helsetjeneste ved ulike
      psykiske plager som bekymring for barn 0-3 år, tristhet og depresjonsplager, bekymring og angstplager, vold/overgrep/traumer,
      spisevansker/spiseforstyrrelser, uro og oppmerksomhetsvansker og autismespektervansker. Verktøyet er under implementering
      i flere helseregioner, men er tilgjengelig og kan benyttes av alle. [Barn og unges helsetjeneste i Møre og Romsdal (helse-mr.no)](https://helse-mr.no/avdelinger/klinikk-for-psykisk-helse-og-rus/avdeling-for-psykisk-helsevern-barn-og-ungdom/barn-og-unges-helseteneste)
      bygger på modellen fra Helse Fonna.


      Kommunens ansvar for psykisk helsetjeneste og ytelse av psykiske helse- og rustjenester er hjemlet i [helse og omsorgstjenesteloven
      (lovdata.no)](https://lovdata.no/dokument/NL/lov/2011-06-24-30/) §§ 3-1 og 3-2.


      [Innsiktsrapport psykisk helsearbeid barn og unge](https://www.helsedirektoratet.no/rapporter/psykisk-helsearbeid-for-barn-og-unge)
      gir en faglig begrunnelse om at kommunens psykiske helsetjeneste skal kartlegge hjelpebehovet hos barn og unge med psykiske
      plager, begynnende rusmiddelproblemer eller reaksjoner på belastende livshendelser. Rapporten fremhever behovet for
      en tilgjengelig tjeneste i kommunen hvor barn og unge blir kartlagt for å sikre rett hjelp, på rett sted og til rett
      tid.


      Nasjonalt pasientforløp [Psykiske lidelser - barn og unge](https://www.helsedirektoratet.no/nasjonale-forlop/psykiske-lidelser-barn-og-unge)
      beskriver kartleggingen som skal gjøres i kommunen før henvisning til spesialisthelsetjenesten.


      [Nasjonalt forløp barnevern](https://www.helsedirektoratet.no/nasjonale-forlop/barnevern) beskriver kartlegging og utredning
      av psykisk helse og rus hos barn og unge i barnevernet.


      Kommunens psykiske helsetjeneste skal tilby behandling og oppfølging til barn og unge med psykiske plager, begynnende
      rusmiddelproblemer eller reaksjoner på belastende livshendelser


      Kommunens psykiske helsetjeneste skal tilby behandling og oppfølging til barn og unge med milde til moderate psykiske
      plager, begynnende rusmiddelproblemer og reaksjoner på belastende livshendelser. Tilbudet bør ha et familieperspektiv
      og tilby foreldrestøtte og veiledning til foreldre og kommende foreldre.


      Kommunen bør ha ulike behandlings- og oppfølgingstilbud til barn og unge og deres foreldre. Det finnes ulike måter å
      beskrive behandling på. Behandling er intervensjoner eller tiltak som er igangsatt med formål om å skape endring eller
      bedring.'
    - '# Individuell plan og koordinator


      Dersom du har behov for langvarige og koordinerte helse- og omsorgstjenester, har du rett til å få utarbeidet en individuell
      plan. Du har også rett til å få en egen koordinator som leder planarbeidet.


      Med behov for koordinerte tjenester menes at det er nødvendig at fagpersonene samarbeider for at du skal få et helhetlig
      tilbud. I vurderingen skal også behov for tjenester fra eksempelvis NAV, skole, barnehage og barnevern inkluderes


      ## Hva er en individuell plan


      Individuell plan beskriver hvordan tjenestene skal samarbeide slik at du får en helhetlig oppfølging. Planen lages i
      samarbeid mellom deg og tjenesteyterne dine og oppdateres fortløpende. Planen er basert på behovene dine og det som
      er viktig for deg.


      Viktige punkter i planen er:


      - målene dine

      - hva som skal gjøres

      - hvem som har ansvar for hva

      - til hvilken tid tjenestene skal gis


      Andre tiltak og tjenester som du har behov for, inkluderes i planen, for eksempel NAV, barnevern, tilrettelegging i
      skole og barnehage osv.


      ## Hva er en koordinator


      Koordinator er en person som skal legge til rette for at tjenesteyterne samarbeider godt slik at du får en god og koordinert
      oppfølging. Koordinator sørger for at du involveres tett i arbeidet med den individuelle planen din. Koordinator vil
      ofte være en av de du mottar tjenester fra. Du kan komme med ønske om hvem du vil ha som koordinator.


      ## Hvem kan få individuell plan og koordinator


      Du som har behov for flere tjenesterover en viss tid, og hvor tjenestene må samarbeide for at tilbudet skal bli helhetlig
      og koordinert. Behovet trenger ikke å være varig. Det gjelder uavhengig av alder eller hvilke diagnoser eller funksjonsutfordringer
      du har.


      ## [Barnekoordinator](https://www.helsenorge.no/rettigheter/barnekoordinator/)


      Barnekoordinator er en rettighet for familier med barn med alvorlig sykdom, skade eller nedsatt funksjonsevne som trenger
      ulike velferdstjenester.


      Illustrasjon: Aleksandr Davydov /Mostphotos


      ## Hva vil det si for deg å ha en individuell plan og koordinator


      - Du blir involvert i planleggingen av hvordan tjenestene skal gis, og planen er basert på målene dine.

      - Du har en koordinator som har oversikt over din situasjon.

      - Du får ikke nødvendigvis flere tjenester, men du får koordinerte tjenester. Det betyr at tjenestene samarbeider for
      at du skal nå målene dine.

      - Du bestemmer hvilke opplysninger som deles mellom tjenestene.


      ## Hvordan kan du få individuell plan og koordinator


      Personell i tjenestene skal informere og tilby deg individuell plan og koordinator. Du eller dine pårørende kan også
      selv be om det. Da kan du kontakte koordinerende enhet i din kommune. Du kan få koordinator selv om du takker nei til
      individuell plan. Utarbeidelse av en individuell plan og oppnevning av koordinator kan bare gjøres dersom du samtykker
      til dette. Dersom du er innlagt på sykehus skal de melde om behov for individuell plan og koordinator til koordinerende
      enhet i kommunen dersom du kan ha behov for dette.


      ## Rett til å klage


      Du kan klage hvis du mener at du ikke har fått oppfylt retten din til individuell plan og koordinator.


      ## [Rett til å klage](https://www.helsenorge.no/klage-og-erstatning/klageordninger/)


      Du har rett til å klage hvis du mener at du ikke har fått oppfylt dine rettigheter, eller at du ikke har mottatt de
      helsetjenestene du har krav på.


      Illustrasjon: Eugenio Marongiu / Johnér Bildbyrå AB


      ## Forskrift og veileder


      ### Veiledere:


      - [Veileder om samarbeid om tjenester til barn, unge og deres familier ( kapittel 6 om individuell plan) (helsedirektoratet.no)](https://www.helsedirektoratet.no/veiledere/samarbeid-om-tjenester-til-barn-unge-og-deres-familier/individuell-plan)

      - [Veileder om rehabilitering, habilitering, individuell plan og koordinator (helsedirektoratet.no)](https://www.helsedirektoratet.no/veiledere/rehabilitering-habilitering-individuell-plan-og-koordinator)


      ### Lovdata


      - [Pasient- og brukerrettighetsloven § 2-5 og § 2-5 b (lovdata.no)](https://lovdata.no/lov/1999-07-02-63/%C2%A72-5)

      - [Helse- og omsorgstjenesteloven § 7-1 og § 7-2 (lovdata.no)](https://lovdata.no/lov/2011-06-24-30/%C2%A77-1)

      - [Spesialisthelsetjenesteloven § 2-5 og § 2-5 a (lovdata.no)](https://lovdata.no/lov/1999-07-02-61/%C2%A72-5)

      - [Forskrift om individuell plan ved ytelse av velferdstjenester (lovdata.no)](https://lovdata.no/forskrift/2022-06-22-1110)

      - [Forskrift om habilitering, rehabilitering og koordinator (lovdata.no)](https://lovdata.no/forskrift/2011-12-16-1256)


      ## Pasient- og brukerombudet


      [Pasient- og brukerombudet](https://www.helsenorge.no/rettigheter/pasient--og-brukarombodet/) hjelper deg med spørsmål
      om helsetjenester, og gir råd og veiledning om rettighetene dine.


      [Se hva Pasient- og brukerombudet kan hjelpe deg med (pasientogbrukerombudet.no)](https://www.pasientogbrukerombudet.no/hvordan-kan-vi-hjelpe)


      ### Helse- og omsorgsdepartementet (lovdata.no)


      Pasient- og brukerrettighetsloven inneholder rettsregler om de rettigheter pasienter og brukere har overfor helse- og
      omsorgstjenesten.


      [Lov om pasient- og brukerrettigheter (lovdata.no)](https://lovdata.no/dokument/NL/lov/1999-07-02-63)


      Innholdet er levert av [Helsedirektoratet](/samarbeidspartnere/#helsedirektoratet)


      Slik refererer du til innholdet Helsedirektoratet. Individuell plan og koordinator. [Internett]. Oslo: Helsedirektoratet;
      oppdatert torsdag 15. desember 2022 [hentet onsdag 28. januar 2026]. Tilgjengelig fra: [https://www.helsenorge.no/rettigheter/individuell-plan/](https://www.helsenorge.no/rettigheter/individuell-plan/)


      Sist oppdatert torsdag 15. desember 2022'
    - '# Ombudsordningene


      ##### **. Pasient- og brukerombudet**


      [Pasient- og brukerombud](https://www.helsenorge.no/pasient-og-brukerombudet) finnes i alle fylker. Ombudene arbeider
      for å ivareta pasientens og brukerens behov, interesser og rettssikkerhet overfor spesialisthelsetjenesten og den kommunale
      helse- og omsorgstjenesten. Ombudet arbeider også systematisk, for å bedre kvaliteten i tjenestene.


      Pasient- og brukerombudet erstatter ikke klageordningene, men kan bistå med å formulere og videreformidle spørsmål eller
      klage til rette instans. Ombudet kan gi råd, veiledning og informasjon om dine rettigheter som pasient, bruker eller
      pårørende. Enhver kan henvende seg til pasient- og brukerombudet og be om at en sak tas opp til behandling. Den som
      henvender seg til pasient- og brukerombudet har rett til å være anonym.


      Pasient- og brukerombudet skal gi den som har henvendt seg til ombudet, underretning om resultatet av sin behandling
      av en sak og en kort begrunnelse for resultatet. Pasient- og brukerombudet har rett til å uttale sin mening om forhold
      som hører under ombudets arbeidsområde og til å foreslå konkrete tiltak til forbedringer.


      Pasient- og brukerombudet bestemmer selv hvem uttalelsene skal rettes til. Uttalelsene er ikke bindende. Pasient- og
      brukerombudet skal underrette tilsynsmyndighetene om tilstander som det er påkrevet at disse følger opp.


      Ombudet arbeider med saker knyttet til følgende lover:


      - [Lov om kommunale helse- og omsorgstjenester](https://www.lovdata.no/cgi-wift/wiftldles?doc=/app/gratis/www/docroot/all/nl-20110624-030.html&emne=HELSE*%20%2b%20OG*%20%2b%20OMSORGS*&&)
      (helse- og omsorgstjenesteloven)

      - [Lov om helsepersonell](https://www.lovdata.no/all/nl-19990702-064.html) (helsepersonelloven)

      - [Lov om pasient- og brukerrettigheter](https://lovdata.no/dokument/NL/lov/1999-07-02-63) (pasient- og brukerrettighetsloven)

      - [Lov om pasientskadeerstatning](https://www.lovdata.no/cgi-wift/wiftldles?doc=/usr/www/lovdata/all/nl-19990702-063.html&button=s%d8k&dep=shd&)
      (pasientskadeloven)

      - [Lov om psykisk helsevern](https://www.lovdata.no/all/nl-19990702-062.html) (psykisk helsevernloven)

      - [Lov om spesialisthelsetjenesten](https://www.lovdata.no/all/nl-19990702-061.html) (spesialisthelsetjenesteloven)


      I tillegg til pasient- og brukerombudenes vanlig oppgaver, har Oslo kommune en utvidet ombudstjeneste for eldre, personer
      med rusproblemer, brukere av NAVs sosialtjeneste og familier med tilknytning til barnevernet. .


      ##### **Barneombudet**


      [Barneombudet](https://barneombudet.no/) er en statlig institusjon og skal være talsperson for barn og unge i Norge.
      Ombudet jobber for barns rettigheter på alle områder av samfunnet, herunder for barn med nedsatt funksjonsevne. Barneombudet
      er politisk uavhengig, og ingen kan si noe om hva det skal mene. En av de viktigste oppgavene er å passe på at norske
      myndigheter følger det de har forpliktet seg til etter FNs konvensjon for barns rettigheter (Barnekonvensjonen). .


      ##### **Likestillings- og diskrimineringsombudet**


      [Likestillings- og diskrimineringsombudet](https://www.ldo.no/) skal fremme likestilling og bekjempe diskriminering
      uavhengig av blant annet kjønn, etnisitet, religion, funksjonsevne, seksuell orientering, kjønnsidentitet, kjønnsuttrykk
      og alder. Ombudet håndhever diskrimineringsforbudene i lovverket, gir veiledning og er en pådriver for likestilling
      og mangfold. .


      ##### **Eldreombudet**


      Et helt nytt [eldreombud](https://lovdata.no/dokument/NL/lov/2020-06-19-80?q=lov%20om%20eldreombudet) er under etablering
      i 2020. Eldreombudets hovedoppgave skal være å fremme eldres interesser, rettigheter og behov i samfunnet og å følge
      med på utviklingen i eldres situasjon. Ombudet skal ha et nasjonalt mandat og være en uavhengig stemme for eldre i hele
      landet. Det er ikke fastsatt noen aldersgrense for hvem som defineres som eldre i eldreombudssammenheng. Personer med
      nedsatt funksjonsevne som blir eldre inngår i eldreombudets målgruppe. Eldreombudet skal imidlertid ikke ta seg av saker
      som naturlig hører inn under pasient- og brukerombudenes oppgaver. .


      ##### **Sivilombudsmannen**


      [Sivilombudsmannen](https://www.sivilombudsmannen.no/) kontrollerer forvaltningen. Kontrollen utføres på grunnlag av
      klager fra borgerne om urett og feil som måtte være gjort av offentlig forvaltning. Ombudsmannen behandler klager som
      gjelder både statlig, kommunal og fylkeskommunal forvaltning. Ombudsmannen kan også ta opp saker på eget initiativ.
      Ombudsmannen behandler av og til saker som er av viktig prinsipiell betydning for helse- og omsorgstjenestene.


      .


      *Denne artikkelen ble faglig oppdatert i september 2020*


