  - source_sentence: '- Hva slags hjelp kan vi få til tracheostomi-behandling hjemme?'
    sentences:
    - 'Les mer om [skole- og opplæringstilbud for døvblinde på dovblindhet.no.](https://www.dovblindhet.no/barnehage-skole-og-opplaering.4636489-176065.html)


      ### Bo- og omsorgstilbud


      Hjemkommunene har ansvar for bo- og omsorgstilbud til voksne døvblinde. De fleste voksne med medfødt døvblindhet bor
      i leilighet eller bofellesskap med heldøgns omsorg.


      Har du ervervet døvblindhet, kan du få tilbud om kommunal omsorgsbolig eller sykehjem, hvis du ikke lenger kan bo i
      eget hjem.


      Les mer om [bo- og omsorgstilbud for døvblinde på dovblindhet.no.](https://www.dovblindhet.no/bo-og-omsorgstilbud.4641097-176065.html)


      ### Brukerstyrt personlig assistanse og støttekontakt (BPA)


      Dette er en ordning som gir deg praktisk bistand til å gjøre ting som:


      - kle på deg

      - gjøre husarbeid

      - komme deg til skole og arbeidsplass

      - handle og lage mat

      - være sammen med venner og familie

      - engasjere deg i samfunnet.


      BPA gir deg mulighet til å administrere din egen hverdag, ved at du selv kan bestemme hvem som skal være dine assistenter,
      hva de skal bistå med og til hvilke tider.


      Les mer om [brukerstyrt personlig assistanse og støttekontakt for døvblinde på dovblindhet.no.](https://www.dovblindhet.no/brukerstyrt-personlig-assistanse-og-stoettekontakt.4832862-176065.html)


      ### Cochleaimplantat (CI)


      CI er et elektronisk apparat som opereres inn i øret. Det er et hjelpemiddel som hovedsakelig tilbys hørselshemmede
      med så store hørselstap, at de har liten eller ingen mulighet til å oppfatte tale med et vanlig høreapparat.


      Les mer om [cochleaimplantat på unn.no.](https://www.unn.no/dovblindhet/hva-kan-hjelpe/teknologi-og-hjelpemidler/horselshjelpemidler/cochleaimplantat/)


      ### Individuell plan (IP)


      Individuell plan er et verktøy som legger til rette for samarbeid mellom deg og tjenesteytere. Formålet med IP er å
      ha et helhetlig tilbud som koordineres gjennom én plan. Planen skal være individuelt tilpasset og én tjenesteyter skal
      ha hovedansvaret for oppfølgingen. Den som bruker henvender seg til har plikt til å sørge for at arbeidet med planen
      settes i gang.


      Les mer om [individuell plan på dovblindhet.no.](https://www.dovblindhet.no/individuell-plan.4590084-176065.html)


      ### Orienterings- og mobilitetsopplæring


      Eksempler på dette er:


      - bruk av hvit stokk og stokk-teknikk

      - ledsagerteknikk

      - beskyttelsesteknikk

      - orienteringsteknikk

      - opplæring i ulike tekniske hjelpemidler

      - innlæring av mobilitetsruter

      - bruk av andre og resterende sanser


      ### Tolk/ledsager


      I mange tilfeller vil du være avhengig av en tolk/ledsager som behersker de ulike kommunikasjonsformene som personer
      med døvblindhet bruker.


      En tolk/ledsager fungerer som et bindeledd mellom deg og andre personer. Her kan du finne ut mer om [tolketjenesten
      i NAV](https://www.nav.no/no/person/hjelpemidler/hjelpemidler-og-tilrettelegging/tolketjenesten) .


      Les mer om [tolk eller ledsager på dovblindhet.no.](https://www.dovblindhet.no/tolkledsager.4588731-176065.html)


      Referanser


      [Publikasjoner om medfødt døvblindhet](https://www.dovblindhet.no/publikasjoner-om-medfoedt-doevblindhet.4873964-480618.html)
      (dovblindhet.no)


      [Publikasjoner om ervervet døvblindhet](https://www.dovblindhet.no/publikasjoner-om-ervervet-doevblindhet.4874059-480618.html)
      (dovblindhet.no)


      [Nordisk definisjon av døvblindhet, 2016](https://www.dovblindhet.no/?cat=440667) (dovblindhet.no)


      Innholdet er levert av [Nasjonal kompetansetjeneste for døvblinde (NKDB)](/samarbeidspartnere/#nasjonal-kompetansetjeneste-for-dovblinde-(nkdb))


      Slik refererer du til innholdet Nasjonal kompetansetjeneste for døvblinde (NKDB). Døvblindhet. [Internett]. Oslo: Helsedirektoratet;
      oppdatert torsdag 20. juni 2024 [hentet tirsdag 9. desember 2025]. Tilgjengelig fra: [https://www.helsenorge.no/sykdom/sjeldne-diagnoser/dovblindhet/](https://www.helsenorge.no/sykdom/sjeldne-diagnoser/dovblindhet/)


      Sist oppdatert torsdag 20. juni 2024'
    - 'For noen kan det ta lang tid å erkjenne ove r for seg selv at du har et hjelpe- og tjenestebehov, finne ut hva behovet
      er og gå til det skritt et å søke hjelp. Det er derfor viktig at helsepe rsonell og andre tjenesteytere anerkjenne r
      de følelsene og tankene som kan oppstå hos tjene s temottakeren i den nye situasjonen han eller hu n er i.


      ## **Pårørende**


      Pårørende er, vanligvis, en viktig støttespiller både for personen med den sjeldne diagnosen og tjenesteytere. Mange
      pårørende opplever det som godt og riktig å være nær og å bistå personen med diagnose. Pårørende kan også være et viktig
      bindeledd mellom person med diagnose og tjenesteytere.


      Noen pårørende opplever at omsorgsoppgavene og oppfølgingen av personen med diagnose er krevende både fysisk og psykisk
      og noen kan oppleve situasjonen som overveldende. Det kan være vanskelig å sette sine egne behov opp mot den andres
      behov. Pårørende har også behov for å ivareta egen omsorg, helse og sosiale behov.


      Helsedirektoratet har gitt ut en [*Pårørendeveilede*](https://www.helsedirektoratet.no/veiledere/parorendeveileder)
      *r.*


      Veilederen inneholder mange viktige momenter knyttet til det å være pårørende og ha omsorgsoppgaver for nære personer.


      I pårørendeveilederen står det blant annet følgende om viktigheten av at helse- og omsorgstjenesten kartlegge r og fange
      r opp pårørendes behov for støtte :


      *Pårørendes samlede omsorgsoppgaver, ressurser og belastninger bør kartlegges i forbindelse med tildeling av kommunale
      helse- og omsorgstjenester til pasienten/ brukeren. Kartleggingen bør gjentas regelmessig. (s. 79)*


      Videre fremheves det som viktig at pårørende får mulighet til å møte andre i samme situasjon . I denne forbindelse nevnes
      det spesielt at:


      *For pårørende til personer med en sjelden diagnose kan det være en utfordring å finne andre personer i samme situasjon.
      Disse bør få hjelp til å møte de få som faktisk er i samme situasjon. (s. 84)*


      Det er opprettet et eget [p årørendesenter i Stavanger.](https://www.parorendesenteret.no/om-oss) Vi har blant annet
      hentet informasjonen derfra, til denne artikkelen. Pårørendesenteret innbyr pårørende til å ta kontakt og skriver om
      nettsiden:


      *Denne siden er for deg som er pårørende. Her finner du kunnskap, tips og råd. Du kan også lese om pårørendes rettigheter
      og andre pårørendes erfaringer. Nettstedet er innholdsrikt og omfatter både artikler, kunnskapsfilmer, mestringsfilmer
      og lydfiler.*


      ## **Søknad og vedtak**


      Se [Frambus temaside om søknadsprosessen](https://frambu.no/tema/soknadsprosesser-nyttige-tips/) - her kan du lese om
      søknad, vedtak og klage.


      R etten til helsetjenester i hjemme t finner du i [pasient- og brukerrettighetsloven § 2-1 a, 2. ledd](https://lovdata.no/dokument/NL/lov/1999-07-02-63/#KAPITTEL_2)
      , som må ses i sammenheng med [helse- og omsorgstjenesteloven § 3-2, 1. ledd, nr. 6, bokstav a.](https://lovdata.no/dokument/NL/lov/2011-06-24-30#KAPITTEL_3)
      [Pasient- og brukerrettighetsloven § 2-8 handler om retten til vedtak.](https://lovdata.no/dokument/NL/lov/1999-07-02-63/#KAPITTEL_2)


      *Artikkelen er faglig oppdatert 15.07.2024.*'
    - "# Forbruksmateriell\n\nHelseforetakene har ansvar for å levere nødvendig medisinsk utstyr og forbruksmateriell til\
      \ behandling hjemme/utenfor sykehus når behandlingen er igangsatt av spesialisthelsetjenesten.\n\nHelseforetakene har\
      \ i tillegg ansvar for å levere tjenester/forbruksmateriell til en rekke behandlingsforløp som ikke innbefatter medisinsk\
      \ utstyr.\n\nEksempler på forbruksmateriell og tjenester som benyttes i medisinsk hjemmebehandling:\n\n- Forbruksmateriell\
      \ til:\n    - enteral ernæring som gis via nasogastrisk sonde, perkutan gastrostomi (PEG) og gastrostomiport/sonde\n\
      \    - parenteral ernæring/intravenøs behandling som gis via ulike typer veneporter og sentrale/perifere venekateter\n\
      \    - epidural behandling som gis ved smertelindring\n    - subkutan behandling\n    - pleura/acites- drenasje\n  \
      \  - tracheostomi\n- Kompresjonsplagg til:\n    - lymfødem (og tilhørende bandasjemateriell)\n    - brannskadebehandling\n\
      \    - kjønnsdysfori/kjønnsinkongruens\n- Apnéskinner (alternativ behandling ved søvnapné)\n- Frejkaspute (behandling\
      \ av hofteleddsdysplasi hos nyfødte)\n- Kjønnsdysfori/kjønnsinkongruens (kompresjonsplagg, penisprotese, hårfjerning\
      \ og vaginablokker)\n- Taleventiler/proteser for strupeopererte\n\nHelseforetakene har også ansvar for å dekke kostnadene\
      \ til Klorhexidin 5 mg/ml, NaCl 0,9 mg/ml og Heparin 100 IE til vedlikehold/skylling av de aktuelle kateter, kanyler\
      \ og porter som benyttes. Se også ( [HELFO utstyrsliste forbruksmateriell](https://www.helfo.no/produkt-og-prislister/produkt-og-prislister)\
      \ ).\n\nListen er ikke uttømmende.\n\nDet er ulik praksis i hvordan helseforetakene organiserer utleveringen av forbruksmateriell.\
      \ Sortimentet kan være ulikt mellom helseforetakene og mellom helseregionene ( [jf. Utstyr](https://behandlingshjelpemidler.no/utstyr/)\
      \ ).\n\nVed spørsmål ta kontakt med aktuell [behandlingshjelpemiddelenhet](https://behandlingshjelpemidler.no/enhet/)\
      \ ."
