  - 'Oppstart i februar 2025. Se også: [Kurs for unge pårørende](/nyhetsarkiv/kurs-for-foreldre-og-unge-parorende)


    ### FACT Ung


    Målgruppen er ungdom i alderen 12-18 år som en antar trenger langvarig og koordinert innsats fra flere tjenester og nivåer.
    Dette kan være ungdom med funksjonssvikt innenfor områder som psykisk helse, skole, nettverk, arbeid, familie, rus, kriminalitet,
    seksualitet og avhengighet.


    FACT Ung er et samarbeidsprosjekt mellom spesialisthelsetjenesten og kommunehelsetjenesten. For å få behandling av FACT
    Ung må de unge henvises videre fra Barne- og ungdomspsykiatrisk poliklinikk (BUPP) Sarpsborg i Sykehuset Østfold.


    ### Mer om tjenestene:


    ##### Trinnvis sammen -  barn og unge (7-12 år)


    Tjenester til barn og unge som har opplevd vanskelige hendelser eller traumer. Her får foreldre/foresatte opplæring i
    hvordan de kan hjelpe barna sine.


    - Behandlingen er for barn mellom 7-12 år som har opplevd noe potensielt traumatisk og skremmende etter 3-årsalder, og
    som i ettertid plages av dette.

    - Eksempler på slike hendelser kan være: Naturkatastrofer, ulykker, hundebitt, alvorlige nestenulykker, alvorlig mobbing,
    ubehagelig behandling på sykehus, plutselig/alvorlig skade/død av viktig person, vold, vitne til vold, fysisk mishandling
    eller lignende.

    - Virksomhet kompetansesenter rus og psykisk helse i Sarpsborg kommune deltar i et forskningsprosjekt i samarbeid med
    Nasjonalt kompetansesenter om vold og traumatisk stress (NKVTS).

    - Målet er å hjelpe barn og unge som opplever symptomer på traumer til å få det bedre. Sammen med foreldrene eller den
    som har omsorgen for barnet, øver man seg på å sette ord på tanker og følelser, regulere angst og finne gode måter å slappe
    av på.


    **Ønsker du mer informasjon, ta kontakt på mob.  '
- source_sentence: Er uttalelsene fra pasient- og brukerombudet bindende?
  sentences:
  - 'Ved mer sammensatt eller langvarig problematikk kan det være behov for en bredere tverrfaglig kartlegging, eventuelt
    i samarbeid med andre instanser. En kombinasjon av åpne kartleggingssamtaler og standardiserte kartleggingsverktøy er
    et godt utgangpunkt. Det finnes i dag flere kartleggingsverktøy som kan benyttes, avhengig av hva man ønsker å undersøke,
    se oversikt på [PsykTestBarn - RBUP (psyktestbarn.r-bup.no)](https://psyktestbarn.r-bup.no/no) .


    Under følger noen råd for å skape trygghet og god kontakt med barnet/ungdommen/foreldre under kartleggingen:


    - Klargjør hensikt med, og forventninger til, samtalen.

    - Informer om tjenesten, oppgaver og roller.

    - Ha fokus på struktur og tid, oppsummer og be om tilbakemelding ved samtalens slutt.

    - Skap trygghet gjennom kroppsspråk, aktiv lytting, dialog og interesse.

    - Formidle håp og tro på at bedring er mulig.


    Under følger eksempler på tema for en kartlegging (listen er ikke uttømmende, og tema varierer avhengig av den enkeltes
    situasjon):


    - Aktuelt: bakgrunn for at familien tar kontakt, hvilke tjenester de har kontakt med og hvilke tiltak som er prøvd ut
    før.

    - Familien og barnets/ungdommens behov og forventninger til behandling og oppfølging.

    - Barnets/ungdommens plager; alvorlighet, varighet, omfang og intensitet.

    - Barnets/ungdommens trivsel og fungering på ulike arenaer som barnehage, skole, venner, fritidsaktiviteter og bruk av
    sosiale medier.

    - Familieforhold, nettverk, ressurser og sosiale forhold, samt psykiske og fysiske utfordringer eller rusproblemer hos
    foreldre eller søsken.

    - Somatisk helse, søvn, kosthold og eventuell medisinering.

    - Psykologiske faktorer: selvbilde, mestringsstrategier, reaksjonsmåter og beskyttelses- og sårbarhetsfaktorer.

    - Psykologiske belastninger og eventuelle traumatiske hendelser, herunder mobbing, vold, overgrep og rusmiddelbruk i familien.
    Verktøyet [KATES (nkvts.no)](https://www.nkvts.no/kartleggingsverktoy/) kan benyttes.

    - For ungdom: selvmordstanker, selvskading og rusvaner.


    Etter gjennomført kartlegging gjøres en vurdering av alvorlighet av plager og hjelpebehov, eventuelt behov for umiddelbare
    tiltak. I tillegg vurderes det sammen med de det gjelder, om hvem og hvilke tjenester det er naturlig å samarbeide med,
    eksempelvis helsestasjon, skolehelsetjenesten, svangerskapsomsorgen og fastlegen.


    ### Støtte og veiledning til kartlegging i tjenesten


    Kartlegging og vurdering kan ta utgangspunkt i barn og unges grunnleggende behov som kan beskrives i tre områder: 1) barn
    og unges utviklingsbehov, 2) foreldrenes kapasitet, og 3) familie og miljø. De tre områdene med tilhørende dimensjoner
    er illustrert i modellen [Barns behov i sentrum. Kunnskapsmodellen (bufdir.no)](https://bfk.bufdir.no/) , som er basert
    på den engelske modellen [Integrated Childrens System, ICS (bettercarenetwork.org, PDF)](https://bettercarenetwork.org/sites/default/files/Framework%20for%20the%20Assessment%20of%20Children%20in%20Need%20and%20Their%20Families%20-%20Guidance%20Notes%20and%20Glossary.pdf)
    ,  se figur under:


    I Sverige har de utviklet [Första linje-boken (uppdragpsykiskhalsa.se)](https://www.uppdragpsykiskhalsa.se/wp-content/uploads/2020/03/Forsta-linjeboken.pdf)
    som er et støtte og veiledningsmateriale for førstelinjens kartlegging av barn og unges psykiske helse. Håndboka gir anbefalinger
    om hvordan førstelinjen kan kartlegge barn og unges psykiske helse og hvordan førstelinjen kan vurdere om det er førstelinjen
    eller mer spesialiserte tjenester som gir hjelpen.


    I [Barn og unges helsetjeneste - Helse Fonna (helse-fonna.no)](https://helse-fonna.no/barn-og-unges-helseteneste) er det
    utviklet samhandlingsforløp som gir forslag til aktuell kartlegging i ulike kommunale tjenester, herunder kommunal psykisk
    helsetjeneste for barn og unge. I verktøyet beskrives forslag til kartlegging i psykisk helsetjeneste ved ulike psykiske
    plager som bekymring for barn 0-3 år, tristhet og depresjonsplager, bekymring og angstplager, vold/overgrep/traumer, spisevansker/spiseforstyrrelser,
    uro og oppmerksomhetsvansker og autismespektervansker. Verktøyet er under implementering i flere helseregioner, men er
    tilgjengelig og kan benyttes av alle. [Barn og unges helsetjeneste i Møre og Romsdal (helse-mr.no)](https://helse-mr.no/avdelinger/klinikk-for-psykisk-helse-og-rus/avdeling-for-psykisk-helsevern-barn-og-ungdom/barn-og-unges-helseteneste)
    bygger på modellen fra Helse Fonna.


    Kommunens ansvar for psykisk helsetjeneste og ytelse av psykiske helse- og rustjenester er hjemlet i [helse og omsorgstjenesteloven
    (lovdata.no)](https://lovdata.no/dokument/NL/lov/2011-06-24-30/) §§ 3-1 og 3-2.


    [Innsiktsrapport psykisk helsearbeid barn og unge](https://www.helsedirektoratet.no/rapporter/psykisk-helsearbeid-for-barn-og-unge)
    gir en faglig begrunnelse om at kommunens psykiske helsetjeneste skal kartlegge hjelpebehovet hos barn og unge med psykiske
    plager, begynnende rusmiddelproblemer eller reaksjoner på belastende livshendelser. Rapporten fremhever behovet for en
    tilgjengelig tjeneste i kommunen hvor barn og unge blir kartlagt for å sikre rett hjelp, på rett sted og til rett tid.


    Nasjonalt pasientforløp [Psykiske lidelser - barn og unge](https://www.helsedirektoratet.no/nasjonale-forlop/psykiske-lidelser-barn-og-unge)
    beskriver kartleggingen som skal gjøres i kommunen før henvisning til spesialisthelsetjenesten.


    [Nasjonalt forløp barnevern](https://www.helsedirektoratet.no/nasjonale-forlop/barnevern) beskriver kartlegging og utredning
    av psykisk helse og rus hos barn og unge i barnevernet.


    Kommunens psykiske helsetjeneste skal tilby behandling og oppfølging til barn og unge med psykiske plager, begynnende
    rusmiddelproblemer eller reaksjoner på belastende livshendelser


    Kommunens psykiske helsetjeneste skal tilby behandling og oppfølging til barn og unge med milde til moderate psykiske
    plager, begynnende rusmiddelproblemer og reaksjoner på belastende livshendelser. Tilbudet bør ha et familieperspektiv
    og tilby foreldrestøtte og veiledning til foreldre og kommende foreldre.


    Kommunen bør ha ulike behandlings- og oppfølgingstilbud til barn og unge og deres foreldre. Det finnes ulike måter å beskrive
    behandling på. Behandling er intervensjoner eller tiltak som er igangsatt med formål om å skape endring eller bedring.'
  - '# Individuell plan og koordinator


    Dersom du har behov for langvarige og koordinerte helse- og omsorgstjenester, har du rett til å få utarbeidet en individuell
    plan. Du har også rett til å få en egen koordinator som leder planarbeidet.


    Med behov for koordinerte tjenester menes at det er nødvendig at fagpersonene samarbeider for at du skal få et helhetlig
    tilbud. I vurderingen skal også behov for tjenester fra eksempelvis NAV, skole, barnehage og barnevern inkluderes


    ## Hva er en individuell plan


    Individuell plan beskriver hvordan tjenestene skal samarbeide slik at du får en helhetlig oppfølging. Planen lages i samarbeid
    mellom deg og tjenesteyterne dine og oppdateres fortløpende. Planen er basert på behovene dine og det som er viktig for
    deg.


    Viktige punkter i planen er:


    - målene dine

    - hva som skal gjøres

    - hvem som har ansvar for hva

    - til hvilken tid tjenestene skal gis


    Andre tiltak og tjenester som du har behov for, inkluderes i planen, for eksempel NAV, barnevern, tilrettelegging i skole
    og barnehage osv.


    ## Hva er en koordinator


    Koordinator er en person som skal legge til rette for at tjenesteyterne samarbeider godt slik at du får en god og koordinert
    oppfølging. Koordinator sørger for at du involveres tett i arbeidet med den individuelle planen din. Koordinator vil ofte
    være en av de du mottar tjenester fra. Du kan komme med ønske om hvem du vil ha som koordinator.


    ## Hvem kan få individuell plan og koordinator


    Du som har behov for flere tjenesterover en viss tid, og hvor tjenestene må samarbeide for at tilbudet skal bli helhetlig
    og koordinert. Behovet trenger ikke å være varig. Det gjelder uavhengig av alder eller hvilke diagnoser eller funksjonsutfordringer
    du har.


    ## [Barnekoordinator](https://www.helsenorge.no/rettigheter/barnekoordinator/)


    Barnekoordinator er en rettighet for familier med barn med alvorlig sykdom, skade eller nedsatt funksjonsevne som trenger
    ulike velferdstjenester.


    Illustrasjon: Aleksandr Davydov /Mostphotos


    ## Hva vil det si for deg å ha en individuell plan og koordinator


    - Du blir involvert i planleggingen av hvordan tjenestene skal gis, og planen er basert på målene dine.

    - Du har en koordinator som har oversikt over din situasjon.

    - Du får ikke nødvendigvis flere tjenester, men du får koordinerte tjenester. Det betyr at tjenestene samarbeider for
    at du skal nå målene dine.

    - Du bestemmer hvilke opplysninger som deles mellom tjenestene.


    ## Hvordan kan du få individuell plan og koordinator


    Personell i tjenestene skal informere og tilby deg individuell plan og koordinator. Du eller dine pårørende kan også selv
    be om det. Da kan du kontakte koordinerende enhet i din kommune. Du kan få koordinator selv om du takker nei til individuell
    plan. Utarbeidelse av en individuell plan og oppnevning av koordinator kan bare gjøres dersom du samtykker til dette.
    Dersom du er innlagt på sykehus skal de melde om behov for individuell plan og koordinator til koordinerende enhet i kommunen
    dersom du kan ha behov for dette.


    ## Rett til å klage


    Du kan klage hvis du mener at du ikke har fått oppfylt retten din til individuell plan og koordinator.


    ## [Rett til å klage](https://www.helsenorge.no/klage-og-erstatning/klageordninger/)


    Du har rett til å klage hvis du mener at du ikke har fått oppfylt dine rettigheter, eller at du ikke har mottatt de helsetjenestene
    du har krav på.


    Illustrasjon: Eugenio Marongiu / Johnér Bildbyrå AB


    ## Forskrift og veileder


    ### Veiledere:


    - [Veileder om samarbeid om tjenester til barn, unge og deres familier ( kapittel 6 om individuell plan) (helsedirektoratet.no)](https://www.helsedirektoratet.no/veiledere/samarbeid-om-tjenester-til-barn-unge-og-deres-familier/individuell-plan)

    - [Veileder om rehabilitering, habilitering, individuell plan og koordinator (helsedirektoratet.no)](https://www.helsedirektoratet.no/veiledere/rehabilitering-habilitering-individuell-plan-og-koordinator)


    ### Lovdata


    - [Pasient- og brukerrettighetsloven § 2-5 og § 2-5 b (lovdata.no)](https://lovdata.no/lov/1999-07-02-63/%C2%A72-5)

    - [Helse- og omsorgstjenesteloven § 7-1 og § 7-2 (lovdata.no)](https://lovdata.no/lov/2011-06-24-30/%C2%A77-1)

    - [Spesialisthelsetjenesteloven § 2-5 og § 2-5 a (lovdata.no)](https://lovdata.no/lov/1999-07-02-61/%C2%A72-5)

    - [Forskrift om individuell plan ved ytelse av velferdstjenester (lovdata.no)](https://lovdata.no/forskrift/2022-06-22-1110)

    - [Forskrift om habilitering, rehabilitering og koordinator (lovdata.no)](https://lovdata.no/forskrift/2011-12-16-1256)


    ## Pasient- og brukerombudet


    [Pasient- og brukerombudet](https://www.helsenorge.no/rettigheter/pasient--og-brukarombodet/) hjelper deg med spørsmål
    om helsetjenester, og gir råd og veiledning om rettighetene dine.


    [Se hva Pasient- og brukerombudet kan hjelpe deg med (pasientogbrukerombudet.no)](https://www.pasientogbrukerombudet.no/hvordan-kan-vi-hjelpe)


    ### Helse- og omsorgsdepartementet (lovdata.no)


    Pasient- og brukerrettighetsloven inneholder rettsregler om de rettigheter pasienter og brukere har overfor helse- og
    omsorgstjenesten.


    [Lov om pasient- og brukerrettigheter (lovdata.no)](https://lovdata.no/dokument/NL/lov/1999-07-02-63)


    Innholdet er levert av [Helsedirektoratet](/samarbeidspartnere/#helsedirektoratet)


    Slik refererer du til innholdet Helsedirektoratet. Individuell plan og koordinator. [Internett]. Oslo: Helsedirektoratet;
    oppdatert torsdag 15. desember 2022 [hentet onsdag 28. januar 2026]. Tilgjengelig fra: [https://www.helsenorge.no/rettigheter/individuell-plan/](https://www.helsenorge.no/rettigheter/individuell-plan/)


    Sist oppdatert torsdag 15. desember 2022'
  - '# Ombudsordningene


    ##### **. Pasient- og brukerombudet**


    [Pasient- og brukerombud](https://www.helsenorge.no/pasient-og-brukerombudet) finnes i alle fylker. Ombudene arbeider
    for å ivareta pasientens og brukerens behov, interesser og rettssikkerhet overfor spesialisthelsetjenesten og den kommunale
    helse- og omsorgstjenesten. Ombudet arbeider også systematisk, for å bedre kvaliteten i tjenestene.


    Pasient- og brukerombudet erstatter ikke klageordningene, men kan bistå med å formulere og videreformidle spørsmål eller
    klage til rette instans. Ombudet kan gi råd, veiledning og informasjon om dine rettigheter som pasient, bruker eller pårørende.
    Enhver kan henvende seg til pasient- og brukerombudet og be om at en sak tas opp til behandling. Den som henvender seg
    til pasient- og brukerombudet har rett til å være anonym.


    Pasient- og brukerombudet skal gi den som har henvendt seg til ombudet, underretning om resultatet av sin behandling av
    en sak og en kort begrunnelse for resultatet. Pasient- og brukerombudet har rett til å uttale sin mening om forhold som
    hører under ombudets arbeidsområde og til å foreslå konkrete tiltak til forbedringer.


    Pasient- og brukerombudet bestemmer selv hvem uttalelsene skal rettes til. Uttalelsene er ikke bindende. Pasient- og brukerombudet
    skal underrette tilsynsmyndighetene om tilstander som det er påkrevet at disse følger opp.


    Ombudet arbeider med saker knyttet til følgende lover:


    - [Lov om kommunale helse- og omsorgstjenester](https://www.lovdata.no/cgi-wift/wiftldles?doc=/app/gratis/www/docroot/all/nl-20110624-030.html&emne=HELSE*%20%2b%20OG*%20%2b%20OMSORGS*&&)
    (helse- og omsorgstjenesteloven)

    - [Lov om helsepersonell](https://www.lovdata.no/all/nl-19990702-064.html) (helsepersonelloven)

    - [Lov om pasient- og brukerrettigheter](https://lovdata.no/dokument/NL/lov/1999-07-02-63) (pasient- og brukerrettighetsloven)

    - [Lov om pasientskadeerstatning](https://www.lovdata.no/cgi-wift/wiftldles?doc=/usr/www/lovdata/all/nl-19990702-063.html&button=s%d8k&dep=shd&)
    (pasientskadeloven)

    - [Lov om psykisk helsevern](https://www.lovdata.no/all/nl-19990702-062.html) (psykisk helsevernloven)

    - [Lov om spesialisthelsetjenesten](https://www.lovdata.no/all/nl-19990702-061.html) (spesialisthelsetjenesteloven)


    I tillegg til pasient- og brukerombudenes vanlig oppgaver, har Oslo kommune en utvidet ombudstjeneste for eldre, personer
    med rusproblemer, brukere av NAVs sosialtjeneste og familier med tilknytning til barnevernet. .


    ##### **Barneombudet**


    [Barneombudet](https://barneombudet.no/) er en statlig institusjon og skal være talsperson for barn og unge i Norge. Ombudet
    jobber for barns rettigheter på alle områder av samfunnet, herunder for barn med nedsatt funksjonsevne. Barneombudet er
    politisk uavhengig, og ingen kan si noe om hva det skal mene. En av de viktigste oppgavene er å passe på at norske myndigheter
    følger det de har forpliktet seg til etter FNs konvensjon for barns rettigheter (Barnekonvensjonen). .


    ##### **Likestillings- og diskrimineringsombudet**


    [Likestillings- og diskrimineringsombudet](https://www.ldo.no/) skal fremme likestilling og bekjempe diskriminering uavhengig
    av blant annet kjønn, etnisitet, religion, funksjonsevne, seksuell orientering, kjønnsidentitet, kjønnsuttrykk og alder.
    Ombudet håndhever diskrimineringsforbudene i lovverket, gir veiledning og er en pådriver for likestilling og mangfold.
    .


    ##### **Eldreombudet**


    Et helt nytt [eldreombud](https://lovdata.no/dokument/NL/lov/2020-06-19-80?q=lov%20om%20eldreombudet) er under etablering
    i 2020. Eldreombudets hovedoppgave skal være å fremme eldres interesser, rettigheter og behov i samfunnet og å følge med
    på utviklingen i eldres situasjon. Ombudet skal ha et nasjonalt mandat og være en uavhengig stemme for eldre i hele landet.
    Det er ikke fastsatt noen aldersgrense for hvem som defineres som eldre i eldreombudssammenheng. Personer med nedsatt
    funksjonsevne som blir eldre inngår i eldreombudets målgruppe. Eldreombudet skal imidlertid ikke ta seg av saker som naturlig
    hører inn under pasient- og brukerombudenes oppgaver. .


    ##### **Sivilombudsmannen**


    [Sivilombudsmannen](https://www.sivilombudsmannen.no/) kontrollerer forvaltningen. Kontrollen utføres på grunnlag av klager
    fra borgerne om urett og feil som måtte være gjort av offentlig forvaltning. Ombudsmannen behandler klager som gjelder
    både statlig, kommunal og fylkeskommunal forvaltning. Ombudsmannen kan også ta opp saker på eget initiativ. Ombudsmannen
    behandler av og til saker som er av viktig prinsipiell betydning for helse- og omsorgstjenestene.


    .


    *Denne artikkelen ble faglig oppdatert i september 2020*


    .'
- source_sentence: '- Hva slags hjelp kan vi få til tracheostomi-behandling hjemme?'
  sentences:
  - 'Les mer om [skole- og opplæringstilbud for døvblinde på dovblindhet.no.](https://www.dovblindhet.no/barnehage-skole-og-opplaering.4636489-176065.html)


    ### Bo- og omsorgstilbud


    Hjemkommunene har ansvar for bo- og omsorgstilbud til voksne døvblinde. De fleste voksne med medfødt døvblindhet bor i
    leilighet eller bofellesskap med heldøgns omsorg.


    Har du ervervet døvblindhet, kan du få tilbud om kommunal omsorgsbolig eller sykehjem, hvis du ikke lenger kan bo i eget
    hjem.


    Les mer om [bo- og omsorgstilbud for døvblinde på dovblindhet.no.](https://www.dovblindhet.no/bo-og-omsorgstilbud.4641097-176065.html)


    ### Brukerstyrt personlig assistanse og støttekontakt (BPA)


    Dette er en ordning som gir deg praktisk bistand til å gjøre ting som:


    - kle på deg

    - gjøre husarbeid

    - komme deg til skole og arbeidsplass

    - handle og lage mat

    - være sammen med venner og familie

    - engasjere deg i samfunnet.


    BPA gir deg mulighet til å administrere din egen hverdag, ved at du selv kan bestemme hvem som skal være dine assistenter,
    hva de skal bistå med og til hvilke tider.


    Les mer om [brukerstyrt personlig assistanse og støttekontakt for døvblinde på dovblindhet.no.](https://www.dovblindhet.no/brukerstyrt-personlig-assistanse-og-stoettekontakt.4832862-176065.html)


    ### Cochleaimplantat (CI)


    CI er et elektronisk apparat som opereres inn i øret. Det er et hjelpemiddel som hovedsakelig tilbys hørselshemmede med
    så store hørselstap, at de har liten eller ingen mulighet til å oppfatte tale med et vanlig høreapparat.


    Les mer om [cochleaimplantat på unn.no.](https://www.unn.no/dovblindhet/hva-kan-hjelpe/teknologi-og-hjelpemidler/horselshjelpemidler/cochleaimplantat/)


    ### Individuell plan (IP)


    Individuell plan er et verktøy som legger til rette for samarbeid mellom deg og tjenesteytere. Formålet med IP er å ha
    et helhetlig tilbud som koordineres gjennom én plan. Planen skal være individuelt tilpasset og én tjenesteyter skal ha
    hovedansvaret for oppfølgingen. Den som bruker henvender seg til har plikt til å sørge for at arbeidet med planen settes
    i gang.


    Les mer om [individuell plan på dovblindhet.no.](https://www.dovblindhet.no/individuell-plan.4590084-176065.html)


    ### Orienterings- og mobilitetsopplæring


    Eksempler på dette er:


    - bruk av hvit stokk og stokk-teknikk

    - ledsagerteknikk

    - beskyttelsesteknikk

    - orienteringsteknikk

    - opplæring i ulike tekniske hjelpemidler

    - innlæring av mobilitetsruter

    - bruk av andre og resterende sanser


    ### Tolk/ledsager


    I mange tilfeller vil du være avhengig av en tolk/ledsager som behersker de ulike kommunikasjonsformene som personer med
    døvblindhet bruker.


    En tolk/ledsager fungerer som et bindeledd mellom deg og andre personer. Her kan du finne ut mer om [tolketjenesten i
    NAV](https://www.nav.no/no/person/hjelpemidler/hjelpemidler-og-tilrettelegging/tolketjenesten) .


    Les mer om [tolk eller ledsager på dovblindhet.no.](https://www.dovblindhet.no/tolkledsager.4588731-176065.html)


    Referanser


    [Publikasjoner om medfødt døvblindhet](https://www.dovblindhet.no/publikasjoner-om-medfoedt-doevblindhet.4873964-480618.html)
    (dovblindhet.no)


    [Publikasjoner om ervervet døvblindhet](https://www.dovblindhet.no/publikasjoner-om-ervervet-doevblindhet.4874059-480618.html)
    (dovblindhet.no)


    [Nordisk definisjon av døvblindhet, 2016](https://www.dovblindhet.no/?cat=440667) (dovblindhet.no)


    Innholdet er levert av [Nasjonal kompetansetjeneste for døvblinde (NKDB)](/samarbeidspartnere/#nasjonal-kompetansetjeneste-for-dovblinde-(nkdb))


    Slik refererer du til innholdet Nasjonal kompetansetjeneste for døvblinde (NKDB). Døvblindhet. [Internett]. Oslo: Helsedirektoratet;
    oppdatert torsdag 20. juni 2024 [hentet tirsdag 9. desember 2025]. Tilgjengelig fra: [https://www.helsenorge.no/sykdom/sjeldne-diagnoser/dovblindhet/](https://www.helsenorge.no/sykdom/sjeldne-diagnoser/dovblindhet/)


    Sist oppdatert torsdag 20. juni 2024'
  - 'For noen kan det ta lang tid å erkjenne ove r for seg selv at du har et hjelpe- og tjenestebehov, finne ut hva behovet
    er og gå til det skritt et å søke hjelp. Det er derfor viktig at helsepe rsonell og andre tjenesteytere anerkjenne r de
    følelsene og tankene som kan oppstå hos tjene s temottakeren i den nye situasjonen han eller hu n er i.


    ## **Pårørende**


    Pårørende er, vanligvis, en viktig støttespiller både for personen med den sjeldne diagnosen og tjenesteytere. Mange pårørende
    opplever det som godt og riktig å være nær og å bistå personen med diagnose. Pårørende kan også være et viktig bindeledd
    mellom person med diagnose og tjenesteytere.


    Noen pårørende opplever at omsorgsoppgavene og oppfølgingen av personen med diagnose er krevende både fysisk og psykisk
    og noen kan oppleve situasjonen som overveldende. Det kan være vanskelig å sette sine egne behov opp mot den andres behov.
    Pårørende har også behov for å ivareta egen omsorg, helse og sosiale behov.


    Helsedirektoratet har gitt ut en [*Pårørendeveilede*](https://www.helsedirektoratet.no/veiledere/parorendeveileder) *r.*


    Veilederen inneholder mange viktige momenter knyttet til det å være pårørende og ha omsorgsoppgaver for nære personer.


    I pårørendeveilederen står det blant annet følgende om viktigheten av at helse- og omsorgstjenesten kartlegge r og fange
    r opp pårørendes behov for støtte :


    *Pårørendes samlede omsorgsoppgaver, ressurser og belastninger bør kartlegges i forbindelse med tildeling av kommunale
    helse- og omsorgstjenester til pasienten/ brukeren. Kartleggingen bør gjentas regelmessig. (s. 79)*


    Videre fremheves det som viktig at pårørende får mulighet til å møte andre i samme situasjon . I denne forbindelse nevnes
    det spesielt at:


    *For pårørende til personer med en sjelden diagnose kan det være en utfordring å finne andre personer i samme situasjon.
    Disse bør få hjelp til å møte de få som faktisk er i samme situasjon. (s. 84)*


    Det er opprettet et eget [p årørendesenter i Stavanger.](https://www.parorendesenteret.no/om-oss) Vi har blant annet hentet
    informasjonen derfra, til denne artikkelen. Pårørendesenteret innbyr pårørende til å ta kontakt og skriver om nettsiden:


    *Denne siden er for deg som er pårørende. Her finner du kunnskap, tips og råd. Du kan også lese om pårørendes rettigheter
    og andre pårørendes erfaringer. Nettstedet er innholdsrikt og omfatter både artikler, kunnskapsfilmer, mestringsfilmer
    og lydfiler.*


    ## **Søknad og vedtak**


    Se [Frambus temaside om søknadsprosessen](https://frambu.no/tema/soknadsprosesser-nyttige-tips/) - her kan du lese om
    søknad, vedtak og klage.


    R etten til helsetjenester i hjemme t finner du i [pasient- og brukerrettighetsloven § 2-1 a, 2. ledd](https://lovdata.no/dokument/NL/lov/1999-07-02-63/#KAPITTEL_2)
    , som må ses i sammenheng med [helse- og omsorgstjenesteloven § 3-2, 1. ledd, nr. 6, bokstav a.](https://lovdata.no/dokument/NL/lov/2011-06-24-30#KAPITTEL_3)
    [Pasient- og brukerrettighetsloven § 2-8 handler om retten til vedtak.](https://lovdata.no/dokument/NL/lov/1999-07-02-63/#KAPITTEL_2)


    *Artikkelen er faglig oppdatert 15.07.2024.*'
  - "# Forbruksmateriell\n\nHelseforetakene har ansvar for å levere nødvendig medisinsk utstyr og forbruksmateriell til behandling\
    \ hjemme/utenfor sykehus når behandlingen er igangsatt av spesialisthelsetjenesten.\n\nHelseforetakene har i tillegg ansvar\
    \ for å levere tjenester/forbruksmateriell til en rekke behandlingsforløp som ikke innbefatter medisinsk utstyr.\n\nEksempler\
    \ på forbruksmateriell og tjenester som benyttes i medisinsk hjemmebehandling:\n\n- Forbruksmateriell til:\n    - enteral\
    \ ernæring som gis via nasogastrisk sonde, perkutan gastrostomi (PEG) og gastrostomiport/sonde\n    - parenteral ernæring/intravenøs\
    \ behandling som gis via ulike typer veneporter og sentrale/perifere venekateter\n    - epidural behandling som gis ved\
    \ smertelindring\n    - subkutan behandling\n    - pleura/acites- drenasje\n    - tracheostomi\n- Kompresjonsplagg til:\n\
    \    - lymfødem (og tilhørende bandasjemateriell)\n    - brannskadebehandling\n    - kjønnsdysfori/kjønnsinkongruens\n\
    - Apnéskinner (alternativ behandling ved søvnapné)\n- Frejkaspute (behandling av hofteleddsdysplasi hos nyfødte)\n- Kjønnsdysfori/kjønnsinkongruens\
    \ (kompresjonsplagg, penisprotese, hårfjerning og vaginablokker)\n- Taleventiler/proteser for strupeopererte\n\nHelseforetakene\
    \ har også ansvar for å dekke kostnadene til Klorhexidin 5 mg/ml, NaCl 0,9 mg/ml og Heparin 100 IE til vedlikehold/skylling\
    \ av de aktuelle kateter, kanyler og porter som benyttes. Se også ( [HELFO utstyrsliste forbruksmateriell](https://www.helfo.no/produkt-og-prislister/produkt-og-prislister)\
    \ ).\n\nListen er ikke uttømmende.\n\nDet er ulik praksis i hvordan helseforetakene organiserer utleveringen av forbruksmateriell.\
    \ Sortimentet kan være ulikt mellom helseforetakene og mellom helseregionene ( [jf. Utstyr](https://behandlingshjelpemidler.no/utstyr/)\
    \ ).\n\nVed spørsmål ta kontakt med aktuell [behandlingshjelpemiddelenhet](https://behandlingshjelpemidler.no/enhet/)\
    \ ."
