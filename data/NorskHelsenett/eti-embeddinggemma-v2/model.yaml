- source_sentence: planlagt arbeid med å bygge ferdigheiter hos barnet, ikkje berre medisinsk behandling
  sentences:
  - '# Målgrupper for habilitering


    ### Generelt om målgrupper med behov for habilitering


    Målgruppene for habilitering er personer som har, eller står i fare for å få begrensninger i sin fysiske, psykiske, kognitive
    eller sosiale funksjonsevne.


    Pasienter og brukere med behov for habilitering har funksjonsnedsettelser som skyldes medfødte eller tidlig ervervede
    tilstander. For mange innebærer dette at de ikke følger et forventet utviklingsforløp. Med tidlig ervervet menes at tilstanden
    har oppstått før 18 år, jfr. [prioriteringsveileder for habilitering av voksne i spesialisthelsetjenesten](https://www.helsedirektoratet.no/veiledere/prioriteringsveiledere/habilitering-av-voksne-i-spesialisthelsetjenesten)
    . Behovet for habilitering varer oftest livet ut.


    Det er stor grad av komorbiditet i gruppen. Bidiagnoser kan ofte gi større funksjonsvansker enn en hoveddiagnose. De fleste
    trenger kompetanse fra kommunene og spesialisthelsetjenesten i både utredning, diagnostisering og oppfølging.


    Et sentralt kjennetegn ved målgruppene innen habilitering er at de trenger bistand til å oppøve nye funksjoner og ferdigheter
    som de i utgangspunktet ikke har hatt. Tiltak har som mål å utvikle funksjons- og mestringsevnen for å nå størst mulig
    grad av selvstendighet, deltakelse og livskvalitet. Tidlig innsats, helsefremmende og forebyggende tiltak for å bevare
    eksisterende funksjoner og bremse utvikling av funksjonstap er viktig. Medisinsk og fysikalsk behandling relatert til
    somatisk og/eller psykisk sykdom, er ofte elementer i habiliteringsprosessen.


    Livsfaseoverganger fra barn - ungdom - voksen er særlig sårbare. Behovet for langsiktig planlegging og tverrfaglig samarbeid
    på tvers av sektorgrenser og forvaltningsnivå er dermed fremtredende. Individuell plan og koordinator er viktige verktøy
    for samhandling og forutsigbarhet i forløpet. Se også veilederen " [Gode helse- og omsorgstjenester til personer med utviklingshemming".](https://www.helsedirektoratet.no/veiledere/gode-helse-og-omsorgstjenester-til-personer-med-utviklingshemming)


    ### Barn og unge med behov for habilitering


    Barn og unge med behov for habilitering har ofte ulike medisinske tilstander eller kroniske sykdommer. Felles er at tilstanden
    påvirker funksjonsnivå, læringsevne og livskvalitet i en slik grad at de har behov for strukturert, tverrfaglig og tverrsektoriell
    bistand - ofte over lengre tid.


    Symptombildet hos barn og unge er ofte sammensatt og krever tverrfaglig utredning og kunnskap om virksomme tiltak. Tilstander
    kan påvirke vekst og utvikling på mange ferdighetsområder og berøre samspillet i familie og nettverk. Det er derfor viktig
    at barn og unge tidligst mulig får avklart sin tilstand og at det settes inn relevante tiltak for den enkelte og familien.
    Tidlig innsats, helsefremmende og forebyggende tiltak er særlig viktig for å bevare eksisterende funksjoner og bremse
    utvikling av funksjonstap.


    De fleste barn og unge som trenger habilitering har diagnose/r med ulike symptomer. Diagnoser sier vanligvis lite om funksjonsnivå
    og evne til mestring, selvstendighet og deltakelse. Arbeidet må dermed baseres på flere kriterier enn de diagnostiske.
    Se også [veileder "Psykisk helsearbeid barn og unge"](https://www.helsedirektoratet.no/veiledere/psykisk-helsearbeid-barn-og-unge)
    .


    ### Voksne med behov for habilitering


    Voksne med behov for habilitering har medfødte eller tidlig ervervede funksjonsnedsettelser med konsekvenser for fungering
    på mange livsområder. Behov for tilrettelegging av bosituasjon, arbeidsdeltakelse, aktiviteter, ernæring og det sosiale
    miljø er sentralt. Tverrsektoriell samhandling er ofte avgjørende. Voksne defineres som personer over 18 år.


    Eksempler på brukergrupper er mennesker med tidlig ervervede hjerneskader og utviklingsforstyrrelser, syndromer som medfører
    kognitive vansker, utviklingshemming, autismespekterforstyrrelser. Det kan også omfatte mennesker med tidlig ervervede
    nevrologiske skader eller sykdommer, nevromuskulære sykdommer, eksempelvis muskeldystrofier, CP og ryggmargsbrokk.


    Det er hyppigere forekomst av psykisk sykdom hos voksne med habiliteringsbehov enn i befolkningen for øvrig. Det gjelder
    særlig den delen av målgruppen som har utviklingshemning og/eller autismespekterforstyrrelser.'
  - '# Spise- og ernæringsvansker hos barn, tiltak

    ### Tilvisingsrutinar for helsepersonell


    ## Under Vis meir


    # Spise- og ernæringsvansker hos barn, tiltak

    ### Tilvisingsrutinar for helsepersonell


    ## Under


    Som grunnlag for tiltak vil barnet bli undersøkt av barnelege. Vidare vil måltidsobservasjonar, kartlegging av ernæringsmessige
    forhold og ev. vurdering av munnmotorikk og svelgfunksjon vere nødvendig før behandlinga startar. På bakgrunn av denne
    kartlegginga blir det gitt rettleiing basert på videoopptak frå måltid og råd om ete- og ernæringsfremmande tiltak tilpassa
    det enkelte barnet og familien til barnet.


    Hos nokre barn er det aktuelt med tilleggsundersøkingar som blodprøver, for eksempel pH-registrering for å utelukke gastroøsofageal
    refluks eller svelgfilming (videofluoroskopi) for å utelukke svelgevanskar.


    [Svelgfilming hos barn](/behandlinger/dynamisk-svelgundersoking)


    Nokre gonger er det nødvendig å starte opp med medisinsk behandling, for eksempel behandling av refluks frå magesekken
    eller obstipasjon, før det er mogleg å få eit barn til å ete ei større mengde eller meir variert mat. Dersom eit barn
    har forsinka eteutvikling, vil det vere nødvendig med tiltak i eit utviklingsperspektiv. Tilpassing av konsistensen på
    maten i samband med den munnmotoriske funksjonen til barnet kan vere vesentleg.


    For nokre barn vil nesesonde eller gastrostomi (magesonde), vere nødvendig. Ved bruk av nesesonde eller gastrostomi er
    det viktig at det blir utarbeidd ein god oppfølgingsplan som sørger for god ernæring og trygg administrering av dette.
    Dette kan vere eit kortvarig hjelpemiddel for nokre, mens det for andre vil vere nødvendig over lang tid.


    Det vil alltid vere behov for rettleiing til foreldra til barnet, barnehage eller skule, og andre nære omsorgspersonar
    som har ansvar for måltid med barnet. Ete- og ernæringsteamet vil samarbeide med fagpersonar som arbeider med barnet til
    dagleg, for å sikre best mogleg oppfølging og kontinuitet.


    ### Gjer det vondt?


    Sjølve behandlinga i ete- og ernæringsteamet medfører ikkje smerter og ubehag. Nokre gonger kan det vere behov for blodprøver
    og andre medisinske undersøkingar for å avklare helsetilstanden til barnet.


    ### Kor lenge varer behandlinga?


    Ete- og ernæringsteamet vurderer barn både ved polikliniske konsultasjonar (1-2 timar), som dagpasientar (opptil 5 timar)
    og ved dagopphald (3-4 dagars varigheit). ''


    Etevanskar har mange former. Nokre vanskar er avgrensa, andre er resultatet av eit komplekst samspel mellom motoriske,
    sosiale og ernæringsmessige faktorar. Nokre vanskar er forbigåande, mens andre kan vare ved over tid, i enkelte tilfelle
    gjennom heile livet. Vanskane kan ha blitt utløyst av ei kjent årsak og vare ved sjølv om den opphavlege årsaka er ferdigbehandla.
    Det er vanskeleg å seie noko generelt om varigheita til behandlinga.


    # Spise- og ernæringsvansker hos barn, tiltak

    ### Tilvisingsrutinar for helsepersonell


    ## Etter


    Ete- og ernæringsteamet legg vekt på å samarbeide med lokale fagpersonar. Teamet kan ha kontakt med lokale fagpersonar
    både før og under behandlingsopphaldet. Ved oppsummeringsmøtet deltar ofte lokale fagpersonar frå barnehage/skule og helsepersonell,
    og vi har også videooverførte samarbeidsmøte. Dette gir rom for felles drøfting med fagpersonar og foreldre til stades
    og bidrar til at vi kan bli einige om planar for vidare behandling og oppfølging.


    Som regel blir barnet og familien overført til det lokale hjelpeapparatet etter at utgreiinga er avslutta og det er utarbeidd
    eit forslag til vidare tiltak og oppfølging.


