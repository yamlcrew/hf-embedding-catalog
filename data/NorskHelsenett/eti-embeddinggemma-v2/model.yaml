      # Spise- og ernæringsvansker hos barn, tiltak

      ### Tilvisingsrutinar for helsepersonell


      ## Glasblokkene Habiliteringstenesta for barn og unge (HABU)


      [Kontakt Habiliteringstenesta for barn og unge (HABU)](/avdelinger/barne-og-ungdomsklinikken/habiliteringstenesta-for-barn-og-ungdom)


      ### Oppmøtestad


      Vi held til i Glasblokkene i Haukelandsbakken 15. Alle pasientar som skal til HABU må registrere oppmøte i hovudresepsjonen
      i etasje 1. Hovudresepsjonen er open måndag-fredag kl. 07.30-19.00 og fredag kl. 07.30-15.30.


      ### Glasblokkene


      Haukelandsbakken 1


      5021 Bergen


      [Finn fram](/steder/haukeland/glasblokkene)


      ### Transport


      #### Buss


      Fleire rutebussar går forbi Haukeland. I tillegg finst direkte arbeidsruter mellom bydelane og sjukehuset.


      [På nettsidene til Skyss.no finn du bussruter med oversikt over stoppestader og tider](https://www.skyss.no/)


      - Line 5 og 6 har avgang frå Festplassen

      - Line 12 har avgang frå Bystasjonen

      - Line 16E har avgang frå Xhibition i Småstrandgaten


      Busstoppa rundt Haukeland:


      - **Ulriksdal** for besøkande til Ulriksdal helsepark og Glasblokkene (line 5, 6, 16E)

      - **Haukeland sjukehus Nord** for besøkande til Glasblokkene, Kvinneklinikken, Augebygget og Haukeland hotell (line
      5, 6, 12 og 16E)

      - **Haukeland sjukehus Sør** for besøkande til Sentralblokka og andre bygg på Haukelandsområdet (line 5, 6, 12 og 16E)

      - **Ibsensgate** - arbeidsruter


      #### Bybane


      Nærmaste stoppestad til Haukeland er bybanestoppet Haukeland sjukehus. Banen stoppar nord for Sentralblokka, like ved
      Glasblokkene, på Haukelandsområdet. Det tar om lag 5 minutt å gå frå stoppet til sjukehuset.


      [Sjå rutetabellar og oversikt over stoppestader på Skyss.no](https://www.skyss.no/)


      #### Flybuss


      [Sjekk nettsida til Flybussen for meir informasjon om ruter og prisar](https://www.flybussen.no/?dir=to)


      #### Parkering Glasblokkene


      Det er to HC-parkeringsplassar ved Glasblokkene. På grunn av byggearbeid er det elles begrensa med parkeringsplassar.


      Besøkande parkerer på parkeringsdekket i Sentralblokka. Her er det også fleire HC-parkeringsplassar.


      [Meir informasjon om parkering på Haukeland universitetssjukehus](/praktisk-informasjon/parkering)


      Ein kan gå mellom Sentralblokka og Glasblokkene innandørs via tunnelsystemet.


      ### Praktisk informasjon


      #### Resepsjon Glasblokkene


      I Glasblokkene 5-8 er det ein hovudresepsjon i 1. etasje som betener alle pasientar, pårørande og besøkande til Glasblokkene.
      Hovudresepsjonen er betent alle dagar frå kl. 07.00 - 21.00. Helg og heilagdager er resepsjonen betent frå 07.30 - 21.00.
      Her kan du få hjelp til innsjekk, å finne fram, bestille tolk, transport og mykje meir.


      I tillegg til hovudresepsjonen er det ein ekspedisjon i tilknyting til mottaket i U1. Denne har ope alle kvardagar kl.
      07.00 - 22.30, og frå 08.00 til 22.30 i helg/heilagdagar


      Resepsjonen i blokk 1-4 er gjort om til base for vektarar frå hospitaldrift, og er bemanna med vektar 24/7. Her er vektar
      tilgjengeleg for pasientar og besøkande for enklare førespurnadar og spørsmål.


      #### Innsjekk, betaling og ventesoner


      I innkallingsbrevet ditt står det kor du skal møte på sjukehuset. Dei aller fleste får også ein SMS for ankomstregistrering
      same dag som timen er. Du kan velge å velge å sjekke inn via SMS på mobilen, eller på sjølvbetjeningsautomat i Glasblokkene.


      Dei pasientene som treng eller ønsker det, får hjelp hjelp i resepsjonen.


      Når pasienten har sjekka inn, enten via mobil eller på automat, får du SMS med referansekode som viser kva ventesone
      de tilhører. Du vil alltid få ein SMS for innkalling til rom/sted.


      Når timen er over og oppgjøret tatt, får pasientene mulighet til å betale egenandel mm. via Vipps, eller å få tilsendt
      regning i posten eller nettbanken.


      #### Apotek


      I foajeen i Sentralblokka på Haukeland finn du eit apotekutsal for publikum. Dei gjer klar resepten din medan du ventar
      der.


      [Meir informasjon om sjukehusapoteket i Sentralblokka](https://www.sjukehusapoteka-vest.no/steder/sjukehusapoteket-i-bergen/)


      Opningstider Måndag-fredag kl. 08.30-17.00


      Telefon 55 97 53 44 Telefaks 55 29 07 40 [bergen@apotekene-vest.no](mailto:bergen@apotekene-vest.no)


      Apotekutsalet har eit variert varetilbod, og fø'
