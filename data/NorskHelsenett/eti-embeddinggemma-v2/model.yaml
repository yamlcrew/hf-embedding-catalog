- source_sentence: Hvilken lov regulerer rettighetene til pasienter og brukere av helsetjenester?
  sentences:
  - '# Pasient- og brukarombodet


    Er du ikkje nøgd med helsetenestene, eller har spørsmål om rettane dine, kan du få hjelp og råd frå pasient- og brukarombodet.
    Kven som helst kan ta kontakt.


    ## Kva er pasient- og brukarombodet?


    Pasient- og brukarombodet skal arbeide for å ivareta pasientens og brukarens behov, interesser og rettssikkerheit. I tillegg
    skal dei bidra til å betre kvaliteten i tenestene.


    Om du er misnøgd med helsetenestene du har motteke eller ikkje fekk den helsehjelpa du trong, kan du kontakte pasient-
    og brukarombodet.


    Pasient- og brukarombodet jobbar med saker innafor offentlege helse- og omsorgstenester. Dette gjeld òg tannhelse.


    ## Kva kan du få hjelp med?


    Pasient- og brukarombodet kan gje råd og informasjon om rettar du har i helsetenesta.


    Pasient- og brukarombodet kan blant anna hjelpe deg med:


    - Informasjon om rettar du som pasient har

    - Tydeleggjere ting som er vanskeleg å forstå

    - Finne ut av kva som er lurt å ta tak i først

    - Finne ut kven det er lurt å kontakte

    - Formulere og formidle spørsmål, tilbakemeldingar og klagar

    - Korleis du klagar på behandling eller avgjerder om din rett til helse -og omsorgshjelp

    - Å delta i møte med tenesta

    - Korleis du søker om erstatning


    ## Kven kan få hjelp?


    Alle kan kontakte pasient og brukarombodet og tenesta er gratis. Du treng ikkje tilvising for å ta kontakt. Pasient- og
    brukarombodet har teieplikt og du er anonym om du ønskjer det.


    Om du er usikker på om du kan få hjelp av pasient- og brukarombodet, kan du uansett ta kontakt for å diskutere saken din.


    ## Finn ditt lokale ombodskontor


    Pasient- og brukarombodet har kontor 15 ulike stader i Noreg. Kvart kontor leiast av eit lokalt ombod. Ring 40 50 16 00,
    eller sjå liste over dei ulike kontora og korleis du kan kontakte dei på [ombodet sine nettsider.](https://www.pasientogbrukerombudet.no/behov-for-a-snakke-med-oss)


    ## Kontakt Pasient- og brukarombodet


    [40 50 16 00](tel:+4740501600)


    Kontakt oss om du har erfaringar eller spørsmål du ønskjer å ta opp.


    ## pasientogbrukerombudet.no


    Sjå nettsidane til Pasient- og brukarombodet for meir informasjon, eller for å finne ditt lokale kontor.


    [pasientogbrukerombudet.no (pasientogbrukerombudet.no)](https://www.pasientogbrukerombudet.no/)


    ## Helse- og omsorgsdepartementet (lovdata.no)


    Pasient- og brukarrettigheitsloven innehalder rettsreglar om rettar pasientar og brukarar har overfor helse- og omsorgstenesten.


    [Kapittel 8: Pasient- og brukerombud (lovdata.no)](https://lovdata.no/dokument/NL/lov/1999-07-02-63#KAPITTEL_9)


    Innhaldet er levert av [Pasient- og brukarombodet](/nn/samarbeidspartnere/#pasient-og-brukarombodet)


    Slik refererer du til innhaldet Pasient- og brukarombodet. Pasient- og brukarombodet. [Internett]. Oslo: Helsedirektoratet;
    oppdatert onsdag 6. juli 2022 [henta tirsdag 9. desember 2025]. Tilgjengeleg frå: [https://www.helsenorge.no/nn/rettigheter/pasient--og-brukarombodet/](https://www.helsenorge.no/nn/rettigheter/pasient--og-brukarombodet/)


    Sist oppdatert onsdag 6. juli 2022'
  - '## Barnehagestart


    Du skal ta imot et barn med synsnedsettelse i barnehagen. Da er det lurt å tenke igjennom noen prinsipper for å tilrettelegge
    barnehagestart. Både før barnet starter, og i hverdagen som kommer.


    Synssansen gir oss raskt overblikk over omgivelser og situasjoner, både på nært hold og på avstand. Hos et barn synsnedsettelse
    kan vi ikke forvente at barnet kan utfolde seg og være aktivt i omgivelser der det ikke er kjent. Barnet kan trenge ekstra
    tid og støtte til å gjøre seg kjent og utforske nye miljøer.


    Barnets synsnedsettelse bør være utgangspunkt for å tilrettelegge. Planlegg barnehagestart eller overgang i god tid, og
    gjør deg kjent med barnets individuelle behov. Pedagogisk-psykologisk tjeneste (PPT) og Statped kan være aktuelle samarbeidspartnere
    og veilede barnehagen.


    ## Tenk igjennom:


    - Har barnet oversikt i avdelingen? Barnet kan ha vansker med oversikt i det fysiske miljøet, rommet, leken og fellesskapet.
    Tenk gjennom hvordan du kan løse dette i din barnehage ut fra barnets synsfunksjon.

    - Har barnet nok tid til å bli kjent? Barnet kan bruke flere sanser for å gjøre seg kjent, for eksempel hørsel- og taktilsansen.
    Barn med synsnedsettelse kan trenge ekstra tid og støtte til å gjøre seg kjent med og utforske barnehagen. Synsfunksjon
    og individuelle forutsetninger avgjør behovet.

    - Hvor bruker barnet energien sin? Barnet trenger overskudd til å delta i lek, aktiviteter og sosialt samspill i løpet
    av dagen. Barn med synsnedsettelse bruker ofte mer energi enn andre barn i barnehagen. Vær nysgjerrig på hvordan barnet
    kompenserer for synsnedsettelsen, og hvor barnet har behov for at du tilrettelegger.


    ## Tips og råd


    Ivareta barnets behov fra barnehagestart. Tenk på hvordan du kan ta hensyn når du tar pedagogiske valg, og hvordan du
    utformer lekemiljøet i barnehagen.


    ### Før barnehagestart


    Vurder om barnet trenger ekstra besøksdager før barnehagestart. For noen barn kan det legge et godt grunnlag for barnehagestart
    og tilvenning. Tenk igjennom om det fysiske miljøet er godt tilrettelagt for barnet. En ryddig inndeling av rommet med
    faste og tydelige lekesoner gjør at barnet lettere kan orientere seg.


    - Avgrens med tepper, matter og møbler for å skape små lekesoner.

    - Ha et bevisst forhold til mengden av visuell informasjon på veggene. La visuell informasjon være tydelig og avgrenset.

    - Unngå hyppig ommøblering, og la leker og materiell ha faste plasser.

    - Pass på at barnets garderobeplass, hyller og skuffer er ytterst eller innerst på en rekke. Vurder å markere plassen
    med kontrastfarge eller taktil markering ut fra barnets synsfunksjon.


    ### Etter barnehagestart


    Vær ekstra oppmerksom på alle de små overgangene i barnehagen. Når må du tilrettelegge slik at barnet har oversikt og
    vet hva som skjer og hvor det skal?


    - Forutsigbare og gjenkjennelige rutiner kan gjøre at barnet bruker mindre energi på å holde oversikt.

    - Mindre grupper gir mer ro og oversikt og gjør det lettere å delta i lek. Pass på at du og resten av personalet i barnehagen
    bruker et presist språk i barnehageavdelingen.

    - Unngå ord som hit, dit, her og der, og bruk navn aktivt når du og resten av barnehagepersonalet snakker med barna, istedenfor
    dere, vi og de.


    Å lage holdepunkter eller kjennemerker i barnehagemiljøet kan gjøre det lettere for barnet å være selvstendig og finne
    frem på egenhånd. Eksempler kan være tydelig taktil eller visuell merking av rom og visuell eller taktil merking av lekekasser,
    kurver og skap.


    ### Leker og materiell i et inkluderende barnehagemiljø


    Du kan skape et inkluderende barnehagemiljø som er godt for alle barn.


    - Legg til rette for varierte sanseerfaringer og felles opplevelser.

    - Ha et variert materiell med leker som stimulerer til taktil utforsking, eller som har sterke farger og kontraster.

    - Tenk igjennom og tilrettelegg for barnet med synsnedsettelse fra barnehagestart.'
  - 'Som utsendt personell ved utenlandske representasjoner i Norge får du ikke automatisk tildelt fastlege. Dette gjelder
    også for dine familiemedlemmer i Norge.


    Du velger selv om du vil melde deg inn i fastlegeordningen. Din representasjon vil hjelpe deg med innmeldingen.


    Hvis du senere ønsker å bytte fastlege, kan du ringe Veiledning Helsenorge på telefonnummer 23 32 70 00. Har du Bank-ID,
    vil du også logge deg inn på Helsenorge og bytte fastlege selv.


    ## Fastlege når du er student


    Fastleger tilknyttet helsetjenesten ved universiteter og høyskoler kan benyttes av studenter som har betalt semesteravgift
    og av deres barn under 16 år. Studenter som flytter tilbake til tidligere bostedskommune innen tre år, har krav på å få
    tilbake sin fastlege i kommunen selv om listen er full. Denne muligheten gjelder i 6 måneder fra flytting tilbake til
    bostedskommunen.


    Studenter som har meldt flytting til utlandet, har ikke krav på å få tilbake sin tidligere fastlege.


    Er du student tilknyttet studentsamskipnaden i Oslo? [Se SIOs egne nettsider.](https://www.sio.no/helse/legehjelp-og-fastlege)


    ## Fastlege når du er på sykehjem


    Ved opphold på sykehjem har du krav på å beholde fastlegen din, men du må bruke sykehjemslegen så lenge du bor på sykehjemmet.
    Dersom du vil melde deg ut eller inn av fastlegeordningen, må du ta kontakt med Veiledning Helsenorge på telefonnummer
    23 32 70 00.


    ## Legehjelp ved akutt sykdom


    Ved akutt oppstått skade eller sykdom utenom fastlegens åpningstid må du kontakte legevakten (116 117). Står det om liv,
    ring 113.


    Fastlegen er ansvarlig for alle allmennlegeoppgaver for sine pasienter i legekontorets åpningstid. Fastlegen skal prioritere
    personer på sin liste foran andre, bortsett fra ved akutt, livstruende sykdom.


    ## [Ring legevakten på 116 117](https://www.helsenorge.no/hjelpetilbud-i-kommunene/legevakt/)


    Legevakten er døgnåpen, og tilbyr hjelp ved akutt sykdom, skader og kriser. Ring nærmeste legevakt gratis på telefonnummer
    116 117 når fastlegen ikke kan nås.


    Illustrasjon: Rebecca Ravneberg/Helsedirektoratet


    ## Ansvaret for fastlegeordningen


    Kommunene eier fastlegeordningen og inngår avtale med fastlegene. Det er også hver enkelt kommune som skal sørge for at
    det er nok fastleger i en kommune. Helfo administrerer fastlegeordningen på vegne av kommunene.


    I hver kommune finnes det en fastlegeansvarlig.


    ## Klage på fastlegen/fastlegeordningen


    Dersom du ikke er fornøyd med fastlegen, har du rett til å klage.


    Erfaring viser at det ofte er svikt i kommunikasjonen som fører til at pasienter ikke er fornøyd med legen. Det kan derfor
    være lurt først å bestille en time hos legen for å si ifra hvis du ikke er fornøyd. Ta gjerne med deg en som kan støtte
    deg.


    Det er en fordel at du ved bestilling av timen gir beskjed om at det gjelder klage på behandlingen. Det gir legen mulighet
    til å sette av mer tid til samtalen. Dersom dette ikke fører frem kan du konferere med den i kommunen som har ansvar for
    fastlegeordningen eller sende en klage til Fylkeslege med kopi til kommuneoverlegen.


    Kommunen har ansvaret for tilbudet av fastleger. Dersom det ikke er ledig fastleger i kommunen, skal du rette klagen din
    til kommunen.


    ## Reservasjon mot fastlegeordningen


    Dersom du vil melde deg ut eller inn av fastlegeordningen, må du ta kontakt med Veiledning Helsenorge på telefonnummer
    23 32 70 00.


    Innholdet er levert av [Helfo](/samarbeidspartnere/#helfo)


    Slik refererer du til innholdet Helfo. Rett til fastlege. [Internett]. Oslo: Helsedirektoratet; oppdatert onsdag 5. februar
    2025 [hentet tirsdag 9. desember 2025]. Tilgjengelig fra: [https://www.helsenorge.no/fastlegen/om/rett-til-fastlege/](https://www.helsenorge.no/fastlegen/om/rett-til-fastlege/)


    Sist oppdatert onsdag 5. februar 2025'
- source_sentence: '- Er det ventetid for å få time hos BUP?'
  sentences:
  - '# Klinikk psykisk helsevern for barn og unge (PBU)


    Klinikk psykisk helsevern for barn og unge (PBU) gir spesialisert helsetilbod til barn og unge (0-18 år) med psykiske
    vanskar, og deira pårørande. Dette kan til dømes vere utgreiing og behandling av angst, åtferdsvanskar, utviklingsforstyrringar,
    AD/HD, depresjon, tvangslidingar, autisme, sjølvmordsfare, psykose, spiseforstyrringar, skulevegring, m.m. Vi består av
    både poliklinikkar (BUP) og sengepostar.


    ## Les meir om Klinikk psykisk helsevern for barn og unge (PBU)


    [Informasjon om psykiske vansker](/avdelinger/psykisk-helsevern/psykisk-helsevern-for-barn-og-unge/informasjon-om-psykiske-vanskar)


    ### Kven møter du hos oss?


    I Klinikk psykisk helsevern for barn og unge jobbar menneske med forskjellig utdanning innan psykisk helsearbeid. Det
    gjeld både sjukehusavdelingane og poliklinikkane. Som regel vert du først tilvist ein poliklinikk ikkje langt frå der
    du bor. Her blir du teke godt imot av ein eller to personar som vil snakke med deg om korleis du har det. Saman med deg
    og din familie finn vi ut kva vi kan gjere, for at du skal få det betre.


    Nokre av pasientane våre treng i ein periode litt tettare oppfølging enn ein poliklinikk kan tilby. Dei kan få hjelp på
    ein av dei tre sjukehuspostane våre.


    ### Korleis jobbar vi?


    På poliklinikkane vert ingen lagt inn. Du kjem til avtalt tid, og reiser heim igjen etter samtalen med behandlaren din.
    BUP samarbeider med deg og / eller foreldra dine om kva type hjelp du skal få. Behandlingstilbodet kan bestå av individualsamtalar,
    gruppebehandling, familiebehandling og eventuelt medikamentell behandling. I tillegg  vert det arrangert informasjonsgrupper
    for føresatte.


    BUP jobbar også saman med andre offentlege instansar, som for eksempel skule / barnehage, fastlege, helsesyster og barnevern,
    for å finne fram til det beste behandlingstilbodet for pasientane våre. BUP kan også kontakte kommunen der du bor, for
    å melde behov for individuell plan. Du kan lese meir om individuell plan på nettsiden til Helsenorge.no.


    Dersom det viser seg at du har behov for meir hjelp enn poliklinisk behandling, vil din behandlar ved poliklinikken tilvise
    deg vidare til innlegging i ein av klinikken sine sjukehusposter, eller til meir spesialisert utgreiing ein annan stad
    på sjukehuset. Dei fleste pasientar som kjem til oss blir betre av å snakke med profesjonelle hjelparar i løpet av nokre
    månader. Nokon har behov for oppfølging over lengre tid.


    ### Tilvisingsrutinar


    Klinikk Psykisk helsevern for barn og unge (PBU) har sju allmennpoliklinikkar (BUP) med ulikt geografisk ansvar, og tre
    sengepostar. Tilvisingar til Helse Bergen frå andre helseregionar kan gjerast med bakgrunn i rett til val av behandlingsstad.
    Lege, psykolog, leiar for barnevernstenesta, og leiar for NAV kommune (sosialtenesta) kan tilvise til BUP.


    [Les meir om tilvisingsrutinar, hastevurderingar og akuttpsykiatrisk hjelp for barn og unge](/avdelinger/psykisk-helsevern/psykisk-helsevern-for-barn-og-unge/informasjon-til-tilvisarar-og-fagpersonar)


    ### Pakkeforløp psykiske helse for barn og unge


    Pakkeforløp for psykiske lidingar hos barn og unge skal bidra til at du får heilskapleg utgreiing og behandling utan at
    du må vente unødig. For å sikre god oppfølging og unngå unødig venting, har vi det som blir kalla forløpskoordinatorar.
    Forløpskoordinatoren kan svare på spørsmål om timar og kva som skal skje undervegs i behandlinga di.


    [Les meir om pakkeforløp og forløpskoordinator](/pakkeforlop/pakkeforlop-psykisk-helse-og-rus/pakkeforlop-psykiske-lidingar-hos-barn-og-unge)


    ### Samhandling


    [Tenesteavtale 3 og 5 rusmedisin og psykiatri - Saman](https://www.saman.no/avtalar/tenesteavtalar/tenesteavtale-3-og-5-rusmedisin-og-psykiatri/)


    ### Poliklinikkar


    Ein BUP er ein poliklinikk, eller enklere sagt ein stad der barn, ungdom og foreldra deira får tilbod om hjelp med psykiske
    vanskar. På BUP vert ingen lagt inn. Pasientar kjem til samtalar til avtalt tid, og går heim igjen etter samtalen.'
