      > <small>Se modifica por el art. 4 de la Ley 11/1981, de 13 de mayo. [Ref. BOE-A-1981-11198](https://www.boe.es/buscar/doc.php?id=BOE-A-1981-11198).</small>


      > <small>Se modifica por el art. 1 de la Ley de 24 de abril de 1958. [Ref. BOE-A-1958-6677](https://www.boe.es/buscar/doc.php?id=BOE-A-1958-6677).</small>


      > <small>Se modifica por el art. 1 de la Ley de 8 de septiembre de 1939. [Ref. BOE-A-1939-11756](https://www.boe.es/buscar/doc.php?id=BOE-A-1939-11756).</small>'
    - 'Los tutores ejercerán su cargo en interés del menor, de acuerdo con su personalidad y con respeto a sus derechos.


      Cuando sea necesario para el ejercicio de la tutela podrán recabar el auxilio de la autoridad.


      > <small>Se modifica, con efectos de 3 de septiembre de 2021, por el art. 2.21 de la Ley 8/2021, de 2 de junio. [Ref.
      BOE-A-2021-9233#as](https://www.boe.es/buscar/doc.php?id=BOE-A-2021-9233)</small>


      > <small>Se modifica por el art. 1 de la Ley 13/1983, de 24 de octubre. [Ref. BOE-A-1983-28123](https://www.boe.es/buscar/doc.php?id=BOE-A-1983-28123).</small>


      > <small>Se modifica por el art. 4 de la Ley 11/1981, de 13 de mayo. [Ref. BOE-A-1981-11198](https://www.boe.es/buscar/doc.php?id=BOE-A-1981-11198).</small>'
    - 'Si no puede determinarse por la regla del artículo anterior cuál de las dos cosas incorporadas es la principal, se
      reputará tal el objeto de más valor, y entre dos objetos de igual valor, el de mayor volumen.


      En la pintura y escultura, en los escritos, impresos, grabados y litografías, se considerará accesoria la tabla, el
      metal, la piedra, el lienzo, el papel o el pergamino.'
  - source_sentence: BOE-A-1981-11198](https://www.boe.es/buscar/doc.php?id=BOE-A-1981-11198).</small>
    sentences:
    - 'El reconocimiento y demás actos jurídicos que determinen conforme a la ley una filiación matrimonial o no matrimonial
      podrán ser impugnados por vicio de consentimiento según lo dispuesto en el artículo 141. La impugnación de la paternidad
      por otras causas se atendrá a las normas contenidas en esta sección.


      > <small>Se modifica por el art. 2.6 de la Ley 26/2015, de 28 de julio. [Ref. BOE-A-2015-8470#asegundo](https://www.boe.es/buscar/doc.php?id=BOE-A-2015-8470).</small>


      > <small>Se modifica por el art. 1 de la Ley 11/1981, de 13 de mayo. [Ref. BOE-A-1981-11198](https://www.boe.es/buscar/doc.php?id=BOE-A-1981-11198).</small>'
    - '**(Derogado)**


      > <small>Se deroga, con efectos de 30 de abril de 2021, por la disposición derogatoria de la Ley 20/2011, de 21 de julio.
      [Ref. BOE-A-2011-12628](https://www.boe.es/buscar/doc.php?id=BOE-A-2011-12628).</small>


      > Téngase en cuenta que este artículo se deroga, con efectos de 30 de abril de 2021, por la disposición derogatoria
      de la Ley 20/2011, de 21 de julio. [Ref. BOE-A-2011-12628#dd](https://www.boe.es/buscar/doc.php?id=BOE-A-2011-12628).


      > Redacción anterior:


      > "Los Jueces municipales y los de primera instancia, en su caso, podrán corregir las infracciones de lo dispuesto sobre
      el Registro Civil, que no constituyan delito o falta, con multa de 20 a 100 pesetas. "'
    - '> <small>Se deja sin contenido por el art. 3 de la Ley 13/1983, de 24 de octubre. [Ref. BOE-A-1983-28123](https://www.boe.es/buscar/doc.php?id=BOE-A-1983-28123).</small>'
  - source_sentence: 1 de la Ley 13/1983, de 24 de octubre.
    sentences:
    - 'Nacido el hijo dentro de los ciento ochenta días siguientes a la celebración del matrimonio, podrá el marido destruir
      la presunción mediante declaración auténtica en contrario formalizada dentro de los seis meses siguientes al conocimiento
      del parto. Se exceptúan los casos en que hubiere reconocido la paternidad expresa o tácitamente o hubiese conocido el
      embarazo de la mujer con anterioridad a la celebración del matrimonio, salvo que, en este último supuesto, la declaración
      auténtica se hubiera formalizado con el consentimiento de ambos, antes del matrimonio o después del mismo, dentro de
      los seis meses siguientes al nacimiento del hijo.


      > <small>Se modifica por el art. 1 de la Ley 11/1981, de 13 de mayo. [Ref. BOE-A-1981-11198](https://www.boe.es/buscar/doc.php?id=BOE-A-1981-11198).</small>'
    - 'Todas las anotaciones provisionales que se hayan hecho en solicitud de inscripción se trasladarán precisamente a los
      libros-matrices dentro de los 30 días de la fecha de aquélla.


      Cuando se trate de consignar en el Registro general las vicisitudes ulteriores de las obras presentadas en provincias,
      este plazo se contará desde la fecha de entrada de los respectivos estados semestrales.'
    - 'El curador responderá de los daños que hubiese causado por su culpa o negligencia a la persona a la que preste apoyo.


      La acción para reclamar esta responsabilidad prescribe a los tres años contados desde la rendición final de cuentas.


      > <small>Se añade, con efectos de 3 de septiembre de 2021, por el art. 2.23 de la Ley 8/2021, de 2 de junio. [Ref. BOE-A-2021-9233#as](https://www.boe.es/buscar/doc.php?id=BOE-A-2021-9233)</small>


      > <small>Se deroga por la disposición derogatoria única.2.1 de la Ley 1/2000, de 7 de enero. [Ref. BOE-A-2000-323](https://www.boe.es/buscar/doc.php?id=BOE-A-2000-323).</small>


      > <small>Se modifica por el art. 1 de la Ley 13/1983, de 24 de octubre. [Ref. BOE-A-1983-28123](https://www.boe.es/buscar/doc.php?id=BOE-A-1983-28123).</small>


      > <small>Se modifica por el art. 1 de la Ley de 24 de abril de 1958. [Ref. BOE-A-1958-6677](https://www.boe.es/buscar/doc.php?id=BOE-A-1958-6677).</small>'
  - source_sentence: 2.21 de la Ley 8/2021, de 2 de junio.
    sentences:
    - 'No podrán ser tutores:


      1.º Los que por resolución judicial estuvieran privados o suspendidos en el ejercicio de la patria potestad o, total
      o parcialmente, de los derechos de guarda y protección.


      2.º Los que hubieren sido legalmente removidos de una tutela, curatela o guarda anterior.


      > <small>Se modifica, con efectos de 3 de septiembre de 2021, por el art. 2.21 de la Ley 8/2021, de 2 de junio. [Ref.
      BOE-A-2021-9233#as](https://www.boe.es/buscar/doc.php?id=BOE-A-2021-9233)</small>


      > <small>Se añade un párrafo por el art. 2.25 de la Ley 26/2015, de 28 de julio. [Ref. BOE-A-2015-8470#asegundo](https://www.boe.es/buscar/doc.php?id=BOE-A-2015-8470).</small>


      > <small>Se añade el segundo párrafo por la disposición final 13 de la Ley Orgánica 1/1996, de 15 de enero. [Ref. BOE-A-1996-1069](https://www.boe.es/buscar/doc.php?id=BOE-A-1996-1069).</small>


      > <small>Se modifica por el art. 1 de la Ley 13/1983, de 24 de octubre. [Ref. BOE-A-1983-28123](https://www.boe.es/buscar/doc.php?id=BOE-A-1983-28123).</small>'
    - '1. La Entidad Pública podrá delegar la guarda de un menor declarado en situación de desamparo en las personas que,
      reuniendo los requisitos de capacidad para adoptar previstos en el artículo 175 y habiendo prestado su consentimiento,
      hayan sido preparadas, declaradas idóneas y asignadas para su adopción. A tal efecto, la Entidad Pública, con anterioridad
      a la presentación de la propuesta de adopción, delegará la guarda con fines de adopción hasta que se dicte la resolución
      judicial de adopción, mediante resolución administrativa debidamente motivada, previa audiencia de los afectados y del
      menor si tuviere suficiente madurez y, en todo caso, si fuere mayor de doce años, que se notificará a los progenitores
      o tutores no privados de la patria potestad o tutela.


      Los guardadores con fines de adopción tendrán los mismos derechos y obligaciones que los acogedores familiares.


      2. Salvo que convenga otra cosa al interés del menor, la Entidad Pública procederá a suspender el régimen de visitas
      y relaciones con la familia de origen cuando se inicie el período de convivencia preadoptiva a que se refiere el apartado
      anterior, excepto en los casos previstos en el artículo 178.4.


      3. La propuesta de adopción al Juez tendrá que realizarse en el plazo más breve posible y, en todo caso, antes de transcurridos
      tres meses desde el día en el que se hubiera acordado la delegación de guarda con fines de adopción. No obstante, cuando
      la Entidad Pública considere necesario, en función de la edad y circunstancias del menor, establecer un período de adaptación
      del menor a la familia, dicho plazo de tres meses podrá prorrogarse hasta un máximo de un año.


      En el supuesto de que el Juez no considerase procedente esa adopción, la Entidad Pública deberá determinar la medida
      protectora más adecuada para el menor.


      > <small>Se añade por el art. 2.21 de la Ley 26/2015, de 28 de julio. [Ref. BOE-A-2015-8470#asegundo](https://www.boe.es/buscar/doc.php?id=BOE-A-2015-8470).</small>'
    - '**(Derogado)**


      > <small>Se deroga, con efectos de 3 de septiembre de 2021, por la disposición derogatoria única.3 de la Ley 8/2021,
      de 2 de junio. [Ref. BOE-A-2021-9233#dd](https://www.boe.es/buscar/doc.php?id=BOE-A-2021-9233)</small>


      > <small>Se modifica por el art. 4 de la Ley 11/1981, de 13 de mayo. [Ref. BOE-A-1981-11198](https://www.boe.es/buscar/doc.php?id=BOE-A-1981-11198).</small>


      > <small>Se modifica por el art. 2 del Real Decreto-ley 33/1978, de 16 de noviembre. [Ref. BOE-A-1978-28627](https://www.boe.es/buscar/doc.php?id=BOE-A-1978-28627).</small>'
