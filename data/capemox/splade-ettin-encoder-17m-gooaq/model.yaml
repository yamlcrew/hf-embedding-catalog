cardData:
  language:
  - en
  license: mit
  tags:
  - sentence-transformers
  - sparse-encoder
  - sparse
  - splade
  - generated_from_trainer
  - dataset_size:99000
  - loss:SpladeLoss
  - loss:SparseMultipleNegativesRankingLoss
  - loss:FlopsLoss
  base_model: jhu-clsp/ettin-encoder-17m
  widget:
  - text: In addition to proof of identity, such as passport, birth certificate or adoption certificate, and proof of your
      address, or a letter from your university or college confirming your place, and bring it along with your other identity
      and address verification documents to your local branch.
  - text: An abiotic factor is a non-living part of an ecosystem that shapes its environment. In a terrestrial ecosystem,
      examples might include temperature, light, and water. In a marine ecosystem, abiotic factors would include salinity
      and ocean currents. Abiotic and biotic factors work together to create a unique ecosystem.
  - text: how many 16 oz bottles of water is a gallon?
  - text: A vet assistant and vet tech both provide general animal care and assist with the treatment of sick and injured
      animals. Depending on the setting, a vet assistant may have more administrative responsibilities, while a vet tech may
      have more clinical responsibilities.
  - text: The two main stars are Alpha Centauri A and Alpha Centauri B, which form a binary pair. They are an average of 4.3
      light-years from Earth. The third star is Proxima Centauri. It is about 4.22 light-years from Earth and is the closest
      star other than the sun.
  datasets:
  - sentence-transformers/gooaq
  pipeline_tag: feature-extraction
  library_name: sentence-transformers
  metrics:
