    art. 3º-A da Lei nº 9.427, de 26 de dezembro de 1996, no art. 10 da Lei nº 9.074, de 7 de julho de 1995, com redação dada
    pela Lei nº 9.648, de 27 de maio de 1998, no art. 1º do Decreto nº 4.932, de 23 de dezembro de 2003, com redação dada
    pelo Decreto nº 4.970, de 30 de janeiro de 2004, no art. 21 do Decreto 89.817,  de  20  junho  de  1984,  com  redação  dada  pelo  Decreto  nº  5.334,  de  6  de  janeiro  de  2005,  na
    Resolução Normativa nº 740, de 11 de outubro de 2016, e o que consta do Processo nº 48500.003588/201703, resolve:


    Art. 1º Declarar de utilidade pública, para instituição de servidão administrativa, em favor da Canhadão Produção de Energia
