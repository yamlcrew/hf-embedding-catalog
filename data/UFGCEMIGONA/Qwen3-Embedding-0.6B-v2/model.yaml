      III.1.1 Módulos de conexão


      III.1.1.1 Corrente nominal


      A  capacidade  de  corrente  nominal  das  ampliações  dos  barramentos  e  dos  equipamentos  a  serem implantados
      na subestação, tais como, disjuntores, chaves seccionadoras e transformadores de correntes, deve ser dimensionada considerado
      que indisponibilidades de equipamentos, pertencentes ou não a este empreendimento, podem submeter os remanescentes a
      valores de correntes mais elevados.


