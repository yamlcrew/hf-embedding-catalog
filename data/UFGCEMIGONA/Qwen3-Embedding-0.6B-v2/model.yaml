  - 'Assim,  com  a  finalidade  de  calcular  os  montantes  de  energia  que  a  concessionária  deve comprar,  o  Regulador  determina,  para  cada  ano  de  um  período  tarifário,  o  nível  máximo  de  perdas  a  ser
    admitido sobre a energia injetada em seu sistema distribuição. Essa determinação pode ser feita mediante a fixação de
    um valor único para todo o período tarifário ou mediante a definição de uma ''trajetória'' ou curva decrescente. Com o
    valor ''regulatório'' de perdas determinado dessa forma, adicionado ao valor das perdas de energia na rede básica, se
    calcula o montante de energia a ser considerado na Parcela A das tarifas da concessionária.


    A  Superintendência  de  Regulação  dos  Serviços  de  Distribuição  -  SRD  definiu  o  nível  de perdas  técnicas  da  concessionária  em
    7.26%  da  energia  injetada,  conforme  Nota  Técnica  nº  0018/2010SRD/ANEEL, de 03 de Maio de 2010.


    O  mecanismo  utilizado  na  definição  do  referencial  regulatório  de  perdas  não  técnicas regulatórias  é  o  da  comparação  entre  as  empresas.  Ou  seja,  define-se  o  nível  regulatório  de  perdas  não
    técnicas observando-se, em especial, os níveis praticados por empresas comparáveis, bem como os níveis históricos  praticados  pela  própria  empresa.  Para  a  comparação,  o  referencial  utilizado  são  as  perdas  não
    técnicas  sobre  o  mercado  de  baixa  tensão,  por  ser  o  segmento  onde  se  concentram  as  perdas  dessa natureza.


    Com o objetivo de se fazer uma comparação de forma apropriada, são observados fatores que  influenciam  de  forma  direta  e  indireta  as  perdas  não  técnicas  e  seus  níveis  em  todas  as  áreas  de
    concessão e também fatores específicos de cada distribuidora. O conjunto desses fatores define o que se convencionou  chamar  de  ''de  complexidade  de  combate  às  perdas  não  técnicas'',  ou,  simplesmente,
    complexidade. Quanto maior a complexidade, maior a dificuldade de se combater às perdas não técnicas.'
  - 'RESOLUÇÃO AUTORIZATIVA Nº 10.385, DE 17 DE AGOSTO DE 2021


    Autoriza a EDP Renováveis Brasil S.A. a implantar e explorar a Central Geradora Eólica Serra da Borborema II, sob o regime
    de Produção Independente  de  Energia  Elétrica,  localizada  no município de Pocinhos, no estado da Paraíba.


    Art. 2º Autorizar a EDP Renováveis Brasil S.A. a implantar e explorar o sistema de interesse restrito da central geradora,
    que se conectará a um barramento de 34,5 kV da Subestação Elevadora Serra da Borborema 34,5/230 kV, sob responsabilidade
    da empresa EDP Renováveis. Este transformador está conectado ao barramento de 230 kV da subestação elevadora. O transformador
    T1 será compartilhado entre as EOL Serra da Borborema I, Serra da Borborema II, Serra da Borborema III, Serra da Borborema
    IV e Serra da Borborema V. A conexão ao SIN se dará através da construção de um bay de conexão no setor de 230 kV da SE
    Campina Grande III, sob responsabilidade da CHESF.


    Art.  3º  A  EDP  Renováveis  Brasil  S.A.  deverá  implantar  a  central  geradora  eólica  conforme cronograma apresentado
    à ANEEL, obedecendo aos marcos a seguir descritos:


    I Início da montagem do canteiro de obras: até 15/01/2024;


    II Início das obras civis das estruturas: 01/04/2024;


    III Início da concretagem das bases das Unidades Geradoras: até 17/06/2024;


    IV Início da montagem das torres das Unidades Geradoras: até 17/10/2024;


    V Início das obras da subestação e/ou da linha de interesse restrito do gerador: até 15/01/2024;


    VI Início da Operação em Teste das Unidades Geradoras: até 16/03/2025, e


    VII Início da Operação Comercial das Unidades Geradoras: até 01/07/2025.


    Art. 4º Estabelecer em 50% (cinquenta por cento) o percentual de redução a ser aplicado às Tarifas de Uso dos Sistemas
    Elétricos de Transmissão e de Distribuição -TUST e TUSD, aplicável à EOL Serra da Borborema II, nos termos da legislação
    e das regras de comercialização de energia elétrica.'
