    \ DAS CONCESSIONÁRIAS LICITADAS** | **9.2** | **4.1** | **01/08/2022** |\n\n\n9.1\n\nPara  aplicação  dos  critérios \
    \ de  elegibilidade,  para  fins  de  inclusão  na  base  de remuneração,  faz-se  necessária  uma  análise  qualificada\
    \  do  uso,  função  e/ou atribuição do ativo, na prestação do serviço público de transmissão de energia elétrica.\n\n\
    A  relação  dos  ativos  inventariados  classificados  como  não  elegíveis  deve  ser apresentada à ANEEL contendo as\
    \ devidas justificativas. Esses bens e/ou instalações devem ser avaliados e um relatório deve ser apresentado em separado.\n\
    \nPara avaliação da Base Incremental das transmissoras licitadas, utiliza-se o Método do Valor Novo de Reposição (VNR)\
    \ , que estabelece que cada ativo é valorado, a preços atuais, considerando todos os gastos necessários para sua substituição\
    \ por idêntico,  similar  ou  equivalente  que  efetue  os  mesmos  serviços  e  tenha  a  mesma capacidade do ativo existente.\n\
    \nPara a valoração dos ativos, a aplicação do Método do Valor Novo de Reposição utilizará, necessariamente nesta ordem:\n\
    \n Banco de Preços de Referência ANEEL;\n\n Valor contábil fiscalizado e atualizado pelo índice contratualmente estabelecido."
