    a deliberação da Diretoria, tendo em vista o disposto no art. 5º, incisos XXII, XXIII e LIV, e art. 170, incisos II e
    III, da Constituição da República Federativa do Brasil de 1988, no Decreto-Lei nº 3.365, de 21 de junho de 1941, alterado
    pela Lei nº 2.786, de 21 de maio de 1956, no art. 151, alínea ''c'', do Decreto nº 24.643, de 10 de julho de 1934, regulamentado
