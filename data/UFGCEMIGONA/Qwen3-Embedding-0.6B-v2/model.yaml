  - 'Encargos Setoriais . O valor total dos encargos setoriais corresponde ao efeito de 0,86% no presente reajuste tarifário.
    Destaca-se, principalmente, ao aumento do orçamento da CDE-USO, efeito de 0,47%, decorrente do cálculo das cotas anuais
    de CDE para o ano de 2021.


    Custos de Transmissão . O valor dos custos com o uso do sistema de distribuição equivale a um impacto tarifário de 3,15%.
    Tal efeito deriva das novas tarifas de uso do sistema de distribuição, resultante do processo tarifário da supridora.


    * A Nota Técnica é um documento emitido pelas Unidades Organizacionais e destina-se a subsidiar as decisões da Agência.


    ___________________________________________________________________________________________________________________________


    .



    .



    Fls. 48 Nota Técnica nº 163/2021-SGT/ANEEL, de 20 de julho de 2021.


    Compra de  Energia .  O  valor  dos  custos  de  compra  de  energia  contribuiu  com acréscimo de 7,13% na tarifa vigente,
    esse impacto é, também, reflexo da nova tarifa  de  suprimento da  Copel-Dis para a Ceral Dis, cuja as tarifas variaram
    em média 16%.


    Com relação à Parcela B, sua participação no reajuste tarifário é de 29,42% da Receita, resultando num efeito de 3,91%
    na variação econômico-financeira da tarifa vigente.


    Ao resultado da variação econômica, de 15,05%, foram adicionados os componentes financeiros devidos no total de -6,34%,
    que somados a retirada dos financeiros do processo anterior conjugado com a redução dos descontos para os consumidores
    rurais (14,60%), resultou no efeito médio final para o consumidor em 23,31%.


