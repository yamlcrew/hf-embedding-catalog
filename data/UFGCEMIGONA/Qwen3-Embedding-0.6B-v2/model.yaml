    - 'NOTA TÉCNICA Nº 335/2020-SCG/ANEEL


      I -DO OBJETIVO


      Analisar a adequabilidade do Sumário Executivo referente à Pequena Central Hidrelétrica (PCH)  Membeca  VIII,  com  5.900  kW  de  potência  instalada,  cadastrada  sob  o  Código  Único  de
      Empreendimentos de Geração (CEG) PCH.PH.MT.035062-1.01, com Registro de Intenção à Outorga de Autorização (DRI -PCH)  conferido  à  Global  Energia  Elétrica  S.A.  (Global  Energia  ou  Interessada),  por
      meio do Despacho nº 3.885, de 20 de novembro de 2017, localizada no rio Membeca, sub-bacia 17, na bacia hidrográfica
      do Rio Amazonas, cuja casa de força localiza-se no município de Brasnorte, estado de Mato Grosso.


      II -DOS FATOS


      O  Despacho  n°  3.504,  de  19  de  outubro  de  2015,  aprova  os  Estudos  de  Inventário Hidrelétrico do rio Membeca,
      no qual foram identificados 7 aproveitamentos hidrelétricos, dentre os quais a PCH Membeca VIII.


      O Despacho nº 3.885 1 , de 20 de novembro de 2017, confere o DRI-PCH à Global Energia, com o objetivo de desenvolver
      os estudos de projeto básico da PCH Membeca VIII.


      Em  21  de  janeiro  de  2019,  a  Interessada  protocolou  o  Sumário  Executivo  e  o  Projeto Básico referente ao
      empreendimento 2 .


      1 Documento nº 48524.012902/2017-00.


      2 Documento nº 48513.000341/2019-00.



      Em 13 de maio de 2020.


      Processo: 48500.005913/2017-64.


      Assunto:  Sumário  Executivo  referente  à  Pequena Central Hidrelétrica Membeca VIII, com 5.900 kW de Potência Instalada,
      com Registro de Intenção à Outorga  de  Autorização  (DRI -PCH)  conferido  à Global Energia Elétrica S.A..



      2 da NOTA TÉCNICA Nº 335/2020-SCG/ANEEL, de 13/5/2020.


      III -DA ANÁLISE


      As  informações  prestadas  à  ANEEL  são  de  total  e  exclusiva  responsabilidade  do Interessado, conforme expresso
      no §6º do art. 25 da Resolução Normativa n° 875, de 10 de março de 2020:'
