  - '§ 4º Para um participante fazer jus à remuneração em função da Resposta da Demanda, o seu perfil de consumo do dia do
    despacho, desconsiderados os períodos de rampa, não deve apresentar valores abaixo da margem inferior de tolerância da
    linha base.


    § 5º A CCEE deverá descontar do montante da redução da demanda o volume que exceder a margem superior de tolerância da
    linha base, dentro do dia do despacho de redução da demanda, excluído o período de entrega do produto.


    Art. 9º A redução da demanda será valorada, para cada participante, considerando o preço de sua oferta vencedora e o PLD
    vigente em cada hora do produto.


    § 1º Caso o preço da oferta vencedora seja acima do PLD, a remuneração será realizada considerando diferença entre o preço
    da oferta vencedora e o PLD, a ser paga por meio do Encargo de Serviço de Sistema -ESS, rateado pelos agentes que suportariam
    os custos dos despachos das usinas termelétricas fora da ordem de mérito.


    §  2º  A  contabilização  e  a  liquidação  dos  serviços  prestados  no  âmbito  do  programa  de Resposta da Demanda
    serão realizadas pela CCEE, por meio de Mecanismo Auxiliar de Cálculo -MAC.


    Art.  10.  O  ONS  e  a  CCEE  deverão  promover  ampla  divulgação  do  programa  entre  os potenciais participantes
    e publicar, em área de livre acesso dos seus sítios eletrônicos, o conjunto de informações sobre o programa, incluindo,
    no mínimo:


    I -  a  rotina  operacional  provisória,  no  caso  do  ONS,  e  o  procedimento  e  a  regra  de comercialização provisórios,
    no caso da CCEE;


    II - os relatórios gerenciais e informativos, de que trata o art. 4º;


    III - a grade horária para despacho de redução da demanda, de que trata o art. 6º;


    IV - o PDP, de que trata o art. 7º; e


    V - os valores pagos aos consumidores participantes do programa, nos termos do art. 9º.


    Art. 11. Os documentos de que trata o inciso I do art. 10 deverão ser publicados pelo ONS e CCEE, em até 30 (trinta) dias
    após a publicação desta Resolução.'
