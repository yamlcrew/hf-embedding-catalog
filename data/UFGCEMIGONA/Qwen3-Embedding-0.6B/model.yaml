    - '### Opção 1: Técnica e Objetiva (Recomendada para documentos)

      **Descrição:** Mapa de localização aérea, gerado via Google Earth, referente à PCH Orion. A imagem apresenta uma vista
      zenital de uma área de mata densa atravessada por um curso d''água. No mapa, estão demarcados dois pontos distintos
      através de pins coloridos: um pin verde, que indica a "Localização do barramento DRS", situado na margem do rio, e um
      pin amarelo, que indica a "Localização do barramento Inventário", situado ligeiramente abaixo e afastado da margem.
      No canto superior direito, encontra-se a legenda correlacionando as cores aos respectivos barramentos. No canto inferior
      direito, há uma escala gráfica de 20 metros e a rosa dos ventos indicando o Norte.


      ---


      ### Opção 2: Detalhada e Descritiva

      **Descrição:** Imagem de satélite do Google Earth mostrando a localização de barramentos na PCH Orion. A cena é dominada
      por vegetação verde densa, com um rio escuro cortando a imagem diagonalmente do canto superior direito para o centro.
      Sobreposta à imagem, há a identificação de dois pontos: o primeiro, marcado com um ícone verde, identifica a "Localização
      do barramento DRS", posicionado exatamente sobre a margem do rio. O segundo, marcado com um ícone amarelo, identifica
      a "Localização do barramento Inventário", posicionado em área de mata, a poucos metros de distância do primeiro ponto.
      O mapa inclui uma legenda no topo superior direito, uma escala de 20 metros e a indicação do Norte no canto inferior
      direito.



      Figura 4: Localização do barramento Inventário e DRS -Google Earth da PCH Órion.


