  - — Аи!
- source_sentence: Чего в ней!
  sentences:
  - И гарави пэстыр пэскиро доґалыпэ ёв пролыджия времё жыко бельвель, то ушты и псири пиро прахо, то пасиндой.
  - Со дрэ лэстэ!
  - Кошэна ман прэ грэда — розмэклы.
- source_sentence: Ладно.
  sentences:
  - Задынэ андрэ грэн.
  - Шукар.
  - Адай ёв тырдыя и порискирдя шэро, пучибныткэс подыкхья прэ Макаростэ.
- source_sentence: Его старуха была громадная, рослая старуха, и ему нести ее было бы еще труднее.
  sentences:
  - И Макаро газдыяпэ, ракири пэскэ тэло ушт, со дажэ после мулыпэ на дэн манушэскэ тэ пасёл.
  - Лэскири пхури сыс дрэван бари, зоралы пхури, и лэскэ тэ лыджял ла явэлас бы инкэ пхарыдыр.
  - Ёв лыя тэ ракир одолэстыр, со на камэл тэ джял ко трапэзнико дро грая.
- source_sentence: Владимир разорвал их, не читая.
  sentences:
  - Коли, хамэ, ту зорало тэ явэс тэ умарав тут могискиравас, а то и адава нашты.
  - Мандэ кэ ёв сыс баро уважэниё и ёв ман дрэван камья.
  - Владимиро розрискирдя лэн на гины.
