widgetData:
- source_sentence: This Spring `@Service` implementation (`UserServiceImpl`) retrieves user credentials by username from a
    `UserCredentialRepository`. It then maps the found `UserCredential` entity to a `UserDto` using `ModelMapper`, returning
    `null` if the user is not found.
  sentences:
  - This Python file contains a comprehensive suite of `pytest` integration and end-to-end tests for multiple distinct RESTful
    APIs, including game, history, likes, favorites, file storage, task management, and user authentication/management services.
    It thoroughly validates API endpoints, data models, authentication, pagination, and various edge cases, leveraging the
    `requests` library for HTTP interactions and extensive fixtures for setup and teardown.
  - This Python code defines a Thrift client (`Client` class) for user management, implementing methods for user registration,
    login, and retrieving/uploading user data. It utilizes a distinct `send_` and `recv_` pattern for each remote procedure
    call, handling message serialization, deserialization, and application-level exception handling.
  - This Spring Boot `RestController` (`UserController`) provides a comprehensive set of RESTful API endpoints for user management,
    enabling operations such as retrieving all users, finding users by ID or username, registering new users, updating existing
    ones, and deleting users. It delegates all business logic to an injected `UserService`, consistently returning `ResponseEntity<Response>`
    and logging actions for each operation.
- source_sentence: This Java DTO, `SwitchRoleRequest`, defines the payload for an API request to temporarily switch a user's
    role. It encapsulates a single `newRole` field, explicitly documented with Swagger annotations to accept only "ADMIN"
    or "USER" values.
  sentences:
  - This file defines a collection of Spring Boot microservices, including an API Gateway, a Course service (connecting to
    PostgreSQL), a Review service (connecting to MongoDB), and a Course Composite service. It exemplifies a microservices
    architecture where each service is a standalone Spring Boot application, handling specific domain logic and data persistence.
  - This Micronaut code primarily provides in-memory mock implementations for various repositories (Offer, Policy, PolicyAccount,
    PolicyView) using `@Replaces` and `@Requires(env = Environment.TEST)` for testing purposes. It also includes custom JWT
    claims generation and bearer token rendering, extending Micronaut's security features for specific user types.
  - This code provides utility classes, `ApiGatewayRequest` and `ApiGatewayResponse`, designed to simplify handling AWS API
    Gateway proxy requests and responses within a Lambda function. `ApiGatewayResponse` notably uses a builder pattern to
    construct `APIGatewayProxyResponseEvent` objects, supporting automatic JSON serialization for objects and Base64 encoding
    for binary response bodies.
- source_sentence: This code defines a comprehensive, centralized exception handling framework for a multi-microservice Retail
    Banking System. It leverages Spring's `@RestControllerAdvice` and `@ExceptionHandler` to consistently manage various custom
    exceptions (e.g., `MinimumBalanceException`, `AccessDeniedException`) and return structured error responses across services
    like Account, Authentication, Rules, and Transaction.
  sentences:
  - This `TradeConfig` Java class acts as a central, static repository for all configuration and runtime parameters of the
    DayTrader sample application. It defines various settings such as runtime mode (EJB3, JDBC), order processing, web interface,
    database connection details, user/quote limits, and stock price behavior, while also providing utility methods for generating
    random test data and dynamically updating these configurations.
  - This code implements and extensively tests the backend for a reactive microservices-based coding challenge platform, focusing
    on user authentication via GitHub OAuth and JWTs, user interaction features like favorites and bookmarks, and core challenge
    management including creation, retrieval, and submission handling. It heavily leverages Project Reactor for non-blocking
    operations and demonstrates a robust testing strategy with Mockito and Testcontainers for database interactions.
  - This code implements and extensively tests the backend for a reactive microservices-based coding challenge platform, focusing
    on user authentication via GitHub OAuth and JWTs, user interaction features like favorites and bookmarks, and core challenge
    management including creation, retrieval, and submission handling. It heavily leverages Project Reactor for non-blocking
    operations and demonstrates a robust testing strategy with Mockito and Testcontainers for database interactions.
- source_sentence: This code defines `*DomainEventPublisher` classes for various aggregates (Restaurant, Order, Ticket) using
    the Eventuate Tram framework to publish domain events. It also provides abstract Spring Cloud Contract Verifier test bases
    (`*MessagingBase`) to simulate and verify the production of these events for consumer-driven contract testing.
  sentences:
  - This code defines the JPA entity data model for a stock trading application, encompassing user accounts, profiles, stock
    quotes, holdings, and orders. It also provides JavaServer Faces (JSF) backing beans to manage user authentication, profile
    updates, quote retrieval, and trade execution, demonstrating a full-stack enterprise Java web application.
  - This code defines multiple Java EE WebSocket endpoints for the DayTrader sample application, showcasing different messaging
    types (JSON, text, binary) and communication patterns. The `MarketSummaryWebSocket` specifically provides real-time market
    summary data, responding to client "update" requests and proactively pushing stock price changes received from JMS messages
    via CDI events using a scheduled executor.
  - This Java enum, `ERole`, defines the distinct user roles (ADMINISTRATOR, EMPLOYEE, CUSTOMER) for an identity service.
    It leverages Lombok to provide a constructor and getter for a human-readable label associated with each role.
- source_sentence: This Java class, `TramCommandsAndEventsIntegrationData`, provides dynamically generated, timestamp-suffixed
    string identifiers for various command and event channels, aggregate destinations, and dispatchers. It serves as integration
    data, likely for configuring a messaging or event-driven framework (e.g., Tram Sagas) within a microservices architecture,
    possibly for testing or unique instance identification.
  sentences:
  - This code defines classes (`SubscriptionPoloniex`, `SubscriptionHuobi`) for establishing and maintaining real-time WebSocket
    connections to cryptocurrency exchanges like Poloniex and Huobi. It subscribes to specific currency pair order book updates,
    manages heartbeats, parses incoming market data, and dispatches processed updates to a provided callback function, likely
    for arbitrage or trading applications.
  - This code primarily defines a simple `ActionInfo` DTO and, more significantly, provides comprehensive Spring Boot integration
    tests for an `OrderService`. These tests validate order creation and state transitions within a microservices context,
    leveraging an embedded H2 database, Eventuate Tram for event-driven communication, and consumer-driven contract testing
    with stub runners for external service interactions.
  - This abstract `Specification` class implements the Specification pattern, providing a framework for defining reusable
    business rules that can be checked against an object. It enables logical composition of specifications (AND, OR, NOT)
    and includes mechanisms to capture specific error codes and parameters when a rule is not satisfied.
