widgetData:
- source_sentence: 'Sugiere una obra acerca de cine peruano que presente esta situación: En una ciudad desconocida para mí,
    Cajamarca, encuentro un grupo de actores que me permiten entrar en su intimidad'
  sentences:
  - 'Título: Luego de un plano, viene otro. País: Perú. Año: 2024. Género: Documental, Experimental. Dirección: Mario Castro
    Cobos. Locación: Lima. Idioma: Español. Temas: cine peruano. Sinopsis: Nuestra mente busca asociaciones. Un juego interesante,
    que podemos jugar más. Y no es inteligente creer que hay una sola forma de hacer películas.'
  - 'Título: La vida es impredecible, cómete el postre primero. País: Perú. Año: 2025. Género: Documental, Experimental. Dirección:
    Mario Castro Cobos. Locación: Cajamarca. Idioma: Español. Temas: cine peruano. Sinopsis: No necesito un casting para saber
    que voy a grabarla. No quiero que actúe, solo converso un poco con ella. Y también paseo por Cajamarca, rozando personas
    y lugares.'
  - 'Título: Una ballena gigante, una ballena blanca, en la niebla. País: Perú. Año: 2025. Género: Documental, Experimental.
    Dirección: Mario Castro Cobos. Locación: Cajamarca. Idioma: Español. Temas: cine peruano. Sinopsis: En una ciudad desconocida
    para mí, Cajamarca, encuentro un grupo de actores que me permiten entrar en su intimidad. Sin necesidad de palabras.'
  - 'Título: Mototaxi contranatura. País: Perú. Año: 2025. Género: Documental, Experimental. Dirección: Carlos Córdova Ayvar.
    Locación: Lima. Idioma: Español, Inglés. Temas: cine peruano. Sinopsis: Fusiona el horror del genocidio con la furia del
    placer prohibido. Niños arrastran sus sombras entre los escombros, mientras drones zumban como moscas sobre cadáveres.
    Afuera, el mundo colapsa entre rezos y metralla, pero aquí dentro la guerra es otra: la de los cuerpos que se devoran
    con amor frenético buscando la redención. No hay dios, no hay patria, no hay futuro. Solo un loop eterno de caos y orgasmos.'
- source_sentence: 'Quiero ver una historia peruana con esta idea: Emergiendo de las sombras del comercio del caucho, se revelan
    las historias perdidas de Omarino y Aredomi'
  sentences:
  - 'Título: Ruta madre. País: Perú. Año: 2025. Género: Documental. Dirección: Vania Milanovitch. Locación: Iquitos, Loreto,
    Pucallpa, Ucayali. Idioma: Español. Temas: ayahuasca, Amazonía. Sinopsis: En la selva amazónica crece una liana que desde
    tiempos ancestrales ha acompañado a sabios y chamanes por mundos espirituales. La ayahuasca, una planta con Madre, como
    dirían en muchas comunidades que la consumen, genera viajes profundos al interior del ser de quienes la consumen. En este
    documental exploramos los caminos que recorre el equipo de producción en busca de las personas que habitan las rutas del
    ayahuasca. Iquitos es el escenario que sostiene las vivencias cotidianas y transformadoras de este grupo de personas que
    tienen en común la ayahuasca en todas sus formas. Esta película representa un viaje por los diversos mundos materiales,
    plenos de simbolismo y cosmovision amazonica, que la ayahuasca contiene.'
  - 'Título: La memoria de las mariposas. País: Perú. Año: 2025. Género: Documental. Dirección: Tatiana Fuentes Sadowski.
    Locación: Iquitos, Loreto, Puerto Arica, Colombia. Idioma: Español, Murui Huitoto. Temas: Amazonía, población indígena,
    genocidio, fiebre del caucho. Sinopsis: Emergiendo de las sombras del comercio del caucho, se revelan las historias perdidas
    de Omarino y Aredomi. Un viaje a través de los archivos amazónicos conecta la investigación, la especulación y la propia
    historia familiar de la cineasta, invocando un diálogo entre los vivos y los muertos.'
  - 'Título: Shiringa: genocidio y resistencia en la Amazonía. País: Perú. Año: 2025. Género: Documental. Dirección: Wilton
    Martínez Carlevarino. Locación: Iquitos, Loreto, Comunidad de Pucaurquillo. Idioma: Español, Inglés, Bora. Temas: etnografía,
    Amazonía, población indígena, genocidio, fiebre del caucho. Sinopsis: Viideoensayo etnohistórico que explora el auge del
    caucho en la región del Putumayo a principios del siglo XX, una trágica historia de extractivismo y genocidio poscolonial
    que costó las vidas de más de 30,000 indígenas bajo el control del poderoso “barón del caucho” peruano, Julio César Arana.
    Se busca así visibilizar un perturbador capítulo de la historia nacional y global que ha sido ignorado y borrado del imaginario
    colectivo, así como reconocer su traumático legado en los pueblos indígenas, que han resistido y continúan afirmando su
    cultura.'
  - 'Título: Karuara, la gente del río. País: Perú. Año: 2024. Género: Documental. Dirección: Miguel Araoz Cartagena, Stephanie
    Boyd. Locación: Loreto. Idioma: Español, Kukama kukamiria. Temas: población indígena, contaminación ambiental, amazonía.
    Sinopsis: En lo profundo de la región amazónica de Perú, el río Marañón es el hogar de una vasta red de pueblos espirituales
    gobernados por los Karuara, o «Pueblo del río». A través de una encantadora animación pintada a mano que llena el marco
    con composiciones vibrantes, somos transportados dentro del mundo del río, donde los espíritus se relajan en hamacas hechas
    de constrictores de boa y sardinas de humo con sombreros de rayas y zapatos de bagre. Los niños que se ríen van a la escuela
    con tortugas gigantes y juegan al fútbol con peces hinchados. Sin embargo, detrás de su alegría, los Karuara también son
    ecologistas metafísicos que mantienen el delicado equilibrio de la vida en las vías fluviales. Durante siglos, el pueblo
    Kukama ha dependido de sus ríos para sobrevivir. Pero, en un mundo que continuamente pone un precio a la naturaleza y
    humaniza a las corporaciones responsables del genocidio cultural que está teniendo lugar, una federación de mujeres, dirigida
    por Mariluz Canaquiri, decide luchar y presentar una demanda innovadora exigiendo que el río, también, sea reconocido
    como una persona jurídica con derechos.'
- source_sentence: 'Busco una película peruana de documental sobre cine peruano; la historia presenta: Un encuentro con Herbert
    Rodríguez, uno de los artistas más comprometidos del Perú'
  sentences:
  - 'Título: Arqueología cultura historia. Carlos del Águila. País: Perú. Año: 2025. Género: Documental. Dirección: Mario
    Pozzi-Escot. Locación: Lima. Idioma: Español. Temas: cine peruano. Sinopsis: Un retrato íntimo del arqueólogo, investigador
    y gestor cultural Carlos del Águila Chávez.'
  - 'Título: Edgard Guillén. Testimonio de parte. País: Perú. Año: 2024. Género: Documental. Dirección: Mario Pozzi-Escot.
    Locación: Lima. Idioma: Español. Temas: cine peruano. Sinopsis: En «Edgard Guillén. Testimonio de Parte», el renombrado
    director y actor de teatro peruano, Edgard Guillén, nos brinda una ventana íntima a su mundo creativo y personal. Dirigida
    por Mario Pozzi-Escot, esta película documental es un homenaje a la vida y trayectoria de Guillén, uno de los pilares
    del teatro en el Perú. A través de profundas y reflexivas respuestas frente a cámara, Guillén comparte su visión del arte
    teatral, su experiencia profesional y su constante búsqueda de expresión y autenticidad. La película explora no solo sus
    logros en el escenario, sino también las luchas y pasiones que han definido su carrera y su vida. «Edgard Guillén. Testimonio
    de Parte» es un viaje revelador al corazón del teatro, donde el maestro revela su filosofía, sus influencias y la impronta
    de su trabajo. Planteado como un homenaje testimonial al legado teatral de este gran artista, que sigue inspirando a generaciones,
    es un testimonio conmovedor y sincero que celebra la vida y obra de uno de los grandes maestros del teatro peruano.'
  - 'Título: De a pie. País: Perú. Año: 2023. Género: Documental. Dirección: Julio Clavijo Dueñas. Locación: Lima. Idioma:
    Español. Temas: cine peruano. Sinopsis: Artesanos y peruanos de diferentes regiones nos cuenta cómo subsisten con los
    recursos propios de su región, rescantando su valor cultural en su trabajo, y que con este han logrado sobrevivir, incluso
    en medio de una pandemia mundial. Documental sin guion establecido y en complicidad con el director, nos lleva a conocer
    un poco del día a día de sus personajes en algunos casos con un seguimiento de más de 15 años.'
  - 'Título: Herbert Rodríguez. Arte vida. País: Perú. Año: 2025. Género: Documental. Dirección: Mario Pozzi-Escot. Locación:
    Lima. Idioma: Español. Temas: cine peruano. Sinopsis: Un encuentro con Herbert Rodríguez, uno de los artistas más comprometidos
    del Perú.'
- source_sentence: 'Me interesa una producción peruana situada en Miraflores, Lima, Balneario Las Delicias, Trujillo, La Libertad,
    ⁠Provo, Utah, EE UU con este argumento: Benjadoes es un adolescente de provincia que se muda a Lima al ingresar a la universidad'
  sentences:
  - 'Título: Viejas amigas. País: Perú. Año: 2024. Género: Comedia, Drama. Dirección: Fernando Villarán. Locación: Lima, La
    Libertad. Idioma: Español. Temas: vejez, secuela, feminidad. Sinopsis: Pilar, Charito, Meche y Cristina son cuatro entrañables
    amigas amantes de la timba y el lonchecito que se reúnen todos los fines de semana. Cuando descubren que una de ellas
    enfrenta la batalla contra el cáncer, deciden llevar a cabo un plan de rescate, determinadas a impedir que la enfermedad
    se la lleve. Se ven forzadas a raptarla de la clínica para emprender un viaje hacia el norte lleno de aventuras, y con
    una absoluta fe en los milagros de la Virgen de La Puerta en Otuzco.'
  - 'Título: Locos de amor, mi primer amor. País: Perú. Año: 2025. Género: Comedia, Musical. Dirección: Miguel Valladares.
    Locación: Lima, Ciudad del Este, Uruguay. Idioma: Español. Temas: LGTB, adolescencia. Sinopsis: Es el último año escolar
    y con ello viene el tan esperado viaje de promoción a Uruguay, la última oportunidad de estar todos juntos antes de que
    cada uno siga su camino. La historia de 6 amigos adolescentes que experimentarán los primeros guiños del primer amor y
    desamor donde describirán pasión por la música, lo tropical y Latino. Además, conocerán amigos de distintas latitudes
    y empezarán sus primeras historias de amor.'
  - 'Título: Los patos y las patas. País: Perú. Año: 2025. Género: Comedia, Musical. Dirección: Guillermo Castañeda. Locación:
    Lima. Idioma: Español. Temas: años 90, nostalgia, música, adolescencia. Sinopsis: Tomás tiene 40 años y acaba de divorciarse
    hace unos meses. Romina, el amor de su adolescencia, ha vuelto a Lima y le trae los recuerdos de aquel fugaz romance escolar.
    Sin embargo, un viejo walkman le da la posibilidad de volver al pasado para intentar corregir los errores que cambien
    su destino.'
  - 'Título: My Storylof. País: Perú. Año: 2025. Género: Comedia, Romance. Dirección: Benjadoes (Benjamín Doig Espinoza).
    Locación: Miraflores, Lima, Balneario Las Delicias, Trujillo, La Libertad, ⁠Provo, Utah, EE UU. Idioma: Español, Inglés.
    Temas: Gen Z, adolescencia. Sinopsis: Benjadoes es un adolescente de provincia que se muda a Lima al ingresar a la universidad.
    Su único propósito es hacer amigos para seguir haciendo sus videos de YouTube. Pero esos videos ya los vimos, lo que no
    hemos visto aún es su lado más humano: el pasional, el cual nace al conocer a Valeria, su primer amor, y más tarde… a
    Alessia. Benja descubre que el camino al éxito no se trata solo de seguidores o metas cumplidas, sino de los vínculos
    que lo transforman.'
- source_sentence: 'Sugiere una obra acerca de cine peruano que presente esta situación: Una nueva reencarnación de Karl Marx
    se esconde en Perú'
  sentences:
  - 'Título: My high serf errs the encryption. País: Perú. Año: 2025. Género: Experimental. Dirección: Jorge Villacorta Santamato.
    Locación: Lima. Idioma: Inglés. Temas: cine peruano. Sinopsis: Un hombre cree que el mundo es una simulación. Él siente
    que su Ser Superior lo está observando. Él piensa que todo lo que le rodea es un mensaje. Explica lo que las figuras de
    acción y los modelos de coches significan para él. Él habla con su Ser Superior.'
  - 'Título: Capitalist Decency stood the pro-Communist Party sympathizer up twice. País: Perú. Año: 2025. Género: Experimental.
    Dirección: Jorge Villacorta Santamato. Locación: Lima. Idioma: Español, Inglés. Temas: cine peruano. Sinopsis: A un tipo
    le gusta el Partido Comunista. Al mismo hombre también le gusta la decencia capitalista. Él quiere conocerla. Él la espera,
    pero ella no aparece. Ambos conectan sus mentes con una máquina de lavado de cerebro, pero no funciona. Él no puede percibirla.'
  - 'Título: The enthralling Snorting-Man versus the pleasure of being Myself. País: Perú. Año: 2025. Género: Experimental.
    Dirección: Jorge Villacorta Santamato. Locación: Lima. Idioma: Inglés. Temas: cine peruano. Sinopsis: Por la noche, dentro
    de una habitación doble, hay dos hombres. Uno de ellos está durmiendo y resoplando ruidosamente. El otro no puede conciliar
    el sueño. El tipo espera hasta el amanecer. Mientras espera, come un bocadillo y pasea un poco. También se lava la cara.'
  - 'Título: Karl Marx (1-5). País: Perú. Año: 2024. Género: Experimental. Dirección: Jorge Villacorta Santamato. Locación:
    Lima. Idioma: Español. Temas: cine peruano. Sinopsis: Una nueva reencarnación de Karl Marx se esconde en Perú. Friedrich
    paga los gastos de Karl. Karl continúa sus estudios y quiere convertirse en un artista de renombre. Él admira a Leonidas
    Zegarra. Marx llama a Friedrich y deja diecinueve mensajes de voz.'
