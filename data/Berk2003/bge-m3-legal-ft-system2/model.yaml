      Karar sonucu göstergesi: Onama'
  - source_sentence: Anayasa Hukuku alanında V. Vatan hizmeti hakkında kaynak ne söylüyor?
    sentences:
    - Kiracının bu yükümlülüğüne aykırı davranması durumunda kiraya veren, konut ve çatılı işyeri kirasında, en az otuz gün
      süre vererek, aykırılığın giderilmesi, aksi takdirde sözleşmeyi feshedeceği konusunda yazılı bir ihtarda bulunur. Diğer
      kira ilişkilerinde ise, kiraya veren, kiracıya önceden bir ihtarda bulunmaksızın, yazılı bir bildirimle sözleşmeyi hemen
      feshedebilir. Konut ve çatılı işyeri kirasında, kiracının kiralanana kasten ağır bir zarar vermesi, kiracıya verilecek
      sürenin yararsız olacağının anlaşılması veya kiracının bu yükümlülüğe aykırı davranışının kiraya veren veya aynı taşınmazda
      oturan kişiler ile komşular bakımından çekilmez olması durumlarında kiraya veren, yazılı bir bildirimle sözleşmeyi hemen
      feshedebilir”. Anılan madde hükmü gereğince akde aykırılıktan dolayı kiracının tahliyesine karar verilebilmesi için
      kiracıya akde aykırı davranışına son vermesi hususunda kiralayan tarafından süreli bir ihtar tebliğ ettirilmesi ve tanınan
      bu süre içerisinde de akde aykırılığın giderilmemiş olması gerekir. Davanın konusuz kalmasına gelince; davanın konusuz
      kalması halinde işin esası hakkında infaz kabiliyeti olan bir hüküm kurulmamaktadır. Dava sırasında borcun ödenmesi,
      dava konusu menkul malın davacıya teslim edilmesi, kiralananın tahliye edilmesi, taşınmaza yönelik müdahaleye son verilmesi,
      dava konusu taşınmazın kamulaştırılması gibi hallerde mahkemece davanın konusuz kalması nedeni ile karar verilmesine
      yer olmadığına karar verilmelidir. Davanın konusuz kalması halinde mahkemenin yargılamaya devam ederek dava açıldığı
      zaman hangi tarafın haksız olduğunu tespit etmesi ve tutumuyla dava açılmasına sebep olan tarafı yargılama gideri ile
      mahkum etmesi gerekir.
    - 'KAYIT 0817 | Karar sonucu: İhlal | Temel hak konusu: Adil yargılanma hakkı | Uyuşmazlık alanı: Ceza yargılaması, İş
      ve sosyal güvenlik | Ayırt edici kavramlar: savunma, temyiz, duruşma, yargılama, mahkeme. Başvuru formu ve eklerine
      göre ilgili olaylar özetle şöyledir kocaeli narkotik büro amirliği görevlilerinin istihbarat çalışmalarında uyuşturucu
      madde satışı yapıldığı bilgileri elde edilmiştir bunun üzerine suç delillerinin ele geçirilmesi için tarihinde çalışma
      başlatılmıştır söz konusu soruşturma evrakında hakkında kullanmak için uyuşturucu madde bulundurmak suçundan soruşturma
      yürütülen ak ile başvurucunun tarihinde buluştuğu başvurucunun akya bir şeyler verdikten sonra oradan yürüyerek uzaklaştığı
      aknın daha sonra yakalandığı ve üzerindeki gr esrarı kolluk görevlilerine rızasıyla verdiği belirtilmiştir başvurucunun
      ikametinde tarihinde yapılan aramada herhangi bir suç unsuruna rastlanmamıştır aynı gün. Başvurucu gözaltına alınmış
      ve tutuklanmıştır ak ifadesinde beş yıldır esrar kullandığını başvurucuyu uzaktan akrabası olması nedeniyle tanıdığını
      suç tarihinde uyuşturucu madde temin etmek için başvurucunun yanına gittiğini ona parasının olmadığını ödünç olarak
      uyuşturucu maddeyi kendisine temin edip etmeyeceğini sorduğunu daha sonra başvurucunun yanına gelerek üzerinde ele geçirilen
      maddeyi kendisine verdiğini bunu da başvurucudan temin ettiğini belirtmiştir ak başvurucuyu tarihinde teşhis etmiştir.
      Başvurucu ise akyı tanıdığını belirtilen tarihte kafede oturduklarını ve çay içtiklerini. Ancak bu kimseye uyuşturucu
      madde...'
    - Madde 72 – Vatan hizmeti, her Türkün hakkı ve ödevidir. Bu hizmetin Silahlı Kuvvetlerde veya kamu kesiminde ne şekilde
      yerine getirileceği veya getirilmiş sayılacağı kanunla düzenlenir.
  - source_sentence: görevli mahkeme hakkında ORICON kaynağına göre ne söylenebilir?
    sentences:
    - Hem uygulama işlemine hem de düzenleyici işleme karşı birlikte dava açıldığında, görevli mahkeme hiyerarşik olarak üst
      sırada yer alan işleme göre tespit edilecektir. Uygulama işlemiyle birlikte düzenleyici işleme karşı dava açılırken
