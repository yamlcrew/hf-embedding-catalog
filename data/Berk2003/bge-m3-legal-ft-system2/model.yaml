widgetData:
- source_sentence: Hukuk Genel Kurulu 2013/1744 E., 2015/835 K. sayılı Yargıtay HGK kararında Direnme Kararı; Hükmün Tefhimi
    ve Kapsamı uyuşmazlığı bakımından temel değerlendirme nedir?
  sentences:
  - 'İçtihat Metni

    " MAHKEMESİ: Elbistan 1. Asliye Hukuk Mahkemesi TARİHİ: 30/01/2013 NUMARASI: 2012/597-2013/44 Hukuk Genel Kurulu''nca
    dosya üzerinde yapılan ön inceleme sonrasında gereği görüşüldü: Mahkeme kararlarında nelerin yazılacağı 6100 sayılı Hukuk
    Muhakemeleri Kanunu''nun 297. maddesinde belirtilmiştir. Hüküm sonucu kısmında gerekçeye ait her hangi bir söz tekrar
    edilmeksizin isteklerin her biri hakkında verilen hükümle, taraflara yüklenen borç ve tanınan hakların sıra numarası altında
    açık, şüphe ve tereddüt uyandırmayacak şekilde gösterilmesi gerekir. 6100 sayılı HMK’nun 294. maddesinin 3 fıkrasında
    ise “Hükmün tefhimi herhalde hüküm sonucunun duruşma tutanağına geçirilerek okunması suretiyle olur” hükmüne yer verilmiştir.
    Ayrıca, bozma kararı ile ilk hüküm hayatiyetini yitirdiğinden ona atıf suretiyle hüküm tesisinin yukarıda açıklanan kurallara
    uygun düşmeyeceği de aşikardır. Nitekim Yargıtay''ın yerleşmiş görüşü de bu yöndedir (Hukuk Genel Kurulu''nun 19.6.1991
    gün 323-391 sayılı; 10.09.1991 gün 281-415 sayılı; 25.9.1991 gün 355-440 sayılı; 05.12.2007 gün 981-936 sayılı; 23.01.2008
    gün 29-4 sayılı; 05.10.2011 gün 607-604 kararları). Somut olaya gelince; mahkemece aslolan kısa kararda yukarıda açıklanan
    mevzuata uygun hüküm fıkrası oluşturulmamış sadece "direnilmesine" denilmekle yetinilmiştir. Bu durumda, yukarıda açıklanan
    ilkeler çerçevesinde usulün öngördüğü anlamda oluşturulmuş bir hüküm bulunmadığı gibi, direnme kararlarını denetleyen
    Hukuk Genel Kurulu tarafından incelenebilecek nitelikte teknik anlamda bir direnme hükmü de bulunmadığı her türlü duraksamadan
    uzaktır. Şu durumda mahkemece yapılacak iş; dosya kapsamı dikkate alınarak taraflara yüklenen borç ve tanınan hakkın sıra
    numarası altında belirtildiği açık, infazda şüphe ve tereddüt uyandırmayacak biçimde, usulün aradığı niteliklere haiz
    kısa karar ve buna uygun gerekçeli karar oluşturulmasıdır. Mahkemenin, yukarıda ayrıntılarıyla açıklanan biçimde usulün
    öngördüğü niteliklere haiz bulunmayan kısa kararı ve gerekçeli kararın hüküm kısmı usul ve yasaya uygun değildir. Direnme
    kararının bu nedenle bozulması gerekmiştir.'
  - 'İçtihat Metni

    " MAHKEMESİ: Büyükçekmece 1. İcra Hukuk Mahkemesi TARİHİ: 30/04/2013 NUMARASI: 2013/266-2013/605 Hukuk Genel Kurulu''nca
    dosya üzerinde yapılan ön inceleme sonrasında gereği görüşüldü: Mahkeme kararlarında nelerin yazılacağı 6100 sayılı Hukuk
    Muhakemeleri Kanunu''nun 297. maddesinde belirtilmiştir. Hüküm sonucu kısmında gerekçeye ait her hangi bir söz tekrar
    edilmeksizin isteklerin her biri hakkında verilen hükümle, taraflara yüklenen borç ve tanınan hakların sıra numarası altında
    açık, şüphe ve tereddüt uyandırmayacak şekilde gösterilmesi gerekir. 6100 sayılı HMK’nun 294. maddesinin 3 fıkrasında
    ise “Hükmün tefhimi herhalde hüküm sonucunun duruşma tutanağına geçirilerek okunması suretiyle olur” hükmüne yer verilmiştir.
    Ayrıca, bozma kararı ile ilk hüküm hayatiyetini yitirdiğinden ona atıf suretiyle hüküm tesisinin yukarıda açıklanan kurallara
    uygun düşmeyeceği de aşikardır. Nitekim Yargıtay''ın yerleşmiş görüşü de bu yöndedir (Hukuk Genel Kurulu''nun 19.6.1991
    gün 323-391 sayılı; 10.09.1991 gün 281-415 sayılı; 25.9.1991 gün 355-440 sayılı; 05.12.2007 gün 981-936 sayılı; 23.01.2008
    gün 29-4 sayılı; 05.10.2011 gün 607-604 kararları). Somut olaya gelince; mahkemece aslolan kısa kararda yukarıda açıklanan
    mevzuata uygun hüküm fıkrası oluşturulmamış sadece "önceki kararda direnilmesine" denilmekle yetinilmiştir. Bu durumda,
    yukarıda açıklanan ilkeler çerçevesinde usulün öngördüğü anlamda oluşturulmuş bir hüküm bulunmadığı gibi, direnme kararlarını
    denetleyen Hukuk Genel Kurulu tarafından incelenebilecek nitelikte teknik anlamda bir direnme hükmü de bulunmadığı her
    türlü duraksamadan uzaktır. Şu durumda mahkemece yapılacak iş; dosya kapsamı dikkate alınarak taraflara yüklenen borç
    ve tanınan hakkın sıra numarası altında belirtildiği açık, infazda şüphe ve tereddüt uyandırmayacak biçimde, usulün aradığı
    niteliklere haiz kısa karar ve buna uygun gerekçeli karar oluşturulmasıdır. Mahkemenin, yukarıda ayrıntılarıyla açıklanan
    biçimde usulün öngördüğü niteliklere haiz bulunmayan kısa kararı usul ve yasaya uygun değildir. Direnme kararının bu nedenle
    bozulması gerekmiştir.'
  - Yargıtay, basit yazılı şekilde yapılan sözleşmeleri, hak sahibinin sözleşmeye göre kendi borcu olan satım bedelini inşaat
    firmasına ödemesi durumunda geçerli kabul etmektedir.
- source_sentence: Hukuk Genel Kurulu 2015/20 E., 2015/912 K. sayılı Yargıtay HGK kararında Direnme Kararı; Kısa Kararın ve
    Hüküm Fıkrasının Usule Uygun Olmaması uyuşmazlığı bakımından temel değerlendirme nedir?
  sentences:
  - 'MADDE 294- Bağışlayan, bağışlamadan doğan zarardan bu zarara ağır kusuruyla.

    sebep olmadıkça, bağışlanana karşı sorumlu değildir.

    Bağışlayan, bağışlanılan şey veya alacak hakkında ayrıca garanti sözü vermişse, bununla.

    sorumlu olur.

    E. Bağışlamanın ortadan kalkması'
  - 'Kaynak türü: Yargıtay Hukuk Genel Kurulu kararı

    Emsal karar: Hukuk Genel Kurulu 2015/20 E., 2015/912 K.

    Hukuk alanı: Medeni Usul Hukuku

    Konu başlıkları: Direnme Kararı; Kısa Kararın ve Hüküm Fıkrasının Usule Uygun Olmaması

    İlgili mevzuat atıfları: 6100 s. HMK m. 294/3, 297

    Uyuşmazlık özeti: Önceki kararda ısrar edildiğini belirtmekle yetinilerek taraflara yüklenen borç ve tanınan hakları içermeyen
    kısa kararın, usule uygun ve denetime elverişli bir hüküm teşkil edip etmediği

    Karar sonucu göstergesi: Bozma'
  - 'KAYIT 0826 | Karar sonucu: İhlal | Temel hak konusu: Kişi özgürlüğü ve güvenliği hakkı | Uyuşmazlık alanı: Ceza yargılaması,
    Askerî/idari uyuşmazlık, İş ve sosyal güvenlik | Ayırt edici kavramlar: tutukluluk, tutuklama, tutuklu, gözaltı, tahliye.
    Başvuru formu ve eklerine göre ve ulusal yargı ağı bilişim sistemi UYAP aracılığıyla erişilen bilgi ve belgeler çerçevesinde
    ilgili olaylar özetle şöyledir türkiye temmuz tarihinde askerî bir darbe teşebbüsüyle karşı karşıya kalmış bu nedenle
    tarihinde ülke genelinde olağanüstü hâl ilan edilmesine karar verilmiş ve olağanüstü hâl tarihinde son bulmuştur kamu
    makamları ve yargı organları olgusal temellere dayanarak bu teşebbüsün arkasında türkiyede çok uzun yıllardır faaliyetlerine
    devam eden ve son yıllarda fetullahçı terör örgütü fetö paralel devlet yapılanması olarak isimlendirilen bir yapılanmanın
    olduğunu değerlendirmişlerdir aydın yavuz ve diğerleri b no darbe teşebbüsü sırasında ve sonrasında ülke genelinde darbe
    girişimiyle bağlantılı ya da doğrudan darbe girişimiyle bağlantılı olmasa bile kamu kurumlarındaki örgütlenmesinin yanı
    sıra eğitim sağlık ticaret sivil toplum ve medya gibi farklı alanlardaki yapılanmasına yönelik olarak cumhuriyet başsavcılıkları
    tarafından soruşturmalar yürütülmüş çok sayıda kişi hakkında gözaltı ve tutuklama tedbirleri uygulanmıştır aydın yavuz
    ve diğerleri mehmet hasan altan b no hâkimler ve savcılar yüksek kurulu hsyk dairesinin tarihli kararı ile alaşehir cumhuriyet
    savcısı olarak görev yapmakta olan başvurucunun görevden uzaklaştırılmasına ve tarihinde meslekten ihraç edilmesine karar...'
- source_sentence: Taşınmaz tesliminin gecikmesi hakkında ORICON kaynağına göre ne söylenebilir?
  sentences:
  - Taşınmaz tesliminin gecikmesi durumunda alacaklının, taşınmazın kendisine teslim edilmesini isteme hakkı bulunmaktadır.
    İnşaat firması teslim tarihinde taşınmazı teslim etmezse, teslim borcu muaccel hale gelir ve alacaklı, taşınmazın teslimini
    talep edebilir.
  - 'Madde 935- Senedi çıkaran aracı kurum, alacaklıların ve borçlunun temsilcisi olsa bile,

    senetlerin çıkarılması sırasında kendisine ayrıca yetki verilmiş olmadıkça, borcun kapsamında ve.

    koşullarında bir değişiklik yapamaz.

    2.Senetlerin geri ödenmesi'
  - 'Kaynak türü: Yargıtay Hukuk Genel Kurulu kararı

    Emsal karar: Hukuk Genel Kurulu 2013/1910 E., 2015/1203 K.

    Hukuk alanı: İcra ve İflas Hukuku

    Konu başlıkları: İhalenin Feshi; Kanun Yolları

    İlgili mevzuat atıfları: 2004 s. İİK m. 134/2

    Uyuşmazlık özeti: Özel bir kanun hükmü bulunmadıkça Cumhuriyet savcısının ihalenin feshi davasında verilen kararı temyiz
    etme yetkisinin bulunup bulunmadığı

    Karar sonucu göstergesi: Onama'
- source_sentence: Anayasa Hukuku alanında V. Vatan hizmeti hakkında kaynak ne söylüyor?
  sentences:
  - Kiracının bu yükümlülüğüne aykırı davranması durumunda kiraya veren, konut ve çatılı işyeri kirasında, en az otuz gün
    süre vererek, aykırılığın giderilmesi, aksi takdirde sözleşmeyi feshedeceği konusunda yazılı bir ihtarda bulunur. Diğer
    kira ilişkilerinde ise, kiraya veren, kiracıya önceden bir ihtarda bulunmaksızın, yazılı bir bildirimle sözleşmeyi hemen
    feshedebilir. Konut ve çatılı işyeri kirasında, kiracının kiralanana kasten ağır bir zarar vermesi, kiracıya verilecek
    sürenin yararsız olacağının anlaşılması veya kiracının bu yükümlülüğe aykırı davranışının kiraya veren veya aynı taşınmazda
    oturan kişiler ile komşular bakımından çekilmez olması durumlarında kiraya veren, yazılı bir bildirimle sözleşmeyi hemen
    feshedebilir”. Anılan madde hükmü gereğince akde aykırılıktan dolayı kiracının tahliyesine karar verilebilmesi için kiracıya
    akde aykırı davranışına son vermesi hususunda kiralayan tarafından süreli bir ihtar tebliğ ettirilmesi ve tanınan bu süre
    içerisinde de akde aykırılığın giderilmemiş olması gerekir. Davanın konusuz kalmasına gelince; davanın konusuz kalması
    halinde işin esası hakkında infaz kabiliyeti olan bir hüküm kurulmamaktadır. Dava sırasında borcun ödenmesi, dava konusu
    menkul malın davacıya teslim edilmesi, kiralananın tahliye edilmesi, taşınmaza yönelik müdahaleye son verilmesi, dava
    konusu taşınmazın kamulaştırılması gibi hallerde mahkemece davanın konusuz kalması nedeni ile karar verilmesine yer olmadığına
    karar verilmelidir. Davanın konusuz kalması halinde mahkemenin yargılamaya devam ederek dava açıldığı zaman hangi tarafın
    haksız olduğunu tespit etmesi ve tutumuyla dava açılmasına sebep olan tarafı yargılama gideri ile mahkum etmesi gerekir.
  - 'KAYIT 0817 | Karar sonucu: İhlal | Temel hak konusu: Adil yargılanma hakkı | Uyuşmazlık alanı: Ceza yargılaması, İş ve
    sosyal güvenlik | Ayırt edici kavramlar: savunma, temyiz, duruşma, yargılama, mahkeme. Başvuru formu ve eklerine göre
    ilgili olaylar özetle şöyledir kocaeli narkotik büro amirliği görevlilerinin istihbarat çalışmalarında uyuşturucu madde
    satışı yapıldığı bilgileri elde edilmiştir bunun üzerine suç delillerinin ele geçirilmesi için tarihinde çalışma başlatılmıştır
    söz konusu soruşturma evrakında hakkında kullanmak için uyuşturucu madde bulundurmak suçundan soruşturma yürütülen ak
    ile başvurucunun tarihinde buluştuğu başvurucunun akya bir şeyler verdikten sonra oradan yürüyerek uzaklaştığı aknın daha
    sonra yakalandığı ve üzerindeki gr esrarı kolluk görevlilerine rızasıyla verdiği belirtilmiştir başvurucunun ikametinde
    tarihinde yapılan aramada herhangi bir suç unsuruna rastlanmamıştır aynı gün. Başvurucu gözaltına alınmış ve tutuklanmıştır
    ak ifadesinde beş yıldır esrar kullandığını başvurucuyu uzaktan akrabası olması nedeniyle tanıdığını suç tarihinde uyuşturucu
    madde temin etmek için başvurucunun yanına gittiğini ona parasının olmadığını ödünç olarak uyuşturucu maddeyi kendisine
    temin edip etmeyeceğini sorduğunu daha sonra başvurucunun yanına gelerek üzerinde ele geçirilen maddeyi kendisine verdiğini
    bunu da başvurucudan temin ettiğini belirtmiştir ak başvurucuyu tarihinde teşhis etmiştir. Başvurucu ise akyı tanıdığını
    belirtilen tarihte kafede oturduklarını ve çay içtiklerini. Ancak bu kimseye uyuşturucu madde...'
  - Madde 72 – Vatan hizmeti, her Türkün hakkı ve ödevidir. Bu hizmetin Silahlı Kuvvetlerde veya kamu kesiminde ne şekilde
    yerine getirileceği veya getirilmiş sayılacağı kanunla düzenlenir.
- source_sentence: görevli mahkeme hakkında ORICON kaynağına göre ne söylenebilir?
  sentences:
  - Hem uygulama işlemine hem de düzenleyici işleme karşı birlikte dava açıldığında, görevli mahkeme hiyerarşik olarak üst
    sırada yer alan işleme göre tespit edilecektir. Uygulama işlemiyle birlikte düzenleyici işleme karşı dava açılırken sürenin
    canlanabilmesi için, uygulama işlemine karşı süresi içinde dava açılmış olması şarttır.
  - İstihkak davasındaki dengeli ispat yükü, hem davacının mülkiyet hakkını koruma hem de davalının geçerli haklarını savunma
    açısından adil bir çözüm sağlamayı amaçlar.
  - Rehin açığı belgesi alacaklıya, borçluya karşı takip başlatma hakkı tanır ve bu durumda borçlu diğer malvarlığı unsurları
    ile de sorumlu olur.
