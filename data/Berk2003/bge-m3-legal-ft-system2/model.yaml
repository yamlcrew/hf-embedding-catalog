      kurallara uygun düşmeyeceği de aşikardır. Nitekim Yargıtay''ın yerleşmiş görüşü de bu yöndedir (Hukuk Genel Kurulu''nun
      19.6.1991 gün 323-391 sayılı; 10.09.1991 gün 281-415 sayılı; 25.9.1991 gün 355-440 sayılı; 05.12.2007 gün 981-936 sayılı;
      23.01.2008 gün 29-4 sayılı; 05.10.2011 gün 607-604 kararları). Somut olaya gelince; mahkemece aslolan kısa kararda yukarıda
      açıklanan mevzuata uygun hüküm fıkrası oluşturulmamış sadece "önceki kararda direnilmesine" denilmekle yetinilmiştir.
      Bu durumda, yukarıda açıklanan ilkeler çerçevesinde usulün öngördüğü anlamda oluşturulmuş bir hüküm bulunmadığı gibi,
      direnme kararlarını denetleyen Hukuk Genel Kurulu tarafından incelenebilecek nitelikte teknik anlamda bir direnme hükmü
      de bulunmadığı her türlü duraksamadan uzaktır. Şu durumda mahkemece yapılacak iş; dosya kapsamı dikkate alınarak taraflara
      yüklenen borç ve tanınan hakkın sıra numarası altında belirtildiği açık, infazda şüphe ve tereddüt uyandırmayacak biçimde,
      usulün aradığı niteliklere haiz kısa karar ve buna uygun gerekçeli karar oluşturulmasıdır. Mahkemenin, yukarıda ayrıntılarıyla
      açıklanan biçimde usulün öngördüğü niteliklere haiz bulunmayan kısa kararı usul ve yasaya uygun değildir. Direnme kararının
      bu nedenle bozulması gerekmiştir.'
    - Yargıtay, basit yazılı şekilde yapılan sözleşmeleri, hak sahibinin sözleşmeye göre kendi borcu olan satım bedelini inşaat
      firmasına ödemesi durumunda geçerli kabul etmektedir.
  - source_sentence: Hukuk Genel Kurulu 2015/20 E., 2015/912 K. sayılı Yargıtay HGK kararında Direnme Kararı; Kısa Kararın
      ve Hüküm Fıkrasının Usule Uygun Olmaması uyuşmazlığı bakımından temel değerlendirme nedir?
    sentences:
    - 'MADDE 294- Bağışlayan, bağışlamadan doğan zarardan bu zarara ağır kusuruyla.

      sebep olmadıkça, bağışlanana karşı sorumlu değildir.

      Bağışlayan, bağışlanılan şey veya alacak hakkında ayrıca garanti sözü vermişse, bununla.

      sorumlu olur.

