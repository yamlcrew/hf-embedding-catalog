- source_sentence: "A11y_Visual Studio Code Client_Search_Global Search_Keyboard: We are not able to access the tooltips present\
    \ for \"Match case\", \"Match whole word\" etc present in \"global search\" section via keyboard.\n\n[[Check out Accessibility\
    \ Insights!](https://accessibilityinsights.io/)]- Identify accessibility bugs before check-in and make bug fixing faster\
    \ and easier.\r\n\r\n### GitHubTags:\r\n#A11yTCS; #A11ySev2; #DesktopApp; #MAC; #Visual Studio Code Client; #WCAG2.1.1;\
    \ #Keyboard; #BM-VisualStudioCodeClient-MAC-Jan2024; #A11yMAS\r\n\r\n### **Environment details:**\r\nVisual Studio Code\
    \ insider version 1.86.0\r\nmacOS: Sonoma 14.2.1\r\n\r\n### Repro Steps:\r\n\r\n1. Open Visual Studio Code Insiders editor\r\
    \n2. Using keyboard navigation View Menu Bar\r\n3. TAB till search option and press ENTER.\r\n4. TAB till \"Match case\"\
    , \"Match whole word\" etc controls.\r\n5. Observed that We are not able to access the tooltips present for \"Match case\"\
    , \"Match whole word\" etc present in \"global search\" section via keyboard.\r\n\r\n### Actual Result:\r\nWe are not\
    \ able to access the tooltips present for \"Match case\", \"Match whole word\" etc present in \"global search\" section\
    \ via keyboard.\r\n\r\n**Similar issue is also observed throughout the application.**\r\n\r\n### Expected Result:\r\n\
    We should be able to access the tooltips present for \"Match case\", \"Match whole word\" etc present in \"global search\"\
    \ section via keyboard.\r\n\r\n### User Impact:\r\nKeyboard only users will not be able to get tooltip information of\
    \ the control.\r\n\r\n### Attachment:\r\n\r\n\r\nhttps://github.com/microsoft/vscode/assets/143686145/51b903a7-62ae-4a14-9988-82db48ac8424"
  sentences:
  - '`languages.match` doesn''t work for notebook cell documents in document close events


    Underlying reason is that the document data for the notebook cell document got already removed from the `ExtHostDocumentsAndEditors`
    registry. Since matching the notebook cell requires the underlying notebook document to get to the notebook type the match
    fails and return 0.'
