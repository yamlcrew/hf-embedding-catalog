- source_sentence: Tuyển dụng Chuyên viên Quản lý Dịch vụ Y tế và Nhân sự với nhiệm vụ điều phối hoạt động tiếp đón bệnh nhân
    và vận hành hệ thống dữ liệu khám chữa bệnh theo đúng các tiêu chuẩn bảo mật y tế nghiêm ngặt. Ứng viên sẽ chịu trách
