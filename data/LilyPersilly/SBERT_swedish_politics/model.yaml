widgetData:
- source_sentence: Myndigheter ska samarbeta mot skuggsamhället, men med tydliga undantag för hälso- och sjukvårdspersonal
    av etiska och humanitära skäl.
  sentences:
  - Huvudregeln ska vara att icke-svenska medborgare som begår allvarliga brott alltid ska utvisas på livstid.
  - Staten ska inte finansiera miljardrullningar till privata kapitalisters riskprojekt utan driva direkta, samhällsägda investeringar
    för miljön.
  - All form av asylinvandring stoppas permanent och omedelbart.
- source_sentence: Utländska medborgare som begår allvarliga brott i Sverige ska som grundregel alltid utvisas på livstid.
  sentences:
  - Fokus måste ligga på sociala förebyggande insatser och tidigt stöd snarare än att sänka straffmyndighetsåldern.
  - Utländska medborgare som begår allvarliga brott ska som huvudregel utvisas, med beaktande av internationella konventioner.
  - Huvudregeln ska vara att icke-svenska medborgare som begår allvarliga brott alltid ska utvisas på livstid.
- source_sentence: Skatter och regleringar som påverkar medborgarnas livsstil bör röstas om direkt av dem som berörs av lagarna.
  sentences:
  - Statliga påbud, klimatskatter och moraliserande kampanjer mot vanliga svenskars livsstil ska avskaffas.
  - Vi motsätter oss rasistiska och godtyckliga åtstramningar av uppehållstillstånd som splittrar arbetarklassen.
  - Sverige och Norden ska omedelbart lämna EU och avvisa all överstatlig miljöbyråkrati.
- source_sentence: En kompromisslös nollvision mot narkotika, då droger förstör folkstockens hälsa och biologiska vitalitet.
  sentences:
  - Fokus måste ligga på sociala förebyggande insatser och tidigt stöd snarare än att sänka straffmyndighetsåldern.
  - Klimatskatter och pålagor som slår sönder landsortens och folkets ekonomi ska avskaffas omedelbart.
  - Vi motsätter oss moraliserande straffskatter och detaljstyrande förbud som inskränker medborgarnas frihet.
- source_sentence: Nej. Lagstadgad arbetstidsförkortning vore ett dråpslag mot Sveriges tillväxt, företagens konkurrenskraft
    och välfärdens finansiering.
  sentences:
  - Vi avvisar dekadent konsumtionskultur såväl som godtyckliga globalistiska livsstilsdirektiv.
  - Nivån på bränsleskatter och reduktionsplikt bör avgöras direkt av väljarna genom kontinuerliga digitala omröstningar.
  - RUT och ROT ska finnas kvar; de förenklar vardagen, skapar jobb för utrikesfödda och minskar den svarta sektorn.
