    upon rising to depart, commit the strangest blunders. Such, for instance, as opening the first door that comes handy,
    and finding himself stealing up-stairs by the back passage. Shutting that door, he will proceed to another, and be aghast
    at the cellar yawning at his feet. Trying a third, he surprises the housemaid at her work. In the end, no more relying
    on his own unaided efforts, he procures a trusty guide in some passing person, and in good time successfully emerges.
