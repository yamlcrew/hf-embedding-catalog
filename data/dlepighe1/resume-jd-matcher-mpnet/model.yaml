    * Must be 21 years of age and possess a valid driver''s license with limited violations; must meet eligibility requirements
    to participate in [Company]’ fleet vehicle program

    * Legally authorized to work in the [Company] States on a continual and permanent basis without company sponsorship


    *Preferred Qualifications:*


    * Bachelor''s degree in Business or Engineering

    * Salesforce CRM

    * Sales experience in the commercial Fire Alarm / Life Safety, Software, or IoT industries

    * Experience in the life sciences, healthcare, education, data center, and commercial office vertical markets

    * Experience selling to end users/owners and demonstrated understanding of how to market, position, and sell cloud-based,
    data-driven service programs such as fault detection and diagnostics to existing and new customers


    Ready to create your own journey? Join us today!


    About [Company]


    We are a [Company] technology company focused on industry, infrastructure, transport, and healthcare. From more resource-efficient
    factories, resilient supply chains, and smarter buildings and grids, to sustainable transportation as well as advanced
    healthcare, we create technology with purpose adding real value for customers.


    Our Commitment to Equity and Inclusion in our Diverse [Company] Workforce


    We value your unique identity and perspective. We are fully committed to providing equitable opportunities and building
    a workplace that reflects the diversity of society, while ensuring that we attract the best talent based on qualifications,
    skills, and experiences. We welcome you to bring your authentic self and transform the everyday with us. \LI-DRR


    You’ll Benefit From'
