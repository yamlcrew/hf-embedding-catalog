    Our [Company], diverse team would be happy to support you and challenge you to grow in new ways. Who knows where our shared
    journey will take you?


    Our Smart Buildings help to create efficient, safe, adaptable, and responsible environments. Our aim isn’t just about
    improving buildings; it’s about creating perfect places that improve people’s lives.


    Transform the everyday with us!


    The Fire/Life Safety Sales/Sr. Sales/Account Executive is responsible for supporting growth across both Service Agreements
    and Solutions (new construction and retrofit) sales within [Company] Smart Buildings. In this role, you will partner with
    customers to deliver fire alarm and life safety solutions that help ensure safe, compliant, and high-performing buildings.


    You will work alongside experienced sales professionals and operations teams to develop your sales skills, build customer
    relationships, and contribute to both recurring service business and project-based opportunities.


    As a Fire/Life Safety Sales Executive, you will:


    * Achievement of new order/booking and profit goals within assigned territory

