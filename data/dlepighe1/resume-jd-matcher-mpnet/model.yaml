    millions of users worldwide. You will work closely with product managers, engineers, and fellow designers to create intuitive,
    accessible, and impactful user experiences that align with our vision for seamless design collaboration. This is an opportunity
    to have a direct impact on the future of design tools, pushing the boundaries of what’s possible in a real-time, cloud-based
    environment.


    Responsibilities:

    - Lead end-to-end UX design projects, from user research and ideation through prototyping and user testing, to final delivery.

    - Collaborate cross-functionally with product, engineering, and design teams to define user needs and translate them into
    elegant, user-centered design solutions.

    - Conduct and analyze qualitative and quantitative user research, including usability testing, surveys, and analytics
    to inform design decisions and validate concepts.

    - Create wireframes, interactive prototypes, user flows, and high-fidelity mockups using tools such as [Company], Sketch,
    and Principle.

    - Advocate for design best practices and accessibility standards (WCAG 2.1) throughout the product lifecycle.

    - Mentor and provide guidance to junior designers, fostering a culture of continuous learning and design excellence.

    - Contribute to the evolution of our design system by creating reusable components and documenting UX patterns.

    - Stay current with industry trends, emerging technologies, and UX methodologies, incorporating them to enhance our design
    process.


    Requirements:

    - 5-10 years of professional UX design experience, preferably with a focus on SaaS or collaborative software products.

    - Proficiency in [Company] as a primary design and prototyping tool; experience with additional tools like Sketch, Adobe
    XD, Principle, or [Company] is a plus.

    - Solid understanding of user-centered design principles, interaction design, information architecture, and usability
    testing methodologies.

    - Demonstrated experience conducting user research and synthesizing insights into actionable design improvements.

    - Strong knowledge of accessibility standards and experience designing inclusive products.

    - Excellent communication and presentation skills with the ability to articulate design decisions to both technical and
    non-technical stakeholders.

    - Experience working in Agile/Scrum environments and collaborating closely with engineering teams.

    - Bachelor’s degree in Design, Human-Computer Interaction, Psychology, or a related field; advanced degrees or certifications
    (e.g., NN/g UX Certification) are a plus.


    Nice to Have:

    - Experience working on real-time collaborative applications or complex web platforms.

    - Familiarity with front-end technologies such as HTML, CSS, and JavaScript to better collaborate with engineering teams.

    - Background in motion design or micro-interactions to enhance user engagement.

    - Contributions to open-source design systems or active participation in the design community.


    If you are passionate about crafting user experiences that empower creativity and collaboration at scale, and thrive in
    a fast-paced, innovative environment, we encourage you to apply for this exciting opportunity.'
