  - 'Vulnerability Management Engineer


    Location: Foster City, CA


    About the Role

    We are seeking a detail-oriented and technically proficient Vulnerability Management Engineer to join our cybersecurity
    team. In this role, you will be responsible for identifying, analyzing, and mitigating security vulnerabilities across
    enterprise environments. You will work closely with cross-functional teams including security analysts, IT operations,
    and development teams to implement comprehensive vulnerability management programs. This position offers the opportunity
    to leverage your expertise in vulnerability assessment tools and risk management frameworks to enhance the overall security
    posture of complex infrastructures.


    Responsibilities

    - Conduct continuous vulnerability assessments using [Company] Cloud Platform and other leading vulnerability scanning
    tools to identify security weaknesses in on-premises, cloud, and hybrid environments.

    - Analyze scan results to prioritize vulnerabilities based on risk, impact, and exploitability, and provide actionable
    remediation guidance to engineering and IT teams.

    - Develop and maintain vulnerability management processes aligned with industry standards such as NIST SP 800-40, CIS
    Controls, and ISO 27001.

    - Collaborate with DevSecOps teams to integrate vulnerability scanning into CI/CD pipelines using tools like Jenkins,
    GitLab CI, or Azure DevOps.

    - Track remediation efforts and generate detailed reports and metrics to communicate vulnerability trends and risk posture
    to management and stakeholders.

    - Perform validation scans and verify the effectiveness of remediation actions to ensure vulnerabilities are properly
    addressed.

    - Stay up to date with emerging threats, zero-day vulnerabilities, and security advisories from vendors and vulnerability
    databases (e.g., CVE, NVD).

    - Assist in incident response activities related to vulnerability exploitation and coordinate with threat intelligence
    teams to enhance detection capabilities.


    Requirements

    - 2-5 years of hands-on experience in vulnerability management or cybersecurity operations roles.

    - Proficiency with [Company] Cloud Platform vulnerability scanning tools and dashboard configuration.

    - Strong understanding of network protocols, operating systems (Windows, Linux), and common application architectures.

    - Experience working with vulnerability assessment frameworks such as CVSS scoring, OWASP Top 10, and MITRE ATT&CK.

    - Familiarity with scripting languages (Python, PowerShell) to automate vulnerability data collection and reporting.

    - Knowledge of cloud security concepts and experience assessing vulnerabilities in AWS, Azure, or GCP environments.

    - Excellent communication skills with the ability to translate technical vulnerability details into clear business risk
    assessments.


    Nice to Have

    - Relevant industry certifications such as CISSP, GIAC GVM, or CompTIA Security+.

    - Experience integrating vulnerability management solutions into SIEM platforms like [Company] or QRadar.

    - Hands-on knowledge of container security tools (e.g., Aqua Security, Twistlock) and Kubernetes vulnerability scanning.

    - Exposure to penetration testing methodologies and tools (Nessus, Burp Suite) to complement vulnerability analysis.


    This role offers a challenging environment where your expertise in vulnerability management will directly contribute to
    defending critical assets and infrastructure. If you are passionate about cybersecurity and have a strong technical background,
    we encourage you to apply.'
