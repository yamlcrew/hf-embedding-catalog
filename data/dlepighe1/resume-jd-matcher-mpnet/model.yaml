      Conversational AI System Development: Experience in designing, developing, and deploying conversational AI systems,
      including RAG pipelines, chatbots, virtual assistants, and intelligent agents.

      Python \& Data Proficiency: Proficiency with pandas and numpy. Strong SQL skills for complex data exploration, feature
      engineering, and knowledge preparation.

      End-to-End Modeling \& Deployment Lifecycle: Experience with requirements gathering, experiment design, offline evaluation,
      production deployment, and post-production monitoring/validation of AI and BI solutions.

      MLOps \& CI/CD: Experience building and maintaining CI/CD pipelines (Jenkins, GitHub Actions, or equivalent) for ML
      model deployment. Familiarity with experiment tracking, model registries, and evaluation gates.

      Cloud Platforms \& Infrastructure: Development experience using the AWS and GCP suites of tools. Familiarity with SageMaker,
      Vertex AI, Bedrock, or Azure AI Services. Experience with Infrastructure as Code (CloudFormation, Terraform, or similar).

      Data Pipeline Architecture: Experience with solution design and architecture of data pipelines, including workflow automation
      platforms (Apache Airflow, Autosys, or similar) and big data technologies (Spark, Hive, [Company], BigQuery, or Redshift).

      Core Algorithms \& Architectures: Solid understanding of natural language processing methods and generative AI architectures.

      NLP \& Generative AI Fundamentals: In-depth knowledge of embeddings, hybrid\+dense retrieval, advanced chunking strategies,
