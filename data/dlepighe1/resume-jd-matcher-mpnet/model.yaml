  - 'Sr Data Engineer - GE07BE

    We’re determined to make a difference and are proud to be an insurance company that goes well beyond coverages and policies.
    Working here means having every opportunity to achieve your goals – and to help others accomplish theirs, too. Join our
    team as we help shape the future.


    Overview of Role

    The Sr. Applied Analytics Engineer drives the design, engineering, and delivery of AI-powered analytics solutions within
    [Company]''s Applied Analytics function. This role sits at the intersection of Artificial Intelligence, Business Intelligence,
    and production-grade engineering — building and operationalizing conversational AI agents and agentic analytics workflows.
    Responsible for designing sophisticated AI solutions that enable business users to effortlessly explore complex insurance
    data and derive actionable insights in plain English, while also owning the engineering lifecycle that makes those solutions
    reliable, scalable, and maintainable in production. This position is for a builder who is passionate about transforming
    data exploration, democratizing access to insights, and delivering sustainable, production-ready AI capabilities within
    a dynamic enterprise environment.

    Our Core Values

    We build AI solutions, not models. We are thoughtful in supporting the end-to-end business problem, with an eye to systems
    design.

    We are trusted and transparent. We collaborate tightly with our partners and are mindful of their capacity to absorb change.

    We provide assets that are safe to buy. Our products are delivered with a full monitoring solution to ensure our products
    continue to deliver as expected.

    We will earn the right to influence. With humble confidence, we listen carefully to learn from our customers and become
    partners in problem solving.

    We are practical and evolutional. We first deliver a minimally viable product and over time expand its sophistication
    based on feedback.

    Primary Job Responsibilities

    Design \& Deliver Conversational AI Solutions: Build advanced generative and agentic AI solutions with a strong emphasis
    on conversational interfaces. This includes RAG pipelines, intelligent chat/assistant systems, and autonomous analytics
    workflows — leveraging a fit-for-purpose toolkit from structured retrieval to sophisticated agentic workflows.

    Business Intelligence \& Data Integration: Partner with data engineering and BI teams to ensure AI solutions consume and
    surface accurate, consistent, and interpretable insurance data — creating a unified and business-friendly view for AI
    agents and business intelligence tools.

    End-to-End Solution Engineering \& MLOps: Own the AI solution lifecycle from problem framing through production deployment
    and ongoing operations. This encompasses data preparation, model development, rigorous evaluation, CI/CD pipeline development,
    orchestration, observability, safety filters/guardrails, and comprehensive rollback plans. Design, develop, and maintain
    Models as Service, adopting and promoting MLOps best practices across the analytics engineering team.

    Cloud Infrastructure \& Deployment: Deliver production AI/ML solutions across AWS and GCP cloud environments. Develop
    repeatable architectural patterns using Infrastructure as Code (CloudFormation, Terraform, or similar), containerization
    (Docker, Kubernetes), and cloud-native ML platforms to ensure scalable, secure, and reproducible deployments.

    Required Skills \& Qualifications

    Business Intelligence \& Data Literacy: Strong understanding of BI principles, tools, and data warehouse/data lake environments.
    Ability to work with and interpret complex insurance data structures to support AI-driven analytics.

