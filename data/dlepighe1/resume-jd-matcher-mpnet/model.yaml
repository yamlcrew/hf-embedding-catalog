  - 'Design Systems Designer


    Location: San Francisco, CA


    About the Role

    We are seeking a mid-level Design Systems Designer to join our team and help shape the future of collaborative design.
    In this role, you will work closely with product designers, engineers, and UX researchers to create and maintain a scalable,
    cohesive design system that empowers teams to build consistent and accessible user experiences. Your expertise will ensure
    our design language evolves thoughtfully while maintaining flexibility for diverse product needs. This is a unique opportunity
    to influence the foundation of how design is implemented across a rapidly growing platform used by millions worldwide.


    Responsibilities

    - Develop, maintain, and evolve the core components and patterns of our design system, ensuring consistency, accessibility,
    and scalability across multiple platforms (web, desktop, mobile).

    - Collaborate with product design and engineering teams to align on design principles, component behavior, and usage guidelines.

    - Design and document UI components in [Company], creating clear, comprehensive guidelines and best practices to facilitate
    cross-team adoption.

    - Advocate for accessibility standards (WCAG 2.1 AA) within the design system and partner with engineers to ensure implementation
    fidelity.

    - Conduct audits and usability reviews of existing components to identify areas for improvement and refactoring.

    - Participate in design critiques and workshops to foster a culture of continuous improvement and design excellence.

    - Support the integration of the design system into development workflows, including liaising with frontend engineers
    working in React and TypeScript.

    - Track and analyze usage metrics and feedback to iterate on design system features and documentation.


    Requirements

    - 2-5 years of professional experience in design systems, UI/UX design, or related fields.

    - Proficiency in [Company] as a primary design and prototyping tool, with demonstrated experience building and managing
    component libraries.

    - Strong understanding of design systems principles, atomic design methodology, and scalable UI architecture.

    - Experience collaborating closely with engineering teams, especially frontend developers using React, JavaScript/TypeScript.

    - Solid knowledge of accessibility standards (WCAG 2.1 AA) and inclusive design practices.

    - Excellent visual design skills with attention to detail and a passion for pixel-perfect execution.

    - Strong communication skills to articulate design decisions and collaborate effectively in a cross-functional environment.

    - Familiarity with version control concepts and tools (e.g., Git) as they relate to design and development workflows.


    Nice to Have

    - Experience working in an Agile/Scrum environment.

    - Basic understanding of CSS-in-JS frameworks (e.g., Styled Components, Emotion) or design tokens.

    - Contributions to open-source design system projects or communities.

    - Background in interaction design or motion design principles.

    - Knowledge of user research methods and data-driven design iteration.'
  - 'Position Location: These roles support our Fremont, CA branch location, which serves customers throughout the greater
    San Francisco \& San Jose, CA areas.


    Here at [Company], we take pride in enabling sustainable progress through technology. We do this through empowering customers
    by combining the real and digital worlds. We’re improving how we live, work, and move today and for the next generation!
