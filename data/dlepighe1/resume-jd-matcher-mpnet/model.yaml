    * Develop relationships with customers, contractors, and internal partners

    * Collaborate with operations, estimating, and support teams to ensure successful project delivery and customer satisfaction

    * Stay current on market trends, competitor offerings, and emerging technologies

    * Participate in sales meetings, training programs, and industry networking events

    * Support both existing account growth and new customer acquisition efforts

    * Spend time in customer-facing activities to build experience and confidence in the field


    You will make an impact with these qualifications:


    *Basic/Required Qualifications:*


    * Entry-Level (Sales Executive): 2\+ years of sales experience OR Bachelor’s degree in Engineering with demonstrated interest
    or experience in customer-facing, sales, or business development activities

    * Mid-Level (Sr. Sales Executive): 2\+ years of sales experience in the commercial fire alarm / life safety industry or
    directly related such as low-voltage/electrical

    * Senior-Level (Account Executive): 5\+ years of sales experience in the commercial fire alarm / life safety industry

