      Chương 1.


      QUY


      ĐỊNH CHUNG


      Điều 1. Phạm vi điều


      chỉnh


      Thông tư này quy định:


      1. Hồ sơ, thủ tục và thẩm quyền kiểm tra,


      cấp, thu hồi Giấy chứng nhận cơ sở đủ điều kiện an toàn thực phẩm (sau đây viết


      tắt là Giấy chứng nhận ATTP) đối với cơ sở sản xuất, kinh doanh thực phẩm thủy


      sản có xuất khẩu (sau đây gọi tắt là Cơ sở).


      2. Hồ sơ, thủ tục và thẩm quyền kiểm tra,


      cấp giấy chứng nhận an toàn thực phẩm đối với thực phẩm thủy sản xuất khẩu (sau


      đây gọi là Chứng thư) vào các thị trường mà Cơ quan thẩm quyền nước nhập khẩu


      yêu cầu lô hàng xuất khẩu được kiểm


      tra, cấp Chứng thư của Cục Quản lý Chất lượng Nông lâm sản và Thủy sản.


      Điều 2. Đối tượng áp


      dụng


      1. Đối tượng áp dụng bao gồm:


      a) Cơ sở sản xuất,


      kinh doanh thực phẩm thủy sản có xuất khẩu;


      b) Thực phẩm thủy sản xuất khẩu vào các


      thị trường mà Cơ quan thẩm quyền nước nhập khẩu có yêu cầu lô hàng xuất khẩu được


      kiểm tra, cấp Chứng thư của Cục Quản lý Chất lượng Nông


      lâm sản và Thủy sản.


      2. Đối với các thực phẩm thủy sản xuất khẩu


      có yêu cầu chứng nhận kiểm dịch theo quy định hiện hành, Cơ quan kiểm tra, chứng nhận nêu tại Điều 5 Thông tư này thực
      hiện đồng


      thời việc kiểm tra, chứng nhận an toàn thực phẩm (ATTP)


      và kiểm dịch.


      3. Các trường hợp sau


      đây không thuộc đối tượng áp dụng của Thông tư này:


      a) Cơ sở sản xuất,


      kinh doanh thực phẩm thủy sản chỉ tiêu thụ nội địa.


      b) Thủy sản xuất khẩu không dùng làm thực


      phẩm.


      c) Thực phẩm thủy sản xuất khẩu vào các


      thị trường mà Cơ quan thẩm quyền nước nhập khẩu không yêu cầu lô hàng xuất khẩu


      được kiểm tra, cấp Chứng thư của Cục Quản lý Chất lượng


      Nông lâm sản và Thủy sản.


      Điều 3. Giải thích từ


      ngữ


      Trong Thông tư này, một số từ ngữ được


      hiểu như sau:


      1. Cơ sở sản xuất thực


      phẩm thủy sản độc lập: là Cơ sở có đầy đủ cơ sở vật chất, trang thiết bị để thực


      hiện hoàn chỉnh quy trình sản xuất riêng biệt từ công đoạn tiếp nhận nguyên liệu


      cho đến công đoạn bao gói hoàn chỉnh thành phẩm; có đội ngũ cán bộ quản lý chất


      lượng riêng với ít nhất 03 (ba) nhân viên thực hiện kiểm soát ATTP trong quá


      trình sản xuất và ít nhất 01 (một) nhân viên hoàn thành khóa đào tạo về quản lý


      ATTP theo nguyên tắc Phân tích mối nguy và kiểm soát điểm tới hạn - HACCP (sau


      đây gọi là nguyên tắc HACCP) do cơ quan, tổ chức được Bộ Nông nghiệp và Phát


      triển nông thôn giao chức năng, nhiệm vụ đào tạo quản lý ATTP theo nguyên tắc


      HACCP thực hiện.


      2. Lô hàng sản xuất:


      là một lượng sản phẩm được sản xuất từ một hay nhiều lô nguyên liệu có cùng nguồn


      gốc xuất xứ, theo cùng một quy trình công nghệ, cùng điều kiện sản xuất (có


      cùng các yếu tố tác động đến điều kiện bảo đảm ATTP) trong thời gian không quá


      24 giờ tại một Cơ sở.


      3. Lô hàng xuất


      khẩu: là lượng


      hàng được chủ hàng đăng ký kiểm tra, chứng nhận để xuất khẩu một lần cho một


      nhà nhập khẩu trên một phương tiện vận chuyển.


      4. Nhóm thực phẩm thủy sản tương tự: là những thực


      phẩm thủy sản có cùng mức nguy cơ về ATTP, được sản xuất theo quy trình công


      nghệ cơ bản giống nhau (có thể khác nhau tại một số công đoạn nhưng không phát


      sinh các mối nguy đáng kể về ATTP) tại một Cơ sở.


      5. Sản xuất thực phẩm thủy sản: là việc thực


      hiện một, một số hoặc tất cả các hoạt động khai thác, sơ chế, chế biến, bao


      gói, bảo quản để tạo ra thực phẩm thủy sản.


      6. Thực phẩm thủy sản: là sản phẩm


      thủy sản mà con người ăn, uống ở dạng tươi sống hoặc đã qua sơ chế, chế biến, bảo


      quản.


      7. Thực phẩm thủy sản ăn


      liền:


      là sản phẩm thủy sản có thể sử dụng trực tiếp cho người mà không phải xử lý đặc


      biệt trước khi ăn.


      Điều 4. Căn cứ để kiểm


      tra, thẩm định, chứng nhận


      Căn cứ để kiểm tra,


      thẩm định, cấp Giấy chứng nhận ATTP và Chứng thư cho thực phẩm thủy sản xuất


      khẩu là các quy


      định tại Điều 41, 42 Luật ATTP; các quy định, quy chuẩn kỹ


      thuật của Việt Nam và quy định, quy chuẩn kỹ thuật của nước nhập khẩu về ATTP


      thủy sản.


      Điều 5. Cơ quan kiểm


      tra, chứng nhận


      1. Cơ quan kiểm tra, thẩm định, cấp Giấy


      chứng nhận ATTP: Cục Quản lý Chất lượng Nông lâm sản và Thủy sản, Cơ quan Quản


      lý Chất lượng Nông lâm sản và Thủy sản Trung bộ, Cơ quan Quản lý Chất lượng


      Nông lâm sản và Thủy sản Nam bộ.


      2. Cơ quan kiểm tra, cấp Chứng thư cho lô


      hàng thủy sản xuất khẩu: là các đơn vị thuộc Cục Quản lý Chất lượng Nông lâm sản


      và Thủy sản được Cơ quan thẩm quyền các nước nhập khẩu thủy sản Việt Nam đánh


      giá đủ năng lực thực hiện các hoạt động kiểm tra, cấp Chứng thư cho lô hàng thủy


      sản xuất khẩu.


