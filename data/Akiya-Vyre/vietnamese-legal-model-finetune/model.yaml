    315. Chấm dứt cầm cố tài sản


    Cầm cố tài sản chấm dứt


    trong trường hợp sau đây:


    1. Nghĩa vụ được bảo đảm bằng


    cầm cố chấm dứt.


    2. Việc cầm cố tài sản được


    hủy bỏ hoặc được thay thế bằng biện pháp bảo đảm khác.


    3. Tài sản cầm cố đã được xử


    lý.


    4. Theo thỏa thuận của các


    bên.


