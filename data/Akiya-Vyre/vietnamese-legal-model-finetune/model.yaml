- source_sentence: Khách hàng cần đáp ứng các điều kiện gì để được tổ chức tín dụng, chi nhánh ngân hàng nước ngoài xem xét,
    quyết định cấp bảo lãnh?
  sentences:
  - '

    Chương I


    QUY ĐỊNH CHUNG


    Điều 1. Phạm vi điều chỉnh


    Thông tư này quy định về điều kiện vay nước ngoài của


    bên đi vay không được Chính phủ bảo lãnh.


    Điều 2. Đối tượng áp dụng


    1. Người cư trú là doanh nghiệp, hợp tác xã, liên


    hiệp hợp tác xã, tổ chức tín dụng và chi nhánh ngân hàng nước ngoài được thành


    lập, hoạt động kinh doanh tại Việt Nam là bên đi vay nước ngoài (sau đây gọi


    chung là bên đi vay).


    2. Tổ chức tín dụng, chi nhánh ngân hàng nước ngoài


    tại Việt Nam nơi bên đi vay mở tài khoản vay, trả nợ nước ngoài (sau đây gọi là


    ngân hàng cung ứng dịch vụ tài khoản).


    Điều 3. Giải thích từ ngữ


    Trong Thông tư này, các từ ngữ dưới đây được hiểu


    như sau:


    1. Khoản vay ngắn hạn nước ngoài tự vay, tự trả


    (sau đây gọi là khoản vay ngắn hạn nước ngoài) là khoản vay nước ngoài không được


    Chính phủ bảo lãnh có thời hạn vay đến 01 năm.


    2. Khoản vay trung, dài hạn nước ngoài tự vay, tự


    trả (sau đây gọi là khoản vay trung, dài hạn nước ngoài) là khoản vay nước


    ngoài không được Chính phủ bảo lãnh có thời hạn vay trên 01 năm.


    3. Dự án đầu tư là các dự án được cấp có thẩm quyền


    cấp Giấy chứng nhận đầu tư, Giấy chứng nhận đăng ký đầu tư hoặc văn bản chấp


    thuận chủ trương đầu tư theo quy định của pháp luật về đầu tư và các quy định


    khác của pháp luật có liên quan.


    4. Dự án khác là các dự án không thuộc trường hợp dự


    án đầu tư quy định tại khoản 3 Điều này.


    5. Chi phí vay nước ngoài là tổng mức chi phí quy đổi


    theo tỷ lệ phần trăm hàng năm tính trên giá trị khoản vay, bao gồm lãi suất vay


    nước ngoài và các chi phí khác có liên quan đến khoản vay nước ngoài mà bên đi


    vay chắc chắn phải trả cho bên cho vay, các bên bảo đảm khoản vay, bên bảo hiểm


    khoản vay, các đại lý và các bên liên quan khác.


    6. Cơ cấu lại khoản nợ nước ngoài là việc trả khoản


    nợ nước ngoài hiện hữu từ nguồn vốn vay nước ngoài mới.


    7. Khoản vay nước ngoài bằng đồng Việt Nam là khoản


    vay nước ngoài được rút vốn vào tài khoản vay, trả nợ nước ngoài bằng đồng Việt


    Nam của bên đi vay hoặc nghĩa vụ nợ của khoản vay được xác định bằng đồng Việt


    Nam.


    8. Nghĩa vụ nợ của khoản vay được xác định bằng đồng


    Việt Nam là việc khoản vay được rút vốn bằng ngoại tệ nhưng giá trị nhận nợ


    theo thỏa thuận vay nước ngoài được ghi nhận bằng đồng Việt Nam theo tỷ giá


    mua, bán ngoại tệ được niêm yết bởi tổ chức tín dụng do các bên thỏa thuận.


    Điều 4. Áp dụng quy định pháp


    luật liên quan


    1. Bên đi vay vay nước ngoài dưới hình thức phát


    hành trái phiếu quốc tế ngoài việc đáp ứng điều kiện vay quy định tại Thông tư


    này, phải tuân thủ quy định của pháp luật về chào bán trái phiếu doanh nghiệp


    ra thị trường quốc tế và các quy định khác của pháp luật có liên quan.


    2. Bên đi vay là doanh nghiệp nhà nước ngoài việc


    đáp ứng điều kiện vay quy định tại Thông tư này, phải tuân thủ quy định của


    pháp luật về quản lý, sử dụng vốn nhà nước đầu tư vào sản xuất, kinh doanh tại


    doanh nghiệp và các quy định khác của pháp luật có liên quan.


    Điều 5. Khoản vay nước ngoài dưới


    hình thức nhập khẩu hàng hóa trả chậm


    1. Bên đi vay vay nước ngoài dưới hình thức nhập khẩu


    hàng hóa trả chậm không phải tuân thủ các điều kiện vay nước ngoài quy định tại


    Thông tư này.


    2. Bên đi vay nước ngoài dưới hình thức nhập khẩu


    hàng hóa trả chậm chịu trách nhiệm tuân thủ quy định hướng dẫn về quản lý ngoại


    hối đối với việc vay, trả nợ nước ngoài của doanh nghiệp, các quy định của pháp


    luật về thương mại, quản lý ngoại thương và các quy định khác của pháp luật có


    liên quan.


    Điều 6. Nguyên tắc sử dụng vốn


    vay nước ngoài


    1. Bên đi vay chịu trách nhiệm toàn diện trong việc


    sử dụng vốn vay nước ngoài đúng mục đích hợp pháp quy định tại Thông tư này.


    2. Trường hợp khoản vay đã được rút vốn nhưng tạm


    thời chưa sử dụng cho các mục đích vay nước ngoài hợp pháp quy định tại Thông


    tư này, bên đi vay có thể sử dụng nguồn tiền này để gửi tiền tại các tổ chức


    tín dụng, chi nhánh ngân hàng nước ngoài hoạt động tại Việt Nam. Kỳ hạn của mỗi


    khoản tiền gửi tối đa không quá 01 tháng.

    '
  - '

    Chương II


    QUY ĐỊNH CỤ THỂ


    Điều 10.


    Phạm vi bảo lãnh


    Bên bảo lãnh có thể cam kết bảo


    lãnh một phần hoặc toàn bộ nghĩa vụ tài chính mà bên được bảo lãnh có nghĩa vụ


    thực hiện với bên nhận bảo lãnh.


    Điều 11.


    Yêu cầu đối với khách hàng


    1. Tổ chức tín dụng, chi nhánh


    ngân hàng nước ngoài xem xét, quyết định cấp bảo lãnh, bảo lãnh đối ứng, xác nhận


    bảo lãnh cho khách hàng khi khách hàng đáp ứng các yêu cầu sau đây:


    a) Có đầy đủ năng lực pháp luật


    dân sự, năng lực hành vi dân sự theo quy định của pháp luật;


    b) Nghĩa vụ được bảo lãnh là


    nghĩa vụ tài chính hợp pháp;


    c) Được tổ chức tín dụng, chi


    nhánh ngân hàng nước ngoài cấp bảo lãnh đánh giá có khả năng hoàn trả lại số tiền


    mà tổ chức tín dụng, chi nhánh ngân hàng nước ngoài phải trả thay khi thực hiện


    nghĩa vụ bảo lãnh.


    2. Tổ chức tín dụng, chi nhánh


    ngân hàng nước ngoài không được bảo lãnh cho nghĩa vụ thanh toán trái phiếu của


    các doanh nghiệp phát hành với mục đích: cơ cấu lại các khoản nợ của chính doanh


    nghiệp phát hành; góp vốn, mua cổ phần tại doanh nghiệp khác và tăng


    quy mô vốn hoạt động.


    Điều 12.


    Bảo lãnh đối với khách hàng là người không cư trú


    1. Tổ chức tín dụng, chi nhánh


    ngân hàng nước ngoài chỉ được bảo lãnh cho khách hàng tổ chức là người không cư


    trú và phải đáp ứng một trong những yêu cầu sau (khách hàng là tổ chức tín dụng


    ở nước ngoài không phải đáp ứng yêu cầu này):


    a) Khách hàng là doanh nghiệp


    thành lập và hoạt động tại nước ngoài có vốn góp của doanh nghiệp Việt Nam dưới


    hình thức đầu tư quy định tại điểm a, c khoản 1 Điều 52 Luật Đầu


    tư hoặc dưới hình thức đầu tư khác quy định tại điểm đ khoản


    1 Điều 52 Luật Đầu tư;


    b) Khách hàng ký quỹ đủ 100% giá


    trị bảo lãnh hoặc có bảo đảm đủ 100% giá trị bảo lãnh bằng tài sản của khách


    hàng gồm số dư tiền gửi tại chính tổ chức tín dụng, chi nhánh ngân hàng nước


    ngoài bảo lãnh và chứng chỉ tiền gửi của chính tổ chức tín dụng, chi nhánh ngân


    hàng nước ngoài bảo lãnh;


    c) Bên nhận bảo lãnh là người cư


    trú.


    2. Chi nhánh ngân hàng nước


    ngoài không được bảo lãnh bằng ngoại tệ đối với khách hàng tổ chức là người


    không cư trú, trừ trường hợp bảo lãnh trên cơ sở bảo lãnh đối ứng của tổ chức


    tín dụng ở nước ngoài hoặc xác nhận bảo lãnh cho nghĩa vụ bảo lãnh của tổ chức


    tín dụng ở nước ngoài mà bên nhận bảo lãnh là người cư trú.


    3. Tổ chức tín dụng, chi nhánh


    ngân hàng nước ngoài khi thực hiện bảo lãnh bằng ngoại tệ cho khách hàng là người


    không cư trú phải:


    a) Tuân thủ quy định pháp luật về


    hướng dẫn một số nội dung về quản lý ngoại hối đối với việc cho vay ra nước


    ngoài và thu hồi nợ bảo lãnh cho người không cư trú;


    b) Có quy trình đánh giá, quản


    lý rủi ro tín dụng, trong đó có rủi ro trong bảo lãnh đối với người không cư


    trú.


    4. Ngoài các quy định tại Điều


    này, các nội dung khác về việc bảo lãnh đối với khách hàng là người không cư


    trú phải thực hiện theo quy định tương ứng tại Thông tư này.


    Điều 13. Bảo


    lãnh nhà ở hình thành trong tương lai


    1. Ngân hàng


    thương mại có đủ năng lực thực hiện bảo lãnh nhà ở hình thành trong tương lai


    khi:


    a) Trong giấy phép


    thành lập và hoạt động hoặc tại văn bản sửa đổi, bổ sung giấy phép thành lập và


    hoạt động của ngân hàng thương mại có quy định nội dung hoạt động bảo


    lãnh ngân hàng;


    b) Không bị cấm, hạn


    chế, đình chỉ, tạm đình chỉ thực hiện bảo lãnh nhà ở hình thành trong tương


    lai.


    2. Ngân hàng Nhà


    nước công bố công khai danh sách ngân hàng thương mại có đủ năng lực thực hiện


    bảo lãnh nhà ở hình thành trong tương lai trong từng thời kỳ trên Cổng thông


    tin điện tử của Ngân hàng Nhà nước.


    3. Ngân hàng


    thương mại xem xét, quyết định cấp bảo lãnh cho chủ đầu tư khi:


    a) Chủ đầu tư đáp ứng


    đủ các yêu cầu quy định tại Điều 11


    Thông tư này (trừ trường hợp ngân hàng


    thương mại bảo lãnh cho chủ đầu tư trên cơ sở bảo lãnh đối ứng);


    b) Dự án của chủ đầu tư đáp ứng


    đủ các điều kiện của bất động sản hình thành trong tương


    lai được đưa vào kinh doanh theo quy định tại Điều 55 Luật Kinh doanh bất động sản và quy định của pháp luật


    có liên quan.


    4. Trình tự thực hiện bảo lãnh nhà ở hình thành


    trong tương lai:


    a) Căn cứ đề nghị


    của chủ đầu tư hoặc bên bảo lãnh đối ứng, ngân hàng thương mại xem xét, thẩm định


    và quyết định cấp bảo lãnh cho chủ đầu tư;


    b) Ngân hàng


    thương mại và chủ đầu tư ký hợp đồng bảo lãnh nhà ở hình


    thành trong tương lai theo quy định tại Điều 56 Luật Kinh


    doanh bất động sản và quy định tại khoản 13 Điều 3, Điều 15 Thông tư này;


    c) Sau khi ký hợp


    đồng mua, thuê mua nhà ở, trong đó có quy định nghĩa vụ tài chính của chủ đầu


    tư, chủ đầu tư gửi hợp đồng mua, thuê mua nhà ở cho ngân hàng thương mại để đề


    nghị ngân hàng thương mại phát hành thư bảo lãnh cho bên mua;


    d) Ngân hàng


    thương mại căn cứ hợp đồng mua, thuê mua nhà ở và hợp đồng bảo lãnh nhà ở hình thành trong tương lai để phát hành thư
    bảo lãnh và gửi cho từng


    bên mua hoặc gửi chủ đầu tư để cung cấp thư bảo lãnh cho bên mua theo thỏa thuận.

    '
