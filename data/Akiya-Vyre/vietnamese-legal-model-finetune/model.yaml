      ĐỔI, BỔ SUNG MỘT SỐ ĐIỀU CỦA NGHỊ ĐỊNH SỐ 10/2015/NĐ-CP NGÀY 28 THÁNG 01 NĂM


      2015 CỦA CHÍNH PHỦ QUY ĐỊNH VỀ SINH CON BẰNG KỸ THUẬT THỤ TINH TRONG ỐNG NGHIỆM


      VÀ ĐIỀU KIỆN MANG THAI HỘ VÌ MỤC ĐÍCH NHÂN ĐẠO


      Căn cứ Luật tổ chức


      Chính phủ ngày 19 tháng 6 năm 2015;


      Căn cứ Luật khám bệnh,


      chữa bệnh ngày 23 tháng 11 năm 2009;


      Căn cứ Luật hôn


      nhân và gia đình ngày 19 tháng 6 năm 2014;


      Căn cứ Luật đầu tư


      ngày 23 tháng 12 năm 2014;


      Theo đề nghị của Bộ trưởng Bộ Y tế;


      Chính phủ ban hành Nghị định sửa đổi, bổ sung một


      số điều của Nghị định số 10/2015/NĐ-CP ngày


      28 tháng 01 năm 2015 của Chính phủ quy định về sinh con bằng kỹ thuật thụ tinh


      trong ống nghiệm và điều kiện mang thai hộ vì mục đích nhân đạo.


      Điều 1. Sửa đổi, bổ sung một số


      điều của Nghị định số 10/2015/NĐ-CP


      ngày 28 tháng 01 năm 2015 của Chính phủ quy định về sinh


      con bằng kỹ thuật thụ tinh trong ống nghiệm và điều kiện mang thai hộ vì mục


      đích nhân đạo (sau đây gọi tắt là Nghị định số 10/2015/NĐ-CP)


      1. Sửa đổi, bổ sung khoản 2 Điều 7 Nghị định số 10/2015/NĐ-CP như sau:


      “2. Cơ sở vật chất, trang thiết bị y tế và nhân sự


      để thực hiện kỹ thuật thụ tinh trong ống nghiệm bao gồm:


      a) Cơ sở vật chất:


      - Có phòng hồi sức cấp cứu;


      - Có phòng xét nghiệm nội tiết sinh sản có thể cung


      cấp kết quả trong ngày;


      - Có đơn nguyên riêng cho việc thực hiện kỹ thuật


      thụ tinh trong ống nghiệm diện tích tối thiểu là 500 m2 (kể cả lối


      đi) và các phòng: Tiếp đón bệnh nhân; khám nam, nữ; chọc hút noãn; lấy tinh


      trùng; lab nuôi cấy; siêu âm; xét nghiệm và lọc rửa tinh trùng đáp ứng các tiêu


      chuẩn theo khuyến cáo của Tổ chức Y tế thế giới.


      b) Trang thiết bị y tế:


      Có tối thiểu các trang thiết bị y tế: 02 tủ cấy CO2;


      03 tủ ấm; 01 bình trữ tinh trùng; 01 máy ly tâm; 01 tủ sấy; 01 bình trữ phôi


      đông lạnh; 02 máy siêu âm có đầu dò âm đạo; 01 kính hiển vi đảo ngược; 02 kính


      hiển vi soi nổi; 02 bộ tủ thao tác.


      c) Nhân sự:


      Người trực tiếp thực hiện kỹ thuật thụ tinh trong ống


      nghiệm phải đáp ứng các yêu cầu sau đây:


      - Có chứng chỉ hành nghề theo quy định của Luật khám bệnh, chữa bệnh;


      - Có văn bằng hoặc chứng chỉ hoặc chứng nhận đã được


      đào tạo về kỹ thuật thụ tinh trong ống nghiệm do cơ sở đào tạo trong nước hoặc


      nước ngoài cấp;


      - Có xác nhận đã thực hành ít nhất 20 chu kỳ điều


      trị vô sinh bằng kỹ thuật thụ tinh trong ống nghiệm của cơ sở đã được Bộ Y tế


      công nhận đủ điều kiện thực hiện kỹ thuật thụ tinh trong ống nghiệm.”


      2. Sửa đổi điểm


      c khoản 1 Điều 9 Nghị định số 10/2015/NĐ-CP như sau:


      “c) Bản sao hợp pháp văn bằng hoặc chứng chỉ hoặc


      chứng nhận đã được đào tạo về kỹ thuật thụ tinh trong ống nghiệm do cơ sở đào tạo


      trong nước hoặc nước ngoài cấp.”


      3. Sửa đổi, bổ sung Điều 13 Nghị định số 10/2015/NĐ-CP như


      sau:


      "Điều 13. Cơ sở khám bệnh, chữa bệnh được


      phép thực hiện kỹ thuật mang thai hộ vì mục đích nhân đạo


      1. Điều kiện cơ sở khám bệnh, chữa bệnh được phép


      thực hiện kỹ thuật mang thai hộ vì mục đích nhân đạo:


      a) Có ít nhất 02 năm kinh nghiệm thực hiện kỹ thuật


      thụ tinh trong ống nghiệm, kể từ ngày được Bộ Y tế cho phép thực hiện kỹ thuật


      này;


      b) Tổng số chu kỳ thụ tinh trong ống nghiệm tối thiểu


      là 1.000 chu kỳ mỗi năm trong 02 năm.


      2. Hồ sơ, thủ tục đề nghị công nhận cơ sở được thực


      hiện kỹ thuật mang thai hộ vì mục đích nhân đạo


      a) Hồ sơ đề nghị công nhận cơ sở được thực hiện kỹ


      thuật mang thai hộ vì mục đích nhân đạo, gồm:


      - Công văn đề nghị Bộ Y tế công nhận cơ sở được thực


      hiện kỹ thuật mang thai hộ vì mục đích nhân đạo theo Mẫu


      số 3a tại Phụ lục ban hành kèm theo Nghị định này.


      - Tài liệu chứng minh đã thực hiện tổng số chu kỳ


      thụ tinh trong ống nghiệm tối thiểu là 1.000 chu kỳ mỗi năm trong 02 năm.


      b) Hồ sơ đề nghị công nhận cơ sở được thực hiện kỹ


      thuật mang thai hộ vì mục đích nhân đạo lập thành 01 bộ và gửi trực tiếp hoặc gửi


      qua đường bưu điện về Bộ Y tế.


      c) Trong thời hạn 05 ngày làm việc, kể từ ngày nhận


      đủ hồ sơ, Bộ Y tế phải xem xét hồ sơ và ra quyết định công nhận cơ sở được thực


      hiện kỹ thuật mang thai hộ vì mục đích nhân đạo. Trường hợp hồ sơ chưa hợp lệ,


      Bộ Y tế phải có văn bản thông báo, nêu rõ lý do gửi cơ sở đề nghị được thực hiện


      kỹ thuật mang thai hộ vì mục đích nhân đạo để hoàn chỉnh hồ sơ.


      3. Bệnh viện Phụ sản trung ương, Bệnh viện Đa khoa


      trung ương Huế, Bệnh viện Từ Dũ thành phố Hồ Chí Minh đang thực hiện kỹ thuật


      mang thai hộ vì mục đích nhân đạo theo quy định tại khoản 2 Điều


      13 Nghị định số 10/2015/NĐ-CP ngày 28 tháng 01 năm 2015 của Chính phủ quy định


      về sinh con bằng kỹ thuật thụ tinh trong ống nghiệm và điều kiện mang thai hộ


      vì mục đích nhân đạo không phải thực hiện theo quy định tại khoản 2 Điều này.”


      Điều 2. Hiệu lực thi hành


      1. Nghị định này có hiệu lực thi hành từ ngày 01


      tháng 7 năm 2016.


      2. Khoản 2 Điều 7; điểm c khoản 1

      '
