    đăng ký, lưu ký, bù trừ và thanh toán chứng khoán


    1. Phạt tiền từ 50.000.000 đồng


    đến 70.000.000 đồng đối với Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam,


