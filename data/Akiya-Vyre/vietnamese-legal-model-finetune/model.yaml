    tố cáo;


    d) Yêu cầu cơ quan, tổ chức, cá nhân có thẩm


    quyền bảo vệ khi bị đe doạ, trù dập, trả thù.


    2. Người tố cáo có nghĩa vụ sau đây:


    a) Trình bày trung thực về nội dung tố cáo;


    b) Nêu rõ họ, tên, địa chỉ của mình;


