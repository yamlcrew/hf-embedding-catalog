    Chương I


    NHỮNG QUY ĐỊNH CHUNG


    Điều 1. Phạm vi điều chỉnh và


    đối tượng áp dụng


    1. Phạm vi điều chỉnh


    Văn bản này quy định nguyên tắc, tiêu chí, nội


    dung, thẩm quyền, trình tự, thủ tục, thời điểm đánh giá, xếp loại chất lượng


    hàng năm đối với công chức, viên chức và người lao động của các Vụ, đơn vị thuộc


    Ủy ban Dân tộc.


    2. Đối tượng áp dụng


    Công chức, viên chức giữ chức vụ lãnh đạo, quản lý;


    công chức, viên chức, người lao động (Hợp đồng lao động theo Nghị định


    68/2000/NĐ-CP của Chính phủ) của các Vụ, đơn vị thuộc Ủy ban Dân tộc.


    Điều 2. Nguyên tắc đánh giá


    và phân loại công chức, viên chức


    1. Bảo đảm khách quan, công bằng, chính xác; không


    nể nang, trù dập, thiên vị, hình thức; bảo đảm đúng thẩm quyền quản lý, đánh


    giá công chức, viên chức.


    2. Việc đánh giá, xếp loại chất lượng phải căn cứ


    vào chức trách, nhiệm vụ được giao và kết quả thực hiện nhiệm vụ, thể hiện


    thông qua công việc, sản phẩm cụ thể; đối với công chức, viên chức lãnh đạo, quản


    lý phải gắn với kết quả thực hiện nhiệm vụ của cơ quan, tổ chức, đơn vị được


    giao quản lý, phụ trách.


    3. Công chức, viên chức có thời gian công tác trong


    năm chưa đủ 06 tháng thì không thực hiện việc đánh giá, xếp loại chất lượng


    nhưng vẫn phải kiểm điểm thời gian công tác trong năm, trừ trường hợp nghỉ chế


    độ thai sản.


    Công chức, viên chức nghỉ không tham gia công tác


    theo quy định của pháp luật trong năm từ 03 tháng đến dưới 06 tháng thì vẫn thực


    hiện đánh giá nhưng không xếp loại chất lượng ở mức hoàn thành tốt nhiệm vụ trở


    lên.


    Công chức, viên chức nghỉ chế độ thai sản theo quy


    định của pháp luật thì kết quả xếp loại chất lượng trong năm là kết quả xếp loại


    chất lượng của thời gian làm việc thực tế của năm đó.


    4. Kết quả đánh giá, xếp loại chất lượng công chức,


    viên chức theo quy định tại Quy định này được sử dụng làm cơ sở để liên thông


    trong đánh giá, xếp loại chất lượng đảng viên.


    Điều 3. Tiêu chí chung về


    đánh giá, xếp loại chất lượng công chức, viên chức


    1. Chính trị tư tưởng


    a) Chấp hành chủ trương, đường lối, quy định của Đảng,


    chính sách, pháp luật của Nhà nước và các nguyên tắc tổ chức, kỷ luật của Đảng,


    nhất là nguyên tắc tập trung dân chủ, tự phê bình và phê bình;


    b) Có quan điểm, bản lĩnh chính trị vững vàng; kiên


    định lập trường; không dao động trước mọi khó khăn, thách thức;


    c) Đặt lợi ích của Đảng, quốc gia - dân tộc, nhân


    dân, tập thể lên trên lợi ích cá nhân;


    d) Có ý thức nghiên cứu, học tập, vận dụng chủ


    nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh, nghị quyết, chỉ thị, quyết định và các


    văn bản của Đảng.


    2. Đạo đức, lối sống


    a) Không tham ô, tham nhũng, tiêu cực, lãng phí,


    quan liêu, cơ hội, vụ lợi, hách dịch, cửa quyền; không có biểu hiện suy thoái về


    đạo đức, lối sống, tự diễn biến, tự chuyển hóa;


    b) Có lối sống trung thực, khiêm tốn, chân thành,


    trong sáng, giản dị;


    c) Có tinh thần đoàn kết, xây dựng cơ quan, tổ chức,


    đơn vị trong sạch, vững mạnh;


    d) Không để người thân, người quen lợi dụng chức vụ,


    quyền hạn của mình để trục lợi.


    3. Tác phong, lề lối làm việc


    a) Có trách nhiệm với công việc; năng


    động, sáng tạo, dám nghĩ, dám làm, linh hoạt trong thực hiện nhiệm vụ;


    b) Phương pháp làm việc khoa học, dân


    chủ, đúng nguyên tắc;


    c) Có tinh thần trách nhiệm và phối hợp


    trong thực hiện nhiệm vụ;


    d) Có thái độ đúng mực và phong cách ứng


    xử, lề lối làm việc chuẩn mực, đáp ứng yêu cầu của văn hóa công vụ.


    4. Ý thức tổ chức kỷ luật


    a) Chấp hành sự phân công của tổ chức;


    b) Thực hiện các quy định, quy chế, nội


    quy của đơn vị nơi công tác;


    c) Thực hiện việc kê khai và công


    khai tài sản, thu nhập theo quy định;


    d) Báo cáo đầy đủ, trung thực, cung cấp


    thông tin chính xác, khách quan về những nội dung liên quan đến việc thực hiện


    chức trách, nhiệm vụ được giao và hoạt động của đơn vị với cấp trên khi được


    yêu cầu.


    5. Kết quả thực hiện chức trách, nhiệm


    vụ được giao


    a) Đối với công chức, viên chức lãnh


