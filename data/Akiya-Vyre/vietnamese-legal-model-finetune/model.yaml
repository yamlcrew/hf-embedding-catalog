      Chương I


      NHỮNG


      QUY ĐỊNH CHUNG


      Điều 1. Phạm vi điều


      chỉnh


      Thông tư này quy định chi tiết một số điều


      của Luật hộ tịch và Nghị định số 123/2015/NĐ-CP ngày 15 tháng 11 năm 2015 của


      Chính phủ quy định chi tiết một số điều và biện pháp thi hành Luật hộ tịch (sau đây gọi là Nghị định số 123/2015/NĐ-CP)
      về việc ủy quyền đăng ký hộ


      tịch; việc tiếp nhận hồ sơ, trả kết quả đăng ký hộ tịch; trình tự, thủ tục đăng


      ký khai sinh, kết hôn, khai tử, nhận cha, mẹ, con và một số việc hộ tịch khác;


      việc đăng ký khai sinh, kết hôn, khai tử lưu động; ban hành, hướng dẫn sử dụng,


      quản lý Sổ hộ tịch, giấy tờ hộ tịch.


      Điều 2. Việc ủy quyền


      đăng ký hộ tịch


      1. Người yêu cầu cấp bản sao trích lục hộ


      tịch, cấp Giấy xác nhận tình trạng hôn nhân,


      yêu cầu đăng ký các việc hộ tịch theo quy định tại Điều 3 Luật


      hộ tịch (sau đây gọi là yêu cầu đăng ký hộ tịch) được uỷ quyền cho người


      khác thực hiện thay; trừ trường hợp đăng ký kết hôn, đăng ký lại việc kết hôn,


      đăng ký nhận cha, mẹ, con thì không được ủy quyền cho người khác thực hiện,


      nhưng một bên có thể trực tiếp nộp hồ sơ tại cơ quan đăng ký hộ tịch có thẩm


      quyền, không phải có văn bản ủy quyền của bên còn lại.


      Việc ủy quyền phải lập thành văn bản, được


      chứng thực theo quy định của pháp luật. Trường hợp người được ủy quyền là ông,


      bà, cha, mẹ, con, vợ, chồng, anh, chị, em ruột của người ủy quyền thì văn bản


      ủy quyền không phải chứng thực.


      2. Trường hợp người đi đăng ký khai sinh cho


      trẻ em là ông, bà, người thân thích khác theo quy định tại khoản


      1 Điều 15 Luật hộ tịch thì không phải có văn bản ủy quyền của cha, mẹ trẻ


      em, nhưng phải thống nhất với cha, mẹ trẻ em về các nội dung khai sinh.


      Điều 3. Tiếp nhận hồ


      sơ và trả kết quả đăng ký hộ tịch


      1. Người tiếp nhận hồ


      sơ có trách nhiệm kiểm tra toàn bộ hồ sơ; nếu hồ sơ chưa đầy đủ, hoàn thiện thì


      hướng dẫn ngay để người nộp hồ sơ bổ sung, hoàn thiện theo quy định.


      Trường hợp không thể bổ sung, hoàn thiện hồ


      sơ ngay thì người tiếp nhận phải lập văn bản hướng dẫn, trong đó nêu rõ loại giấy


      tờ, nội dung cần bổ sung, hoàn thiện, ký, ghi rõ họ, tên của người tiếp nhận.


      2. Người tiếp nhận có trách nhiệm tiếp nhận


      đúng, đủ hồ sơ đăng ký hộ tịch theo quy định của pháp luật hộ tịch, không được


      yêu cầu người đăng ký hộ tịch nộp thêm giấy tờ mà pháp luật hộ tịch không quy


      định phải nộp.


      3. Người yêu cầu đăng ký hộ tịch có thể nộp


      bản sao được chứng thực từ bản chính hoặc bản sao được cấp từ sổ gốc (sau đây


      gọi là bản sao) hoặc bản chụp kèm theo bản chính giấy tờ để đối chiếu. Trường


      hợp người yêu cầu nộp bản chụp kèm theo bản chính giấy tờ thì người tiếp nhận


      có trách nhiệm kiểm tra, đối chiếu bản chụp với bản chính và ký xác nhận, không


      được yêu cầu nộp bản sao giấy tờ đó.


      Đối với giấy tờ xuất trình khi đăng ký hộ


      tịch, người tiếp nhận có trách nhiệm kiểm tra, đối chiếu với thông tin trong tờ


      khai, chụp lại hoặc ghi lại thông tin để lưu trong hồ sơ và trả lại cho người


      xuất trình, không được yêu cầu nộp bản sao hoặc bản chụp giấy tờ đó.


      4. Khi trả kết quả đăng ký hộ tịch, người trả


      kết quả có trách nhiệm hướng dẫn người yêu cầu đăng ký hộ tịch kiểm tra nội


      dung giấy tờ hộ tịch và Sổ hộ tịch.


      Nếu người yêu cầu đăng ký hộ tịch thấy nội


      dung đúng, phù hợp với hồ sơ đăng ký hộ tịch thì ký, ghi rõ họ, tên trong Sổ hộ


      tịch theo hướng dẫn của người trả kết quả.


      5. Khi trả kết quả đăng ký kết hôn, đăng ký


      lại kết hôn, cả hai bên nam, nữ phải có mặt; khi trả kết quả đăng ký nhận cha,


      mẹ, con, cả bên nhận và bên được nhận là cha, mẹ, con đều phải có mặt.


      Điều 4. Giải quyết


      yêu cầu đăng ký hộ tịch khi không nhận được kết quả xác minh


      Trường hợp việc đăng ký hộ tịch cần xác minh


      theo quy định tại khoản 4 Điều 22, khoản 2 Điều 26, khoản 2 Điều


      27 Nghị định số 123/2015/NĐ-CP và khoản 4 Điều 9, khoản 1 Điều 12 Thông tư này, sau thời hạn 20 ngày kể từ ngày


      gửi văn bản yêu cầu xác minh mà không nhận được văn bản trả lời, thì cơ quan


      đăng ký hộ tịch tiếp tục giải quyết hồ sơ theo quy định. Đối với trường hợp xác


      minh về tình trạng hôn nhân thì cho phép người yêu cầu cấp Giấy xác nhận tình trạng hôn nhân có văn bản


      cam đoan về tình trạng hôn nhân của mình theo quy định tại Điều


      5 Thông tư này.


      Điều 5.


      Trách nhiệm, hệ quả của việc cam đoan không đúng sự thật


      1. Trường hợp cho phép người yêu


      cầu đăng ký hộ tịch lập văn bản cam đoan về nội dung yêu cầu đăng ký hộ tịch


      thì cơ quan đăng ký hộ tịch phải giải thích rõ cho người lập văn bản cam đoan


      về trách nhiệm, hệ quả pháp lý của việc cam đoan không đúng sự thật.


      2. Cơ quan đăng ký hộ tịch từ


      chối giải quyết hoặc đề nghị cơ quan có thẩm quyền hủy bỏ kết quả đăng ký hộ


      tịch, nếu có cơ sở xác định nội dung cam đoan không đúng sự thật.

