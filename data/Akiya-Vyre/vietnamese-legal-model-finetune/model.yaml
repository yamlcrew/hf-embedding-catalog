    NHỮNG QUY ĐỊNH CHUNG


    Điều 1. Phạm vi điều chỉnh và đối


    tượng áp dụng


    1. Nghị định này quy định về việc cho và nhận tinh


    trùng, cho và nhận noãn, cho và nhận phôi; thẩm quyền, thủ tục cho phép cơ sở


