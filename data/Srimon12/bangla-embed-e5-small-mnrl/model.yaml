    - 'মানালি, হিমাচল প্রদেশ

      মানালি পরিচিত তার উজ্জ্বল গুম্ফা আর বৌদ্ধ মঠগুলোর জন্য. গোটা কুলু উপত্যকার মধ্যে এখানেই তিব্বতী উদ্বাস্তুদের উপর সবচেয়ে
      বেশি মনোযোগ দেওয়া হয়. 1969 সালে স্থাপিত এখানের বিখ্যাত গাধন থেকছোক্লিং গুম্ফা. এই মঠের রক্সবেক্ষণ স্থানীয় সম্প্রদায়ের
      আর্থিক সাহায্যে এবং মঠের কর্মশালায় প্রস্তুত হাতে বোনা কার্পেট বিক্রী থেকে অর্জিত আয় মারফত.আকারে একটু ছোট আরও আধুনিক
      হিমালয়ান নিইংগাম্পা গুম্ফা, বাজার সন্নিকট এক সূর্যমুখী ফুলের বাগানে.'
    - 'ললিতপুর জেলা

      ললিতপুর জেলা ( , হচ্ছে নেপালের মধ্যমাঞ্চল বিকাস ক্ষেত্রের বাগমতী অঞ্চলের ৭৫টি জেলার একটি জেলা। পাটান হচ্ছে এই জেলার
      সদরদপ্তর। এই জেলার আয়তন ।। ২০০১ সালের আদমশুমারি অনুসারে এ জেলার লোকসংখ্যা ৩৩৭,৭৮৫ জন। কাঠমান্ডু এবং ভকতপুরের সাথে এটিও
      কাঠমান্ডু উপত্যকার তিনটি জেলার একটি। ২০১১ সালের আদমশুমারি অনুসারে লোকসংখ্যা ৪৬৬,৭৮৪ জন।'
    - 'লুধিয়ানা জেলা

      শতদ্রু ও তার উপনদী বুদ্ধ নালা, জেলার প্রধান জলধারা বৈশিষ্ট্য (হাইড্রোগ্রাফিক বৈশিষ্ট্য) গঠন করে। এইগুলির একটি সংক্ষিপ্ত
      বিবরণ নিম্নরূপ।

      ২০১১ সালের আদমশুমারী অনুযায়ী লুধিয়ানা জেলার জনসংখ্যা ৩৪৯৮৭৩৯ জন যা মোটামুটিভাবে পানামার জনসংখ্যার সমান বা যুক্তরাষ্ট্রের
      কানেকটিকাট রাজ্যের  জনসংখ্যার সমান। জনসংখ্যার হিসাবে জেলাটি ভারতে ৮৭ তম স্থান পেয়েছে (মোট ৬৪০ টির মধ্যে)। জেলার জনসংখ্যা
      ঘনত্ব হল । ২০০১-২০১১ সালের মধ্যে জেলাটির জনসংখ্যা বৃদ্ধির হার ছিল ১৫ শতাংশ। লুধিয়ানা জেলার লিঙ্গ অনুপাত হল ১,০০০ জন
      পুরুষ প্রতি ৮৭৩ জন নারী এবং শিক্ষার হার ৮২.২ শতাংশ। জেলার শ্রমিকদের সংখ্যা ১২.৮৫ লাখ, যার অর্থ জেলার মোট জনসংখ্যার ৩৬.৭
      শতাংশ মানুষ কর্মক্ষম অংশগ্রহণ। জেলার মোট কর্মী বাহিনীর মধ্যে, ১৮.৭% কৃষি খাতে নিযুক্ত, ৫.৬% গৃহস্থালি শিল্পে কাজ করছে
      এবং বাকি অন্যান্য খাতে/শিল্পে নিয়োজিত রয়েছে।'
    - 'চেন্নাই

      চেন্নাইয়ের অধিবাসিকে বলা হয় "চেন্নাই-আইট্‌স্‌"। ২০০১ সালে, চেন্নাই শহরের জনসংখ্যা ৪.২ মিলিয়ন ছিল, যখন মোট মেট্রোপলিটান
      জনসংখ্যা ৬.৪ মিলিয়ন ছিল। মেট্রোপলিটান জনসংখ্যা ২০০৬-এ ৭.০ মিলিয়ন ছিল।'
    - 'ময়নাগুড়ি

      ভারতের ২০০১ সালের আদমশুমারি অনুসারে ময়নাগুড়ি শহরের জনসংখ্যা হল ২৭,০৮৬ জন। এর মধ্যে পুরুষ ৫১%, এবং নারী ৪৯%।'
    - 'পান্ডনা

      ভারতের ২০০১ সালের আদমশুমারি অনুসারে পান্ডনা শহরের জনসংখ্যা হল ১০,৯৯৯ জন। এর মধ্যে পুরুষ ৫৩%, এবং নারী ৪৭%।'
    - 'মেট্রো ম্যানিলা

      মেট্রোপলিটান ম্যানিলা (), সাধারণত মেট্রো ম্যানিলা বা কেবলমাত্র ম্যানিলা নামে পরিচিত, এটি ফিলিপাইনের রাজধানী শহর ম্যানিলার
      আশেপাশের শহরটির অফিসিয়াল ও প্রশাসনিক সংজ্ঞা।এটি ফিলিপাইনের রাজধানী অঞ্চল, সরকারের সীট, এবং দেশের দ্বিতীয় বৃহত্তম জনবহুল
      এবং সবচেয়ে ঘনবসতিপূর্ণ অঞ্চল।আনুষ্ঠানিক ভাবে জাতীয় রাজধানী অঞ্চল (এনসিআর) নামেও পরিচিত, এটি ম্যানিলা শহরের শহর, কুইজোন
      সিটি, দেশের সবচেয়ে জনবহুল শহর, এবং কলোওকান, লাস পাইনাস, মাকাটি, মালাবন, ম্যান্ডালুয়ং, মারিকিনা, মুন্টিনিলুপা, নবতো
      পেরাকাক, পাসে, পাসিগ, সান জুয়ান, টেগুগ, এবং ভ্যালেনজেল্লা, এছারাও একমাত্র অবশিষ্ট প্যাটোসের পৌরসভার অন্তর্ভুক্ত।'
    - 'লাখাই উপজেলা

      গ. ইউনিয়ন ভিত্তিক জনসংখ্যাঃ

      লাখাই ঃ ২২,৫৫৮ জন।

      মুড়াকরি ঃ ২০,১৩৪ জন।

      মুড়িয়াউক ঃ ১৯,৪০৫ জন।

      বামৈ ঃ ২১,৮৪৪ জন।

      করাব ঃ ১৭,৯৮০ জন।

      বুল¬া ঃ ১৮,৭৫৬ জন।'
    - 'মালাজ খন্ড

      ভারতের ২০০১ সালের আদমশুমারি অনুসারে মালাজ খন্ড শহরের জনসংখ্যা হল ৩২,৩২৬ জন। এর মধ্যে পুরুষ ৫০%, এবং নারী ৫০%।'
    - 'মানালি, হিমাচল প্রদেশ

      প্রাচীনকালে এই উপত্যকায় বিক্ষিপ্ত ভাবে ''রাক্ষস'' নামে এক যাযাবর শিকারী সম্প্রদায়ের লোকের বাস ছিল. পরবর্তী কালে আগমন
      ঘটে কাংরা উপত্যকা থেকে আসা মেষপালকদের, এরা এখানে কৃষি কাজের জন্য বসতি স্থাপন করে. এ অঞ্চলের প্রাচীনতম বসবাসকারীদের অন্যতম
      ছিল ''নৌর'' অথবা ''নর'', কুলু উপত্যকায় এরা এক বিচিত্র প্রজাতি.এখনো অল্প কয়েক ঘর ''নর'' পরিবার এখানে বর্তমান. মানালির
      পশ্চিম তীরে হরিপুরের কাছে সোয়াল গ্রামে এক ''নৌর'' পরিবার ছিল. বস্তির জমির অধিকার বলে রাক্ষসদের শ্রমজীবী হিসেবে ব্যবহার
      করে বিখ্যাত হয়েছিল এই পরিবার.'
    - 'কাঠমান্ডু জেলা

      কাঠমান্ডু জেলা ( , (Nepal Bhasa: येँ जिल्ला) হচ্ছে নেপালের মধ্যমাঞ্চল বিকাস ক্ষেত্রের বাগমতী অঞ্চলের একটি জেলা। কাঠমান্ডু
      শহর হচ্ছে এই জেলার সদরদপ্তর এবং দেশের রাজধানী। এই জেলার আয়তন ।। ২০০১ সালের আদমশুমারি অনুসারে এ জেলার লোকসংখ্যা ১,০৮১,৮৪৫
      জন এবং ২০১১ সালের আদমশুমারি অনুসারে লোকসংখ্যা ১,৭৪৪,২৪০ জন।'
    - 'পিলানি

      ভারতের ২০০১ সালের আদমশুমারি অনুসারে পিলানি শহরের জনসংখ্যা হল ২৬,২১৯ জন। এর মধ্যে পুরুষ ৫২%, এবং নারী ৪৮%।'
    - 'মুন্দী

      ভারতের ২০০১ সালের আদমশুমারি অনুসারে মুন্দী শহরের জনসংখ্যা হল ১০,৬৬৭ জন। এর মধ্যে পুরুষ ৫২%, এবং নারী ৪৮%।'
    - 'মানালি, হিমাচল প্রদেশ

      ভারতের লোক গণনার হিসেবে মানালির জনসংখ্যা ছিল 6,265.তার শতকরা 64 জন পুরুষ আর শতকরা 36 জন মহিলা.মানালির গড় সাক্ষরতার
      হার শতকরা 74, জাতীয় গড় 59.5 এর বেশি. পুরুষ সাক্ষরতা শতকরা 80 আর মহিলা সাক্ষরতা শতকরা 63. মানালির জনসংখ্যার শতকরা 9
      ভাগ ছ''বছরের নিচে.'
    - 'মানালি, হিমাচল প্রদেশ

      1980-র শেষে কাশ্মিরে জঙ্গি তত্পরতা বেড়ে ওঠায় মানালিতে পর্যটন ফুলেফেপে ওঠে. অতীতের শান্ত এক গ্রাম আজকের তেল আর রেস্তর্যন্ট
      নিয়ে এক কলরব মুখর শহরে রুপান্তরিত হল.'
    - "থানে জেলা\nভারতীয় রাজ্য মহারাষ্ট্রের কোঙ্কণ বিভাগের একটি জেলা \"থানে\" ([])। ২০১১ সালের আদমশুমারি অনুযায়ী এটি দেশের\
      \ সবচেয়ে জনবহুল জেলা ছিল যার অধিবাসীর সংখ্যা ছিল ১১,০৬০,১৪৮ জন ; তবে ২০১৪ সালের আগস্ট মাসে নতুন পালঘর জেলা নির্মাণের\
      \ মাধ্যমে জেলাটি বিভক্ত হয়ে যায়। ২০১১ সালের আদমশুমারি অনুযায়ী পুনর্গঠিত থানে জেলার জনসংখ্যা ৮,০৭০,০৩২ জন। জেলার সদর\
      \ দপ্তর থানে। জেলার অন্যান্য প্রধান শহরগুলি নবি মুম্বাই, কল্যাণ-ডোম্বিভিলি, মিরা-ভৈঁদার, ভিওয়ান্ডি, উল্লাসনগর, অম্বরনাথ,\
      \ বদলাপুর, মুরবদ এবং শাহাপুর। এটি ভারতের সবচেয়ে শিল্পোন্নত জেলা। \nজেলাটি ১৮°৪২' এবং ২0°২0' উত্তর অক্ষাংশ এবং ৭২°৪৫\
      \ 'এবং ৭৩°৪৮' পূর্ব দ্রাঘিমাংশের মধ্যে অবস্থিত। জেলার সংশোধিত আয়তন ৪২১৪ বর্গকিমি। জেলাটি উত্তরপূর্বে নাশিক ও পুনে এবং\
      \ পূর্বদিকে আহমদনগর জেলা এবং উত্তর দিকে পালঘর জেলা দ্বারা সীমাবদ্ধ। আরব সাগর রয়েছে জেলার পশ্চিম সীমান্তে, দক্ষিণ পশ্চিমে\
      \ রয়েছে মুম্বাই সিটি ডিস্ট্রিক্ট এবং মুম্বাই সাবারবান জেলা এবং দক্ষিণে রয়েছে রায়গড় জেলা।"
    - 'আম্বালা

      ভারতের ২০০১ সালের আদম শুমারি অনুসারে আম্বালা শহরের জনসংখ্যা হল ১৩৯,২২২ জন। এর মধ্যে পুরুষ ৫৩%, এবং নারী ৪৭%।'
