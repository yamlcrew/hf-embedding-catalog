      এবং এর পার্শ্ববর্তী জেলার বিমান পরিষেবা পরিবেশন করছে। বিমানবন্দরটি মাদুরাই রেলওয়ে স্টেশন থেকে প্রায় ১২ কিলোমিটার (৭.৫
