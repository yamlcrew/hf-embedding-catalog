      ওঠা-নামার সংখ্যায় তৃতীয় ব্যস্ততম বিমানবন্দর। মাদুরাই বিমানবন্দর ২০১৭ সালের এপ্রিল মাসে মোট যাত্রী পরিবহন করে ১,২০,৫৫৪
