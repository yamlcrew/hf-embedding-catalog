    ঘনত্ব হল । ২০০১-২০১১ সালের মধ্যে জেলাটির জনসংখ্যা বৃদ্ধির হার ছিল ১৫ শতাংশ। লুধিয়ানা জেলার লিঙ্গ অনুপাত হল ১,০০০ জন পুরুষ
    প্রতি ৮৭৩ জন নারী এবং শিক্ষার হার ৮২.২ শতাংশ। জেলার শ্রমিকদের সংখ্যা ১২.৮৫ লাখ, যার অর্থ জেলার মোট জনসংখ্যার ৩৬.৭ শতাংশ
    মানুষ কর্মক্ষম অংশগ্রহণ। জেলার মোট কর্মী বাহিনীর মধ্যে, ১৮.৭% কৃষি খাতে নিযুক্ত, ৫.৬% গৃহস্থালি শিল্পে কাজ করছে এবং বাকি
    অন্যান্য খাতে/শিল্পে নিয়োজিত রয়েছে।'
