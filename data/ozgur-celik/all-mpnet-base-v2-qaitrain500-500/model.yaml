  - source_sentence: What type of implant is recommended for a narrow-diameter implant case according to the Esthetic Risk
      Assessment?
    sentences:
    - '# Treatment guidelines


      Esthetic outcomes can be achieved at post-extraction

      sites irrespective of the timing of implant placement.

      Different placement times, however, present with spe-

      cific treatment challenges and variable predictability of

      esthetic outcomes.

      With immediate placement, a high level of clinical com-

      petence and experience in performing the treatment is

      needed. Careful case selection is required to achieve sat-

      isfactory esthetic outcomes. The following clinical condi-

      tions should be satisfied:'
    - "# 8.1.5\nEsthetic Failure Due to\nImplants and Third-party\nImplant Components Lacking\nScientific Validation\n\nClinicians\
      \ are cautioned to purchase implants from\nmanufacturers who follow good manufacturing prac-\ntices in keeping with\
      \ International Organization for\nStandardization (ISO) or US Food and Drug Administration \n(FDA) standards. Defects\
      \ in raw materials and in the man-\nufacturing process may certainly manifest themselves, so\nclinicians should be diligent\
      \ in maintaining records of\nproduct lot numbers and patients records to ensure an\nappropriate response (Figs 9a-d;\
      \ Dr. V. Chappuis)."
    - "# Introductory remarks\n\nFrom these three systematic reviews, a general obser-\nvation was made that the available\
      \ data on esthetic\noutcomes were predominantly represented by case\nseries studies. Relatively few randomized controlled\n\
      trials (RCTs) and cohort studies were identified, and a\nminority of these was judged to be at low risk of bias.\nNevertheless,\
      \ the case series studies provided invaluable\ninformation in establishing the current clinical trends in\ntechniques\
      \ and materials related to esthetic outcomes.\nIndeed, well-designed prospective case series studies of\nconsecutively\
      \ enrolled subjects with clearly defined in-\nclusion and exclusion criteria can provide important in-\nformation to\
      \ validate clinical procedures and materials.\nThe group recognized that RCTs are not always feasible\nor ethical when\
      \ clinical conditions that are known to in-\ncrease the risk of adverse esthetic outcomes are under\ninvestigation.\
      \ Implant treatment in the esthetic zone is\na challenging procedure and classified as advanced or\ncomplex according\
      \ to the SAC classification (Dawson and\ncoworkers 2009). Most patients present with multiple es-\nthetic risk factors\
      \ and often have high expectations. If\nesthetic complications occur, they are usually difficult or \nimpossible to\
      \ manage. As a consequence, the prevention \nof esthetic complications should be a primary objective.\nTherefore, a\
      \ conservative treatment approach is recom-\nmended to facilitate successful outcomes with high pre-\ndictability and\
      \ a low risk of complications."
    - 'Fig 14-10  Esthetic failure due

      to too deep an implant placement.'
    - '# Table 1    Esthetic Risk Assessment (ERA)


      * If three-dimensional imaging is available with the tooth in place

      1 Standard-diameter implant, regular connection

      * If three-dimensional imaging is available with the tooth in place

      1 Standard-diameter implant, regular connection

      2 Narrow-diameter implant, narrow connection

      2 Narrow-diameter implant, narrow connection'
