widgetData:
- source_sentence: Muntii Himalaya s-au format ca rezultat al
  sentences:
  - Formarea Munților Himalaya. Munții Himalaya sunt o formațiune muntoasă destul de tânără de pe suprafața Pământului și,
    remarcabil, găzduiesc cel mai înalt vârf din lume. Lanțul muntos se întinde pe o distanță de 2500 de kilometri și cuprinde
    creste și plieri comparabile.
  - 'Continentale/Continental: Munții Himalaya și Platoul Tibetan s-au format ca rezultat al coliziunii dintre Placa Indiană
    și Placa Eurasiatică, care a început acum 50 de milioane de ani și continuă până în ziua de azi.'
  - 'Pentru a face o cutie de cadou origami: începeți cu o foaie de hârtie pătrată perfectă, cu partea modelată sau colorată
    în jos și folosiți imaginile și instrucțiunile de origami de mai jos ca ghid pentru pliu și împăturire.'
- source_sentence: În ce comitat se află Pasadena, Maryland?
  sentences:
  - Pentru alte utilizări, vedeți Pasadena (dezambiguizare). Pasadena /Ë touchdown / este un oraș în comitatul Los Angeles,
    California, Statele Unite ale Americii. Începând cu 2013, populația estimată a orașului Pasadena era de 139.731 de locuitori,
    ceea ce îl face al 183-lea oraș al Statelor Unite ca mărime. Pasadena este al nouălea oraș al comitatului Los Angeles
    ca mărime.
  - Din nou, un cavalletti nu este un salt, așa că ar trebui ca calul tău să poată să sară peste fiecare dintre ele cu un
    pas de canter normal. Distanța dintre cele două cavalletti va depinde în mare parte de cât de mare este calul tău; pentru
    un cal cu un pas obișnuit, distanța ar trebui să fie de 10 sau 11 picioare. Un judecător de vânătoare și un antrenor de
    călărie explică cum să obții distanța corectă când îți antrenezi calul să sară.
  - Pasadena, Maryland. Pasadena este o așezare desemnată de recensământ (CDP) în comitatul Anne Arundel, Maryland, Statele
    Unite ale Americii. Conform recensământului din 2010, populația era de 24.287 de locuitori. Zonele Lake Shore, Riviera
    Beach și Pasadena sunt denumite colectiv Pasadena de către localnici.
- source_sentence: Contine Mayo produse lactate?
  sentences:
  - Poate dura până la 12 zile până când puteți vedea efectul complet al tratamentului cu Dysport. Mușchii dumneavoastră și
    cantitatea de Dysport folosită vor determina cât de mult vor dura rezultatele și media este de 2 până la 4 luni.
  - Lăsați un comentariu. Maioneza nu este considerată un produs lactat, deși conține ouă pasteurizate și ulei. Cei care se
    consideră vegani ar fi bine să evite maioneza, deoarece conține ouă, care sunt de fapt un produs secundar de origine animală.
  - Produsele LACTAIDÂ® conțin lactază, o enzimă naturală care ajută la descompunerea lactozei (zahărul din alimentele lactate,
    precum laptele, înghețata sau brânza) în doi zaharuri simpli (galactoză și glucoză), ușor de digerat. Dacă nu este digerată
    corespunzător, lactoza poate cauza gaze, balonare, crampe și/sau diaree.
- source_sentence: Ce înseamnă că codul genetic este considerat a fi universal?
  sentences:
  - Voturile de încredere sunt 251. Codul genetic reprezintă o corespondență între cordonii (trei baze de ADN într-un exon)
    și aminoacizii. Există 20 de aminoacizi diferiți și 64 de cordonii posibili. Codul genetic universal reprezintă o corespondență
    specifică, folosită de majoritatea organismelor de pe Pământ. Aceasta indică o singură origine a vieții. Caracterul universal
    al codului genetic înseamnă că toate ființele vii descind dintr-un organism original, ceea ce reprezintă o informație
    cel puțin utilă. Din punct de vedere religios, s-ar putea spune că zeul creator a proiectat un cod genetic reușit și a
    ales să-l folosească la nivel universal.
  - 'A se va asocia întotdeauna cu T (U în ARN), iar G se va asocia întotdeauna cu C. Acest cod determină tipul de aminoacizi
    și ordinea în care aceștia sunt asociați pentru a forma o anumită proteină. Secvența aminoacizilor dintr-o proteină determină
    structura și funcția acesteia. Codul ADN este un cod triplu [cod triplu: codul genetic format dintr-un trio de baze în
    lanțurile de ADN: AAA; GCT; CAT etc].'
  - Soberlink. Stilurile de viață active din ziua de azi necesită soluții portabile. Soberlink SL2 este un dispozitiv inovator,
    portabil, de testare celulară pentru monitorizarea sigură a alcoolului în timp real. Acest dispozitiv compact transmite
    rezultatele testelor de respirație și încălcările clienților în timp real, făcându-l mai eficient și mai performant decât
    alte dispozitive de pe piață. Soberlink face o fotografie a participanților în timpul testelor de respirație pentru a
    verifica identitatea. Rezultatul BAC, fotografia în timp real și locația GPS sunt transmise instant de pe dispozitiv către
    un portal web securizat, unde sunt revizuite de către supraveghetor. Acest dispozitiv compact transmite rezultatele testelor
    de respirație și încălcările clienților în timp real, făcându-l mai eficient și mai performant decât alte dispozitive
    de pe piață. Soberlink face o fotografie a participanților în timpul testelor de respirație pentru a verifica identitatea.
- source_sentence: Cine a fost John Andre?
  sentences:
  - Cazul unui faimos trădător american văzut de către handlerul său. JOHN ANDRE, OFITER DE CAZ. Robert Amory, Jr. În mai
    1779, cu doi ani și jumătate înainte de victoria decisivă de la Yorktown, cauza continentală era într-o stare precară.
  - "2011-04-01T14:07:00Z 2011-04-01T16:49:02Z Spitalul Memorial din Belleville plănuiește să construiască un nou spital pe\
    \ Strada Shiloh, potrivit site-ului stltoday.com. 01 aprilie 2011, ora 14:07 â\x80¢. Încărcareâ€¦ Oficialii spitalului\
    \ au anunțat vineri că Spitalul Memorial din Belleville plănuiește să construiască un nou spital în Shiloh, în valoare\
    \ de 118 milioane de dolari. Planurile pentru Spitalul Memorial-Est includ 94 de paturi, camere private pentru pacienți,\
    \ săli de operație, un laborator de cateterizare cardiacă, o unitate de terapie intensivă și o unitate de obstetrică."
  - Andre Meadows (născut pe 25 octombrie 1978), este un YouTuber cunoscut mai ales pentru vlogurile, diatribele, recenziile
    și comediile sale despre orice are legătură cu nostalgia, cum ar fi jocurile video sau filmele clasice. S-a alăturat platformei
    YouTube pe 10 iulie 2007. Intros video. Meadows are multe introduceri video. Toate sunt folosite în funcție de subiectul
    videoclipului. Bună, eu sunt Andre și sunt un Nerd de culoare! - Introducerea lui neutră. Bună, eu sunt Andre și sunt
    un Nerd de culoare și sunt furios! AAAAGGGGGGHHHHH! Diatribele unui Nerd de culoare! - Introducerea lui pentru videoclipurile
    de diatribă. Bună, eu sunt Andre și sunt un Nerd de culoare cu o recenzie pentru TINE! Recenzile unui Nerd de culoare!
    - Introducerea lui pentru videoclipurile de recenzie. Bună, eu sunt Andre și sunt un Nerd de culoare cu o altă recenzie
    pentru Teenage Mutant Ninja Turtles!
