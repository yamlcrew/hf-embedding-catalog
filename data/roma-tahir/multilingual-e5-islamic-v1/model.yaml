- source_sentence: کیا جانوروں پر رحم کرنے کا اجر ملتا ہے؟
  sentences:
  - They request from you a [legal] ruling. Say, "Allah gives you a ruling concerning one having neither descendants nor ascendants
    [as heirs]." If a man dies, leaving no child but [only] a sister, she will have half of what he left. And he inherits
    from her if she [dies and] has no child. But if there are two sisters [or more], they will have two-thirds of what he
    left. If there are both brothers and sisters, the male will have the share of two females. Allah makes clear to you [His
    law], lest you go astray. And Allah is Knowing of all things.
  - Have the disbelievers [not] been rewarded [this Day] for what they used to do?
  - Narrated Abu Huraira:Allah's Messenger (ﷺ) said, "While a man was walking he felt thirsty and went down a well and drank
    water from it. On coming out of it, he saw a dog panting and eating mud because of excessive thirst. The man said, 'This
    (dog) is suffering from the same problem as that of mine. So he (went down the well), filled his shoe with water, caught
    hold of it with his teeth and climbed up and watered the dog. Allah thanked him for his (good) deed and forgave him."
    The people asked, "O Allah's Messenger (ﷺ)! Is there a reward for us in serving (the) animals?" He replied, "Yes, there
    is a reward for serving any animate
- source_sentence: اسلام کے پانچ ارکان کیا ہیں؟
  sentences:
  - 'Narrated Ibn ''Umar: Allah''s Messenger (ﷺ) said: Islam is based on (the following) five (principles): 1. To testify
    that none has the right to be worshipped but Allah and Muhammad is Allah''s Messenger (ﷺ). 2. To offer the (compulsory
    congregational) prayers dutifully and perfectly. 3. To pay Zakat (i.e. obligatory charity) . 4. To perform Hajj. (i.e.
    Pilgrimage to Mecca) 5. To observe fast during the month of Ramadan'
  - There shall be no compulsion in [acceptance of] the religion. The right course has become clear from the wrong. So whoever
    disbelieves in Taghut and believes in Allah has grasped the most trustworthy handhold with no break in it. And Allah is
    Hearing and Knowing.
  - أَلَيْسَ ٱللَّهُ بِأَحْكَمِ ٱلْحَٰكِمِينَ
- source_sentence: سورۃ الفلق کی تفسیر کیا ہے؟
  sentences:
  - '## Which was revealed in Makkah ## The Position of Ibn Mas`ud concerning Al-Mu`awwidhatayn Imam Ahmad recorded from Zirr
    bin Hubaysh that Ubayy bin Ka`b told him that Ibn Mas`ud did not record the Mu`awwidhatayn in his Mushaf (copy of the
    Qur''an). So Ubayy said, "I testify that the Messenger of Allah ﷺ informed me that Jibril said to him, قُلْ أَعُوذُ بِرَبِّ
    الْفَلَقِ (Say: "I seek refuge with the Lord of Al-Falaq.")(113:1) So he said it. And Jibril said to him, قُلْ أَعُوذُ
    بِرَبِّ النَّاسِ (Say: "I seek refuge with the Lord of mankind.") (114:1) So he said it. Therefore, we say what the Prophet
    said." ## The Virtues of Surahs Al-Falaq and An-Nas In his Sahih, Muslim recorded on the authority of `Uqbah bin `Amir
    that the Messenger of Allah ﷺ said, «أَلَمْ تَرَ آيَاتٍ أُنْزِلَتْ هَذِهِ اللَّيْلَةَ لَمْ يُرَ مِثْلُهُنَّ قَطُّ:'
  - فَلْيَنظُرِ ٱلْإِنسَٰنُ مِمَّ خُلِقَ
  - 'Narrated Abu Huraira: Allah''s Messenger (ﷺ) deputed me to keep Sadaqat (al-Fitr) of Ramadan. A comer came and started
    taking handfuls of the foodstuff (of the Sadaqa) (stealthily). I took hold of him and said, "By Allah, I will take you
    to Allah''s Messenger (ﷺ) ." He said, "I am needy and have many dependents, and I am in great need." I released him, and
    in the morning Allah''s Messenger (ﷺ) asked me, "What did your prisoner do yesterday?" I said, "O Allah''s Messenger (ﷺ)!
    The person complained of being needy and of having many dependents, so, I pitied him and let him go." Allah''s Messenger
    (ﷺ) said, "Indeed, he told you a lie and he will be coming again." I believed that he would show up again as Allah''s
    Messenger (ﷺ) had told me that he would return. So, I waited for him watchfully.'
- source_sentence: قرآن شراب اور جوئے کے بارے میں کیا کہتا ہے؟
  sentences:
  - عَنِ الْخَيْرِ، وَكُنْتُ أَسْأَلُهُ عَنِ الشَّرِّ، مَخَافَةَ أَنْ يُدْرِكَنِي فَقُلْتُ يَا رَسُولَ اللَّهِ إِنَّا كُنَّا
    فِي جَاهِلِيَّةٍ وَشَرٍّ فَجَاءَنَا اللَّهُ بِهَذَا الْخَيْرِ، فَهَلْ بَعْدَ هَذَا الْخَيْرِ مِنْ شَرٍّ قَالَ ‏"‏ نَعَمْ
    ‏"‏‏.‏ قُلْتُ وَهَلْ بَعْدَ ذَلِكَ الشَّرِّ مِنْ خَيْرٍ قَالَ ‏"‏ نَعَمْ، وَفِيهِ دَخَنٌ ‏"‏‏.‏ قُلْتُ وَمَا دَخَنُهُ
    قَالَ ‏"‏ قَوْمٌ
  - Narrated Ibn `Umar:The Prophet (ﷺ) recited Talbiya when he had mounted his Mount and was ready to set out
  - O you who have believed, indeed, intoxicants, gambling, [sacrificing on] stone alters [to other than Allah], and divining
    arrows are but defilement from the work of Satan, so avoid it that you may be successful.
