      원고의 손을 들어주었습니다. 그러자 피고는 항소했지만, 항소심 법원 역시 1심과 동일한 이유로 피고의 주장을 배척하였습니다. 특히, 농약관리법 제14조 제1항에 의해 이미 존재하던 규정에 기초하여 처분을 내린
