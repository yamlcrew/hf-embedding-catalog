    ◦ 중소기업청(청장 한정화)은 법무부 산하의 전국 10개 소년원 중 창업에 대해 남다른 관심을 가지고 있는 대구, 광주, 청주, 제주 등 4개 소년원과 함께 ‘청소년 희망씨앗 나눔 비즈쿨 캠프’를 개최한다고 밝혔다.'
  - 주식회사 A는 농촌진흥청장의 농약 수입업 영업정지 6개월 처분에 대해 취소를 구하는 소송을 제기했습니다. 1심 법원은 해당 처분이 농약관리법 신설 규정을 위반하여 내려진 것이 아니며, 처분이 위법하다고 판단하여
    원고의 손을 들어주었습니다. 그러자 피고는 항소했지만, 항소심 법원 역시 1심과 동일한 이유로 피고의 주장을 배척하였습니다. 특히, 농약관리법 제14조 제1항에 의해 이미 존재하던 규정에 기초하여 처분을 내린 것이며,
    원고가 품목 등록이 취소된 농약을 보관한 행위에 대해 신설 규정을 적용한 것은 소급적용이 아니라는 점이 강조되었습니다. 양형의 이유는 처분기준보다 경미한 처분이 이루어졌으며, 원고의 보관 행위는 경제적 피해 최소화를
    위한 것으로 판단되었습니다. 결론적으로, 법원은 처분이 재량권을 일탈·남용하여 위법하다는 이유로 이를 취소하고 피고의 항소를 기각하였습니다. 따라서 피고는 항소비용을 부담하게 됩니다.
