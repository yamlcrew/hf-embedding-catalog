      피해 최소화를 위한 것으로 판단되었습니다. 결론적으로, 법원은 처분이 재량권을 일탈·남용하여 위법하다는 이유로 이를 취소하고 피고의 항소를 기각하였습니다. 따라서 피고는 항소비용을 부담하게 됩니다.
