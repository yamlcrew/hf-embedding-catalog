  - '노후 교량구조물, 내진성능 보강기술로 수명연장 -교량 내진관련 특허출원, 내진성능 보강기술이 81% -

    최근까지 총 556회의 여진을 동반한 2016.9.12. 경주지진이후, 지진으로 인한 인명과 재산에 막중한 피해를 줄 수 있는 노후 교량구조물에 대한 내진성능 확보에 대한 관심이 매우 높아지고 있다.

    특허청(청장 최동규)에 따르면, 교량구조물 내진관련기술 특허출원건수는 2006년~2010년 335건에서 2011년~2015년 최근 5년간 448건으로 34% 증가하였으며, 노후 교량구조물에 대한 내진성능 보강기술이
    전체 특허출원건수 중 81%를 차지하는 것으로 나타났다.

    교량의 내진성능 보강기술은 교량 받침 또는 신축이음의 파괴로 인한 교량 상판의 낙교를 방지하기 위한 낙교방지시스템, 지진 발생시 교량의 상·하부를 분리시켜 지진으로 유발된 교량상부의 수평관성지진력을 분산, 감소,
    격리시키는 지진격리시스템, 교각 및 기초의 강도를 증가시키기 위한 단면 확대, 섬유래핑보강, 또는 강판보강을 하는 강도증진시스템으로 나눌 수 있다.

    내진성능 보강기술 측면에서 지진격리시스템이 특허출원의 60%를 차지하고 있으며, 내진설계기준 변천의 영향으로 2005년 이후 지진격리시스템의 특허출원이 지속적으로 증가하는 것으로 파악되었다.'
