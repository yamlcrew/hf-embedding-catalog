  sentences:
  - '대구염색산단 주변지역 주민건강영향조사 결과

    □ 환경부 국립환경과학원(원장 ***)은 2013년도 대구시 염색산단과 대구 3공단(이하, 산단) 주변지역 주민건강영향조사 결과를 발표했다.

    □ 이 조사는 2013년 4월 18일부터 12월 10일까지 대구시 서구 비산동 및 평리동 등 산단 주변 17개동(이하, 주변지역)※과 비교를 위한 시내 주거지역인 수성구 13개동(이하, 비교지역)을 대상으로 실시됐다.

    ※ 노출영향권은 대기정책지원시스템(CAPPS)의 PM10, NO2, 톨루엔 배출량자료를 이용하여 CALPUFF 모델링 결과를 통해 선정

    □ 조사내용은 산단에서 많이 사용·배출되는 물질의 대기오염 및 인체 노출수준과 주민들의 건강상태 등으로 주요결과는 다음과 같다.

    ○ 산단 주변지역 2개(서구 상중이동, 북구 노원동) 대기오염측정소에서의 2008년에서 2012년까지의 미세먼지(PM10) 평균농도는 62.5㎍/㎥로 연평균 기준치인 50㎍/㎥을 초과하였고, 이산화질소(NO2)도
    연간 기준치 0.03ppm을 초과하는 경우가 일부 있었다

    ○ 산단에서 많이 사용·배출되는 물질은 톨루엔, 디메틸포름아미드(DMF), 클로로폼 등이었으며, 주변지역에서 수동식 공기채취기※를 이용하여 측정한 이들 물질의 대기오염 및 개인노출수준은 산단주변지역이 비교지역보다
    높게 나타났다.

    ※ 수동식 공기채취에 의한 농도의 경우, 채취기에 흡수된 오염물질량을 유입공기추정량으로 나누어 산출된 추정농도

    - 주택 실외에서 여름철의 톨루엔, DMF, 클로로폼의 농도는 산단 주변지역에서 각각 73.6, 23.2, 10.8㎍/㎥으로 비교지역의 11.4, 4.8, 5.8㎍/㎥ 보다 높았으며, DMF의 경우, 산단과 인접한
    비산 6·7동, 평리 6동에서 높았다.'
